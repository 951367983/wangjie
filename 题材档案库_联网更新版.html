", "search": "MLCC 多层陶瓷电容器 高端缺货 华强北 爆单 拿不到货 现货最高涨10倍 村田 太阳诱电 三星电机 涨价函 15%-35% AI服务器 高容量 交期15-20周 结构性缺货 三环集团 风华高科 国瓷材料 洁美科技 电子大米 消费级回落", "card": "<a class=\"card-c\" href=\"#mlcc-ai-shortage\" data-search=\"MLCC 多层陶瓷电容器 高端缺货 华强北 爆单 拿不到货 现货最高涨10倍 村田 太阳诱电 三星电机 涨价函 15%-35% AI服务器 高容量 交期15-20周 结构性缺货 三环集团 风华高科 国瓷材料 洁美科技 电子大米 消费级回落\" data-grade=\"正式档\" data-pricing=\"未定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-23</span>\n    <span class=\"crate bolt\">⚡ 涨价实锤级 · 华强北 MLCC 爆单、现货最高涨 10 倍，AI 高容缺货结构性涨价，A 股链刚启动 产业周期</span>\n  </div>\n  <div class=\"ctitle\">MLCC 高端缺货 · 华强北爆单复制存储行情</div>\n  <div class=\"csub\">9/23 华强北 MLCC 商家爆单「拿不到货」· 现货最高涨 10 倍 · 村田/太阳诱电/三星电机 AI 高容涨价 15-35% · 交期 15-20 周 · 9/23 MLCC 概念 +1.40%、主力净流入 8.50 亿</div>\n  <div class=\"cpos\">AI 服务器/光模块升级推升高容 MLCC 用量与规格，原厂涨价函 15-35%、现货炒至 10 倍；与存储行情同源（AI 算力硬件缺货），A 股 MLCC 链刚启动、龙头未涨停。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">产业周期</span>\n    <span class=\"chip pri\">未定价</span>\n    <span class=\"chip\">标的 6</span>\n    <span class=\"nm\">风华高科</span><span class=\"nm\">三环集团</span><span class=\"nm\">国瓷材料</span><span class=\"nm\">洁美科技</span><span class=\"nm\">火炬电子</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-23 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 产业周期 · 2026-09-23</div>\n    <h1>MLCC 高端缺货 · 华强北爆单复制存储行情</h1>\n    <div class=\"sub\">9/23 华强北 MLCC 商家爆单「拿不到货」· 现货最高涨 10 倍 · 村田/太阳诱电/三星电机 AI 高容涨价 15-35% · 交期 15-20 周 · 9/23 MLCC 概念 +1.40%、主力净流入 8.50 亿</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 涨价实锤级 · 华强北爆单、现货最高涨 10 倍 产业周期</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：未定价</span>\n      <span class=\"badge neutral\">主线：AI算力与电力配套</span>\n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--acc)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">agent-cpu-rerating</span><span class=\"tag\" style=\"margin-right:4px\">pcb-ccl-hike</span><span class=\"tag\" style=\"margin-right:4px\">intel-cpu-price-hike</span></div>\n    <div class=\"posnote\">9/23 证券时报实探：深圳华强电子世界 MLCC 商家<strong>「爆单了」「现在主要是拿不到货」</strong>——原厂需求太旺盛，多数直接签了长协或给了代理商，现货市场无货可报；<strong>AI 类、高端 MLCC 价格波动大、缺货严重</strong>。本轮涨价由海外龙头点燃：村田、太阳诱电、三星电机相继发涨价函，<strong>AI 服务器所用高容量 MLCC 原厂涨幅普遍 15-35%</strong>；现货市场进入「一天一价、甚至一小时一价」状态，部分热门型号一个月涨幅 7-8 倍、现货最高被炒至原价 2-10 倍，高容 MLCC 5 月以来报价翻倍、交期 15-20 周。</div>\n    <details class=\"more\"><summary>展开定价状态详版（240 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化为<strong>AI 结构性缺货 + 原厂涨价函</strong>：AI 服务器/工作站/高速光模块升级推高 MLCC 用量与规格（高容、高可靠、小型化），形成「AI 高容缺货、消费级回落」的双轨行情（中电网 9/21 口径）；村田拟将 AI 服务器高阶 MLCC 产能 2028 财年扩两成。盘面：9/23 <strong>MLCC 概念 +1.40%、主力净流入 8.50 亿</strong>，风华高科 +1.71%、三环/国瓷温和上涨——<strong>龙头未涨停、刚启动</strong>，属<strong>未定价</strong>（价格端已实锤、权益端待发酵）。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">华强北实探</b><div class=\"v\">9/23 证券时报/新浪实探华强电子世界：多家商家表示<strong>「爆单了」「拿不到货」</strong>——原厂需求太旺盛、多数签长协，现货无货可报、期货也报不出交期；<strong>AI 类、高端 MLCC 价格波动大、缺货严重</strong>（主营信昌、华新科等品牌的商家口径）。</div></div><div class=\"card fact\"><b class=\"k\">涨价幅度</b><div class=\"v\"><strong>原厂</strong>：村田、太阳诱电、三星电机相继发涨价函，AI 服务器高容量 MLCC <strong>涨幅 15-35%</strong>；<strong>现货</strong>：进入「一天一价甚至一小时一价」状态，部分热门型号<strong>一个月涨 7-8 倍、最高被炒至原价 2-10 倍</strong>；高容 MLCC 5 月以来报价<strong>翻倍</strong>、交期延长至 <strong>15-20 周</strong>（上海证券报 6/16 实探：村田 47μF 高容现货报价 60 余元）。</div></div><div class=\"card fact warn\"><b class=\"k\">结构性双轨</b><div class=\"v\">MLCC 市场形成两条截然不同的行情：<strong>AI 服务器/工作站/高速光模块</strong>所需高容、高可靠、小型化 MLCC 真实缺货涨价；<strong>消费级 MLCC</strong> 价格从暴涨回归理性（有型号从 30 元回落至 10 元，中电网 9/21）——本轮核心是 AI 产业崛起带来的<strong>结构性缺货</strong>，并非全面供需失衡。</div></div><div class=\"card fact\"><b class=\"k\">盘面与格局</b><div class=\"v\">9/23 <strong>MLCC 概念 +1.40%</strong>、主力净流入 <strong>8.50 亿</strong>：国瓷材料 +4.23%（净流入 4711 万）、东材科技 +5.38%、<strong>风华高科 +1.71%</strong>（58.74 元、净流入 1.16 亿）、凯盛科技跟涨；双星新材 3 连板（9/22）。格局：2024 年按金额<strong>村田 31.8%、三星电机 22.9%</strong>，前五合计 77.3% 全为日韩；<strong>中国大陆三环约 2.5%、风华约 1.9%</strong>——国产替代空间大、弹性标的稀缺。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-05 底</div><div><div class=\"x\">AI 算力需求爆发传导至 MLCC，现货行情开始发酵；村田、太阳诱电、三星电机发涨价函（AI 高容 +15-35%）。</div><div class=\"y\">为什么：海外龙头点燃本轮 AI 高容涨价。</div></div></div><div class=\"u\"><div class=\"w\">2026-06 至 09 上旬</div><div><div class=\"x\">现货进入「一天一价、一小时一价」，高容 5 月以来翻倍、部分型号月涨 7-8 倍；上海证券报 6/16 实探确认缺货。</div><div class=\"y\">为什么：现货市场把原厂涨价放大 10 倍级波动。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-23</div><div><div class=\"x\">证券时报实探华强北「爆单、拿不到货」；MLCC 概念 +1.40%、主力净流入 8.50 亿；双星新材 3 连板。</div><div class=\"y\">为什么：本档案成立点——官媒实探确认缺货实锤，A 股链资金开始进场。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「AI 结构性缺货→原厂涨价→国产替代」的涨价题材，<strong>三个要害</strong>：一是<strong>缺货是真的但结构分化</strong>——AI 服务器/光模块升级推高 MLCC 用量与规格（高容、高可靠、小型化），高容现货 10 倍、交期 15-20 周是真实供需缺口，但消费级已回落，「复制存储暴涨神话」只适用于 AI 料号；二是<strong>国产链处于「份额低、弹性待启」位置</strong>——村田 31.8%+三星 22.9% 寡头垄断，大陆三环 2.5%、风华 1.9%，涨价周期中国产 MLCC（风华/三环）量价齐升+份额提升双逻辑，且历史上 MLCC 涨价是国产替代加速器；三是<strong>盘面刚启动、定价未充分</strong>——9/23 概念 +1.40%、龙头风华 +1.71% 未涨停，与 PCB（涨停 7 家）形成鲜明对比——「商品先行、权益未跟」，若华强北缺货消息持续发酵，存在补涨空间。<strong>隐藏面</strong>：现货 10 倍涨幅含渠道炒作成分（媒体也提示「真缺货还是渠道在炒」），原厂涨价 15-35% 才是基本面锚；消费级回落说明需求并非全面回暖；大陆厂商高端料号占比仍低，业绩弹性取决于高容产品放量。<br>① <strong>分水岭时点</strong>：村田产能扩张落地节奏（2028 财年扩两成）与 A 股龙头放量确认。<br>② <strong>传导的关键约束</strong>：大陆厂商高端 AI 料号的实际订单（能否吃下缺货转移）。<br>③ <strong>待验证的核心变量</strong>：风华/三环涨价传导到报表的幅度；MLCC 概念能否从 +1.4% 走向涨停潮。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>华强北爆单、AI 高容现货最高涨 10 倍</li><li>原厂涨价函 15-35%、交期 15-20 周</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强但结构分化</span><ul><li>AI 高容缺货 vs 消费级回落</li><li>大陆厂商份额低、涨价受益待兑现</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">待高容放量</span><ul><li>涨价向大陆厂商传导需时间</li><li>村田扩产 2028 财年才落地</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">刚启动·未定价</span><ul><li>9/23 概念 +1.40%、龙头未涨停</li><li>与 PCB 涨停潮形成对比</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强但结构分化、业绩待高容放量、股价刚启动——「商品先行、权益未跟」，是 AI 硬件链里定价最不充分的涨价题材。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>50%</strong>：价格环（缺货/涨价）与情绪环（概念启动）闭合，业绩环（高容放量）与持续性环（真缺货 vs 炒作）待验证。</li><li><strong>边界要切开</strong>：第一梯队是<strong>国产 MLCC 龙头</strong>（风华高科、三环集团——直接受益涨价+国产替代）；第二梯队是<strong>上游材料与配套</strong>（国瓷材料——MLCC 粉体；洁美科技——载带；火炬电子——陶瓷电容）；第三梯队是<strong>题材弹性</strong>（东材科技、凯盛科技、双星新材等，注意区分纯概念）。</li><li><strong>主线联动</strong>：与 agent-cpu-rerating（9/22）、pcb-ccl-hike（9/23）、intel-cpu-price-hike 同属 AI 算力硬件缺货链——本档是「被动元件」段，与存储涨价逻辑同源。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·国产 MLCC 龙头 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>风华高科</b><span class=\"code\">000636</span><span class=\"tag\">国内MLCC龙头</span><span class=\"cap\">9/23 +1.71% 报 58.74 元 市值 674 亿</span></div>\n    <div class=\"logic\">MLCC+片阻龙头</div>\n    <div class=\"detail\">国内 MLCC 龙头，全球份额约 1.9%；9/23 主力净流入 1.16 亿、融资客下半年净买入 3.70 亿，涨价周期直接受益标的。</div>\n    <div class=\"risk\">⚠️ 高端料号占比仍低，业绩弹性看高容放量</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>三环集团</b><span class=\"code\">300408</span><span class=\"tag\">MLCC+陶瓷基板</span><span class=\"cap\">9/23 温和上涨</span></div>\n    <div class=\"logic\">MLCC+电子陶瓷平台</div>\n    <div class=\"detail\">全球份额约 2.5%，MLCC+陶瓷封装基板双主业，AI 高容缺货+先进封装双逻辑。</div>\n    <div class=\"risk\">⚠️ 弹性相对风华更温和</div>\n  </div><div class=\"card\">\n    <div class=\"row\"><b>国瓷材料</b><span class=\"code\">300285</span><span class=\"tag\">MLCC粉体材料</span><span class=\"cap\">9/23 +4.23% 主力净流入 4711 万</span></div>\n    <div class=\"logic\">MLCC上游粉体</div>\n    <div class=\"detail\">MLCC 陶瓷粉体核心供应商，上游材料涨价直接受益，9/23 领涨 MLCC 概念。</div>\n    <div class=\"risk\">⚠️ 粉体价格弹性低于成品端</div>\n  </div></div><div class=\"t\">🧬 观察·配套与弹性 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>洁美科技</b><span class=\"code\">002859</span><span class=\"tag\">MLCC载带配套</span><span class=\"cap\">9/23 随板块</span></div>\n    <div class=\"logic\">载带+离型膜</div>\n    <div class=\"detail\">MLCC 载带/离型膜供应商，下游 MLCC 扩产直接拉动耗材需求，涨价周期量升逻辑。</div>\n    <div class=\"risk\">⚠️ 耗材属性，弹性中等</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>火炬电子</b><span class=\"code\">603678</span><span class=\"tag\">陶瓷电容</span><span class=\"cap\">9/23 随板块</span></div>\n    <div class=\"logic\">陶瓷电容+军工</div>\n    <div class=\"detail\">陶瓷电容供应商，民品 MLCC 涨价+军品需求双属性。</div>\n    <div class=\"risk\">⚠️ 军品占比影响涨价弹性</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>东材科技</b><span class=\"code\">601208</span><span class=\"tag\">电子材料</span><span class=\"cap\">9/23 +5.38%</span></div>\n    <div class=\"logic\">电子材料平台</div>\n    <div class=\"detail\">电子材料供应商，9/23 领涨 MLCC 概念（净流入 3977 万），题材弹性品种。</div>\n    <div class=\"risk\">⚠️ 与 MLCC 业务关联度需甄别</div>\n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">每日</div><div class=\"wh\">华强北现货报价与缺货动态（官方媒体跟踪）</div><div class=\"wy\">缺货实锤的持续性</div></div><div class=\"tkc\"><div class=\"w\">不定期</div><div class=\"wh\">村田/三星/太阳诱电下一轮涨价函</div><div class=\"wy\">原厂涨价是基本面锚</div></div><div class=\"tkc\"><div class=\"w\">月度</div><div class=\"wh\">大陆 MLCC 厂商（风华/三环）出货与高端料号进展</div><div class=\"wy\">业绩弹性验证</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">MLCC 概念能否从 +1.4% 走向涨停潮</div><div class=\"wy\">「未定价」转「定价中」的信号</div></div></div>\n\n    <div class=\"src\">数据来源：证券时报 9/23（华强北 MLCC 商家爆单、拿不到货、原厂需求旺盛签长协）· 新浪财经 9/23 实探（AI 料缺、现货无货可报、期货无交期）· 太平洋科技/南方财经 9/20-23（现货最高涨 10 倍、村田/太阳诱电/三星电机涨价函 15-35%、5 月底发酵）· 上海证券报 6/16（高容 5 月以来翻倍、村田 47μF 报价 60 余元、交期延长）· 36氪 9/21（AI 高容原厂提价 15-35%、交期 15-20 周、双轨行情）· 中电网 9/21（消费级回落 30→10 元、AI 结构性缺货）· 证券时报 9/23（MLCC 概念 +1.40%、主力净流入 8.50 亿、国瓷/东材/风华资金）· 抖音/行业口径（2024 份额：村田 31.8%、三星 22.9%、三环 2.5%、风华 1.9%）· 财联社 9/23（下半年融资客加仓斯迪克 10.82 亿、风华 3.70 亿）</div>\n    <footer>MLCC 高端缺货 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>"}, {"id": "diamond-ai-cooling", "title": "金刚石散热 · AI 芯片退烧新叙事", "date": "2026-09-24", "grade": "正式档", "pricing": "部分定价", "crate": "bolt", "search": "培育钻石 金刚石散热 AI芯片 英伟达 HGX BOM清单 力量钻石 黄河旋风 惠丰钻石 中兵红箭 四方达 沃尔德 英诺激光 2300W GPU 风冷时代结束 金刚石铜 渗透率0.1%→12% MPCVD 河南 人造金刚石 半导体散热 先进封装", "card": "<a class=\"card-c\" href=\"#diamond-ai-cooling\" data-search=\"培育钻石 金刚石散热 AI芯片 英伟达 HGX BOM清单 力量钻石 黄河旋风 惠丰钻石 中兵红箭 四方达 沃尔德 英诺激光 2300W GPU 风冷时代结束 金刚石铜 渗透率0.1%→12% MPCVD 河南 人造金刚石 半导体散热 先进封装\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-24</span>\n    <span class=\"crate bolt\">⚡ 新叙事级 · AI 芯片散热引爆金刚石，力量钻石入英伟达 BOM，板块全天强势 产业周期</span>\n  </div>\n  <div class=\"ctitle\">金刚石散热 · AI 芯片退烧新叙事</div>\n  <div class=\"csub\">英伟达 2300W GPU 风冷时代结束 · 力量钻石通过英伟达实验室验证、录入 HGX 服务器 BOM · 金刚石散热渗透率 2025 年 0.1% → 2030 年 12% · 9/24 培育钻石板块全天强势、黄河旋风涨停</div>\n  <div class=\"cpos\">AI 芯片功耗飙升（2300W GPU）使金刚石成为近端散热\"理想材料\"，培育钻石从饰品叙事切换到 AI 散热叙事；商业化导入元年，板块逆势全天强势。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">产业周期</span>\n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 6</span>\n    <span class=\"nm\">力量钻石</span><span class=\"nm\">黄河旋风</span><span class=\"nm\">中兵红箭</span><span class=\"nm\">四方达</span><span class=\"nm\">沃尔德</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-24 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 产业周期 · 2026-09-24</div>\n    <h1>金刚石散热 · AI 芯片退烧新叙事</h1>\n    <div class=\"sub\">英伟达 2300W GPU 风冷时代结束 · 力量钻石通过英伟达实验室验证、录入 HGX 服务器 BOM · 金刚石散热渗透率 2025 年 0.1% → 2030 年 12% · 9/24 培育钻石板块全天强势、黄河旋风涨停</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 新叙事级 · AI 芯片散热引爆金刚石 产业周期</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：AI算力与电力配套</span>\n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--acc)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">agent-cpu-rerating</span><span class=\"tag\" style=\"margin-right:4px\">glass-core-substrate</span><span class=\"tag\" style=\"margin-right:4px\">pcb-ccl-hike</span></div>\n    <div class=\"posnote\">2026 年 AI 芯片功耗飙升（英伟达单颗 GPU 功耗达 2300W），黄仁勋 CES 宣布\"风冷时代已结束\"——金刚石凭借自然界最高热导率成为 AI 芯片近端散热的\"理想材料\"。力量钻石已通过英伟达实验室官方验证、产品录入英伟达 HGX 服务器模组 BOM 清单，与捷斯奥共建半导体金刚石散热项目（一期包销），适配 H200/Blackwell/Vera Rubin 高功耗 GPU，已小批量稳定供货。9/24 大盘大跌（沪指 -1.22%、4300 股下跌）中，培育钻石板块全天强势：黄河旋风涨停、力量钻石/惠丰钻石/中兵红箭/四方达/沃尔德/英诺激光跟涨。</div>\n    <details class=\"more\"><summary>展开定价状态详版（240 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化为<strong>AI 散热需求 + 英伟达 BOM 实锤</strong>：金刚石热导率最高、热膨胀系数与硅/碳化硅匹配，国海证券预测数据中心金刚石散热渗透率从 2025 年 0.1% 升至 2030 年 12%；金刚石铜 2025-2029 CAGR 237%。盘面：<strong>逆势启动</strong>——大盘大跌中板块全天强势、黄河旋风涨停，但力量钻石等龙头涨幅温和，属<strong>部分定价</strong>（新叙事刚被市场认知、商业化导入元年）。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">AI 散热需求</b><div class=\"v\">英伟达单颗 GPU 功耗达 <strong>2300W</strong>，黄仁勋 CES 宣布<strong>\"风冷时代已结束\"</strong>；金刚石集自然界最高硬度与最高热导率于一体，热膨胀系数与硅/碳化硅衬底高度匹配，成为 AI 芯片近端散热\"理想材料\"；国海证券预测数据中心金刚石散热渗透率从 2025 年 <strong>0.1% 提升至 2030 年 12%</strong>。</div></div><div class=\"card fact\"><b class=\"k\">英伟达 BOM 实锤</b><div class=\"v\"><strong>力量钻石通过英伟达实验室官方验证，产品录入英伟达 HGX 服务器模组 BOM 清单</strong>；与捷斯奥共建半导体金刚石散热项目（一期产线由捷斯奥全额包销），适配 <strong>H200/Blackwell/Vera Rubin</strong> 高功耗 GPU 平台，已小批量稳定供货；力量钻石招标 300 台 MPCVD+100 台激光切割+20 台制氢机（400+ 台设备），从饰品向功能材料转型。</div></div><div class=\"card fact warn\"><b class=\"k\">9/24 盘面验证</b><div class=\"v\">大盘大跌（沪指 -1.22%、4300 股下跌）中，<strong>培育钻石板块全天强势</strong>：黄河旋风涨停、力量钻石/惠丰钻石/中兵红箭/四方达/沃尔德/英诺激光跟涨；宏昌科技 9/23 涨近 9%；国机精工 9/9 涨停（金刚石铜）。板块在调整日逆势走强，资金避险+新叙事双驱动。</div></div><div class=\"card fact\"><b class=\"k\">产业格局</b><div class=\"v\">河南手握全国 <strong>80% 人造金刚石产量</strong>，率先完成战略卡位；培育钻石价格企稳回升（惠丰钻石提价），行业走出低价泥潭；头部企业落子散热、金刚石钻针、声学振膜新赛道；黄河旋风上半年仍预亏 2.2 亿（传统饰品业务拖累）。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-01 CES</div><div><div class=\"x\">黄仁勋宣布风冷时代结束，AI 超算散热进入新阶段；金刚石被视为近端散热理想材料。</div><div class=\"y\">为什么：AI 散热叙事的起点。</div></div></div><div class=\"u\"><div class=\"w\">2026-08 至 09 上旬</div><div><div class=\"x\">多家超硬材料公司切入金刚石散热赛道；国机精工 9/9 涨停（金刚石铜 CAGR 237%）；力量钻石录入英伟达 HGX BOM。</div><div class=\"y\">为什么：商业化导入元年，送样/小批量供货阶段。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-23 至 09-24</div><div><div class=\"x\">证券时报报道 AI 热潮蔓延金刚石散热；9/24 大盘大跌中培育钻石板块全天强势、黄河旋风涨停。</div><div class=\"y\">为什么：本档案成立点——新叙事被官媒确认+盘面逆势启动。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「AI 散热需求→材料替代」的新叙事题材，<strong>三个要害</strong>：一是<strong>叙事切换真实且有 BOM 实锤</strong>——金刚石从\"饰品\"切换到\"AI 芯片散热\"，力量钻石录入英伟达 HGX BOM 是产业链最硬的信号（不是概念，是已进入供应链清单）；二是<strong>市场空间从 0 到 1</strong>——渗透率 0.1%→12% 的预测意味着十年百倍空间，金刚石铜 CAGR 237%，属于\"从无到有\"的新赛道；三是<strong>盘面逆势启动</strong>——大盘大跌日板块全天强势，说明资金认可新叙事的独立性。<strong>隐藏面</strong>：力量钻石 BOM 录入≠大规模收入，当前仍是小批量供货阶段；黄河旋风上半年预亏 2.2 亿，传统饰品业务拖累业绩；金刚石散热的商业化节奏取决于英伟达 GPU 出货与散热方案放量，短期业绩弹性有限。<br>① <strong>分水岭时点</strong>：力量钻石金刚石散热订单从\"小批量\"到\"批量\"的公告；英伟达下一代 GPU 散热方案确认。<br>② <strong>传导的关键约束</strong>：金刚石散热片的成本与良率（MPCVD 设备 400+ 台招标是产能信号）。<br>③ <strong>待验证的核心变量</strong>：板块能否从\"逆势强势\"走向\"持续放量\"——若大盘反弹时板块掉队，则是避险资金短炒。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>2300W GPU 风冷时代结束</li><li>力量钻石录入英伟达 HGX BOM</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">中强</span><ul><li>9/24 大盘大跌中板块全天强势</li><li>黄河旋风涨停、多股跟涨</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">小批量阶段</span><ul><li>已小批量稳定供货</li><li>黄河旋风仍预亏 2.2 亿</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">逆势启动·部分定价</span><ul><li>板块全天强势但龙头涨幅温和</li><li>新叙事刚被市场认知</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实（BOM 实锤）、影响中强（逆势启动）、业绩小批量阶段、股价部分定价——AI 散热新叙事，从 0 到 1 的赛道。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>50%</strong>：叙事环与情绪环闭合，业绩环（批量供货）与持续性环（大盘反弹后能否延续）待验证。</li><li><strong>边界要切开</strong>：第一梯队是<strong>已入英伟达供应链</strong>（力量钻石——BOM 实锤+小批量供货）；第二梯队是<strong>河南超硬材料平台</strong>（中兵红箭、黄河旋风、四方达——产能与转型）；第三梯队是<strong>设备/加工</strong>（沃尔德、英诺激光——激光切割/加工设备）。</li><li><strong>主线联动</strong>：与 agent-cpu-rerating（9/22）、glass-core-substrate（9/23）、pcb-ccl-hike（9/23）同属 AI 算力硬件链——本档是\"散热材料\"段。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·英伟达供应链 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>力量钻石</b><span class=\"code\">301071</span><span class=\"tag\">金刚石散热+BOM实锤</span><span class=\"cap\">9/24 随板块</span></div>\n    <div class=\"logic\">英伟达HGX BOM</div>\n    <div class=\"detail\">通过英伟达实验室验证、录入 HGX 服务器 BOM；与捷斯奥共建散热项目（一期包销）；招标 400+ 台设备转型功能材料——板块内最硬的供应链标的。</div>\n    <div class=\"risk\">⚠️ 小批量阶段，业绩弹性待放量</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中兵红箭</b><span class=\"code\">000519</span><span class=\"tag\">超硬材料平台</span><span class=\"cap\">9/24 随板块</span></div>\n    <div class=\"logic\">人造金刚石+军工</div>\n    <div class=\"detail\">河南超硬材料平台，人造金刚石产能龙头，金刚石散热转型受益，军工业务提供安全垫。</div>\n    <div class=\"risk\">⚠️ 军工占比影响弹性</div>\n  </div></div><div class=\"t\">🧬 观察·产能与设备 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>黄河旋风</b><span class=\"code\">600172</span><span class=\"tag\">人造金刚石老牌</span><span class=\"cap\">9/24 涨停</span></div>\n    <div class=\"logic\">河南金刚石产能</div>\n    <div class=\"detail\">河南人造金刚石老牌企业，9/24 涨停；但上半年预亏 2.2 亿（传统饰品业务拖累），题材弹性大但基本面弱。</div>\n    <div class=\"risk\">⚠️ 预亏 2.2 亿，纯题材弹性</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>四方达</b><span class=\"code\">300179</span><span class=\"tag\">复合超硬材料</span><span class=\"cap\">9/24 跟涨</span></div>\n    <div class=\"logic\">金刚石聚晶</div>\n    <div class=\"detail\">复合超硬材料企业，金刚石散热片/聚晶产品受益 AI 散热需求。</div>\n    <div class=\"risk\">⚠️ 散热业务占比待观察</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>沃尔德</b><span class=\"code\">688028</span><span class=\"tag\">金刚石刀具+激光</span><span class=\"cap\">9/24 跟涨</span></div>\n    <div class=\"logic\">金刚石加工设备</div>\n    <div class=\"detail\">金刚石刀具与激光加工设备商，金刚石散热片加工设备受益。</div>\n    <div class=\"risk\">⚠️ 设备订单取决于散热产线扩产</div>\n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">力量钻石金刚石散热订单从\"小批量\"到\"批量\"公告</div><div class=\"wy\">业绩兑现的核心信号</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">英伟达下一代 GPU 散热方案确认</div><div class=\"wy\">金刚石散热是否成为标配</div></div><div class=\"tkc\"><div class=\"w\">月度</div><div class=\"wh\">MPCVD 设备招标与产线投产</div><div class=\"wy\">产能扩张节奏</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">大盘反弹后板块能否延续</div><div class=\"wy\">避险短炒 vs 新趋势的分水岭</div></div></div>\n\n    <div class=\"src\">数据来源：36氪 9/9（力量钻石通过英伟达实验室验证、录入 HGX BOM、捷斯奥包销、H200/Blackwell/Vera Rubin 适配）· 新浪财经 9/16（2300W GPU、风冷时代结束、金刚石散热理想材料）· 21 世纪经济报道 9/23（AI 热潮蔓延金刚石散热、商业化导入元年、中信证券研报）· 国海证券（渗透率 0.1%→12%）· 财联社 9/9（金刚石铜 CAGR 237%、国机精工涨停）· 证券时报/e 公司 9/24（力量钻石 400+ 台设备招标、河南 80% 人造金刚石产量）· 新浪财经 8/26（黄河旋风预亏 2.2 亿、惠丰钻石提价）· GMT EIGHT 9/24（培育钻石板块全天强势、黄河旋风涨停）</div>\n    <footer>金刚石散热 AI 芯片退烧 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>"}, {"id": "tsmc-2027-hike", "title": "台积电 2027 涨价传闻 · 代工产能满载", "date": "2026-09-24", "grade": "正式档", "pricing": "未定价", "crate": "bolt", "search": "台积电 2027年1月 晶圆代工 涨价 3%-6% 2纳米 3纳米 先进制程 8寸厂 产能利用率100% 订单能见度2030 CoWoS 先进封装 联电 力积电 涨价 中芯国际 华虹 长电科技 通富微电 北方华创 中微公司 半导体代工 国产替代", "card": "<a class=\"card-c\" href=\"#tsmc-2027-hike\" data-search=\"台积电 2027年1月 晶圆代工 涨价 3%-6% 2纳米 3纳米 先进制程 8寸厂 产能利用率100% 订单能见度2030 CoWoS 先进封装 联电 力积电 涨价 中芯国际 华虹 长电科技 通富微电 北方华创 中微公司 半导体代工 国产替代\" data-grade=\"正式档\" data-pricing=\"未定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-24</span>\n    <span class=\"crate bolt\">⚡ 涨价实锤级 · 台积电 2027 年 1 月再涨 3-6%、订单能见度至 2030，A 股半导体当日未定价 产业周期</span>\n  </div>\n  <div class=\"ctitle\">台积电 2027 涨价传闻 · 代工产能满载</div>\n  <div class=\"csub\">DIGITIMES：台积电确定 2027 年 1 月起 Wafer Out 涨价 3-6%（2/3nm 先进制程涨幅较高）· 8 寸厂产能利用率超 100%、45nm 以下满载 · 订单能见度至 2030 · CoWoS 先进封装持续紧张</div>\n  <div class=\"cpos\">台积电连续涨价（2026 年 3-10%、2027 年再涨 3-6%）确认代工景气周期，订单能见度至 2030；A 股 9/24 电子板块主力净流出，涨价未被定价。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">产业周期</span>\n    <span class=\"chip pri\">未定价</span>\n    <span class=\"chip\">标的 6</span>\n    <span class=\"nm\">中芯国际</span><span class=\"nm\">华虹公司</span><span class=\"nm\">长电科技</span><span class=\"nm\">通富微电</span><span class=\"nm\">北方华创</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-24 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 产业周期 · 2026-09-24</div>\n    <h1>台积电 2027 涨价传闻 · 代工产能满载</h1>\n    <div class=\"sub\">DIGITIMES：台积电确定 2027 年 1 月起 Wafer Out 涨价 3-6%（2/3nm 先进制程涨幅较高）· 8 寸厂产能利用率超 100%、45nm 以下满载 · 订单能见度至 2030 · CoWoS 先进封装持续紧张</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 涨价实锤级 · 台积电 2027 再涨 3-6% 产业周期</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：未定价</span>\n      <span class=\"badge neutral\">主线：AI算力与电力配套</span>\n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--acc)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">intel-cpu-price-hike</span><span class=\"tag\" style=\"margin-right:4px\">agent-cpu-rerating</span><span class=\"tag\" style=\"margin-right:4px\">pcb-ccl-hike</span></div>\n    <div class=\"posnote\">9/24 凌晨 DIGITIMES 援引供应链人士：台积电已确定自 2027 年 1 月起按制程调整 Wafer Out 报价，涨幅约 3%-6%，其中 2nm/3nm 先进制程涨幅较高；成熟及特殊制程视产品、产能利用率和客户情况分别议价。供应链人士称台积电 8 寸厂产能利用率超 100%、45nm 以下制程满载，订单能见度已至 2030 年；CoWoS 等先进封装产能持续紧张，全球先进封装扩产周期有望拉长。联电、力积电等也已宣布涨价策略。台积电回应：不评论市场传闻。</div>\n    <details class=\"more\"><summary>展开定价状态详版（240 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化为<strong>代工涨价周期确认</strong>：台积电 2026 年先进制程已涨 3-10%（连续 4 年涨价计划），2027 年再涨 3-6%，订单能见度至 2030 年——代工景气周期从\"传闻\"走向\"连续涨价\"。盘面：9/24 大盘大跌，<strong>电子板块主力净流出</strong>（长鑫科技 -9.2 亿、兆易创新 -8.63 亿、沪电股份被抛售），半导体板块虽涨幅居前但资金分歧大——<strong>未定价</strong>（涨价逻辑未被 A 股资金认可）。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">涨价幅度</b><div class=\"v\">DIGITIMES 9/24：台积电确定 <strong>2027 年 1 月起 Wafer Out 涨价 3%-6%</strong>，2nm/3nm 先进制程涨幅较高；此前 2026 年先进制程已涨 3-10%（7nm 及以下 5-10%，追加产能再付 10%+），<strong>连续 4 年涨价计划</strong>；联电、力积电等也已宣布涨价策略。</div></div><div class=\"card fact\"><b class=\"k\">产能与订单</b><div class=\"v\">供应链人士：台积电 <strong>8 寸厂产能利用率超 100%</strong>、45nm 以下制程满载；<strong>订单能见度已至 2030 年</strong>；CoWoS 先进封装产能持续紧张，全球先进封装扩产周期有望进一步拉长。</div></div><div class=\"card fact warn\"><b class=\"k\">9/24 盘面验证</b><div class=\"v\">大盘大跌（沪指 -1.22%、4300 股下跌）中，半导体/电子化学品板块涨幅居前，但<strong>电子板块主力净流出</strong>：长鑫科技 -9.2 亿、兆易创新 -8.63 亿、沪电股份被抛售；先导基电 +21.47 亿、康强电子 +9.19 亿获净流入——<strong>资金分歧大、涨价未被定价</strong>。</div></div><div class=\"card fact\"><b class=\"k\">产业逻辑</b><div class=\"v\">台积电连续涨价=AI 需求驱动代工景气周期确认；2nm/3nm 先进制程涨幅高=AI 芯片需求集中在先进制程；CoWoS 紧张=先进封装扩产周期拉长；A 股映射：国产代工（中芯/华虹）跟随涨价+国产替代，先进封装（长电/通富）受益 CoWoS 外溢，设备（北方华创/中微）受益扩产。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2025-11</div><div><div class=\"x\">台积电启动年度议价，2026 年先进制程涨幅 3-10%，连续 4 年涨价计划。</div><div class=\"y\">为什么：代工涨价周期起点。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-04</div><div><div class=\"x\">新浪报道台积电计划 2027 年全面上调报价（7nm 及以下 5-10%，追加产能再付 10%+）。</div><div class=\"y\">为什么：2027 涨价预期首次明确。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-24</div><div><div class=\"x\">DIGITIMES：台积电确定 2027 年 1 月涨价 3-6%，订单能见度至 2030；A 股电子板块主力净流出、未定价。</div><div class=\"y\">为什么：本档案成立点——涨价从预期走向确定，但 A 股未定价。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「代工景气周期→国产替代映射」的产业题材，<strong>三个要害</strong>：一是<strong>涨价连续性确认景气周期</strong>——台积电 2026 涨 3-10%、2027 再涨 3-6%、订单能见度至 2030，说明 AI 需求驱动的代工景气不是短期脉冲而是多年周期；二是<strong>国产代工跟随逻辑</strong>——台积电涨价=全球代工供需紧张，中芯国际/华虹作为国产代工龙头，有跟随涨价+国产替代双逻辑（海外产能紧张→订单转向国产）；三是<strong>A 股未定价是机会也是风险</strong>——9/24 电子板块主力净流出，说明市场在大盘调整日回避科技股，涨价逻辑尚未被资金认可。<strong>隐藏面</strong>：台积电\"不评论传闻\"，涨价幅度与范围仍待官方确认；A 股半导体与台积电涨价的映射是间接的（国产代工≠台积电订单），且当日电子被抛售说明资金短期回避；先进封装 CoWoS 紧张对 A 股长电/通富的传导需验证。<br>① <strong>分水岭时点</strong>：台积电官方确认涨价函；中芯国际/华虹是否跟随提价。<br>② <strong>传导的关键约束</strong>：国产代工能否承接台积电外溢订单（产能与制程匹配）。<br>③ <strong>待验证的核心变量</strong>：A 股半导体板块能否从\"未定价\"走向\"补涨\"——若大盘企稳后半导体放量，则涨价逻辑被认可。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>台积电 2027 涨价 3-6%、订单至 2030</li><li>8 寸厂产能利用率超 100%</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">中强</span><ul><li>联电/力积电跟随涨价</li><li>CoWoS 紧张、先进封装扩产拉长</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">台积电实锤</span><ul><li>台积电涨价已兑现</li><li>国产代工跟随待验证</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">未定价</span><ul><li>9/24 电子板块主力净流出</li><li>长鑫/兆易/沪电被抛售</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实（涨价确定）、影响中强（全球代工紧张）、业绩台积电实锤但国产待验证、股价未定价——「商品先行、权益未跟」。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>50%</strong>：涨价环与景气环闭合，国产映射环与资金环（未定价）待验证。</li><li><strong>边界要切开</strong>：第一梯队是<strong>国产代工</strong>（中芯国际、华虹公司——跟随涨价+国产替代）；第二梯队是<strong>先进封装</strong>（长电科技、通富微电——CoWoS 外溢）；第三梯队是<strong>设备</strong>（北方华创、中微公司——扩产周期拉长）。</li><li><strong>主线联动</strong>：与 intel-cpu-price-hike（9/9）、agent-cpu-rerating（9/22）、pcb-ccl-hike（9/23）同属 AI 算力硬件链——本档是\"代工涨价\"段。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·国产代工 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中芯国际</b><span class=\"code\">688981</span><span class=\"tag\">国产代工龙头</span><span class=\"cap\">9/24 随板块</span></div>\n    <div class=\"logic\">跟随涨价+国产替代</div>\n    <div class=\"detail\">国产晶圆代工龙头，台积电涨价=全球代工紧张，中芯跟随提价+承接外溢订单双逻辑。</div>\n    <div class=\"risk\">⚠️ 制程差距与产能利用率波动</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>华虹公司</b><span class=\"code\">688347</span><span class=\"tag\">特色工艺代工</span><span class=\"cap\">9/24 随板块</span></div>\n    <div class=\"logic\">成熟制程涨价</div>\n    <div class=\"detail\">特色工艺代工，成熟制程产能利用率提升+涨价受益，8 寸厂产能利用率超 100% 直接映射。</div>\n    <div class=\"risk\">⚠️ 成熟制程价格弹性低于先进制程</div>\n  </div></div><div class=\"t\">🧬 观察·先进封装与设备 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>长电科技</b><span class=\"code\">600584</span><span class=\"tag\">先进封装龙头</span><span class=\"cap\">9/24 随板块</span></div>\n    <div class=\"logic\">CoWoS外溢</div>\n    <div class=\"detail\">先进封装龙头，CoWoS 产能紧张→订单外溢至国产封装厂，扩产周期拉长受益。</div>\n    <div class=\"risk\">⚠️ 外溢订单规模待验证</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>通富微电</b><span class=\"code\">002156</span><span class=\"tag\">AMD封装</span><span class=\"cap\">9/24 随板块</span></div>\n    <div class=\"logic\">AMD封装+先进封装</div>\n    <div class=\"detail\">AMD 核心封装伙伴，先进封装扩产周期拉长受益，Chiplet 趋势直接映射。</div>\n    <div class=\"risk\">⚠️ AMD 订单占比高</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>北方华创</b><span class=\"code\">002371</span><span class=\"tag\">半导体设备</span><span class=\"cap\">9/24 随板块</span></div>\n    <div class=\"logic\">扩产周期拉长</div>\n    <div class=\"detail\">设备龙头，全球代工扩产周期拉长→设备需求持续，国产替代+扩产双逻辑。</div>\n    <div class=\"risk\">⚠️ 设备订单确认周期长</div>\n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">不定期</div><div class=\"wh\">台积电官方确认 2027 涨价函</div><div class=\"wy\">传闻→实锤的确认</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">中芯国际/华虹是否跟随提价</div><div class=\"wy\">国产代工映射的直接信号</div></div><div class=\"tkc\"><div class=\"w\">月度</div><div class=\"wh\">CoWoS 产能利用率与扩产进度</div><div class=\"wy\">先进封装外溢节奏</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">A 股半导体板块能否从\"未定价\"走向补涨</div><div class=\"wy\">资金认可涨价逻辑的信号</div></div></div>\n\n    <div class=\"src\">数据来源：DIGITIMES/财联社 9/24（台积电 2027 年 1 月涨价 3-6%、2/3nm 涨幅较高、8 寸厂产能利用率超 100%、订单能见度至 2030）· 新浪财经 9/24（台积电回应不评论传闻、联电/力积电跟随涨价）· 21 世纪经济报道 9/24（盘前线索：台积电涨价）· 新浪财经 9/4（台积电 2027 全面上调、7nm 及以下 5-10%、追加产能再付 10%+）· 界面新闻 9/24（苹果芯片采购成本增加、三星内存涨价）· 36氪 9/24（电子板块主力净流出：长鑫 -9.2 亿、兆易 -8.63 亿、沪电被抛售）· 财联社 9/24 焦点复盘（沪指 -1.22%、4300 股下跌、半导体板块涨幅居前）</div>\n    <footer>台积电 2027 涨价传闻 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>"}], "stats": {"total": 41, "fire": 7, "bolt": 25, "warn": 8, "down": 2, "stocks": 230}};;;;;

      }
      try { localStorage.removeItem(STORE_KEY); } catch(e){}
    } catch(e){}
  }
  useBuiltin();
}
function useBuiltin(){
  archives = BUILTIN.archives;
  cards = {};
  BUILTIN.archives.forEach(function(a){ cards[a.id] = a.card; });
  meta = { updatedAt: null, source: '', fromRemote: false };
}
function saveData(){
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ archives: archives, cards: cards, meta: meta }));
  } catch(e){}
}
function currentStats(){
  var fire=0, bolt=0, warn=0, down=0, stocks=0, codes={};
  archives.forEach(function(a){
    var c = (a.crate||'').split(/\s+/);
    if(c.indexOf('fire')>=0) fire++;
    if(c.indexOf('bolt')>=0) bolt++;
    if(c.indexOf('warn')>=0) warn++;
    if(a.grade==='降档') down++;
  });
  // 标的按详情页 code 唯一数
  var re = /<span class="code">([^<]+)<\/span>/g, m;
  archives.forEach(function(a){
    re.lastIndex = 0;
    while((m = re.exec(a.body)) !== null){
      var t = m[1].trim();
      if(t) codes[t] = 1;
    }
  });
  stocks = Object.keys(codes).length;
  return { total: archives.length, fire: fire, bolt: bolt, warn: warn, down: down, stocks: stocks };
}

/* ---------- 渲染 ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderStats(){
  var s = currentStats();
  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="v">'+s.total+'</div><div class="k">档案总数</div></div>'+
    '<div class="stat f"><div class="v">'+s.fire+'</div><div class="k">🔥 已启动</div></div>'+
    '<div class="stat b"><div class="v">'+s.bolt+'</div><div class="k">⚡ 未充分定价</div></div>'+
    '<div class="stat w"><div class="v">'+s.warn+'</div><div class="k">⚠ 风险信号</div></div>'+
    '<div class="stat"><div class="v" style="color:#94a3b8">'+s.down+'</div><div class="k">⚑ 降档入库</div></div>'+
    '<div class="stat"><div class="v">'+s.stocks+'</div><div class="k">覆盖标的</div></div>';
}

function renderGrid(){
  var q = (document.getElementById('q').value || '').trim().toLowerCase();
  var filter = (document.querySelector('.fbtn.on') || {}).dataset ? document.querySelector('.fbtn.on').dataset.f : 'all';
  var grid = document.getElementById('grid');
  var html = '';
  var visible = 0;
  var sorted = archives.slice().sort(function(x,y){
    return String(y.date||'').localeCompare(String(x.date||''));
  });
  sorted.forEach(function(a){
    var pricing = a.pricing || '';
    var ok = (filter==='all' || pricing===filter || (filter==='部分定价' && pricing==='已部分定价')) &&
             (!q || (a.search||'').toLowerCase().indexOf(q)>=0 || (a.title||'').toLowerCase().indexOf(q)>=0);
    if(ok){ html += cards[a.id] || a.card; visible++; }
  });
  grid.innerHTML = html;
  document.getElementById('empty').style.display = visible ? 'none' : '';
  renderStats();
}

function renderCases(){
  var cont = document.getElementById('case-container');
  var html = '';
  archives.forEach(function(a){ html += '<section class="case" id="case-'+a.id+'" data-search="'+esc(a.search)+'">'+a.body+'</section>'; });
  cont.innerHTML = html;
}

function show(target){
  var idx = document.getElementById('page-index');
  var cases = document.querySelectorAll('#case-container .case');
  if(target === '' || target === '/' || !target){
    idx.hidden = false;
    cases.forEach(function(c){ c.hidden = true; });
    window.scrollTo(0,0);
  } else {
    var el = document.getElementById('case-' + target);
    if(el){
      idx.hidden = true;
      cases.forEach(function(c){ c.hidden = (c !== el); });
      window.scrollTo(0,0);
    } else {
      location.hash = '';
    }
  }
}
window.addEventListener('hashchange', function(){
  var h = (location.hash || '').replace(/^#/, '').replace(/\//g, '');
  show(h);
});

function renderAll(){
  renderCases();
  renderGrid();
  var h = (location.hash || '').replace(/^#/, '').replace(/\//g, '');
  show(h);
  renderUpMeta();
  document.getElementById('head-st').textContent =
    '题材档案库 · 共 ' + archives.length + ' 档' + (meta.fromRemote ? ' · 已联网更新' : ' · 内置数据');
}

/* ---------- 更新栏状态 ---------- */
function renderUpMeta(){
  var el = document.getElementById('up-meta');
  var parts = ['内置基线 ' + (BUILTIN.generated_at || '')];
  if(meta.updatedAt) parts.push('本地更新 ' + meta.updatedAt);
  el.textContent = parts.join(' ｜ ');
}

/* ---------- 提示条 ---------- */
var toastTimer = null;
function toast(msg, cls){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (cls||'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = 'toast'; }, 4200);
}

/* ---------- 合并远程/导入数据（远程优先覆盖同名 + 新增） ---------- */
function mergeIncoming(incoming, sourceLabel, fromRemote){
  var inc = incoming.archives || [];
  if(!inc.length) return { added:0, updated:0, kept: archives.length };
  // 原库 id 索引
  var have = {};
  archives.forEach(function(a){ have[a.id] = 1; });
  var added = 0, updated = 0;
  inc.forEach(function(a){
    if(!a || !a.id || !a.body) return;
    if(have[a.id]){
      // 同名：仅当内容实质变化才计入「更新」
      var old = null;
      archives.forEach(function(x){ if(x.id === a.id) old = x; });
      if(!old || old.body !== a.body || old.card !== a.card) updated++;
    } else {
      added++;
    }
    if(a.card) cards[a.id] = a.card;
  });
  // 远程优先：同名档案替换为远程版本，并补全远程缺失的 meta 字段
  var merged = {};
  inc.forEach(function(a){
    if(!a || !a.id) return;
    var old = null;
    archives.forEach(function(x){ if(x.id === a.id) old = x; });
    if(old){
      if(!a.grade) a.grade = old.grade;
      if(!a.pricing) a.pricing = old.pricing;
      if(!a.crate) a.crate = old.crate;
      if(!a.title) a.title = old.title;
      if(!a.date) a.date = old.date;
      if(!a.search) a.search = old.search;
    }
    merged[a.id] = a;
  });
  var newArchives = archives.map(function(a){ return merged[a.id] || a; });
  // 追加远程新增档案（id 不在原库中）
  inc.forEach(function(a){
    if(a && a.id && !have[a.id] && a.body) newArchives.push(a);
  });
  archives = newArchives;
  meta.updatedAt = new Date().toLocaleString('zh-CN', {hour12:false});
  meta.source = sourceLabel;
  meta.fromRemote = fromRemote;
  saveData();
  return { added: added, updated: updated, kept: 0 };
}

/* ---------- 联网更新 ---------- */
function getSavedUrl(){
  try { return localStorage.getItem('tcdb_src_url') || ''; } catch(e){ return ''; }
}
function setSavedUrl(u){
  try { localStorage.setItem('tcdb_src_url', u); } catch(e){}
}

function doUpdate(){
  var url = (document.getElementById('src-url').value || '').trim() || getSavedUrl();
  if(!url){
    toast('请先设置数据源 URL（点「⚙ 数据源设置」填写）', 'err');
    document.getElementById('setpanel').classList.add('open');
    return;
  }
  var btn = document.getElementById('btn-update');
  btn.disabled = true; btn.textContent = '⟳ 更新中…';
  var t0 = Date.now();
  fetch(url, { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){
      if(!j || !j.archives || !j.archives.length) throw new Error('数据格式不正确（缺少 archives 字段）');
      var r = mergeIncoming(j, url, true);
      renderAll();
      toast('✅ 更新完成：新增 ' + r.added + ' 档、更新 ' + r.updated + ' 档，共 ' + archives.length + ' 档（耗时 ' + Math.round((Date.now()-t0)/1000) + 's）', 'ok');
    })
    .catch(function(err){
      toast('❌ 更新失败：' + (err && err.message ? err.message : '网络错误') + '。请检查数据源 URL 或网络连接。', 'err');
    })
    .finally(function(){ btn.disabled = false; btn.textContent = '⟳ 更新档案库'; });
}

/* ---------- 导入本地文件 ---------- */
function doImport(file){
  var rd = new FileReader();
  rd.onload = function(){
    try {
      var j = JSON.parse(rd.result);
      var r = mergeIncoming(j, '本地导入 ' + file.name, false);
      renderAll();
      toast('✅ 导入完成：新增 ' + r.added + ' 档、更新 ' + r.updated + ' 档，共 ' + archives.length + ' 档', 'ok');
    } catch(e){
      toast('❌ 导入失败：文件不是有效的 data.json', 'err');
    }
  };
  rd.readAsText(file, 'utf-8');
}

/* ---------- 导出备份 ---------- */
function doExport(){
  var payload = {
    version: 2,
    generated_at: new Date().toISOString().slice(0,10),
    note: '题材档案库导出备份（' + new Date().toLocaleString('zh-CN',{hour12:false}) + '）',
    archives: archives,
    cards: cards
  };
  var blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '题材档案库_data_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- 事件绑定 ---------- */
function bind(){
  var q = document.getElementById('q');
  if(q) q.addEventListener('input', renderGrid);
  document.querySelectorAll('.fbtn').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.fbtn').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      renderGrid();
    });
  });
  document.getElementById('btn-update').addEventListener('click', doUpdate);
  document.getElementById('btn-settings').addEventListener('click', function(){
    var p = document.getElementById('setpanel');
    p.classList.toggle('open');
    if(p.classList.contains('open')){
      document.getElementById('src-url').value = getSavedUrl();
    }
  });
  document.getElementById('btn-save-src').addEventListener('click', function(){
    var u = (document.getElementById('src-url').value || '').trim();
    if(!u){ toast('请输入数据源 URL', 'err'); return; }
    setSavedUrl(u);
    toast('✅ 数据源已保存', 'ok');
  });
  document.getElementById('btn-test-src').addEventListener('click', function(){
    var u = (document.getElementById('src-url').value || '').trim() || getSavedUrl();
    if(!u){ toast('请先输入数据源 URL', 'err'); return; }
    toast('正在测试连接…');
    fetch(u, { cache: 'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(j){
        var n = j && j.archives ? j.archives.length : 0;
        toast('✅ 连接正常：数据源包含 ' + n + ' 档档案' + (j.generated_at ? '（生成于 ' + j.generated_at + '）' : ''), 'ok');
      })
      .catch(function(err){ toast('❌ 连接失败：' + (err && err.message ? err.message : '无法访问'), 'err'); });
  });
  document.getElementById('btn-import').addEventListener('click', function(){
    document.getElementById('file-import').click();
  });
  document.getElementById('file-import').addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]) doImport(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('btn-export').addEventListener('click', doExport);
}

/* ---------- 启动 ---------- */
loadData();
bind();
renderAll();
</script>
</body></html>
