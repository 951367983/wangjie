<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>题材档案库 · 可联网更新版</title>
<style>
/* ===== 原版样式（完整保留） ===== */

:root{--bg:#0a0f0d;--panel:#111815;--panel2:#0f1512;--line:#1f2b26;--ink:#e8f5ee;--dim:#8fa89b;--faint:#5c6f66;--acc:#fbbf24;--red:#f87171;--grn:#34d399;--amb:#fbbf24;--warn:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.75 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;padding-bottom:60px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.case[hidden]{display:none!important}

/* ===== 目录页样式 ===== */
.head{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 0;backdrop-filter:blur(8px)}
.head h1{font-size:22px;letter-spacing:-.01em;margin:0}
.head h1 b{color:var(--acc)}
.head .st{font-size:12px;color:var(--faint);letter-spacing:.1em;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:center}
.stat .v{font-size:24px;font-weight:700;color:var(--acc);font-family:ui-monospace,Consolas,monospace}
.stat .k{font-size:11px;color:var(--dim);letter-spacing:.05em;margin-top:2px}
.stat.f .v{color:var(--red)}.stat.b .v{color:var(--acc)}.stat.w .v{color:var(--warn)}
.bar{display:flex;gap:8px;align-items:center;margin:14px 0;flex-wrap:wrap}
.bar input{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:6px;font-size:14px;outline:none}
.bar input:focus{border-color:var(--acc)}
.fbtn{background:transparent;border:1px solid var(--line);color:var(--dim);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.fbtn.on{border-color:var(--acc);color:var(--acc)}
.grid-c{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:14px}
.card-c{display:block;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-decoration:none;color:inherit;transition:border-color .15s}
.card-c:hover{border-color:var(--acc)}
.cTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cdate{font-family:ui-monospace,Consolas,monospace;color:var(--faint);font-size:12px;letter-spacing:.1em}
.crate{font-size:12px;text-align:right;line-height:1.4}
.crate.fire{color:var(--red)}.crate.bolt{color:var(--acc)}.crate.warn{color:var(--warn)}
.ctitle{font-size:16px;font-weight:600;margin:4px 0}
.csub{font-size:13px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.cmeta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chip{font-size:11px;border:1px solid var(--line);color:var(--dim);padding:1px 8px;border-radius:3px}
.chip.pri{border-color:var(--acc);color:var(--acc)}
.chip.line{border-color:#38bdf8;color:#38bdf8}
.chip.down{border-color:#94a3b8;color:#94a3b8}
.cpos{font-size:13px;color:var(--ink);border-left:2px solid var(--grn);padding-left:10px;margin:8px 0}
.nm{font-size:11px;color:var(--faint);font-family:ui-monospace,Consolas,monospace}
.cgo{font-size:12px;color:var(--acc);margin-top:4px}
.empty{text-align:center;color:var(--faint);padding:40px 0;display:none}

/* ===== 详情页样式（与 render_case.js 保持一致） ===== */
.hrow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.hleft{display:flex;align-items:center;gap:14px}
.back{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--line);padding:3px 10px;border-radius:4px;white-space:nowrap}
.back:hover{border-color:var(--acc);color:var(--acc)}
.brand b{color:var(--acc)}.brand span{color:var(--faint);font-size:12px;letter-spacing:.2em;margin-left:8px}
.crumb{color:var(--dim);text-decoration:none}.crumb:hover{color:var(--acc)}
.clock{font-family:ui-monospace,Consolas,monospace;color:var(--dim);font-size:13px}
.live{color:var(--acc);border:1px solid var(--acc);padding:1px 8px;border-radius:3px;font-size:11px;letter-spacing:.15em}
h1{font-size:30px;letter-spacing:-.01em;margin:26px 0 6px}
.sub{color:var(--dim);font-size:15px;margin-bottom:14px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.badge{display:inline-block;border:1px solid var(--acc);color:var(--acc);font-size:12px;padding:2px 10px;border-radius:3px;letter-spacing:.05em}
.badge.neutral{border-color:var(--line);color:var(--dim)}
.badge.fire{border-color:var(--red);color:var(--red);background:rgba(248,113,113,.08)}
.badge.bolt{border-color:var(--acc);color:var(--acc);background:rgba(251,191,36,.08)}
.badge.warn{border-color:var(--warn);color:var(--warn);background:rgba(167,139,250,.08)}
.datechip{color:var(--faint);font-size:12px;letter-spacing:.25em;margin-bottom:10px}
.pos{background:var(--panel);border-left:3px solid var(--acc);padding:12px 16px;margin:16px 0;border-radius:0 6px 6px 0;font-size:14px;color:var(--dim)}
.pos b{color:var(--ink)}
h2{font-size:20px;margin:38px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
h2 .p{color:var(--acc);margin-right:8px;font-size:15px;letter-spacing:.1em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.card .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.card b{font-size:16px}
.code{font-family:ui-monospace,monospace;color:var(--faint);font-size:13px}
.tag{font-size:11px;border:1px solid var(--acc);color:var(--acc);padding:0 6px;border-radius:3px}
.cap{font-size:11px;border:1px solid var(--line);color:var(--dim);padding:0 6px;border-radius:3px}
.logic{color:var(--dim);font-size:13px;margin:4px 0}
.detail{font-size:14px;margin:8px 0}
.gene,.confirm{font-size:13px;color:var(--amb);margin:6px 0 0}
.confirm{color:var(--grn)}
.risk{font-size:13px;color:var(--red);margin-top:6px}
.warn{border-left:3px solid var(--amb)}
.fact b.k{color:var(--acc);display:block;margin-bottom:4px;font-size:13px;letter-spacing:.05em}
.fact .v{font-size:14px;color:var(--ink)}
.verdict{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px;font-size:15px}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
.ring{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.ring .k{font-size:18px;font-weight:700}
.ring .vt{float:right;font-size:12px;border:1px solid var(--acc);color:var(--acc);padding:0 8px;border-radius:3px}
.ring li{font-size:13px;color:var(--dim);margin-left:16px}
.sum{color:var(--acc);font-size:14px;margin:8px 0}
.assess li,.hist li{font-size:13px;color:var(--dim);margin-left:18px}
.tier{margin-bottom:14px}
.tier .t{font-size:15px;font-weight:700;margin-bottom:8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:720px){.sig{grid-template-columns:1fr}}
.sigbox{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--panel)}
.sigbox.v{border-top:3px solid var(--grn)}.sigbox.f{border-top:3px solid var(--red)}
.sigbox h3{font-size:14px;margin-bottom:2px}.sigbox .hint{font-size:12px;color:var(--faint);margin-bottom:8px}
.sigbox li{font-size:13px;margin-left:18px;color:var(--dim)}
.sigbox.v li b,.sigbox.f li b{color:var(--ink)}
.tk{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.tkc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;border-left:3px solid var(--acc)}
.tkc .w{font-family:ui-monospace,monospace;color:var(--acc);font-size:12px;letter-spacing:.1em}
.tkc .wh{font-size:14px;font-weight:700;margin:6px 0}
.tkc .wy{font-size:13px;color:var(--dim)}
.updates{margin-bottom:14px}
.updates .u{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.updates .u:last-child{border-bottom:none}
.updates .w{font-family:ui-monospace,Consolas,monospace;color:var(--acc);font-size:12px;font-weight:700}
.updates .x{font-size:13px}.updates .y{font-size:12px;color:var(--dim);margin-top:4px}
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.sc{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:6px;padding:14px}
.sc .br{font-size:14px;font-weight:700;color:var(--acc);margin-bottom:6px}
.sc .tg,.sc .ls,.sc .fs{font-size:12px;color:var(--dim);margin:4px 0}
.sc .tg b,.sc .ls b,.sc .fs b{color:var(--ink)}
.dc{display:grid;gap:8px}
.dcstep{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:6px;padding:12px 15px;display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start}
.dcstep .sn{font-family:ui-monospace,Consolas,monospace;color:var(--acc);font-size:12px;font-weight:700;padding-top:2px}
.dcstep .sname{display:block;font-size:12px;color:var(--faint);letter-spacing:.15em;margin-top:2px}
.dcstep .st{font-size:14px;line-height:1.7}
.dcstep.alert{border-left-color:var(--red);background:linear-gradient(90deg,rgba(248,113,113,.09),var(--panel) 40%)}
.dcstep.alert .sn{color:var(--red)}
.dcstep.dim{border-left-color:var(--faint)}
.dcstep.dim .st{color:var(--dim);font-size:13px}
.dchint{font-size:12px;color:var(--faint);margin-bottom:10px}
.gradedown{border-color:#94a3b8;color:#94a3b8;background:rgba(148,163,184,.1)}
.posnote{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--grn);padding:11px 15px;margin:14px 0;border-radius:0 6px 6px 0;font-size:15px}
details.more{margin:6px 0 16px}
details.more summary{cursor:pointer;color:var(--acc);font-size:13px;list-style:none;outline:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:'\25B8 ';color:var(--acc)}
details.more[open] summary::before{content:'\25BE '}
.src{color:var(--faint);font-size:12px;margin-top:30px;padding-top:14px;border-top:1px solid var(--line)}
footer{margin-top:20px;color:var(--faint);font-size:12px;text-align:center}


/* ===== 新增：更新栏 / 设置面板 / 提示条 ===== */
.upbar{display:flex;gap:8px;align-items:center;margin:0 0 14px;flex-wrap:wrap;padding:10px 14px;background:linear-gradient(90deg,rgba(251,191,36,.08),transparent);border:1px solid var(--line);border-radius:8px}
.upbar .ttl{font-size:13px;color:var(--dim);margin-right:auto}
.upbtn{background:var(--acc);color:#0a0f0d;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.02em}
.upbtn:hover{filter:brightness(1.1)}
.upbtn:disabled{opacity:.5;cursor:wait}
.upbtn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:400;padding:7px 12px;font-size:13px}
.upmeta{font-size:12px;color:var(--faint);font-family:ui-monospace,Consolas,monospace}
.uptip{width:100%;font-size:12px;color:var(--faint)}
.setpanel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:0 0 14px;display:none}
.setpanel.open{display:block}
.setpanel h4{font-size:13px;color:var(--acc);margin:0 0 10px;letter-spacing:.05em}
.setrow{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.setrow label{font-size:13px;color:var(--dim);min-width:76px}
.setrow input{flex:1;min-width:220px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:7px 10px;border-radius:6px;font-size:13px;outline:none;font-family:ui-monospace,Consolas,monospace}
.setrow input:focus{border-color:var(--acc)}
.sbtn{background:transparent;border:1px solid var(--line);color:var(--dim);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.sbtn:hover{border-color:var(--acc);color:var(--acc)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#13201a;border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:8px;font-size:13px;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw}
.toast.show{opacity:1}
.toast.ok{border-color:var(--grn)}
.toast.err{border-color:var(--red)}
.toast .d{font-size:11px;color:var(--faint);margin-top:2px}
</style></head><body>

<div id="page-index">

    <h1><b>题材</b>档案库</h1>

      <div style="font-size:12px;color:var(--faint);line-height:1.7">
        <b style="color:var(--acc)">怎么用：</b>① 把本页面同目录的 <b>data.json</b> 发布到任意可直链访问的位置（推荐免费静态托管，如 GitHub Pages / Gitee Pages）；② 把直链填到上面并保存；③ 以后每次打开页面，点「⟳ 更新档案库」即可自动拉取最新档案，新题材会自动追加到库里。没有服务器时，也可以用「导入本地 data.json 文件」手动更新，或「导出当前数据」做备份。
      </div>
    </div>

    <div class="bar">
      <input id="q" type="text" placeholder="搜索题材 / 标的 / 关键词…">
      <button class="fbtn on" data-f="all">全部</button>
      <button class="fbtn" data-f="未定价">未定价</button>
      <button class="fbtn" data-f="部分定价">部分定价</button>
      <button class="fbtn" data-f="已定价">已定价</button>
    </div>

    <div class="grid-c" id="grid"></div>
    <div id="empty" style="display:none;color:var(--faint);text-align:center;padding:40px 0">没有匹配的档案</div>
  </div>
</div>

材 37.8%、不合作出口商及其他出口商 33.3% · 9/15 部长通过终裁建议，9/16 16:03 盘后扩散</div>\n    <div class=\"badges\">\n      <span class=\"badge warn\">⚠ 题材催化级 · 供给冲击型成立但 A 股映射缺失，仅供情绪波段</span>\n      <span class=\"badge neutral\">政策驱动</span>\n      <span class=\"badge neutral\">定价状态：未定价</span>\n      <span class=\"badge neutral\">主线：贸易摩擦·反倾销</span>\n      <span class=\"badge gradedown\">⚑ 降档入库 · 只配情绪波段，不格局中线</span>\n    </div>\n    \n    <div class=\"posnote\">澳洲对华轻型钢螺柱征收 33.3%-37.8% 反倾销税；税率够硬但涉案品类极小，A 股无直接标的——降档记录，不格局中线。</div>\n    <details class=\"more\"><summary>展开定价状态详版（557 字）</summary><div class=\"pos\"><b>定价状态备注：</b>公告主体是 <strong>9/15 澳大利亚反倾销委员会第 2026/119 号公告</strong>，澳大利亚工业、创新和科学部长通过了终裁建议；东财快讯在 <strong>9/16 16:03</strong> 扩散（A 股 15:00 收盘后）。判据检视：① 有精确数字（37.8%/33.3%）✓ ② 有预期差（盘后扩散）✓ ③ 有可证伪胜负手（复审/到期）✓——三条齐全，但<strong>「A 股映射」这一隐含前提不成立</strong>：轻型钢螺柱（light gauge steel stud and track，轻钢龙骨体系的立柱与导轨）在中国以出口型中小建材厂为主（涉案的文安县凯泽建材为非上市公司），A 股无主营该品类的标的，港股/A 股钢结构上市公司的对澳出口占比均极低。<br><br>因此本档按 v6「降档入库」机制收录：保留完整的供给冲击型分析框架与税率数字，为后续同类反倾销事件（尤其是规模更大的品类）建立参照基准，但明确标注 <strong>「本档无合格主攻标的，只配情绪波段，不格局中线」</strong>。它的主要价值是<strong>记录价值</strong>——作为「贸易摩擦·反倾销」主线的第一份档案，为后续印度、欧盟、美国对华反倾销事件提供税率区间与程序时点的对照。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">① 核心事实 · 两级税率</b><div class=\"v\">澳大利亚工业、创新和科学部长通过反倾销委员会终裁建议：<strong>对出口商文安县凯泽建材有限公司征收 37.8% 反倾销税，对中国不合作出口商和其他出口商征收 33.3% 反倾销税</strong>（中国贸易救济信息网，9/15 第 2026/119 号公告）。涉案产品为<strong>轻型钢螺柱和轨道</strong>（light gauge steel stud and track）。</div></div><div class=\"card fact\"><b class=\"k\">② 涉案品类 · 为什么它小</b><div class=\"v\">轻型钢螺柱与轨道是轻钢龙骨建筑体系的立柱与导轨构件，属于装配式建筑的辅材，单价低、运输半径敏感（体积大、重量重），因此国际贸易以区域自给为主。中国出口主体集中在河北文安等产业集群的中小建材厂——<strong>涉案的文安县凯泽建材即为非上市公司</strong>。这决定了本次终裁的影响范围局限在少数出口厂商，不具备行业级冲击。</div></div><div class=\"card fact\"><b class=\"k\">③ 程序含义 · 终裁 ≠ 终局</b><div class=\"v\">反倾销终裁意味着调查阶段结束、税率进入征收执行期，但仍有三个后续节点：<strong>日落复审</strong>（通常 5 年后）、<strong>新出口商复审</strong>（未涉案企业可申请单独税率）、以及<strong>司法复核</strong>。因此 33.3% 的「其他出口商」税率并非永久锁定，新出口商有机会通过复审获得更低税率。</div></div><div class=\"card fact\"><b class=\"k\">④ 同期对照 · 贸易救济密集期</b><div class=\"v\">同期中国贸易救济信息网还披露<strong>印度对原产于或进口自中国的连二亚硫酸钠作出第一次（反倾销）裁决</strong>——同一周内出现两起对华反倾销。这说明当前处于贸易救济措施的密集期，本档可作为该主线的首个样本，为后续规模化品类（如钢铁、铝、光伏、新能源汽车）的反倾销事件提供税率区间与程序节奏的参照。</div></div><div class=\"card fact warn\"><b class=\"k\">⑤ 争议点 · 供给侧还是需求侧</b><div class=\"v\">反倾销税的受益方是<strong>进口国（澳大利亚）本土厂商</strong>，受损方是<strong>出口国（中国）厂商</strong>。因此从 A 股视角看，这是一条<strong>利空型</strong>供给冲击——若 A 股存在对澳出口占比较高的钢构标的，终裁对其是负面。这与我们档案库里主流的「价格新高 → 上游受益」型题材方向相反，属于需要反向处理的一类。</div></div><div class=\"card fact\"><b class=\"k\">⑥ 盘面验证 · 无任何定价</b><div class=\"v\">9/16 收盘 A 股钢结构与装配式建筑方向：精工钢构 <strong>+2.19%</strong>（成交 1.10 亿）、鸿路钢构 +0.61%（成交 1.35 亿）、东南网架 +0.34%、杭萧钢构 +0.84%、富煌钢构 <strong>+8.42%</strong>（换手 6.68%）。其中富煌钢构的 +8.42% 与该事件无因果关系（其主营为重型钢结构工程、对澳出口占比极低，异动更可能来自其他题材）。整体看，<strong>该终裁在 A 股未形成任何可辨识的定价</strong>——既无受益方上涨，也无受损方下跌。同日上证 +0.71%。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-15</div><div><div class=\"x\">澳大利亚反倾销委员会发布第 2026/119 号公告，部长通过对进口自中国轻型钢螺柱和轨道的反倾销终裁建议</div><div class=\"y\">为什么：本档的唯一催化事件；终裁意味着调查程序结束、税率进入执行阶段</div></div></div><div class=\"u\"><div class=\"w\">2026-09-16 16:03</div><div><div class=\"x\">中国贸易救济信息网披露，东财快讯在 A 股收盘后扩散</div><div class=\"y\">为什么：盘后扩散但 A 股无直接标的，未形成任何定价</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">① <strong>分水岭时点是「日落复审」而非终裁本身</strong>。终裁只是把税率确定下来，真正的变量在 5 年后的日落复审与新出口商复审。对 A 股而言，由于本就不存在直接标的，这个时点几乎没有意义——这也是本档降档的核心理由。<br>② <strong>传导的关键约束是「出口占比」这个分母</strong>。反倾销税的影响大小 = 税率 × 对澳出口占比。本次税率 33.3%-37.8% 不可谓不高，但 A 股钢结构上市公司的海外收入主要来自东南亚、中东、非洲的工程项目（EPC 总包带动钢构出口），澳大利亚占比普遍极低，因此分母趋近于零，整条传导链在第一步就断了。<br>③ <strong>待验证的核心变量是「本档能否作为主线基准」</strong>。既然 A 股映射缺失，本档的价值就不是找标的，而是建立参照：33.3%（不合作方）与 37.8%（配合方获更高税率这一反直觉安排）这两个数字，以及「9月公告 → 盘后扩散」的程序节奏，为后续规模更大的反倾销事件提供对照。<br><strong>隐藏面</strong>：本次出现了一个反直觉现象——<strong>配合调查的文安县凯泽建材被征 37.8%，高于不合作方的 33.3%</strong>。这与通常「不合作方获惩罚性高税率」的惯例相反，可能源于澳方按企业实际倾销幅度个别裁定。这个细节值得记录，因为它说明澳方本案中采用的是「分别裁定」而非「惩罚性统一税率」。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>澳方 9/15 第 2026/119 号公告，部长通过终裁建议</li><li>税率 33.3%（不合作及其他出口商）/ 37.8%（文安县凯泽建材），进入征收执行期</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">弱</span><ul><li>涉案品类为轻钢龙骨辅材，单价低、运输半径敏感，国际贸易以区域自给为主</li><li>出口主体为河北文安等地中小建材厂，非上市公司，不具备行业级冲击</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">无映射</span><ul><li>A 股无主营轻型钢螺柱的标的；钢构上市公司海外收入以东南亚/中东/非洲 EPC 为主，对澳占比极低</li><li>税率 × 对澳出口占比 ≈ 0，传导链在第一步断开</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">未动</span><ul><li>9/16 钢结构方向精工钢构 +2.19%、鸿路钢构 +0.61%、东南网架 +0.34%，与事件无因果</li><li>无受益方上涨、无受损方下跌，未形成任何可辨识定价</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响弱、业绩无映射、股价未动——四环中三环不成立，本档的收录价值在于记录而非交易。</div>\n    <ul class=\"assess\"><li>闭合度 25%。只有第一环（变化）成立：税率与公告属实。第二环（影响）因品类规模过小而弱化，第三环（业绩）因 A 股无对应标的而完全断开，第四环（股价）未出现任何可归因的定价。</li><li>边界：受益方是澳大利亚本土轻钢龙骨厂商（不在 A 股）；受损方是中国对澳出口的中小建材厂（非上市）。A 股钢结构上市公司（鸿路钢构、精工钢构、东南网架、杭萧钢构、富煌钢构）均不在传导链上——它们的海外业务是工程项目制总包，与建材单品出口是两回事。</li><li>主线联动：本档是「贸易摩擦·反倾销」主线的第一份档案，暂无同主线档案可互链。它的作用是建立基准：后续若出现规模更大的对华反倾销（钢铁、铝、光伏、新能源车），可直接对照本档的税率区间（33%-38%）、程序节奏（公告→盘后扩散→无定价）与传导断裂原因（出口占比分母过小），快速判断是否有必要写正式档。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 政策驱动</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>鸿路钢构</b><span class=\"code\">002541</span><span class=\"tag\">对澳出口占比极低</span><span class=\"cap\">18.28 元 · 流通 93 亿 · 9/16 +0.61%</span></div>\n    <div class=\"logic\">钢结构制造龙头 · 不在链上</div>\n    <div class=\"detail\">国内钢结构制造龙头，但业务以国内工程与装配式建筑为主，海外收入占比低且集中在东南亚与中东的工程项目。9/16 +0.61%、成交 1.35 亿，与该终裁无因果关系。列入观察仅为记录行业状态，不构成映射。</div>\n    \n    \n    <div class=\"risk\">⚠️ 若以「钢结构概念」映射本事件将产生方向性误判——反倾销是利空型事件</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>精工钢构</b><span class=\"code\">600496</span><span class=\"tag\">低价小盘，异动与事件无关</span><span class=\"cap\">3.27 元 · 流通 65 亿 · 9/16 +2.19%</span></div>\n    <div class=\"logic\">钢结构工程 · 不在链上</div>\n    <div class=\"detail\">主营钢结构工程总承包，低价（3.27 元）小盘（流通 65 亿）。9/16 +2.19%、成交 1.10 亿，涨幅居钢构方向首位但与本终裁无因果关系——其海外业务为 EPC 项目制，不涉及建材单品出口。</div>\n    <div class=\"gene\">🧬 题材基因：低价钢构小盘，历次装配式建筑/基建政策主题中作为末端补涨票出现</div>\n    \n    <div class=\"risk\">⚠️ 低价小盘题材异动频繁，容易与本事件产生虚假关联</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2024-2025 澳大利亚对华多次反倾销（铝型材、钢格栅、风电塔筒）：税率区间普遍在 10%-40%，本案 33.3%-37.8% 处于区间上沿</li><li>2023 欧盟对华钢制紧固件反倾销：A 股相关标的当日无明显反应——小品类反倾销对 A 股定价影响的历史经验是「无反应」</li><li>历史规律：A 股对反倾销事件的定价只发生在「涉案品类占上市公司收入 10% 以上」的情形，低于此阈值一律不定价</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>（本档无合格主攻标的）</b><span class=\"code\">—</span><span class=\"tag\">A 股无主营轻型钢螺柱的上市公司</span></div>\n    <div class=\"logic\">产业地位 | — | 弹性来源 | — | 约束条件 | 出口主体为非上市中小建材厂</div>\n    <div class=\"detail\">这是本档与其他档案最大的不同：coreLinks 里没有标的，而是明确的「无」。轻型钢螺柱与轨道属于轻钢龙骨建筑体系的辅材，中国出口主体集中在河北文安等产业集群的中小建材厂，涉案的文安县凯泽建材即为非上市公司。A 股钢结构上市公司的业务模式是工程总承包与重型钢构加工，与建材单品出口是完全不同的两个市场。按 v6 规则，宁可明确写「无合格主攻」，也不硬凑一个只沾边的标的——这比强行映射一个「钢结构概念股」更诚实。</div>\n    \n    <div class=\"confirm\">✔ 确认：出现 A 股上市公司公告对澳出口轻型钢螺柱收入占比超 5%</div>\n    <div class=\"risk\">⚠️ 若强行以「钢结构概念」映射，将产生方向性错误：本事件是利空型，概念映射会误判为利好</div>\n  </div></div></div>\n    \n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>鸿路钢构 / 精工钢构 / 东南网架 / 杭萧钢构 / 富煌钢构</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">均为钢结构工程与制造，海外业务以 EPC 项目制为主，与轻钢龙骨辅材的单品出口是两个市场；对澳出口占比趋近于零，税率 × 占比 ≈ 0</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>把反倾销当作「供给侧利好」的通用推演</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">反倾销的受益方是进口国（澳大利亚）本土厂商，对出口国（中国）是利空。档案库中「涨价/减产 → 上游受益」的模板不能套用在反倾销事件上，方向相反</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>富煌钢构 9/16 +8.42% 与本事件的关联</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">富煌钢构主营重型钢结构工程、对澳出口占比极低，当日 +8.42% 更可能来自其他题材；在无证据的情况下建立因果关联属强行映射</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**降档·题材催化级**：供给冲击型框架成立（税率 33.3%-37.8% 够硬），但 A 股映射缺失。基准参照：2023 年欧盟对华钢制紧固件反倾销，A 股相关标的当日无反应——小品类反倾销的历史经验是「不定价」。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">**本档无合格主攻标的**。按 v6 规则，宁可明确写「无」也不硬凑只沾边的标的：A 股钢结构上市公司是 EPC 工程制，与建材单品出口是两个市场。若强行映射，方向还会搞反（反倾销是利空型）。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">无。9/16 钢构方向的精工钢构 +2.19%、富煌钢构 +8.42% 均与本事件无因果关系，强行关联会产生虚假信号。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若出现 A 股公司公告对澳出口轻型钢螺柱收入占比超 5% → 本档可由降档升级为正式档并补写主攻标的。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① A 股公司公告对澳出口占比超 5% ② 澳方日落复审或新出口商复审调整税率 ③ 出现更大规模对华反倾销可作对照 ④ 澳本土厂商公开表示受益。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 日落复审后税率大幅下调或取消 ② 品类被证实完全小众、无后续报道 ③ 出口商通过转口规避、实际影响可忽略。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">本档是档案库里第一份**没有主攻标的**的档案，这是刻意的。反倾销的受益方在澳大利亚，A 股是受损方一侧，而受损方又都是非上市中小厂——用「涨价→上游受益」的模板去套它，方向会完全搞反（这是利空型事件，不是利好型）。收录它的价值在于建立基准：33%-38% 的税率区间、9月公告→盘后扩散→无定价的节奏，为后续钢铁/铝/光伏等大品类反倾销提供对照。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>情景推演</h2>\n    <div style=\"font-size:12px;color:var(--dim);margin-bottom:8px\">每个分支为可观察的条件树——触发条件兑现后的逻辑状态与验证信号，互斥且可证伪。不含操作建议。</div>\n    <div class=\"scen\"><div class=\"sc\"><div class=\"br\">▸ 维持记录基准（基准情形）</div><div class=\"tg\">触发：<b>A 股始终无对应标的 / 无后续报道</b></div><div class=\"ls\">逻辑状态：<b>本档作为「贸易摩擦·反倾销」主线的首个样本留存，为后续大品类事件提供税率与节奏对照</b></div><div class=\"fs\">观察信号：<b>后续出现规模更大的对华反倾销时，本档被引用为 relatedCases</b></div></div><div class=\"sc\"><div class=\"br\">▸ 升级为正式档</div><div class=\"tg\">触发：<b>A 股公司公告对澳出口占比超 5% / 出现更大规模反倾销且 A 股有明确标的</b></div><div class=\"ls\">逻辑状态：<b>传导链第三环（业绩）被打通，可补写主攻标的并升为正式档</b></div><div class=\"fs\">观察信号：<b>相关公司公告或互动平台确认对澳出口收入占比</b></div></div><div class=\"sc\"><div class=\"br\">▸ 基准失效</div><div class=\"tg\">触发：<b>日落复审大幅下调或取消税率 / 出口商通过转口完全规避</b></div><div class=\"ls\">逻辑状态：<b>33.3%-37.8% 不再是可参照的税率区间，本档记录价值归零</b></div><div class=\"fs\">观察信号：<b>澳方公告复审结果</b></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>出现 A 股上市公司公告对澳出口轻型钢螺柱或轻钢龙骨收入占比超 5%（届时本档可升级为正式档）</b></li><li><b>澳方发起日落复审或新出口商复审，税率出现调整</b></li><li><b>同期出现规模更大的对华反倾销（钢铁、铝、光伏），本档税率区间成为对照基准</b></li><li><b>澳大利亚本土轻钢龙骨厂商公开表示受益（佐证受益方在境外）</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>日落复审后税率大幅下调或取消——本档的税率基准失效</b></li><li><b>涉案品类被证实为完全无关紧要的小众产品，无任何后续报道——记录价值归零</b></li><li><b>中国出口商通过转口或第三国组装规避，实际影响被证实可忽略</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">中国贸易救济信息网的后续对华反倾销公告（尤其钢铁、铝、光伏、新能源车）</div><div class=\"wy\">本档的核心价值是作为后续大品类事件的对照基准</div></div><div class=\"tkc\"><div class=\"w\">5 年后</div><div class=\"wh\">日落复审时点与结果</div><div class=\"wy\">33.3%-37.8% 税率的存续期</div></div><div class=\"tkc\"><div class=\"w\">不定期</div><div class=\"wh\">新出口商复审申请与裁定</div><div class=\"wy\">未涉案企业获得单独税率的途径，也是税率区间变动的来源</div></div></div>\n\n    <div class=\"src\">数据来源：中国贸易救济信息网（澳大利亚反倾销委员会第 2026/119 号公告，9/15）· 东财快讯 9/16 16:03 · 东财快讯同期印度对华连二亚硫酸钠反倾销裁决 · 腾讯自选股 9/16 收盘行情（钢结构方向）</div>\n    <footer>澳洲对华轻型钢螺柱反倾销终裁 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "huawei-3d-datacenter", "title": "华为发布全球首个3D数据中心", "date": "2026-09-16", "grade": "降档", "pricing": "已定价", "crate": "warn", "search": "华为发布全球首个3d数据中心 芜湖落地四层垂直堆叠架构 · 供电距离 17m→5m、it 供电容量 76mw→168mw · 单栋机房支撑十万卡昇腾超节点集群 · 十万卡超节点 2027 年成基础配置 产业周期 ⚠ 题材催化级 · 板块已爆发一波，预期差已被抹平", "card": "<a class=\"card-c\" href=\"#huawei-3d-datacenter\" data-search=\"华为发布全球首个3d数据中心 芜湖落地四层垂直堆叠架构 · 供电距离 17m→5m、it 供电容量 76mw→168mw · 单栋机房支撑十万卡昇腾超节点集群 · 十万卡超节点 2027 年成基础配置 产业周期 ai算力与电力配套 已定价 英维克 浪潮信息 海光信息 同飞股份 高澜股份\" data-grade=\"降档\" data-pricing=\"已定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-16</span>\n    <span class=\"crate warn\">⚠ 题材催化级 · 板块已爆发一波，预期差已被抹平 产业周期</span>\n  </div>\n  <div class=\"ctitle\">华为发布全球首个3D数据中心</div>\n  <div class=\"csub\">芜湖落地四层垂直堆叠架构 · 供电距离 17m→5m、IT 供电容量 76MW→168MW · 单栋机房支撑十万卡昇腾超节点集群 · 十万卡超节点 2027 年成基础配置</div>\n  <div class=\"cpos\">华为 3D 数据中心落地芜湖，单栋 168MW 支撑十万卡昇腾超节点；但 9/16 CPO/光模块已集体爆发，预期差当日被抹平。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">AI算力与电力配套</span>\n    <span class=\"chip down\">⚑ 降档</span>\n    <span class=\"chip pri\">已定价</span>\n    <span class=\"chip\">标的 6</span>\n    <span class=\"nm\">英维克</span><span class=\"nm\">浪潮信息</span><span class=\"nm\">海光信息</span><span class=\"nm\">同飞股份</span><span class=\"nm\">高澜股份</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-16 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-16</div>\n    <h1>华为发布全球首个3D数据中心</h1>\n    <div class=\"sub\">芜湖落地四层垂直堆叠架构 · 供电距离 17m→5m、IT 供电容量 76MW→168MW · 单栋机房支撑十万卡昇腾超节点集群 · 十万卡超节点 2027 年成基础配置</div>\n    <div class=\"badges\">\n      <span class=\"badge warn\">⚠ 题材催化级 · 板块已爆发一波，预期差已被抹平</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：已定价</span>\n      <span class=\"badge neutral\">主线：AI算力与电力配套</span>\n      <span class=\"badge gradedown\">⚑ 降档入库 · 只配情绪波段，不格局中线</span>\n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">deepseek-chain</span><span class=\"tag\" style=\"margin-right:4px\">gas-turbine-aidc-orders</span><span class=\"tag\" style=\"margin-right:4px\">ai-compute-hike</span><span class=\"tag\" style=\"margin-right:4px\">optical-chip-shortage</span><span class=\"tag\" style=\"margin-right:4px\">mlcc-murata-eol</span><span class=\"tag\" style=\"margin-right:4px\">intel-cpu-price-hike</span><span class=\"tag\" style=\"margin-right:4px\">power-semi-hike3</span></div>\n    <div class=\"posnote\">华为 3D 数据中心落地芜湖，单栋 168MW 支撑十万卡昇腾超节点；但 9/16 CPO/光模块已集体爆发，预期差当日被抹平。</div>\n    <details class=\"more\"><summary>展开定价状态详版（393 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化发生在 9/15 下午（2026 AIDC 产业发展大会暨 3D 数据中心现场会，安徽芜湖），9/15 晚间媒体扩散，9/16 盘中 A 股算力链集体爆发：光迅科技<strong>涨停 +10%</strong>、长光华芯 +9.66%、仕佳光子 +9.49%、太辰光 +6.17%、新易盛 +6.72%、华工科技 +5.77%、寒武纪 +5.60%、中际旭创 +5.07%、海光信息 +4.67%、浪潮信息 +3.48%。同日创业板 +1.96%、科创芯片 ETF 盘中涨超 3%。也就是说，这条催化的定价窗口在 9/16 开盘后一个小时内就基本关闭了。<strong>本档按 v6「降档入库」机制收录</strong>——判据只通过「有精确数字」（168MW/十万卡/5000 倍）一条，「有预期差」不成立（已爆发），故评级为题材催化级，明确标注：本条只配情绪波段，不格局中线。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">① 核心事实 · 架构创新的四层堆叠</b><div class=\"v\">华为在芜湖建成全球首个 3D 数据中心，借鉴芯片工厂「动力层」与「生产层」严格分离的理念，把传统水平铺开的功能空间垂直叠加，形成从下往上的<strong>供冷层 / IT 设备层 / 供电层 / 备电层</strong>四层架构，锂电池模块与冷却塔独立部署在屋顶（华为官网 2026-09-16 新闻、澎湃新闻现场报道）。</div></div><div class=\"card fact\"><b class=\"k\">② 三组可量化的硬变化</b><div class=\"v\">供电路径：电力模块至机柜的供电距离由 <strong>17 米缩短至 5 米</strong>；IT 供电容量由 <strong>76MW 提升至 168MW</strong>；单栋机房即可支撑「十万卡昇腾超节点集群的超级算力工厂」，PUE 达行业领先水平。建设范式：从「工地建造」转向「工厂预制、现场装配」，<strong>机电交付时间减半</strong>（传统机电交付周期约 6 个月）。</div></div><div class=\"card fact\"><b class=\"k\">③ 需求端 · 华为给出的算力数字</b><div class=\"v\">华为副董事长、轮值董事长汪涛：未来十年全社会算力总量预计增长 <strong>10 万倍</strong>；中国 Token 日均消耗从 2024 年初的千亿级增长到 2026 年的日均约 <strong>500 万亿</strong>，增幅接近 5000 倍；<strong>十万卡以上的昇腾超节点集群 2027 年将成为基础配置</strong>。机柜功率已从风冷时代的几千瓦攀升至 100kW、200kW。</div></div><div class=\"card fact\"><b class=\"k\">④ 产业扩散 · 开放而非独享</b><div class=\"v\">华为开放机房模型、标准化图纸与方案，全球计算联盟联合中国电子技术标准化研究院、中国电子院、秦淮数据等数十家伙伴发起共建新一代 AIDC 范式倡议。华为云 CEO 周跃峰明确表示「不怕竞争，关键是先把产业蛋糕做大」，并以 5G 国际标准化带来产业正循环为例。华为云已在<strong>芜湖、贵安、和林格尔</strong>部署三大云核心枢纽匹配东数西算。</div></div><div class=\"card fact warn\"><b class=\"k\">⑤ 争议点 · 参考架构 ≠ 订单</b><div class=\"v\">这是本档最关键的一层：华为发布的是<strong>参考架构与开放的图纸库</strong>，不是一份采购合同。开放意味着任何集成商、机房厂商都可参照建设，龙头公司拿不到排他性订单。同时机柜功率升至 100-200kW 对供电、散热、运维提出系统性要求，但国内具备 168MW 级单机房交付能力的厂商屈指可数——<strong>产业蛋糕做大与单个公司业绩兑现之间存在时间差与能力门槛</strong>。</div></div><div class=\"card fact\"><b class=\"k\">⑥ 盘面验证 · 9/16 已爆发</b><div class=\"v\">9/16 收盘：光迅科技 <strong>+10.00%（涨停）</strong>成交 74.05 亿、长光华芯 +9.66%（成交 41.20 亿、换手 7.20%）、仕佳光子 +9.49%（换手 5.81%）、太辰光 +6.17%（换手 10.91%）、新易盛 +6.72%、华工科技 +5.77%、中际旭创 +5.07%、源杰科技 +3.90%；算力芯片寒武纪 +5.60%（成交 149.67 亿）、海光信息 +4.67%、浪潮信息 +3.48%。液冷/温控同步走强：英维克 +3.66%、同飞股份 +4.47%、申菱环境 +4.39%、高澜股份 +3.24%。同日上证 +0.71%、创业板 +1.96%。<strong>全链无一只下跌，属典型涨停潮式定价</strong>。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-15</div><div><div class=\"x\">2026 AIDC 产业发展大会在芜湖举行，华为发布全球首个 3D 数据中心，同步发行《3D数据中心》专著并开放《3D数据中心概要设计图库》</div><div class=\"y\">为什么：本主线的第一段催化：把 AI 数据中心从「工地建造」推向「工厂预制、现场装配」的范式跃迁</div></div></div><div class=\"u\"><div class=\"w\">2026-09-16</div><div><div class=\"x\">科创芯片 ETF 涨超 3%，CPO/光模块集体爆发；同期电子信息制造业「十五五」规划发布、第 27 届光博会开幕（超 4000 家企业、观众近 19 万人同比 +32%）</div><div class=\"y\">为什么：三重催化叠加导致当日一次性定价完成，本档因此按降档处理</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">① <strong>分水岭时点是「十万卡成为基础配置」的 2027 年</strong>，而不是发布会当天。华为把 2027 年定义为十万卡超节点的基础配置元年，这意味着真正的建设高峰在明年；9/16 的涨停潮定价的是叙事，不是订单。<br>② <strong>传导的关键约束是「开放架构」这四个字</strong>。华为开放图纸与标准化方案的直接后果是：没有排他性订单，没有任何一家公司能独占这波增量。参照 5G 标准化的历史经验，产业正循环会带来整体扩容，但单个公司的份额取决于交付能力与成本控制，而非概念归属。这决定了本条只适合作为<strong>情绪波段</strong>而非中线逻辑。<br>③ <strong>待验证的核心变量是机电交付能力与订单落地</strong>。168MW 单机房、100-200kW 机柜功率对供电与液冷是硬性门槛，国内能交付的厂商有限。真正的验证不是股价，而是谁拿到 3D 数据中心的实际建设订单、谁的液冷与垂直供冷产品进入华为三大枢纽（芜湖/贵安/和林格尔）的供应链。<br><strong>隐藏面</strong>：本档是 AI 算力与电力配套主线的<strong>需求侧</strong>证据，与 gas-turbine-aidc-orders（燃机订单 38GW）、ai-compute-hike（云厂商提价）构成三角验证——三者共同指向 AI 资本开支仍在加速。但三者中只有燃机订单有季度数据可跟踪，云提价与 3D 数据中心都停留在叙事层面。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>华为芜湖 3D 数据中心落成，四层垂直架构，供电距离 17m→5m、容量 76MW→168MW</li><li>十万卡昇腾超节点集群 2027 年成为基础配置，机柜功率升至 100-200kW</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强</span><ul><li>机电交付时间减半，数据中心从定制工程变为可批量复制的标准产品</li><li>Token 日均消耗 5000 倍增长、算力总量十年 10 万倍的判断支撑长期需求</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">存疑</span><ul><li>华为开放参考架构与图纸库，无排他性订单，产业蛋糕做大 ≠ 单个公司业绩兑现</li><li>168MW 级交付能力门槛高，国内具备该能力的厂商有限，订单集中度高但归属未定</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">已透支</span><ul><li>9/16 CPO/光模块集体爆发，光迅科技涨停、长光华芯 +9.66%、仕佳光子 +9.49%</li><li>全链无一只下跌，属典型涨停潮式定价，当日预期差已被完全抹平</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强、业绩存疑、股价已透支——架构创新是真的，但开放架构决定了业绩无法独占，而股价已经在一天内把叙事定价完毕。</div>\n    <ul class=\"assess\"><li>闭合度 50%。前两环（变化→影响）充分成立且有可量化数据，后两环（业绩→股价）断裂：业绩环因开放架构无法归属独家订单，股价环在 9/16 单日完成定价。</li><li>边界：受益端是具备 168MW 级机电交付能力、液冷与垂直供冷产品的厂商；受损端/无关方是仅挂「数据中心概念」而无实际交付能力的公司，以及把本轮涨价的 CPO 光模块与 3D 数据中心**架构创新**混为一谈的推演——光模块受益于十万卡集群的互联需求（间接），而非四层堆叠架构本身（无直接关系）。</li><li>主线联动：与 deepseek-chain（昇腾订单）、gas-turbine-aidc-orders（燃机 38GW）、ai-compute-hike（云提价）同属「AI算力与电力配套」主线。本档是该主线的<strong>需求侧叙事补充</strong>，与燃机订单的季度数据形成「叙事 vs 数据」的对照——叙事端（本档、云提价）已充分定价，数据端（燃机订单）仍有跟踪价值。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·产业映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>英维克</b><span class=\"code\">002837</span><span class=\"tag\">功率密度跃升最硬受益环节</span><span class=\"cap\">62.03 元 · 流通 704 亿 · 9/16 +3.66%</span></div>\n    <div class=\"logic\">温控液冷龙头</div>\n    <div class=\"detail\">全链条自研的温控龙头，机柜功率升至 100-200kW 使液冷由可选变必选。本档传导最硬的一环——不依赖华为订单，只依赖功率密度上升。9/16 涨幅弱于光模块，说明主战场在光互联。</div>\n    \n    \n    <div class=\"risk\">⚠️ 液冷赛道竞争者增多，价格战侵蚀毛利</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>浪潮信息</b><span class=\"code\">000977</span><span class=\"tag\">超节点需求的确定性载体</span><span class=\"cap\">71.15 元 · 流通 1044 亿 · 9/16 +3.48%</span></div>\n    <div class=\"logic\">AI 服务器龙头</div>\n    <div class=\"detail\">十万卡超节点基础配置化直接扩大服务器需求，价值在确定性而非弹性——不论谁的数据中心都要采购。但服务器毛利率长期偏低，量的增长未必同步转化为利润。</div>\n    \n    \n    <div class=\"risk\">⚠️ 毛利率偏低（行业普遍 5-10%），增收不增利风险</div>\n  </div></div><div class=\"t\">🏛️ 容量中军 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>海光信息</b><span class=\"code\">688041</span><span class=\"tag\">算力主线的容量与方向标</span><span class=\"cap\">235.09 元 · 流通 5464 亿 · 9/16 +4.67%</span></div>\n    <div class=\"logic\">国产算力芯片 · 指数锚</div>\n    <div class=\"detail\">国产服务器 CPU/DCU 龙头，流通市值 5464 亿，是 AI 算力主线的指数锚。3D 数据中心服务的是昇腾超节点，与海光无直接供应关系，但算力总量十年 10 万倍的判断支撑整个国产算力板块。9/16 +4.67%、成交 45.03 亿。</div>\n    \n    \n    <div class=\"risk\">⚠️ 与 3D 数据中心无直接业务关系，属主线共振而非逻辑受益</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>同飞股份</b><span class=\"code\">300990</span><span class=\"tag\">温控方向弹性最大</span><span class=\"cap\">89.90 元 · 流通 74 亿 · 9/16 +4.47%</span></div>\n    <div class=\"logic\">液冷小盘</div>\n    <div class=\"detail\">工业温控与液冷设备供应商，流通市值仅 74.48 亿。9/16 +4.47%、换手 9.26%，换手率显著高于龙头英维克（3.18%），属典型资金末端选择。</div>\n    <div class=\"gene\">🧬 题材基因：液冷/温控小盘，2025 年以来多次在算力热管理主题中充当末端补涨票</div>\n    \n    <div class=\"risk\">⚠️ 流通盘小、客户集中，业绩波动大</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>高澜股份</b><span class=\"code\">300499</span><span class=\"tag\">换手 13.41% 的高活跃标的</span><span class=\"cap\">38.18 元 · 流通 104 亿 · 9/16 +3.24%</span></div>\n    <div class=\"logic\">液冷与纯水冷却</div>\n    <div class=\"detail\">主营纯水冷却与液冷设备，9/16 +3.24%、换手高达 13.41%，是全链换手最活跃的标的之一，筹码交换极为频繁。流通市值 103.75 亿。</div>\n    <div class=\"gene\">🧬 题材基因：水冷老题材票，历次算力液冷主题中反复被资金启用，持续性弱于龙头</div>\n    \n    <div class=\"risk\">⚠️ 换手率过高意味着筹码不稳，题材退潮时回撤快</div>\n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>光迅科技</b><span class=\"code\">002281</span><span class=\"tag\">但属互联需求受益，非架构创新受益</span><span class=\"cap\">185.21 元 · 流通 1456 亿 · 9/16 +10.00%（涨停）</span></div>\n    <div class=\"logic\">当日 CPO/光模块涨停龙头</div>\n    <div class=\"detail\">9/16 涨停 +10%、成交 74.05 亿、换手 5.24%，是当日算力链最强标的。但要明确：光模块受益于十万卡集群的**互联需求**，与 3D 数据中心的四层堆叠架构本身无直接关系——本档将其列为情绪龙而非主攻，正是因为它代表的是板块热度而非本档逻辑。</div>\n    <div class=\"gene\">🧬 题材基因：光模块老龙头，2023 年以来历次算力行情的第一落点，兼具容量与情绪属性</div>\n    \n    <div class=\"risk\">⚠️ 9/16 已涨停，属已定价区间；且与本档架构创新逻辑仅间接相关</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2023-03 华为发布 AI 数据中心解决方案：当时 A 股算力链 3 日累计涨幅超 20%，随后 2 周回吐 60%——参考架构类发布会的定价窗口通常为 1-3 日</li><li>2025-09 昇腾 910C 订单传闻：板块 3 日内冲高后回落 12%，官方未确认的订单类催化退潮速度快于落地类</li><li>5G 标准化历史经验（华为周跃峰本人引用）：国际标准化带来产业正循环与整体扩容，但单个公司份额取决于交付能力与成本，而非标准归属</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>英维克</b><span class=\"code\">002837</span><span class=\"tag\">温控/液冷龙头 · 直接受益机柜功率跃升</span></div>\n    <div class=\"logic\">产业地位 | 国内数据中心温控与液冷龙头，全链条自研 | 弹性来源 | 机柜功率从几 kW 升至 100-200kW，液冷从可选项变为必选项 | 约束条件 | 9/16 已 +3.66%，且行业竞争者众，价格战风险</div>\n    <div class=\"detail\">英维克是数据中心温控领域少有的全链条自研厂商，产品覆盖机房温控、液冷冷板与 CDU。3D 数据中心把机柜功率推到 100-200kW，风冷在这一功率段已接近物理极限，液冷从「可选项」变为「必选项」——这是本档传导最硬的一环，不依赖华为是否给订单，只依赖功率密度是否继续上升。公司流通市值 704 亿，是温控方向容量最大的标的。9/16 上涨 3.66%、成交 22.08 亿，涨幅明显小于光模块，说明资金当日的主战场在光互联而非温控。风险在于液冷赛道参与者快速增加，价格战可能侵蚀毛利率。</div>\n    \n    <div class=\"confirm\">✔ 确认：液冷产品进入华为三大枢纽（芜湖/贵安/和林格尔）供应链，或公告 3D 数据中心相关订单</div>\n    <div class=\"risk\">⚠️ 温控行业竞争者增多，价格战风险；且 9/16 涨幅已部分反映预期</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>浪潮信息</b><span class=\"code\">000977</span><span class=\"tag\">AI 服务器龙头 · 超节点直接载体</span></div>\n    <div class=\"logic\">产业地位 | 国内 AI 服务器出货量第一，超节点集成核心供应商 | 弹性来源 | 十万卡超节点成为基础配置直接扩大服务器需求 | 约束条件 | 9/16 +3.48% 成交 49.39 亿，涨幅弱于光模块；服务器毛利率长期偏低</div>\n    <div class=\"detail\">浪潮信息是国内 AI 服务器出货量第一的厂商，十万卡超节点集群的基础配置化对它是最直接的需求拉动——超节点本质上是把大量服务器通过高速互联组成一个逻辑单元，服务器数量与互联复杂度同步上升。3D 数据中心的分区隔离、垂直供电设计也是为超节点服务的。但要注意：服务器是低毛利业务（行业普遍 5-10%），量的增长对利润的拉动弱于光模块等高毛利环节。9/16 上涨 3.48%、成交 49.39 亿、换手 4.77%，在算力链中属中游水平。它的价值在于确定性而非弹性——不管谁的数据中心，服务器都要买。</div>\n    \n    <div class=\"confirm\">✔ 确认：超节点服务器订单公告，或三季报显示 AI 服务器收入占比继续提升</div>\n    <div class=\"risk\">⚠️ 服务器毛利率长期偏低，量的增长未必转化为利润的同步增长</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>申菱环境</b><span class=\"code\">301018</span><span class=\"tag\">数据中心液冷与专用空调</span></div>\n    <div class=\"logic\">数据中心专用空调与液冷产品供应商，受益于 168MW 单机房的散热需求</div>\n    <div class=\"detail\">申菱环境主营专用空调与数据中心液冷产品，3D 数据中心的分区散热、差异化控温设计要求按不同温度需求分区管理，直接利好具备定制化温控能力的厂商。9/16 +4.39%、成交 13.26 亿、换手 4.71%，在温控方向中弹性居中。流通市值 286.56 亿。</div>\n    \n    \n    <div class=\"risk\">⚠️ 温控赛道同质化竞争，且项目制收入确认节奏不稳定</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>同飞股份</b><span class=\"code\">300990</span><span class=\"tag\">液冷与工业温控 · 小盘</span></div>\n    <div class=\"logic\">液冷设备供应商，机柜功率密度跃升的直接受益方</div>\n    <div class=\"detail\">同飞股份主营工业温控与液冷设备，流通市值仅 74.48 亿，是温控方向弹性最大的品种之一。9/16 +4.47%、换手 9.26%，换手率显著高于英维克（3.18%），属资金末端选择。它的价值在于小盘弹性，风险在于客户集中度高、业绩波动大。</div>\n    \n    \n    <div class=\"risk\">⚠️ 流通盘小、客户集中，业绩波动大</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>把 CPO/光模块暴涨归因为 3D 数据中心架构</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">光模块受益于十万卡集群的互联需求（间接），与四层垂直堆叠的供电/散热架构创新（直接）无因果关系；9/16 涨停是光博会+十五五规划+算力叙事三重共振的结果</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>仅挂「数据中心概念」而无 168MW 级交付能力的公司</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">3D 数据中心的门槛在机电交付能力（168MW 单机房、100-200kW 机柜），概念归属不等于交付能力，华为开放图纸后竞争焦点是成本与工期</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>华为未上市供应链的「影子股」推演</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">华为明确开放模型与图纸、联合数十家伙伴共建，不存在独家供应商；以「华为概念」直接推导订单归属缺乏证据</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**题材催化级**（v6 降档）：架构创新是真的，但开放架构决定业绩无法独占，且 9/16 已涨停潮式定价。基准参照：2023 年华为 AI 数据中心方案发布后算力链 3 日涨 20%、2 周回吐 60%。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">英维克 ＞ 浪潮信息 ＞ 申菱环境。排序理由：按「不依赖华为订单也能成立」排序——功率密度上升对液冷是硬需求（英维克），服务器是确定性载体但毛利低（浪潮），申菱居中。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">光迅科技（涨停，但属互联需求非架构受益）＞ 同飞股份 ＞ 高澜股份。gene：高澜换手 13.41% 属典型水冷老题材票，历次液冷主题反复被启用但持续性弱。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若液冷厂商公告 3D 数据中心订单**且**其他厂商跟进发布立体方案 → 逻辑状态由「单点参考架构」升为「全行业范式转变」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 液冷/供冷厂商进入三大枢纽供应链 ② 其他厂商跟进立体方案 ③ 2027 年前出现第二个十万卡落地案例 ④ 机电交付周期减半获项目数据验证。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 1 个月内无任何 3D 相关订单公告 ② 行业仍沿用 2D 方案 ③ 机柜功率停留在 100kW 以下、液冷未成必选 ④ AI 资本开支放缓（与燃机订单共振证伪）。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">两个坑。第一，**华为开放了图纸**——这意味着没有独家订单，谁都能建，产业蛋糕做大不等于任何一家公司能独占，这是本档判为降档的核心原因。第二，**9/16 涨停的光模块与本档逻辑无关**：光迅涨停受益的是十万卡集群的互联需求与光博会热度，不是四层堆叠架构。本档真正的受益环节是液冷与垂直供冷（机柜 100-200kW 使液冷成为必选），而它们当日涨幅（英维克 +3.66%）明显弱于光模块——真正相关的没涨，涨的不是真正相关的。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>情景推演</h2>\n    <div style=\"font-size:12px;color:var(--dim);margin-bottom:8px\">每个分支为可观察的条件树——触发条件兑现后的逻辑状态与验证信号，互斥且可证伪。不含操作建议。</div>\n    <div class=\"scen\"><div class=\"sc\"><div class=\"br\">▸ 全行业范式转变</div><div class=\"tg\">触发：<b>其他厂商（浪潮/秦淮数据/第三方 IDC）跟进发布立体堆叠方案 / 液冷厂商公告 3D 相关订单</b></div><div class=\"ls\">逻辑状态：<b>3D 从华为单点实践变为行业标准，机电交付周期减半得到验证，液冷与垂直供冷成为新建 AIDC 的默认配置</b></div><div class=\"fs\">观察信号：<b>出现第二个十万卡超节点集群的公开落地案例；液冷厂商订单公告增多</b></div></div><div class=\"sc\"><div class=\"br\">▸ 停留在参考架构</div><div class=\"tg\">触发：<b>发布会后 1 个月内无任何订单公告 / 行业仍沿用 2D 建设方案</b></div><div class=\"ls\">逻辑状态：<b>3D 被确认为华为自用的技术展示，成本或运维复杂度阻碍推广；本轮涨停潮被证实为纯情绪定价</b></div><div class=\"fs\">观察信号：<b>算力链成交萎缩、光模块回吐 9/16 涨幅；无厂商跟进立体方案</b></div></div><div class=\"sc\"><div class=\"br\">▸ AI 资本开支放缓（共振证伪）</div><div class=\"tg\">触发：<b>燃机订单环比回落（gas-turbine-aidc-orders）/ 云厂商资本开支指引下调（ai-compute-hike）/ 英特尔涨价落空（intel-cpu-price-hike）</b></div><div class=\"ls\">逻辑状态：<b>AI 基础设施投资进入平台期，十万卡 2027 年成为基础配置的判断被推迟</b></div><div class=\"fs\">观察信号：<b>AI 算力主线四份档案的验证信号同时转弱</b></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>液冷/垂直供冷厂商公告 3D 数据中心相关订单，或进入芜湖/贵安/和林格尔三大枢纽供应链</b></li><li><b>其他厂商跟进发布 3D/立体数据中心方案（全行业范式转变而非华为单点）</b></li><li><b>2027 年前出现第二个十万卡昇腾超节点集群的公开落地案例</b></li><li><b>机电交付周期实际减半得到项目数据验证（对照传统约 6 个月）</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>发布会后 1 个月内无任何厂商公告 3D 架构相关订单——参考架构停留在纸面</b></li><li><b>行业普遍沿用传统 2D 建设方案，立体堆叠因成本或运维复杂度未被采纳</b></li><li><b>机柜功率密度增速放缓（停留在 100kW 以下），液冷未成为必选项</b></li><li><b>AI 资本开支出现放缓信号（与 gas-turbine-aidc-orders 的燃机订单数据共振证伪）</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">未来 1 个月</div><div class=\"wh\">是否有厂商公告 3D 数据中心相关订单或进入三大枢纽供应链</div><div class=\"wy\">参考架构能否转化为订单是本档唯一的实质检验</div></div><div class=\"tkc\"><div class=\"w\">2026Q4</div><div class=\"wh\">2026Q3 全球燃机订单数据（对照 38GW）</div><div class=\"wy\">与 gas-turbine-aidc-orders 交叉验证 AI 资本开支是否仍在加速</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">机柜功率密度演进（是否突破 200kW）</div><div class=\"wy\">液冷能否成为必选项的决定变量</div></div></div>\n\n    <div class=\"src\">数据来源：华为官网 2026-09-16《华为发布全球首个3D数据中心》· 澎湃新闻 9/15 现场报道（汪涛、任树录、周跃峰表述）· 腾讯新闻/大皖新闻 9/15 芜湖现场会 · 深圳市电子商会 3D 数据中心技术细节（供电距离 17m→5m、76MW→168MW）· 东财快讯 9/16 13:59 半导体芯片密集催化 · 腾讯自选股 9/16 收盘行情</div>\n    <footer>华为发布全球首个3D数据中心 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "innovative-drug-outbound-120b", "title": "创新药出海破1200亿", "date": "2026-09-16", "grade": "正式档", "pricing": "部分定价", "crate": "bolt", "search": "创新药出海破1200亿 国家药监局 9/14 披露 · 年内对外授权总额突破 1200 亿美元、同比 +36% · 首付款规模超百亿美元 · 81 笔已达 2025 全年八成 产业周期 ⚡ 产业兑现级 · 授权方未定价、卖水人已抢跑，定价主体错位", "card": "<a class=\"card-c\" href=\"#innovative-drug-outbound-120b\" data-search=\"创新药出海破1200亿 国家药监局 9/14 披露 · 年内对外授权总额突破 1200 亿美元、同比 +36% · 首付款规模超百亿美元 · 81 笔已达 2025 全年八成 产业周期 创新药出海 部分定价 奥浦迈 美迪西 恒瑞医药 药明康德 百济神州\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-16</span>\n    <span class=\"crate bolt\">⚡ 产业兑现级 · 授权方未定价、卖水人已抢跑，定价主体错位 产业周期</span>\n  </div>\n  <div class=\"ctitle\">创新药出海破1200亿</div>\n  <div class=\"csub\">国家药监局 9/14 披露 · 年内对外授权总额突破 1200 亿美元、同比 +36% · 首付款规模超百亿美元 · 81 笔已达 2025 全年八成</div>\n  <div class=\"cpos\">药监局披露年内授权 1200 亿美元（+36%）、首付款超百亿；但 9/16 领涨的是 CXO 卖水人，授权方代表百济神州 A -0.48%。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">创新药出海</span>\n    \n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 9</span>\n    <span class=\"nm\">奥浦迈</span><span class=\"nm\">美迪西</span><span class=\"nm\">恒瑞医药</span><span class=\"nm\">药明康德</span><span class=\"nm\">百济神州</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-16 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-16</div>\n    <h1>创新药出海破1200亿</h1>\n    <div class=\"sub\">国家药监局 9/14 披露 · 年内对外授权总额突破 1200 亿美元、同比 +36% · 首付款规模超百亿美元 · 81 笔已达 2025 全年八成</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 产业兑现级 · 授权方未定价、卖水人已抢跑，定价主体错位</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：创新药出海</span>\n      \n    </div>\n    \n    <div class=\"posnote\">药监局披露年内授权 1200 亿美元（+36%）、首付款超百亿；但 9/16 领涨的是 CXO 卖水人，授权方代表百济神州 A -0.48%。</div>\n    <details class=\"more\"><summary>展开定价状态详版（968 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化由国家药监局在 <strong>9/14</strong> 全国药品安全宣传周启动仪式上发布，<strong>9/16 07:06</strong> 东财以《创新药出海步伐再提速》二次传播并叠加科创板生物制品及 CXO 行业集体业绩说明会（9/15 举行）的产业链出海进展，属<strong>盘后/次日发酵型</strong>。<strong>盘面状态</strong>：9/16 上证 +0.71%、深成 +1.26%、<strong>科创50 +4.14%</strong>（半导体/CPO 主导的科技爆发日），医药生物板块仅 +0.52%、医疗服务 +1.47%——医药<strong>整体缺席当日主线</strong>。链内呈<strong>『卖水人涨、授权方跌』的定价主体错位</strong>：<strong>上游 CXO/耗材领涨</strong>——美迪西 +4.96%（超额 +4.25pct，换手 5.30%）、奥浦迈 +4.39%（+3.68pct，换手 5.37%）、纳微科技 +4.37%（+3.66pct）、昭衍新药 +3.57%（+2.86pct）、凯莱英 +2.98%（+2.27pct）、泰格医药 +1.77%（+1.06pct）；<strong>中游授权方（本催化的直接受益者）几乎全绿或平盘</strong>——恒瑞医药 +0.90%（超额 +0.19pct，换手仅 0.65%）、药明康德 +0.66%（-0.05pct）、<strong>百济神州 A -0.48%（相对科创50 超额 -4.62pct）、港股百济神州 -2.73%、美股 ONC -2.07%</strong>。港股创新药板块<strong>连续第二日回调</strong>：康方生物 -4%、荣昌生物 -2%、信达生物与科伦博泰微跌。A股仅情绪端小票异动：成都先导 +12.30%、艾迪药业 +9.70%、哈药股份 +5.20%。结论：市场<strong>没有按『谁收到授权款』定价，而是按『谁的服务需求增加』定价</strong>——或者说，当日资金主要在做科创板 beta 与 CXO 补涨，<strong>1200 亿美元这个数字本身尚未被定价到 biotech 龙头上</strong>。这是本档案预期差的来源。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">事件本体</b><div class=\"v\">国家药监局 9/14 披露：2026 年以来我国创新药对外授权（License-out）交易总额<strong>突破 1200 亿美元，同比增长 36%</strong>，其中<strong>首付款规模超百亿美元</strong>。市场呈现『单笔平均交易金额稳步增长、首付款金额与占比双双提升、大额交易频频落地』三重特征（国家药监局官微、新华网、中国网转述）。</div></div><div class=\"card fact\"><b class=\"k\">首付款才是硬指标</b><div class=\"v\">2025 全年 157 起交易、总额 1356.55 亿美元，<strong>首付款 70 亿美元</strong>；2026 年尚未走完，首付款已<strong>超 100 亿美元</strong>。对外授权的总金额包含大量里程碑款与销售分成，属于<strong>或有收入</strong>；首付款是<strong>签约即落袋</strong>的现金，且首付款占比提升意味着议价权改善。这是『含金量提升』最可验证的一个数字，也是区分真爆发与虚胖的关键。</div></div><div class=\"card fact\"><b class=\"k\">能力与供给端</b><div class=\"v\">2025 年全国登记新药临床试验达 <strong>2900 多项、同比 +18%</strong>，规模创新高；细胞与基因治疗药物临床试验数量<strong>年增约 30%</strong>。2026 年以来已批准 <strong>59 个创新药、51 个创新医疗器械</strong>上市，其中 <strong>13 个为新机制、新靶点的首创新药</strong>。药监局同步推行『提前介入、一企一策、全程指导、研审联动』与药品试验数据保护制度。供给端的管线密度决定了授权交易不是偶然事件而是<strong>可再生产出</strong>。</div></div><div class=\"card fact\"><b class=\"k\">产业链同步出海</b><div class=\"v\">9/15 科创板业绩说明会披露的可量化进展：奥浦迈 H1 营收 <strong>4.54 亿元、+155.2%</strong>，境外收入 1.66 亿元占约 37%，已进入部分国际大药企供应链；美迪西按中美双报标准执行的项目收入占主营 <strong>22%、同比 +93%</strong>；赛分科技海外收入 <strong>3207.13 万元</strong>，储备 40 多个工业纯化出海项目；纳微科技 8 月主导制定<strong>全球首个液相色谱硅胶填料 ISO 国际标准</strong>，美国特拉华州基地建成后将新增 5 万升年产能。诺唯坦言『增加海外收入占比有效缓解了生命科学行业价格战的影响』。</div></div><div class=\"card fact warn\"><b class=\"k\">争议点：总额 ≠ 到手</b><div class=\"v\">1200 亿美元是<strong>合同潜在总金额（biobucks）</strong>，包含首付款、研发/监管/销售里程碑与销售分成，历史上<strong>绝大多数里程碑款最终不会兑现</strong>。以 2025 年为例：总额 1356.55 亿美元对应首付款仅 70 亿美元，<strong>首付款占比约 5.2%</strong>。此外出海面临地缘政治风险（美国生物安全法案类立法、CFIUS 审查）、海外监管趋严与回款不确定性。把 1200 亿直接理解为收入是错误的读法。</div></div><div class=\"card fact warn\"><b class=\"k\">争议点：授权方反而没涨</b><div class=\"v\">9/16 最能说明问题的一组对照：本催化的<strong>直接受益者应是授权方（biotech）</strong>，但百济神州 A <strong>-0.48%</strong>（相对科创50 +4.14% 的超额为 <strong>-4.62pct</strong>）、港股 -2.73%、美股 ONC -2.07%；恒瑞医药 +0.90%（超额 +0.19pct，换手仅 0.65%）、药明康德 +0.66%（-0.05pct）。反倒是<strong>卖水人</strong>（美迪西 +4.96%、奥浦迈 +4.39%、纳微 +4.37%、昭衍 +3.57%）领涨。港股创新药板块<strong>连续第二日回调</strong>，康方生物 -4%、荣昌生物 -2%。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/16（上证 +0.71%、科创50 +4.14%，科技爆发日）医药生物板块仅 +0.52%、医疗服务 +1.47%，<strong>医药整体缺席当日主线</strong>。链内按<strong>『卖水人 vs 授权方』</strong>而非『受益大小』排序：卖水人全红且高换手——美迪西 +4.96%（换手 5.30%、成交 7.30 亿、年内 +83.32%）、奥浦迈 +4.39%（换手 5.37%、成交 4.17 亿、年内 +37.40%）、纳微科技 +4.37%（换手 2.57%、年内 +70.02%）、昭衍新药 +3.57%（换手 4.12%、成交 11.21 亿、年内 +25.62% 但 20 日 -11.99%）、凯莱英 +2.98%（成交 19.95 亿）、泰格医药 +1.77%；授权方几乎平盘或下跌——恒瑞 +0.90%、药明康德 +0.66%、<strong>百济神州 A -0.48%</strong>。A股情绪端：成都先导 +12.30%、艾迪药业 +9.70%、哈药股份 +5.20%。<strong>当日 91 只涨停中无一创新药/CXO 标的</strong>。结论：本催化在权益端呈<strong>部分定价且主体错位</strong>——资金定价的是『CXO 出海订单可验证』这条支线，而非『1200 亿美元授权』这个本体。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2024 年</div><div><div class=\"x\">中国创新药 License-out（对外授权）交易金额<strong>首次超过 License-in</strong>（引进），被视为行业的关键转折点。</div><div class=\"y\">为什么：主线起点：中国从『买全球管线』转为『卖全球管线』，产业角色发生根本反转。这是后续所有授权金额爆发的制度与能力前提。</div></div></div><div class=\"u\"><div class=\"w\">2025 年</div><div><div class=\"x\">全年完成 <strong>157 起</strong>对外授权交易，总额 <strong>1356.55 亿美元</strong>，首付款 <strong>70 亿美元</strong>；全国登记新药临床试验达 2900 多项、同比 +18%，细胞与基因治疗药物临床试验数量年增约 30%。</div><div class=\"y\">为什么：第一段的量化基准——1200 亿美元这个数字必须对着 1356.55 亿的全年基数读，才知『+36%』的含金量与可持续性。</div></div></div><div class=\"u\"><div class=\"w\">2026-06-30</div><div><div class=\"x\">上半年已完成 <strong>81 笔</strong>对外授权，合同潜在总金额约 <strong>1100 亿美元</strong>，<strong>已超 2025 年全年的 80%</strong>，是 2024 年全年的两倍多。交易覆盖肿瘤、代谢、免疫、神经等 10 个治疗领域，受让企业来自美、英、法、意等 20 个国家和地区。</div><div class=\"y\">为什么：第二段的加速度证据：不是线性增长，是<strong>斜率抬升</strong>。同时受让方国家数达 20 个，说明这不是单一买家的偶发行为。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-14</div><div><div class=\"x\">国家药监局在 2026 年全国药品安全宣传周启动仪式上披露：今年以来对外授权交易总额<strong>突破 1200 亿美元、同比 +36%</strong>，其中<strong>首付款规模超百亿美元</strong>；单笔平均交易金额稳步增长，首付款金额与占比双双提升。同期披露：年内已有 <strong>59 个创新药、51 个创新医疗器械</strong>获批上市，其中 <strong>13 个为新机制、新靶点的首创新药</strong>。</div><div class=\"y\">为什么：第三段的成立点，也是本档案的催化本体。注意<strong>首付款同比的大幅跃升</strong>——2025 全年首付款 70 亿美元，2026 尚未走完已达百亿以上，这是『含金量提升』最硬的证据（首付款是落袋现金，里程碑款是或有收入）。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-15</div><div><div class=\"x\">科创板 2026 年半年度生物制品及 CXO 行业集体业绩说明会：奥浦迈 H1 营收 4.54 亿元、<strong>同比 +155.2%</strong>，境外收入 1.66 亿元占约 37%；美迪西按中美双报标准要求进行的项目收入占主营 22%、<strong>同比 +93%</strong>；赛分科技海外收入 3207.13 万元，累计储备 40 多个工业纯化出海项目；纳微科技 8 月主导制定全球首个液相色谱硅胶填料 ISO 国际标准。</div><div class=\"y\">为什么：产业链段的实证：BD 交易爆发不只落到 biotech 账上，也在向上游<strong>卖水人</strong>传导。这解释了 9/16 为何 CXO 与耗材领涨——它们有可验证的公司级数据，而 biotech 的授权收入确认存在时滞。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这条链的<strong>分水岭时点</strong>是 2024 年——License-out 金额首次超过 License-in，中国从管线买方转为卖方，这决定了 1200 亿美元不是一锤子买卖而是角色反转后的可再生产出。<strong>传导的关键约束</strong>在收入确认结构：1200 亿是合同潜在总额，2025 年首付款占比仅约 5.2%（70 亿/1356.55 亿），真正进利润表的只有首付款与已触发的里程碑；因此『总额 +36%』与『业绩弹性』之间隔着一个巨大的折算系数，这个系数才是定价的核心变量，而市场在 9/16 显然没有去算它。<strong>待验证的核心变量</strong>是首付款的<strong>绝对额与占比能否继续双升</strong>——2026 首付款已超 100 亿美元（超过 2025 全年 70 亿），若这一趋势在 Q4 延续，说明议价权改善是结构性的而非个别大单驱动。<strong>隐藏面</strong>在于受益主体的时滞结构：biotech 收到首付款后要分摊确认、且多数公司仍处于研发投入期，现金改善不等于利润改善；而 CXO/上游耗材的收入是<strong>服务即确认</strong>，奥浦迈 +155.2%、美迪西 +93% 这类数字立刻可验证。<strong>反直觉点</strong>正在于此：9/16 涨的全是有可验证收入的卖水人，跌的恰是拿到授权款的授权方——市场不是在否定这个事件，而是在回避<strong>无法折算的资产</strong>。这提示本链条的真实定价线索可能不在『1200 亿』，而在『哪些公司的海外收入能立刻进报表』。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>国家药监局 9/14 披露：年内对外授权总额突破 1200 亿美元、同比 +36%，首付款超 100 亿美元</li><li>2026H1 已 81 笔、约 1100 亿美元，达 2025 全年 80%；年内 59 个创新药、13 个首创新药获批</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">分化</span><ul><li>上游卖水人已有可验证数据：奥浦迈 H1 营收 +155.2%、境外占 37%；美迪西中美双报收入占 22%、+93%</li><li>授权方收入确认存在时滞：首付款需分摊、里程碑款为或有；2025 年首付款仅占总额约 5.2%</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">已兑现部分</span><ul><li>CXO/耗材端业绩已落地：奥浦迈 4.54 亿营收中境外 1.66 亿、纳微主导首个填料 ISO 国际标准</li><li>biotech 端仍待观察：首付款超百亿但分摊确认，多数公司仍处研发投入期，现金改善≠利润改善</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">主体错位</span><ul><li>9/16 卖水人全红：美迪西 +4.96%、奥浦迈 +4.39%、纳微 +4.37%、昭衍 +3.57%</li><li>授权方平盘或下跌：百济神州 A -0.48%（相对科创50 超额 -4.62pct）、港股 -2.73%；恒瑞 +0.90%、药明康德 +0.66%</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响分化、业绩部分兑现、股价定价主体错位——涨的是卖水人不是授权方，1200 亿美元这个数字本身尚未落到 biotech 龙头上。</div>\n    <ul class=\"assess\"><li>闭合度 65%——『变化』与『业绩』两环在 CXO 端已闭合，但在 biotech 授权方端因收入确认时滞而断裂，这正是 9/16 定价错位的根源。</li><li>边界切分：<strong>可立即验证的是上游卖水人</strong>（奥浦迈、美迪西、纳微、赛分、昭衍、凯莱英）——服务即确认、海外收入占比可量化；<strong>时滞较长的是 biotech 授权方</strong>（百济、恒瑞、信达、康方、荣昌）——首付款需分摊、里程碑为或有；<strong>不同链</strong>是仿制药与中药（不参与全球授权）、医疗器械（51 个获批但授权主体与商业逻辑不同）。判断任一标的只需问一句：<strong>它的海外收入这个季度能不能进报表</strong>。</li><li>主线联动：<strong>创新药出海是新立主线，本档案为该主线第一段</strong>，暂无关联档案。后续若出现『单个大额 BD 交易』『FDA/EMA 获批』『CXO 订单超预期』等催化，应通过 relatedCases 回链本档案形成网络。方法论上与 <strong>australia-steel-stud-antidumping</strong>（贸易摩擦）互为镜像：后者是出口被征税的受损叙事，本档案是出海授权的受益叙事，两者共同刻画中国制造业的全球化定价能力。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>奥浦迈</b><span class=\"code\">688293</span><span class=\"tag\">H1 营收 +155.2%，境外 1.66 亿占约 37%</span><span class=\"cap\">67.05 元 · 流通 78.56 亿 · 9/16 +4.39%</span></div>\n    <div class=\"logic\">境外收入占 37%·最可验证</div>\n    <div class=\"detail\">细胞培养基国产替代龙头，本链条上<strong>传导路径最短、数据最可验证</strong>的样本：H1 营收 4.54 亿元、同比 +155.2%，境外收入 1.66 亿元占约 37%，已进入部分国际大药企供应链。客户管线出海 → 培养基采购同步放量，且收入为<strong>服务即确认</strong>，没有 biotech 那种首付款分摊的折算问题。9/16 收 +4.39%、换手 5.37%、成交 4.17 亿。</div>\n    \n    \n    <div class=\"risk\">⚠️ PE(TTM) 74.38 倍估值偏高；5 日 -5.54% 显示高位分歧；下游 BD 节奏放缓则需求同步回落</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>美迪西</b><span class=\"code\">688202</span><span class=\"tag\">中美双报收入占主营 22%、同比 +93%</span><span class=\"cap\">103.39 元 · 流通 138.91 亿 · 9/16 +4.96%</span></div>\n    <div class=\"logic\">中美双报占 22%·涨幅第一</div>\n    <div class=\"detail\">把<strong>监管合规本身做成产品</strong>的典型：中美双报标准项目收入占主营业务 22%、同比 +93%，已助力多家客户完成海外申报并获批 IND。它的受益逻辑是『申报数量』而非『授权金额』——BD 越多、海外申报需求越大，双报溢价越能维持。9/16 链内涨幅第一 +4.96%、换手 5.30%、成交 7.30 亿、年内 +83.32%。</div>\n    \n    \n    <div class=\"risk\">⚠️ PE(TTM) -134.43 仍处亏损，收入增长未转化为利润；CRO 价格战与回款周期压力</div>\n  </div></div><div class=\"t\">🏛️ 容量中军 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>恒瑞医药</b><span class=\"code\">600276</span><span class=\"tag\">年内与 BMS 达成 152 亿美元合作，9/16 却仅 +0.90%</span><span class=\"cap\">43.52 元 · 流通 2776 亿 · 9/16 +0.90%</span></div>\n    <div class=\"logic\">授权方代表·换手仅 0.65%</div>\n    <div class=\"detail\">国内创新药绝对龙头，年内与 BMS 达成 <strong>152 亿美元</strong>战略合作——是本催化最直接的受益者。作为容量中军，它的作用是给整条链提供<strong>指数级锚定</strong>：它不涨，说明市场没有把『1200 亿美元』定价到 biotech 端。9/16 收 +0.90%、超额仅 +0.19pct，换手<strong>仅 0.65%</strong>、成交 18.04 亿，在 2776 亿流通盘上属无资金参与状态。9/14 其 1 类新药 SHR-2004 上市申请获受理。它的走势是本链条能否从『卖水人行情』升级为『授权方行情』的<strong>唯一标尺</strong>。</div>\n    \n    \n    <div class=\"risk\">⚠️ 大盘股对题材资金不友好；152 亿美元以里程碑款为主，首付款规模与确认节奏未细化披露</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>药明康德</b><span class=\"code\">603259</span><span class=\"tag\">9/16 +0.66%，跑输上证（-0.05pct）</span><span class=\"cap\">157.71 元 · 流通 3901 亿 · 9/16 +0.66%</span></div>\n    <div class=\"logic\">CXO 最大权重·超额为负</div>\n    <div class=\"detail\">全球 CXO 最大权重标的，理论上应是『出海订单』的第一受益者，但 9/16 收 +0.66%、<strong>跑输上证 0.05pct</strong>，换手 1.26%、成交 49.10 亿为链内最大。它与美迪西 +4.96%、奥浦迈 +4.39% 形成鲜明对照：<strong>大市值 CXO 不涨、中小市值 CXO 大涨</strong>。这提示当日上涨的主要驱动是<strong>小盘弹性与科创板 beta</strong>，而非『出海订单』这一产业逻辑本身——否则权重最大的药明康德不该垫底。这个反例是本档案判断『部分定价』的关键证据。</div>\n    \n    \n    <div class=\"risk\">⚠️ 地缘政治风险（海外立法限制）对它是双刃剑；3901 亿流通盘需要大体量资金驱动</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>百济神州</b><span class=\"code\">688235</span><span class=\"tag\">A 股 -0.48%、港股 -2.73%、美股 ONC -2.07%，三地同跌</span><span class=\"cap\">252.35 元 · 9/16 -0.48%（科创50 +4.14%）</span></div>\n    <div class=\"logic\">授权方却跑输科创50 4.62pct</div>\n    <div class=\"detail\">本链条上<strong>最反直觉的样本</strong>：作为已在美股、港股、A 股三地上市的全球化 biotech，它本应是『出海授权』叙事的最直接载体，却在 9/16 <strong>A 股 -0.48%、港股 -2.73%、美股 -2.07%</strong>，三地同步下跌。相对科创50 +4.14% 的超额为 <strong>-4.62pct</strong>，是全链最差。这个样本的价值在于它彻底否定了『1200 亿美元 = biotech 重估』的简单映射：市场清楚区分了<strong>合同总额</strong>与<strong>可确认收入</strong>。观察它的意义在于：若它开始跑赢科创50，才代表市场真正开始为授权现金流定价。</div>\n    \n    \n    <div class=\"risk\">⚠️ 三地上市受全球流动性影响大；美股 ONC 年内仅 +14.05%，与 A 股医药叙事脱钩</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>纳微科技</b><span class=\"code\">688690</span><span class=\"tag\">8 月主导首个液相色谱硅胶填料 ISO 国际标准</span><span class=\"cap\">43.71 元 · 流通 176.51 亿 · 9/16 +4.37%</span></div>\n    <div class=\"logic\">标准输出型出海·壁垒最高</div>\n    <div class=\"detail\">代表出海的<strong>第三种形态——标准输出</strong>：8 月主导制定全球首个液相色谱硅胶填料 ISO 国际标准，把技术标准嵌入全球产业链，而非单纯卖产品。美国特拉华州基地建成后将新增 5 万升年产能。9/16 收 +4.37%、换手 2.57%、成交 4.50 亿、年内 +70.02%。它的受益节奏慢于 CXO 但壁垒更高，属于<strong>需要更长验证周期</strong>的样本。</div>\n    \n    \n    <div class=\"risk\">⚠️ PE(TTM) 84.25 倍估值偏高；海外客户验证与产能建设周期长</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>成都先导</b><span class=\"code\">688222</span><span class=\"tag\">9/16 +12.30%，全链涨幅第一</span><span class=\"cap\">36.06 元 · 9/16 +12.30%</span></div>\n    <div class=\"logic\">当日创新药涨幅第一</div>\n    <div class=\"detail\">DNA 编码化合物库（DEL）技术平台型公司，属创新药<strong>早期发现环节</strong>。9/16 收 +12.30%，为当日 A 股创新药概念涨幅第一。作为情绪小票，它代表的是市场对本催化的<strong>最表层反应</strong>——技术平台类标的在 BD 交易叙事中最容易被联想到（平台授权是 BD 的重要形式），但其实际受益程度与具体交易挂钩，难以量化。</div>\n    <div class=\"gene\">🧬 题材基因：DEL 技术平台标的，历次创新药 BD 主题行情中作为高弹性小盘参与，2024 年 License-out 转折行情中曾有连板记录，但持续性依赖具体交易落地</div>\n    \n    <div class=\"risk\">⚠️ 平台授权收入具有极强的不确定性与偶发性；涨幅与可验证业绩之间缺乏桥梁</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>艾迪药业</b><span class=\"code\">688488</span><span class=\"tag\">9/16 +9.70%，创新药概念涨幅第二</span><span class=\"cap\">15.50 元 · 9/16 +9.70%</span></div>\n    <div class=\"logic\">抗病毒小盘·情绪跟随</div>\n    <div class=\"detail\">抗病毒与泌尿系统领域创新药企，9/16 收 +9.70% 为创新药概念涨幅第二。它与本催化的<strong>实际关联度较弱</strong>——其管线以国内市场为主，并非本轮大额对外授权的主体。这类标的的上涨属于<strong>板块热度扩散</strong>而非产业逻辑定价，是判断情绪温度而非逻辑强度的样本。</div>\n    <div class=\"gene\">🧬 题材基因：科创板小盘创新药，历次医药主题行情中作为低位补涨标的活跃，无独立授权交易记忆</div>\n    \n    <div class=\"risk\">⚠️ 与本催化关联度弱；涨幅主要由板块情绪驱动，回落风险高</div>\n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>昭衍新药</b><span class=\"code\">603127</span><span class=\"tag\">9/16 成交 11.21 亿为卖水人最大，但 20 日 -11.99%</span><span class=\"cap\">43.83 元 · 流通 275.13 亿 · 9/16 +3.57%</span></div>\n    <div class=\"logic\">成交 11.21 亿最大·20 日仍 -11.99%</div>\n    <div class=\"detail\">临床前安全性评价（安评）龙头，是本链条上<strong>成交最活跃但年内表现最滞后</strong>的样本：9/16 成交 11.21 亿、换手 4.12%、收 +3.57%，但 20 日仍 <strong>-11.99%</strong>、年内 +25.62%，AH 溢价 -56.79%（H 股大幅折价）。它作为情绪龙的意义在于其<strong>高成交 + 低涨幅</strong>的组合——说明有资金在博弈 CXO 补涨，但承接盘对『安评产能过剩』的担忧压制了弹性。它是观察 CXO 内部分化的<strong>最佳标尺</strong>。</div>\n    <div class=\"gene\">🧬 题材基因：安评 CRO 龙头，2021 年 CXO 行情的核心标的之一，有强记忆锚；但本轮因行业产能过剩与价格战，基因记忆与当前基本面出现背离</div>\n    \n    <div class=\"risk\">⚠️ 安评行业产能过剩与价格战压制弹性；H 股折价 56.79% 反映国际定价更悲观</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2024 年：中国创新药 License-out 交易金额首次超过 License-in，被视为行业从『买管线』转向『卖管线』的关键转折点</li><li>2025 年：完成 157 起对外授权，总额 1356.55 亿美元、首付款 70 亿美元（首付款占比约 5.2%）；全国登记新药临床试验 2900 多项、同比 +18%</li><li>2026-06-30：上半年 81 笔、约 1100 亿美元，已达 2025 全年 80%、2024 全年两倍多，受让方来自 20 个国家和地区</li><li>2026-09-14：国家药监局披露年内授权总额突破 1200 亿美元、同比 +36%，首付款超百亿美元；港股创新药 ETF 标的指数 9/15-9/16 连续两日回调</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>奥浦迈</b><span class=\"code\">688293</span><span class=\"tag\">培养基出海·境外收入占比最高的可验证样本</span></div>\n    <div class=\"logic\">产业地位 | 弹性来源 | 约束条件：细胞培养基国产替代龙头，客户管线出海带动自身出海 | H1 境外收入 1.66 亿元占营收 37%，营收同比 +155.2% | 78 亿级流通盘，估值 PE(TTM) 74 倍不低</div>\n    <div class=\"detail\">本链条上<strong>最纯粹、最可验证的出海受益样本</strong>：2026H1 营收 4.54 亿元、<strong>同比 +155.2%</strong>，其中境外市场营收 1.66 亿元、占营收约 <strong>37%</strong>。它的传导路径极短——作为细胞培养基供应商，客户（创新药企）的管线一旦实现海外授权或海外申报，其培养基采购会随管线推进同步放量，董事长肖志华明确表述『产品会伴随客户的管线出海』，且公司已进入部分国际大药企供应链体系。独特之处在于它的收入是<strong>服务即确认</strong>，不存在 biotech 那种首付款分摊与里程碑或有的折算问题——这正是 9/16 它收 +4.39%（超额 +3.68pct）、换手 5.37% 的原因。约束是 78.56 亿流通盘 + PE(TTM) 74.38 倍，估值已含较高预期，且 5 日 -5.54% 显示高位有分歧。</div>\n    \n    <div class=\"confirm\">✔ 确认：三季报境外收入占比继续提升至 40% 以上 / 新增进入国际大药企供应链的公告 / 客户管线海外申报获批数量</div>\n    <div class=\"risk\">⚠️ 估值 PE(TTM) 74 倍已隐含高增长预期；若下游 BD 交易节奏放缓，培养基需求增速会同步回落</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>美迪西</b><span class=\"code\">688202</span><span class=\"tag\">中美双报 CRO·合规能力变现</span></div>\n    <div class=\"logic\">产业地位 | 弹性来源 | 约束条件：临床前研究一体化 CRO | 中美双报标准项目收入占主营 22%、同比 +93%，国际注册能力已成获客优势 | PE(TTM) 为负（仍亏损），盈利质量待验证</div>\n    <div class=\"detail\">本链条上<strong>『合规能力变现』</strong>的典型：上半年按中美双报标准要求进行的项目收入占主营业务收入 <strong>22%、同比增长 93%</strong>，已助力多家客户完成海外申报并成功获批 IND。它的受益逻辑不是『授权金额』而是『申报数量』——BD 交易越多、客户海外申报需求越大，中美双报的溢价就越能维持。9/16 收 +4.96%（超额 +4.25pct）、换手 5.30%、成交 7.30 亿、年内 +83.32%，是链内涨幅第一。独特之处在于它把<strong>监管合规本身</strong>变成了产品，这与药监局『提前介入、研审联动』的制度红利方向一致。约束是 PE(TTM) 为 -134.43（仍处亏损），收入增长尚未转化为利润。</div>\n    \n    <div class=\"confirm\">✔ 确认：中美双报项目收入占比继续提升 / 单季度扭亏或亏损收窄 / 海外申报 IND 获批数量披露</div>\n    <div class=\"risk\">⚠️ 仍处亏损状态，PE 为负；CRO 行业价格战与订单回款周期是持续压力</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>恒瑞医药</b><span class=\"code\">600276</span><span class=\"tag\">授权方代表·本催化最直接受益者却未定价</span></div>\n    <div class=\"logic\">产业地位 | 弹性来源 | 约束条件：国内创新药绝对龙头，年内与 BMS 达成 152 亿美元战略合作 | 授权首付款直接改善现金流与利润 | 2776 亿流通盘，资金推动难度大；9/16 换手仅 0.65%</div>\n    <div class=\"detail\">本催化的<strong>最直接受益者之一</strong>：年内与 BMS 达成 <strong>152 亿美元</strong>战略合作，是中国药企对外授权的标志性大额交易；9/14 其 1 类新药 SHR-2004 注射液上市申请获受理。但 9/16 它仅收 <strong>+0.90%</strong>（超额 +0.19pct），换手<strong>仅 0.65%</strong>、成交 18.04 亿——在 2776 亿流通盘上是典型的『无资金参与』状态。这个样本的价值在于它证明了<strong>『授权金额』与『股价弹性』之间的传导是断裂的</strong>：市场清楚 152 亿是里程碑款为主，首付款规模与确认节奏才是关键，而这个数字公司并未细化披露。独特之处在于它是链上唯一同时具备<strong>大规模授权能力 + 已盈利 + 完整商业化体系</strong>的公司，是检验『出海能否兑现为利润』的最终样本。</div>\n    \n    <div class=\"confirm\">✔ 确认：公司披露授权首付款的具体金额与确认节奏 / 三季报海外收入或授权收益科目 / 新增大额 BD 交易</div>\n    <div class=\"risk\">⚠️ 2776 亿流通盘对题材资金不友好；若里程碑款确认不及预期，授权叙事对利润表的贡献会被证伪</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>纳微科技</b><span class=\"code\">688690</span><span class=\"tag\">色谱填料·标准输出型出海</span></div>\n    <div class=\"logic\">依托中国药企 BD 项目出海，接受海外客户对原工艺验证，促进填料出海；8 月主导制定全球首个液相色谱硅胶填料 ISO 国际标准</div>\n    <div class=\"detail\">代表<strong>出海的第三种形态——标准输出</strong>：不再是卖产品，而是把技术标准、工艺开发与应用服务嵌入全球产业链。董事长表示海外业务核心『不再只是销售色谱填料，而是将分离纯化领域的技术标准系统性输出』。美国特拉华州基地建成后将新增 5 万升年产能。9/16 收 +4.37%（超额 +3.66pct）、换手 2.57%、年内 +70.02%。这类标的的受益节奏慢于 CXO 但壁垒更高。</div>\n    \n    \n    <div class=\"risk\">⚠️ PE(TTM) 84 倍估值偏高；产能建设与海外客户验证周期长，收入兑现慢</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>昭衍新药</b><span class=\"code\">603127</span><span class=\"tag\">安评 CRO·20 日仍 -11.99% 的滞后样本</span></div>\n    <div class=\"logic\">临床前安全性评价龙头，海外申报需求上升直接带动安评订单；但 20 日 -11.99%、AH 溢价 -56.79%</div>\n    <div class=\"detail\">本链条上<strong>唯一 20 日仍大幅下跌的标的</strong>（20 日 -11.99%、5 日 +0.21%、年内 +25.62%），9/16 收 +3.57%（超额 +2.86pct）、换手 4.12%、成交 11.21 亿。AH 溢价 -56.79% 意味着 H 股相对 A 股大幅折价。它的滞后可能与安评行业产能过剩、价格战有关。作为延伸样本，它是观察『CXO 内部是否也分化』的标尺——若它持续跑输美迪西、奥浦迈，说明市场在 CXO 内部也做了严格筛选。</div>\n    \n    \n    <div class=\"risk\">⚠️ 安评行业产能过剩与价格战；H 股大幅折价反映国际投资者定价更悲观</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>仿制药与普通制剂企业</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">对外授权交易的标的必须是具备全球专利与差异化临床价值的<strong>创新资产</strong>。仿制药没有可授权的知识产权，不在这条传导链上——本轮 1200 亿美元与它们完全无关</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中药企业</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">中药的注册路径、评价体系与出海目的地都与化学药/生物药不同，且药监局提到的『中药三结合审评体系』是独立的监管框架。创新药出海授权的主角是化药与生物药，中药不在本链条</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>创新医疗器械（51 个获批）</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">药监局同期披露 51 个创新医疗器械获批，但器械的商业化路径是<strong>产品销售</strong>而非<strong>权益授权</strong>，其海外拓展依赖注册证与经销网络，与创新药的 License-out 模式不同链，不构成同一传导</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>纯国内市场的 CXO（以境内订单为主）</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">诺唯赞在业绩说明会上明确提到『生命科学行业价格战』——国内 CXO 与上游耗材正处在价格战中，只有<strong>海外收入占比提升</strong>的企业才能对冲。奥浦迈、美迪西领涨而昭衍新药 20 日 -11.99%，正是市场在 CXO 内部按海外敞口做了区分，纯内需 CXO 不在受益链上</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>以 License-in 为主的企业</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">2024 年 License-out 首次超过 License-in 是本主线的起点。商业模式以<strong>引进</strong>为主的公司是这条链的<strong>付费方</strong>而非受益方，逻辑方向相反</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**产业周期**：创新药从『引进』转向『授权输出』的角色反转已确立。基准参照：2024 年 License-out 金额首次超过 License-in，2025 年 157 起/1356.55 亿美元为量化基准。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">奥浦迈 ＞ 美迪西 ＞ 纳微科技 ＞ 恒瑞医药 ＞ 百济神州。排序理由：按『海外收入能否立即进报表』排序——卖水人服务即确认（奥浦迈境外占 37%），biotech 首付款需分摊且里程碑为或有，故垫底。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">成都先导 ＞ 艾迪药业 ＞ 昭衍新药。gene：成都先导是 DEL 平台小盘，2024 年 License-out 转折行情中曾有连板记忆；昭衍虽成交 11.21 亿最大但 20 日 -11.99%，筹码沉重。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若首付款绝对额继续超 100 亿美元**且**恒瑞医药/百济神州相对上证的超额转正 → 逻辑状态由「卖水人结构性占优」升为「授权方重估」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 首付款向 150 亿美元靠拢 ② 奥浦迈境外占比升至 40% 以上 ③ 百济相对科创50 超额转正 ④ ESMO 中国数据阳性。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 首付款 Q4 环比不增 ② 美国出台限制中国生物医药资产立法 ③ 出现大额授权退货案例 ④ CXO 海外收入增速环比放缓。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">盯的是**首付款不是总额**。1200 亿美元里有 95% 是里程碑款和销售分成，2025 年首付款占比只有 5.2%——把总额当收入读是这条链最常见的误读。9/16 盘面已经给出裁决：涨的全是能立刻确认收入的卖水人（美迪西 +4.96%、奥浦迈 +4.39%），拿到授权款的百济神州 A 反而 -0.48%、跑输科创50 4.62pct。真正的转折信号是恒瑞、百济开始跑赢，而不是 CXO 继续涨。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>情景推演</h2>\n    <div style=\"font-size:12px;color:var(--dim);margin-bottom:8px\">每个分支为可观察的条件树——触发条件兑现后的逻辑状态与验证信号，互斥且可证伪。不含操作建议。</div>\n    <div class=\"scen\"><div class=\"sc\"><div class=\"br\">▸ 授权方补涨·主线成立</div><div class=\"tg\">触发：<b>首付款绝对额继续超预期 / ESMO 会议中国数据阳性 / 恒瑞或百济披露具体首付款金额与确认节奏 / 新增刷新纪录的大额交易</b></div><div class=\"ls\">逻辑状态：<b>定价主体从『卖水人』切换到『授权方』，1200 亿美元这个数字开始被折算进 biotech 的现金流模型。恒瑞医药、百济神州由超额为负转为显著正超额，昭衍新药 20 日跌幅收窄，港股创新药止跌。本档案的『定价主体错位』定性被修正</b></div><div class=\"fs\">观察信号：<b>百济神州 A 相对科创50 超额转正 / 恒瑞医药换手率从 0.65% 放大至 1.5% 以上 / 港股创新药 ETF 标的指数连续两日收红</b></div></div><div class=\"sc\"><div class=\"br\">▸ 维持错位·卖水人结构性占优</div><div class=\"tg\">触发：<b>首付款数据不再更新 / biotech 未细化披露确认节奏 / 市场继续偏好可验证收入 / 港股创新药持续回调</b></div><div class=\"ls\">逻辑状态：<b>维持本档案定性：市场永远偏好『能立刻进报表的收入』，而 biotech 的授权收入存在分摊与或有性问题。CXO 与上游耗材（奥浦迈、美迪西、纳微）成为本主线的<strong>事实受益载体</strong>，biotech 龙头则持续被要求用利润而非合同总额自证。本链条演化为『CXO 出海订单』行情而非『创新药重估』行情</b></div><div class=\"fs\">观察信号：<b>美迪西、奥浦迈维持 5% 左右换手与正超额 / 药明康德、恒瑞持续跑平 / 成都先导、艾迪药业等情绪小票冲高回落</b></div></div><div class=\"sc\"><div class=\"br\">▸ 地缘风险兑现·主线受损</div><div class=\"tg\">触发：<b>美国出台限制中国生物医药资产的立法 / 已有授权被 CFIUS 审查或要求剥离 / 跨国药企放缓对华 BD</b></div><div class=\"ls\">逻辑状态：<b>本主线的制度前提被破坏。License-out 从 2024 年超 License-in 以来的上升趋势逆转，1200 亿美元成为阶段性高点而非新起点。CXO 的海外订单与 biotech 的授权收入同步承压，全链条定价基础改变</b></div><div class=\"fs\">观察信号：<b>药明康德等海外收入占比高的标的出现跳空下跌 / 新增 BD 交易笔数环比腰斩 / 跨国药企公开表态调整对华合作</b></div></div><div class=\"sc\"><div class=\"br\">▸ 里程碑兑现率被证伪</div><div class=\"tg\">触发：<b>出现大额授权退货/终止案例 / 已授权管线 III 期失败 / 首批里程碑款未达预期</b></div><div class=\"ls\">逻辑状态：<b>市场开始对『合同潜在总额』施加更高的折价系数，1200 亿美元的叙事价值大幅缩水。首付款与总额之间的 5.2% 占比关系被证明仍在恶化，本链条的估值锚从『总额』彻底转向『首付款』甚至『已确认收入』</b></div><div class=\"fs\">观察信号：<b>药监局/权威数据库不再强调总额而改强调首付款 / 出现知名管线授权终止公告 / biotech 财报中授权收益科目低于预期</b></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>国家药监局或权威数据库披露的<strong>首付款绝对额</strong>继续超 100 亿美元并向 150 亿美元靠拢（议价权改善的结构性证据）</b></li><li><b>奥浦迈、美迪西等三季报境外收入占比继续提升（奥浦迈 37% → 40% 以上，美迪西中美双报 22% → 25% 以上）</b></li><li><b>百济神州、恒瑞医药开始跑赢科创50/上证——授权方端从『未定价』转为『已定价』的标志</b></li><li><b>10 月 ESMO 会议上中国创新药公布阳性 III 期数据（继 WCLC 19 项口头报告创纪录之后）</b></li><li><b>单个交易金额刷新纪录（对标石药-阿斯利康 185 亿美元、恒瑞-BMS 152 亿美元）</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>首付款规模在 Q4 不再增长甚至环比回落（说明大额交易是偶发而非趋势）</b></li><li><b>美国出台限制中国生物医药资产的立法或行政令，导致 BD 交易受阻（地缘政治风险兑现）</b></li><li><b>港股创新药板块持续回调，康方生物、荣昌生物等跌幅扩大至 10% 以上</b></li><li><b>CXO 海外收入增速在 Q3 环比放缓（昭衍新药 20 日 -11.99% 若扩散至美迪西、奥浦迈）</b></li><li><b>已签署的大额授权出现退货/终止案例（里程碑款兑现率下行）</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">10 月 ESMO</div><div class=\"wh\">欧洲肿瘤内科学会年会中国创新药的临床数据披露（继 WCLC 19 项口头报告创纪录之后）</div><div class=\"wy\">光大证券明确 9-10 月 WCLC、ESMO 是『验证产品价值的核心窗口期』，数据读出是授权价值的直接触发器</div></div><div class=\"tkc\"><div class=\"w\">三季报</div><div class=\"wh\">奥浦迈、美迪西、纳微科技、赛分科技的境外收入占比与增速；恒瑞医药、百济神州的授权收益科目</div><div class=\"wy\">公司级证据——本链条当前最缺的就是『授权收入如何进报表』的可验证数字</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">国家药监局后续披露的首付款绝对额与单笔平均交易金额</div><div class=\"wy\">首付款是唯一落袋的现金，占比提升才是议价权改善的真证据</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">百济神州 A 股相对科创50 的超额收益</div><div class=\"wy\">它是『授权方是否被定价』最直接的单一样本标尺——9/16 为 -4.62pct</div></div></div>\n\n    <div class=\"src\">数据来源：国家药监局 2026 年全国药品安全宣传周启动仪式（9/14）披露及官微 · 新华网/中国网转述 · 东方财富 9/16《创新药出海步伐再提速 产业链企业同步走出去》（含科创板 9/15 生物制品及 CXO 行业集体业绩说明会内容）· 百度百科『创新药出海』词条（2025 年 157 起/1356.55 亿美元/首付款 70 亿，2026H1 81 笔/1100 亿美元）· 界面新闻 9/16 港股创新药板块数据 · 光大证券 20260915《关注肺癌领域 ADC 突破与 IO2.0 浪潮》· 东方财富行情接口 9/16 收盘数据（恒瑞/药明康德/凯莱英/泰格/美迪西/昭衍/奥浦迈/纳微/百济神州）· 本工作区 out/fupan_20260916.json 复盘数据</div>\n    <footer>创新药出海破1200亿 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "oil-price-106-record", "title": "油价破106·柴油期货创纪录", "date": "2026-09-16", "grade": "正式档", "pricing": "部分定价", "crate": "bolt", "search": "油价破106·柴油期货创纪录 wti 10 月合约 +4.38% 报 105.83 美元/桶（盘中 106.486 创 5 月初来新高）· 布伦特 108.75 美元 · 美国柴油期货结算价升破 5.26 美元/加仑创历史最高纪录、零售 6.26 美元九个月累涨超 80% 地缘冲突 ⚡ 供给冲击型 · 商品端创历史纪录，权益端按停火预期反向下杀", "card": "<a class=\"card-c\" href=\"#oil-price-106-record\" data-search=\"油价破106·柴油期货创纪录 wti 10 月合约 +4.38% 报 105.83 美元/桶（盘中 106.486 创 5 月初来新高）· 布伦特 108.75 美元 · 美国柴油期货结算价升破 5.26 美元/加仑创历史最高纪录、零售 6.26 美元九个月累涨超 80% 地缘冲突 能源地缘·中东供断与成品油 部分定价 中国海油 中曼石油 中国石油 中海油服 海油工程\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-16</span>\n    <span class=\"crate bolt\">⚡ 供给冲击型 · 商品端创历史纪录，权益端按停火预期反向下杀 地缘冲突</span>\n  </div>\n  <div class=\"ctitle\">油价破106·柴油期货创纪录</div>\n  <div class=\"csub\">WTI 10 月合约 +4.38% 报 105.83 美元/桶（盘中 106.486 创 5 月初来新高）· 布伦特 108.75 美元 · 美国柴油期货结算价升破 5.26 美元/加仑创历史最高纪录、零售 6.26 美元九个月累涨超 80%</div>\n  <div class=\"cpos\">WTI 破 106、美国柴油期货结算价创历史最高纪录；但 A 股油气链 9/16 全绿、油运大跌 3%——商品按实物短缺定价，权益按停火预期定价。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">能源地缘·中东供断与成品油</span>\n    \n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 8</span>\n    <span class=\"nm\">中国海油</span><span class=\"nm\">中曼石油</span><span class=\"nm\">中国石油</span><span class=\"nm\">中海油服</span><span class=\"nm\">海油工程</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-16 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-16</div>\n    <h1>油价破106·柴油期货创纪录</h1>\n    <div class=\"sub\">WTI 10 月合约 +4.38% 报 105.83 美元/桶（盘中 106.486 创 5 月初来新高）· 布伦特 108.75 美元 · 美国柴油期货结算价升破 5.26 美元/加仑创历史最高纪录、零售 6.26 美元九个月累涨超 80%</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 供给冲击型 · 商品端创历史纪录，权益端按停火预期反向下杀</span>\n      <span class=\"badge neutral\">地缘冲突</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：能源地缘·中东供断与成品油</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">saudi-east-west-pipeline</span><span class=\"tag\" style=\"margin-right:4px\">diesel-crack-record</span><span class=\"tag\" style=\"margin-right:4px\">russia-diesel-outage</span><span class=\"tag\" style=\"margin-right:4px\">oil-tanker-supercycle</span><span class=\"tag\" style=\"margin-right:4px\">oil-hormuz</span></div>\n    <div class=\"posnote\">WTI 破 106、美国柴油期货结算价创历史最高纪录；但 A 股油气链 9/16 全绿、油运大跌 3%——商品按实物短缺定价，权益按停火预期定价。</div>\n    <details class=\"more\"><summary>展开定价状态详版（429 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化发生在 9/16 02:33（美股收盘、A 股盘前），本应是典型的盘前海外映射窗口。但 9/16 A 股油气链给出的是**反向**答案：上游中国海油 -1.11%、中国石油 -0.37%，油运招商轮船 -3.12%、招商南油 -3.90%、中远海能 -1.57%，炼化中国石化 -1.51%、恒力石化 -0.84%。全链仅中曼石油 +2.03%、中海油服 +0.89%、潜能恒信 +1.19% 等油服小票翻红。反差的关键在于 9/15 晚间同夜落地的两组信息：17:42「俄约一半顶级柴油厂遭袭减产」（升级）与 18:23 克宫称停火提议「是个好主意」（缓和）——商品端按前者定价，A 股权益端按后者定价。这是自 9/14 沙特东西管道中断（saudi-east-west-pipeline）以来，能源地缘主线第二次出现「商品创新高、权益不跟」的映射断裂，本次为二段催化：管道停运 → 油价破 106 + 柴油期货创纪录 + 利比亚管道关闭形成三重断供。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">① 核心事实 · 三个数字同时创纪录</b><div class=\"v\">WTI 原油 10 月合约结算价 +4.38% 报 <strong>105.83 美元/桶</strong>，盘中一度触及 106.486 美元创 5 月初以来新高；布伦特 11 月合约 +2.9% 报 108.75 美元。美国柴油<strong>期货结算价升至 5.26 美元/加仑之上，创历史最高纪录</strong>，零售价随之升至 6.26 美元/加仑，九个月内累计上涨超 80%（财联社 9/16 03:07、格隆汇）。</div></div><div class=\"card fact\"><b class=\"k\">② 供给端 · 三重断供叠加</b><div class=\"v\">直接催化是沙特关键输油管道遭无人机袭击后停运，该管道<strong>每天转运约 400 万桶原油、约占全球供应量 4%</strong>；同时利比亚哈马达-扎维耶输油管道关闭，迫使多个油田停产并可能宣布不可抗力；霍尔木兹与曼德海峡两大海运通道同步承压。中银证券指出部分油轮被迫绕行好望角，航程延长显著推高运输成本，EIA 已上调今明两年油价预测。</div></div><div class=\"card fact\"><b class=\"k\">③ 为何柴油比原油更紧</b><div class=\"v\">柴油是这一轮最紧的品种：结算价 5.26 美元/加仑创历史最高，零售 6.26 美元/加仑九个月涨超 80%。原因是成品油端同时承受三重挤压——俄约一半顶级柴油厂遭袭减产（7 月俄炼能 42.7% 瘫痪、日均 391 万桶创 2005 年最低）、全球约 500 万桶/日炼能关停、以及绕行导致的到岸成本上升。对照 9/12 已记录的美国柴油裂解价差 112.17 美元/桶创历史纪录（diesel-crack-record），本档是同一矛盾的<strong>结算价端确认</strong>。</div></div><div class=\"card
