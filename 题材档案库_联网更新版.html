 130~140 万亩（-26%）、产量 50~55 万吨（上年 68.48 万吨）是<strong>已落地而非预期</strong>的减产，确定性高于泰国的预估口径。但体量仅占全国产量 4% 左右，难以改变全国丰产格局，属于结构性小机会。9/11 收 9.67 元、跌 4.64%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 体量小，难以改变全国平衡表；甜菜糖成本高于甘蔗糖</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>甘化科工</b><span class=\"code\">000576</span><span class=\"tag\">老牌糖业股·题材属性强于产业属性</span></div>\n    <div class=\"logic\">历史糖业标的，业务已多元化，映射纯度低</div>\n    <div class=\"detail\">原广东甘化，历史糖业标的，当前业务已向军工、生物科技方向多元化，食糖业务占比有限。在糖价行情中更多以「记忆映射」方式被资金选择，产业弹性弱。9/11 收 8.57 元、涨 0.82%，是当日制糖链中少数翻红标的。</div>\n    \n    \n    <div class=\"risk\">⚠️ 业务多元化稀释食糖弹性，属记忆映射而非逻辑映射</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>以国际糖价直接推算国内糖企利润的线性推演</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">国内糖价受进口配额与国储投放管制，2023 年国际糖涨 30% 期间郑糖仅涨 12%，联动系数约 0.4，线性外推会高估一倍以上</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>纯食品饮料下游（含乳饮、烘焙）</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">糖是其主要原料成本，糖价上涨对其是成本挤压，属受损方而非受益方</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**供给冲击型**（气候减产），内外价差背离是核心特征。基准参照：2023 年厄尔尼诺糖行情，国际糖涨 30% 期间郑糖仅涨 12%，联动系数约 0.4。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">三元生物 ＞ 粤桂股份 ＞ 中粮糖业。排序理由：三元生物为代糖（受益于糖价上行后的替代需求）、弹性最纯；粤桂是甘蔗糖自有产能；中粮糖业以精炼贸易为主、受进口配额影响大。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">红棉股份（情绪龙）＞ 甘化科工 ＞ 亚盛集团 ＞ 中粮科技。gene：红棉股份是糖业老妖，2023 糖行情中作为广东国资改革+糖价双题材被资金反复炒作。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若泰国 2026/27 新榨季（10 月开榨）实际产量跌破 1000 万吨**且**印度出口禁令 9/30 后延期 → 逻辑状态由「减产预期」升为「减产兑现」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 泰国 2026/27 新榨季实际产量跌破 1000 万吨 ② 印度出口禁令延期或零关税进口额度扩大 ③ 郑糖补涨、内外价差收敛。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 巴西 2026/27 甘蔗增产兑现、填补泰印缺口 ② 国内 2026/27 产量落在 1300 万吨以上、结转库存累积 ③ 郑糖回落至 5300 元/吨下方。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">国际糖 +34%、郑糖只有 +7%——这个背离是**常态**不是异常，因为国内有进口配额与储备投放。做糖要分清两条独立逻辑：国际糖价（泰国/印度供给）与国内糖价（配额+储备），历史上联动系数只有 0.4 左右。9/30 印度出口禁令到期与 10 月泰国开榨是两个连续时点。</div></div></div>\n\n    \n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>泰国 2026/27 新榨季（10 月开榨）实际产量跌破 1000 万吨，减产预期转为实际数据</b></li><li><b>印度出口禁令 9/30 到期后延期，或零关税进口额度进一步扩大</b></li><li><b>ISO 继续下调 2026/27 供需缺口至 26 万吨以上，CFTC 非商业净多持仓继续增仓</b></li><li><b>郑糖 SR2701 站稳 5500 元/吨并向上突破，广西南宁现货回升至 5400 元/吨上方（修复成本倒挂）</b></li><li><b>9 月中旬后内蒙古、新疆甜菜糖开榨进度偏慢，国内库存去化加速</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>巴西 2026/27 甘蔗增产兑现，中南部产糖量同比转正，填补泰国与印度的预估缺口</b></li><li><b>国内 2026/27 产量落在 1300 万吨以上、结转库存继续累积，郑糖回落至 5300 元/吨下方</b></li><li><b>印度 9/30 后恢复出口，全球贸易流修复、缺口预期被抹平</b></li><li><b>广西现货持续低于制糖成本线 5300 元/吨且库存去化停滞，糖厂降价去库</b></li><li><b>CFTC 非商业净多快速回补至 8 万手以下，拥挤头寸平仓引发价格回落</b></li><li><b>糖浆、预拌粉等替代糖源进口继续放量，挤占工业需求</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">9 月中旬起</div><div class=\"wh\">内蒙古、新疆甜菜糖厂开榨进度与新糖报价</div><div class=\"wy\">国内新糖上市节奏决定库存是继续累积还是开始去化</div></div><div class=\"tkc\"><div class=\"w\">9 月 30 日</div><div class=\"wh\">印度禁止原糖与白糖出口禁令到期后的政策走向</div><div class=\"wy\">全球贸易流最大单一变量，直接决定缺口是扩大还是回补</div></div><div class=\"tkc\"><div class=\"w\">10 月</div><div class=\"wh\">泰国 2026/27 新榨季开榨与实际产量</div><div class=\"wy\">把 -20% 的减产预期转成实际数据的唯一节点</div></div><div class=\"tkc\"><div class=\"w\">每两周</div><div class=\"wh\">巴西 Unica 制糖比与中南部产糖量</div><div class=\"wy\">判断巴西增产能否填补缺口，决定原糖是尖顶还是平台</div></div><div class=\"tkc\"><div class=\"w\">每周</div><div class=\"wh\">郑糖库存、广西与云南现货报价 vs 5300~5400 元/吨成本线</div><div class=\"wy\">成本倒挂是否修复，是业绩环能否闭合的直接标志</div></div></div>\n\n    <div class=\"src\">数据来源：第一财经(9/11) ｜ 上海证券报(9/10) ｜ 华夏时报(9/10) ｜ 卓创资讯分析师牛哲 ｜ 农业农村部农村经济研究中心黄义 ｜ 中信建投期货陈家谊 ｜ 中信期货吴静雯 ｜ 南华期货王映 ｜ USDA/ISO/Conab/印度新闻信息局数据 ｜ 腾讯行情(9/11) ｜ iFinD 盘面(9/11)</div>\n    <footer>国际糖价创一年新高 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "thermal-coal-830", "title": "动力煤价上调至830元", "date": "2026-09-11", "grade": "正式档", "pricing": "部分定价", "crate": "warn", "search": "动力煤价上调至830元 2026 预测 805 → 830 元/吨 · q3 至今煤价 +14%、煤炭股 +16~22% · 神华目标价 45→47 元但维持中性 产业周期 ⚠ 涨价预期上调型 · 股价已抢跑、盘后研报未定价", "card": "<a class=\"card-c\" href=\"#thermal-coal-830\" data-search=\"动力煤价上调至830元 2026 预测 805 → 830 元/吨 · q3 至今煤价 +14%、煤炭股 +16~22% · 神华目标价 45→47 元但维持中性 产业周期 资源品涨价与煤焦链 部分定价 兖矿能源 中国神华 陕西煤业 中煤能源 潞安环能\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-11</span>\n    <span class=\"crate warn\">⚠ 涨价预期上调型 · 股价已抢跑、盘后研报未定价 产业周期</span>\n  </div>\n  <div class=\"ctitle\">动力煤价上调至830元</div>\n  <div class=\"csub\">2026 预测 805 → 830 元/吨 · Q3 至今煤价 +14%、煤炭股 +16~22% · 神华目标价 45→47 元但维持中性</div>\n  <div class=\"cpos\">2026 年动力煤价预测上调 805→830 元/吨，Q3 至今煤价 +14%、煤炭股 +16~22%；盘后研报未定价，股价已抢跑。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">资源品涨价与煤焦链</span>\n    \n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 7</span>\n    <span class=\"nm\">兖矿能源</span><span class=\"nm\">中国神华</span><span class=\"nm\">陕西煤业</span><span class=\"nm\">中煤能源</span><span class=\"nm\">潞安环能</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-11 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-11</div>\n    <h1>动力煤价上调至830元</h1>\n    <div class=\"sub\">2026 预测 805 → 830 元/吨 · Q3 至今煤价 +14%、煤炭股 +16~22% · 神华目标价 45→47 元但维持中性</div>\n    <div class=\"badges\">\n      <span class=\"badge warn\">⚠ 涨价预期上调型 · 股价已抢跑、盘后研报未定价</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：资源品涨价与煤焦链</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">carbon-black-record</span><span class=\"tag\" style=\"margin-right:4px\">copper-record</span></div>\n    <div class=\"posnote\">2026 年动力煤价预测上调 805→830 元/吨，Q3 至今煤价 +14%、煤炭股 +16~22%；盘后研报未定价，股价已抢跑。</div>\n    <details class=\"more\"><summary>展开定价状态详版（396 字）</summary><div class=\"pos\"><b>定价状态备注：</b>研报 <strong>9/11 17:04 盘后</strong>发布。<strong>盘面状态</strong>：9/11 煤炭概念仅 <strong>1 家涨停</strong>且主业为热电（杭州热电 +10.00%、成交额 3.12 亿、量比 2.81）；中国神华 +0.49%（成交 14.5 亿、换手仅 0.18%）、陕西煤业 -0.15%、新集能源 -0.67%、中煤能源 -1.34%、兖矿能源 -1.70%（小摩明确偏好的标的当日下跌）、平煤股份 -2.52%、华阳股份 -2.67%、淮北矿业 -2.85%、山煤国际 -3.20%、潞安环能 -3.26%、云煤能源曾涨停后收 -4.81%（换手 19.66%、量比 2.48）。<strong>研报信息完全未在当日盘面体现</strong>；但煤炭股 Q3 以来已涨 16%~22%，趋势层面已抢跑，故为部分定价而非未定价。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">摩根大通 9/11 研报：中国内地煤价<strong>第三季至今上升 14%</strong>，煤炭股同期上升 <strong>16% 至 22%</strong>，市场预期煤价环境将「更高更久」。该行认为短期煤价仍有上行风险，主要由于<strong>国内供应受限及补库存需求</strong>，故将 2026 年动力煤价格预测由每吨 <strong>805 元人民币上调至 830 元人民币</strong>，上调幅度 <strong>+3.1%</strong>。</div></div><div class=\"card fact\"><b class=\"k\">目标价与评级的矛盾</b><div class=\"v\">中国神华 A 股目标价 45 → <strong>47 元</strong>、H 股 44.5 → 46 港元，兖矿能源 A 股 20 → <strong>22 元</strong>、H 股维持 12.5 港元，<strong>两者均维持「中性」评级</strong>。计及较高单位成本后，2026-2028 年盈利预测调整幅度仅在 <strong>下调 2% 至上调 4%</strong> 之间——<strong>上调商品价格预测、却不上调盈利、更不上调评级</strong>，说明卖方认为煤价上行对报表的边际贡献有限，且已被股价消化。</div></div><div class=\"card fact\"><b class=\"k\">真正的偏好在焦煤而非动力煤</b><div class=\"v\">小摩短期明确<strong>偏好兖矿能源，理由是「焦煤敞口较高及合约组合有利」</strong>——这份研报的主标题是动力煤价格上调，但真正的选股结论落在焦煤敞口上。这是一个容易被误读的结构：动力煤价格预测上调只是背景，选股逻辑的胜负手在焦煤与长协/现货的合约结构，而非动力煤均价本身。</div></div><div class=\"card fact warn\"><b class=\"k\">卖方的自我否定</b><div class=\"v\">研报同时指出：煤炭股 <strong>6% 至 7% 的股息率虽然吸引，但高股息率未必可持续，因供应限制可能属短期</strong>。这句话是本档案最重要的风险提示——如果供应限制是短期的，那么 830 元/吨的全年均价假设本身就建立在脆弱前提上，且近年来煤炭股的核心定价逻辑（高股息）可能同步松动。</div></div><div class=\"card fact\"><b class=\"k\">宏观能源背景</b><div class=\"v\">国际油价重新突破每桶 100 美元大关（9/11 WTI 一度跌破 99 美元、布伦特 103.56 美元，日内波动剧烈），能源价格上涨加大全球通胀压力；欧洲央行年内<strong>第二次加息</strong>（伊朗战争以来），全球主要央行相继召开货币政策会议。油价高企对煤炭有双重含义：一是能源比价支撑煤价，二是通胀与利率环境压制高股息资产的吸引力。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/11 煤炭板块<strong>普遍小幅下跌</strong>：兖矿能源 -1.70%（研报偏好标的当日收跌）、中煤能源 -1.34%、陕西煤业 -0.15%、潞安环能 -3.26%、山煤国际 -3.20%、淮北矿业 -2.85%、华阳股份 -2.67%、平煤股份 -2.52%、广汇能源 -2.36%；仅中国神华 +0.49% 微涨（换手 0.18%，几乎无资金参与）。板块唯一涨停的杭州热电主业为热电联产、煤炭概念纯度低。<strong>盘后研报的利好在当日盘面零体现</strong>，同时 9/11 涨停的是杭州热电、华银电力等电力股——当日资金把「煤价」解读为电力/热电逻辑，与煤炭股本身方向相反。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-11</div><div><div class=\"x\">动力煤价上调至830元：2026 预测 805 → 830 元/吨 · Q3 至今煤价 +14%、煤炭股 +16~22% · 神华目标价 45→</div><div class=\"y\">为什么：本档为「资源品涨价」的建档时点，后续二段催化均在此之上叠加</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「卖方预测上调型」催化而非产业事件，<strong>三个要害</strong>：一是<strong>数字的分量远小于看起来</strong>——805 到 830 元仅 +3.1%，对应的盈利预测调整是 -2%~+4%，而煤炭股 Q3 以来已涨 16%~22%，商品价格的上行幅度已经被股票价格的涨幅<strong>超额定价</strong>；二是<strong>评级不动才是真信息</strong>——上调价格预测却维持「中性」，并主动提示「供应限制可能属短期」「高股息未必可持续」，卖方其实在说煤价上行已被 price in，且在提示高股息这一核心支撑的脆弱性；三是<strong>选股结论与标题错位</strong>——主标题是动力煤，实际偏好的是兖矿的焦煤敞口与合约组合，若按动力煤均价逻辑去理解这份研报会选错对象。<strong>隐藏面</strong>：市场把煤炭股当作高股息债性资产定价，而这份研报恰恰在削弱这个定价基础（股息率不可持续）；真正的矛盾不是煤价能不能到 830，而是如果煤价上涨依赖短期供应限制，那么「高股息 + 涨价」两个逻辑不能同时成立——供应限制放松则煤价回落，供应限制维持则可持续性存疑。<br>① <strong>分水岭时点</strong>：Q4 迎峰度冬的日耗与补库节奏，以及大秦线秋季检修对供给的阶段性约束。<br>② <strong>传导的关键约束</strong>：供应限制是否如小摩自述「可能属短期」——若是短期，830 元/吨的全年均价假设与高股息假设同时失效。<br>③ <strong>待验证的核心变量</strong>：秦港 Q5500 现货能否站上 830 元/吨并维持两周以上，这是把预测转为现实的唯一客观标志。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实但已发生</span><ul><li>煤价 Q3 至今 +14% 是已发生事实，不是新变量</li><li>805 → 830 元是预测上调 +3.1%，幅度温和</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">温和</span><ul><li>盈利预测调整仅 -2%~+4%，价格上调对报表的边际贡献有限</li><li>计及较高单位成本后，涨幅被成本端吃掉一部分</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">弹性有限</span><ul><li>3.1% 的均价上移对应个位数盈利变化，难改 ROE 中枢</li><li>小摩提示 6%~7% 股息率未必可持续，债性定价基础松动</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">已抢跑</span><ul><li>煤炭股 Q3 以来已涨 16%~22%，远超煤价 14% 的涨幅</li><li>维持「中性」评级；9/11 当日龙头与弹性票普跌，研报未定价</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实但已发生、影响温和、业绩弹性仅个位数、股价已超额抢跑——这是一份确认型研报，而非新增预期差。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>55%</strong>：四环中「股价」环最弱——不是没涨，而是涨过头了（股票 +16%~22% vs 商品 +14%），剩余空间被压缩；「业绩」环因弹性仅个位数而无法支撑进一步重估。</li><li><strong>边界要切开</strong>：相对受益的是<strong>低成本动力煤龙头</strong>（中国神华，长协占比高 + 自有铁路港口，现金流稳定，但换手仅 0.18% 显示弹性弱）与<strong>焦煤敞口高、合约结构有利的标的</strong>（兖矿能源，小摩明确偏好）；不受益甚至受损的是<strong>火电企业</strong>（煤价上行即燃料成本上升）与<strong>高成本中小煤企</strong>（成本曲线右端，价格上行难以转化为利润）。注意 9/11 涨停的杭州热电、华银电力属电力逻辑，与煤炭股方向相反，不应计入本主线。</li><li><strong>主线联动</strong>：与 oil-hormuz（油价破 100、霍尔木兹）档案同属<strong>「资源品涨价」主线</strong>——能源比价是煤价的重要支撑，油价回落会同步削弱煤价上行的宏观叙事；与 copper-record（铜价历史新高）档案共同反映 2026 年资源品整体重估的宏观背景，三者应交叉验证：若油价与铜价同步走弱，本档案「供应受限 + 补库」的单一逻辑难以独立成立。与 phosphate-export 档案的联系在成本端——能源与硫磺成本共同推高化肥成本线。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>兖矿能源</b><span class=\"code\">600188</span><span class=\"tag\">研报唯一明确偏好</span><span class=\"cap\">20.11 元 · 流通 1199 亿 · 9/16 +0.15%</span></div>\n    <div class=\"logic\">焦煤敞口高·合约组合有利</div>\n    <div class=\"detail\">小摩短期偏好标的，理由在焦煤敞口与合约结构而非动力煤均价。现货占比高使其弹性大于神华，验证信号是焦煤价格而非动力煤均价。9/11 跌 1.70%，是研报偏好标的当日收跌。</div>\n    \n    \n    <div class=\"risk\">⚠️ 弹性与波动同源；评级维持中性</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中国神华</b><span class=\"code\">601088</span><span class=\"tag\">成本曲线最左端</span><span class=\"cap\">47.10 元 · 流通 7767 亿 · 9/16 +0.26%</span></div>\n    <div class=\"logic\">一体化·长协平滑·高股息基础</div>\n    <div class=\"detail\">煤电路港航一体化，吨煤成本行业最低，长协平滑弹性但换来现金流稳定与 6%~7% 股息率。研报上调目标价至 47 元却维持中性，并提示股息不可持续——与它的核心定价逻辑直接相关。9/11 涨 0.49%、换手仅 0.18%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 长协平滑上行弹性；股息下调则估值基础松动</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>陕西煤业</b><span class=\"code\">601225</span><span class=\"tag\">低成本+高股息双属性</span><span class=\"cap\">25.69 元 · 流通 2491 亿 · 9/16 -0.50%</span></div>\n    <div class=\"logic\">优质禀赋·机构票低换手</div>\n    <div class=\"detail\">国内最优质动力煤资源之一，吨煤成本低、分红稳定，是煤炭债性定价的典型代表。研报提示的股息可持续性问题对它同样适用。9/11 跌 0.15%、换手 0.43%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 煤价回落则高股息逻辑同步走弱</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中煤能源</b><span class=\"code\">601898</span><span class=\"tag\">第二大动力煤央企</span><span class=\"cap\">14.29 元 · 流通 1308 亿 · 9/16 +0.21%</span></div>\n    <div class=\"logic\">产量规模大·弹性居中</div>\n    <div class=\"detail\">国内第二大煤炭央企，产量规模大但吨煤成本高于神华与陕煤，弹性与稳定性均居中。9/11 收 14.73 元、跌 1.34%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 成本曲线位置居中，两头优势均不突出</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>潞安环能</b><span class=\"code\">601699</span><span class=\"tag\">喷吹煤弹性</span><span class=\"cap\">15.61 元 · 流通 467 亿 · 9/16 -0.38%</span></div>\n    <div class=\"logic\">焦煤线弹性品种</div>\n    <div class=\"detail\">喷吹煤与焦煤为主，方向与小摩偏好一致，弹性大但禀赋与分红弱于陕煤。9/11 跌 3.26%、量比 1.52。</div>\n    \n    \n    <div class=\"risk\">⚠️ 黑色系需求走弱时弹性向下放大</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>云煤能源</b><span class=\"code\">600792</span><span class=\"tag\">9/11 曾涨停后收 -4.81%</span><span class=\"cap\">4.85 元 · 流通 54 亿 · 9/16 -8.32%</span></div>\n    <div class=\"logic\">高换手 19.66%·冲高回落</div>\n    <div class=\"detail\">9/11 盘中曾涨停，收盘反跌 4.81%，换手高达 19.66%、量比 2.48——冲高回落叠加极高换手，是典型的一日游情绪资金特征，与煤炭板块当日整体走弱形成呼应。9/11 收 5.15 元。</div>\n    <div class=\"gene\">🧬 题材基因：西南焦煤小盘，历次煤炭行情中的高换手情绪先锋，冲高回落频率高</div>\n    \n    <div class=\"risk\">⚠️ 冲高回落+极高换手，情绪属性强于产业属性</div>\n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>杭州热电</b><span class=\"code\">605011</span><span class=\"tag\">9/11 唯一涨停·但主业热电</span><span class=\"cap\">18.26 元 · 流通 73 亿 · 9/16 -2.77%</span></div>\n    <div class=\"logic\">煤炭概念纯度低</div>\n    <div class=\"detail\">9/11 煤炭概念中唯一涨停标的（+10.00%、成交 3.12 亿、量比 2.81），但主业为热电联产，属于「煤价上行 → 电价/热价」逻辑而非煤炭生产受益方，实际上与煤价方向相反。作为板块温度计有价值，作为主线标的不成立。</div>\n    <div class=\"gene\">🧬 题材基因：杭州本地热电小盘，历史上多次在电力与煤炭主题间被反复切换炒作</div>\n    \n    <div class=\"risk\">⚠️ 主业热电，煤价上行对其是成本压力，概念与逻辑方向相反</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2021 动力煤保供行情：秦港 Q5500 一度冲至 2500 元/吨的历史极值，煤炭股集体翻倍，随后政策强力保供、价格快速回落——煤炭行情历史上具备「政策顶」特征，价格与股价的拐点常由供给政策而非需求决定。</li><li>2023–2024 高股息煤炭慢牛：中国神华、陕西煤业以股息逻辑走出持续行情，与煤价的相关性明显下降，说明该板块存在「商品定价」与「债性定价」两套逻辑并存的结构。</li><li>2025 供给侧与反内卷预期：煤炭限产预期推动阶段性反弹，但均因供应限制被证明为短期而回落——与小摩本次「供应限制可能属短期」的提示形成呼应。</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中国神华</b><span class=\"code\">601088</span><span class=\"tag\">低成本动力煤龙头·长协+自有运输</span></div>\n    <div class=\"logic\">煤电路港航一体化 | 长协占比高、煤价上行弹性弱但现金流稳 | 高股息是核心定价基础</div>\n    <div class=\"detail\">中国神华是国内动力煤成本曲线最左端的龙头，煤电路港航航一体化——自有铁路与港口让它的吨煤成本与运输成本显著低于同行，长协占比高意味着煤价上行的弹性被平滑，但换来的利润可预测性与现金流稳定性正是它 6%~7% 股息率的基础。小摩将 A 股目标价由 45 元上调至 47 元、H 股 44.5→46 港元，但<strong>维持「中性」</strong>。它的矛盾在于：这份研报同时上调了价格与提示了股息不可持续，而神华当前的核心定价逻辑恰恰是高股息。9/11 收 47.51 元、涨 0.49%，成交 14.5 亿但换手仅 0.18%——资金参与度极低，弹性温和的特征明显。</div>\n    \n    <div class=\"confirm\">✔ 确认：秦港 Q5500 站上 830 元/吨并维持 / 年度分红率不降 / 长协基准价上调</div>\n    <div class=\"risk\">⚠️ 长协机制平滑弹性，煤价上行难以转化为超额利润；股息率若下调则核心定价基础松动</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>兖矿能源</b><span class=\"code\">600188</span><span class=\"tag\">焦煤敞口高·小摩明确偏好</span></div>\n    <div class=\"logic\">焦煤/动力煤双敞口 | 合约组合有利、弹性大于神华 | 受焦煤价格而非动力煤均价驱动</div>\n    <div class=\"detail\">兖矿能源是小摩这份研报中<strong>唯一被明确偏好</strong>的标的，理由是「焦煤敞口较高及合约组合有利」——研报主标题讲动力煤，选股结论却落在焦煤，这是理解它的关键。相较神华的长协平滑，兖矿的现货/市场煤与焦煤占比更高，煤价上行的利润弹性更大，但波动也更大。目标价 A 股由 20 元上调至 22 元，同样维持「中性」。它的验证信号不在动力煤均价，而在<strong>焦煤价格是否同步走强</strong>。9/11 收 21.38 元、跌 1.70%——研报偏好的标的当日收跌，说明利好尚未被市场接收。</div>\n    \n    <div class=\"confirm\">✔ 确认：焦煤价格同步走强 / 主焦煤现货报价上行 / 公司季度商品煤售价环比提升</div>\n    <div class=\"risk\">⚠️ 弹性与波动同源，焦煤若随黑色系走弱则逻辑落空；研报维持中性</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>陕西煤业</b><span class=\"code\">601225</span><span class=\"tag\">低成本优质动力煤·高股息代表</span></div>\n    <div class=\"logic\">资源禀赋优、吨煤成本低 | 高分红记录稳定 | 动力煤纯 beta 载体</div>\n    <div class=\"detail\">陕西煤业拥有国内最优质的动力煤资源禀赋之一，吨煤成本处于行业最低区间，分红记录稳定——它同时具备「低成本」与「高股息」两个属性，是煤炭股债性定价逻辑的典型代表。与小摩逻辑的连接点在于：如果 830 元/吨的均价成立，低成本矿山的超额利润空间进一步扩大；但如果供应限制属短期、煤价回落，它的高股息同样面临研报提示的可持续性问题。9/11 收 26.05 元、跌 0.15%，成交 10.8 亿、换手 0.43%，与神华一样呈现低换手的机构票特征。</div>\n    \n    <div class=\"confirm\">✔ 确认：秦港 Q5500 站稳 830 元 / 公司维持高分红比例 / 吨煤成本继续下降</div>\n    <div class=\"risk\">⚠️ 高股息若因煤价回落而不可持续，估值中枢将同步下移</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>潞安环能</b><span class=\"code\">601699</span><span class=\"tag\">喷吹煤/焦煤弹性</span></div>\n    <div class=\"logic\">焦煤链条弹性标的，与小摩偏好方向一致但体量较小</div>\n    <div class=\"detail\">以喷吹煤与焦煤为主，属于小摩「偏好焦煤敞口」这条线上的弹性品种，弹性大于神华但资源禀赋与分红稳定性弱于陕煤。9/11 收 15.72 元、跌 3.26%、量比 1.52，是当日跌幅较大的煤炭股之一。</div>\n    \n    \n    <div class=\"risk\">⚠️ 黑色系需求若走弱，喷吹煤价格弹性会向下放大</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>山煤国际</b><span class=\"code\">600546</span><span class=\"tag\">贸易+生产双属性</span></div>\n    <div class=\"logic\">煤炭贸易属性重，煤价上行的传导纯度低于纯生产商</div>\n    <div class=\"detail\">煤炭生产与贸易双主业，贸易业务会稀释煤价上行的利润弹性，属传导链纯度较低的标的。9/11 收 13.30 元、跌 3.20%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 贸易业务摊薄弹性，且承担价格双向波动风险</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>火电企业</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">煤价上涨对火电是明确的成本挤压，不在受益侧。9/11 华银电力涨停属电力/绿电逻辑，不应计入煤炭主线。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>高成本中小煤企</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">吨煤成本处于行业右端的企业，煤价小幅上行首先被成本吞噬，830 元/吨的均价假设对它们的边际利润改善有限。</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**涨价预期上调型**：券商预测上修但股价已先行。基准参照：2023 年冬储行情，煤价预测上修后股价 5 日内见顶，现货追上预测需 4-6 周。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">兖矿能源 ＞ 中国神华 ＞ 陕西煤业。排序理由：市场煤比例高者弹性大（兖矿），长协占比高者稳健但弹性小（神华），陕煤居中。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">杭州热电（情绪龙）＞ 云煤能源。gene：杭州热电是煤炭行情的反向情绪票（煤价涨 → 火电成本升 → 热电小盘被炒作电价联动），属主题末端。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若秦港 Q5500 现货站上 830 元/吨并维持两周以上**且**北方港库存去化、沿海电厂日耗同比转正 → 逻辑状态由「预测上调」升为「现货确认」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 秦港 Q5500 现货站上 830 元/吨并维持两周以上 ② 北方港库存去化、沿海电厂日耗同比转正 ③ 券商继续上修 2027 年预测。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 安监放松或产能核增、原煤产量回升、煤价回落至 800 元/吨下方 ② 迎峰度冬补库不及预期、北方港库存继续累积 ③ 券商回撤目标价。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">注意一个细节：神华目标价从 45 上调到 47 元，**但评级维持中性**——券商在提价的同时不提评级，说明它认为这波是季节性反弹而非周期反转。本档是典型的「股价已抢跑、研报未定价」，Q3 以来煤炭股已涨 16~22%，预期差基本被抹平。火电企业与高成本中小煤企是受损方，已列入剔除。</div></div></div>\n\n    \n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>秦港 Q5500 现货站上 830 元/吨并维持两周以上</b></li><li><b>北方港库存去化、沿海电厂日耗同比转正，补库需求实质启动</b></li><li><b>焦煤价格同步走强（验证小摩「偏好焦煤敞口」这一选股结论）</b></li><li><b>更多卖方跟进上调 2026 煤价预测，并将神华/兖矿评级由中性上调</b></li><li><b>大秦线秋季检修期间供给阶段性收缩、港口库存快速下降</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>供应限制解除（安监放松或产能核增），原煤产量回升，煤价回落至 800 元/吨下方</b></li><li><b>迎峰度冬补库不及预期，北方港库存继续累积</b></li><li><b>小摩自述的「高股息未必可持续」被证实——主要煤企分红率下调</b></li><li><b>煤炭股在研报发布后继续跑输大盘，说明市场不认可价格上调向盈利的转化</b></li><li><b>油价跌破 100 美元后持续走弱，能源比价支撑消失（与 oil-hormuz 档案交叉验证）</b></li><li><b>兖矿能源在研报偏好后仍持续下跌，选股结论被市场否定</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">每日</div><div class=\"wh\">秦港 Q5500 现货价与北方港（环渤海九港）库存</div><div class=\"wy\">830 元/吨是本档案的核心数字，站上与否直接决定预测能否转为现实</div></div><div class=\"tkc\"><div class=\"w\">9 月下旬–10 月</div><div class=\"wh\">大秦线秋季检修进度与发运量</div><div class=\"wy\">阶段性供给收缩是短期煤价上行风险的主要来源，也是「限制属短期」的佐证</div></div><div class=\"tkc\"><div class=\"w\">10 月下旬</div><div class=\"wh\">三季报，验证 Q3 煤价 +14% 的业绩转化</div><div class=\"wy\">价格环向业绩环传导的唯一客观检验，小摩盈利调整仅 -2%~+4%</div></div><div class=\"tkc\"><div class=\"w\">Q4</div><div class=\"wh\">迎峰度冬日耗、电厂补库节奏与年度长协基准价谈判</div><div class=\"wy\">决定 2027 年价格中枢与高股息可持续性</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">焦煤/主焦煤现货报价与黑色系需求</div><div class=\"wy\">小摩选股结论落在焦煤敞口，焦煤才是这份研报的真正胜负手</div></div></div>\n\n    <div class=\"src\">数据来源：摩根大通研报(9/11) ｜ 财联社(9/11 17:05) ｜ 格隆汇(9/11) ｜ 智通财经/腾讯新闻(9/11) ｜ 金融界 7×24(9/11) ｜ 腾讯行情(9/11) ｜ iFinD 盘面数据(9/11)</div>\n    <footer>动力煤价上调至830元 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "mlcc-murata-eol", "title": "村田停产常规MLCC", "date": "2026-09-10", "grade": "正式档", "pricing": "未定价", "crate": "bolt", "search": "村田停产常规mlcc 9/10 17:18 盘后 eol 通知 · grm 等 9 大系列料号退场 · 最后下单 2028/3/31 · 最终出货 2029/3/31 产业周期 ⚡ 供给退出型 · 盘后落地、板块平盘完全未定价", "card": "<a class=\"card-c\" href=\"#mlcc-murata-eol\" data-search=\"村田停产常规mlcc 9/10 17:18 盘后 eol 通知 · grm 等 9 大系列料号退场 · 最后下单 2028/3/31 · 最终出货 2029/3/31 产业周期 ai算力与电力配套 未定价 三环集团 风华高科 国瓷材料 洁美科技 博迁新材\" data-grade=\"正式档\" data-pricing=\"未定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-10</span>\n    <span class=\"crate bolt\">⚡ 供给退出型 · 盘后落地、板块平盘完全未定价 产业周期</span>\n  </div>\n  <div class=\"ctitle\">村田停产常规MLCC</div>\n  <div class=\"csub\">9/10 17:18 盘后 EOL 通知 · GRM 等 9 大系列料号退场 · 最后下单 2028/3/31 · 最终出货 2029/3/31</div>\n  <div class=\"cpos\">9/10 盘后村田 EOL 通知：GRM 等 9 大系列常规 MLCC 料号退场，最后下单 2028/3/31；A 股被动元件板块当日平盘、完全未定价。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">AI算力与电力配套</span>\n    \n    <span class=\"chip pri\">未定价</span>\n    <span class=\"chip\">标的 7</span>\n    <span class=\"nm\">三环集团</span><span class=\"nm\">风华高科</span><span class=\"nm\">国瓷材料</span><span class=\"nm\">洁美科技</span><span class=\"nm\">博迁新材</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-10 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-10</div>\n    <h1>村田停产常规MLCC</h1>\n    <div class=\"sub\">9/10 17:18 盘后 EOL 通知 · GRM 等 9 大系列料号退场 · 最后下单 2028/3/31 · 最终出货 2029/3/31</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 供给退出型 · 盘后落地、板块平盘完全未定价</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：未定价</span>\n      <span class=\"badge neutral\">主线：AI算力与电力配套</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">ai-compute-hike</span><span class=\"tag\" style=\"margin-right:4px\">deepseek-chain</span><span class=\"tag\" style=\"margin-right:4px\">gas-turbine-aidc-orders</span><span class=\"tag\" style=\"margin-right:4px\">intel-cpu-price-hike</span><span class=\"tag\" style=\"margin-right:4px\">optical-chip-shortage</span><span class=\"tag\" style=\"margin-right:4px\">power-semi-hike3</span></div>\n    <div class=\"posnote\">9/10 盘后村田 EOL 通知：GRM 等 9 大系列常规 MLCC 料号退场，最后下单 2028/3/31；A 股被动元件板块当日平盘、完全未定价。</div>\n    <details class=\"more\"><summary>展开定价状态详版（538 字）</summary><div class=\"pos\"><b>定价状态备注：</b>EOL 通知 <strong>9/10 17:18 盘后</strong>由《科创板日报》披露，A 股已收盘 2 小时余。<strong>盘面状态</strong>：9/10 MLCC 板块指数收 <strong>-0.02%</strong>（759.24 点），全链<strong>无一只涨停</strong>——龙头三环集团 117.70 元 <strong>-0.06%</strong>、国瓷材料 60.35 元 <strong>-0.03%</strong>、洁美科技 61.40 元 <strong>-0.42%</strong>、鸿远电子 47.67 元 <strong>-0.36%</strong> 全线收绿；仅风华高科 50.90 元 <strong>+2.41%</strong>（主力净流入 2.31 亿）、火炬电子 46.87 元 <strong>+2.05%</strong> 小幅收红。当日全市场涨停 25 家，题材 TOP12 为绿色电力/风电/并购重组/DeepSeek，<strong>无 MLCC 或被动元件</strong>；芯片概念仅 5 家 2 板（鼎信通讯）。这是客观事实陈述——产业侧已发生、股价侧零反应，次日竞价是定价窗口。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">全球 MLCC 龙头<strong>村田制作所</strong>正式发布官方通知，宣布在 2026 会计年度启动产品线优化，<strong>停产部分 MLCC 产品并扩充其他产能</strong>。三个硬性时点：客户书面回复截止 <strong>2027/12/31</strong>、最后下单（LTB）截止 <strong>2028/3/31</strong>、最终出货日 <strong>2029/3/31</strong>。最后下单需符合 MOQ 与包装数量限制，除品质问题外不接受取消或退货。</div></div><div class=\"card fact\"><b class=\"k\">停产范围</b><div class=\"v\">共 <strong>9 大系列</strong>特定料号：消费级常规系列 <strong>GRM、GRJ、GRT、GXM、GXT</strong>，车用 AEC-Q200 规格系列 <strong>GCM、GCJ、GCG、ZRA</strong>。即村田同时退出「消费级常规」与「车规中低阶」两块成熟市场，而非单一料号微调。</div></div><div class=\"card fact\"><b class=\"k\">为什么停——产能腾挪而非需求萎缩</b><div class=\"v\">村田口径是「稳定 MLCC 供货架构、改善技术支援体系」，市场分析直指<strong>腾出产能扩高端</strong>：其高附加值 MLCC 交货期已从常规的 <strong>8-10 周急剧拉长至 20-26 周以上</strong>，AI 服务器用高容值产品挤占了产线。这是<strong>主动优化产品结构</strong>，不是被动减产——意味着退出的产能不会回来。</div></div><div class=\"card fact\"><b class=\"k\">行业已在涨价——村田不是孤例</b><div class=\"v\">TrendForce 调查：<strong>三星电机</strong>对 OEM/ODM 的 2026Q4 报价，消费级 <strong>X5R 平均上调 25%-30%</strong>（目的是抑制订单、腾产能），AI 服务器高端 <strong>X6S 涨 10%-20%</strong>；订单外溢导致其他厂商 Q4 报价平均涨 <strong>10%-20%</strong>，<strong>稼动率部分供应商已接近九成</strong>。台系<strong>国巨、华新科</strong> Q4 给 ODM 的 MLCC 报价<strong>环比涨 35%</strong>、电阻涨 <strong>20%-30%</strong>。</div></div><div class=\"card fact\"><b class=\"k\">需求侧拉动</b><div class=\"v\">AI 数据中心需求持续强劲，<strong>光通信模块供货缺口扩大</strong>，连带 MLCC 需求吃紧。国内调研反馈：主力企业产线满载、出厂价未见松动；上游材料商作为「卖铲人」订单充沛，<strong>有企业称已被客户提前锁定 4 倍于现有产能的扩产线</strong>。</div></div><div class=\"card fact\"><b class=\"k\">政策同日加持</b><div class=\"v\"><strong>9/10 19:03</strong>，工信部电子信息司召开<strong>电子元器件产业发展座谈会</strong>——与村田 EOL 通知同日、相隔不足 2 小时。产业侧供给退出 + 政策侧产业座谈落在同一天，是本次催化区别于单纯涨价传闻的地方。</div></div><div class=\"card fact warn\"><b class=\"k\">争议点：时间轴极长，短期无业绩</b><div class=\"v\">这是本次催化<strong>最大的硬伤</strong>：最后下单要到 <strong>2028/3</strong>、出货到 <strong>2029/3</strong>，按 A 股定价习惯属于<strong>超长周期叙事</strong>，2026-2027 年报表基本不受影响。且村田退出的是<strong>低毛利成熟料号</strong>，国产替代集中在中低端，高端 AI 用高容 MLCC 的认证门槛（车规替代需 <strong>6-18 个月</strong>认证期）短期跨不过去。真正能兑现的是<strong>「外溢订单 + 涨价」而非「替代村田」</strong>。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/10 MLCC 板块指数 -0.02%，全链无涨停。三环集团 117.70 元 -0.06%（成交 38.48 亿、市值 2350 亿，板块最大权重）、国瓷材料 60.35 元 -0.03%、洁美科技 61.40 元 -0.42%、鸿远电子 47.67 元 -0.36%、博迁新材 133.52 元 +0.06%——<strong>核心标的几乎全部平走或收绿</strong>。仅风华高科 +2.41%（换手 7.92%、主力净流入 2.31 亿、成交 45.75 亿为链内最大）与火炬电子 +2.05% 收红。当日涨停题材 TOP12 无被动元件。EOL 通知 17:18 盘后披露，<strong>资金完全未对供给退出逻辑定价</strong>。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-10</div><div><div class=\"x\">村田停产常规MLCC：9/10 17:18 盘后 EOL 通知 · GRM 等 9 大系列料号退场 · 最后下单 2028/3/31 · 最终</div><div class=\"y\">为什么：本档为「AI算力·被动元件涨价」的建档时点，后续二段催化均在此之上叠加</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「供给退出型」催化，<strong>三个要害</strong>：一是<strong>性质要看准</strong>——村田不是被动减产，而是主动砍低毛利料号、把产能挪给 AI 服务器高容 MLCC（交期 8-10 周→20-26 周），退出的产能不会回来，这决定了它是<strong>结构性供给收缩</strong>而非周期性波动；二是<strong>受益路径有两条、强度差别大</strong>——「涨价」这条路径已经在走（三星电机 X5R +25%-30%、国巨 +35%、稼动率近九成），是<strong>当下可验证</strong>的；「替代村田」这条路径要过 6-18 个月车规认证、且 2028 年才最后下单，是<strong>远水</strong>。市场若按第二条定价会高估短期弹性。三是<strong>价格弹性最大的不是最纯的</strong>——风华高科 MLCC 占营收约 40%（高端占 MLCC 的 35%-40%），纯度最高但已连涨（YTD +214.57%）；三环集团纯度高、市值大、弹性温和；上游材料端（国瓷材料钛酸钡粉体、博迁新材镍粉、洁美科技载带）是「卖铲人」，<strong>不挑终端谁赢、只挑总量</strong>。<strong>隐藏面</strong>：9/10 工信部电子元器件座谈会与 EOL 同日，政策与产业供给退出撞在一起，但盘面零反应——说明当前市场注意力全在绿色电力/风电/并购重组上，电子元器件是<strong>无人区</strong>，这既是预期差所在，也意味着缺乏赚钱效应带来的自发资金。<br>① <strong>分水岭时点</strong>：国巨/华新科 10 月现货报价是否兑现 +35%，以及三环集团、风华高科 Q3 财报毛利率能否环比扩张——涨价从报价到报表的唯一客观验证。<br>② <strong>传导的关键约束</strong>：时间轴。最后下单 2028/3、出货 2029/3，A 股定价周期远短于此，若市场按「替代村田」讲三年故事，则节奏与股价将严重错配。<br>③ <strong>待验证的核心变量</strong>：消费级中高容订单<strong>外溢到大陆厂商的实际接单量</strong>——这是唯一能在 1-2 个季度内证伪的变量。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>村田官方 EOL 通知已发，9 系列料号、三个时点明确</li><li>主动优化产品结构、腾产能给 AI 高容，退出不可逆</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强</span><ul><li>三星电机 X5R +25%-30%、X6S +10%-20%，国巨/华新科 +35%，涨价已在走</li><li>稼动率接近九成、交期 8-10 周拉长至 20-26 周，供给紧是客观状态</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">远</span><ul><li>最后下单 2028/3、出货 2029/3，2026-2027 报表不受影响</li><li>车规替代需 6-18 个月认证，高端替代短期跨不过去</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">未动</span><ul><li>9/10 MLCC 板块 -0.02%，全链无涨停，龙头全绿</li><li>EOL 17:18 盘后落地，当日资金零反应</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强、业绩远、股价未动——典型的「产业先走、股价未跟」，但业绩环的时间跨度是这条链上最弱的一环。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>65%</strong>：变化/影响两环扎实且有精确数字支撑，业绩环因时间轴过长而虚弱，股价环完全空白（未定价既是机会也是风险——无人区缺乏赚钱效应）。</li><li><strong>边界要切开</strong>：受益的是<strong>消费级中高容产能承接方</strong>（风华高科、三环集团）与<strong>不挑终端的上游材料「卖铲人」</strong>（国瓷材料钛酸钡粉体、博迁新材镍粉、洁美科技载带/离型膜）；<strong>不受益甚至受损</strong>的是下游消费电子整机与模组厂（元器件涨价=成本），以及以军工特种电容为主、民用消费级产能小的厂商（鸿远电子、火炬电子主业在军工侧，替代逻辑关联度弱）。</li><li><strong>主线联动</strong>：本档案归属<strong>「AI算力·被动元件涨价」主线</strong>，与 intel-cpu-price-hike（英特尔 CPU 三连涨）、ai-compute-hike（云厂商上调算力价）、gas-turbine-aidc-orders（全球燃机订单）共同构成<strong>AI 资本开支向上传导的完整链条</strong>——算力涨价 → 服务器/机柜扩产 → 被动元件与电力配套同步吃紧。四份档案互为印证：若 AI capex 见顶，则本档案的需求环与另外三份同步走弱；反之若国巨 10 月 +35% 兑现，则 intel-cpu-price-hike 的「涨价实锤」判断得到交叉验证。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>三环集团</b><span class=\"code\">300408</span><span class=\"tag\">国产 MLCC 规模与技术双龙头</span><span class=\"cap\">129.88 元 · 流通 2429 亿 · 9/16 +2.91%</span></div>\n    <div class=\"logic\">MLCC 一哥·9/10 -0.06%</div>\n    <div class=\"detail\">唯一在材料—元件一体化上做到平台级的国内公司，村田退出后产能规模与认证资质最接近承接方。同时是光通信陶瓷插芯龙头，一条腿吃供给退出、一条腿吃需求爆发。但 2350 亿市值决定它是压舱石而非弹性源。</div>\n    \n    \n    <div class=\"risk\">⚠️ 大市值弹性温和，H 股折价牵制估值</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>风华高科</b><span class=\"code\">000636</span><span class=\"tag\">纯度最高·主力净流入 2.31 亿</span><span class=\"cap\">58.58 元 · 流通 672 亿 · 9/16 +1.86%</span></div>\n    <div class=\"logic\">MLCC 占营收 40%·9/10 +2.41%</div>\n    <div class=\"detail\">MLCC 占营收约 40%，与村田退出的消费级常规、车规中低阶料号带高度重合，是替代路径最直接的承接方。9/10 链内唯一放量红盘，成交 45.75 亿、主力净流入 2.31 亿且连续 2 日增仓。</div>\n    \n    \n    <div class=\"risk\">⚠️ YTD +214.57%、PE 143.6 倍，位置不低</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>国瓷材料</b><span class=\"code\">300285</span><span class=\"tag\">卖铲人·不挑终端谁赢</span><span class=\"cap\">68.27 元 · 流通 582 亿 · 9/16 +2.51%</span></div>\n    <div class=\"logic\">钛酸钡粉体·9/10 -0.03%</div>\n    <div class=\"detail\">纳米钛酸钡粉体龙头，无论最终谁拿到订单，只要行业总产量扩张需求就同步走。确定性高于纯度、弹性低于纯度，是高容 MLCC 粉体国产替代的少数供应商。</div>\n    \n    \n    <div class=\"risk\">⚠️ 传导链较远，吃量不吃价</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>洁美科技</b><span class=\"code\">002859</span><span class=\"tag\">出货必经耗材·对量映射最纯</span><span class=\"cap\">67.85 元 · 流通 291 亿 · 9/16 +2.52%</span></div>\n    <div class=\"logic\">载带/离型膜·9/10 -0.42%</div>\n    <div class=\"detail\">MLCC 载带与离型膜是元件出货的必经耗材，对「量」的映射最纯粹、不分品牌。缺点是单价低、议价弱，吃量不吃价。</div>\n    \n    \n    <div class=\"risk\">⚠️ 耗材属性毛利弹性小，YTD 涨幅已大</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>博迁新材</b><span class=\"code\">605376</span><span class=\"tag\">高容产品用量倍增受益</span><span class=\"cap\">138.31 元 · 流通 362 亿 · 9/16 +2.38%</span></div>\n    <div class=\"logic\">镍粉电极材料·9/10 +0.06%</div>\n    <div class=\"detail\">MLCC 内电极超细镍粉主材，高容层数越多用量越大，在 AI 服务器高容线上比消费级更有弹性。但归属有色金属板块，股价随金属价波动。</div>\n    \n    \n    <div class=\"risk\">⚠️ PE 140 倍、PB 19 倍，估值极端</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>昀冢科技</b><span class=\"code\">688260</span><span class=\"tag\">消费电子精密件·MLCC 概念跟风票</span><span class=\"cap\">119.91 元 · 流通 144 亿 · 9/16 +2.43%</span></div>\n    <div class=\"logic\">9/10 +0.72%·20日 -21.74%</div>\n    <div class=\"detail\">主业消费电子精密零组件，被市场归入 MLCC/被动元件概念范畴。9/10 收 92.60 元 +0.72%，但 20 日 -21.74%、PE(TTM) 为负（-61 倍）、PB 高达 79.6 倍——<strong>基本面与估值均无支撑，纯题材属性</strong>。这类票在板块启动时弹性最大，但回落也最快。</div>\n    <div class=\"gene\">🧬 题材基因：被动元件/消费电子题材中的小盘高弹性跟风票，历次 MLCC 涨价传闻行情中常作为情绪放大器出现，缺乏基本面锚、由资金与辨识度驱动</div>\n    \n    <div class=\"risk\">⚠️ PE 为负、PB 79.6 倍，无基本面支撑；题材属性纯筹码</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>利和兴</b><span class=\"code\">301013</span><span class=\"tag\">设备端边缘映射</span><span class=\"cap\">40.20 元 · 流通 76 亿 · 9/16 +3.18%</span></div>\n    <div class=\"logic\">智能制造装备·概念边缘</div>\n    <div class=\"detail\">主业自动化设备，被归入 MLCC 产业链设备端，属传导链最远端。产能扩张时设备订单滞后受益，但节奏慢于元件与材料。</div>\n    <div class=\"gene\">🧬 题材基因：电子元器件设备端小盘，涨价行情中通常作为末位补涨品种出现</div>\n    \n    <div class=\"risk\">⚠️ 传导链最远端，映射关联度弱</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2018 年 MLCC 涨价潮：村田、太阳诱电退出中低阶料号转向车规与高端，国巨、华新科连续多轮提价，部分料号涨幅超 5 倍，A 股风华高科当年走出翻倍行情，三环集团走长牛——本轮与 2018 年的<strong>供给退出路径高度相似</strong>。</li><li>2020-2021 年缺货涨价：疫情导致产能受限 + 需求回补，MLCC 交期从数周拉长至 20 周以上，与本次 20-26 周的量级相当；期间风华高科、三环集团均创阶段新高。</li><li>2025 年 AI 服务器拉动高容 MLCC：高端 X6S 等料号交期率先拉长，村田、三星电机先后将产能向 AI 用产品倾斜——本轮是这条路径的延续与加速，而非新起点。</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>三环集团</b><span class=\"code\">300408</span><span class=\"tag\">MLCC 国产一哥·陶瓷材料平台·板块最大权重</span></div>\n    <div class=\"logic\">国内 MLCC 规模与技术双龙头 | 弹性来自中高容国产替代 + 涨价 | 约束是市值 2350 亿、弹性被稀释</div>\n    <div class=\"detail\">国内 MLCC 绝对龙头，也是唯一在<strong>材料—元件一体化</strong>上做到平台级的公司：自产陶瓷粉体、MLCC、陶瓷插芯（光通信）、半导体封装基板多条腿。村田退出消费级常规与车规中低阶料号后，它是国内<strong>产能规模与认证资质最接近承接方</strong>的标的——2026 年已通过多家国际客户认证。弹性来源有两层：一是中高容订单外溢带来的<strong>量</strong>，二是行业普涨背景下的<strong>价</strong>。但要清醒：总市值 2350 亿、9/10 收 117.70 元 -0.06%，<strong>大市值决定了它是板块的「压舱石」而非「弹性源」</strong>，涨价对它的边际利润改善远不如小市值同行显著。独特之处在于：它同时是光通信陶瓷插芯龙头，而本轮需求端缺口正来自光模块——<strong>一条腿吃供给退出、一条腿吃需求爆发</strong>。</div>\n    \n    <div class=\"confirm\">✔ 确认：三季报 MLCC 毛利率环比扩张 / 公告扩产或大客户认证通过 / 月内出现放量长阳脱离横盘</div>\n    <div class=\"risk\">⚠️ 市值 2350 亿、PE(TTM) 70.9 倍，弹性温和；且已有 H 股上市（H/A 折价 -13%），估值受两地牵制</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>风华高科</b><span class=\"code\">000636</span><span class=\"tag\">MLCC 纯度最高·9/10 链内唯一放量红盘</span></div>\n    <div class=\"logic\">MLCC 占营收约 40%，纯度链内最高 | 弹性来自中低端涨价直接传导 | 约束是 YTD 已 +214.57%、20 日 -17.93%</div>\n    <div class=\"detail\">国内 MLCC 纯度最高的上市标的——据 2026/5/26 公告，<strong>MLCC 产品占公司整体营收约 40%，其中高端 MLCC 占 MLCC 总营收的 35%-40%</strong>（约占整体营收 15%）。村田退出的正是<strong>消费级常规 + 车规中低阶</strong>这两块，与风华主力产能带高度重合，是本次事件中<strong>替代路径最直接</strong>的承接方。9/10 的表现也印证了它的辨识度：收 50.90 元 <strong>+2.41%</strong>，成交 45.75 亿为链内最大，换手 7.92%，<strong>主力净流入 2.31 亿、连续 2 日被主力增仓</strong>——在整条链全线收绿时是唯一有资金主动做多的。独特之处：它还布局抗硫化电阻器、射频电感并<strong>已直接应用于光模块</strong>，而本轮需求缺口正源自光模块供货紧张，是供需两端同时沾边的少数标的。</div>\n    \n    <div class=\"confirm\">✔ 确认：9/11 竞价高开幅度与能否放量突破 51.45 元日内高点 / Q3 财报 MLCC 毛利环比改善 / 公司公告接单或扩产</div>\n    <div class=\"risk\">⚠️ YTD 已 +214.57%、PE(TTM) 143.6 倍，位置不低；20 日 -17.93% 说明筹码在松动，平均成本 53.67 元仍在股价上方</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>国瓷材料</b><span class=\"code\">300285</span><span class=\"tag\">钛酸钡粉体卖铲人·不挑终端谁赢</span></div>\n    <div class=\"logic\">MLCC 纳米钛酸钡粉体国内龙头 | 弹性来自全行业总量扩张 | 约束是传导链较远、不直接吃涨价</div>\n    <div class=\"detail\">处在上游材料环节，是典型的<strong>「卖铲人」</strong>——纳米级钛酸钡粉体是 MLCC 的核心介质材料，无论最终是村田、国巨、三环还是风华拿到订单，只要<strong>行业总产量扩张</strong>，粉体需求就同步走。这决定了它的<strong>确定性高于纯度低于弹性</strong>：不吃涨价的价差红利，但吃量的确定性，且不承担单一厂商丢单的风险。独特之处在于它在<strong>高端粉体上的国产替代地位</strong>——村田把产能挪向 AI 高容 MLCC，高容产品对粉体纯度和粒径要求陡升，国内能供的厂商屈指可数。9/10 收 60.35 元 <strong>-0.03%</strong>，成交 27.32 亿，与板块同步平走，未定价。</div>\n    \n    <div class=\"confirm\">✔ 确认：钛酸钡粉体出货量或公告扩产 / 高容 MLCC 粉体客户认证突破 / 三季报材料板块收入提速</div>\n    <div class=\"risk\">⚠️ 传导链较远，粉体涨价幅度通常小于元件；PE(TTM) 93.8 倍已含较多预期，20 日 -14.53%</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>洁美科技</b><span class=\"code\">002859</span><span class=\"tag\">MLCC 载带/离型膜配套龙头</span></div>\n    <div class=\"logic\">MLCC 出货必经的包装耗材，量的映射最直接</div>\n    <div class=\"detail\">做 MLCC 载带与离型膜，是元件出货的<strong>必经耗材</strong>——出货量增则载带用量同比例增，是整条链上<strong>对「量」映射最纯粹</strong>的环节，且不分国产品牌还是海外品牌。缺点同样明显：耗材单价低、议价能力弱，吃量不吃价，且已有 YTD +124.24% 的涨幅。9/10 收 61.40 元 -0.42%，交投清淡（量比 0.89）。</div>\n    \n    \n    <div class=\"risk\">⚠️ 耗材属性，毛利弹性小；YTD 涨幅已大，20 日 -17.79%</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>博迁新材</b><span class=\"code\">605376</span><span class=\"tag\">MLCC 镍粉电极材料·高端品占比高</span></div>\n    <div class=\"logic\">镍粉为 MLCC 内电极主材，高容产品用量倍增</div>\n    <div class=\"detail\">主营 MLCC 用<strong>超细镍粉</strong>，是内电极主材。高容值 MLCC 层数越多、镍粉用量越大，因此它在<strong>AI 服务器高容产品放量</strong>这条线上比普通消费级更有弹性。但注意它归属有色金属/能源金属板块（9/10 该板块 -1.25%），股价更多随金属与粉体价格而非 MLCC 题材波动。9/10 收 133.52 元 +0.06%，PE(TTM) 140 倍、PB 19.15 倍，估值极端。</div>\n    \n    \n    <div class=\"risk\">⚠️ PE 140 倍、PB 19 倍，估值极端；板块归属有色金属，题材映射不纯</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>鸿远电子</b><span class=\"code\">603267</span><span class=\"tag\">军工特种电容为主·民用替代关联弱</span></div>\n    <div class=\"logic\">主业在军工特种 MLCC，与消费级替代路径重合度低</div>\n    <div class=\"detail\">虽是 MLCC 厂商，但主业集中在<strong>军工/特种领域</strong>，产能与认证体系服务军用客户，与村田退出的<strong>消费级常规、车规</strong>料号带重合度低。军工订单有自己的周期（取决于「十五五」订单落地节奏），不随民用涨价周期波动。9/10 收 47.67 元 -0.36%，YTD -12.02% 是链内唯一负收益标的，也印证它与本轮民用涨价逻辑脱钩。</div>\n    \n    \n    <div class=\"risk\">⚠️ 军工周期与民用 MLCC 涨价周期不同步；YTD -12%，走势独立</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>火炬电子</b><span class=\"code\">603678</span><span class=\"tag\">军工电容+民品双轨·9/10 +2.05%</span></div>\n    <div class=\"logic\">军工特种电容为主、兼有民品 MLCC，双重属性</div>\n    <div class=\"detail\">军工特种电容与民用 MLCC 双轨运行，民用板块能部分承接村田退出的常规料号，但占比不足以成为主导逻辑。9/10 收 46.87 元 <strong>+2.05%</strong>、振幅 5.64% 是链内第二活跃标的，说明有资金在按 MLCC 概念做它，但要注意它归属<strong>国防军工板块</strong>（9/10 -0.05%），题材归属存在分歧。</div>\n    \n    \n    <div class=\"risk\">⚠️ 主业军工，民用占比不足以支撑纯逻辑；板块归属军工，容易被资金按军工而非 MLCC 定价</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>鸿远电子</b><span class=\"code\">603267</span></div>\n    <div class=\"logic\">主业军工/特种领域，产能与认证体系服务军用客户，与村田退出的消费级常规、车规料号带重合度低。9/10 -0.36%、YTD -12.02% 印证它与民用涨价逻辑脱钩。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>消费电子整机与模组厂</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">MLCC 与电阻涨价对下游整机、模组厂是<strong>成本端挤压</strong>而非受益方。在终端需求未全面复苏的背景下，它们难以向下游传导成本，是这条涨价链上明确的受损侧。</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**供给退出型**涨价催化，盘后落地。基准参照：2018 年 MLCC 缺货行情，村田/三星电机停产中低端料号后，台系现货价 3 个月涨 3-5 倍。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">三环集团 ＞ 风华高科 ＞ 国瓷材料。排序理由：三环是国内 MLCC 产能最大、产品结构最接近村田退场料号者；风华次之；国瓷为上游粉体，传导较远。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">昀冢科技 ＞ 利和兴。gene：电子陶瓷/精密件小盘，2018 MLCC 行情中作为末端补涨票出现过连板，属典型第三波品种。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若国巨、华新科 10 月现货报价兑现环比 +35%、电阻 +20%-30% → 逻辑状态由「EOL 预期」升为「全行业涨价实锤」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 台系 10 月调价函落地（电容 +35%、电阻 +20%-30%） ② 三环/风华公告消费级中高容订单外溢接单量 ③ 国内厂商跟进发布涨价函。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 台系 10 月调价落空或幅度明显低于 35% ② 村田补充说明停产仅限极少数老旧料号 ③ 国内厂商未跟涨、现货价回落。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">EOL 的最后下单日是 2028/3/31、最终出货 2029/3/31——这是**三年**的退出周期，不是明年就要缺货。短期弹性取决于台系 10 月调价函能否兑现。另一个陷阱：鸿远电子是军工特种 MLCC，与村田退场的消费级料号不是同一个市场，已列入剔除。</div></div></div>\n\n    \n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>国巨、华新科 10 月现货报价兑现环比 +35%、电阻 +20%-30%（台系厂商调价函落地）</b></li><li><b>三环集团或风华高科公告消费级中高容订单外溢接单量，或披露扩产计划</b></li><li><b>2026 三季报 MLCC 相关业务毛利率环比扩张——涨价从报价传导至报表的唯一硬证据</b></li><li><b>国内厂商稼动率进一步升至九成以上，交期继续拉长</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>台系 10 月调价落空或幅度明显低于 35%，涨价循环证伪</b></li><li><b>村田后续补充说明停产范围仅为极少数老旧料号、影响可忽略</b></li><li><b>三季报 MLCC 厂商毛利率未改善，涨价停留在报价层面未落到报表（参照磷肥出口「纸面订单」的教训）</b></li><li><b>下游消费电子需求走弱，中高容订单外溢量不足以填补稼动率</b></li><li><b>9/11 竞价 MLCC 板块无反应、风华高科冲高回落，连「预期差修复」都没有</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">10 月初</div><div class=\"wh\">台系国巨、华新科现货调价函是否落地 +35%</div><div class=\"wy\">第三波涨价的发令枪，也是本轮涨价循环能否延续的最直接判据</div></div><div class=\"tkc\"><div class=\"w\">10 月下旬</div><div class=\"wh\">三环集团、风华高科、国瓷材料三季报毛利率与 MLCC 业务收入</div><div class=\"wy\">涨价从报价走向报表的唯一客观节点，全档案最关键</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">村田/三星电机高容 MLCC 交期（当前 20-26 周）变化</div><div class=\"wy\">交期是供需紧张度最灵敏的高频指标，领先于价格</div></div><div class=\"tkc\"><div class=\"w\">2027 年前</div><div class=\"wh\">客户书面回复（截止 2027/12/31）的集中度与切换方向</div><div class=\"wy\">决定国产厂商最终能拿到多少替代份额，验证长期叙事</div></div></div>\n\n    <div class=\"src\">数据来源：《科创板日报》9/10 17:18 村田 EOL 通知 ｜ 网易财经/东方财富转载 9/10 ｜ TrendForce MLCC 行业调查（三星电机 Q4 报价） ｜ 财联社主题库 ｜ 工信部电子信息司电子元器件产业发展座谈会 9/10 19:03 ｜ 风华高科 2026/5/26 公告 ｜ 新浪财经资金流 9/10 ｜ 东财 7×24 快讯 707 条 · 东财券商研报 57 篇 · iFinD 盘面数据 9/10</div>\n    <footer>村田停产常规MLCC · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "power-semi-hike3", "title": "功率半导体三波涨价", "date": "2026-09-10", "grade": "正式档", "pricing": "未定价", "crate": "bolt", "search": "功率半导体三波涨价 瑞萨年内二次调价 2027/1/1 生效 · 上半年均价同比 +15%-20% · 台系 10 月第三波拟再提 10%-15% 产业周期 ⚡ 涨价实锤级 · 涨价已三轮、股价端完全未定价", "card": "<a class=\"card-c\" href=\"#power-semi-hike3\" data-search=\"功率半导体三波涨价 瑞萨年内二次调价 2027/1/1 生效 · 上半年均价同比 +15%-20% · 台系 10 月第三波拟再提 10%-15% 产业周期 ai算力与电力配套 未定价 士兰微 新洁能 扬杰科技 华润微 斯达半导\" data-grade=\"正式档\" data-pricing=\"未定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-10</span>\n    <span class=\"crate bolt\">⚡ 涨价实锤级 · 涨价已三轮、股价端完全未定价 产业周期</span>\n  </div>\n  <div class=\"ctitle\">功率半导体三波涨价</div>\n  <div class=\"csub\">瑞萨年内二次调价 2027/1/1 生效 · 上半年均价同比 +15%-20% · 台系 10 月第三波拟再提 10%-15%</div>\n  <div class=\"cpos\">功率半导体年内第三波涨价：瑞萨二次调价 2027/1/1 生效、上半年均价同比 +15%-20%，台系 10 月拟再提 10%-15%；股价端完全未定价。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">AI算力与电力配套</span>\n    \n    <span class=\"chip pri\">未定价</span>\n    <span class=\"chip\">标的 7</span>\n    <span class=\"nm\">士兰微</span><span class=\"nm\">新洁能</span><span class=\"nm\">扬杰科技</span><span class=\"nm\">华润微</span><span class=\"nm\">斯达半导</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-10 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-10</div>\n    <h1>功率半导体三波涨价</h1>\n    <div class=\"sub\">瑞萨年内二次调价 2027/1/1 生效 · 上半年均价同比 +15%-20% · 台系 10 月第三波拟再提 10%-15%</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 涨价实锤级 · 涨价已三轮、股价端完全未定价</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：未定价</span>\n      <span class=\"badge neutral\">主线：AI算力与电力配套</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">ai-compute-hike</span><span class=\"tag\" style=\"margin-right:4px\">deepseek-chain</span><span class=\"tag\" style=\"margin-right:4px\">gas-turbine-aidc-orders</span><span class=\"tag\" style=\"margin-right:4px\">intel-cpu-price-hike</span><span class=\"tag\" style=\"margin-right:4px\">mlcc-murata-eol</span><span class=\"tag\" style=\"margin-right:4px\">optical-chip-shortage</span></div>\n    <div class=\"posnote\">功率半导体年内第三波涨价：瑞萨二次调价 2027/1/1 生效、上半年均价同比 +15%-20%，台系 10 月拟再提 10%-15%；股价端完全未定价。</div>\n    <details class=\"more\"><summary>展开定价状态详版（514 字）</summary><div class=\"pos\"><b>定价状态备注：</b>瑞萨调价函由财联社 9/9 晚披露、9/10 08:05 与 08:34、09:40 三次在东财快讯扩散。<strong>盘面状态</strong>：9/10 半导体板块 <strong>-0.48%</strong>、电子板块 -0.56%，功率半导体链<strong>龙头全线收绿</strong>——士兰微 30.24 元 <strong>-0.10%</strong>（成交 13.48 亿、市值 503 亿）、扬杰科技 86.41 元 <strong>-0.69%</strong>、新洁能 53.77 元 <strong>-0.33%</strong>、斯达半导 83.48 元 <strong>-1.17%</strong>（主力净流出 832 万）、华润微 56.28 元 <strong>0.00%</strong>；仅捷捷微电 28.98 元 +0.52% 微红，以及 54 亿市值的宏微科技 25.00 元 <strong>+5.22%</strong>（量比 2.53，链内唯一异动）。当日涨停 25 家，题材 TOP12 无功率半导体/IGBT。产业侧已连涨三轮、股价侧零反应，这是定价状态的客观事实。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">功率半导体大厂<strong>瑞萨电子</strong>宣布对<strong>全线产品价格体系</strong>进行调整，新价格 <strong>2027/1/1</strong> 起正式生效。这是其年内第二次调价——今年 3 月首轮通知已于 <strong>7/1</strong> 落地，两次间隔仅约 4 个月。瑞萨给出的理由是原材料、能源、先进封装、制造产能与全球物流的结构性成本上涨。</div></div><div class=\"card fact\"><b class=\"k\">全行业涨价幅度——已走完两波</b><div class=\"v\">据《科创板日报》不完全统计：海外——<strong>英飞凌</strong>首轮覆盖功率开关及相关芯片涨 <strong>5%-15%</strong>（4/1 生效），5/26 二轮通知 7/1 落地；<strong>德州仪器</strong> 7/1 启动 2025 年以来第四轮提价。国内——华润微、士兰微 Q1 率先喊涨，捷捷微电、新洁能、宏微科技跟进；第二轮中<strong>华润微 7/1 起全品类涨 15% 以上、士兰微同步 15% 以上、扬杰科技全系列上调 10%-15%、斯达半导 IGBT 与 SiC MOSFET 模块涨 15% 以上</strong>。上半年行业均价同比 <strong>+15%-20%</strong>。</div></div><div class=\"card fact\"><b class=\"k\">第三波已在路上</b><div class=\"v\">台系厂商（<strong>强茂、台半</strong>）拟于 <strong>10 月对现货再提价 10%-15%</strong>。业内认为当前功率半导体出现<strong>缺货 + 价格大幅上涨</strong>，核心驱动有二：需求结构转向（AI 机柜成为功率元器件全新核心增长点）、成本转嫁刚需。华润微预计<strong>三季度涨价利好进一步显现，下半年供需仍偏紧，在手订单饱满</strong>。</div></div><div class=\"card fact\"><b class=\"k\">需求侧：AI 机柜功率跃升是核心变量</b><div class=\"v\">开源证券测算：AI 算力推动机柜功率从传统 <strong>120kW 升级至 600kW-1MW</strong> 高压大功率架构，<strong>单机功率半导体价值量实现 6-8 倍扩张</strong>；参考英飞凌、安森美数据，120-125kW 传统机柜功率器件单柜价值仅 <strong>1.5 万美元</strong>。东吴证券：AI 机柜功率迈入百千瓦级并向兆瓦级演进，推动数据中心供电架构向 <strong>800V DC</strong> 升级。</div></div><div class=\"card fact\"><b class=\"k\">技术路线分化</b><div class=\"v\">800V DC 架构下出现明确分工：<strong>SiC 器件</strong>能承受较高电压与功率、损耗低，更适合 <strong>Power Rack 侧的大功率 AC/DC</strong>；<strong>GaN 器件</strong>开关速度快、开关损耗低，更适合 <strong>IT Rack 侧 DC/DC</strong>。宽禁带功率器件由此打开成长空间——这意味着受益的不是所有功率厂，而是<strong>有 SiC/GaN 布局的厂商</strong>。</div></div><div class=\"card fact\"><b class=\"k\">供给约束：产能被重分配</b><div class=\"v\">美银指出：包括 MOSFET 在内的<strong>低压/中压功率半导体新增产能有限</strong>，而全球供应商正把产能<strong>重新分配至价值量更高的 AI/AIDC 应用</strong>，从而进一步压缩传统工业客户的供应。该行预计 2026 下半年仍有进一步提价可能，对 MOSFET、小信号器件等<strong>低压/中压收入敞口更高</strong>的公司受益最充分。</div></div><div class=\"card fact warn\"><b class=\"k\">争议点：涨价尚未转化为利润</b><div class=\"v\">这是本条逻辑<strong>最需要警惕的地方</strong>：①瑞萨新价要到 <strong>2027/1/1</strong> 才生效，中间隔 4 个月，且性质是<strong>成本转嫁型</strong>涨价而非需求拉动型溢价，毛利率扩张幅度存疑；②<strong>反例已经出现</strong>——斯达半导 2026 中报主营收入 19.28 亿同比 -0.41%，<strong>归母净利 6500 万同比 -76.4%、扣非 -82.29%，毛利率仅 20.58%</strong>，涨价两轮后利润反而崩塌；③国信证券口径是「2Q26 业绩走向改善、库存周转天数下降」，改善幅度温和，与「大幅涨价」的叙事存在落差。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/10 半导体板块 -0.48%。功率链龙头<strong>全线收绿或平走</strong>：士兰微 30.24 元 -0.10%（成交 13.48 亿、市值 503 亿，链内最大）、华润微 56.28 元 0.00%（量比 0.58，交投最清淡）、扬杰科技 86.41 元 -0.69%、新洁能 53.77 元 -0.33%、斯达半导 83.48 元 -1.17%（主力净流出 832 万）。仅捷捷微电 28.98 元 +0.52% 微红。唯一异动是 <strong>54 亿市值的宏微科技 25.00 元 +5.22%、量比 2.53、振幅 9.30%</strong>——小市值独立躁动，未带动板块。当日涨停 25 家、题材 TOP12 无功率半导体。<strong>产业连涨三轮、股价完全未定价</strong>。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-10</div><div><div class=\"x\">功率半导体三波涨价：瑞萨年内二次调价 2027/1/1 生效 · 上半年均价同比 +15%-20% · 台系 10 月第三波拟再提 10%-</div><div class=\"y\">为什么：本档为「AI算力·电力配套」的建档时点，后续二段催化均在此之上叠加</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「涨价实锤级」催化，<strong>三个要害</strong>：一是<strong>涨价本身已经不是预期，而是既成事实</strong>——两轮已经落地（英飞凌 5%-15%、华润微/士兰微 15%+、扬杰 10%-15%、斯达 15%+），上半年均价同比 +15%-20%，第三波台系 10 月再提 10%-15% 在路上。这意味着<strong>信息不对称几乎为零</strong>，预期差不在「涨不涨」，而在「涨价能不能变成利润」。二是<strong>需求结构变了，但受益结构也变了</strong>——核心增量是 AI 机柜从 120kW 到 600kW-1MW，单柜功率器件价值量 6-8 倍扩张，且 800V DC 架构下 SiC 吃 Power Rack 侧、GaN 吃 IT Rack 侧，<strong>没有 SiC/GaN 布局的纯硅基厂只能吃「缺货涨价」，吃不到「规格升级」</strong>。三是<strong>最大的裂缝在业绩环</strong>——斯达半导 H1 归母净利 -76.4%、毛利率 20.58%，在两轮涨价之后利润不升反崩，说明成本端（晶圆、引线框架、先进封装）同步上涨吃掉了涨价红利；瑞萨口径也明确是「应对成本上涨」。<strong>隐藏面</strong>：市场普遍把功率半导体当 AI 映射票，但 9/10 盘面显示资金根本没在做这条线——龙头全绿、只有 54 亿市值的宏微科技在独立躁动。这不是「即将启动」的信号，而是<strong>市场尚未认可涨价能落到报表</strong>。真正的分水岭是 Q3 财报毛利率，不是调价函。<br>① <strong>分水岭时点</strong>：2026 三季报功率半导体厂商毛利率环比是否扩张——调价函已发三轮，若毛利不改善，则整条涨价逻辑的业绩环证伪。<br>② <strong>传导的关键约束</strong>：成本同步上涨。涨价性质是<strong>成本转嫁型</strong>，上游晶圆、引线框架、先进封装全在涨，净毛利改善幅度远小于名义涨幅。<br>③ <strong>待验证的核心变量</strong>：低压/中压 MOSFET 的<strong>缺货程度能否延续</strong>——这决定了第三波 10%-15% 能否落地，也是美银逻辑成立的前提。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>瑞萨 2027/1/1 全线调价已官宣，年内二次</li><li>两轮已落地，上半年均价同比 +15%-20%，第三波台系 10 月再提 10%-15%</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强</span><ul><li>AI 机柜 120kW→600kW-1MW，单柜功率器件价值量 6-8 倍扩张</li><li>低压中压 MOSFET 新增产能有限，产能被重分配至 AI/AIDC，供给持续紧</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">存疑</span><ul><li>斯达半导 H1 归母净利 -76.4%、毛利率仅 20.58%，两轮涨价后利润反崩</li><li>瑞萨新价 2027/1/1 才生效，且性质是成本转嫁型，毛利扩张幅度存疑</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">未动</span><ul><li>9/10 龙头全线收绿：士兰微 -0.10%、扬杰 -0.69%、斯达 -1.17%</li><li>仅 54 亿市值宏微科技 +5.22% 独立异动，板块未跟随</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强、业绩存疑、股价未动——涨价已三轮但利润环出现明确反例，这是本条链与「供给冲击型」最大的不同。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>60%</strong>：变化/影响两环充分且有精确数字，业绩环出现<strong>硬反例</strong>（斯达半导 H1 净利 -76.4%），是四环中最薄弱的一环；股价环完全空白。</li><li><strong>边界要切开</strong>：受益分两档——<strong>第一档</strong>是有 SiC/GaN 布局、能吃「规格升级」的厂商（士兰微 II 代 SiC-MOSFET 已通过国内顶级大厂认证并大批量出货 AI 算力中心电源；扬杰科技 SiC 规格齐全覆盖 AI 服务器电源）；<strong>第二档</strong>是低压/中压 MOSFET 敞口高、只吃「缺货涨价」的厂商（新洁能、捷捷微电，美银点名的受益结构）。<strong>不受益/受损</strong>的是以光伏、新能源车等传统需求为主、无 AI 敞口的功率厂（需求端未复苏），以及下游电源与整机厂（涨价=成本）。</li><li><strong>主线联动</strong>：本档案归属<strong>「AI算力·电力配套」主线</strong>，与 gas-turbine-aidc-orders（全球燃机订单创新高）是<strong>同一条 AI 用电曲线的两个截面</strong>——一个在发电侧（燃机/HRSG），一个在用电侧的电能转换（功率半导体），共同验证 AI 数据中心电力需求爆发；与 mlcc-murata-eol（村田停产 MLCC）同处 AI 服务器元器件紧缺的供给端，两者互为印照：被动元件与功率器件同时涨价，说明 AI 硬件的供需紧张是<strong>全面性</strong>而非单点；与 intel-cpu-price-hike 共同构成「AI 硬件全面涨价」的证据链。反过来，若 Q3 功率厂毛利未改善，则 gas-turbine-aidc-orders 的「需求爆发级」判断也需下调一档。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>士兰微</b><span class=\"code\">600460</span><span class=\"tag\">SiC 已大批量出货 AI 算力电源</span><span class=\"cap\">31.34 元 · 流通 522 亿 · 9/16 +4.33%</span></div>\n    <div class=\"logic\">IDM 全链·9/10 -0.10%</div>\n    <div class=\"detail\">国内少数 IDM 功率厂，能把晶圆与封装涨价成本内部化。II 代 SiC-MOSFET 已通过顶级大厂认证并大批量出货 AI 算力中心电源，正踩在 800V DC 架构 Power Rack 侧 AC/DC 的技术路线上。7/1 起全品类涨价 15%+，YTD 仅 +6.74%，涨价三轮而股价滞后。</div>\n    \n    \n    <div class=\"risk\">⚠️ 重资产折旧压力大，成本上涨先内部消化</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>新洁能</b><span class=\"code\">605111</span><span class=\"tag\">美银点名受益结构直接对位</span><span class=\"cap\">56.60 元 · 流通 235 亿 · 9/16 +5.85%</span></div>\n    <div class=\"logic\">MOSFET 敞口最高·9/10 -0.33%</div>\n    <div class=\"detail\">主营 MOSFET 与小信号器件，是美银所述「低压/中压敞口更高受益最充分」的直接对位标的。弹性来自纯缺货涨价，223 亿中等市值弹性优于大市值 IDM。</div>\n    \n    \n    <div class=\"risk\">⚠️ YTD +51.30% 已部分反映；无宽禁带布局，只吃涨价不吃升级</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>扬杰科技</b><span class=\"code\">300373</span><span class=\"tag\">链内估值最低·唯一有股息</span><span class=\"cap\">89.18 元 · 流通 483 亿 · 9/16 +3.95%</span></div>\n    <div class=\"logic\">SiC 规格齐全·9/10 -0.69%</div>\n    <div class=\"detail\">SiC 规格覆盖齐全并覆盖 AI 服务器电源，但下游分散、被光伏与新能源车需求稀释弹性。PE(TTM) 32.9 倍、股息率 1.06%，市场给的是成熟制造而非 AI 成长的定价。</div>\n    \n    \n    <div class=\"risk\">⚠️ 下游分散稀释 AI 弹性，20 日 -9.57%</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>华润微</b><span class=\"code\">688396</span><span class=\"tag\">管理层口径最积极·在手订单饱满</span><span class=\"cap\">57.86 元 · 流通 769 亿 · 9/16 +4.72%</span></div>\n    <div class=\"logic\">IDM 次龙头·9/10 0.00%</div>\n    <div class=\"detail\">全品类 7/1 起涨 15%+，公司预计 Q3 涨价利好进一步显现、下半年供需仍偏紧、在手订单饱满，是链内管理层口径最积极的一家。但 747 亿市值、量比 0.58 交投最清淡。</div>\n    \n    \n    <div class=\"risk\">⚠️ 市值偏大弹性受限，YTD +6.57% 资金关注度低</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>斯达半导</b><span class=\"code\">603290</span><span class=\"tag\">业绩反例·H1 净利 -76.4%</span><span class=\"cap\">85.50 元 · 流通 205 亿 · 9/16 +3.69%</span></div>\n    <div class=\"logic\">IGBT 龙头·9/10 -1.17%</div>\n    <div class=\"detail\">IGBT 与 SiC 模块龙头、提价 15%+，但 H1 归母净利同比 -76.4%、毛利率仅 20.58%，两轮涨价后利润不升反崩——是本条逻辑最需要警惕的反例。</div>\n    \n    \n    <div class=\"risk\">⚠️ 涨价未转化为利润；机构目标价 118 元 vs 现价 83 元，预期过于乐观</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>捷捷微电</b><span class=\"code\">300623</span><span class=\"tag\">链内唯一正收益·已走独立趋势</span><span class=\"cap\">31.22 元 · 流通 240 亿 · 9/16 +6.26%</span></div>\n    <div class=\"logic\">防护器件·9/10 +0.52%</div>\n    <div class=\"detail\">晶闸管与防护器件，受益 AI 机柜 TVS/功率二极管用量增长。20 日 +8.58% 为链内唯一正收益，已在走独立趋势、与板块脱钩。</div>\n    \n    \n    <div class=\"risk\">⚠️ 已定价，不属于未定价范畴</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>宏微科技</b><span class=\"code\">688711</span><span class=\"tag\">IGBT 小盘·涨价弹性最大</span><span class=\"cap\">27.70 元 · 流通 60 亿 · 9/16 +8.41%</span></div>\n    <div class=\"logic\">9/10 +5.22%·量比 2.53·链内唯一异动</div>\n    <div class=\"detail\">9/10 唯一逆势异动标的：收 25.00 元 <strong>+5.22%</strong>、量比 2.53、振幅 9.30%、换手 6.32%，在龙头全线收绿时独立躁动。公司此前在机构调研中表示<strong>涨价主要受上游原材料上涨及公司产能紧张影响</strong>。市值仅 54.19 亿、PE(TTM) 299 倍、YTD -21.21%——<strong>小市值 + 高估值 + 年内负收益</strong>，是典型的高弹性低确定性组合。</div>\n    <div class=\"gene\">🧬 题材基因：功率半导体板块小市值高弹性品种，YTD -21.21% 与板块脱钩、筹码轻，在涨价题材启动时往往率先反应但缺乏业绩支撑，属资金驱动型而非逻辑驱动型</div>\n    \n    <div class=\"risk\">⚠️ PE 299 倍、市值 54 亿，业绩支撑最弱；YTD -21.21%，波动剧烈</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2021 年全球缺芯涨价潮：功率半导体交期从 8 周拉长至 40 周以上，士兰微、华润微、斯达半导集体走出翻倍行情，斯达半导一度成为千亿市值 IGBT 龙头——那一轮是<strong>需求全面复苏 + 国产替代</strong>双击。</li><li>2023-2024 年功率半导体下行周期：新能源与消费电子需求退坡，价格战激烈，斯达半导、新洁能等毛利率从高点大幅回落，板块估值杀至历史低位——说明该板块<strong>周期性强、涨价红利容易被随后的价格战吞掉</strong>。</li><li>2026 年上半年两轮涨价：英飞凌 4 月与 7 月两次调价、国内厂商 Q1 与 7/1 两轮跟进，上半年行业均价同比 +15%-20%，但截至 9/10 板块股价端基本无反应——<strong>「涨价不涨股价」本身就是市场对业绩环存疑的表达</strong>。</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>士兰微</b><span class=\"code\">600460</span><span class=\"tag\">IDM 全链·SiC 已进 AI 算力电源大批量出货</span></div>\n    <div class=\"logic\">国内少数 IDM 功率厂 | 弹性来自 SiC 在 800V DC Power Rack 侧放量 + 全品类涨价 15%+ | 约束是市值 503 亿、毛利率修复慢</div>\n    <div class=\"detail\">国内极少数坚持 <strong>IDM 模式</strong>的功率半导体厂——芯片设计、晶圆制造、封测全在自己手里，这意味着在<strong>晶圆与先进封装涨价</strong>的环境下，它是少数能把成本内部化的厂商，而不像 Fabless 那样两头受挤。独特之处在于 SiC 落地的确定性：据公司口径，<strong>2025 年 II 代 SiC-MOSFET 已通过国内顶级大厂严苛认证、应用于 AI 算力中心电源并实现大批量出货</strong>——这正好踩在东吴证券指出的「SiC 更适合 Power Rack 侧大功率 AC/DC」这条技术路线上。在本轮第二轮调价中它自 7/1 起全品类上调 15% 以上，是涨价幅度最激进的一档。9/10 收 30.24 元 -0.10%、成交 13.48 亿是链内最大，YTD 仅 +6.74%——<strong>涨价三轮而年内几乎没涨，是估值层面的显著滞后</strong>。</div>\n    \n    <div class=\"confirm\">✔ 确认：三季报毛利率环比扩张 / SiC 产能或 AI 电源客户订单公告 / 月度营收创新高</div>\n    <div class=\"risk\">⚠️ 市值 503 亿、PE(TTM) 77.5 倍；IDM 重资产折旧压力大，成本端上涨会先吃到自己</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>新洁能</b><span class=\"code\">605111</span><span class=\"tag\">低压中压 MOSFET 敞口最高·美银逻辑最对位</span></div>\n    <div class=\"logic\">主营 MOSFET、小信号器件 | 弹性来自低压中压缺货涨价 | 约束是 YTD 已 +51.30%、无 SiC/GaN 规格升级故事</div>\n    <div class=\"detail\">美银明确指出：受益最充分的是<strong>对 MOSFET、小信号器件等低压/中压功率半导体收入敞口更高</strong>的公司——新洁能正是这一描述的直接对位标的。它的弹性来源是纯粹的<strong>缺货涨价</strong>：全球供应商把产能重分配给 AI/AIDC 高价值应用，传统工业客户的供应被压缩，低压中压 MOSFET 现货最先紧张，台系强茂、台半 10 月拟再提 10%-15% 也主要落在这一档。9/10 收 53.77 元 -0.33%、成交 4.07 亿、市值 223 亿——<strong>中等市值 + 高敞口</strong>的组合，理论弹性优于大市值 IDM。但要清醒：它没有 SiC/GaN 的规格升级叙事，只能吃到涨价这一层，且 YTD +51.30% 已部分反映。</div>\n    \n    <div class=\"confirm\">✔ 确认：Q3 毛利率环比改善 / MOSFET 现货报价继续上行 / 台系 10 月调价落地</div>\n    <div class=\"risk\">⚠️ YTD +51.30%、PE(TTM) 57 倍已含预期；20 日 -8.12% 筹码松动；无宽禁带布局，只吃涨价不吃升级</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>扬杰科技</b><span class=\"code\">300373</span><span class=\"tag\">SiC 规格齐全·覆盖 AI 服务器电源</span></div>\n    <div class=\"logic\">SiC 产品规格覆盖齐全 | 弹性来自 AI 服务器电源 + 全系列涨价 10%-15% | 约束是 PE 最低但也最受传统需求拖累</div>\n    <div class=\"detail\">产品线在功率半导体里最宽——SiC 规格覆盖齐全，可广泛应用于新能源汽车、光伏储能、工业工控、<strong>AI 服务器电源</strong>及消费类电源等多下游。这既是优势也是负担：宽覆盖意味着它能沾到 AI 服务器电源的边，但也会<strong>被光伏、新能源车等尚未复苏的传统需求稀释弹性</strong>。本轮第二轮调价中它对全系列产品上调 10%-15%，幅度略低于华润微、士兰微的 15%+，反映其在价格谈判上的位置偏中游。独特之处是<strong>估值最低</strong>——PE(TTM) 仅 32.9 倍、股息率 1.06%，是链内唯一有股息的标的，说明市场给它的是「成熟制造」而非「AI 成长」的定价。9/10 收 86.41 元 -0.69%、成交 5.20 亿。</div>\n    \n    <div class=\"confirm\">✔ 确认：AI 服务器电源 SiC 订单落地公告 / Q3 毛利改善 / 海外收入占比提升</div>\n    <div class=\"risk\">⚠️ 下游分散，光伏/新能源车需求疲弱会稀释 AI 弹性；20 日 -9.57%</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>华润微</b><span class=\"code\">688396</span><span class=\"tag\">国内功率 IDM 次龙头·在手订单饱满</span></div>\n    <div class=\"logic\">全品类 7/1 起涨 15%+，公司口径 Q3 涨价利好显现</div>\n    <div class=\"detail\">国内功率半导体 IDM 次龙头，规模仅次于士兰微。本轮第二轮中自 7/1 起全品类涨幅提至 15% 以上，且公司明确预计<strong>三季度涨价带来的利好效应进一步显现、下半年供需仍偏紧、在手订单饱满、对后续定价保持积极</strong>——是链内<strong>管理层口径最积极</strong>的一家。9/10 收 56.28 元 0.00%、量比仅 0.58 是链内交投最清淡的，市值 747.5 亿。</div>\n    \n    \n    <div class=\"risk\">⚠️ 市值 747 亿偏大，弹性受限；YTD 仅 +6.57%，资金关注度低</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>捷捷微电</b><span class=\"code\">300623</span><span class=\"tag\">晶闸管/防护器件·9/10 链内唯一红盘</span></div>\n    <div class=\"logic\">防护器件与晶闸管，AI 机柜用量增长受益</div>\n    <div class=\"detail\">主营晶闸管与防护器件，属于 AI 机柜功率跃升中<strong>MOS管、TVS 二极管、功率二极管用量同步大幅增长</strong>的直接受益环节。9/10 收 28.98 元 +0.52%，是链内除小盘宏微科技外<strong>唯一收红的标的</strong>，20 日 +8.58% 也是链内唯一正收益——说明它已经在走独立趋势，与板块脱钩。</div>\n    \n    \n    <div class=\"risk\">⚠️ 已走出独立行情，20 日 +8.58%，不属于「未定价」范畴</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>斯达半导</b><span class=\"code\">603290</span><span class=\"tag\">IGBT/SiC 模块龙头·业绩反例</span></div>\n    <div class=\"logic\">IGBT 与 SiC MOSFET 模块涨 15%+，但 H1 净利 -76.4%</div>\n    <div class=\"detail\">IGBT 与 SiC MOSFET 模块龙头，本轮第二轮提价 15% 以上，理论上最受益。但它是本条逻辑<strong>最重要的反例</strong>：2026 中报主营收入 19.28 亿同比 -0.41%，<strong>归母净利 6500 万同比 -76.4%、扣非 -82.29%，毛利率仅 20.58%</strong>。两轮涨价之后利润不升反崩，说明<strong>成本端吃掉了涨价红利</strong>。9/10 收 83.48 元 -1.17%、主力净流出 832 万，是链内跌幅最大的标的之一。</div>\n    \n    \n    <div class=\"risk\">⚠️ H1 净利 -76.4%、毛利率 20.58%，涨价未能转化为利润；90 天内机构目标均价 118.36 元与当前 83.48 元存在巨大差距，预期过于乐观</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>光伏/新能源车为主的功率厂</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">本轮涨价的核心增量来自 AI 机柜（120kW→600kW-1MW、价值量 6-8 倍扩张），以光伏、新能源车等传统需求为主且无 AI/数据中心敞口的功率厂，只能被动承受上游成本上涨，需求端并未复苏，不在受益侧。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>下游电源与整机厂</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">功率器件涨价对下游服务器电源、整机厂是<strong>成本上升</strong>而非受益。在整机厂利润率本就承压的背景下，向下游传导能力有限，是这条涨价链上明确的受损侧。</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**涨价实锤级**：三轮调价函已落地，但业绩兑现待验。基准参照：2021 年功率半导体缺货行情，涨价函发出后毛利率扩张滞后 1-2 个季度。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">士兰微 ＞ 新洁能 ＞ 扬杰科技。排序理由：IDM 模式（士兰）能完整享受涨价，Fabless（新洁能）需与代工分担，扬杰以二极管为主、涨价幅度最小。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">宏微科技 ＞ 捷捷微电。gene：功率小盘票，2021 缺货行情中宏微曾作为 IGBT 弹性票被资金反复炒作。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若 2026 三季报功率厂商毛利率环比扩张**且**台系 10 月提价 10%-15% 正式落地 → 逻辑状态由「调价函已发」升为「业绩兑现」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 2026 三季报功率厂商毛利率环比扩张（士兰、华润微、新洁能） ② 台系强茂、台半 10 月提价正式落地 ③ 国内厂商跟进发布第四轮调价函。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 三季报毛利率未改善甚至下滑（涨价被成本吃掉） ② 更多厂商出现斯达半导式「涨价但净利大幅下滑」 ③ 下游需求走弱、涨价传导失败。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">调价函发了三轮而股价零反应，市场在等的是**毛利率**而不是涨价本身。斯达半导已经给出反例：涨价但净利大幅下滑，说明成本端（代工+原材料）完全吃掉了涨价红利。三季报毛利率是本档唯一的裁判——如果三轮涨价后毛利还不扩张，这条涨价逻辑就是纸面的。</div></div></div>\n\n    \n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>2026 三季报功率半导体厂商毛利率环比扩张（士兰微、华润微、新洁能）</b></li><li><b>台系强茂、台半 10 月现货提价 10%-15% 正式落地</b></li><li><b>AI 服务器电源 SiC/GaN 订单公告或大客户认证通过</b></li><li><b>低压/中压 MOSFET 交期继续拉长、现货报价上行</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>三季报毛利率未改善甚至下滑——调价函发三轮而毛利不改善，则整条涨价逻辑的业绩环证伪</b></li><li><b>更多厂商出现斯达半导式「涨价但净利大幅下滑」，说明成本端完全吃掉涨价红利</b></li><li><b>台系 10 月第三波调价落空或幅度显著低于 10%-15%</b></li><li><b>AI 机柜出货节奏放缓，800V DC 架构升级推迟，功率器件价值量 6-8 倍扩张的假设不成立</b></li><li><b>上游晶圆、引线框架价格继续上涨，涨价沦为纯成本转嫁、无净毛利改善</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">10 月</div><div class=\"wh\">台系强茂、台半现货调价 10%-15% 是否落地</div><div class=\"wy\">第三波涨价的直接判据，决定涨价循环能否延续</div></div><div class=\"tkc\"><div class=\"w\">10 月下旬</div><div class=\"wh\">士兰微、华润微、新洁能、扬杰科技三季报毛利率</div><div class=\"wy\">全档案最关键——涨价三轮后毛利能否改善，是业绩环成立与否的唯一硬证据</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">低压/中压 MOSFET 交期与现货报价</div><div class=\"wy\">缺货程度决定第三波能否落地，也是美银逻辑的前提</div></div><div class=\"tkc\"><div class=\"w\">2027/1/1</div><div class=\"wh\">瑞萨新价格体系正式生效后的实际执行折扣</div><div class=\"wy\">名义涨幅与实收涨幅的差距，反映真实供需强弱</div></div></div>\n\n    <div class=\"src\">数据来源：财联社 9/9 瑞萨调价电报 · 9/10 08:05/08:34/09:40 东财快讯扩散 ｜ 《科创板日报》2026 年功率半导体涨价不完全统计 ｜ 东吴证券 800V DC 架构研报 ｜ 开源证券 AI 电力架构革新研报 ｜ 美银中国功率半导体周期研报 ｜ 国信证券 2Q26 功率半导体业绩点评 ｜ 斯达半导 2026 中报 ｜ 证券之星资金流 9/10 ｜ 东财 7×24 快讯 707 条 · 东财券商研报 57 篇 · iFinD 盘面数据 9/10</div>\n    <footer>功率半导体三波涨价 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "gas-turbine-aidc-orders", "title": "全球燃机订单创新高", "date": "2026-09-09", "grade": "正式档", "pricing": "部分定价", "crate": "bolt", "search": "全球燃机订单创新高 2026q2 全球燃机订单 38gw 创单季历史新高 · 美国在建燃气发电 +76% 至 52gw · 其中 16.9gw 直供数据中心 · 供需失衡预计延续至 2030 年 产业周期 ⚡ 需求爆发级 · 热端部件已动、整机与出海主线未定价", "card": "<a class=\"card-c\" href=\"#gas-turbine-aidc-orders\" data-search=\"全球燃机订单创新高 2026q2 全球燃机订单 38gw 创单季历史新高 · 美国在建燃气发电 +76% 至 52gw · 其中 16.9gw 直供数据中心 · 供需失衡预计延续至 2030 年 产业周期 ai算力与电力配套 部分定价 杰瑞股份 应流股份 东方电气 航宇科技 潍柴动力\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-09</span>\n    <span class=\"crate bolt\">⚡ 需求爆发级 · 热端部件已动、整机与出海主线未定价 产业周期</span>\n  </div>\n  <div class=\"ctitle\">全球燃机订单创新高</div>\n  <div class=\"csub\">2026Q2 全球燃机订单 38GW 创单季历史新高 · 美国在建燃气发电 +76% 至 52GW · 其中 16.9GW 直供数据中心 · 供需失衡预计延续至 2030 年</div>\n  <div class=\"cpos\">2026Q2 全球燃机订单 38GW 创单季历史新高，美国在建燃气发电 +76% 至 52GW、其中 16.9GW 直供数据中心。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">AI算力与电力配套</span>\n    \n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 8</span>\n    <span class=\"nm\">杰瑞股份</span><span class=\"nm\">应流股份</span><span class=\"nm\">东方电气</span><span class=\"nm\">航宇科技</span><span class=\"nm\">潍柴动力</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-09 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-09</div>\n    <h1>全球燃机订单创新高</h1>\n    <div class=\"sub\">2026Q2 全球燃机订单 38GW 创单季历史新高 · 美国在建燃气发电 +76% 至 52GW · 其中 16.9GW 直供数据中心 · 供需失衡预计延续至 2030 年</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 需求爆发级 · 热端部件已动、整机与出海主线未定价</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：AI算力与电力配套</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">ai-compute-hike</span><span class=\"tag\" style=\"margin-right:4px\">deepseek-chain</span><span class=\"tag\" style=\"margin-right:4px\">intel-cpu-price-hike</span><span class=\"tag\" style=\"margin-right:4px\">mlcc-murata-eol</span><span class=\"tag\" style=\"margin-right:4px\">optical-chip-shortage</span><span class=\"tag\" style=\"margin-right:4px\">power-semi-hike3</span></div>\n    <div class=\"posnote\">2026Q2 全球燃机订单 38GW 创单季历史新高，美国在建燃气发电 +76% 至 52GW、其中 16.9GW 直供数据中心。</div>\n    <details class=\"more\"><summary>展开定价状态详版（375 字）</summary><div class=\"pos\"><b>定价状态备注：</b>中信建投研报 9/9 07:43 发布，属<strong>盘中催化</strong>。<strong>盘面状态</strong>：9/9 燃气轮机概念盘中震荡反弹，<strong>应流股份涨停 +10.00%</strong>、万泽股份 +7.21%、东方电气 +5.52%、潍柴动力 +4.66%、航宇科技 +3.96%、隆达股份 +2.82%、派克新材 +2.49%——<strong>热端部件与高温合金这条窄线已被资金买入</strong>。但<strong>整机与出海主线完全零反应</strong>：杰瑞股份 -0.06%（在手燃机订单超 31 亿美元）、上海电气 0.00%、陕鼓动力 -0.70%、航发动力 +0.29%。资金只定价了「零部件紧缺」这一层，<strong>「国产燃机整机出海」这层更大的逻辑尚未被定价</strong>。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">中信建投 9/9 研报：<strong>2026Q2 全球燃机订单约 38GW，创单季度历史新高，美国贡献接近一半</strong>。美国市场方面，<strong>上半年进入建设阶段的燃气发电项目容量同比增长 76% 至 52GW</strong>，其中 <strong>16.9GW 计划直接为数据中心供电</strong>；数据中心相关项目的<strong>内燃机</strong>在开发容量（已公布+建设前+建设阶段）过去半年<strong>增长两倍以上至 45GW</strong>，约占数据中心配套燃气发电项目的四分之一。</div></div><div class=\"card fact\"><b class=\"k\">需求缺口有多大</b><div class=\"v\">摩根士丹利测算：<strong>2025–2028 年美国数据中心累计电力缺口可能达 47GW</strong>；北美部分项目的<strong>平均并网周期已超过 4 年</strong>。电网接不上、风电光伏有间歇性短板，燃机因<strong>启停快、联合循环效率可超 60%</strong>，成为 AIDC 当下「并不完美却足够现实」的基荷电源选择——这是订单爆发的根本驱动。</div></div><div class=\"card fact\"><b class=\"k\">供给端：瓶颈在热端部件</b><div class=\"v\"><strong>重型燃机交付槽位稀缺</strong>，部分客户需通过模块化设备缩短投产周期。研报明确指出<strong>热端部件已成为燃机整机扩产的关键瓶颈</strong>；SpaceX 拟自建燃机叶片及导向叶片铸造能力，相关产能预计可使燃机投运时间<strong>缩短约 18 个月</strong>——连下游用户都开始自己造叶片，是紧缺最直白的证据。《2026 燃气轮机产业发展白皮书》判断：<strong>全球燃机供需失衡态势至少要延续到 2030 年</strong>。西门子能源 2026 财年第一财季获 <strong>102 台燃机订单，约四分之一与数据中心相关，交付排期延伸至 2029 和 2030 年</strong>；GE Vernova 2026H1 中期业绩大幅超预期。</div></div><div class=\"card fact\"><b class=\"k\">国产燃机的位置：出海</b><div class=\"v\">中信建投结论是<strong>「坚定看好国产燃机出海」</strong>——国产燃机凭借<strong>更短的交付周期、较高的性价比、不断增强的产品竞争力</strong>，有望加快获取海外市场份额。逻辑很直接：<strong>海外整机交付排到 2029–2030 年，交付周期本身就是竞争力</strong>，谁能更快交货谁就拿到订单。这不是价格战逻辑，是产能窗口逻辑。</div></div><div class=\"card fact\"><b class=\"k\">订单实证：杰瑞 31 亿美元</b><div class=\"v\">这是本轮最硬的落地证据。杰瑞股份自 <strong>2025 年 11 月至 2026 年 8 月 13 日，累计斩获数据中心行业燃气轮机发电机组及配套设备订单超 31 亿美元（约 209 亿元）</strong>；其中 <strong>7/22 公告单笔 14.65 亿美元（约 99.49 亿元）</strong>，为同一国际云服务商<strong>复购</strong>，计划 2027 年分批交付。公司已与西门子能源（SGT 系列）、贝克休斯（LM2500/NovaLT）、FTAI（CFM56 航改燃机）、川崎重工、Everllence 建立多机头资源布局；2026H1 为锁定燃机主机与原材料产能，<strong>预付款项较年初大增 141.62% 至 26.43 亿元</strong>。潍柴动力 9/9 调研纪要亦互证：「电力市场缺口大，客户更偏好快速交付且供应稳定的方案，看好天然气发电产品在离网发电市场的竞争力」。</div></div><div class=\"card fact warn\"><b class=\"k\">争议点</b><div class=\"v\"><strong>驱动力高度集中在美国 AIDC 一个变量上。</strong>若美国数据中心资本开支节奏放缓（并网审批、融资环境、AI 投资回报质疑），订单可持续性会同步转弱——这与 intel-cpu-price-hike、ai-compute-hike 两条线是<strong>同一个风险源</strong>。其次，<strong>国内企业真正拿到海外主机订单的比例仍低</strong>，多数公司只是零部件配套，研报的「国产燃机出海」目前主要由杰瑞一家在验证。第三，<strong>业绩兑现节奏偏晚</strong>：杰瑞大单 2027 年才集中交付，2026 年报表贡献有限（公司上半年经营现金流 -7.48 亿元，主因正是预付锁定产能）。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/9 盘中燃气轮机概念反弹，但<strong>涨幅严格局限在热端部件与高温合金这条窄线</strong>：应流股份涨停 +10.00%、万泽股份 +7.21%、东方电气 +5.52%、潍柴动力 +4.66%、航宇科技 +3.96%、隆达股份 +2.82%、派克新材 +2.49%、三角防务 +1.93%、联德股份 +1.20%、图南股份 +1.01%。<strong>而出海与整机主线完全未动</strong>：杰瑞股份 -0.06%（在手燃机订单超 31 亿美元）、上海电气 0.00%、陕鼓动力 -0.70%、航发动力 +0.29%。资金买的是「零部件紧缺」，没买「国产整机出海」——研报结论中最核心的那一层，恰恰是盘面没反应的那一层。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-09</div><div><div class=\"x\">全球燃机订单创新高：2026Q2 全球燃机订单 38GW 创单季历史新高 · 美国在建燃气发电 +76% 至 52GW · 其中 16.9G</div><div class=\"y\">为什么：本档为「AI算力·电力配套」的建档时点，后续二段催化均在此之上叠加</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是<strong>「需求爆发级」</strong>催化，且是 <strong>AI 叙事从「算力」外溢到「电力」的标志性事件</strong>。<strong>三个要害</strong>：一是<strong>紧缺的环节决定受益结构</strong>——订单 38GW 是整机口径，但真正的瓶颈在<strong>热端部件</strong>（叶片/导向叶片），所以弹性最大的不是整机厂而是<strong>能供叶片与高温合金的配套商</strong>，SpaceX 自己造叶片就是这个判断最极端的注脚；二是<strong>国产厂商的竞争力不是价格而是交付周期</strong>——海外排期已到 2029–2030 年，交付周期本身就是稀缺资源，这决定了谁能拿到订单（杰瑞 31 亿美元已经验证）；三是<strong>业绩与股价的时间错配</strong>——大单 2027 年集中交付，2026 年报表几乎不体现，因此当前定价的是<strong>订单能见度而非盈利兑现</strong>。<strong>隐藏面</strong>：市场把这条线当成「燃气轮机概念」在做，但真正的结构是<strong>「AIDC 供电解决方案」</strong>——燃机只是主电源，配套还有内燃机（45GW，占 AIDC 配套燃气发电的 1/4）、储能、微网控制、配电，<strong>内燃机环节增速（半年翻倍以上）其实比重型燃机更快，却几乎没人看</strong>。<br>① <strong>分水岭时点</strong>：<strong>2026Q3 全球燃机订单数据</strong>——能否在 38GW 的历史高位上继续环比增长，决定这是单季高点还是新平台。<br>② <strong>传导的关键约束</strong>：机头（主机）供应。国内集成商的核心机头依赖西门子、贝克休斯等外部供应商，机头交付延期会直接卡住成套交付。<br>③ <strong>待验证的核心变量</strong>：国内厂商的<strong>海外订单能否持续复购</strong>——从「零的突破」到「规模化持续供货」是两件事，杰瑞 7 月的复购大单是关键一步。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>2026Q2 全球燃机订单 38GW 创单季历史新高，美国贡献近半</li><li>美国在建燃气发电 +76% 至 52GW、16.9GW 直供数据中心，需求可量化</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强</span><ul><li>重型燃机交付槽位稀缺，热端部件成扩产关键瓶颈</li><li>白皮书：全球燃机供需失衡至少延续到 2030 年</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">偏晚</span><ul><li>杰瑞大单 2027 年集中交付，2026 年报表贡献有限</li><li>国内多数公司仅为零部件配套，整机出海目前仅杰瑞一家验证</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">分化</span><ul><li>9/9 热端部件线大涨：应流涨停、万泽 +7.21%、东方电气 +5.52%</li><li>出海主线零反应：杰瑞 -0.06%、上海电气 0.00%、陕鼓 -0.70%</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强、业绩偏晚、股价分化——零部件环节已定价，出海与整机环节尚未启动，是典型的「半条链被买、半条链没人要」状态。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>75%</strong>：四环中「变化」「影响」证据最硬且有第三方数据交叉验证；「业绩」环明确偏晚（2027 年兑现），是时间问题而非逻辑问题；「股价」环呈结构性分化，半条链空白。</li><li><strong>边界要切开</strong>：受益的是<strong>①热端部件与高温合金供应商</strong>（叶片、导向叶片、环形锻件——扩产瓶颈所在，议价能力最强）与<strong>②具备机头资源与海外交付能力的成套集成商</strong>（拿到实际订单者）；<strong>③燃气内燃机</strong>是被低估的环节（AIDC 相关在开发容量半年翻倍至 45GW，增速快于重型燃机）；不受益的是<strong>④无海外订单、仅挂「燃气轮机」概念的配套厂</strong>与 <strong>⑤燃机需求挤压下的其他调峰电源</strong>。</li><li><strong>主线联动</strong>：与 intel-cpu-price-hike（CPU 三连涨）、ai-compute-hike（云厂商上调算力价）同属<strong>「AI 基建」主线</strong>，但分处三个不同的受益端——电力（本档案）、算力硬件（CPU）、算力服务（云厂商），三者<strong>互相印证同一轮 AIDC 资本开支的真实性</strong>；与 storage-cell-capacity-control（储能电芯）构成<strong>「AIDC 供电的两种解法」</strong>：燃机解决基荷、储能解决调峰与并网，两者是配套而非竞争（杰瑞已在做「燃机配储+微网」一体化）。<strong>风险共振点</strong>：三条线共享同一个风险源——美国数据中心资本开支，一旦放缓会同步走弱。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>杰瑞股份</b><span class=\"code\">002353</span><span class=\"tag\">出海唯一实证·在手订单31亿美元</span><span class=\"cap\">119.99 元 · 流通 829 亿 · 9/16 -0.59%</span></div>\n    <div class=\"logic\">西门子授权+自制集成·9/9零反应</div>\n    <div class=\"detail\">2025/11–2026/8 累计 AIDC 燃机订单超 31 亿美元，7/22 单笔 14.65 亿美元为云服务商复购。模式是西门子机头授权+自制集成，绕开零部件短缺直供北美。H1 预付 +141.62% 至 26.43 亿锁定产能。9/9 -0.06%，完全零反应。</div>\n    \n    \n    <div class=\"risk\">⚠️ 机头依赖外供；大单 2027 交付，2026 业绩空窗</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>应流股份</b><span class=\"code\">603308</span><span class=\"tag\">热端部件瓶颈·两机双轮</span><span class=\"cap\">41.19 元 · 流通 300 亿 · 9/16 -0.68%</span></div>\n    <div class=\"logic\">高温合金叶片·9/9涨停领涨</div>\n    <div class=\"detail\">卡在整机扩产的关键瓶颈——高温合金热端部件，议价能力最强。独特处是航发与燃机共用精密铸造工艺，产能弹性与良率爬坡快于纯燃机厂。9/9 涨停 +10.00%，已被资金认领。</div>\n    \n    \n    <div class=\"risk\">⚠️ 位置不低，需分歧确认；两条下游节奏不同步</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>东方电气</b><span class=\"code\">600875</span><span class=\"tag\">G50 自主重型燃机整机</span><span class=\"cap\">23.95 元 · 流通 542 亿 · 9/16 -0.70%</span></div>\n    <div class=\"logic\">国产两机最高水平·9/9 +5.52%</div>\n    <div class=\"detail\">自主研发 G50 重型燃机，走的是自主整机路线而非集成路线，价值量与壁垒更高但验证更长。同时受益海外供需失衡到 2030 与国内燃机调峰需求。机构预计 2026 归母净利 +22.84% 至 47.06 亿。9/9 +5.52%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 自主整机出海尚无大规模实证；878 亿市值弹性温和</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>航宇科技</b><span class=\"code\">688239</span><span class=\"tag\">环形锻件·两机共用产线</span><span class=\"cap\">53.58 元 · 流通 102 亿 · 9/16 +1.29%</span></div>\n    <div class=\"logic\">9/9 +3.96%·107亿小市值</div>\n    <div class=\"detail\">热端部件上游的环形锻件，燃机与航发共用锻造产线，可从航发订单切换产能，属「两机共振」型。107 亿市值弹性较好。9/9 +3.96%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 锻件竞争较叶片激烈，议价弱于应流</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>潍柴动力</b><span class=\"code\">000338</span><span class=\"tag\">燃气内燃机·增速快于重型燃机</span><span class=\"cap\">25.52 元 · 流通 1265 亿 · 9/16 -2.00%</span></div>\n    <div class=\"logic\">9/9调研看好离网发电·+4.66%</div>\n    <div class=\"detail\">AIDC 相关内燃机在开发容量半年翻倍至 45GW、占配套燃气发电 1/4，增速快于重型燃机。9/9 调研明确看好天然气发电在离网市场的竞争力，与研报互证。9/9 +4.66%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 2436 亿市值，燃机业务占比小，弹性被主业稀释</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>隆达股份</b><span class=\"code\">688231</span><span class=\"tag\">高温合金材料·9/9 +2.82%</span><span class=\"cap\">30.64 元 · 流通 98 亿 · 9/16 -1.10%</span></div>\n    <div class=\"logic\">热端部件的上游材料端</div>\n    <div class=\"detail\">高温合金材料供应商，处于应流等铸件厂的上游。热端部件扩产必然先拉动材料端需求，但传导链相对铸件更长一层。9/9 +2.82%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 材料端传导链较长；高温合金行业产能
