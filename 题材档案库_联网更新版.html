ong>严格的成本暴露度排序</strong>：上游焦煤超额 <strong>+1.11 ~ +1.66pct</strong>（淮北矿业 +1.08%、冀中能源 +1.12%、山西焦煤 +0.90%、兰花科创 +0.57%）；焦化+炭黑一体超额约 0（陕西黑猫 -0.54%，但盘中最高 +8.06% 全天回吐、换手 5.25%、成交 4.07 亿）；纯炭黑制造超额 <strong>-0.96 ~ -8.62pct</strong>（黑猫股份 -9.16%、换手 11.50%、成交 8.03 亿为全链最大；金能科技 -3.97%、永东股份 -3.67%、龙星科技 -3.19%、联科科技 -1.50%）。黑猫 9/1 收 8.05 → 9/10 最高 11.00 → 9/14 收 10.15（+4.86%）→ 9/15 收 9.22，<strong>区间振幅 38.04%、高位放量长阴</strong>。当日 32 家涨停中<strong>无一炭黑股</strong>。结论：市场已把中游定价为<strong>受损方</strong>，而非涨价受益方。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-03 起</div><div><div class=\"x\">江苏优彩新材料自 9/3 起上调全系列炭黑产品价格、新订单执行新价；本周国内多家中型炭黑厂跟进，单次调价 200-500 元/吨不等。</div><div class=\"y\">为什么：本轮第一段：涨价由炭黑厂主动发起，性质是<strong>亏损倒逼的挺价</strong>，而非需求拉动——这决定了后续它无法转化为利润。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-08 至 09-10</div><div><div class=\"x\">煤焦油拍卖连破纪录：9/8 内蒙古广聚 3290 吨成交 5910-6150 元（单场涨幅创新高）；9/9 山西鹏飞 6810 元、单次上调 1910 元刷新主产区竞拍纪录；9/10 山钢莱芜 1000 吨成交 6720 元创该厂历史新高。</div><div class=\"y\">为什么：成本端的实物证据链——炭黑报价的每一次上调，都被上游煤焦油更大的涨幅吃掉，这是『价差扩张』还是『价差压缩』的分水岭。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-09</div><div><div class=\"x\">黑猫股份披露股票交易异常波动公告，明确表述：受煤焦油上涨带来成本压力，公司对炭黑产品进行<strong>顺价调价</strong>，调价属于<strong>成本传导</strong>，利润能否修复仍取决于原料、下游承接能力。</div><div class=\"y\">为什么：龙头公司自己否认了『涨价=增利』的映射。这份公告是本档案最硬的定性证据——上市公司口径与标题党叙事直接冲突。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-15 18:40</div><div><div class=\"x\">财联社报道炭黑刷新历年新高（N330 报 11500-12000 元/吨、较 9 月初 +3650 元、+45%、单价与单周涨幅双创历史新高）；同日同花顺报道『炭黑企业单吨亏损额度创历史新高、大型炭黑厂普遍减产 3-4 成、中小厂直接停产、行业开工率约 65%』以及『轮胎厂生产即亏损、集中减产』。</div><div class=\"y\">为什么：第二段、也是本档案的成立点：<strong>价格历史新高与利润历史新低在同一天被同时确认</strong>，成本推动型涨价陷阱被完整证伪给市场看。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-16 08:22</div><div><div class=\"x\">东财快讯以「炭黑市场刷新历史新高 炭黑龙头有望迎来盈利修复」为题二次报道（6 条同源），援引相同的 9/14 报价 11500-12000 元/吨、+45% 数据，但叙事从「单吨亏损同步创历史新高」转向「盈利修复」</div><div class=\"y\">为什么：**叙事转向是本档二段的关键**：同一组数据被解读为相反方向。原档判为证伪型（价格与利润背离），而二段报道开始讲盈利修复——这正是需要盯住黑猫毛利率的原因，叙事可以变，毛利率不会骗人</div></div></div><div class=\"u\"><div class=\"w\">2026-09-16 收盘（本档情景树第 4 分支兑现）</div><div><div class=\"x\">9/16 09:32 快讯「炭黑概念表现活跃，龙星科技一字涨停，黑猫股份、永东股份、联科科技、远翔新材跟涨」；收盘龙星科技 <strong>+10.08%（一字涨停）</strong>、黑猫股份 <strong>+9.98%</strong>、永东股份 +3.20%、联科科技 +3.34%、金能科技 +0.62%。当日「化工涨价·炭黑」题材 5 家涨停（含瑞丰高材、四川美丰、福莱蒽特）。<strong>而 9/15 领涨的焦煤全线转跌</strong>：山西焦煤 -1.35%、淮北矿业 -1.25%、冀中能源 -1.33%、兰花科创 -0.43%，仅兖矿能源 +0.15%。</div><div class=\"y\">为什么：**本档情景树「标题误读·记忆驱动反弹」分支被实盘完整兑现，且是 9/15 排序的完全反转**：9/15 市场按煤焦油净敞口排序（焦煤超额 +1.11~+1.66pct、炭黑超额 -0.96~-8.62pct），9/16 因「盈利修复」叙事转向，排序<strong>整体倒转</strong>（炭黑涨停、焦煤收绿）。这是本档最有价值的一次记录——它证明了<strong>同一组数据在不同叙事框架下可以产生完全相反的价格反应</strong>，也验证了「盯毛利率不盯价格」这一判据的必要性：黑猫 9/9 公告口径未变、单吨亏损创历史新高的事实未变，变的只是报道标题。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这条链的<strong>分水岭时点</strong>是 9/9 黑猫股份那份异动公告——龙头第一次在法定披露口径下把本轮涨价定性为『成本传导』，并明确表示利润能否修复不确定，等于公司自己切断了『炭黑涨价 → 炭黑股受益』的映射。<strong>传导的关键约束</strong>在成本结构：煤焦油占炭黑成本 70%-80%，且同比已翻倍至 6800 元/吨，炭黑报价的天花板由下游轮胎的承受力决定，而轮胎端已『生产即亏损』并集中减产——涨价只是把上游的成本压力<strong>过路</strong>式地记在中游账上，并没有在中游沉淀为毛利。更反直觉的是，<strong>减产本身是中游对高价的理性反应</strong>：开工率 65%、大厂减产 3-4 成，意味着炭黑厂用『少卖』来对冲『卖一单亏一单』，于是价格新高与利润新低同时成立。<strong>待验证的核心变量</strong>是价差方向而非价格水平——煤焦油与炭黑的价差是继续压缩还是开始扩张，这取决于两个 exogenous 变量：山西焦煤供应是否恢复、轮胎厂减产是否已到极限。<strong>隐藏面</strong>在于一体化：同时拥有焦化与炭黑产能的样本（陕西黑猫、金能科技）理论上能用自产煤焦油对冲，但 9/15 它们的超额也只是 0.00 与 -3.43pct，说明市场认为一体化的对冲量级远小于外购敞口——这条链目前<strong>没有任何一个环节被资金当作受益方</strong>，唯一的受益环节在焦煤。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>山东 N330 报 11500-12000 元/吨，较 9 月初 +3650 元（+45%），单价与单周涨幅双创历史新高（隆众/买化塑，财联社 9/15 18:40）</li><li>上游煤焦油 6800 元/吨 vs 去年同期 3400 元/吨，同比翻倍；9/8-9/10 三场拍卖连破纪录</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">反向</span><ul><li>煤焦油占炭黑成本 70%-80%，炭黑厂单吨亏损额度创历史新高，大厂减产 3-4 成、行业开工率 65%</li><li>下游轮胎占炭黑消费六成以上且『生产即亏损』集中减产，成本无法继续向下传导</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">存疑</span><ul><li>黑猫股份 9/9 公告原文：调价属成本传导，利润能否修复仍取决于原料、下游承接能力</li><li>涨价发端于 9/3 的亏损倒逼挺价，新价订单尚未进入结算周期，Q3 报表大概率仍反映高额原料成本</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">已分化</span><ul><li>9/15 上游焦煤超额 +1.11~+1.66pct、中游炭黑超额 -0.96~-8.62pct，排序与成本暴露度完全一致</li><li>黑猫 9/10 见顶 11.00 后至 9/15 收 9.22，两日回撤 16.2%，9/15 换手 11.50%、成交 8.03 亿为全链最大</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响为负、业绩存疑、股价已按受损分化——这是『商品创历史新高但中游不受益』的反向样本，不是涨价题材。</div>\n    <ul class=\"assess\"><li>闭合度 45%——四环中『影响』与『业绩』两环为负向，逻辑不是『涨价受益』而是『涨价受损』，作为题材的传导链事实上是断的。</li><li>边界切分：<strong>受益方只有焦煤</strong>（山西焦煤、淮北矿业、冀中能源、兰花科创）；<strong>中性/对冲方</strong>是焦化+炭黑一体化（陕西黑猫、金能科技）；<strong>受损方</strong>是纯炭黑制造（黑猫、龙星、永东、联科）与下游轮胎（玲珑、森麒麟、贵州）。判断任何一只标的只需问一句：它在煤焦油上是<strong>多头还是空头</strong>。</li><li>主线联动：与 <strong>thermal-coal-830</strong>（动力煤）同属煤炭链但品种不同——本档案的驱动是<strong>炼焦煤</strong>的稀缺性与焦化环节减产，而非动力煤的电力需求；两份档案共同构成『煤价上行在不同煤种上的传导差异』。与 <strong>diesel-crack-record</strong> 在方法论上同源：两者都是『商品创新高 ≠ A 股中游受益』的映射断裂样本，可交叉阅读。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>山西焦煤</b><span class=\"code\">000983</span><span class=\"tag\">本轮涨价的归因起点，9/15 逆势 +0.90%</span><span class=\"cap\">6.60 元 · 流通 375 亿 · 9/16 -1.35%</span></div>\n    <div class=\"logic\">焦煤源头·唯一真受益</div>\n    <div class=\"detail\">国内炼焦煤第一大供应商，主焦煤与肥煤的稀缺性决定了它对下游有定价权。本轮炭黑暴涨的归因链条第一环就是『山西焦煤供应紧张』，它处在成本推动的源头而非承受端。9/15 全链杀跌中逆势收红，换手仅 1.01%——不是情绪推动，是配置型资金的确定性买入。它的优势在于与下游需求脱钩：即便炭黑、轮胎全线停产，只要焦化环节仍有利润，焦煤就能维持挺价。</div>\n    \n    \n    <div class=\"risk\">⚠️ 焦煤价格已至高位，保供政策或山西复产超预期会带来价格与超额同步回落</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>淮北矿业</b><span class=\"code\">600985</span><span class=\"tag\">9/15 +1.08%，全链最高超额 +1.62pct</span><span class=\"cap\">16.63 元 · 流通 448 亿 · 9/16 -1.25%</span></div>\n    <div class=\"logic\">焦煤+焦化·超额最高</div>\n    <div class=\"detail\">华东焦煤基地并配套焦化产能，是本链条上受益面最宽的样本：既享受焦煤涨价，其焦化副产品（煤焦油、粗苯）也随本轮原料紧张而升值。9/15 以 0.55% 的低换手收 +1.08%，与黑猫股份 11.50% 换手的下跌形成鲜明对照——一个是低换手稳步上行，一个是高换手放量出逃，两者的资金性质完全不同。相对山西焦煤，它还多一层焦化段的加工利润。</div>\n    \n    \n    <div class=\"risk\">⚠️ 长协煤比例较高会稀释现货涨价弹性；焦化段若因成本过高减产则反成拖累</div>\n  </div></div><div class=\"t\">🏛️ 容量中军 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>冀中能源</b><span class=\"code\">000937</span><span class=\"tag\">9/15 +1.12%，超额 +1.66pct 为全链最高</span><span class=\"cap\">4.45 元 · 流通 168 亿 · 9/16 -1.33%</span></div>\n    <div class=\"logic\">河北焦煤·链内反向量度</div>\n    <div class=\"detail\">河北焦煤主产区标的，本轮以 +1.12% 录得全链最高超额（+1.66pct），且换手仅 1.06%。作为容量中军，它的作用是给『焦煤受益』这条支线提供指数级锚定——它不像黑猫那样有题材记忆与情绪属性，走势更接近板块 beta 本身。当它持续跑赢而炭黑股持续跑输时，说明市场对本链条的裁决是稳定的而非情绪化的。</div>\n    \n    \n    <div class=\"risk\">⚠️ 焦煤价格高位回落时它是首批回吐品种；煤炭板块整体受动力煤价格拖累</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>兰花科创</b><span class=\"code\">600123</span><span class=\"tag\">9/15 +0.57%，超额 +1.11pct</span><span class=\"cap\">7.01 元 · 流通 103 亿 · 9/16 -0.43%</span></div>\n    <div class=\"logic\">无烟煤+尿素·不同链参照</div>\n    <div class=\"detail\">主产无烟煤并配套尿素，与本链条（炼焦煤—焦化—炭黑—轮胎）并不在同一传导上。把它放进容量中军的意义是做<strong>对照组</strong>：9/15 它也收红 +0.57%，说明当日煤炭板块整体有板块性资金流入，焦煤四只的逆势收红中<strong>含有一部分煤炭板块 beta 而非纯本链条受益</strong>——这是判断预期差时必须扣掉的部分。</div>\n    \n    \n    <div class=\"risk\">⚠️ 与本链条不同链，不能作为受益证据；尿素业务的景气度独立于煤焦链</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>兖矿能源</b><span class=\"code\">600188</span><span class=\"tag\">9/15 -1.42%，超额 -0.88pct</span><span class=\"cap\">20.11 元 · 流通 1199 亿 · 9/16 +0.15%</span></div>\n    <div class=\"logic\">动力煤为主·反例锚</div>\n    <div class=\"detail\">以动力煤为主的 2000 亿级煤炭权重股，9/15 收 -1.42%、跑输上证。它的存在提供了关键的<strong>反例锚</strong>：如果当日是『煤炭板块普涨』，动力煤龙头不该收绿。兖矿收绿而焦煤四只收红，说明资金<strong>在煤种内部做了明确区分</strong>——买的是炼焦煤的稀缺性，不是煤炭的板块 beta。这条证据把兰花科创带来的板块 beta 担忧大幅削弱。</div>\n    \n    \n    <div class=\"risk\">⚠️ 动力煤与炼焦煤景气分化的持续性是本判断的前提；若煤价整体下行，焦煤难以独善其身</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>金能科技</b><span class=\"code\">603113</span><span class=\"tag\">9/15 -3.97%，一体化对冲未被市场认可</span><span class=\"cap\">4.87 元 · 流通 41 亿 · 9/16 +0.62%</span></div>\n    <div class=\"logic\">焦化+炭黑·对冲是否成立</div>\n    <div class=\"detail\">焦化起家、向下延伸炭黑与烯烃，是本链条上最好的边界切分样本：既有煤焦油产出又有炭黑消耗，理论上能对冲。但 9/15 收 -3.97%、超额 -3.43pct，与纯炭黑股同向——市场用价格裁决了『自给量级远小于外购敞口，对冲不成立』。它是否真的能对冲，取决于一个从未被充分披露的变量：煤焦油自给率。</div>\n    \n    \n    <div class=\"risk\">⚠️ 自给率未公开披露，对冲逻辑无法证实；41 亿小市值波动剧烈</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>联科科技</b><span class=\"code\">001207</span><span class=\"tag\">9/15 -1.50%，全链炭黑股中跌幅最小</span><span class=\"cap\">17.65 元 · 流通 52 亿 · 9/16 +3.34%</span></div>\n    <div class=\"logic\">炭黑+二氧化硅·跌幅最轻</div>\n    <div class=\"detail\">炭黑与二氧化硅双主业，其中二氧化硅（白炭黑）用于绿色轮胎，不受本轮煤焦油涨价影响。9/15 它仅跌 1.50%，是炭黑股中跌幅最轻的一只——跌幅排序与<strong>煤焦油敞口占比</strong>高度一致（黑猫 -9.16% > 金能 -3.97% > 永东 -3.67% > 龙星 -3.19% > 联科 -1.50%），这本身就是市场定价精度的证据。</div>\n    \n    \n    <div class=\"risk\">⚠️ 二氧化硅业务占比若不高，则抗跌属性有限；白炭黑对炭黑有部分替代关系，逻辑方向相反</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>龙星科技</b><span class=\"code\">002442</span><span class=\"tag\">9/15 -3.19%，换手 2.16%</span><span class=\"cap\">5.68 元 · 流通 28 亿 · 9/16 +10.08%</span></div>\n    <div class=\"logic\">原龙星化工·炭黑次龙头</div>\n    <div class=\"detail\">原龙星化工，国内炭黑产能第二梯队。9/15 收 -3.19%、换手仅 2.16%、成交 0.55 亿——与黑猫 11.50% 的巨量换手相比，它属于<strong>无人问津式的阴跌</strong>而非资金出逃。作为情绪小票，它的基因是『炭黑涨价行情的跟随者』：历史上每一轮炭黑提价它都会被带动，但幅度与持续性均不及黑猫。本轮它的低换手下跌说明连跟风资金都没有进场。</div>\n    <div class=\"gene\">🧬 题材基因：炭黑涨价行情的二线跟随票，历次提价周期中涨幅约为龙头的一半，无独立行情记忆</div>\n    \n    <div class=\"risk\">⚠️ 26 亿市值流动性弱；无煤焦油自给，成本敞口 100% 暴露</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>永东股份</b><span class=\"code\">002753</span><span class=\"tag\">9/15 -3.67%，盘中最高 +1.91% 后翻绿</span><span class=\"cap\">6.78 元 · 流通 20 亿 · 9/16 +3.20%</span></div>\n    <div class=\"logic\">炭黑+煤焦油加工·双向敞口</div>\n    <div class=\"detail\">同时经营炭黑与煤焦油加工，理论上双向敞口可部分对冲。9/15 走势是全链典型的<strong>冲高回吐</strong>：盘中最高 +1.91%，收盘 -3.67%，换手 5.25%。开盘阶段有资金按『炭黑涨价』做多，但尾盘被按回，与陕西黑猫 +8.06% 回吐的形态一致——说明当日盘中有过至少两轮误读性试多，都被证伪。</div>\n    <div class=\"gene\">🧬 题材基因：小盘炭黑弹性票，2021 年炭黑景气周期中曾出现过连板行情，是资金对『炭黑涨价』的条件反射标的</div>\n    \n    <div class=\"risk\">⚠️ 双向敞口的净方向取决于两业务规模比，未量化前不能认定对冲；28 亿市值波动大</div>\n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>黑猫股份</b><span class=\"code\">002068</span><span class=\"tag\">9/15 -9.16%、换手 11.50%、成交 8.03 亿为全链最大</span><span class=\"cap\">10.14 元 · 流通 75 亿 · 9/16 +9.98%</span></div>\n    <div class=\"logic\">产能 116.2 万吨国内第一·基因与逻辑相反</div>\n    <div class=\"detail\">国内炭黑绝对龙头，年产能 <strong>116.2 万吨</strong>，产销量国内第一、世界前列，是每一轮炭黑涨价行情的资金第一反应对象。但本轮它同时是<strong>受损最重的一只</strong>——产能最大意味着在手低价订单最多、生产一单亏一单的绝对亏损额最大；公司 9/9 公告已自认调价是成本传导。9/1 收 8.05 → 9/10 最高 11.00 → 9/15 收 9.22，区间振幅 38.04%，9/15 以 11.50% 的全链最高换手放量长阴，是典型的<strong>资金认账出逃</strong>形态。</div>\n    <div class=\"gene\">🧬 题材基因：2021 年与 2025 年两轮炭黑提价周期的绝对龙头，市场对『炭黑涨价 → 买黑猫』有极强的条件反射记忆——但本轮性质相反：前两轮是需求拉动下的量价齐升，本轮是原料翻倍下的成本挤压，产能越大亏损越多，基因记忆与真实逻辑方向完全相反</div>\n    \n    <div class=\"risk\">⚠️ 若市场只读『炭黑创历史新高』标题而不读内容，可能出现记忆驱动的误读性反弹；但公司公告口径已明确否定增利，反弹缺乏基本面支撑</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2026-09-01 至 09-15：黑猫股份 8.05 → 9.22（区间 +14.25%），区间最高 11.00（9/10），区间振幅 38.04%——本轮已完整走完『涨一波 → 见顶 → 高位放量长阴』三阶段</li><li>2026-09-09：黑猫股份披露股票交易异常波动公告，定性调价为『成本传导』，并提示利润能否修复取决于原料与下游承接能力——龙头公司首次在法定口径下否定涨价增利映射</li><li>2026-09-14：黑猫股份盘中触及涨停、收 +4.86%，成交 9.64 亿、换手 13.38%；次日 9/15 即 -9.16%、换手 11.50%——连续两日 10% 以上换手的方向反转，是本链条资金裁决的直接记录</li><li>2026-09-15：陕西黑猫盘中最高 +8.06% 收 -0.54%、永东股份盘中最高 +1.91% 收 -3.67%——当日盘中至少两轮『按炭黑涨价做多』的试盘均被按回，是对误读逻辑的实盘证伪</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>山西焦煤</b><span class=\"code\">000983</span><span class=\"tag\">炼焦煤第一大供应商·本轮涨价的源头环节</span></div>\n    <div class=\"logic\">产业地位 | 弹性来源 | 约束条件：国内炼焦煤龙头，主焦煤/肥煤稀缺性最强 | 快讯归因的『山西焦煤供应紧张』即指向它，售价上行几乎全额落到毛利 | 380 亿市值弹性温和，且焦煤已连续上行，保供政策加码则上行受限</div>\n    <div class=\"detail\">本轮全链涨价的起点就是『山西焦煤供应紧张』——快讯与隆众口径一致，它是唯一处在<strong>成本推动源头</strong>的上市公司。焦煤的成本端（人工、折旧、资源税）刚性，售价上行几乎全额沉淀为毛利；且它不直接承担炭黑、轮胎端的需求塌陷，需求下滑要经焦化、炭黑、轮胎三层传导才回到它，时滞最长。9/15 全链杀跌中它逆势 +0.90%、超额 +1.44pct，是资金唯一按受益方对待的环节。独特之处在于它的定价不受下游承接力约束——即便轮胎全线停产，只要焦化还有利润，焦煤就能挺价。约束是 380 亿市值的央企属性决定了弹性温和。</div>\n    \n    <div class=\"confirm\">✔ 确认：山西主焦煤坑口价继续上移 / 焦化厂开工率回升（说明焦煤需求恢复而非仅靠减产挺价）</div>\n    <div class=\"risk\">⚠️ 焦煤价格已连续上行至高位，若保供稳价政策加码或山西煤矿复产超预期，价格与超额可能同步回落</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>淮北矿业</b><span class=\"code\">600985</span><span class=\"tag\">焦煤+焦化一体·全链超额最高</span></div>\n    <div class=\"logic\">产业地位 | 弹性来源 | 约束条件：华东焦煤基地，同时拥有焦化产能 | 焦煤涨价的直接受益 + 焦化段可向下转嫁，双环节受益 | 454 亿市值，煤炭长协比例较高会稀释现货弹性</div>\n    <div class=\"detail\">与山西焦煤同处源头环节，但多了一层<strong>焦化产能</strong>——在焦煤→焦炭→煤焦油的链条上，它既是原料的多头，又是煤焦油涨价的间接受益方（焦化副产品升值）。9/15 它录得全链最高超额：+1.08%（相对上证 +1.62pct），且换手仅 0.55%、成交 2.51 亿，属于<strong>低换手下的稳步走强</strong>，与黑猫股份 11.50% 换手的对倒式出逃形成鲜明对照。独特之处在于它同时受益于『焦煤涨价』与『煤焦油涨价』两个方向，是本链条上受益面最宽的一体化样本。</div>\n    \n    <div class=\"confirm\">✔ 确认：焦炭价格跟涨幅度 / 焦化副产品（煤焦油、粗苯）售价在季报中的体现</div>\n    <div class=\"risk\">⚠️ 长协煤比例高会稀释现货涨价弹性；若焦化段因焦煤成本过高而减产，一体化优势反而不及纯焦煤</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>金能科技</b><span class=\"code\">603113</span><span class=\"tag\">焦化+炭黑一体·边界切分最清晰的样本</span></div>\n    <div class=\"logic\">产业地位 | 弹性来源 | 约束条件：山东焦化起家、向下延伸炭黑与烯烃 | 理论上自产煤焦油可对冲炭黑原料成本 | 41 亿小市值、炭黑产能规模远小于黑猫，9/15 仍收 -3.97%</div>\n    <div class=\"detail\">本链条上<strong>最好的边界切分样本</strong>：它既做焦化（产煤焦油）又做炭黑（耗煤焦油），理论上能对冲本轮成本冲击。但 9/15 它收 -3.97%、超额 -3.43pct，与纯炭黑的黑猫（-9.16%）、永东（-3.67%）同向而非与焦煤同向——<strong>市场给出了明确裁决：一体化的自给量级远小于外购敞口，对冲不成立</strong>。这个样本的价值在于它排除了『有焦化就安全』的想当然推论，把判断标准收敛为单一的煤焦油净敞口。独特之处还在于它的烯烃业务提供了独立于本链条的业绩底座。</div>\n    \n    <div class=\"confirm\">✔ 确认：公司披露的煤焦油自给率 / 炭黑业务毛利率环比是否优于同业</div>\n    <div class=\"risk\">⚠️ 自给率若未披露则对冲逻辑无法证实；炭黑产能规模小，弹性与受损程度都不如龙头清晰</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>陕西黑猫</b><span class=\"code\">601015</span><span class=\"tag\">焦化+炭黑一体·盘中冲高 8% 后全天回吐</span></div>\n    <div class=\"logic\">同为焦化+炭黑一体化，9/15 盘中最高 +8.06%、收盘 -0.54%，是全链唯一出现资金主动试盘的样本</div>\n    <div class=\"detail\">与金能科技结构相似，但 9/15 走出了全链<strong>最有信息量的分时</strong>：盘中最高冲到 +8.06%，收盘却翻绿 -0.54%，换手 5.25%、成交 4.07 亿。这个『冲高—回吐』形态说明有资金试图按『炭黑涨价受益』做多，但承接盘不认同该逻辑，最终被按回。它是观察市场是否开始误读这条快讯的<strong>一线温度计</strong>。</div>\n    \n    \n    <div class=\"risk\">⚠️ 焦化主业本身受焦煤成本挤压，一体化不等于免疫；76 亿市值波动率高</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>宝泰隆</b><span class=\"code\">601011</span><span class=\"tag\">煤焦油深加工·工业萘/煤沥青受益方</span></div>\n    <div class=\"logic\">主营煤焦油深加工，煤沥青报盘 8500 元、工业萘山东周涨 1250 元至 7650 元（周度涨幅历史高位），是本轮原料涨价的另一条受益支线</div>\n    <div class=\"detail\">属于<strong>煤焦油的加工方而非消耗方</strong>，与本链条方向相反：煤焦油越紧张，它的原料越贵，但下游煤沥青、工业萘的涨幅（工业萘单周 +1250 元、周度涨幅创历史高位）已超过原料，理论上价差扩张。9/15 收 -1.35%、盘中最高 +2.36% 同样冲高回吐，说明市场对该支线也持观望。</div>\n    \n    \n    <div class=\"risk\">⚠️ 同为成本推动结构，若煤焦油涨幅继续快于深加工品，同样落入价差压缩陷阱</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>纯炭黑制造（黑猫/龙星/永东）</b><span class=\"code\">002068/002442/002753</span></div>\n    <div class=\"logic\">煤焦油占炭黑成本 70%-80% 且同比翻倍，炭黑厂是煤焦油的<strong>空头</strong>而非多头。当前单吨亏损创历史新高、开工率仅 65%，涨价伴随的是减产而非放量——『商品涨价』在这个环节是<strong>成本项而非收入项</strong>，不在受益传导链上</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>下游轮胎（玲珑/森麒麟/贵州）</b><span class=\"code\">601966/002984/000589</span></div>\n    <div class=\"logic\">轮胎占炭黑消费六成以上，是炭黑的成本承接方而非受益方。当前『生产即亏损』并集中减产，成本无法向下传导，9/15 森麒麟 -2.04%（5 日 -8.03%、年内 -38.73%）、玲珑 -1.40%（年内 -27.25%）</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>无煤焦油自给的中小炭黑厂</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">本轮已直接停产停工，产能出清属于行业出清的<strong>结果</strong>而非受益标的，且多数未上市</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>动力煤标的（兖矿能源）</b><span class=\"code\">600188</span></div>\n    <div class=\"logic\">与本链条不同链——本轮驱动是炼焦煤稀缺性与焦化减产，动力煤走的是电力需求逻辑。9/15 兖矿 -1.42%、超额 -0.88pct，已被市场明确区分</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**证伪型**：标题利好、内容利空。基准参照：2021 年煤焦油大涨周期，炭黑厂在价格新高季度普遍亏损，股价跑输焦煤 30pct 以上。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">山西焦煤 ＞ 淮北矿业 ＞ 金能科技。排序理由：越靠上游、煤焦油自给率越高，越受益；炭黑制造端是成本受损方，排序最后。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">龙星科技 ＞ 永东股份 ＞ 黑猫股份。gene：龙星是小盘炭黑弹性票，2021 煤焦油行情中曾三连板；黑猫虽为龙头但 9/15 已 -9.16%、换手 11.5%，筹码已散。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若下一期炭黑报价继续上移**且**煤焦油涨幅小于炭黑涨幅（价差扩张） → 逻辑状态由「成本挤压」升为「价差修复」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 山东 N330 突破 12000 元/吨且价差扩张 ② 焦煤四只相对上证超额扩大至 3pct 以上 ③ 黑猫毛利率环比转正。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 煤焦油拍卖价见顶回落、炭黑报价随之下行 ② 轮胎减产扩大、炭黑开工率跌破 65% ③ 黑猫 Q3 亏损扩大。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">盯的是**价差**不是价格。炭黑涨 45% 的同时煤焦油涨得更多，单吨亏损创历史新高——这意味着「涨价」对炭黑厂是利空。9/15 盘面已经给出正确答案：焦煤四只超额 +1.1~1.7pct，黑猫 -9.16%。若次日资金按「涨价利好」去追炭黑制造，那是把方向做反了。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>情景推演</h2>\n    <div style=\"font-size:12px;color:var(--dim);margin-bottom:8px\">每个分支为可观察的条件树——触发条件兑现后的逻辑状态与验证信号，互斥且可证伪。不含操作建议。</div>\n    <div class=\"scen\"><div class=\"sc\"><div class=\"br\">▸ 价差压缩延续·中游继续受损</div><div class=\"tg\">触发：<b>煤焦油拍卖价继续创新高 / 炭黑报价涨幅落后于煤焦油 / 炭黑开工率维持 65% 或更低 / 轮胎厂减产范围扩大</b></div><div class=\"ls\">逻辑状态：<b>成本推动型涨价陷阱完整兑现：炭黑价格继续新高但中游利润继续新低，涨价的唯一净受益方是焦煤。A 股按煤焦油净敞口的排序被进一步强化——焦煤正超额扩大、炭黑股负超额扩大，题材在权益端始终无法成立</b></div><div class=\"fs\">观察信号：<b>山西焦煤/淮北矿业相对上证超额扩大至 3pct 以上，同时黑猫股份换手继续维持 10% 以上且股价新低 / 炭黑股持续缺席涨停题材地图</b></div></div><div class=\"sc\"><div class=\"br\">▸ 价差扩张·中游利润修复</div><div class=\"tg\">触发：<b>炭黑报价涨幅开始超过煤焦油 / 新价订单进入结算 / 炭黑开工率自 65% 回升 / 轮胎厂接受提价并发出涨价函</b></div><div class=\"ls\">逻辑状态：<b>逻辑性质发生反转：涨价从『成本过路』变为『毛利沉淀』，本档案的『涨价陷阱』定性被推翻。中游从受损方转为受益方，黑猫股份的产能规模从『亏损放大器』变回『弹性放大器』——这是对本档案最重要的证伪路径</b></div><div class=\"fs\">观察信号：<b>黑猫股份公告或季报炭黑毛利率环比转正 / 炭黑股首次出现在涨停题材地图 / 永东股份、龙星科技跟随放量收红</b></div></div><div class=\"sc\"><div class=\"br\">▸ 上游见顶·全链降温</div><div class=\"tg\">触发：<b>山西焦煤供应恢复或保供政策加码 / 焦化厂复产使煤焦油商品量回升 / 煤焦油拍卖成交价环比回落</b></div><div class=\"ls\">逻辑状态：<b>成本推动的源头被切断，炭黑报价失去支撑回落，全链条价格与利润同步降温。焦煤的正超额消失，中游的负超额也收窄——本链条作为题材的生命周期结束，回到 thermal-coal-830 所描述的基础煤炭景气框架</b></div><div class=\"fs\">观察信号：<b>煤焦油拍卖成交价连续两场回落 / 焦煤四只超额转负 / 炭黑报价跌回 10000 元/吨下方</b></div></div><div class=\"sc\"><div class=\"br\">▸ 标题误读·记忆驱动反弹</div><div class=\"tg\">触发：<b>仅『炭黑刷新历史新高』标题被传播、内容中的亏损与减产信息未被定价 / 黑猫股份竞价大幅高开 / 叙事由『单吨亏损创历史新高』转向『盈利修复』</b></div><div class=\"ls\">逻辑状态：<b>**该分支已于 9/16 完整兑现**：基因记忆（2021、2025 两轮提价周期龙头）压过真实逻辑，出现与基本面方向相反的反弹——龙星科技一字涨停 +10.08%、黑猫股份 +9.98%、永东 +3.20%、联科 +3.34%，而 9/15 领涨的焦煤全线转跌（山西焦煤 -1.35%、淮北矿业 -1.25%、冀中能源 -1.33%）。<strong>整条链的排序在一天内完全倒转</strong>，而期间没有任何新的基本面信息：9/9 黑猫公告口径未变、单吨亏损创历史新高与开工率 65% 的事实未变，变化的只有 9/16 08:22 报道的<strong>叙事方向</strong>。这使本档从『证伪型预判』升级为『证伪型实证』——同一组数据在两个叙事框架下产生了完全相反的价格反应，且这是本档第一次完整记录到误读的<strong>持续时间与幅度</strong>（一个交易日、龙头涨停），而非 9/15 那种盘中试盘即被按回</b></div><div class=\"fs\">观察信号：<b>**9/16 已兑现**：黑猫股份 +9.98%、龙星科技一字涨停 +10.08%，但换手与封单结构决定其持续性；<strong>下一步判据是</strong>：黑猫股份三季报炭黑毛利率是否环比转正——若未转正而股价维持，说明误读仍在延续；若转正，则本档的『证伪型』定性需要按 scenarioTree 第 2 分支（价差扩张·中游利润修复）重新评估</b></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>下一期隆众/买化塑报价中山东 N330 是否继续上移并突破 12000 元/吨，且同期煤焦油涨幅<strong>小于</strong>炭黑涨幅（价差开始扩张）</b></li><li><b>山西主焦煤坑口价继续上移，焦煤四只（山西焦煤/淮北矿业/冀中能源/兰花科创）相对上证的正超额扩大至 3pct 以上</b></li><li><b>炭黑行业开工率从 65% 回升（说明是新价订单放量，而非低价单亏损生产）</b></li><li><b>黑猫股份后续公告或季报显示炭黑业务毛利率环比转正——这将是『成本传导成功』的首个公司级证据</b></li><li><b>轮胎厂发出提价函并落地（成本开始向终端传导，中游压力缓解）</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>煤焦油拍卖价见顶回落（鹏飞/广聚/山钢下一场成交价低于前场），炭黑报价随之下行——涨价周期结束，题材消失</b></li><li><b>轮胎厂减产范围继续扩大、炭黑厂开工率跌破 65%——需求塌陷快于供给收缩，价格与利润双杀</b></li><li><b>山西焦煤供应恢复、焦化厂复产，煤焦油商品量回升至紧缺前水平——成本推动的源头被切断</b></li><li><b>黑猫股份披露单吨亏损继续扩大或 Q3 业绩亏损——公司口径确认价差压缩，『涨价受益』叙事彻底失效</b></li><li><b>保供稳价政策直接干预焦煤价格</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">9 月下旬</div><div class=\"wh\">隆众/买化塑下一期山东 N330 炭黑报价与煤焦油拍卖成交价（鹏飞、广聚、山钢）</div><div class=\"wy\">价差方向是本档案成立与否的唯一客观判据——不是看价格水平，是看两个价格的相对速度</div></div><div class=\"tkc\"><div class=\"w\">10 月中旬</div><div class=\"wh\">炭黑行业开工率月度数据、轮胎厂开工率与提价函落地情况</div><div class=\"wy\">开工率回升代表新价订单放量（利润修复），继续下滑代表需求塌陷（双杀）</div></div><div class=\"tkc\"><div class=\"w\">三季报</div><div class=\"wh\">黑猫股份、龙星科技、永东股份、联科科技的炭黑业务毛利率环比</div><div class=\"wy\">公司级证据，直接证伪或证实『成本传导能否修复利润』</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">山西焦煤坑口价与山西煤矿复产进度、焦化厂开工率</div><div class=\"wy\">源头变量——焦煤供应一旦恢复，整条成本推动链条失去动力</div></div></div>\n\n    <div class=\"src\">数据来源：财联社 9/15 18:40 快讯（炭黑刷新历史新高）· 同花顺财经 9/15（生产即亏损、轮胎厂集中减产）· 隆众资讯/买化塑研究院报价（N330 11500-12000 元/吨、煤焦油 6800 元/吨、开工率 65%）· 黑猫股份 9/9 股票交易异常波动公告 · 东方财富 7×24 快讯 9/8-9/10 煤焦油拍卖纪录 · 东方财富行情接口 9/15 收盘数据 · 本工作区 out/fupan_20260915.json 复盘数据</div>\n    <footer>炭黑刷新历史新高 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "russia-diesel-outage", "title": "俄柴油产能折半", "date": "2026-09-15", "grade": "正式档", "pricing": "部分定价", "crate": "warn", "search": "俄柴油产能折半 约一半顶级柴油生产工厂遭袭减产 · 7 月俄炼能 42.7% 瘫痪、日均 391 万桶创 2005 年最低 · 美国柴油零售破 6 美元/加仑历史新高 · 同日特朗普喊停、克宫响应 地缘冲突 ⚠ 供给冲击型 · 实物端升级与政治缓和变量同夜落地，a 股只认运价不认油价", "card": "<a class=\"card-c\" href=\"#russia-diesel-outage\" data-search=\"俄柴油产能折半 约一半顶级柴油生产工厂遭袭减产 · 7 月俄炼能 42.7% 瘫痪、日均 391 万桶创 2005 年最低 · 美国柴油零售破 6 美元/加仑历史新高 · 同日特朗普喊停、克宫响应 地缘冲突 能源地缘·中东供断与成品油 部分定价 招商南油 招商轮船 中国石油 中国海油 中远海能\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-15</span>\n    <span class=\"crate warn\">⚠ 供给冲击型 · 实物端升级与政治缓和变量同夜落地，A 股只认运价不认油价 地缘冲突</span>\n  </div>\n  <div class=\"ctitle\">俄柴油产能折半</div>\n  <div class=\"csub\">约一半顶级柴油生产工厂遭袭减产 · 7 月俄炼能 42.7% 瘫痪、日均 391 万桶创 2005 年最低 · 美国柴油零售破 6 美元/加仑历史新高 · 同日特朗普喊停、克宫响应</div>\n  <div class=\"cpos\">约一半俄顶级柴油厂遭袭减产、7 月俄炼能 42.7% 瘫痪；同夜特朗普喊停、克宫响应「是个好主意」——升级与缓和变量同时落地。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">能源地缘·中东供断与成品油</span>\n    \n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 9</span>\n    <span class=\"nm\">招商南油</span><span class=\"nm\">招商轮船</span><span class=\"nm\">中国石油</span><span class=\"nm\">中国海油</span><span class=\"nm\">中远海能</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-15 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-15</div>\n    <h1>俄柴油产能折半</h1>\n    <div class=\"sub\">约一半顶级柴油生产工厂遭袭减产 · 7 月俄炼能 42.7% 瘫痪、日均 391 万桶创 2005 年最低 · 美国柴油零售破 6 美元/加仑历史新高 · 同日特朗普喊停、克宫响应</div>\n    <div class=\"badges\">\n      <span class=\"badge warn\">⚠ 供给冲击型 · 实物端升级与政治缓和变量同夜落地，A 股只认运价不认油价</span>\n      <span class=\"badge neutral\">地缘冲突</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：能源地缘·中东供断与成品油</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">diesel-crack-record</span><span class=\"tag\" style=\"margin-right:4px\">europe-gas-squeeze</span><span class=\"tag\" style=\"margin-right:4px\">oil-hormuz</span><span class=\"tag\" style=\"margin-right:4px\">oil-tanker-supercycle</span><span class=\"tag\" style=\"margin-right:4px\">saudi-east-west-pipeline</span></div>\n    <div class=\"posnote\">约一半俄顶级柴油厂遭袭减产、7 月俄炼能 42.7% 瘫痪；同夜特朗普喊停、克宫响应「是个好主意」——升级与缓和变量同时落地。</div>\n    <details class=\"more\"><summary>展开定价状态详版（797 字）</summary><div class=\"pos\"><b>定价状态备注：</b>两条方向相反的催化在 9/15 <strong>盘后 41 分钟内先后落地</strong>：17:42 财联社报『俄罗斯约一半顶级柴油生产工厂遭无人机袭击后削减产量』（利多供给紧张），18:23 克里姆林宫表示特朗普关于乌克兰能源目标停火的提议『是个好主意』并称『如果制裁解除，全球能源价格将会下降』（利多缓和）。<strong>9/15 收盘价两者皆未含</strong>。<strong>盘面状态</strong>（上证 -0.54%，需扣 beta）：A 股对『油价破百』几乎无反应，但对『运价』反应强烈——<strong>油运独强</strong>：招商轮船 +2.50%（超额 +3.04pct，盘中最高 +6.00% 后回吐，振幅 7.75%、换手 2.15%、成交 35.73 亿为全链最大，年内 +134.82%）、中远海能 +0.72%（+1.26）、招商南油 +0.87%（+1.41，盘中最高 +3.06%）；<strong>上游开采分化</strong>：中国石油 +0.63%（+1.17）、中国海油 -1.36%（-0.82）；<strong>炼化全绿且已连跌</strong>：中国石化 -1.49%（<strong>连跌 4 天累计 -5.88%</strong>）、恒力石化 -1.07%（5 日 -11.28%、年内 -25.04%）、荣盛石化 -1.06%（5 日 -9.87%）、上海石化 -1.06%、华锦股份 -0.74%（5 日 -12.20%）。同日国内商品期货原油主力<strong>涨超 5%</strong>、燃油/低硫燃油/沥青涨超 2%——<strong>商品端与权益端方向完全背离</strong>。结论：市场把这条线定价为『运价/吨海里受益』，明确<strong>不</strong>定价为『油价弹性受益』，且把炼化定价为受损方。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">催化本体</b><div class=\"v\">财联社 9/15 17:42：据报，<strong>俄罗斯约一半的顶级柴油生产工厂在遭无人机袭击后削减产量</strong>。这是本轮冲突中首次对<strong>柴油</strong>（而非原油）产能受损比例给出的量化口径。</div></div><div class=\"card fact\"><b class=\"k\">损失量级</b><div class=\"v\">IEA 统计：今年前 8 个月乌克兰平均<strong>每 3 天</strong>空袭一次俄罗斯炼油厂，8 月单月 <strong>21 次</strong>刷新月度纪录。至 7 月俄罗斯已有约 <strong>42.7% 炼油产能瘫痪</strong>，日均炼油量跌至 <strong>391 万桶</strong>，创 <strong>2005 年以来最低</strong>。8/26 路透：卢克石油旗下 NORSI（俄第四大炼厂、柴油产能超 500 万吨/年）因无人机袭击起火停产，至此卢克石油<strong>所有主要炼厂全部停摆</strong>。</div></div><div class=\"card fact\"><b class=\"k\">出口地位</b><div class=\"v\">俄罗斯是全球<strong>第二大柴油出口国</strong>，一度占全球海运柴油供应量的 <strong>11%</strong>。炼能大面积停摆后俄方保国内优先，自 4 月起逐级收紧成品油出口：先禁汽油 → 再禁航空煤油 → 7 月把<strong>柴油也纳入禁令并延长至 9 月底</strong>；曾经的出口大国如今反过来从国外进口汽油救急。</div></div><div class=\"card fact warn\"><b class=\"k\">价格验证</b><div class=\"v\">美国柴油零售价正式<strong>突破 6 美元/加仑、创历史新纪录</strong>，较一年前涨幅超六成，加州直奔 8 美元。同日国际原油结算价 WTI <strong>101.39 美元/桶</strong>（+1.34%）、布伦特 <strong>105.68 美元/桶</strong>（+1.07%）；国内商品期货 9/15 收盘原油主力<strong>涨超 5%</strong>，燃油、低硫燃油、沥青涨超 2%。</div></div><div class=\"card fact warn\"><b class=\"k\">A股映射为何断裂</b><div class=\"v\">三条硬约束使海外柴油涨价无法传导到 A 股炼化：① <strong>中国自 3 月起停发成品油出口</strong>，国际柴油高价吃不到；② <strong>发改委对成品油零售价设上限</strong>——9/11 APPEC 大会明确『中国暂不会调整成品油定价机制』，此前已出现『应涨 420 实际 250』的砍幅；③ <strong>炼厂自行承担飙升的航运风险溢价</strong>，APPEC 数据显示原油运费已创 <strong>162.16 美元/吨</strong>历史新高，成本由炼厂吸收。净效应：国际柴油越紧，A 股炼化越是<strong>成本抬升而售价受限</strong>。</div></div><div class=\"card fact\"><b class=\"k\">映射成立的环节</b><div class=\"v\">唯一映射成立的是<strong>运</strong>而非<strong>价</strong>：俄柴油出口减少 → 欧洲与亚洲被迫从更远来源进口 → <strong>吨海里需求增加</strong> → 成品油轮与原油轮运价上行。中银证券 9/15 交运周报标题即为『全球两大能源通道同时承压，<strong>VLCC 运价再创历史新高</strong>』。A 股对应标的中，招商南油主营构成<strong>成品油运输 52.40% + 原油运输 34.63%</strong>（2026 中报），是本链条上纯度最高的运价承接方。</div></div><div class=\"card fact warn\"><b class=\"k\">同夜反向信号</b><div class=\"v\">18:23 克里姆林宫称特朗普的能源停火提议『是个好主意』，并明确『<strong>如果制裁解除，全球能源价格将会下降</strong>』——这是俄方首次把『制裁解除』与『能源价格下降』直接挂钩。此前特朗普已公开要求泽连斯基停止袭击俄柴油设施（背景：美国柴油零售破 6 美元/加仑、中期选举临近、9 月秋收柴油需求高峰），泽连斯基表态对能源停火持开放态度，双方拟于 <strong>9 月下旬在纽约会面</strong>。同日美财政部将俄罗斯外贸银行列为制裁目标、欧盟将对俄制裁延长 7 天——<strong>制裁升级与停火倡议同时发生</strong>。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/15（上证 -0.54%）：油运独强——招商轮船 +2.50%（超额 +3.04pct，盘中最高 +6.00% 后回吐，振幅 7.75%、换手 2.15%、成交 35.73 亿）、中远海能 +0.72%（+1.26）、招商南油 +0.87%（+1.41，盘中最高 +3.06%，换手 3.65%、成交 7.93 亿、20 日 +24.86%）；上游分化——中国石油 +0.63%（+1.17）、中国海油 -1.36%（-0.82）、中海油服 -0.57%（-0.03）；炼化全绿且<strong>已连续多日下跌</strong>——中国石化 -1.49%（连跌 4 天累计 -5.88%）、恒力石化 -1.07%（5 日 -11.28%、年内 -25.04%）、荣盛石化 -1.06%（5 日 -9.87%）、上海石化 -1.06%、华锦股份 -0.74%（5 日 -12.20%）。<strong>商品端原油主力涨超 5% 而权益端炼化全绿</strong>，方向完全背离。结论：市场对『油价/裂解价差』已钝化，只对『吨海里』给出正超额。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-08 至 09-14</div><div><div class=\"x\">沙特能源设施遭袭、布油逼近 100（归档为 oil-hormuz）；9/11 沙特能源部宣布东西输油管道关闭、绕开霍尔木兹的陆上通道失效（归档为 saudi-east-west-pipeline）；9/14 伊朗革命卫队宣布霍尔木兹海峡已被封锁并处于『智能管控』之下，超级油轮『阿尔加亚』号触雷爆炸起火。</div><div class=\"y\">为什么：原油端的三段升级：风险溢价 → 绕行通道失效 → 海峡实际封锁。本档案是同一地缘冲突在<strong>成品油（炼能）端</strong>的独立延伸，与原油端互为验证。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-12</div><div><div class=\"x\">柴油裂解价差 112 美元创纪录，但中国自 3 月起停发成品油出口、发改委『应涨 420 实际 250』砍去四成（已归档为 diesel-crack-record）。</div><div class=\"y\">为什么：本档案的前段：已确立『海外成品油涨价 ≠ A 股炼化受益』的映射断裂。本段的新增信息是<strong>供给端被实物摧毁的程度首次被量化</strong>。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-15 17:42</div><div><div class=\"x\">财联社：据报道，<strong>俄罗斯约一半的顶级柴油生产工厂在遭无人机袭击后削减产量</strong>。</div><div class=\"y\">为什么：本段的成立点：从『裂解价差高』升级为『生产能力的物理减损』，且首次给出可量化的受损比例（约一半顶级柴油厂）。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-15 18:23</div><div><div class=\"x\">克里姆林宫表示，特朗普关于乌克兰能源目标停火的提议『是个好主意』；同时强调『即使炼油厂安全，也不能解决向全球市场运输的问题』，并称『如果制裁解除，全球能源价格将会下降』。此前特朗普已公开要求泽连斯基停止袭击俄罗斯柴油设施，泽连斯基表态对能源领域停火持开放态度，拟 9 月下旬在纽约会面。</div><div class=\"y\">为什么：<strong>本主线自 9/8 以来的第一个系统性反向变量</strong>：oil-hormuz、saudi-east-west-pipeline、oil-tanker-supercycle、diesel-crack-record 四份档案共同建立在『冲突持续或升级』的隐含前提上，此次政治层面的停火倡议为该前提提供了首次证伪路径。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这条链的<strong>分水岭</strong>不在价格而在<strong>物理产能</strong>：diesel-crack-record 那一段是『裂解价差 112 美元创纪录』——价差高只说明利润在炼厂，是价格现象；本段给出的是『约一半顶级柴油厂减产、42.7% 炼能瘫痪、391 万桶/日创 2005 年最低』——是<strong>生产能力的物理减损</strong>，性质从周期性紧张变为结构性短缺，修复需要的是重建而非调价。<strong>传导的关键约束</strong>是被刻意分开的两段：对海外，减产直接推高柴油价格（美国零售破 6 美元/加仑创历史新高即为实证）；对 A 股，这条传导被三道闸门切断——成品油出口禁令、发改委零售定价上限、以及由炼厂自担的 162.16 美元/吨创纪录运费。因此<strong>本链条在 A 股的受益环节只剩『运』，且必须是运距拉长带来的吨海里增量，而非运价本身的beta</strong>。这解释了 9/15 的链内排序：招商轮船 +3.04 超额、招商南油 +1.41、而中国石化 -0.95、恒力 -0.53。<strong>待验证的核心变量</strong>已经从『还会不会更缺』转向『会不会停火』——17:42 与 18:23 两条消息在 41 分钟内给出了相反答案，而 9 月下旬的纽约会面是双方第一次把能源停火摆上桌面。<strong>隐藏面</strong>在于俄方的表态结构：克宫一边说停火是好主意，一边补了一句『即使炼油厂安全，也不能解决向全球市场运输的问题』——这实际是把矛头指向<strong>制裁与航运</strong>而非炼能本身，意味着俄方要价是制裁解除，而这与美方『只要求停止袭击能源设施』的诉求并不等价，谈判的缺口恰恰在 A 股唯一受益的那个环节（航运）上。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>9/15 17:42 财联社：俄罗斯约一半顶级柴油生产工厂遭无人机袭击后削减产量</li><li>7 月俄炼能 42.7% 瘫痪、日均炼油 391 万桶创 2005 年最低；8 月单月 21 次袭击刷新月度纪录</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强·但分流</span><ul><li>海外端影响强：美国柴油零售破 6 美元/加仑创历史新高、WTI 101.39 / Brent 105.68，国内原油主力涨超 5%</li><li>A 股端影响分流：唯一成立的是吨海里增量（中银证券：VLCC 运价再创历史新高），油价与裂解价差弹性被三道闸门切断</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">分化</span><ul><li>运价端可直接兑现：招商南油成品油运输占主营 52.40%，2026H1 营收 +19.37%、归母净利 +42.41%</li><li>炼化端为负贡献：售价受发改委上限约束、成本受创纪录运费挤压，中国石化连跌 4 天、恒力 5 日 -11.28%</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">已按环节定价</span><ul><li>9/15 油运超额 +1.26 ~ +3.04pct、上游开采 -0.82 ~ +1.17pct、炼化 -0.20 ~ -0.95pct</li><li>商品端原油涨超 5% 与权益端炼化全绿方向背离，说明定价依据是『能否吃到涨价』而非『油价涨没涨』</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、海外影响强但 A 股端分流、业绩仅在运价环节兑现、股价已按环节完成排序——这是『同一催化在不同环节方向相反』的分化样本。</div>\n    <ul class=\"assess\"><li>闭合度 55%——四环中『影响』在 A 股端发生分流、『业绩』仅在油运环节为正，作为整体性题材不成立，只能作为<strong>环节级</strong>题材成立。</li><li>边界切分：<strong>受益方</strong>是成品油/原油运输（招商南油 52.40% 成品油运输、招商轮船 VLCC、中远海能外贸油运）；<strong>中性分化方</strong>是上游开采（中国石油 +1.17 超额、中国海油 -0.82）；<strong>明确受损方</strong>是纯炼化（中国石化、恒力、荣盛、上海石化、华锦）——它们既吃不到国际柴油涨价，又要承担 162.16 美元/吨的创纪录运费。<strong>不同链</strong>：中远海特（特种船，-2.20%）与煤炭/煤化工。</li><li>主线联动：本档案与 <strong>diesel-crack-record</strong> 是同一链条的第一段与第二段——前者确立『裂解价差创纪录但 A 股映射断裂』，本段把供给端升级为物理减损并首次量化（42.7%/391 万桶）；与 <strong>oil-hormuz</strong>、<strong>saudi-east-west-pipeline</strong> 构成同一地缘冲突在原油端与成品油端的双线验证；与 <strong>oil-tanker-supercycle</strong> 在受益环节上重合——本档案实际上是给该主线补充了『成品油（而非原油）侧的供给证据』。四份档案共享同一个证伪前提，因此 9/15 晚的停火倡议是对它们<strong>共同</strong>的首次系统性证伪变量。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>招商南油</b><span class=\"code\">601975</span><span class=\"tag\">9/15 +0.87%，盘中最高 +3.06%，换手 3.65%</span><span class=\"cap\">4.44 元 · 流通 208 亿 · 9/16 -3.90%</span></div>\n    <div class=\"logic\">成品油运输 52.40%·纯度最高</div>\n    <div class=\"detail\">招商局旗下油运平台，2026H1 主营构成<strong>成品油运输 52.40% + 原油运输 34.63%</strong>，是 A 股对『柴油/成品油海运运价』敞口最纯正的标的。俄柴油产能折半后，欧亚缺失的供应必须由更远来源补足，运距拉长带来的吨海里增量直接落到它的运价上——这是本催化在 A 股唯一未被出口禁令、定价上限、运费自担三道闸门切断的传导路径。2026H1 营收 +19.37%、归母净利 +42.41%，运价上行已在报表端兑现。9/15 换手 3.65%、成交 7.93 亿为链内最活跃。</div>\n    \n    \n    <div class=\"risk\">⚠️ 20 日已 +24.86%、年内 +54.36%，预期计入较多；停火落地导致运距缩短是最直接的反向</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>招商轮船</b><span class=\"code\">601872</span><span class=\"tag\">9/15 +2.50%，盘中最高 +6.00% 后回吐，成交 35.73 亿</span><span class=\"cap\">19.86 元 · 流通 1604 亿 · 9/16 -3.12%</span></div>\n    <div class=\"logic\">VLCC 龙头·主线指数锚</div>\n    <div class=\"detail\">VLCC 运力全球第一梯队，中银证券 9/15 周报『全球两大能源通道同时承压、VLCC 运价再创历史新高』的直接对标。它同时受益于原油端的海峡封锁与成品油端的运距拉长，是两个方向的交汇点，也是本主线容量最大的标的（1655 亿）。9/15 盘中最高 +6.00%、收盘 +2.50%，振幅 7.75%、换手 2.15%、成交 35.73 亿为全链最大——资金盘中完成一轮定价但回吐大半，属于<strong>高关注 + 承接不足</strong>的形态。年内 +134.82%、20 日 +14.02%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 运价已在历史高位；海峡重开或停火落地会让绕行溢价快速消失，回撤与上涨幅度对称</div>\n  </div></div><div class=\"t\">🏛️ 容量中军 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中国石油</b><span class=\"code\">601857</span><span class=\"tag\">9/15 +0.63%，超额 +1.17pct</span><span class=\"cap\">10.81 元 · 流通 1.75 万亿 · 9/16 -0.37%</span></div>\n    <div class=\"logic\">一体化央企·链内唯一收红的上游</div>\n    <div class=\"detail\">一体化结构中上游占比高，是本链条上唯一录得正超额的开采类标的（+1.17pct）。与纯上游的中国海油（-0.82pct）方向相反，说明<strong>市场在一体化与纯上游之间做了区分</strong>：一体化的炼化段亏损被上游段的油价弹性覆盖后仍为正，而纯上游因缺乏炼化对冲在油价钝化日反而跑输。这个分化本身就是『油价已经钝化』的证据——真正的油价弹性行情里，纯上游应强于一体化。</div>\n    \n    \n    <div class=\"risk\">⚠️ 2 万亿市值弹性温和；5 日 -1.68% 说明油价弹性并未持续兑现</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中国海油</b><span class=\"code\">600938</span><span class=\"tag\">9/15 -1.36%，超额 -0.82pct，5 日 -2.73%</span><span class=\"cap\">33.08 元 · 流通 989 亿 · 9/16 -1.11%</span></div>\n    <div class=\"logic\">纯上游·油价钝化的刻度</div>\n    <div class=\"detail\">A 股唯一纯上游油气标的，本应是最纯粹的油价弹性承接方，却在 WTI 破 100、国内原油主力涨超 5% 的当日收 -1.36%、5 日 -2.73%。这个背离是本档案<strong>最重要的证伪刻度</strong>：它证明市场对『油价破百』已经钝化，不再愿意为油价的地缘溢价支付权益端溢价——与 oil-hormuz 档案中『市场对升级已部分钝化』的判断一致，且钝化程度在加深。</div>\n    \n    \n    <div class=\"risk\">⚠️ 若地缘缓和，作为纯上游其溢价回吐最直接；1.6 万亿市值弹性温和</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中远海能</b><span class=\"code\">600026</span><span class=\"tag\">9/15 A 股 +0.72%、H 股 +0.71%，H 股年内 +101.35%</span><span class=\"cap\">20.72 元 · 流通 793 亿 · 9/16 -1.57% · A+H 两地上市</span></div>\n    <div class=\"logic\">外贸油运+LNG 双主业</div>\n    <div class=\"detail\">外贸油运与 LNG 双主业，是本链条上唯一有 A/H 双市场定价的样本：9/15 A 股 +0.72%、H 股 +0.71%，<strong>两地定价高度一致</strong>——这说明外资与内资对『运价受益、油价钝化』的裁决是一致的，不是单边资金行为。H 股年内 +101.35%、20 日 +21.38%，AH 溢价 -25.03%。它的双市场一致性使它成为验证本逻辑是否被普遍接受的<strong>交叉校验锚</strong>。</div>\n    \n    \n    <div class=\"risk\">⚠️ 海运周期波动极大；LNG 业务受独立长协定价影响，会稀释油运弹性</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中国石化</b><span class=\"code\">600028</span><span class=\"tag\">9/15 -1.49%，连跌 4 天累计 -5.88%</span><span class=\"cap\">5.21 元 · 流通 4931 亿 · 9/16 -1.51%</span></div>\n    <div class=\"logic\">受损方反向锚·政策定价的刻度</div>\n    <div class=\"detail\">本链条的<strong>反向刻度量具</strong>：柴油占其主营 18.16%，却因出口禁令（3 月起）、发改委零售定价上限（APPEC 9/11 明确『中国暂不会调整成品油定价机制』）、以及自担 162.16 美元/吨创纪录运费而成为受损方。9/15 -1.49%、连跌 4 天累计 -5.88%，与商品端原油主力涨超 5% 完全背离。它的<strong>超额何时转正</strong>，是判断『国内成品油定价机制是否向国际靠拢』的唯一客观信号——在此之前，任何『海外柴油涨价利好 A 股炼化』的叙事都不成立。</div>\n    \n    \n    <div class=\"risk\">⚠️ 作为央企红利股，股价受股息率与资金面影响大于产业催化；用作反向锚时需剔除红利资金干扰</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>华锦股份</b><span class=\"code\">000059</span><span class=\"tag\">9/15 -0.74%，换手 2.69% 为炼化链最高</span><span class=\"cap\">5.43 元 · 流通 87 亿 · 9/16 +0.56%</span></div>\n    <div class=\"logic\">炼化小盘·20 日 +17.14% 后 5 日 -12.20%</div>\n    <div class=\"detail\">兵器工业集团旗下炼化一体化，是本链条上<strong>波动最剧烈</strong>的样本：20 日 +17.14%、但 5 日 -12.20%，9/15 换手 2.69% 为炼化链最高。这个『先涨后回吐』的轨迹记录了一次完整的误读与证伪——市场曾按『油价上涨利好炼化』做过一轮，随后被定价上限与成本挤压的现实修正。它是观察市场是否会再次误读本条催化的<strong>高频温度计</strong>。</div>\n    \n    \n    <div class=\"risk\">⚠️ 市盈率 TTM 为负，业绩端处于亏损；86 亿小市值波动率高</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>上海石化</b><span class=\"code\">600688</span><span class=\"tag\">9/15 -1.06%，PB 1.26、市盈率 TTM 亏损</span><span class=\"cap\">2.80 元 · 流通 205 亿 · 9/16 +0.00%</span></div>\n    <div class=\"logic\">低价炼化票·破净</div>\n    <div class=\"detail\">2.80 元的低价炼化标的，AH 溢价 -65.79%，是炼化链中最易被情绪资金带动的品种。9/15 收 -1.06%、换手 0.63%。它在本链条上没有独立逻辑，价值在于作为<strong>情绪温度计</strong>：一旦出现『海外柴油涨价 → 买 A 股炼化』的条件反射式误读，这类低价破净票通常是首个被拉升的对象。9/15 它并未异动，说明误读尚未发生。</div>\n    <div class=\"gene\">🧬 题材基因：低价破净炼化票，历次油价题材中作为『补涨末端』出现，拉升快、持续性差，是判断题材是否进入情绪化阶段的标志</div>\n    \n    <div class=\"risk\">⚠️ 市盈率 TTM 为负，无业绩支撑；误读性反弹缺乏基本面承接</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>恒力石化</b><span class=\"code\">600346</span><span class=\"tag\">9/15 -1.07%，5 日 -11.28%，年内 -25.04%</span><span class=\"cap\">16.53 元 · 流通 1164 亿 · 9/16 -0.84%</span></div>\n    <div class=\"logic\">民营大炼化·受损最持续</div>\n    <div class=\"detail\">民营大炼化代表，是本链条上<strong>受损最持续</strong>的样本：9/15 -1.07%、5 日 -11.28%、20 日 -7.18%、年内 -25.04%。与华锦股份的『先涨后跌』不同，它是持续单边下跌，说明市场对『民营大炼化的成本暴露度最高、且无上游对冲』这一判断非常稳定。它提供了本链条最清晰的一个否证：在海外柴油供应被物理摧毁的同期，A 股最纯正的炼化资产年内跌去四分之一。</div>\n    <div class=\"gene\">🧬 题材基因：2021 年大炼化投产周期的核心标的，市场对『炼化一体化=抗周期』有记忆，但本轮成本结构下该记忆方向相反</div>\n    \n    <div class=\"risk\">⚠️ 高杠杆大炼化结构，油价高位与需求疲软同时存在时压力最大；年内已跌 25%，趋势尚未扭转</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2026-09-08 至 09-14（原油端）：沙特能源设施遭袭布油逼近 100 → 9/11 沙特东西管道关闭使唯一绕行通道失效 → 9/14 伊朗革命卫队宣布霍尔木兹海峡已被封锁、超级油轮『阿尔加亚』号触雷爆炸起火——同一冲突在原油端的三段升级，与本档案的成品油端互为验证</li><li>2026-09-11 APPEC 大会：原油运费创 162.16 美元/吨历史新高，炼厂自行承担飙升的航运风险溢价，政府对成品油零售涨价设置上限，中国明确暂不会调整成品油定价机制——本档案『映射断裂』的制度化依据</li><li>2026-09-12（前段）：柴油裂解价差 112 美元创纪录，但中国自 3 月起停发成品油出口、发改委『应涨 420 实际 250』砍去四成，已归档为 diesel-crack-record——本档案前段的结论在本段被进一步强化</li><li>2026-08-26 路透：卢克石油 NORSI 炼厂（俄第四大炼厂、柴油产能超 500 万吨/年）因无人机袭击起火停产，至此卢克石油所有主要炼厂全部停摆——本段『约一半顶级柴油厂减产』的前置证据</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>招商南油</b><span class=\"code\">601975</span><span class=\"tag\">成品油运输占主营 52.40%·A股纯度最高的运价承接方</span></div>\n    <div class=\"logic\">产业地位 | 弹性来源 | 约束条件：招商局旗下油运平台，2026H1 主营构成为成品油运输 52.40%、原油运输 34.63% | 俄柴油出口减少迫使欧洲/亚洲从更远来源进口，吨海里增量直接落到成品油轮运价 | 216 亿市值、年内已 +54.36%、20 日 +24.86%，价格已含较多预期</div>\n    <div class=\"detail\">本链条在 A 股<strong>唯一纯度够高的受益样本</strong>：成品油运输占主营 52.40%，是全部 A 股中直接对标『柴油/成品油海运运价』的少数标的之一。俄柴油产能折半后，欧洲与亚洲缺失的供应必须由更远的中东、印度、美国货源补足，运距拉长产生的<strong>吨海里增量</strong>直接转化为它的运价弹性——这是本催化在 A 股唯一未被闸门切断的传导路径。2026H1 营收 +19.37%、归母净利 +42.41%，运价上行已在报表端兑现。9/15 盘中最高 +3.06%、收 +0.87%（超额 +1.41pct），换手 3.65%、成交 7.93 亿，是链内资金最活跃的品种。约束：20 日已涨 24.86%，价格中已含较多运价预期。</div>\n    \n    <div class=\"confirm\">✔ 确认：成品油轮（MR/LR）TCE 运价续创新高 / 公司季度运价披露环比上行 / 招商轮船、中远海能同步走强形成板块效应</div>\n    <div class=\"risk\">⚠️ 若能源停火落地、俄成品油出口恢复，运距缩短将直接压缩吨海里，是受益逻辑最直接的反向</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>招商轮船</b><span class=\"code\">601872</span><span class=\"tag\">VLCC 全球第一梯队·主线指数锚与情绪龙</span></div>\n    <div class=\"logic\">产业地位 | 弹性来源 | 约束条件：VLCC 运力全球第一梯队，油运主线最大市值标的（1655 亿） | 中银证券 9/15 周报确认『VLCC 运价再创历史新高』，两条能源通道同时承压放大绕行需求 | 年内已 +134.82%，估值与预期均在高位；海峡重开则绕行溢价迅速消失</div>\n    <div class=\"detail\">本主线的<strong>指数锚与情绪龙</strong>：1655 亿市值、年内 +134.82%、20 日 +14.02%，VLCC 运力全球第一梯队。中银证券 9/15 交运周报直接以『全球两大能源通道同时承压、VLCC 运价再创历史新高』为题，是本段催化在卖方口径上的同步确认。9/15 它走出全链最有信息量的分时：<strong>盘中最高 +6.00%、收盘仅 +2.50%</strong>，振幅 7.75%、换手 2.15%、成交 35.73 亿为全链最大——资金在盘中完成了一轮定价但承接不足回吐大半。它的独特之处在于同时受益于原油端的海峡封锁与成品油端的运距拉长，是两个方向的交汇点。</div>\n    \n    <div class=\"confirm\">✔ 确认：VLCC-TCE 续创新高 / 相对上证超额扩大至 5pct 以上 / 油运主题进入涨停题材地图</div>\n    <div class=\"risk\">⚠️ 运价已在历史高位，进一步上行需要缺口持续；停火或海峡重开会让绕行溢价快速消失，回撤幅度与上涨幅度对称</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中国石化</b><span class=\"code\">600028</span><span class=\"tag\">受损方反向锚·定价是否转向的刻度</span></div>\n    <div class=\"logic\">产业地位 | 弹性来源 | 约束条件：国内最大炼化一体化企业，柴油占主营 18.16% | <strong>不</strong>受益于本催化：出口禁令 + 发改委零售上限 + 自担创纪录运费，三重挤压 | 6391 亿市值，走势更接近板块 beta 与红利属性，对催化的敏感度低于对政策定价机制的敏感度</div>\n    <div class=\"detail\">把它放进 coreLinks 不是因为受益，而是因为它是<strong>最好的反向刻度量具</strong>：国际柴油越紧张，它越是被『售价受限、成本抬升』双向挤压。9/15 它 -1.49%、<strong>连跌 4 天累计 -5.88%</strong>，与商品端原油主力涨超 5% 形成完全背离。这个背离本身就是市场对『中国成品油定价机制不会调整』（APPEC 9/11 明确表述）的定价结果。它的<strong>超额转正</strong>才代表市场开始相信国内成品油定价机制会向国际靠拢——在此之前，任何『海外柴油涨价利好 A 股炼化』的叙事都不成立。</div>\n    \n    <div class=\"confirm\">✔ 确认：发改委调整成品油定价机制或特别收益金 / 恢复成品油出口配额 / 公司披露炼油毛利环比改善</div>\n    <div class=\"risk\">⚠️ 作为央企红利股，其股价受股息率与资金面影响大于产业催化；用它做反向锚时须剔除红利资金干扰</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中海油服</b><span class=\"code\">601808</span><span class=\"tag\">二阶受益·资本开支传导</span></div>\n    <div class=\"logic\">油价高位维持后上游资本开支回升才传导到油服，时滞一层；9/15 -0.57%、5 日 -4.28%、年内 -10.60%</div>\n    <div class=\"detail\">属于二阶传导：需要油价高位维持并经资本开支决策一层才能落到订单。9/15 收 -0.57%、超额 -0.03pct，5 日 -4.28%、年内 -10.60%——市场完全没有给出油价弹性。它在本档案中的意义是<strong>证伪油价传导的标尺</strong>：连油服都不涨，说明市场对『油价能维持多久』本身持怀疑，这与同日出现的停火倡议方向一致。</div>\n    \n    \n    <div class=\"risk\">⚠️ 油价高位若仅维持一两个月则资本开支无法落地；停火落地则逻辑直接消失</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中远海特</b><span class=\"code\">600428</span><span class=\"tag\">不同链对照组·特种船运输</span></div>\n    <div class=\"logic\">主营特种船（重吊、半潜、汽车船），与本催化不同链；9/15 -2.20%、20 日 -8.27%，是油运强、特运弱的对照组</div>\n    <div class=\"detail\">作为<strong>不同链对照组</strong>存在：9/15 它 -2.20%（超额 -1.66pct）、20 日 -8.27%，而同日油运三只全部收红。这个分化证明当日资金买的是<strong>油运的特定逻辑</strong>而非『航运板块 beta』——如果只是航运板块行情，中远海特不应独立下跌。这条证据把招商轮船 +3.04 超额的归因收敛到油运本身。</div>\n    \n    \n    <div class=\"risk\">⚠️ 与本链条不同链，不能作为受益证据；特种船运价受全球工程物流需求驱动</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>纯炼化（中国石化/恒力/荣盛/上海石化/华锦）</b><span class=\"code\">600028/600346/002493/600688/000059</span></div>\n    <div class=\"logic\">三道闸门切断传导：① 中国自 3 月起停发成品油出口，国际柴油高价吃不到 ② 发改委对成品油零售价设上限，APPEC 9/11 明确『中国暂不会调整成品油定价机制』 ③ 炼厂自担 162.16 美元/吨的创纪录运费。<strong>海外柴油越紧，A 股炼化成本越高而售价越受限</strong>，是明确受损方而非受益方</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>纯上游开采（中国海油）</b><span class=\"code\">600938</span></div>\n    <div class=\"logic\">油价钝化的直接证据：WTI 破 100、国内原油主力涨超 5% 的当日，中国海油收 -1.36%、5 日 -2.73%。市场对油价的地缘溢价已不再支付权益端溢价</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中远海特</b><span class=\"code\">600428</span></div>\n    <div class=\"logic\">特种船运输（重吊、半潜、汽车船），与本催化不同链。9/15 -2.20%、20 日 -8.27%，是证明当日为『油运特定逻辑』而非『航运板块 beta』的对照组</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>煤炭/煤化工</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">不同链——本档案驱动是成品油供给的物理减损，与煤炭链的焦煤/动力煤逻辑无交集（参见 carbon-black-record 为煤焦链的独立样本）</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**供给冲击型**，但同夜出现反向的政治缓和变量。基准参照：2024 年俄炼厂遇袭行情，袭击频率下降后运价 3 周回吐 40%。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">招商南油 ＞ 招商轮船 ＞ 中国石化。排序理由：成品油轮（MR/LR）直接受益于俄柴油出口中断后的航线重构；VLCC 次之；中石化是炼化、属成本受损方，列为观察而非主攻。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">上海石化 ＞ 恒力石化。gene：炼化小盘在成品油紧张行情中常作为「价差扩大」叙事的情绪载体，但本档它们是成本受损方，属反向情绪票。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若 VLCC-TCE 与成品油轮运价继续创历史新高**且**9 月下旬纽约会面未达成能源停火 → 逻辑状态由「实物升级」升为「供给缺口持续」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① VLCC/MR/LR 运价下一期周报继续创历史新高 ② 招商轮船、招商南油相对上证正超额扩大至 3-5pct ③ 俄炼厂袭击频率维持或上升（当前 8 月 21 次/月）。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 9 月下旬纽约会面就能源设施停火达成一致、袭击频率显著下降 ② 制裁实际松动、俄成品油出口恢复、运价自历史高位回落 ③ 霍尔木兹重开。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">17:42「一半顶级柴油厂减产」和 18:23 克宫称停火提议「是个好主意」只隔 41 分钟——**情绪端升级、政治端缓和同时落地**。这是能源地缘四份档案共同前提的第一个系统性证伪变量。9/15 盘面已经分化：油运独强（招商轮船 +2.50%），炼化全绿（中石化连跌 4 天 -5.88%）。盯 9 月下旬纽约会面。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>情景推演</h2>\n    <div style=\"font-size:12px;color:var(--dim);margin-bottom:8px\">每个分支为可观察的条件树——触发条件兑现后的逻辑状态与验证信号，互斥且可证伪。不含操作建议。</div>\n    <div class=\"scen\"><div class=\"sc\"><div class=\"br\">▸ 袭击延续·吨海里继续扩张</div><div class=\"tg\">触发：<b>俄柴油出口禁令 9 月底后继续延长 / 俄炼能瘫痪比例维持 40% 以上 / 9 月下旬纽约会面未达成能源停火 / VLCC 与成品油轮 TCE 续创新高</b></div><div class=\"ls\">逻辑状态：<b>供给的物理减损被确认为结构性而非周期性，修复需要重建而非调价。A 股的受益继续集中在『运』：吨海里增量确定性最高，油运维持正超额；油价端继续钝化（纯上游中国海油负超额的状态延续）；炼化因成本与售价双向挤压继续负超额——链内分化格局被强化而非收敛</b></div><div class=\"fs\">观察信号：<b>招商轮船、招商南油超额扩大至 3-5pct / 油运主题进入涨停题材地图 / 中远海能 A/H 双市场同步走强</b></div></div><div class=\"sc\"><div class=\"br\">▸ 能源停火落地·运价逻辑反转</div><div class=\"tg\">触发：<b>9 月下旬纽约会面就能源设施停火达成一致 / 俄炼厂袭击频率显著下降 / 制裁出现松动 / 俄成品油出口恢复</b></div><div class=\"ls\">逻辑状态：<b>本主线自 9/8 以来第一次出现<strong>前提级证伪</strong>：oil-hormuz、saudi-east-west-pipeline、oil-tanker-supercycle、diesel-crack-record 与本档案共同依赖的『冲突持续或升级』前提被解除。运距缩短直接压缩吨海里，油运是受益逻辑反转最直接的环节；同时炼化的成本压力缓解、负超额收敛——链内排序<strong>整体逆转</strong></b></div><div class=\"fs\">观察信号：<b>招商轮船、招商南油超额转负 / 中远海能 A/H 同步走弱 / 中国石化等炼化股负超额收窄甚至转正</b></div></div><div class=\"sc\"><div class=\"br\">▸ 僵持·链内分化固化</div><div class=\"tg\">触发：<b>停火谈判反复但无实质进展 / 俄炼能维持 30-40% 瘫痪 / 布油在 95-110 区间震荡 / 运价高位横盘</b></div><div class=\"ls\">逻辑状态：<b>两条叙事均未胜出，A 股维持当前的结构性裁决：油运温和正超额、上游开采零附近波动、炼化持续负超额。主题无法形成板块效应，只在个别标的上体现——这实际上是 9/15 盘面状态的延续</b></div><div class=\"fs\">观察信号：<b>招商轮船维持 1-3pct 正超额而中国石化、恒力石化负超额继续扩大 / 油运持续缺席涨停题材地图但个股不跌 / 商品端原油强于权益端油气股的背离持续</b></div></div><div class=\"sc\"><div class=\"br\">▸ 定价机制调整·映射修复</div><div class=\"tg\">触发：<b>发改委调整成品油定价机制或特别收益金 / 恢复成品油出口配额 / 官方释放定价市场化信号</b></div><div class=\"ls\">逻辑状态：<b>本档案『映射断裂』的制度性前提被移除——这是唯一能让 A 股炼化重新吃到本地柴油价值的路径。届时中国石化等反向锚的超额转正，炼化从受损方转为受益方，本档案与 diesel-crack-record 的核心结论同时失效</b></div><div class=\"fs\">观察信号：<b>中国石化相对上证超额转正并持续 / 恒力石化、荣盛石化同步走强 / 炼化主题进入涨停题材地图</b></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>VLCC-TCE 与成品油轮（MR/LR）运价继续创历史新高，中银证券口径的『VLCC 运价再创历史新高』在下一期周报中被延续确认</b></li><li><b>招商轮船、招商南油相对上证正超额扩大至 3-5pct 以上，且油运主题首次进入涨停题材地图</b></li><li><b>俄罗斯柴油出口禁令在 9 月底到期后<strong>继续延长</strong>，或俄方宣布更多炼厂停产</b></li><li><b>美国柴油零售价站稳 6 美元/加仑上方并续创新高（EIA 周度数据）</b></li><li><b>9 月下旬纽约会面<strong>未</strong>就能源停火达成一致，或达成后袭击仍在继续</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>9 月下旬特朗普与泽连斯基纽约会面就能源设施停火达成一致，俄炼厂袭击频率显著下降（当前为 8 月 21 次/月）</b></li><li><b>俄方兑现『制裁解除 → 能源价格下降』表述，制裁实际松动、俄成品油出口恢复，VLCC 与成品油轮运价自历史高位回落</b></li><li><b>俄罗斯柴油出口禁令在 9 月底到期后不再延长，俄炼能修复进度快于预期（42.7% 瘫痪比例明显下降）</b></li><li><b>霍尔木兹海峡实际重开或沙特东西管道复产——这将同时证伪 oil-hormuz、saudi-east-west-pipeline 与本档案的共同前提</b></li><li><b>招商轮船、招商南油超额转负且中远海能 A/H 同步走弱——双市场一致转弱说明运价逻辑被普遍放弃</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">9 月下旬</div><div class=\"wh\">特朗普与泽连斯基纽约会面是否就能源设施停火达成一致，以及俄方对『制裁解除』的具体要价</div><div class=\"wy\">这是本主线自 9/8 以来第一个系统性反向变量，直接决定四份能源地缘档案的共同前提是否成立</div></div><div class=\"tkc\"><div class=\"w\">9 月底</div><div class=\"wh\">俄罗斯柴油出口禁令是否继续延长（当前已延至 9 月底）</div><div class=\"wy\">禁令延续是本段逻辑的最直接支撑；不再延长则供给紧张叙事立即松动</div></div><div class=\"tkc\"><div class=\"w\">每月初</div><div class=\"wh\">俄罗斯炼能瘫痪比例与日均炼油量（当前 42.7%、391 万桶/日）</div><div class=\"wy\">物理减损的量化口径，区别于价格现象——是判断『结构性短缺 vs 周期性紧张』的判据</div></div><div class=\"tkc\"><div class=\"w\">周度</div><div class=\"wh\">VLCC-TCE、成品油轮（MR/LR）运价、EIA 美国柴油零售价、原油运费（当前 162.16 美元/吨历史新高）</div><div class=\"wy\">运价是 A 股唯一成立的受益环节的价格锚；柴油零售价是海外端紧张的实证；原油运费是炼化成本挤压的直接来源</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">中国成品油出口配额与定价机制的任何官方表述</div><div class=\"wy\">它决定了本档案『映射断裂』是暂时的还是制度性的，是唯一能让炼化重新受益的变量</div></div></div>\n\n    <div class=\"src\">数据来源：财联社 9/15 17:42 快讯（俄约一半顶级柴油厂减产）· 克里姆林宫 9/15 18:23 表态（能源停火提议、制裁解除与能源价格）· IEA 煤炭/能源统计与路透 8/26（卢克石油 NORSI 停产、俄炼能 42.7% 瘫痪、391 万桶/日创 2005 年最低、8 月 21 次袭击）· 中银证券 9/15 交通运输行业周报（VLCC 运价再创历史新高）· APPEC 大会 9/11（原油运费 162.16 美元/吨历史新高、中国暂不调整成品油定价机制）· 东方财富 7×24 9/15 02:33（WTI 101.39 / Brent 105.68）与 15:00 商品期货收盘 · 招商南油 2026 中报主营构成 · 各标的 9/15 行情数据 · 本工作区 out/fupan_20260915.json</div>\n    <footer>俄柴油产能折半 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "europe-gas-squeeze", "title": "欧洲气价创 2022 年末新高", "date": "2026-09-14", "grade": "正式档", "pricing": "未定价", "crate": "bolt", "search": "欧洲气价创 2022 年末新高 ttf 盘中 84.50 欧元/兆瓦时 · 欧盟储气率仅 68%、低于五年均值近 17 个百分点 · iea 测算今冬全球 lng 或减少逾 200 亿立方米 地缘冲突 ⚡ 供给冲击型 · 海外创纪录、a 股映射断裂且按成本受损定价", "card": "<a class=\"card-c\" href=\"#europe-gas-squeeze\" data-search=\"欧洲气价创 2022 年末新高 ttf 盘中 84.50 欧元/兆瓦时 · 欧盟储气率仅 68%、低于五年均值近 17 个百分点 · iea 测算今冬全球 lng 或减少逾 200 亿立方米 地缘冲突 能源地缘·中东供断与成品油 未定价 宝丰能源 华鲁恒升 中集集团 新奥股份 富瑞特装\" data-grade=\"正式档\" data-pricing=\"未定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-14</span>\n    <span class=\"crate bolt\">⚡ 供给冲击型 · 海外创纪录、A 股映射断裂且按成本受损定价 地缘冲突</span>\n  </div>\n  <div class=\"ctitle\">欧洲气价创 2022 年末新高</div>\n  <div class=\"csub\">TTF 盘中 84.50 欧元/兆瓦时 · 欧盟储气率仅 68%、低于五年均值近 17 个百分点 · IEA 测算今冬全球 LNG 或减少逾 200 亿立方米</div>\n  <div class=\"cpos\">TTF 盘中 84.50 欧元/兆瓦时创 2022 年末新高，欧盟储气率仅 68%（低于五年均值 17pct）；A 股按成本受损定价，仅成本剪刀差受益。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">能源地缘·中东供断与成品油</span>\n    \n    <span class=\"chip pri\">未定价</span>\n    <span class=\"chip\">标的 11</span>\n    <span class=\"nm\">宝丰能源</span><span class=\"nm\">华鲁恒升</span><span class=\"nm\">中集集团</span><span class=\"nm\">新奥股份</span><span class=\"nm\">富瑞特装</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-14 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-14</div>\n    <h1>欧洲气价创 2022 年末新高</h1>\n    <div class=\"sub\">TTF 盘中 84.50 欧元/兆瓦时 · 欧盟储气率仅 68%、低于五年均值近 17 个百分点 · IEA 测算今冬全球 LNG 或减少逾 200 亿立方米</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 供给冲击型 · 海外创纪录、A 股映射断裂且按成本受损定价</span>\n      <span class=\"badge neutral\">地缘冲突</span>\n      <span class=\"badge neutral\">定价状态：未定价</span>\n      <span class=\"badge neutral\">主线：能源地缘·中东供断与成品油</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">diesel-crack-record</span><span class=\"tag\" style=\"margin-right:4px\">oil-hormuz</span><span class=\"tag\" style=\"margin-right:4px\">oil-tanker-supercycle</span><span class=\"tag\" style=\"margin-right:4px\">russia-diesel-outage</span><span class=\"tag\" style=\"margin-right:4px\">saudi-east-west-pipeline</span></div>\n    <div class=\"posnote\">TTF 盘中 84.50 欧元/兆瓦时创 2022 年末新高，欧盟储气率仅 68%（低于五年均值 17pct）；A 股按成本受损定价，仅成本剪刀差受益。</div>\n    <details class=\"more\"><summary>展开定价状态详版（522 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化发生在 9/14 欧洲盘（伦敦/阿姆斯特丹开盘即跳涨 5-6%），A 股同日交易但<strong>未形成任何天然气主题</strong>。<strong>盘面状态</strong>：9/14 上证 -0.07%、深证 -0.64%、创业板 -1.10%。A 股天然气链<strong>整体走弱且内部分化</strong>——城燃中贵州燃气 <strong>-2.94%</strong>（换手 6.44%，全链最高）、新奥股份 -1.26%、皖天然气 -0.52%、蓝天燃气 -0.58%、九丰能源 -0.46%，而深圳燃气 +0.93%、新天然气 +0.76%、佛燃能源 +0.35%、成都燃气 +0.34% 收红；气头氮肥全线走弱（六国化工 -3.55%、阳煤化工 -2.26%、湖北宜化 -1.81%、四川美丰 -1.08%）；煤头一体化相对抗跌（鲁西化工 +0.08%、宝丰能源 0.00%、华鲁恒升 -0.70%）。当日涨停题材地图 12 个主题中<strong>无天然气相关题材</strong>。结论：A 股完全没有把「欧洲气价创 2022 年末以来新高」当作一个可交易事件，且在局部按「气源成本上升=城燃受损」做了反向定价。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">9/14 欧洲与英国基准天然气价格盘中冲至 <strong>2022 年末以来最高</strong>：荷兰 TTF 近月合约单日跳涨逾 4 欧元、盘中触及 <strong>84.50 欧元/兆瓦时</strong>（2022 年 12 月 22 日以来最高），收报 83.97 欧元；英国 NBP 近月上涨逾 10 便士至 <strong>208.90 便士/色姆</strong>（2022 年 12 月 23 日以来最高）。这是 TTF 连续第五周上涨后的加速，且价格已超过 2023 年 1 月欧洲第一个「无俄管道气冬天」的水平。</div></div><div class=\"card fact\"><b class=\"k\">库存垫变薄</b><div class=\"v\">欧盟地下储气设施充盈率仅约 <strong>68%</strong>，较历史同期季节性均值低约 <strong>17 个百分点</strong>（另一口径为低于五年均值 20%、折合近 <strong>170 亿立方米</strong>），正滑向 <strong>2013 年以来最低填充率</strong>。对照：2025 年同期为 82%、五年均值在 80% 以上。荷兰上周已把冬季储气目标<strong>下调至 64%</strong> 以减轻供应商压力——下调目标本身即是缓冲不足的承认。同时挪威处于检修季，压制管道供应与 LNG 外送。</div></div><div class=\"card fact\"><b class=\"k\">供给端三重挤压</b><div class=\"v\">①<strong>卡塔尔 LNG 受威胁</strong>：霍尔木兹海峡的 LNG 油轮通行已降至「涓流」级别，而卡塔尔占全球灵活 LNG 供应量的显著份额；②<strong>红海替代路线受限</strong>：胡塞武装推进至红海航道附近并对区域管道设施发动新袭击，改道空间被严重压缩；③<strong>挪威检修季</strong>叠加欧洲本地 LNG 外送受限。三者同时发生，IEA 据此测算若海峡持续封闭，<strong>今冬全球 LNG 供应或减少逾 200 亿立方米</strong>，而管道气增产弹性有限。</div></div><div class=\"card fact\"><b class=\"k\">价格的外溢印证</b><div class=\"v\">气价与油价同日共振：布伦特原油同期再涨约 3% 至 108-112 美元/桶区间（见 saudi-east-west-pipeline 档案）。<strong>亚洲现货 LNG 价格上周已涨至 2022 年以来最高</strong>——这说明这不是欧洲的局部问题，而是欧亚两大买家在同一时间争夺同一批货。Saxo 大宗策略主管 Ole Hansen 指出， disruption 已迫使欧洲与亚洲买家更激进地争抢替代货源，把欧洲天然气推到 <strong>140 美元/桶油当量以上</strong>。欧洲碳市场基准合约同步走高至 87.13 欧元/吨。</div></div><div class=\"card fact\"><b class=\"k\">宏观二次效应</b><div class=\"v\">欧洲央行上周四已将存款便利利率上调 25 个基点至 <strong>2.50%</strong>。能源投入成本飙升紧随加息而来，滞胀压力显著加剧；货币市场定价已反映「法兰克福与华盛顿的央行都可能被迫把紧缩政策维持到明年」的预期。伯恩斯坦同日警告油价若冲 120-150 美元将进一步推高通胀、增加主要央行维持紧缩的风险。这构成了本档案对 A 股的<strong>间接但更现实的传导路径</strong>：海外紧缩延长 → 全球风险偏好与估值承压。</div></div><div class=\"card fact warn\"><b class=\"k\">争议点</b><div class=\"v\"><strong>①驱动是地缘而非实物断供。</strong>欧洲当前并未出现俄乌时期那种物理断供，价格上涨主要来自「预期 + 极低库存」的放大，若外交取得进展（阿曼会议重启）溢价回吐速度会很快。<strong>②入冬前仍有补库窗口。</strong>9 月中到 10 月底理论上还有约六周注气期，储气率存在追平的可能。<strong>③中国敞口与欧洲不同源。</strong>中国 LNG 进口以长协为主、且已增购俄罗斯海运原油与管道气对冲，欧洲气价与亚洲现货的上涨对中国到岸成本的传导被长协结构大幅削弱——这是本档案 A 股映射弱的根本原因。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/14 上证 -0.07%、深证 -0.64%、创业板 -1.10%。A 股天然气链<strong>整体走弱、内部分化，且无一只进入涨停题材地图</strong>：<strong>城燃</strong>——贵州燃气 -2.94%（换手 6.44%，全链最高）、新奥股份 -1.26%、皖天然气 -0.52%、蓝天燃气 -0.58%、九丰能源 -0.46%，但深圳燃气 +0.93%、新天然气 +0.76%、佛燃能源 +0.35%、成都燃气 +0.34% 收红；<strong>气头氮肥</strong>——六国化工 -3.55%、阳煤化工 -2.26%、湖北宜化 -1.81%、四川美丰 -1.08%、云天化 -1.02%；<strong>煤头一体化</strong>——鲁西化工 +0.08%、宝丰能源 0.00%、华鲁恒升 -0.70%；<strong>装备</strong>——蜀道装备 +0.57%、中集集团 +0.55%、富瑞特装 -0.45%、兰石重装 -1.98%、杭氧股份 -5.68%。<strong>链内排序：煤头一体化 ＞ 大型城燃 ＞ 区域城燃/气头氮肥</strong>——市场在按「气源成本暴露度」排序，把气价上涨整体读作成本项而非收入项，与欧洲市场的定价方向完全相反。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-14 08:15 GMT</div><div><div class=\"x\">荷兰 TTF 近月合约报 <strong>83.97 欧元/兆瓦时</strong>（+4.45），盘中触及 <strong>84.50 欧元</strong>——2022 年 12 月 22 日以来最高；英国 NBP 近月报 <strong>208.90 便士/色姆</strong>（+10.64），2022 年 12 月 23 日以来最高。双双突破关键心理关口（TTF 已超 2023 年 1 月「第一个无俄管道气冬天」的水平）。</div><div class=\"y\">为什么：本档案的起点：价格创近四年新高的同时，驱动从「俄乌断供」换成了「中东航道受阻+极低库存」，是可比但不同源的一次供给冲击。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-14（JERA 警告）</div><div><div class=\"x\">日本最大发电企业、全球最大 LNG 买家之一 JERA 全球 CEO 加仁幸雄警告：欧洲天然气储备水平仍然偏低，霍尔木兹海峡的航运中断可能持续相当长时间。</div><div class=\"y\">为什么：最大买家公开表达「中断长期化」预期，等于为冬季前的抢货竞争定调——这是价格预期从「短期脉冲」转向「持续紧缺」的关键表态。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-14（IEA 测算）</div><div><div class=\"x\">国际能源署天然气分析师 Gergely Molnar 测算：若霍尔木兹持续封闭，<strong>今冬全球 LNG 供应或减少逾 200 亿立方米</strong>，而管道气增产弹性相当有限。</div><div class=\"y\">为什么：把地缘事件转成了可量化、可证伪的供给缺口数字——这是本档案「有精确数字」判据的核心支撑。</div></div></div><div class=\"u\"><div class=\"w\">2026 年 8 月（库存背景）</div><div><div class=\"x\">欧盟地下储气率约 68%（GIE 口径），较五年同期均值低约 17 个百分点、折合<strong>近 170 亿立方米</strong>，正滑向 <strong>2013 年以来最低填充率</strong>；荷兰上周已把冬季储气目标下调至 64%。挪威检修季同时压制供应与 LNG 外送；亚洲现货 LNG 上周已涨至 2022 年以来最高。</div><div class=\"y\">为什么：库存缓冲是能源供给冲击的「吸收垫」，垫子变薄意味着同等冲击下的价格弹性被系统性放大——这是本轮与 2022 年那轮最关键的差异。</div></div></div><div class=\"u\"><div class=\"w\">待定</div><div><div class=\"x\">GIE 每周储气率数据 / 欧洲今冬气温 / 沙特东西管道与霍尔木兹通行状态 / 卡塔尔 LNG 出口实际受影响程度。</div><div class=\"y\">为什么：本档案的分水岭：储气率能否在入冬前追平均值、以及 200 亿立方米的缺口是否被实际兑现，是唯一能证实或证伪的客观信号。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是<strong>供给冲击型</strong>催化，但它的特殊性在于<strong>A 股没有直接受益方</strong>——这是本档案最大的价值所在。三个要害：①<strong>分水岭时点</strong>是 GIE 每周储气率与入冬气温，若 68% 能在 10 月底前追平五年均值，「库存垫变薄」这条最硬的支撑就消失；反之若继续滑向 2013 年以来最低，200 亿立方米的缺口会落到实物争夺上。②<strong>传导的关键约束</strong>是中国天然气定价与进口结构——国内气价受管制、进口以长协为主（中俄、中亚管道+长协 LNG），欧洲与亚洲现货的上涨对中国到岸成本的传导被结构性削弱，所以「海外气价创新高」在 A 股<strong>不能简单映射为燃气股受益</strong>；城燃的顺价机制决定了气源成本上升在短期内是毛利压缩而非收入改善。③<strong>待验证的核心变量</strong>是「成本剪刀差」能否兑现——海外气头化工（合成氨、甲醇、烯烃）成本随气价抬升，而中国煤头路线成本与煤价挂钩、与海外气价脱钩，这条剪刀差是唯一客观存在的正向映射，但它体现为出口替代与进口替代的份额变化，兑现慢且难以在单季报表中读出。<strong>隐藏面</strong>：9/14 的盘面把这条逻辑shows得很清楚——煤头一体化（鲁西 +0.08%、宝丰 0.00%）明显强于气头氮肥（六国 -3.55%、阳煤 -2.26%、宜化 -1.81%），说明市场已经在按成本暴露度排序，只是<strong>它把这个排序用在了「谁受损」而不是「谁受益」上</strong>；同时贵州燃气以 6.44% 的全链最高换手收 -2.94%，说明情绪资金认得这个题材的「基因」（2017-2018 气荒龙头）却没能形成合力——这是「基因与逻辑分离」的典型样本。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>TTF 盘中 84.50 欧元/兆瓦时、NBP 208.90 便士，均为 2022 年 12 月下旬以来最高</li><li>欧盟储气率 68%，低于五年均值近 17 个百分点（约 170 亿立方米）</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强但间接</span><ul><li>IEA 测算今冬全球 LNG 供应或减少逾 200 亿立方米，管道气增产弹性有限</li><li>亚洲现货 LNG 同步涨至 2022 年以来最高，欧亚争夺同一批货</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">映射断裂</span><ul><li>中国长协为主的进口结构削弱成本传导，A 股无直接量价受益方</li><li>唯一正向路径是煤头 vs 海外气头的成本剪刀差，体现为份额变化、难在单季报表读出</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">反向定价</span><ul><li>9/14 天然气链整体走弱，涨停题材地图无天然气主题</li><li>煤头一体化强于气头氮肥，市场按「谁受损」而非「谁受益」排序</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强但间接、业绩映射断裂、股价反向定价——这是一份以「划清边界」而非「找受益股」为核心价值的档案。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>45%</strong>：四环中「业绩」与「股价」两环同时断裂，是本档案库里闭合度最低的一份——这正是它的价值：明确记录「海外能源涨价 ≠ A 股燃气股受益」这一反直觉结论，避免下次重复误判。</li><li><strong>边界必须切开</strong>：①<strong>受损方</strong>——城燃（新奥、贵州燃气、皖天然气等，气源成本上升而顺价滞后）、气头氮肥与气头化工（湖北宜化、四川美丰、云天化，化肥用气市场化程度提高后成本压力上行）；②<strong>中性偏正</strong>——煤头一体化（宝丰能源、华鲁恒升、鲁西化工，成本与海外气价脱钩，享受相对成本优势，但这是「份额」而非「价格」逻辑）；③<strong>二阶受益</strong>——LNG 装备与储运（中集集团、富瑞特装、蜀道装备，受益于全球 LNG 基础设施投资加码，但订单兑现周期以年计，与气价短期脉冲无关）；④<strong>不同链</strong>——杭氧股份（工业气体，与民用天然气定价机制完全不同，9/14 -5.68% 属个股层面因素，不可混为一谈）。</li><li><strong>主线联动</strong>：与 <strong>saudi-east-west-pipeline</strong>（同日归档）同源——霍尔木兹受阻既切断沙特原油绕行通道，也把卡塔尔 LNG 通行压至涓流，两者是同一地缘事件在原油与天然气两个品种上的投影；与 <strong>oil-hormuz</strong> 构成该主线的第一、二段；与 <strong>oil-tanker-supercycle</strong> 共享受益逻辑的另一支——LNG 运输需求上升与原油绕行吨海里拉长同时推高能源航运景气，招商轮船的 LNG 船队是两条支线的交汇点。若阿曼会议重启、海峡通行恢复，本档案与上述三份档案的「供给硬缺口」环将<strong>同步</strong>走弱，这是整条主线的公共证伪信号。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·成本剪刀差 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>宝丰能源</b><span class=\"code\">600989</span><span class=\"tag\">煤制烯烃·9/14 收 0.00%</span><span class=\"cap\">24.06 元 · 流通 1764 亿 · 9/16 -1.64%</span></div>\n    <div class=\"logic\">总市值 1758 亿·成本与海外气价完全脱钩</div>\n    <div class=\"detail\">本档案逻辑边界最清晰的正向样本：成本锚定国内煤价与自备电力，与 TTF/亚洲现货 LNG 脱钩；海外气头化工成本曲线被系统性抬升，剪刀差扩大后中国在出口与进口替代上获得份额。但这是份额逻辑而非价格逻辑——国内产品不会因海外气价上涨自动提价。9/14 收平，在气头氮肥全线杀跌的对照下，持平本身即是排序的体现。</div>\n    \n    \n    <div class=\"risk\">⚠️ 兑现为份额变化、单季难读出；煤价若同步上行则剪刀差消失</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>华鲁恒升</b><span class=\"code\">600426</span><span class=\"tag\">煤气化平台·9/14 -0.70%</span><span class=\"cap\">19.73 元 · 流通 542 亿 · 9/16 -0.65%</span></div>\n    <div class=\"logic\">总市值 543 亿·产品矩阵最宽、柔性调节</div>\n    <div class=\"detail\">以煤气化为核心，覆盖尿素、DMF、醋酸、己二酸等，可按各品种相对盈利动态调节产出。在天然气线上它的关键位置是煤头尿素对气头尿素的替代——国际尿素报价随海外气头成本上行，而它成本锚定煤价，毛利差扩大。9/14 跌幅显著小于气头尿素（四川美丰 -1.08%、湖北宜化 -1.81%）。</div>\n    \n    \n    <div class=\"risk\">⚠️ 尿素出口法检约束下，国际报价上行未必转为出口量</div>\n  </div></div><div class=\"t\">🏛️ 容量中军 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中集集团</b><span class=\"code\">000039</span><span class=\"tag\">LNG 能源装备全球承接方·9/14 +0.55%</span><span class=\"cap\">9.05 元 · 流通 208 亿 · 9/16 -0.44%</span></div>\n    <div class=\"logic\">总市值 497 亿·投资端而非价格端</div>\n    <div class=\"detail\">唯一处在「投资端」而非「价格端」的标的：全球 LNG 供应链重构会转化为储罐、罐箱、液化模块、接收站设备的实际订单，不依赖气价在某个价位维持，而依赖基础设施投资持续时间。全球份额与交付能力是它的护城河。但它是二阶、长周期的——订单兑现以年计，与 9/14 气价单日跳涨 5% 无直接关系。「容量中军」属性来自 497 亿市值与全球订单承接能力，是这条支线能否被机构资金定价的刻度。</div>\n    \n    \n    <div class=\"risk\">⚠️ 订单周期长，短期业绩弹性小；集装箱业务稀释纯度</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>新奥股份</b><span class=\"code\">600803</span><span class=\"tag\">全国性城燃龙头·9/14 -1.26%</span><span class=\"cap\">18.83 元 · 流通 578 亿 · 9/16 +0.59%</span></div>\n    <div class=\"logic\">总市值 581 亿·本轮的成本受损方刻度</div>\n    <div class=\"detail\">把它放进「容量中军」不是因为它受益，恰恰相反——它是<strong>本轮成本受损方最标准的刻度</strong>：全国性城燃龙头、气源结构中外采比例高、顺价机制存在时滞，气价上行直接压缩城燃毛差。581 亿市值与行业代表性意味着，若连它都持续负超额，就说明市场把气价上涨整体读作成本项。「容量中军」在这里的作用是<strong>反向锚</strong>：它的超额收益转正，才代表市场开始按「气价上涨=收入改善」重新定价。</div>\n    \n    \n    <div class=\"risk\">⚠️ 顺价时滞下毛差承压；作为受损方不具备向上弹性</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>富瑞特装</b><span class=\"code\">300228</span><span class=\"tag\">LNG 装备纯度最高·9/14 -0.45%</span><span class=\"cap\">6.68 元 · 流通 37 亿 · 9/16 +1.67%</span></div>\n    <div class=\"logic\">总市值 40 亿·订单弹性大但波动大</div>\n    <div class=\"detail\">A 股 LNG 装备里业务纯度最高的标的之一，覆盖 LNG 车用气瓶、小型液化装置与储罐。相比中集集团能源装备占比更高、映射更纯，但 40 亿市值意味着年度订单波动会直接放大为业绩与股价波动。9/14 未见主题资金介入。</div>\n    \n    \n    <div class=\"risk\">⚠️ 市值小、订单不连续，历史业绩波动极大</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>蜀道装备</b><span class=\"code\">300540</span><span class=\"tag\">深冷分离设备·9/14 +0.57%</span><span class=\"cap\">26.90 元 · 流通 56 亿 · 9/16 +1.55%</span></div>\n    <div class=\"logic\">总市值 60 亿·天然气链涨幅居前</div>\n    <div class=\"detail\">深冷设备与气体分离装置供应商，受益路径类似富瑞特装但更偏工程与设备集成。9/14 收 +0.57%，是天然气链涨幅居前品种，但成交额有限，属低位承接而非主题驱动。</div>\n    \n    \n    <div class=\"risk\">⚠️ 工程类收入确认节奏受项目进度影响大</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>新天然气</b><span class=\"code\">603393</span><span class=\"tag\">带上游气源的城燃·9/14 +0.76%</span><span class=\"cap\">25.57 元 · 流通 108 亿 · 9/16 -0.04%</span></div>\n    <div class=\"logic\">总市值 112 亿·自有煤层气部分对冲成本</div>\n    <div class=\"detail\">城燃板块里少见的有上游结构——控股煤层气资产使气源成本部分内部化，气价上行期相对纯分销型城燃受损更小。9/14 在城燃普遍走弱时收红，可能反映这一结构差异。但区域集中度高、全国化扩张能力有限。</div>\n    \n    \n    <div class=\"risk\">⚠️ 区域性强；上游产量规模小，对冲作用有限</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>皖天然气</b><span class=\"code\">603689</span><span class=\"tag\">区域城燃·9/14 -0.52%</span><span class=\"cap\">7.66 元 · 流通 40 亿 · 9/16 +0.39%</span></div>\n    <div class=\"logic\">总市值 40 亿·换手 0.71%</div>\n    <div class=\"detail\">安徽省域燃气分销商，市值 40 亿属小盘。历史上在多轮天然气涨价行情中均为后排跟风，从未独立走出趋势——这与它缺乏上游资产、纯分销受成本挤压的结构一致。9/14 收 -0.52%、换手仅 0.71%，无资金介入迹象。</div>\n    <div class=\"gene\">🧬 题材基因：安徽省域燃气分销，历次天然气涨价行情中属后排跟风品种，从未独立走出趋势</div>\n    \n    <div class=\"risk\">⚠️ 纯分销结构，气价上行对它是成本而非收入</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>蓝天燃气</b><span class=\"code\">605368</span><span class=\"tag\">河南区域城燃·9/14 -0.58%</span><span class=\"cap\">6.72 元 · 流通 48 亿 · 9/16 +0.30%</span></div>\n    <div class=\"logic\">总市值 49 亿·换手 0.41%</div>\n    <div class=\"detail\">河南省域燃气运营商，市值 49 亿。2021-2022 年气价周期中曾作为区域补涨品种出现但持续性弱。9/14 收 -0.58%、换手仅 0.41%，参与度为全链最低之一。</div>\n    <div class=\"gene\">🧬 题材基因：河南省域燃气运营，2021-2022 年天然气涨价周期中曾作为区域补涨品种出现，持续性弱</div>\n    \n    <div class=\"risk\">⚠️ 区域性强、增长空间有限；气价上行是成本压力</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>成都燃气</b><span class=\"code\">603053</span><span class=\"tag\">区域城燃·9/14 +0.34%</span><span class=\"cap\">8.79 元 · 流通 78 亿 · 9/16 +0.00%</span></div>\n    <div class=\"logic\">总市值 79 亿·换手 0.22%</div>\n    <div class=\"detail\">成都市域燃气分销，市值 79 亿。历史属性偏防御——多在大盘走弱时因公用事业属性而相对抗跌，而非在气价行情中领涨。9/14 收 +0.34%、换手仅 0.22%（全链最低），更可能是防御性买盘而非主题资金。</div>\n    <div class=\"gene\">🧬 题材基因：成都市域燃气分销，历史行情中属典型的低位滞涨品种，多在大盘走弱时体现防御属性</div>\n    \n    <div class=\"risk\">⚠️ 纯分销结构；低换手意味着主题资金未参与</div>\n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>贵州燃气</b><span class=\"code\">600903</span><span class=\"tag\">2017 气荒龙头·9/14 换手6.44% 收-2.94%</span><span class=\"cap\">6.88 元 · 流通 80 亿 · 9/16 +1.93%</span></div>\n    <div class=\"logic\">总市值 81 亿·当日天然气链换手最高</div>\n    <div class=\"detail\">本档案最有教学价值的样本：<strong>它的「基因」与「逻辑」是分离的</strong>。作为 2017-2018 气荒行情的绝对龙头，它是资金在天然气题材上的第一记忆；但那一轮的驱动是国内煤改气带来的<strong>需求爆发</strong>（量增驱动），而本轮是海外气源<strong>成本上升</strong>（价增、对城燃是成本）——两者方向完全相反。9/14 它以 <strong>6.44% 的全链最高换手收 -2.94%</strong>，是「资金认得基因、却没能形成合力」的典型形态：高换手说明有资金按记忆进场，收跌说明接力盘不认同当前逻辑。</div>\n    <div class=\"gene\">🧬 题材基因：2017-2018 年冬季「气荒」行情的绝对龙头，曾走出连续涨停的翻倍行情，是 A 股天然气题材最具辨识度的情绪记忆载体；但该轮驱动是国内煤改气带来的需求爆发，与本轮海外成本冲击方向相反</div>\n    \n    <div class=\"risk\">⚠️ 基因与逻辑背离：历史龙头地位来自需求驱动，本轮是成本冲击，直接套用历史经验会方向性错误</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2021-2022 年欧洲能源危机：TTF 一度突破 340 欧元/兆瓦时（2022 年 8 月峰值），欧洲电价与气价同步失控，推动当时的化工减产潮与「产业外迁」叙事；A 股对应的是煤化工成本优势重估（宝丰能源、华鲁恒升在 2022 年走出相对收益）与 LNG 船运订单爆发。本轮 TTF 84.50 欧元仅为当时的四分之一，但<strong>库存垫更薄</strong>（68% vs 当时 80% 以上），价格弹性被放大的机制相似。</li><li>2023 年 1 月：欧洲经历第一个「无俄管道气冬天」，TTF 约 70-80 欧元区间，因暖冬与需求破坏而平稳度过——当时储气率接近满库。本轮 TTF 已超过该水平，但<strong>储气率反而低了十余个百分点</strong>，这是「价格更高但缓冲更薄」的关键差异，也是本轮最值得警惕的结构。</li><li>2017-2018 年中国冬季「气荒」：煤改气推动需求爆发，国内 LNG 液厂价格一度破万元/吨，贵州燃气作为区域城燃走出连续涨停的翻倍行情。<strong>该轮与本轮方向相反</strong>——当时是需求驱动、城燃量价齐升；本轮是海外成本冲击、城燃毛差承压。这是本档案强调「基因与逻辑分离」的历史依据。</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>宝丰能源</b><span class=\"code\">600989</span><span class=\"tag\">煤制烯烃龙头·成本与海外气价脱钩</span></div>\n    <div class=\"logic\">煤头路线成本锚定国内煤价 | 海外气头/油头烯烃成本随气价抬升 | 出口替代是份额逻辑而非价格逻辑</div>\n    <div class=\"detail\">本档案中<strong>逻辑边界最清晰的正向样本</strong>：它的成本端锚定国内煤价与自备电力，与欧洲 TTF、亚洲现货 LNG 完全脱钩；而海外烯烃、甲醇、合成氨大量采用气头路线，气价创 2022 年末以来新高会系统性抬升其成本曲线。剪刀差扩大后，中国的煤头产品在出口与进口替代两个方向上获得份额——但要清醒认识到这是<strong>份额逻辑而非价格逻辑</strong>，国内产品价格不因海外气价上涨而自动上行，所以它享受的是相对竞争优势而非绝对提价。9/14 收 <strong>0.00%</strong>、市值 1758 亿，在气头氮肥全线杀跌（六国 -3.55%、阳煤 -2.26%）的对照下，它的持平本身就是排序的体现。</div>\n    \n    <div class=\"confirm\">✔ 确认：海外气头化工装置减产/停车公告增多 / 中国煤制烯烃、甲醇出口量环比提升 / 国内煤价维持低位而海外气价维持高位</div>\n    <div class=\"risk\">⚠️ 兑现为份额变化，单季报表难以读出；若煤价同步上行则剪刀差消失</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>华鲁恒升</b><span class=\"code\">600426</span><span class=\"tag\">煤气化平台·尿素成本曲线最左</span></div>\n    <div class=\"logic\">煤气化平台型、产品矩阵最宽 | 煤头尿素相对气头尿素成本占优 | 多产品柔性切换平滑单品周期</div>\n    <div class=\"detail\">与宝丰能源同属煤头，但它的价值在于<strong>「平台+柔性」</strong>：以煤气化为核心，产品覆盖尿素、DMF、醋酸、己二酸、乙二醇等，可根据各品种的相对盈利动态调节产出，因此在单一品种承压时抗风险能力更强。在天然气涨价这条线上，它的关键位置是<strong>煤头尿素对气头尿素的替代</strong>——海外气头尿素成本随气价抬升会推高国际尿素报价，而它的成本锚定煤价，同一报价下的毛利差扩大。9/14 收 <strong>-0.70%</strong>，跌幅显著小于气头尿素（四川美丰 -1.08%、湖北宜化 -1.81%）。</div>\n    \n    <div class=\"confirm\">✔ 确认：国际尿素报价上行而国内煤价稳定 / 公司肥料板块毛利率环比改善 / 气头尿素企业减产公告</div>\n    <div class=\"risk\">⚠️ 尿素受出口法检约束，国际报价上行未必能转化为出口量；国内煤价若上行则优势收窄</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中集集团</b><span class=\"code\">000039</span><span class=\"tag\">LNG 能源装备全球承接方·订单周期以年计</span></div>\n    <div class=\"logic\">LNG 罐箱/储罐/接收站模块全球供应 | 受益全球 LNG 基础设施投资加码 | 与气价短期脉冲弱相关</div>\n    <div class=\"detail\">它是本档案中<strong>唯一处在「投资端」而非「价格端」的标的</strong>——全球 LNG 供应链重构（卡塔尔出口受阻、欧洲抢建接收能力与储备）会转化为储罐、罐箱、液化模块、接收站设备的实际订单，这条路径不依赖气价在某个价位维持，而依赖基础设施投资的持续时间。独特之处在于<strong>全球份额与交付能力</strong>：它的能源装备业务覆盖 LNG 全链条，是少数能承接海外大型项目的中国供应商。但必须明确<strong>它是二阶、长周期的</strong>——订单兑现以年计，与 9/14 气价单日跳涨 5% 没有直接关系，9/14 收 <strong>+0.55%</strong>、市值 497 亿，涨幅温和且更可能来自其他业务。</div>\n    \n    <div class=\"confirm\">✔ 确认：公司能源装备板块新签订单同比转正 / 欧洲或中东 LNG 接收站项目中标公告 / 全球 LNG 液化产能 FID 数量回升</div>\n    <div class=\"risk\">⚠️ 订单周期长，短期业绩弹性小；集装箱业务占比高会稀释纯度</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>富瑞特装</b><span class=\"code\">300228</span><span class=\"tag\">LNG 装备纯度最高·9/14 -0.45%</span></div>\n    <div class=\"logic\">LNG 车用瓶+液化装置+储罐 | 业务纯度高于中集集团 | 市值小、订单弹性大但波动也大</div>\n    <div class=\"detail\">A 股 LNG 装备里业务纯度最高的标的之一，产品覆盖 LNG 车用气瓶、小型液化装置与储罐。相比中集集团它的能源装备占比更高、映射更纯，但市值仅 40 亿，订单的年度波动会直接放大为业绩与股价波动。9/14 收 -0.45%，未见主题资金介入。</div>\n    \n    \n    <div class=\"risk\">⚠️ 市值小（40 亿）、订单不连续；历史业绩波动极大</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>蜀道装备</b><span class=\"code\">300540</span><span class=\"tag\">深冷分离设备·9/14 +0.57%</span></div>\n    <div class=\"logic\">深冷技术与气体分离设备 | 受益 LNG 液化与工业气体投资 | 四川国资背景</div>\n    <div class=\"detail\">深冷设备与气体分离装置供应商，受益路径与富瑞特装类似但更偏工程与设备集成。9/14 收 +0.57%（市值 60 亿），是天然气链里涨幅居前的品种之一，但成交额有限，属低位承接而非主题驱动。</div>\n    \n    \n    <div class=\"risk\">⚠️ 工程类收入确认节奏受项目进度影响大</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>新天然气</b><span class=\"code\">603393</span><span class=\"tag\">带上游气源的城燃·9/14 +0.76%</span></div>\n    <div class=\"logic\">新疆城燃+煤层气上游 | 自有气源部分对冲成本上升 | 区域属性强、全国化程度低</div>\n    <div class=\"detail\">它是城燃板块里少见的<strong>「有上游」</strong>结构——控股煤层气资产意味着气源成本部分内部化，在气价上行期相对纯分销型城燃受损更小。9/14 收 +0.76%、市值 112 亿，在城燃普遍走弱时收红，可能反映了这一结构差异。但区域集中度高、全国化扩张能力有限，弹性受制约。</div>\n    \n    \n    <div class=\"risk\">⚠️ 区域性强；上游产量规模相对小，对冲作用有限</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>气头氮肥/气头化工</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">六国化工（-3.55%）、阳煤化工（-2.26%）、湖北宜化（-1.81%）、四川美丰（-1.08%）、云天化（-1.02%）9/14 全线走弱，跌幅普遍大于煤头一体化（鲁西 +0.08%、宝丰 0.00%、华鲁 -0.70%）。随着化肥用气市场化程度提高，气价上行对气头尿素是明确的成本压力。把这批标的当作「气价上涨受益股」是本轮最容易犯的错误——它们与煤头路线的相对强弱恰好相反。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>杭氧股份等工业气体</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">工业气体（空分设备与气体供应）的定价锚定制造业需求与工业用电，与欧洲 TTF、民用天然气定价机制完全不同链。9/14 收 -5.68% 是天然气链中跌幅最大的一只，但需明确这属于个股层面的因素，不应解读为「气价利空」或「气价利多」的任何一端——混为一谈会导致归因错误。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>纯分销型城燃（非上游）</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">新奥股份（-1.26%）、皖天然气（-0.52%）、蓝天燃气（-0.58%）等以分销为主、缺乏自有气源的城燃，在气价上行期是成本受损方。顺价机制的存在意味着成本最终可以传导，但存在季度级时滞，短期报表体现为毛差压缩。市场 9/14 的定价方向与此一致。</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**供给冲击型**海外气价冲击，A 股映射断裂。基准参照：2022 年欧洲能源危机，当时国内煤头化工相对气头化工的超额收益达 40pct。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">宝丰能源 ＞ 华鲁恒升 ＞ 中集集团。排序理由：煤头/自有气源的成本剪刀差最直接；中集是 LNG 装备出口，属间接受益。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">贵州燃气（情绪龙）＞ 皖天然气 ＞ 蓝天燃气 ＞ 成都燃气。gene：城燃小盘票是天然气涨价行情的固定末端补涨品种，2022 年行情中贵州燃气曾 7 天 5 板。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若 GIE 储气率 10 月底前未能追平五年均值**且**TTF 站稳 80 欧元上方 → 逻辑状态由「冬储告急预期」升为「实物短缺确认」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 欧盟储气率继续滑向 2013 年以来最低 ② TTF 突破 84.50 欧元前高 ③ 国内煤头化工品价差扩大。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 储气率入冬前追平五年均值（80% 以上） ② 阿曼会议重启、卡塔尔 LNG 出口恢复常态 ③ TTF 回落至 60 欧元下方。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">别把「欧洲气价新高」直接映射成「A 股燃气受益」。国内城燃是**成本**承受方（气头氮肥、气头化工、纯分销型城燃全部受损，已列入剔除），真正受益的是煤头/自有气源的成本剪刀差。盯盘指标就一个：GIE 每周四公布的欧盟储气率，它比 TTF 价格更早给出方向。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>情景推演</h2>\n    <div style=\"font-size:12px;color:var(--dim);margin-bottom:8px\">每个分支为可观察的条件树——触发条件兑现后的逻辑状态与验证信号，互斥且可证伪。不含操作建议。</div>\n    <div class=\"scen\"><div class=\"sc\"><div class=\"br\">▸ 低库存+寒冬·实物短缺兑现</div><div class=\"tg\">触发：<b>储气率 10 月底前未追平五年均值 / 今冬气温低于常年 / 卡塔尔 LNG 出现装船延误 / TTF 突破 84.50 欧元并站稳</b></div><div class=\"ls\">逻辑状态：<b>IEA 测算的 200 亿立方米缺口落到实物争夺上，欧亚抢货竞争激化；海外气头化工成本曲线系统性抬升并触发减产，中国煤头路线的成本剪刀差从「理论」变为「份额」；A 股煤头一体化与 LNG 装备订单成为唯一有效的两条正向路径</b></div><div class=\"fs\">观察信号：<b>宝丰能源、华鲁恒升相对上证持续正超额且相对气头氮肥超额扩大 / 海外气头化工减产公告增多 / 中国煤制产品出口询价升温 / 中集集团能源装备新签订单同比转正</b></div></div><div class=\"sc\"><div class=\"br\">▸ 外交缓和+暖冬·溢价快速回吐</div><div class=\"tg\">触发：<b>阿曼会议重启并达成霍尔木兹临时航道安排 / 卡塔尔出口恢复 / 今冬气温高于常年 / 储气率追平均值</b></div><div class=\"ls\">逻辑状态：<b>价格回到「风险溢价」框架而非实物短缺，对照 2023 年 1 月的平稳路径；A 股城燃的成本压力缓解但收益逻辑同样消失，煤头成本剪刀差随海外气价回落而收窄，整条链重回无主题状态</b></div><div class=\"fs\">观察信号：<b>TTF 跌回 70 欧元/兆瓦时下方 / 新奥股份等城燃负超额收敛转正 / 煤头与气头相对强弱回归中性 / A 股天然气链整体成交萎缩</b></div></div><div class=\"sc\"><div class=\"br\">▸ 高位僵持·A股映射持续断裂</div><div class=\"tg\">触发：<b>TTF 在 75-90 欧元区间震荡 / 储气率维持在 70% 上下 / 中国长协结构继续对冲成本传导</b></div><div class=\"ls\">逻辑状态：<b>两条叙事均未胜出，A 股维持当前定价方式——按「成本暴露度」排序而非按「受益度」排序；城燃与气头化工持续负超额，煤头一体化温和占优但无法形成板块效应，题材始终缺席涨停地图</b></div><div class=\"fs\">观察信号：<b>贵州燃气等高换手情绪票反复冲高回落 / 天然气主题持续缺席涨停题材地图 / 城燃与煤头一体化的相对强弱维持但绝对值均不涨</b></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>GIE 每周数据显示欧盟储气率在 10 月底前未能追平五年均值，继续滑向 2013 年以来最低填充率</b></li><li><b>TTF 站稳 80 欧元/兆瓦时上方并突破 2022 年 12 月高点 84.50 欧元</b></li><li><b>亚洲现货 LNG 续创 2022 年以来新高，欧亚价差扩大至吸引跨区套利</b></li><li><b>海外气头化工（合成氨、甲醇、烯烃）出现减产或停车公告，中国煤头产品出口询价升温</b></li><li><b>卡塔尔 LNG 出口实际出现装船延误或不可抗力声明</b></li><li><b>A 股煤头一体化相对气头氮肥的正超额继续扩大</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>GIE 储气率在入冬前追平或接近五年均值（80% 以上），库存垫修复</b></li><li><b>阿曼会议重启、霍尔木兹通行恢复，卡塔尔 LNG 出口回到正常节奏</b></li><li><b>TTF 跌回 70 欧元/兆瓦时下方（2023 年 1 月水平），地缘溢价回吐</b></li><li><b>欧洲今冬气温显著高于常年，采暖需求不及预期</b></li><li><b>IEA 下修今冬全球 LNG 减量测算（对照 200 亿立方米）</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">每周</div><div class=\"wh\">GIE 欧盟地下储气率与注气/采气速率</div><div class=\"wy\">库存垫是本档案最硬的支撑，也是最容易证伪的变量</div></div><div class=\"tkc\"><div class=\"w\">每日</div><div class=\"wh\">TTF 与 NBP 近月合约结算价、亚洲现货 LNG 价格</div><div class=\"wy\">价格中枢的直接刻度，与 2022 年 12 月高点对照</div></div><div class=\"tkc\"><div class=\"w\">10-11 月</div><div class=\"wh\">欧洲今冬气温与采暖度日数（HDD）</div><div class=\"wy\">需求端决定性变量，暖冬可完全对冲低库存</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">卡塔尔 LNG 装船状态、沙特东西管道与霍尔木兹通行量</div><div class=\"wy\">供给端根源，与 saudi-east-west-pipeline 共享同一证伪信号</div></div><div class=\"tkc\"><div class=\"w\">月度</div><div class=\"wh\">中国煤制烯烃/甲醇出口量、国际尿素报价</div><div class=\"wy\">成本剪刀差能否兑现为份额的唯一客观读数</div></div></div>\n\n    <div class=\"src\">数据来源：Reuters 2026-09-14 欧洲气价创 2022 年末以来新高（TTF 83.97 欧元/84.50 欧元盘中、NBP 208.90 便士）· ICE 数据 · Gas Infrastructure Europe 储气率 · IEA 分析师 Gergely Molnar 今冬 LNG 减量逾 200 亿立方米测算 · JERA 全球 CEO Yukio Kani 警告 · OilPrice.com 2026-09-14 欧洲气价跳涨 6% · TradingPedia 2026-09-14 欧洲天然气期货 · LSEG 分析师 Dzmitry Dauhalevich 挪威检修季观点 · Kpler 分析师 Go Katayama · 东方财富行情接口（2026-09-14 收盘与换手）</div>\n    <footer>欧洲气价创 2022 年末新高 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "saudi-east-west-pipeline", "title": "沙特东西管道中断", "date": "2026-09-14", "grade": "正式档", "pricing": "未定价", "crate": "bolt", "search": "沙特东西管道中断 1200km 绕行大动脉遇袭停运 · 三大航道石油输送量不足 700 万桶/日（冲突前 35%）· 布油破 108、上期所原油史上首破 900 元/桶 地缘冲突 ⚡ 供给冲击型 · 商品史诗级、a 股权益端当日全回吐", "card": "<a class=\"card-c\" href=\"#saudi-east-west-pipeline\" data-search=\"沙特东西管道中断 1200km 绕行大动脉遇袭停运 · 三大航道石油输送量不足 700 万桶/日（冲突前 35%）· 布油破 108、上期所原油史上首破 900 元/桶 地缘冲突 能源地缘·中东供断与成品油 未定价 中国海油 中海油服 招商轮船 中远海能 杰瑞股份\" data-grade=\"正式档\" data-pricing=\"未定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-14</span>\n    <span class=\"crate bolt\">⚡
