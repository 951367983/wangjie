也在扩张</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>万泽股份</b><span class=\"code\">000534</span><span class=\"tag\">9/9 +7.21%·高温合金弹性</span><span class=\"cap\">23.43 元 · 流通 118 亿 · 9/16 +0.56%</span></div>\n    <div class=\"logic\">燃机叶片概念·130亿小市值</div>\n    <div class=\"detail\">9/9 涨幅第二（+7.21%），是高温合金/叶片方向的弹性小票。130 亿市值在燃机链中偏小，是资金做题材弹性时的常见选择。</div>\n    <div class=\"gene\">🧬 题材基因：高温合金与军工材料双概念小盘，历次两机专项与航发行情中的情绪弹性品种</div>\n    \n    <div class=\"risk\">⚠️ 市值小、股性活，波动大；燃机业务实际占比需核实</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>联德股份</b><span class=\"code\">605060</span><span class=\"tag\">燃机大型铸件·9/9 +1.20%</span><span class=\"cap\">38.92 元 · 流通 93 亿 · 9/16 +1.96%</span></div>\n    <div class=\"logic\">精密机械零部件·97亿市值</div>\n    <div class=\"detail\">精密机械零部件（燃机大型铸件）方向，其零部件二期项目 2026 年 4 月底获批推进。2026 年初股价曾因燃机铸件高景气短期暴涨近 100%，是有过一次完整记忆的标的。9/9 +1.20%，反应温和。</div>\n    <div class=\"gene\">🧬 题材基因：2026 年初因燃机大型铸件行情短期暴涨近 100% 的情绪票，资金对它有明确记忆锚</div>\n    \n    <div class=\"risk\">⚠️ 已有过一轮暴涨，位置与筹码结构需审慎看待</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2025–2026 杰瑞股份燃机订单曲线：2025/11 与 12 月各获超 1 亿美元订单 → 2026/1 的 1.06 亿、2 月 1.815 亿、3 月 3.408 亿、4 月 3.014 亿美元 → 7/22 单笔 14.65 亿美元。<strong>股价 6/5 创 163.23 元历史新高</strong>，随后回落至 9/9 的 125.7 元——订单在涨而股价回撤，是本轮定价不充分的直接体现。</li><li>2023–2025 两机专项行情：航发动力、应流股份、航宇科技等在航空发动机国产化叙事下走过多轮，<strong>热端部件与高温合金始终是弹性最大的环节</strong>，与本次燃机行情的受益结构高度一致。</li><li>2021–2022 欧洲能源危机：燃气发电与热泵需求爆发，国内相关设备出口大增，但行情持续约两个季度后随能源价格回落而结束——<strong>提示本轮同样受「能源价格与 AIDC 资本开支」双重变量约束</strong>。</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>杰瑞股份</b><span class=\"code\">002353</span><span class=\"tag\">AIDC燃机出海唯一实证·在手订单超31亿美元</span></div>\n    <div class=\"logic\">西门子/贝克休斯多机头资源 | 31 亿美元订单、2027 集中交付 | 机头供应与 2026 报表空窗是约束</div>\n    <div class=\"detail\">本轮国产燃机出海<strong>唯一有实证的标的</strong>：自 2025 年 11 月至 2026 年 8 月累计斩获数据中心燃机发电机组订单<strong>超 31 亿美元（约 209 亿元）</strong>，其中 7/22 单笔 <strong>14.65 亿美元</strong>来自同一国际云服务商<strong>复购</strong>——从零的突破走到规模化持续供货，是这条链上最关键的一步。它的模式独特：<strong>核心机头由西门子能源 SGT 系列授权、发电机组组装集成自制</strong>，从而绕过长达数年的零部件短缺，直接向美国数据中心业主交付分布式电站。为锁定主机与原材料产能，2026H1 预付款项较年初<strong>大增 141.62% 至 26.43 亿元</strong>——这是订单真实性的硬证据。9/9 收 125.7 元、<strong>-0.06%，完全零反应</strong>（6/5 曾创 163.23 元历史新高）。</div>\n    \n    <div class=\"confirm\">✔ 确认：新增燃机订单公告（尤其新客户或更大金额复购） / 2027 年交付排期与收入确认启动</div>\n    <div class=\"risk\">⚠️ 核心机头依赖外部供应商，交付延期会直接卡住成套；大单 2027 年才交付，2026 年业绩空窗；北美贸易与本地化合规风险</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>应流股份</b><span class=\"code\">603308</span><span class=\"tag\">热端部件核心供应商·9/9 涨停</span></div>\n    <div class=\"logic\">高温合金叶片/导向叶片，整机扩产的关键瓶颈 | 两机（航发+燃机）双轮 | 已被资金选中</div>\n    <div class=\"detail\">应流的价值在于它卡在<strong>整条链最稀缺的环节</strong>——燃机热端部件（涡轮叶片、导向叶片）用的高温合金铸件。中信建投明确指出「热端部件已成为燃机整机扩产的关键瓶颈」，SpaceX 甚至要自建叶片铸造能力以缩短 18 个月投运周期，这从侧面说明该环节的<strong>议价能力最强</strong>。它的独特之处是<strong>「两机」双轮驱动</strong>：同一套高温合金精密铸造能力同时服务航空发动机与燃气轮机，燃机订单爆发时它可以复用航发产线的工艺积累，产能弹性与良率爬坡快于纯燃机配套厂。9/9 <strong>涨停 +10.00%</strong>，是当日燃机概念的领涨标，已被资金明确认领。</div>\n    \n    <div class=\"confirm\">✔ 确认：高温合金铸件订单/产能扩建公告 / 燃机客户（西门子、贝克休斯等）长协落地</div>\n    <div class=\"risk\">⚠️ 已被资金选中、位置不低，需分歧确认；航发与燃机两条下游的需求节奏不完全同步</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>东方电气</b><span class=\"code\">600875</span><span class=\"tag\">国产重型燃机整机·G50 自主研发</span></div>\n    <div class=\"logic\">G50 重型燃机代表国产两机最高水平 | 全球电力超级周期 + 国内燃机调峰需求 | 9/9 +5.52%</div>\n    <div class=\"detail\">国内发电设备整机龙头，<strong>自主研发的 G50 重型燃气轮机</strong>代表中国在「两机」领域的最高水平——这使它在「国产替代」与「出海」两个叙事上都有位置。逻辑的双重性在于：<strong>海外</strong>是全球燃机供需失衡至少延续到 2030 年的产能窗口，<strong>国内</strong>是电网对燃气调峰机组需求的释放（风光装机扩张 → 调峰需求上升）。与杰瑞的「集成出海」路径不同，它是<strong>自主整机路线</strong>——一旦走出去，价值量与技术壁垒都更高，但验证周期也更长。机构预计其 2026 年归母净利润同比增长 22.84% 至 47.06 亿元，估值逻辑正从「低增速红利股」向「高端装备制造溢价」迁移。9/9 <strong>+5.52%</strong>，是当日涨幅第三的燃机标的。</div>\n    \n    <div class=\"confirm\">✔ 确认：G50 或更大型号燃机获得海外订单 / 国内燃机调峰机组招标放量</div>\n    <div class=\"risk\">⚠️ 自主整机出海尚无大规模实证；大市值（878 亿）弹性温和；国内电力设备招标节奏受政策影响</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>航宇科技</b><span class=\"code\">688239</span><span class=\"tag\">环形锻件·燃机与航发共用产线</span></div>\n    <div class=\"logic\">锻件环节，燃机与航空发动机需求同源，9/9 +3.96%</div>\n    <div class=\"detail\">做环形锻件，处于热端部件的上游材料成型环节。它的特点是<strong>燃机与航空发动机共用锻造产线与工艺</strong>，燃机订单爆发时可以直接从航发订单切换产能，属于「两机共振」型标的。107 亿市值在整条链中偏小，弹性较好。9/9 +3.96%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 锻件环节竞争较叶片更激烈，议价能力弱于应流；航发订单节奏是独立变量</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>潍柴动力</b><span class=\"code\">000338</span><span class=\"tag\">燃气内燃机·被低估的增速冠军</span></div>\n    <div class=\"logic\">9/9 调研明确看好天然气发电在离网市场竞争力，AIDC 内燃机增速快于重型燃机</div>\n    <div class=\"detail\">潍柴的独特位置在<strong>燃气内燃机</strong>而非重型燃机——这是被市场忽略的高增速环节：研报显示数据中心相关<strong>内燃机在开发容量半年增长两倍以上至 45GW</strong>，约占 AIDC 配套燃气发电的 1/4，增速快于重型燃机。9/9 公司调研纪要明确表态「电力市场缺口大、客户偏好快速交付且供应稳定的方案，看好天然气发电产品在离网发电市场的竞争力」，与公司口径形成互证。9/9 +4.66%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 2436 亿市值，燃机/内燃机业务占比小，弹性被主业大幅稀释</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>陕鼓动力</b><span class=\"code\">601369</span></div>\n    <div class=\"logic\">主业是轴流压缩机、透平机械与能量回收装置，虽同属透平大类但<strong>燃气轮机整机业务占比很低</strong>，与 AIDC 燃机出海的传导链关系弱。9/9 -0.70%，未获资金认可。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>仅挂概念无海外订单的配套厂</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">本轮订单爆发的受益核心是<strong>能拿到海外订单或供上热端部件</strong>的企业，仅有「燃气轮机」概念标签而无实际订单与产能的配套厂，不在受益侧。</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">AI 电力配套的**需求爆发级**催化，数据滞后一个季度但趋势性最强。基准参照：2023 年美国数据中心带动的变压器行情，订单到业绩传导约 4-6 个季度。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">杰瑞股份 ＞ 应流股份 ＞ 东方电气。排序理由：杰瑞已拿到海外燃机订单（实锤），应流是热端部件核心供应商，东方电气为整机但海外占比低。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">万泽股份 ＞ 联德股份。gene：两票均为高温合金/精密件小盘，2023 变压器行情中作为末端材料票出现过补涨。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若 2026Q3 全球燃机订单在 38GW 基础上继续环比增长**且**杰瑞新增订单公告 → 逻辑状态由「单季高点待验」升为「新平台确认」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 2026Q3 订单环比继续增长 ② 杰瑞新增燃机订单（新客户或更大规模复购） ③ 应流热端部件订单/毛利率同步改善。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 2026Q3 订单环比回落，38GW 被证实为单季高点 ② 美国数据中心资本开支放缓（与 intel-cpu-price-hike 共振证伪） ③ 杰瑞订单落地不及预期。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">38GW 是**单季**数据，一个季度不足以证明新平台——这是全案最大的待验证点。它与 intel-cpu-price-hike、storage-cell-capacity-control 构成同一条 AI 资本开支主线，三者应当同向：如果 CPU 涨价、储能电芯紧俏同时出现，燃机订单可信度大幅提升；反之若三者分化，说明是单点数据噪音。</div></div></div>\n\n    \n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b><strong>2026Q3 全球燃机订单在 38GW 基础上继续环比增长</strong>（新平台而非单季高点）</b></li><li><b>杰瑞股份新增燃机订单公告，尤其来自新客户或更大规模复购</b></li><li><b>国内其他燃机/内燃机企业获得海外 AIDC 供电订单，「国产整机出海」从一家验证走向多家</b></li><li><b>西门子能源、GE Vernova 交付排期继续后延，热端部件扩产公告增多</b></li><li><b>杰瑞股份 -0.06% 的零反应被打破，资金开始定价出海主线而非仅零部件</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>2026Q3 全球燃机订单环比回落，38GW 被证实为单季高点</b></li><li><b>美国数据中心资本开支出现放缓信号（与 intel-cpu-price-hike 档案共振证伪）</b></li><li><b>北美并网审批加速或电网扩容，AIDC 对自备燃机电源的迫切性下降（缺口 47GW 收窄）</b></li><li><b>杰瑞股份订单交付延期或客户取消，31 亿美元在手订单的能见度被削弱</b></li><li><b>热端部件瓶颈缓解（SpaceX 类自建产能投产、铸件厂大幅扩产），稀缺性溢价消失</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">2026Q3 数据发布</div><div class=\"wh\">全球燃机订单季度数据（对照 2026Q2 的 38GW）</div><div class=\"wy\">判断这是单季历史高点还是新增长平台的起点</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">杰瑞股份燃机订单公告与客户结构变化</div><div class=\"wy\">目前国产整机出海的唯一实证，它坏则整条逻辑失去支点</div></div><div class=\"tkc\"><div class=\"w\">2027 年起</div><div class=\"wh\">杰瑞 14.65 亿美元大单的交付与收入确认节奏</div><div class=\"wy\">订单转化为报表的关键节点，业绩环能否闭合</div></div><div class=\"tkc\"><div class=\"w\">每月</div><div class=\"wh\">美国数据中心资本开支与并网周期（摩根士丹利 47GW 缺口口径的更新）</div><div class=\"wy\">与 intel-cpu-price-hike、ai-compute-hike 共享的同一风险源</div></div></div>\n\n    <div class=\"src\">数据来源：中信建投全球燃机研报(9/9) ｜ 《2026 燃气轮机产业发展白皮书》 ｜ 摩根士丹利美国数据中心电力缺口测算（2025-2028 累计 47GW）｜ 西门子能源 2026 财年 Q1 订单（102 台、1/4 与数据中心相关）｜ 杰瑞股份 7/22 公告与 2026 中报 ｜ 潍柴动力 9/9 调研纪要 ｜ 财联社燃气轮机概念盘点(9/9) ｜ iFinD 盘面数据(9/9)</div>\n    <footer>全球燃机订单创新高 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "intel-cpu-price-hike", "title": "英特尔CPU年内三连涨", "date": "2026-09-09", "grade": "正式档", "pricing": "未定价", "crate": "bolt", "search": "英特尔cpu年内三连涨 10/5 起 pc cpu 拟再涨 10% · 隔夜英特尔 +9.05% 市值破 5500 亿美元 · 中国服务器 cpu 年内涨幅超 40%、交期拉长至 6 个月 映射型 ⚡ 涨价实锤级 · 美股已定价、a股cpu链完全零反应", "card": "<a class=\"card-c\" href=\"#intel-cpu-price-hike\" data-search=\"英特尔cpu年内三连涨 10/5 起 pc cpu 拟再涨 10% · 隔夜英特尔 +9.05% 市值破 5500 亿美元 · 中国服务器 cpu 年内涨幅超 40%、交期拉长至 6 个月 映射型 ai算力与电力配套 未定价 海光信息 龙芯中科 中国长城 澜起科技 中电港\" data-grade=\"正式档\" data-pricing=\"未定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-09</span>\n    <span class=\"crate bolt\">⚡ 涨价实锤级 · 美股已定价、A股CPU链完全零反应 映射型</span>\n  </div>\n  <div class=\"ctitle\">英特尔CPU年内三连涨</div>\n  <div class=\"csub\">10/5 起 PC CPU 拟再涨 10% · 隔夜英特尔 +9.05% 市值破 5500 亿美元 · 中国服务器 CPU 年内涨幅超 40%、交期拉长至 6 个月</div>\n  <div class=\"cpos\">10/5 起英特尔 PC CPU 拟再涨 10%（年内三连涨），隔夜英特尔 +9.05% 市值破 5500 亿美元；A 股 CPU 链完全零反应。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">AI算力与电力配套</span>\n    \n    <span class=\"chip pri\">未定价</span>\n    <span class=\"chip\">标的 8</span>\n    <span class=\"nm\">海光信息</span><span class=\"nm\">龙芯中科</span><span class=\"nm\">中国长城</span><span class=\"nm\">澜起科技</span><span class=\"nm\">中电港</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-09 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-09</div>\n    <h1>英特尔CPU年内三连涨</h1>\n    <div class=\"sub\">10/5 起 PC CPU 拟再涨 10% · 隔夜英特尔 +9.05% 市值破 5500 亿美元 · 中国服务器 CPU 年内涨幅超 40%、交期拉长至 6 个月</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 涨价实锤级 · 美股已定价、A股CPU链完全零反应</span>\n      <span class=\"badge neutral\">映射型</span>\n      <span class=\"badge neutral\">定价状态：未定价</span>\n      <span class=\"badge neutral\">主线：AI算力与电力配套</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">ai-compute-hike</span><span class=\"tag\" style=\"margin-right:4px\">deepseek-chain</span><span class=\"tag\" style=\"margin-right:4px\">gas-turbine-aidc-orders</span><span class=\"tag\" style=\"margin-right:4px\">mlcc-murata-eol</span><span class=\"tag\" style=\"margin-right:4px\">optical-chip-shortage</span><span class=\"tag\" style=\"margin-right:4px\">power-semi-hike3</span></div>\n    <div class=\"posnote\">10/5 起英特尔 PC CPU 拟再涨 10%（年内三连涨），隔夜英特尔 +9.05% 市值破 5500 亿美元；A 股 CPU 链完全零反应。</div>\n    <details class=\"more\"><summary>展开定价状态详版（407 字）</summary><div class=\"pos\"><b>定价状态备注：</b>传闻 9/8 由台媒《电子时报》放出，隔夜美股英特尔<strong>逆势 +9.05%</strong>（当日道指跌 570 点、英伟达 -2%），市值破 5500 亿美元——<strong>海外已充分定价</strong>。9/9 08:37 财联社快讯传入 A 股，<strong>盘面状态</strong>：A 股 CPU/信创链<strong>集体零反应且多数翻绿</strong>——海光信息 -0.46%、龙芯中科 -1.35%、中国长城 -0.27%、澜起科技 -0.18%、神州数码 -1.19%、中国软件 -1.78%；连财联社主题库点名的两只相关票也只有中天精装 +1.44%、中国长城 -1.35%（盘中口径）。存储端反而重挫（江波龙 -3.02%、香农芯创 -2.86%、德明利 -1.72%），说明资金在存储与算力之间腾挪，<strong>CPU 这条线完全没有被定价</strong>。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">9/8 台媒《电子时报》援引供应链人士：英特尔 <strong>PC CPU 预计 2026 年 10 月 5 日再度涨价，涨幅约 10%</strong>。这是自 2025 年底以来的<strong>第三轮</strong>——2026Q1 涨约 10%、7 月对部分消费级与服务器 CPU 调价（单颗涨幅数十至上千美元）、10/5 拟再涨 10%。同时毛利率偏低的 <strong>Small Core（小核，如凌动系列）产品线或启动 EOL 停产退市</strong>。隔夜美股英特尔 <strong>+9.05% 收 104.47 美元，总市值突破 5500 亿美元</strong>，另有机构上调至 Outperform、目标价 120 美元。</div></div><div class=\"card fact\"><b class=\"k\">涨价格局：涨的不是 PC，是服务器</b><div class=\"v\">把 7 月那轮拆开看，方向非常清楚：<strong>128 核旗舰至强 6980P 建议客户价从 12460 美元抬到 13955 美元，单颗 +1495 美元（约 +12%）</strong>；同批桌面端 Core Ultra 7 270K Plus 只涨 30–50 美元，标准版 200 系列干脆没动。一颗 6980P 的加价抵得上四颗半 270K Plus 的整颗售价。<strong>Tom's Hardware 的判断是：真为消化成本应该全产品线一起调，只挑几个型号涨，更像是对抢不到货的 SKU 收溢价</strong>——本质是定价权回归，不是成本转嫁。</div></div><div class=\"card fact\"><b class=\"k\">中国市场的紧张度</b><div class=\"v\">国信证券援引数据：<strong>中国市场服务器 CPU 年内部分产品价格涨幅已超 40%、单月涨幅超 10%，交付周期最长拉长至六个月</strong>。原话判断是——<strong>「服务器 CPU 正步入『类内存/HBM』的紧平衡周期」</strong>。这是把 CPU 与过去两年的存储涨价做类比，逻辑级别上了一个台阶。国信认为行业 CPU 需求结构性扩容、产能紧缺周期拉长，管理层预判 <strong>2026–2028 服务器 CPU 出货维持双位数高增长，景气周期延续至 2028 年</strong>。</div></div><div class=\"card fact\"><b class=\"k\">结构驱动：Agent 把 CPU 拉回牌桌</b><div class=\"v\">陈立武 5/19 摩根大通技术会议给出关键数字：<strong>训练时代一套系统 1 颗 CPU 配 8 颗 GPU；Agentic AI 场景下客户反馈配比已接近 1:1，部分案例甚至 4 颗 CPU 配 1 颗 GPU</strong>——因为 Agent 的控制层、调度层与工具调用负载大幅抬升。AMD 苏姿丰在 Advancing AI 大会上把 <strong>2030 年服务器 CPU 市场规模从 1200 亿美元上调至 2200 亿美元，2025–2030 复合增速超 50%</strong>。这是需求侧最硬的一组数字。</div></div><div class=\"card fact\"><b class=\"k\">供给端：主动制造短缺</b><div class=\"v\">英特尔把<strong>自有晶圆厂产能优先供给服务器 CPU</strong>（该业务毛利率高于台积电代工部分），即便如此服务器 CPU 仍产能紧张，<strong>反过来挤占 PC CPU 产能、制造出 PC 端的结构性短缺</strong>。Wedbush 分析师 Matt Bryson：服务器 CPU 持续短缺使英特尔拥有<strong>提价而不伤及需求的定价弹性</strong>，关键不是能否提价，而是涨价落在哪个环节。此外 Intel Foundry 披露已用 High NA EUV 处理超 100 万片晶圆。</div></div><div class=\"card fact warn\"><b class=\"k\">争议点</b><div class=\"v\"><strong>PC 市场本身在萎缩。</strong>高盛、IDC、Gartner 预测 2026 年全球 PC 出货降幅 <strong>6.1%–14%</strong> 不等（约 2.6 亿台，2027 或回落至 2.5 亿台），原因是存储缺货涨价、提前备货透支、Windows 10 换机红利消退。<strong>在一个萎缩的市场里连涨三轮，本质是「从抢市占率转向提利润率」</strong>，终端需求并不支撑，涨价能持续多久存疑。另需注意：<strong>10/5 涨价目前仍为供应链传闻，英特尔尚未发布正式调价公告</strong>；若英特尔收缩小核产品线，首先受冲击的是工业电脑(IPC)、IoT、嵌入式等长生命周期市场，高通、联发科等 Arm 阵营有望补位。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/9 A 股 CPU 与信创链<strong>全线零反应</strong>：海光信息 -0.46%（成交 39.7 亿）、龙芯中科 -1.35%、中国长城 -0.27%（成交 11.1 亿）、澜起科技 -0.18%、神州数码 -1.19%、中国软件 -1.78%、拓维信息 -0.19%、中电港 +0.54%。财联社主题库点名的中天精装（间接持科睿斯 27.41% 股权，ABF 载板）仅 +1.44%。<strong>存储端当日反而重挫</strong>：江波龙 -3.02%、香农芯创 -2.86%、德明利 -1.72%、佰维存储 -1.72%。资金在存储与算力板块内部腾挪，<strong>「CPU 涨价 → 国产 CPU 替代加速」这条映射链在 9/9 完全没有被定价</strong>。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-09</div><div><div class=\"x\">英特尔CPU年内三连涨：10/5 起 PC CPU 拟再涨 10% · 隔夜英特尔 +9.05% 市值破 5500 亿美元 · 中国服务器 CP</div><div class=\"y\">为什么：本档为「AI算力」的建档时点，后续二段催化均在此之上叠加</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是<strong>「涨价实锤级」的海外映射</strong>催化，但映射的不是价格，是<strong>供给格局</strong>。<strong>三个要害</strong>：一是<strong>真正稀缺的是服务器 CPU 而非 PC CPU</strong>——7 月那轮至强 6980P 单颗涨 1495 美元、桌面端只涨 50 美元，已经把答案写在价格表里，映射到 A 股时<strong>服务器/信创 CPU 的对应关系远强于消费 PC 链</strong>；二是<strong>驱动来自 Agent 而非传统算力</strong>——CPU:GPU 配比从 1:8 变到接近 1:1 甚至 4:1，这是<strong>结构性配比变化</strong>而非总量增长，意味着弹性集中在数据中心服务器 CPU，与 GPU 是<strong>互补而非替代</strong>（当日英伟达跌 2% 而英特尔涨 9%，正是资金在 AI 内部轮动而非离场）；三是<strong>映射的时滞与折扣</strong>——海外原厂涨价到国产替代之间隔着「交期」这一中间变量，中国市场服务器 CPU 交期已拉长到 6 个月、年内涨超 40%，这才是<strong>国产 CPU 份额提升的真实推手</strong>，而不是英特尔的报价本身。<strong>隐藏面</strong>：英特尔收缩低毛利 Small Core 产品线，释放的是 IPC/IoT/嵌入式这类<strong>长尾市场</strong>——这对国产 Arm 阵营是比服务器更大的一块蛋糕，但市场目前完全没往这个方向想。<br>① <strong>分水岭时点</strong>：<strong>10 月 5 日</strong>涨价是否如期落地并获英特尔正式确认——这是本档案唯一、清晰、可证伪的时点。<br>② <strong>传导的关键约束</strong>：国产 CPU 在<strong>生态与产能</strong>两端的承接能力，缺货若不能转化为国产份额，映射就断在中间。<br>③ <strong>待验证的核心变量</strong>：国内服务器 CPU 的<strong>交付周期与报价</strong>是否继续走高——这是判断紧平衡是否加剧的直接指标。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">待证实</span><ul><li>台媒电子时报供应链消息 + 隔夜美股 +9.05% 已给出强信号</li><li>但 10/5 涨价尚属供应链传闻，英特尔未发正式调价公告</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强</span><ul><li>中国市场服务器 CPU 年内涨超 40%、交期拉长至 6 个月，紧平衡已客观存在</li><li>Agent 场景 CPU:GPU 配比从 1:8 趋近 1:1，需求结构性扩容</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">分化</span><ul><li>国产 CPU 厂商业绩弹性取决于份额而非价格，兑现需 1-2 个季度</li><li>海光 5481 亿市值已含较高预期，边际改善的业绩弹性相对有限</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">未动</span><ul><li>9/9 海光 -0.46%、龙芯 -1.35%、中国长城 -0.27%，全线零反应</li><li>存储端当日重挫，说明资金尚未把 CPU 作为独立主线</li></ul></div></div>\n    <div class=\"sum\">▸ 变化待 10/5 证实、影响强、业绩分化、股价完全未动——这是一条「逻辑硬但尚未被资金认领」的映射链。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>70%</strong>：「影响」环证据最硬（中国市场年内涨超 40%、交期 6 个月是客观事实）；「变化」环受制于传闻属性；「股价」环空白构成预期差；「业绩」环对国产厂商是份额逻辑而非涨价逻辑，弹性需要季度数据验证。</li><li><strong>边界要切开</strong>：受益的是<strong>①国产服务器 CPU 厂商与其参股方</strong>（海光、龙芯、飞腾—中国长城参股 28.035%）与<strong>②服务器 CPU 配套环节</strong>（澜起科技的内存接口芯片、ABF 载板）；不受益的是<strong>③PC 整机与代工厂</strong>（成本上升而终端涨价空间受制于萎缩的需求）与<strong>④纯 GPU 算力租赁</strong>（本轮是 AI 内部轮动，资金从 GPU 流向 CPU，不是新增）。</li><li><strong>主线联动</strong>：与 ai-compute-hike（云厂商上调算力价）档案构成<strong>「AI 算力」主线的两个侧面</strong>——前者是算力服务端的提价，本档案是算力硬件端的提价，两者互相印证 AI  infra 环节<strong>整体进入提价周期</strong>；与 gas-turbine-aidc-orders（燃机订单 38GW）同属 AI 基建的<strong>「电—算」双翼</strong>：一个解决 AIDC 的电力来源，一个解决 AIDC 的算力核心，是同一轮资本开支的两个受益端。<strong>风险共振点</strong>：若美国数据中心资本开支放缓，三条线会同步走弱。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 映射型</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>海光信息</b><span class=\"code\">688041</span><span class=\"tag\">国产服务器CPU龙头·x86生态最完整</span><span class=\"cap\">235.09 元 · 流通 5464 亿 · 9/16 +4.67%</span></div>\n    <div class=\"logic\">缺货打开替代窗口·9/9零反应</div>\n    <div class=\"detail\">国产 x86 服务器 CPU 龙头，生态兼容性使其迁移成本最低。关键推手是英特尔 6 个月交期而非报价本身。Agent 场景 CPU:GPU 从 1:8 趋近 1:1 直接放大单台服务器 CPU 需求。9/9 -0.46%，成交 39.7 亿。</div>\n    \n    \n    <div class=\"risk\">⚠️ 5481 亿市值已含高预期；代工产能受约束</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>龙芯中科</b><span class=\"code\">688047</span><span class=\"tag\">纯自主指令集·弹性最大的CPU标的</span><span class=\"cap\">99.80 元 · 流通 400 亿 · 9/16 +3.74%</span></div>\n    <div class=\"logic\">LoongArch 自主架构·405亿小市值</div>\n    <div class=\"detail\">不依赖 x86/Arm 授权，是自主可控叙事下纯度最高的 CPU 标的。405 亿市值在 CPU 三剑客中最小，单位份额提升的市值弹性最大。9/9 -1.35%，当日 CPU 链跌幅最大。</div>\n    \n    \n    <div class=\"risk\">⚠️ 生态适配是长期短板，放量依赖政策驱动</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中国长城</b><span class=\"code\">000066</span><span class=\"tag\">参股飞腾 28.035%·ARM 路线</span><span class=\"cap\">14.15 元 · 流通 456 亿 · 9/16 +2.09%</span></div>\n    <div class=\"logic\">芯片+整机一体·股价位置最低</div>\n    <div class=\"detail\">飞腾（国产 ARM 服务器 CPU）主要权益方，持股 28.035%。芯片+整机一体化在信创集采中是重要交付能力。14.55 元股价在 CPU 链中最低，低位映射最容易选它。9/9 -0.27%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 参股形式权益计量有折价；整机毛利低稀释弹性</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 映射型</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>澜起科技</b><span class=\"code\">688008</span><span class=\"tag\">内存接口芯片·量增逻辑最干净</span><span class=\"cap\">199.89 元 · 流通 2288 亿 · 9/16 +6.42%</span></div>\n    <div class=\"logic\">出货绑定服务器CPU·不参与价格竞争</div>\n    <div class=\"detail\">内存接口芯片出货与服务器 CPU 出货强绑定，CPU:GPU 配比趋近 1:1 直接放大需求。不参与 CPU 价格竞争、只跟随量增，全球三家寡头格局稳定。9/9 -0.18%，几乎平盘。</div>\n    \n    \n    <div class=\"risk\">⚠️ DDR5 渗透率高，增量取决于第二子代</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中电港</b><span class=\"code\">001287</span><span class=\"tag\">分销·涨价传导的客观温度计</span><span class=\"cap\">23.80 元 · 流通 181 亿 · 9/16 +3.61%</span></div>\n    <div class=\"logic\">元器件分销龙头·9/9 +0.54%</div>\n    <div class=\"detail\">授权分销龙头，是原厂提价传导到国内渠道的第一棒。它的进货价与周转速度比厂商口径更快反映 CPU 涨价是否真实落地。9/9 +0.54%，为 CPU 链少数收红标的。</div>\n    \n    \n    <div class=\"risk\">⚠️ 分销毛利极薄，涨价弹性有限</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>寒武纪</b><span class=\"code\">688256</span><span class=\"tag\">AI 芯片·与CPU互补而非同类</span><span class=\"cap\">1136.01 元 · 流通 7144 亿 · 9/16 +5.60%</span></div>\n    <div class=\"logic\">本轮是AI内部轮动的对手盘</div>\n    <div class=\"detail\">需明确：寒武纪是 <strong>AI 加速芯片</strong>，与 CPU 是互补而非替代关系。当日英伟达跌 2% 而英特尔涨 9%，说明这是 <strong>AI 板块内部的资金轮动</strong>而非整体加仓，寒武纪 9/9 微跌正对应这一轮动。它属于同一主线的另一条腿，不是本档案的直接受益方。</div>\n    \n    \n    <div class=\"risk\">⚠️ 与 CPU 逻辑不同源，混同为同一标的会误判</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 映射型</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中天精装</b><span class=\"code\">002989</span><span class=\"tag\">间接持科睿斯 27.41%·ABF载板</span><span class=\"cap\">23.60 元 · 流通 47 亿 · 9/16 +0.60%</span></div>\n    <div class=\"logic\">财联社主题库点名·9/9 +1.44%</div>\n    <div class=\"detail\">主营是建筑装饰，<strong>间接持有科睿斯 27.4087% 股权</strong>，后者做 ABF 载板（用于 CPU/GPU/AI 芯片封装）。这是财联社主题库在 CPU 涨价消息下点名的两只票之一，9/9 +1.44%。<strong>但它是典型的「参股型概念股」</strong>——主业与半导体无关，权益比例经多层穿透，弹性与基本面关联度低。</div>\n    <div class=\"gene\">🧬 题材基因：典型跨界参股型情绪票，历次半导体封装/载板题材中的脉冲品种；主业装饰，题材属性纯粹来自参股</div>\n    \n    <div class=\"risk\">⚠️ 主业与半导体无关，参股经多层穿透，业绩关联度极低</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>拓维信息</b><span class=\"code\">002261</span><span class=\"tag\">昇腾生态·国产算力情绪票</span><span class=\"cap\">25.08 元 · 流通 287 亿 · 9/16 +0.08%</span></div>\n    <div class=\"logic\">9/9 -0.19%·国产算力老情绪票</div>\n    <div class=\"detail\">华为昇腾生态的核心合作方，是国产算力题材的<strong>老牌情绪票</strong>。在 CPU 涨价映射下它属于「国产算力」大类下的泛化跟涨，与 CPU 本身没有直接传导关系。9/9 -0.19%。</div>\n    <div class=\"gene\">🧬 题材基因：昇腾/信创历次行情中的情绪先锋，2023-2024 国产算力行情中多次领涨；股性活跃但业绩兑现弱</div>\n    \n    <div class=\"risk\">⚠️ 与 CPU 逻辑无直接传导；业绩长期承压，纯情绪属性</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2023–2025 存储/HBM 涨价：内存从供过于求到 AI 驱动的紧平衡，江波龙、佰维存储等一年内数倍——本轮国信证券明确将 CPU 类比为<strong>「正步入类内存/HBM 的紧平衡周期」</strong>，是同一剧本的重演。</li><li>2024 英特尔至强 6 发布与服务器 CPU 缺货：当时国内信创链有过一轮脉冲，但持续约两周即回落，说明<strong>单纯的海外涨价映射缺乏持续性</strong>，必须落到国内份额数据才走得远。</li><li>2025 微软 Windows 10 停服换机潮：PC 链走过一轮预期行情，随后 2026 年换机红利消退、出货转跌——这也解释了英特尔为何放弃「抢份额」转向「提毛利」。</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>海光信息</b><span class=\"code\">688041</span><span class=\"tag\">国产服务器CPU龙头·x86 生态最完整</span></div>\n    <div class=\"logic\">国内少数具备 x86 服务器 CPU 量产能力 | 缺货+涨价直接打开替代窗口 | 5481 亿市值已含较高预期</div>\n    <div class=\"detail\">国产服务器 CPU 的绝对龙头，独特价值在于<strong>x86 生态兼容性</strong>——在英特尔交期拉长至 6 个月、中国市场报价年内涨超 40% 的背景下，客户替换国产 CPU 的<strong>迁移成本最低、切换意愿最强</strong>。这轮逻辑的关键不是「英特尔涨价所以海光也能涨」，而是<strong>「交期」这个变量</strong>：数据中心客户等不起半年，缺货才是国产替代的真实推手。Agent 场景下 CPU:GPU 配比从 1:8 趋近 1:1，意味着单台服务器的 CPU 需求量成倍放大，这直接抬升了它所在市场的天花板。9/9 收 235.8 元、-0.46%，成交 39.7 亿，对隔夜美股英特尔 +9% 毫无反应。</div>\n    \n    <div class=\"confirm\">✔ 确认：10/5 英特尔涨价获正式确认 / 海光深算系列或新一代服务器 CPU 中标大型智算中心项目</div>\n    <div class=\"risk\">⚠️ 5481 亿市值已price in相当预期，边际弹性受限；先进制程产能受代工方约束</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>龙芯中科</b><span class=\"code\">688047</span><span class=\"tag\">纯自主指令集·信创弹性最大的CPU标的</span></div>\n    <div class=\"logic\">LoongArch 自主架构，信创政策直接受益 | 生态短板但自主可控纯度最高 | 405 亿市值弹性显著</div>\n    <div class=\"detail\">龙芯的独特之处是<strong>自主指令集 LoongArch</strong>——不依赖 x86 或 Arm 授权，这使它在<strong>信创与关基行业</strong>里具有不可替代性，是「自主可控」叙事下纯度最高的 CPU 标的。405 亿的市值在 CPU 三剑客中最小，<strong>单位份额提升的市值弹性最大</strong>。逻辑传导路径是：英特尔缺货涨价 → 国内采购方加速国产化 → 信创目录内的自主架构优先受益。约束也很明确：生态成熟度与软件适配仍是短板，因此它的放量更依赖<strong>政策驱动而非市场化替代</strong>。9/9 收 101 元、-1.35%，是当日 CPU 链跌幅最大的一只。</div>\n    \n    <div class=\"confirm\">✔ 确认：信创集采招标中龙芯份额提升 / 3A6000 系列在党政或行业市场放量</div>\n    <div class=\"risk\">⚠️ 生态适配是长期短板，市场化替代速度慢于 x86 阵营；业绩兑现节奏不稳定</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中国长城</b><span class=\"code\">000066</span><span class=\"tag\">参股飞腾 28.035%·国产CPU的另一条腿</span></div>\n    <div class=\"logic\">持有飞腾 28.035% 股份，ARM 架构国产 CPU | 整机+芯片一体化 | 469 亿市值、股价位置低</div>\n    <div class=\"detail\">中国长城的价值在于它是<strong>飞腾（Phytium）的主要权益方</strong>——持股 28.035%，飞腾是国产 ARM 架构服务器 CPU 的核心力量，与海光的 x86 路线形成双寡头。它的结构优势是<strong>「芯片+整机」一体化</strong>：既能享受芯片端的份额提升，又能通过自有整机业务把芯片直接变成收入，这在信创集中采购中是非常重要的交付能力。14.55 元的股价位置在整条 CPU 链里最低，<strong>是资金做低位映射时最容易选择的票</strong>。9/9 收跌 -0.27%，成交 11.1 亿，同样零反应。</div>\n    \n    <div class=\"confirm\">✔ 确认：飞腾新一代服务器 CPU 发布或大额中标 / 信创集采放量</div>\n    <div class=\"risk\">⚠️ 参股形式使其对飞腾业绩的权益计量存在折价；整机业务毛利率偏低，会稀释芯片弹性</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>澜起科技</b><span class=\"code\">688008</span><span class=\"tag\">内存接口芯片·服务器CPU直接配套</span></div>\n    <div class=\"logic\">CPU 与内存之间的互连芯片，出货量与服务器 CPU 出货强相关</div>\n    <div class=\"detail\">澜起做的是服务器 CPU 与 DRAM 之间的<strong>内存接口芯片</strong>，它的出货量与<strong>服务器 CPU 出货量高度绑定</strong>——CPU:GPU 配比从 1:8 趋近 1:1，意味着同样的机柜需要更多 CPU，也就需要更多内存接口芯片。这是本链条上<strong>「量增逻辑最干净」</strong>的环节：不参与 CPU 的价格竞争，只跟随服务器 CPU 出货量增长，且全球竞争格局稳定（DDR5 世代三家寡头）。9/9 收 195.3 元、-0.18%，几乎平盘。</div>\n    \n    \n    <div class=\"risk\">⚠️ 服务器整机出货节奏波动会直接影响其季度业绩；DDR5 渗透率已高，增量空间取决于 DDR5 第二子代</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中电港</b><span class=\"code\">001287</span><span class=\"tag\">元器件分销·涨价传导的体温计</span></div>\n    <div class=\"logic\">代理海外与国产芯片，CPU 缺货涨价的直接传导通道</div>\n    <div class=\"detail\">中电港是<strong>电子元器件授权分销龙头</strong>，代理线覆盖海外原厂与国产芯片。在缺货涨价周期里，分销商是<strong>价格传导的第一棒</strong>——原厂提价会先体现在分销的进货价与出货价上，库存重估也能带来阶段性收益。它的角色更像这条逻辑的<strong>「客观温度计」</strong>：CPU 涨价是否真实传导到国内渠道，看它的价格与周转比看厂商口径更快。9/9 +0.54%，是当日 CPU 链少数收红的标的。</div>\n    \n    \n    <div class=\"risk\">⚠️ 分销业务毛利率极薄，涨价带来的弹性有限；库存跌价风险在价格回落时反向放大</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>PC 整机与代工厂</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">2026 年全球 PC 出货预计降 6.1%–14%，在萎缩市场中 CPU 涨价是纯成本压力，终端难以完全转嫁，是明确的价格受损方。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>存储模组厂（9/9 已重挫）</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">存储是过去两年的涨价主线，本轮资金正从存储流向 CPU。虽然同为「涨价+缺货」，但两者是不同的供给周期，本档案不覆盖存储链。</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**海外映射级**涨价催化，涨价函已发但尚未生效。基准参照：2025 年存储涨价行情，A 股映射滞后美股 1-2 个交易日且需国内报价确认。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">海光信息 ＞ 龙芯中科 ＞ 中国长城。排序理由：海光是国内服务器 CPU 份额最高者、直接对标英特尔涨价；龙芯为自主架构但生态小；长城偏整机集成。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">拓维信息 ＞ 中天精装。gene：拓维是昇腾+信创复合题材老妖，在 CPU/信创涨价主题中常年充当情绪龙头；中天精装为跨界概念票，属典型末端。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若 10 月 5 日涨价如期落地并获官方确认**且**国内服务器 CPU 交付周期继续拉长 → 逻辑状态由「传闻映射」升为「涨价实锤」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 10/5 涨价如期落地并获英特尔确认 ② 国内服务器 CPU 交期继续超 6 个月、报价继续上行 ③ 海光/龙芯订单或报价出现跟涨。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 10/5 涨价未落地或被否认 ② 美股英特尔冲高回落、回吐 9/8 的 9% 涨幅 ③ 国内厂商未跟涨、交期缩短。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">10 月 5 日是全案唯一的硬时点——在那之前一切都只是涨价函。注意 PC 整机与代工厂、存储模组厂是**成本受损方**（9/9 存储模组已重挫），已列入剔除。另一个陷阱：英特尔涨价利好的是「有替代能力的国产 CPU」，不是「所有信创票」，两者的业绩弹性差一个数量级。</div></div></div>\n\n    \n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b><strong>10 月 5 日英特尔 PC CPU 涨价如期落地并获官方确认</strong>（关键时点）</b></li><li><b>国内服务器 CPU 交付周期继续拉长（超过 6 个月）、报价继续上行</b></li><li><b>海光信息、龙芯中科出现放量上涨，资金把 CPU 作为独立于存储的算力主线</b></li><li><b>国产 CPU 厂商在智算中心/运营商集采中中标份额提升的公开信息</b></li><li><b>英特尔正式宣布 Small Core 产品线 EOL，国产 Arm SoC 在 IPC/IoT 市场获得订单</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b><strong>10 月 5 日涨价未落地或被英特尔否认</strong>，传闻证伪</b></li><li><b>美股英特尔冲高回落、回吐 9/8 的 9% 涨幅，海外定价被撤回</b></li><li><b>国内服务器 CPU 交期缩短、报价回落，紧平衡缓解（则国产替代的紧迫性下降）</b></li><li><b>美国数据中心资本开支出现放缓信号（与 gas-turbine-aidc-orders 档案共振证伪）</b></li><li><b>A 股 CPU 链在 9/10 后依然完全无反应，映射链条被判定为无效</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">10 月 5 日</div><div class=\"wh\">英特尔 PC CPU 涨价是否如期落地并获正式确认</div><div class=\"wy\">本档案唯一清晰可证伪的时点，决定「变化」环能否闭合</div></div><div class=\"tkc\"><div class=\"w\">每月</div><div class=\"wh\">国内服务器 CPU 报价与交付周期（渠道/分销口径）</div><div class=\"wy\">交期是国产替代的真实推手，比原厂报价更关键</div></div><div class=\"tkc\"><div class=\"w\">10 月下旬</div><div class=\"wh\">海光信息、龙芯中科三季报中的服务器 CPU 出货与份额</div><div class=\"wy\">份额而非价格，才是国产 CPU 业绩弹性的来源</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">英特尔 Small Core EOL 进展与国产 Arm SoC 在 IPC/IoT 的补位情况</div><div class=\"wy\">被市场忽略的长尾市场机会，可能是本轮最大的隐藏弹性</div></div></div>\n\n    <div class=\"src\">数据来源：台湾《电子时报》(9/8) ｜ 财联社快讯(9/9 08:37) 与主题库 ｜ 国信证券 CPU 行业研报 ｜ 中原证券、湘财证券 CPU 观点 ｜ Tom's Hardware 至强 6980P 调价记录(7月) ｜ 陈立武摩根大通技术会议(5/19) ｜ AMD Advancing AI 大会（苏姿丰 2030 服务器 CPU 市场 2200 亿美元）｜ Wedbush 分析师 Matt Bryson ｜ 高盛/IDC/Gartner 2026 PC 出货预测 ｜ iFinD 盘面数据(9/9)</div>\n    <footer>英特尔CPU年内三连涨 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "storage-cell-capacity-control", "title": "储能电芯产能摸底", "date": "2026-09-09", "grade": "正式档", "pricing": "未定价", "crate": "bolt", "search": "储能电芯产能摸底 工信部·发改委·能源局三部门联合摸底 · 规划总产能破 2twh / 年底建成 1.2-1.5twh · 全行业加权开工率仅 65% · 未开工项目暂缓审批 政策驱动 ⚡ 供给侧调控型 · 政策已落地、电芯龙头完全零反应", "card": "<a class=\"card-c\" href=\"#storage-cell-capacity-control\" data-search=\"储能电芯产能摸底 工信部·发改委·能源局三部门联合摸底 · 规划总产能破 2twh / 年底建成 1.2-1.5twh · 全行业加权开工率仅 65% · 未开工项目暂缓审批 政策驱动 反内卷·供给侧调控 未定价 宁德时代 亿纬锂能 鹏辉能源 阳光电源 英维克\" data-grade=\"正式档\" data-pricing=\"未定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-09</span>\n    <span class=\"crate bolt\">⚡ 供给侧调控型 · 政策已落地、电芯龙头完全零反应 政策驱动</span>\n  </div>\n  <div class=\"ctitle\">储能电芯产能摸底</div>\n  <div class=\"csub\">工信部·发改委·能源局三部门联合摸底 · 规划总产能破 2TWh / 年底建成 1.2-1.5TWh · 全行业加权开工率仅 65% · 未开工项目暂缓审批</div>\n  <div class=\"cpos\">工信部·发改委·能源局三部门联合摸底储能电芯产能：规划总产能破 2TWh、开工率仅 65%，未开工项目暂缓审批；电芯龙头完全零反应。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">反内卷·供给侧调控</span>\n    \n    <span class=\"chip pri\">未定价</span>\n    <span class=\"chip\">标的 8</span>\n    <span class=\"nm\">宁德时代</span><span class=\"nm\">亿纬锂能</span><span class=\"nm\">鹏辉能源</span><span class=\"nm\">阳光电源</span><span class=\"nm\">英维克</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-09 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-09</div>\n    <h1>储能电芯产能摸底</h1>\n    <div class=\"sub\">工信部·发改委·能源局三部门联合摸底 · 规划总产能破 2TWh / 年底建成 1.2-1.5TWh · 全行业加权开工率仅 65% · 未开工项目暂缓审批</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 供给侧调控型 · 政策已落地、电芯龙头完全零反应</span>\n      <span class=\"badge neutral\">政策驱动</span>\n      <span class=\"badge neutral\">定价状态：未定价</span>\n      <span class=\"badge neutral\">主线：反内卷·供给侧调控</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">lithium-carbonate-glut</span></div>\n    <div class=\"posnote\">工信部·发改委·能源局三部门联合摸底储能电芯产能：规划总产能破 2TWh、开工率仅 65%，未开工项目暂缓审批；电芯龙头完全零反应。</div>\n    <details class=\"more\"><summary>展开定价状态详版（348 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化 9/6 财联社独家、9/8 贝壳财经扩散、9/9 08:34 盘前快讯，至 9/9 收盘已 3 个交易日。<strong>盘面状态</strong>：9/9 储能题材涨停 6 家，但<strong>全部是杂毛映射</strong>——精艺股份 2 板（主业铜加工）、远东股份（线缆）、华正新材（覆铜板）、新中港（热电），没有一只真正的电芯或系统标的。电芯与系统龙头<strong>集体零反应甚至翻绿</strong>：宁德时代 +0.40%、亿纬锂能 -0.91%、阳光电源 -0.97%、海博思创 -1.67%、鹏辉能源 -0.26%、派能科技 -0.34%、上能电气 +0.76%、科华数据 -0.40%。政策已从传闻走到落地，A 股电芯端<strong>完全未定价</strong>。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">9/6 财联社独家：有关部门启动储能产业<strong>全国产能摸底排查</strong>，储能电芯为排查核心，对<strong>现有产能与规划产能两套底数</strong>分别统计。9/8 贝壳财经从多家锂电企业确认，此次摸底由<strong>工信部、国家发改委、国家能源局三部门共同参与</strong>。调控思路为<strong>「抑增量、保存量」</strong>：对尚处规划阶段、未正式开工的项目<strong>暂缓审批和推进</strong>；已备案且在建项目<strong>不受影响</strong>。摸底完成后将按海内外真实需求动态调整审批尺度，并非永久锁死扩产。</div></div><div class=\"card fact\"><b class=\"k\">为什么盯住电芯</b><div class=\"v\">电芯是储能系统中<strong>最大的成本项</strong>。高特电子(301669)上市文件披露：新型储能系统中<strong>电芯成本占比约 60%</strong>，PCS 20%、EMS 10%、BMS 5%。电芯价格直接决定系统造价与利润分配——「储能集成商完全是在给上游电芯厂打工」。<strong>卡住电芯的新增产能，就卡住了整条链的价格战源头。</strong></div></div><div class=\"card fact\"><b class=\"k\">过剩有多严重</b><div class=\"v\">安泰科口径（截至 2026 年 8 月）：储能电芯<strong>年底建成产能预计 1.2–1.5TWh</strong>，<strong>全行业规划总产能突破 2TWh</strong>；远景高级副总裁田庆军称今年规划扩产已超 800GWh，「已远远超越全球市场的真实需求」。行业<strong>两极分化</strong>：头部优质产能接近满产，中小低端产线开工<strong>不足 50%</strong>，全行业<strong>加权产能利用率仅 65% 左右</strong>。头部对照——2026H1 宁德时代产能利用率 <strong>96.9%</strong>、亿纬锂能 <strong>86.18%</strong>。</div></div><div class=\"card fact\"><b class=\"k\">需求侧并不弱</b><div class=\"v\">矛盾在于<strong>需求真爆发、供给更疯狂</strong>。2026H1 全球储能电芯出货 <strong>461GWh、同比 +71%</strong>；2026H1 我国储能电池产量突破 <strong>400GWh、同比翻倍</strong>；1–5 月国内新型储能累计招标规模破 <strong>100GWh、同比 +120%</strong>。「十五五」明确新增新型储能约 <strong>1.6 亿千瓦</strong>、2030 年总规模 <strong>3 亿千瓦</strong>。亿纬锂能 8 月电话会：储能<strong>在手订单已超过现有产能</strong>。</div></div><div class=\"card fact\"><b class=\"k\">反内卷政策链条</b><div class=\"v\">本轮摸底不是孤立动作，是<strong>一年半政策链的收口</strong>：2025/11/28 工信部动力和储能电池座谈会提出「依法依规治理非理性竞争」→ 2026/1/7 工信部+发改委+市场监管总局+能源局四部门座谈（16 家企业参会）→ 2026/4/9 四部门再座谈<strong>明确提出「持续深入推进产能预警调控」</strong> → 7/17 财政部等发布电池消费税调整（<strong>9/1 起半税 2%、一年后全税 4%</strong>）→ 9/6 产能摸底落地。从「开会喊话」到「税收」再到「审批」，工具逐级加码。</div></div><div class=\"card fact warn\"><b class=\"k\">争议点</b><div class=\"v\"><strong>政策管的是「纸面规划」，不是「存量过剩」。</strong>已备案在建项目不受限制，后续仍有大量 <strong>500Ah 以上大容量电芯</strong>产能持续投产，短期供给压力不会快速消解。安泰科明确：政策<strong>不会立刻解决当下存量过剩</strong>，核心作用是管住远期增量、缓解供需剪刀差。且政策<strong>具备弹性</strong>——若海内外需求超预期爆发，规划项目审批存在边际放松空间。对电芯厂而言是<strong>「远期利好、近期中性」</strong>。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/9 储能题材涨停 6 家、最高 2 板，但<strong>领涨的全是杂毛</strong>：精艺股份 2 板（主业铜加工）、远东股份（电缆）、华正新材（覆铜板）、新中港（热电），无一只电芯或储能系统标的。真正的受益端<strong>集体零反应</strong>：宁德时代 +0.40%（成交 129.6 亿）、亿纬锂能 -0.91%、阳光电源 -0.97%、海博思创 -1.67%、鹏辉能源 -0.26%、派能科技 -0.34%、上能电气 +0.76%、科华数据 -0.40%、盛弘股份 -0.50%、英维克 -0.90%。政策 9/6 落地、9/8 扩散、9/9 盘前见快讯，<strong>三天内 A 股电芯端未给出任何定价反应</strong>。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-09</div><div><div class=\"x\">储能电芯产能摸底：工信部·发改委·能源局三部门联合摸底 · 规划总产能破 2TWh / 年底建成 1.2-1.5TWh · 全行业加权开工</div><div class=\"y\">为什么：本档为「反内卷·供给侧调控」的建档时点，后续二段催化均在此之上叠加</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是<strong>「供给侧调控型」</strong>催化，性质上等同于光伏、水泥、玻璃的反内卷，但落点在储能。<strong>三个要害</strong>：一是<strong>调控对象决定了受益结构</strong>——只卡「未开工的规划项目」，意味着<strong>已建成的头部产能稀缺性上升</strong>，而在建的中小产能仍会投放，所以这不是普涨逻辑，是<strong>集中度提升逻辑</strong>，「剩者为王」而非「齐涨共跌」；二是<strong>时间尺度错配</strong>——政策改变的是<strong>远期供给预期</strong>（一年建设周期之后的产能），不改变当下的存量过剩，因此它对<strong>估值端（盈利预期修复）的作用快于对业绩端的作用</strong>；三是<strong>传导的关键约束在需求侧</strong>——若需求增速跟不上，限产只是把价格战推迟，而非消除。<strong>隐藏面</strong>：本次管控<strong>只约束同质化磷酸铁锂电芯</strong>，钠离子电池、液流电池等差异化长时储能路线受审批限制小，PCS/BMS/温控/系统集成不在管控范围——<strong>真正的政策豁免区恰恰在电芯之外</strong>，这与直觉相反。<br>① <strong>分水岭时点</strong>：摸底完成后的<strong>正式产能调控文件</strong>（是否从「暂缓审批」升级为「总量指标/准入名单」），决定这是温和预警还是硬约束。<br>② <strong>传导的关键约束</strong>：已备案在建产能仍将持续投放 500Ah+ 大电芯，短期供给压力客观存在，盈利修复是<strong>循序渐进而非立刻反转</strong>。<br>③ <strong>待验证的核心变量</strong>：储能电芯现货价格与行业月度开工率——价格止跌回升 + 开工率从 65% 上移，才算逻辑真正兑现。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>9/6 财联社独家、9/8 贝壳财经从多家锂电企业交叉确认，非传闻</li><li>抑增量保存量：未开工项目暂缓审批，措施具体可执行</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">结构性</span><ul><li>规划产能 2TWh vs 全球真实需求，过剩剪刀差客观存在</li><li>只卡增量不砍存量，受益向头部与豁免环节集中而非普惠</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">远期</span><ul><li>电芯建设周期约一年，政策对报表的改善最快落在 2027 年</li><li>存量过剩未解，2026H2 价格与盈利仍承压</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">未动</span><ul><li>9/9 宁德 +0.40%、亿纬 -0.91%、阳光电源 -0.97%、海博思创 -1.67%</li><li>涨停 6 家全是杂毛映射，电芯与系统龙头零反应</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响结构性、业绩在远期、股价完全未动——四环的前两环最硬，后两环需要时间与价格数据补上。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>65%</strong>：「变化」「影响」两环证据充分；「业绩」环最弱，政策只改远期预期不改当期报表；「股价」环是完全空白，反而构成最大的预期差。</li><li><strong>边界要切开</strong>：受益的是<strong>①已建成、高开工率的头部电芯产能</strong>（宁德、亿纬——产能稀缺性上升）与<strong>②政策豁免环节</strong>（PCS、BMS、温控、系统集成、钠电/液流）；不受益甚至受损的是<strong>③靠规划产能「跑马圈地」的二三线电芯厂</strong>（弯道超车路径被锁）与<strong>④外采电芯的中小系统集成商</strong>（电芯一旦止跌回升，其成本端先承压、售价端传导滞后）。</li><li><strong>主线联动</strong>：与 phosphate-export（磷肥出口）档案构成<strong>「磷源—磷酸铁锂—储能电芯」同一产业链的上下游</strong>——磷化工的磷源需求一半来自磷酸铁锂储能电池，本档案若压制电芯扩产，会反向影响磷源的需求节奏，两者需要交叉验证；与 gas-turbine-aidc-orders、ai-compute-hike 同属<strong>「AI 算力电力配套」大主线</strong>——AIDC 用电缺口 → 燃气发电与储能配套需求，是储能需求侧最陡的那一段斜率。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 政策驱动</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>宁德时代</b><span class=\"code\">300750</span><span class=\"tag\">产能利用率 96.9%·稀缺产能第一受益</span><span class=\"cap\">305.48 元 · 流通 1.30 万亿 · 9/16 -3.44%</span></div>\n    <div class=\"logic\">电芯绝对龙头·存量产能即壁垒</div>\n    <div class=\"detail\">全球动力与储能双龙头，2026H1 产能利用率 96.9%，是行业 65% 加权开工率的极端反面。调控锁死二三线新建路径，它的已建成高开工产能稀缺性上升，集中度加速向它收敛。9/9 仅 +0.40%，集中度逻辑未定价。</div>\n    \n    \n    <div class=\"risk\">⚠️ 1.59 万亿市值，边际弹性有限；动力电池稀释储能纯度</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>亿纬锂能</b><span class=\"code\">300014</span><span class=\"tag\">在手订单超产能·储能纯度最高的大厂</span><span class=\"cap\">48.66 元 · 流通 1028 亿 · 9/16 +0.62%</span></div>\n    <div class=\"logic\">订单跑在产能前·中报开工 86.18%</div>\n    <div class=\"detail\">8 月电话会明确储能订单已超现有产能，明年增长取决于产能释放。它既是潜在受限方（新项目需报批），又是无序扩产终结的最大受益方——因为它的扩张是需求驱动而非跑马圈地。9/9 -0.91%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 自身扩产若被暂缓，出货指引可能下修</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>鹏辉能源</b><span class=\"code\">300438</span><span class=\"tag\">小储电芯纯正标的·单位产能弹性最大</span><span class=\"cap\">51.60 元 · 流通 209 亿 · 9/16 +1.88%</span></div>\n    <div class=\"logic\">储能纯度高·271 亿市值弹性大</div>\n    <div class=\"detail\">A 股储能电芯纯度最高的中小市值标的，不被动力/消费业务稀释。政策锁死新增规划产能 → 现有产能重置成本上升 → 单位产能市值锚上移，它的弹性最显著。9/9 -0.26%，成交 8.7 亿。</div>\n    \n    \n    <div class=\"risk\">⚠️ 客户偏中小集成商，议价能力弱于头部</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 政策驱动</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>阳光电源</b><span class=\"code\">300274</span><span class=\"tag\">豁免环节但成本端反向承压</span><span class=\"cap\">85.18 元 · 流通 1352 亿 · 9/16 +0.95%</span></div>\n    <div class=\"logic\">PCS+集成·电芯涨价是成本不是收入</div>\n    <div class=\"detail\">配套环节虽不在管控范围，但电芯止跌回升对它首先是采购成本上升。是「受益于行业不乱、承压于电芯涨价」的双面角色，不能简单划入受益侧。9/9 -0.97%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 成本传导滞后挤压毛利</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>英维克</b><span class=\"code\">002837</span><span class=\"tag\">储能温控·完全豁免环节</span><span class=\"cap\">62.03 元 · 流通 704 亿 · 9/16 +3.66%</span></div>\n    <div class=\"logic\">需求跟装机量不跟电芯价</div>\n    <div class=\"detail\">温控完全不在电芯管控范围，需求驱动是装机量而非电芯价格，是链条上「不参与内卷、只跟随量增」的干净环节。9/9 -0.90%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 温控竞争者众多；数据中心业务稀释纯度</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>上能电气</b><span class=\"code\">300827</span><span class=\"tag\">PCS 变流器·不在管控范围</span><span class=\"cap\">24.14 元 · 流通 105 亿 · 9/16 +2.07%</span></div>\n    <div class=\"logic\">储能 PCS 主要供应商之一</div>\n    <div class=\"detail\">PCS 占系统成本约 20%，不在本次电芯管控范围内，随装机量增长而受益，不受电芯价格战直接冲击。9/9 +0.76%，是当日少数收红的储能链标的。</div>\n    \n    \n    <div class=\"risk\">⚠️ PCS 环节自身也存在价格竞争</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 政策驱动</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>精艺股份</b><span class=\"code\">002295</span><span class=\"tag\">9/9 储能题材最高板（2板）</span><span class=\"cap\">9.68 元 · 流通 24 亿 · 9/16 +4.65%</span></div>\n    <div class=\"logic\">主业铜加工·储能概念纯度低</div>\n    <div class=\"detail\">9/9 储能题材名义上的最高标（2 板），但主业是<strong>铜加工</strong>，与储能电芯产能调控的传导链<strong>没有实质关系</strong>——它同时挂在金属铜题材下，9/9 金属铜涨停 2 家。它的涨停更可能是铜价逻辑（LME 铜创历史新高 14779 美元）而非储能逻辑。</div>\n    <div class=\"gene\">🧬 题材基因：铜加工小盘，历次铜价行情中的情绪弹性品种；同时挂靠多个题材，是典型的「概念交集型」情绪票</div>\n    \n    <div class=\"risk\">⚠️ 与储能调控逻辑无实质传导关系，涨停是题材标签的误挂</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>新中港</b><span class=\"code\">605162</span><span class=\"tag\">9/9 涨停·热电+储能标签</span><span class=\"cap\">11.09 元 · 流通 49 亿 · 9/16 -3.98%</span></div>\n    <div class=\"logic\">热电联产企业，挂绿色电力与储能标签</div>\n    <div class=\"detail\">9/9 挂在储能与绿色电力双题材下涨停，但主业是<strong>热电联产</strong>，与电芯产能调控无传导关系。属于当日储能涨停 6 家中典型的标签型跟涨。</div>\n    <div class=\"gene\">🧬 题材基因：小盘热电股，历次电力/储能题材中的低位补涨品种</div>\n    \n    <div class=\"risk\">⚠️ 主业与储能电芯无关，纯标签映射</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2024–2025 光伏反内卷：工信部多次座谈会 + 产能预警 → 硅料价格从 4 万元/吨触底回升，通威、大全能源走出一轮趋势——<strong>「开会喊话→产能预警→价格修复」的路径已有完整先例</strong>，本轮储能走的正是同一条路。</li><li>2021–2022 锂电扩产潮：碳酸锂从 5 万涨到 60 万元/吨，全行业疯狂扩产，随后 2023–2024 产能集中释放引发价格战，电芯价格腰斩——这是本轮监管出手的历史成因。</li><li>2025/11 与 2026/1 两次锂电池座谈会后：板块均未出现持续行情，说明<strong>市场对「会议式反内卷」已脱敏</strong>，本轮的不同之处在于首次落到<strong>审批环节</strong>（暂缓审批），工具强度明显更高。</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>宁德时代</b><span class=\"code\">300750</span><span class=\"tag\">电芯绝对龙头·产能利用率 96.9%·稀缺性受益第一档</span></div>\n    <div class=\"logic\">全球储能电芯出货第一 | 存量产能即壁垒，新增受限反而加固优势 | 大市值弹性温和</div>\n    <div class=\"detail\">全球动力与储能电池双料龙头，2026H1 产能利用率 <strong>96.9%</strong>，是全行业 65% 加权开工率的极端反面——这恰恰说明它的产能<strong>不是过剩产能，而是稀缺产能</strong>。本轮调控只卡「未开工的规划项目」，等于把二三线厂商靠新建产能弯道超车的路径锁死，而它已建成的高开工产能稀缺性进一步上升，行业集中度向它加速收敛。逻辑的独特性在于：它是<strong>唯一同时受益于「供给出清」与「需求爆发」</strong>的标的——2026H1 全球储能电芯出货 461GWh 同比 +71%，需求斜率并不弱。9/9 它仅 +0.40%（成交 129.6 亿），市场尚未将这层集中度逻辑计入。</div>\n    \n    <div class=\"confirm\">✔ 确认：后续出台正式产能准入/总量调控文件 / 储能电芯报价止跌回升</div>\n    <div class=\"risk\">⚠️ 1.59 万亿市值，政策带来的边际盈利改善对整体弹性有限；动力电池业务占比高会稀释储能纯度</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>亿纬锂能</b><span class=\"code\">300014</span><span class=\"tag\">在手订单超产能·储能弹性最纯的大厂</span></div>\n    <div class=\"logic\">储能订单已超现有产能 | 扩产节奏被政策约束，反而凸显在手产能价值 | 中报产能利用率 86.18%</div>\n    <div class=\"detail\">亿纬的独特位置在于<strong>「订单已经跑在产能前面」</strong>——8 月中旬电话会明确表示储能<strong>在手订单已超过现有产能</strong>，明年出货增长主要取决于产能释放节奏，公司当前首要任务是确保新规划产能按期建成投产。这就产生了一个<strong>反直觉的矛盾点</strong>：它既是产能调控的潜在受限方（新项目需报批），又是最能从「行业不再无序扩产」中受益的一方——因为它的订单真实性最高，扩张是<strong>需求驱动而非跑马圈地</strong>。2026H1 产能利用率 86.18%，在头部中仅次于宁德。9/9 收跌 -0.91%，逻辑与股价完全脱钩。</div>\n    \n    <div class=\"confirm\">✔ 确认：公司公告新产能项目获批/投产进度 / 储能电芯中标价格环比上行</div>\n    <div class=\"risk\">⚠️ 自身扩产计划若被暂缓审批，短期出货增速指引可能下修——这是本档案中最大的不对称风险</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>鹏辉能源</b><span class=\"code\">300438</span><span class=\"tag\">小储电芯纯正标的·产能弹性最大</span></div>\n    <div class=\"logic\">储能电芯业务纯度高 | 市值 271 亿，产能价值重估弹性显著 | 客户结构偏中小集成商</div>\n    <div class=\"detail\">在头部大厂之外，鹏辉是 A 股<strong>储能电芯业务纯度最高</strong>的中小市值标的——不像宁德（动力为主）、亿纬（动力+消费+储能）那样被其他业务稀释，它的储能电芯收入占比显著更高，因此<strong>单位产能价值重估的弹性最大</strong>。逻辑链条是：政策锁死新增规划产能 → 现有合规产能的<strong>重置成本上升</strong> → 单位产能对应的市值锚上移。它的客户结构偏中小储能集成商，这与「外采电芯的集成商成本承压」并不矛盾——电芯价格止跌对集成商是压力，对电芯厂是利润修复。9/9 收跌 -0.26%，成交 8.7 亿，未获资金关注。</div>\n    \n    <div class=\"confirm\">✔ 确认：储能电芯报价连续两周上行 / 行业月度开工率从 65% 上移</div>\n    <div class=\"risk\">⚠️ 客户结构偏中小集成商，议价能力弱于头部；若行业价格战延续，其现金流承压先于头部</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>阳光电源</b><span class=\"code\">300274</span><span class=\"tag\">系统集成龙头·政策豁免但成本端反向承压</span></div>\n    <div class=\"logic\">PCS+系统集成不在管控范围，但电芯涨价对其是成本而非收入</div>\n    <div class=\"detail\">这是本档案<strong>最容易被误读的一环</strong>。系统集成与 PCS 确实不在电芯管控范围内，安泰科也明确指出配套环节「景气度确定性更高」——但方向是反的：阳光电源在财报中把电芯等原材料价格波动列为<strong>主要风险</strong>，电芯价格一旦因供给调控而止跌回升，对它首先是<strong>采购成本上升</strong>，能否向下游传导取决于系统报价。所以它是「确定性受益于行业不乱」但「短期承压于电芯涨价」的双面角色，不能简单划入受益侧。9/9 收跌 -0.97%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 电芯涨价传导滞后会挤压集成环节毛利；海外贸易壁垒是独立变量</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>英维克</b><span class=\"code\">002837</span><span class=\"tag\">储能温控·政策完全豁免环节</span></div>\n    <div class=\"logic\">温控不在电芯管控范围，需求跟随装机量而非电芯价格</div>\n    <div class=\"detail\">储能温控属于系统配套，<strong>完全不在本次电芯管控范围内</strong>，且它的需求驱动是<strong>装机量而非电芯价格</strong>——只要储能装机继续增长（2026H1 国内产量翻倍、招标 +120%），温控需求就同步扩张，不受电芯价格战影响。这使它成为整个链条上<strong>「不参与内卷、只跟随量增」</strong>的干净环节。9/9 收跌 -0.90%，成交 23.2 亿。</div>\n    \n    \n    <div class=\"risk\">⚠️ 温控环节竞争者众多，价格竞争同样存在；与数据中心温控业务混合会稀释储能纯度</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>靠规划产能跑马圈地的二三线电芯厂</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">本次调控的<strong>直接受限方</strong>：无实质订单、单纯靠备案规划项目抢占赛道的企业，其弯道超车路径被阻断，未来新增产能审批或绑定下游真实订单。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>外采电芯的中小系统集成商</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">电芯占系统成本 60%，电芯价格一旦因供给调控上行，外采型集成商成本先承压而系统售价传导滞后，短期是明确的成本受损方。</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**供给侧调控型**政策（反内卷主线），从预警到硬约束之间还差一份正式文件。基准参照：2021 年能耗双控、2016 年供给侧改革，均是「摸底→通报→硬约束」三段式。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">宁德时代 ＞ 亿纬锂能 ＞ 鹏辉能源。排序理由：产能规模与行业地位决定在准入名单中的话语权，龙头受益于准入门槛抬升（限制新进入者）。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">精艺股份 ＞ 新中港。gene：储能概念小盘，在历次储能政策催化中作为末端补涨票出现，属政策主题第三波品种。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若摸底后出台**正式产能调控文件**（总量指标/准入名单/能耗门槛）**且**储能电芯现货连续两周止跌回升 → 逻辑状态由「政策预警」升为「硬约束落地」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 正式产能调控文件出台（总量指标/准入名单/能耗门槛） ② 储能电芯现货报价连续两周止跌回升（280Ah/314Ah） ③ 未开工项目实质暂停。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 摸底结束仅形成「情况通报」而无后续约束文件 ② 500Ah+ 大容量电芯如期大规模投产、价格继续下行 ③ 开工率跌破 60%。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">「摸底」两个字最关键——它是政策三段式的第一步，不是约束本身。2TWh 规划产能 vs 65% 开工率的矛盾确实存在，但从摸底到正式文件通常隔 1-2 个月。本档与 lithium-carbonate-glut（锂价让利）、phosphate-export（出口配额）同属供给侧调控主线，可交叉验证政策力度。二三线电芯厂与外采电芯的系统集成商是受损方，已列入剔除。</div></div></div>\n\n    \n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>摸底完成后出台<strong>正式产能调控文件</strong>（总量指标/准入名单/能耗门槛），从「暂缓审批」升级为硬约束</b></li><li><b>储能电芯现货报价连续两周止跌回升（280Ah/314Ah 口径）</b></li><li><b>行业月度加权开工率从 65% 上移至 70% 以上，中小低端产线加速退出</b></li><li><b>宁德时代、亿纬锂能等电芯龙头出现放量上涨，资金开始按集中度逻辑而非涨价弹性定价</b></li><li><b>钠电、液流等差异化长时储能路线获得独立政策或项目倾斜</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>摸底结束仅形成「情况通报」而无后续约束文件，政策停留在预警层面</b></li><li><b>500Ah+ 大容量电芯如期大规模投产，电芯价格继续下行、开工率跌破 60%</b></li><li><b>规划项目审批在摸底后快速放松，政策弹性压过约束</b></li><li><b>2026H2 储能招标增速回落（较 1–5 月的 +120% 明显降速），需求侧无法承接存量产能</b></li><li><b>9 月储能板块持续只有杂毛涨停、龙头继续滞涨，资金始终不认可该逻辑</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">9 月中下旬</div><div class=\"wh\">产能摸底排查结果是否形成正式文件或准入名单</div><div class=\"wy\">决定这是温和预警还是硬约束，全档案最关键的分水岭</div></div><div class=\"tkc\"><div class=\"w\">每月</div><div class=\"wh\">储能电芯现货报价（280Ah/314Ah）与行业月度加权开工率</div><div class=\"wy\">业绩环能否闭合的唯一客观量度，65% 是否上移</div></div><div class=\"tkc\"><div class=\"w\">10 月起</div><div class=\"wh\">财政部电池消费税 2% 半税落地后的价格传导情况</div><div class=\"wy\">税收与审批是反内卷的两把刀，需交叉验证是否同向发力</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">国内新型储能月度招标规模（对比 1–5 月 +120% 的增速）</div><div class=\"wy\">需求侧是政策能否转化为盈利的最终约束</div></div></div>\n\n    <div class=\"src\">数据来源：财联社独家(9/6) ｜ 新京报贝壳财经(9/8) ｜ 安泰科储能电芯产能专题(9/7) ｜ 高特电子(301669)上市文件 ｜ 远景高级副总裁田庆军公开表态 ｜ 宁德时代/亿纬锂能 2026 中报与电话会 ｜ 财政部等电池消费税公告(7/17) ｜ iFinD 盘面数据(9/9)</div>\n    <footer>储能电芯产能摸底 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "ai-compute-hike", "title": "云厂商集体上调算力价", "date": "2026-09-08", "grade": "正式档", "pricing": "未定价", "crate": "warn", "search": "云厂商集体上调算力价 腾讯/阿里/百度智能云密集调价 · 部分服务最高涨幅超 30% 证伪型 ⚠ 风险信号", "card": "<a class=\"card-c\" href=\"#ai-compute-hike\" data-search=\"云厂商集体上调算力价 腾讯/阿里/百度智能云密集调价 · 部分服务最高涨幅超 30% 证伪型 ai算力与电力配套 未定价 （无 a 股标的） 中京电子 华脉科技\" data-grade=\"正式档\" data-pricing=\"未定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-08</span>\n    <span class=\"crate warn\">⚠ 风险信号 证伪型</span>\n  </div>\n  <div class=\"ctitle\">云厂商集体上调算力价</div>\n  <div class=\"csub\">腾讯/阿里/百度智能云密集调价 · 部分服务最高涨幅超 30%</div>\n  <div class=\"cpos\">腾讯/阿里/百度智能云密集调价、部分服务涨超 30%；但 A 股无纯受益标的——涨价更像成本转嫁，是标题利好、内容存疑。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">AI算力与电力配套</span>\n    \n    <span class=\"chip pri\">未定价</span>\n    <span class=\"chip\">标的 3</span>\n    <span class=\"nm\">（无 A 股标的）</span><span class=\"nm\">中京电子</span><span class=\"nm\">华脉科技</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-08 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-08</div>\n    <h1>云厂商集体上调算力价</h1>\n    <div class=\"sub\">腾讯/阿里/百度智能云密集调价 · 部分服务最高涨幅超 30%</div>\n    <div class=\"badges\">\n      <span class=\"badge warn\">⚠ 风险信号</span>\n      <span class=\"badge neutral\">证伪型</span>\n      <span class=\"badge neutral\">定价状态：未定价</span>\n      <span class=\"badge neutral\">主线：AI算力与电力配套</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">deepseek-chain</span><span class=\"tag\" style=\"margin-right:4px\">gas-turbine-aidc-orders</span><span class=\"tag\" style=\"margin-right:4px\">intel-cpu-price-hike</span><span class=\"tag\" style=\"margin-right:4px\">mlcc-murata-eol</span><span class=\"tag\" style=\"margin-right:4px\">optical-chip-shortage</span><span class=\"tag\" style=\"margin-right:4px\">power-semi-hike3</span></div>\n    <div class=\"posnote\">腾讯/阿里/百度智能云密集调价、部分服务涨超 30%；但 A 股无纯受益标的——涨价更像成本转嫁，是标题利好、内容存疑。</div>\n    <details class=\"more\"><summary>展开定价状态详版（141 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化的直接受益方是云厂商本身（腾讯、阿里、百度），均不在 A 股上市。A 股可对应的 IDC、光模块、服务器等环节属间接映射，其受益需经过「云厂商资本开支」这一层，传导距离较长。目前该环节尚未出现与提价幅度直接对应的定价锚。本档案作为「反面档案」收录，记录一条传导关系不成立的链条。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">2026 年以来，腾讯云、阿里云、百度智能云等云计算厂商及 AI 服务商<strong>密集上调算力产品价格，部分服务最高涨幅超过 30%</strong>。报道将其定性为「一场席卷算力产业链的供需博弈」，而非简单的价格调整。</div></div><div class=\"card fact\"><b class=\"k\">短期驱动</b><div class=\"v\">AI 推理需求扩张，算力从「卖资源」转向「卖 token」，单位算力价值重估。供给端受高端芯片与数据中心电力/机柜资源约束，形成阶段性卖方市场。</div></div><div class=\"card fact\"><b class=\"k\">供给刚性</b><div class=\"v\">高端算力受芯片供给与数据中心电力、机柜资源双重约束，短期新增供给弹性有限。此为产业共识，<strong>本档案未获取到可量化的产能缺口数字，标注待补</strong>。</div></div><div class=\"card fact\"><b class=\"k\">需求长逻辑</b><div class=\"v\">推理算力需求属年度级别的结构性增长，云厂商提价具备持续性基础。若提价能够维持，云业务毛利率应相应抬升——这是后续唯一的客观验证口径。</div></div><div class=\"card fact warn\"><b class=\"k\">争议点</b><div class=\"v\"><strong>涨价 ≠ 提价能力，可能是成本转嫁。</strong>云厂商涨价有可能源于芯片/电力成本上行的被动转嫁，而非定价权提升；若为前者，毛利率不会改善。此外「部分服务最高涨幅超 30%」是<strong>样本不透明的最大值表述</strong>，不代表整体涨幅水平，存在被放大的可能。</div></div><div class=\"card fact\"><b class=\"k\">A股映射</b><div class=\"v\">按传导距离划分：①<strong>云服务商</strong>——直接受益方，均不在 A 股（腾讯/阿里/百度）；②<strong>IDC 与算力基础设施</strong>——承接云厂商资本开支，传导需一层；③<strong>光模块与网络设备</strong>——数据中心互联配套，传导需一层；④<strong>服务器与 PCB</strong>——硬件采购，传导需一层；⑤<strong>电力与散热配套</strong>——数据中心运营配套。②至⑤的受益程度取决于资本开支规模，而非云厂商的提价幅度。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-08</div><div><div class=\"x\">云厂商集体上调算力价：腾讯/阿里/百度智能云密集调价 · 部分服务最高涨幅超 30%</div><div class=\"y\">为什么：本档为「AI算力·云定价」的建档时点，后续二段催化均在此之上叠加</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">① <strong>分水岭时点</strong>：三季报云业务毛利率。若毛利率同比提升，说明涨价来自定价权；若持平或下降，则为成本转嫁，逻辑性质改变。<br>② <strong>传导的关键约束</strong>：真正受益的是云厂商本身，而 A 股可对应环节属间接映射——中间隔着「云厂商资本开支决策」这一层。资本开支取决于盈利与战略规划，与当期提价幅度并无直接函数关系，历史上多次出现「云厂商提价、A 股算力设备环节不跟随」的情况。<br>③ <strong>待验证的核心变量</strong>：国内云厂商是否上修资本开支指引。这是把提价传导到 A 股硬件与基础设施环节的唯一桥梁。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>云厂商密集调价、部分服务最高涨超 30%，有多方报道</li><li>涨价是已发生的事实，不是预期</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">断裂</span><ul><li>直接受益方腾讯/阿里/百度均不在 A 股</li><li>A 股环节受益取决于资本开支，与提价幅度无直接关系</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">存疑</span><ul><li>可能是芯片/电力成本上涨的被动转嫁，毛利率不一定改善</li><li>「最高涨 30%」为最大值口径，样本不透明，无法推算整体</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">待观察</span><ul><li>本档案不以当日收盘数据判断——盘后催化映射的是次日盘面</li><li>观察点在次日 IDC/光模块等环节的定价反应</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响断裂、业绩存疑、股价待观察——四环中「影响」环在受益主体上就断开了，这是本档案闭合度最低的原因。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>40%</strong>：这是档案库中闭合度最低的一份，收录价值在于记录一条<strong>传导关系不成立</strong>的链条，避免后续重复推演。</li><li><strong>边界要切开</strong>：受益的是<strong>云厂商本身</strong>（定价权+毛利率），不在 A 股；A 股的 IDC/光模块/服务器属于「卖铲子」，其订单取决于资本开支而非提价幅度，滞后至少两个季度。</li><li>识别要点：当一个催化的直接受益主体不在 A 股时，需要明确回答「A 股这层靠什么赚钱」——本例中答案是资本开支，而资本开支尚未出现上修证据，因此链条停在「影响」环。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· —</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>（无 A 股标的）</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">直接受益方为腾讯/阿里/百度，均不在 A 股</div>\n    \n    \n    \n    \n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中京电子</b><span class=\"code\">002579</span><span class=\"cap\">19.65 元 · 流通 115 亿 · 9/16 +5.65%</span></div>\n    <div class=\"logic\">数据中心 PCB，承接资本开支</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>华脉科技</b><span class=\"code\">603042</span><span class=\"cap\">17.16 元 · 流通 36 亿 · 9/16 +10.00%</span></div>\n    <div class=\"logic\">通信网络物理连接设备</div>\n    \n    \n    \n    \n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2023 ChatGPT 行情：A 股算力相关标的在两个月内出现大幅上涨，随后普遍回吐六成以上，期间云厂商并未同步提价——说明当时的定价由预期驱动而非业绩。</li><li>2024 Sora/CPO 行情：有海外真实订单的企业与纯概念标的走势明显分化，前者走业绩趋势、后者走脉冲。</li><li>2025 国产算力行情：芯片与服务器环节走趋势，IDC/算力租赁概念多为脉冲行情，缺乏持续性。</li></ul></div>\n    \n    \n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>主业与算力无关的「名字票」</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">如主业为照明工程、地产等而名称或概念上嫁接算力的标的。其与云厂商提价之间无业务关联，传导链上找不到对应的环节与收入科目。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>以提价幅度直接推算 IDC/硬件订单的推演</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">IDC 与硬件订单来自资本开支预算，与云服务的销售价格分属不同决策链条，不能直接换算。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>成本转嫁情形下的「受益」表述</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">若涨价源于芯片/电力成本上行，则云厂商自身毛利率不改善，A 股环节的传导前提也不成立。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>概念层面关联的算力服务票</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">国脉科技、生意宝等，与提价无业务关联度未经核实</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">涨价实锤但性质存疑的**证伪型**题材。基准参照：2024 年云厂商降价周期结束后的第一轮提价，当时 IDC 与硬件链 5 日内见顶回落。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">本档无合格主攻（A 股缺少纯云定价受益标的）。若必须排序：中京电子 ＞ 华脉科技——仅因 PCB/光模块配套受资本开支拉动，传导最远。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">无。名字票（中京电子/华脉科技）历史上只在算力主题第三波才被资金想起，本轮未见板块热度支撑。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若云厂商上修资本开支指引**且**三季报云业务毛利率同比提升 → 逻辑状态由「成本转嫁存疑」升为「定价权确认」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 国内云厂商上修资本开支或公告新建数据中心 ② 三季报云业务毛利率同比提升 ③ 上游服务器/交换机订单同步放量。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 三季报云业务毛利率同比持平或下降 ② 资本开支指引未变或下调 ③ 涨价被官方表述为「成本传导」。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">最大的坑是把「云涨价」直接等价于「算力链受益」——本轮提价的三家均为 IaaS 层，成本端是 GPU 与电力，涨价恰恰说明它们在转嫁成本而非获得定价权。盯盘只看一个指标：三季报云业务毛利率方向。毛利率不扩张，整条逻辑就是空转。</div></div></div>\n\n    \n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>国内云厂商上修资本开支指引或公告新建数据中心项目</b></li><li><b>三季报云业务毛利率同比提升（区分定价权与成本转嫁）</b></li><li><b>算力硬件环节出现订单增长的公开证据（招标、产能扩张公告）</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>三季报云业务毛利率同比持平或下降，涨价被确认为成本转嫁</b></li><li><b>云厂商资本开支指引未变或下调</b></li><li><b>「最高涨 30%」被证实为个别长尾服务，整体调价幅度显著更低</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">三季报（10 月下旬起）</div><div class=\"wh\">云厂商云业务毛利率与资本开支数据</div><div class=\"wy\">区分定价权与成本转嫁，同时验证资本开支是否上修——全链条的唯一桥梁</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">国内云厂商新建/扩容数据中心的招标与公告</div><div class=\"wy\">A 股硬件与 IDC 环节订单的直接来源</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">算力服务价格的后续调整公告</div><div class=\"wy\">确认提价是持续性趋势还是一次性动作</div></div><div class=\"tkc\"><div class=\"w\">待补</div><div class=\"wh\">高端算力产能缺口的可量化数据</div><div class=\"wy\">本档案供给刚性环目前缺数字支撑，需补充权威口径</div></div></div>\n\n    <div class=\"src\">数据来源：东方财富 7×24 快讯「一场席卷算力产业链的供需博弈」(9/8 08:02)、公开报道中腾讯云/阿里云/百度智能云调价信息</div>\n    <footer>云厂商集体上调算力价 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "deepseek-chain", "title": "DeepSeek 下单16万颗昇腾", "date": "2026-09-08", "grade": "正式档", "pricing": "已部分定价", "crate": "fire", "search": "deepseek 下单16万颗昇腾 deepseek 向华为下单 16 万颗昇腾 950dt 芯片用于乌兰察布 1gw 数据中心（总额约 25.6 亿美元）· v4.1 flash 同步内测（9/10 过期）· 招 150 人聚焦 agent 工程落地 产业周期 🔥 国产算力主升·订单落地、v4.1 验证国产芯片适配", "card": "<a class=\"card-c\" href=\"#deepseek-chain\" data-search=\"deepseek 下单16万颗昇腾 deepseek 向华为下单 16 万颗昇腾 950dt 芯片用于乌兰察布 1gw 数据中心（总额约 25.6 亿美元）· v4.1 flash 同步内测（9/10 过期）· 招 150 人聚焦 agent 工程落地 产业周期 ai算力与电力配套 已部分定价 拓维信息 神州数码 浪潮信息 海光信息 寒武纪\" data-grade=\"正式档\" data-pricing=\"已部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-08</span>\n    <span class=\"crate fire\">🔥 国产算力主升·订单落地、V4.1 验证国产芯片适配 产业周期</span>\n  </div>\n  <div class=\"ctitle\">DeepSeek 下单16万颗昇腾</div>\n  <div class=\"csub\">DeepSeek 向华为下单 16 万颗昇腾 950DT 芯片用于乌兰察布 1GW 数据中心（总额约 25.6 亿美元）· V4.1 Flash 同步内测（9/10 过期）· 招 150 人聚焦 Agent 工程落地</div>\n  <div class=\"cpos\">DeepSeek 向华为下单 16 万颗昇腾 950DT（约 25.6 亿美元）用于乌兰察布 1GW 数据中心；订单尚待官方确认，昇腾链已有定价。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">AI算力与电力配套</span>\n    \n    <span class=\"chip pri\">已部分定价</span>\n    <span class=\"chip\">标的 8</span>\n    <span class=\"nm\">拓维信息</span><span class=\"nm\">神州数码</span><span class=\"nm\">浪潮信息</span><span class=\"nm\">海光信息</span><span class=\"nm\">寒武纪</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-08 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-08</div>\n    <h1>DeepSeek 下单16万颗昇腾</h1>\n    <div class=\"sub\">DeepSeek 向华为下单 16 万颗昇腾 950DT 芯片用于乌兰察布 1GW 数据中心（总额约 25.6 亿美元）· V4.1 Flash 同步内测（9/10 过期）· 招 150 人聚焦 Agent 工程落地</div>\n    <div class=\"badges\">\n      <span class=\"badge fire\">🔥 国产算力主升·订单落地、V4.1 验证国产芯片适配</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：已部分定价</span>\n      <span class=\"badge neutral\">主线：AI算力与电力配套</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">ai-compute-hike</span><span class=\"tag\" style=\"margin-right:4px\">gas-turbine-aidc-orders</span><span class=\"tag\" style=\"margin-right:4px\">intel-cpu-price-hike</span><span class=\"tag\" style=\"margin-right:4px\">mlcc-murata-eol</span><span class=\"tag\" style=\"margin-right:4px\">optical-chip-shortage</span><span class=\"tag\" style=\"margin-right:4px\">power-semi-hike3</span></div>\n    <div class=\"posnote\">DeepSeek 向华为下单 16 万颗昇腾 950DT（约 25.6 亿美元）用于乌兰察布 1GW 数据中心；订单尚待官方确认，昇腾链已有定价。</div>\n    <details class=\"more\"><summary>展开定价状态详版（642 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化 9/8（周一）密集披露：①通信世界据彭博报 DeepSeek 向华为下 16 万颗昇腾 950DT 订单（25.6 亿美元，乌兰察布 1GW 数据中心）；②上海证券报报 V4.1 Flash 内测启动；③观察者网报招 150 人聚焦 Agent。<strong>9/8 当日 A 股算力链已大幅反应</strong>——拓维信息 +5.74%、神州数码 +3.21%、浪潮信息 +2.84%、润和软件 +4.51%、海光信息 +2.95%、寒武纪 +3.74%，全链放量。<strong>9/11（上证 -1.18% 普跌日）的反应才是本档案的关键证据</strong>：算力链整体<strong>抗跌</strong>——拓维 +0.32%（超额 +1.50pct）、神州数码 +0.26%（超额 +1.44pct）、浪潮信息 +0.16%（超额 +1.34pct）、润和软件 +0.35%（超额 +1.53pct）、海光信息 -0.64%（超额 +0.54pct）、寒武纪 -0.37%（超额 +0.81pct）——<strong>大盘跌、我不跌</strong>，主升中段「龙头个股普遍抗跌」的特征。<strong>已定价的是「订单落地」与「V4.1 内测」这两层</strong>，未定价的是「V4.1 验证国产芯片算力账能否算清」这一悬念——梁文锋公开承认华为昇腾 4 颗等效英伟达 1 颗、技术差距约 2 年，V4.1 Flash 实际跑分与定价模型能否兑现是关键。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">9/6 彭博首发：DeepSeek 向华为下单 <strong>16 万颗昇腾 950DT</strong> 芯片，总额约 <strong>25.6 亿美元</strong>，用于内蒙古乌兰察布 <strong>1GW 数据中心</strong>。9/8 通信世界转译至中文圈。订单规模相当于 2025 年昇腾全系出货量的 1/4。华为昇腾 950DT 单卡算力约 1.6 PFLOPS（FP16），16 万颗合计 256 EFLOPS——这一算力规模足以支撑 DeepSeek 当前月活 1.29 亿、Token 周调用 3.69 万亿的全部需求。</div></div><div class=\"card fact warn\"><b class=\"k\">订单的可信度</b><div class=\"v\"><strong>华能蒙电 9/8 在投资者互动平台否认与 DeepSeek 合作</strong>——订单披露路径是非官方通道（彭博信源），DeepSeek、华为均未官方确认。这一否认让订单落地的时间表与规模存在不确定性。<strong>但 16 万颗昇腾的产能可行性已被产业端印证</strong>：华为昇腾 950DT 年产量约 30-50 万颗（华为官方 2025 年报），完整交付周期需要 8-12 个月；客户结构上 DeepSeek 一直是昇腾最大外部客户（V4 系列即基于昇腾 910B/950PR 完成训练）。</div></div><div class=\"card fact\"><b class=\"k\">V4.1 Flash 技术拆解</b><div class=\"v\"><strong>纯稀疏 MoE 架构</strong>：总参数 1.6 万亿、单次推理激活 490 亿（激活率 3.06%，GPT-6 Astra 是 12.2%）；CSA+HCA 混合压缩注意力让百万 token 推理计算量下降到前代 <strong>27%</strong>，KV 缓存占用降低 <strong>70%</strong>；实测生成速度 284 token/s（较 V4 Pro 的 97 token/s 提升近 2 倍）；SVG 代码生成快 6 倍、长上下文检索快 5 倍多。<strong>完成华为昇腾 910B/950PR 适配</strong>，CUDA 代码迁移到 CANN 框架兼容性接近 95%；INT4 量化版本仅需 140-160GB 显存，普通多卡 GPU 可跑，昇腾集群部署性能达 H100 约 80%。</div></div><div class=\"card fact\"><b class=\"k\">算力账硬约束</b><div class=\"v\"><strong>2026 年前 7 个月 DeepSeek 算力相关支出 110 亿元，同期营收 4.75 亿元、净亏损 7.15 亿元</strong>——每赚 1 元要花 23 元在算力上。DeepSeek 月活 1.29 亿、V4-Flash 曾连续三周位居全球模型调用量榜首、周调用 3.69 万亿 Token，<strong>现有算力已接近满负荷</strong>。创始人梁文锋公开承认：华为昇腾 <strong>4 颗等效英伟达 1 颗、技术差距约 2 年</strong>。这一硬约束意味着 V4.1 跑分提升无法根本解决「请求总量远超硬件容量」的问题。</div></div><div class=\"card fact\"><b class=\"k\">国产替代加速</b><div class=\"v\">DeepSeek V4 系列已宣布<strong>全面适配华为昇腾</strong>——这是国产大模型首次在国产芯片上完成从训练到推理的全栈部署。昇腾 A2/A3/950 全系列均已适配。V4.1 Flash 的 KV Cache 大幅压缩 + HBM 需求降低，与国产超节点系统优势高度契合。这种「模型架构与硬件特性协同设计」思路可能比单纯性能提升更具长期价值。<strong>通信世界称该订单或改写中国 AI 算力格局并引英伟达担忧</strong>。</div></div><div class=\"card fact\"><b class=\"k\">Agent 经济模型改写</b><div class=\"v\">V4.1 Flash 的发布对 Agent 生态影响最直接：<strong>KV Cache 压缩到 1/4、缓存命中价格降至 0.02 元/百万 token</strong>——叠加后 Agent 类应用运行成本可能比 V4 Pro 降低一个数量级。叠加 Agent 能力实质性提升（Terminal-Bench 2.1 从 82.7 → 90.6），长时间运行、多步骤执行的 Agent 应用在经济上变得可行。<strong>中金研报</strong>指出 DeepSeek V4 系列效率优化正在「加速下游 Agentic AI 需求释放」；<strong>中信证券</strong>认为新一代模型有望「助力千行百业 AI Agent 落地」。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\"><strong>9/8 第一段已定价</strong>（上证 -0.51%）：拓维信息 +5.74%（超额 +6.25pct，换手 4.51%、成交 35.6 亿）、神州数码 +3.21%（超额 +3.72pct）、浪潮信息 +2.84%（超额 +3.35pct）、润和软件 +4.51%、海光信息 +2.95%、寒武纪 +3.74%——全链放量。<strong>9/11 普跌日的抗跌序列</strong>（上证 -1.18%，须看超额）：拓维信息 +0.32%（超额 +1.50pct）、神州数码 +0.26%（+1.44pct）、浪潮信息 +0.16%（+1.34pct）、润和软件 +0.35%（+1.53pct）、海光信息 -0.64%（+0.54pct）、寒武纪 -0.37%（+0.81pct）、科大讯飞 -0.03%（+1.15pct）、瑞芯微 -1.29%（-0.11pct）、全志科技 -2.49%（-1.31pct）。<br><strong>纯度校验</strong>：算力链内部分化——「华为昇腾链」（拓维/润和/海光/寒武纪）显著强于「通用 AI 算力」（瑞芯微/全志科），与「DeepSeek 昇腾订单」叙事的关联度匹配。<strong>真正的「等量下跌」</strong>只在 9/8 没涨过的滞涨标的（瑞芯微/全志科）出现，说明资金已在算力链内部做轮动和精选。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-06</div><div><div class=\"x\">DeepSeek 据报向华为采购 16 万颗昇腾 950DT 芯片（25.6 亿美元），用于内蒙古乌兰察布 1GW 数据中心。</div><div class=\"y\">为什么：第一段催化（彭博首发，9/8 由通信世界转译至中文圈），订单规模史上最大。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-07</div><div><div class=\"x\">OpenAI 发布 GPT-6 Astra，DeepSeek V4-Pro 同步上线（官方），二者形成中美双轨叙事。</div><div class=\"y\">为什么：市场重新定价国产模型与海外模型的差距——开源 vs 闭源路线分化。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-08</div><div><div class=\"x\">V4.1 Flash 内测开启（有效期至 9/10）；DeepSeek Harness 负责人崔添翼发招 150 人社媒，聚焦服务端开发与 Agent 弹性计算研发；华能蒙电否认与 DeepSeek 合作（订单或为非官方路径确认）。</div><div class=\"y\">为什么：三事件同日：内测、扩招、合作主体澄清——订单、模型、人才三条线齐头并进。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-09</div><div><div class=\"x\">DeepSeek 突发故障（发布会前夜宕机），市场关注 V4.1 能否理顺算力账。</div><div class=\"y\">为什么：V4.1 跑分无法解决「服务器集群满负荷、单任务效率提升只能让硬件多跑请求」的问题。算力供需缺口是核心。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-10</div><div><div class=\"x\">V4.1 Flash 正式发布：纯稀疏 MoE 架构（总参数 1.6 万亿、激活 490 亿、激活率 3.06%），生成速度 284 token/s（较 V4 Pro 的 97 token/s 提升近 2 倍），KV Cache 压缩 70%。</div><div class=\"y\">为什么：第二段催化。V4.1 用架构创新压低推理成本，Agent 经济模型被改写。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-11</div><div><div class=\"x\">A 股算力链整体抗跌（大盘 -1.18%，拓维 +1.50pct、润和 +1.53pct、海光 +0.54pct 超额）。</div><div class=\"y\">为什么：主升中段信号——大盘跌、龙头不跌，资金在算力链内维持仓位。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「国产算力主升」的第一段，<strong>三个要害</strong>：一是<strong>订单落地是最大的预期差</strong>——16 万颗昇腾 950DT、25.6 亿美元、1GW 数据中心，订单规模相当于 2025 年昇腾全系出货量的 1/4，市场之前对国产算力替代的判断停留在「政策驱动+长期方向」，这次是「订单落地+规模兑现」，定价机制从「方向性叙事」切换为「产业链营收兑现」。二是<strong>V4.1 验证国产芯片适配能力</strong>——纯稀疏 MoE 架构（激活率 3.06%）+ KV Cache 压缩 70%，让国产芯片上的推理性能达 H100 约 80%，与梁文锋「4 颗等效 1 颗」的诚实判断匹配；但 Agent 经济模型被改写（KV Cache 命中价 0.02 元/百万 token），这反过来会释放更多 Agent 需求——「算力越便宜，需求越多」的悖论。三是<strong>算力账硬约束未解</strong>——前 7 月 110 亿支出、营收 4.75 亿、月活 1.29 亿接近满负荷，梁文锋公开承认技术差距约 2 年，订单交付要 8-12 个月，V4.1 单任务效率提升不能解决总请求远超硬件容量的问题——这是本档案「未定价的悬念」。<br>① <strong>分水岭时点</strong>：昇腾 950DT 首期交付（约 2027Q1，4-5 万颗），DeepSeek 是否配套发布算力账目透明度报告。② <strong>传导的关键约束</strong>：英伟达 H200/Blackwell 的国行替代品何时能补位——若美国商务部再次收紧出口管制，国产替代窗口会再次打开。③ <strong>待验证的核心变量</strong>：V4.1 Flash 在昇腾 910B/950PR 上的实际推理速度（基准是否兑现 284 token/s）、Agent 应用日均调用量与价格弹性。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>9/6 彭博首发 16 万颗昇腾 950DT 订单（25.6 亿美元），9/8 通信世界转译至中文圈</li><li>9/8 V4.1 Flash 内测（有效期 9/10）+ 招 150 人聚焦 Agent</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">分化</span><ul><li>订单落地改写中国 AI 算力格局：昇腾替代 H100/200 节奏明确</li><li>V4.1 用架构创新压低推理成本——KV Cache 压缩 70% + 缓存命中价 0.02 元/百万 token</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">间接</span><ul><li>昇腾链：华为、神州数码、拓维信息等昇腾合作伙伴订单兑现</li><li>下游 Agent 应用：成本下降一个数量级，应用层爆发</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">主升中段</span><ul><li>9/8 算力链放量+6pct 超额，第一段已定价</li><li>9/11 普跌日算力链抗跌（+1.0~1.5pct 超额），主升中段信号</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响分化（订单方向明确+V4.1 验证国产芯片适配）、业绩间接传导、股价主升中段——四环全部到位但闭环度依赖订单交付与 V4.1 跑分兑现。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>75%</strong>：四环都成立，但「业绩」环最弱——昇腾链订单实际兑现要 2027Q1 起、V4.1 商业化收入贡献度尚未量化。</li><li><strong>边界要切开</strong>：受益的是<strong>华为昇腾合作伙伴链</strong>（拓维信息、神州数码、海光信息、寒武纪、润和软件），以及<strong>Agent 应用层</strong>（科大讯飞、用友网络）；不受益或弱受益的是<strong>非昇腾链的通用 AI 算力</strong>（瑞芯微、全志科技）——9/11 这两个跑输大盘。</li><li><strong>主线联动</strong>：与 <strong>ai-compute-hike</strong>（AI 算力涨价）同主线，前者讲 H100/昇腾涨价、本档案讲 DeepSeek 昇腾订单落地 + V4.1 验证国产芯片。两个档案共同构成「国产 AI 算力替代英伟达」的完整叙事——前者是供给侧涨价，本档案是需求侧订单兑现。与 <strong>gas-turbine-aidc-orders</strong>（AI 数据中心燃气轮机订单）通过「AI 数据中心电力配套」联动——本档案中 1GW 数据中心订单落地进一步强化电力配套需求。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·昇腾链 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>拓维信息</b><span class=\"code\">002261</span><span class=\"tag\">华为昇腾最纯合作伙伴</span><span class=\"cap\">25.08 元 · 流通 287 亿 · 9/16 +0.08%</span></div>\n    <div class=\"logic\">9/8 +5.74%·9/11 +1.50pct 超额</div>\n    <div class=\"detail\">华为昇腾 + 鲲鹏 + 鸿蒙三栈布局完整，与华为云业务股东关系。DeepSeek 16 万颗昇腾订单最大间接受益方。9/8 放量 35.6 亿、9/11 抗跌。</div>\n    \n    <div class=\"confirm\">✔ 确认：Q4 华为昇腾服务器集成订单确认</div>\n    <div class=\"risk\">⚠️ 昇腾交付节奏不及预期</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>神州数码</b><span class=\"code\">000034</span><span class=\"tag\">华为政企总集·鲲泰渠道</span><span class=\"cap\">23.32 元 · 流通 198 亿 · 9/16 +0.95%</span></div>\n    <div class=\"logic\">9/8 +3.21%·9/11 +1.44pct 超额</div>\n    <div class=\"detail\">华为政企总集成商，神州鲲泰昇腾服务器核心渠道。弹性弱于拓维但市值体量更稳。</div>\n    \n    <div class=\"confirm\">✔ 确认：Q4 神州鲲泰昇腾服务器出货放量</div>\n    <div class=\"risk\">⚠️ 毛利压缩、渠道竞争</div>\n  </div></div><div class=\"t\">🏛️ 容量中军 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>浪潮信息</b><span class=\"code\">000977</span><span class=\"tag\">AI 服务器龙头·市值容量最大</span><span class=\"cap\">71.15 元 · 流通 1044 亿 · 9/16 +3.48%</span></div>\n    <div class=\"logic\">9/8 +2.84%·9/11 +1.34pct 超额</div>\n    <div class=\"detail\">国内 AI 服务器市场份额第一，本轮国产替代浪潮中作为「容量中军」稳住算力链指数。9/8 +2.84%、9/11 抗跌 +0.16%（超额 +1.34pct）。市值容量决定其在主线行情中承担「指数锚」角色。</div>\n    \n    \n    <div class=\"risk\">⚠️ 若昇腾服务器出货不及预期，AI 服务器订单结构会向其他芯片倾斜</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>海光信息</b><span class=\"code\">688041</span><span class=\"tag\">国产 x86 AI·科创板龙头</span><span class=\"cap\">235.09 元 · 流通 5464 亿 · 9/16 +4.67%</span></div>\n    <div class=\"logic\">9/8 +2.95%·9/11 +0.54pct 超额</div>\n    <div class=\"detail\">国产 x86 AI 加速器龙头，与华为昇腾形成国产替代双轨。5380 亿市值体量作为科创板 AI 算力的「容量中军」。</div>\n    \n    \n    <div class=\"risk\">⚠️ DeepSeek 主要锁定昇腾，海光受益度边际下降</div>\n  </div></div><div class=\"t\">🧬 观察·非昇腾链 AI 算力 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>寒武纪</b><span class=\"code\">688256</span><span class=\"tag\">思元芯片·9/8 +3.74% / 9/11 -0.37%</span><span class=\"cap\">1136.01 元 · 流通 7144 亿 · 9/16 +5.60%</span></div>\n    <div class=\"logic\">9/11 +0.81pct 超额·关联度比昇腾链低</div>\n    <div class=\"detail\">思元芯片 AI 训练与推理通用，但 DeepSeek 主要使用昇腾、对寒武纪需求拉动有限。9/8 +3.74% 放量、9/11 抗跌 -0.37%（超额 +0.81pct）——市值体量大、关联度比昇腾链弱。</div>\n    \n    \n    <div class=\"risk\">⚠️ 与 DeepSeek 直接关联度低于华为昇腾链</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>润和软件</b><span class=\"code\">300339</span><span class=\"tag\">鸿蒙+昇腾双栈</span><span class=\"cap\">34.60 元 · 流通 269 亿 · 9/16 -0.23%</span></div>\n    <div class=\"logic\">9/8 +4.51%·9/11 +1.53pct 超额</div>\n    <div class=\"detail\">鸿蒙 + 昇腾双栈适配能力，openEuler 开源核心贡献者。Agent 生态需要国产 OS + 国产芯片 + 国产模型三层协同，潜在合作空间大。</div>\n    \n    \n    <div class=\"risk\">⚠️ Agent 应用层合作未官宣</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>全志科技</b><span class=\"code\">300458</span><span class=\"tag\">通用 AI 芯片·9/11 -2.49%</span><span class=\"cap\">30.18 元 · 流通 246 亿 · 9/16 +2.86%</span></div>\n    <div class=\"logic\">9/11 跑输大盘·非昇腾链</div>\n    <div class=\"detail\">通用 AI 芯片厂商，与 DeepSeek 昇腾订单无直接关联。9/11 -2.49%（超额 -1.31pct）跑输大盘——算力链内部分化的「牺牲品」。</div>\n    <div class=\"gene\">🧬 题材基因：端侧 AI 芯片小盘，2024 年端侧 AI 行情中跟涨龙头标的</div>\n    \n    <div class=\"risk\">⚠️ 与 DeepSeek 订单无直接关联，主线行情中跟涨乏力</div>\n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· —</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>拓维信息</b><span class=\"code\">002261</span><span class=\"tag\">9/8 算力链涨幅最高·成交 35.6 亿</span><span class=\"cap\">25.08 元 · 流通 287 亿 · 9/16 +0.08%</span></div>\n    <div class=\"logic\">板块情绪锚·高度同步</div>\n    <div class=\"detail\">9/8 算力链涨幅最高标的（+5.74%），成交 35.6 亿、换手 4.51%——是本轮国产算力主升的情绪锚。</div>\n    <div class=\"gene\">🧬 题材基因：华为昇腾最纯合作伙伴，2023-2024 年鸿蒙/昇腾行情的连板常客，本轮主升延续其弹性票角色</div>\n    \n    <div class=\"risk\">⚠️ 情绪退潮时跌幅同步放大</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2023 年华为昇腾 910 量产：昇腾链进入主流视野，拓维信息、神州数码、浪潮信息开启主升，拓维当年涨 280%。</li><li>2024 年昇腾 910B 替代 H100 加速：受美国出口管制升级催化，国产算力主升第二段，浪潮信息、海光信息、寒武纪集体爆发。</li><li>2025 年 DeepSeek V3 引爆开源浪潮：DeepSeek V3 用昇腾 910B 完成全栈训练，国产算力叙事从「政策方向」转为「订单兑现」，本轮主升的预演。</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>拓维信息</b><span class=\"code\">002261</span><span class=\"tag\">华为昇腾最纯合作伙伴·9/8 +5.74% / 9/11 +0.32%</span></div>\n    <div class=\"logic\">华为昇腾 + 鲲鹏 + 鸿蒙三栈布局 | 持股华为云业务 | 国产替代弹性最大</div>\n    <div class=\"detail\">华为昇腾最纯合作伙伴，昇腾 + 鲲鹏 + 鸿蒙三栈布局完整；持股华为云业务、与华为在政企/教育/金融多个行业落地昇腾一体机。DeepSeek 16 万颗昇腾订单的最大间接受益方——若华为按过往订单惯例将服务器集成与适配订单外溢合作伙伴，拓维是最直接承接方。9/8 +5.74% 放量（成交 35.6 亿、换手 4.51%），9/11 抗跌 +0.32%（超额 +1.50pct）——主升中段「龙头抗跌」特征明确。</div>\n    \n    <div class=\"confirm\">✔ 确认：Q4 华为昇腾服务器集成订单确认 / 国产 AI 一体机出货放量</div>\n    <div class=\"risk\">⚠️ 若昇腾交付节奏不及预期、或 DeepSeek 转用其他国产芯片方案</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>神州数码</b><span class=\"code\">000034</span><span class=\"tag\">华为政企总集·9/8 +3.21% / 9/11 +0.26%</span></div>\n    <div class=\"logic\">华为政企总集成商 | 数据中心 IT 集成能力完整 | 神州鲲泰昇腾服务器核心渠道</div>\n    <div class=\"detail\">华为政企总集成商，神州鲲泰昇腾服务器核心渠道，本轮 DeepSeek 订单的间接受益方——昇腾服务器的渠道与适配由神州数码完成。9/8 +3.21%、9/11 +0.26%（超额 +1.44pct）抗跌。弹性比拓维弱（拓维是华为云业务股东、神州数码主要是分销渠道），但市值体量更稳。</div>\n    \n    <div class=\"confirm\">✔ 确认：Q4 神州鲲泰昇腾服务器出货放量 / 政企订单签约</div>\n    <div class=\"risk\">⚠️ 若昇腾服务器渠道竞争加剧、毛利压缩</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>海光信息</b><span class=\"code\">688041</span><span
