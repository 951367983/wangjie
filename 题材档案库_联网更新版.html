fact\"><b class=\"k\">④ 需求端 · 亚洲抢货的溢价证据</b><div class=\"v\">亚洲买家再度高价从美国、南美采购原油：韩国 SK 能源上周采购 <strong>400 万桶美国 WTI，较 11 月布伦特掉期合约溢价约 24 美元/桶</strong>，而上月同类成交溢价仅约 13 美元/桶——一个月内溢价近乎翻倍，这是实物短缺最硬的量化证据。中银证券同时披露 VLCC 运价刷新历史高位，中东至宁波航线 TCE 日均收益逼近 70 万美元。</div></div><div class=\"card fact warn\"><b class=\"k\">⑤ 争议点 · 管道是催化剂不是根因</b><div class=\"v\">对外经济贸易大学中国国际碳中和经济研究院执行院长董秀成明确表示：油价上涨并非单一管道事件造成，前期中东航道受阻、OPEC+ 维持减产、全球原油库存偏低等因素已令油市处于紧平衡，<strong>沙特管道断供属于触发油价跳涨的催化剂，并非根本原因</strong>。这意味着一旦地缘缓和，紧平衡会回归但不会消失；反之若海峡中断持续，部分境外机构预测油价可能升至 120 美元/桶——120 这个数字是有条件的情景推演，不是基准情形。</div></div><div class=\"card fact\"><b class=\"k\">⑥ A股映射 · 为什么商品创新高权益不跟</b><div class=\"v\">A 股能接住高油价的只有两类：上游开采（中海油、中石油，油价中枢抬升直接进报表）与油运（绕行推高运价）。炼化是明确的<strong>成本受损方</strong>——中国石化、恒力石化、荣盛石化、上海石化、华锦股份的原油成本上升而成品油出厂价受管制。更关键的是，油价与运价的权益定价中包含大量<strong>地缘风险溢价</strong>，而 9/15 晚克宫对停火提议的正面回应，正是权益端在 9/16 选择定价「缓和」而非「短缺」的直接原因。</div></div><div class=\"card fact\"><b class=\"k\">⑦ 盘面验证 · 9/16 全链反向</b><div class=\"v\">9/16 收盘：上游中国海油 <strong>-1.11%</strong>（成交 13.01 亿、换手 1.31%）、中国石油 -0.37%；油运招商轮船 <strong>-3.12%</strong>（成交 29.57 亿）、招商南油 -3.90%（换手 5.56%）、中远海能 -1.57%；炼化中国石化 -1.51%、恒力石化 -0.84%、荣盛石化 -0.23%、上海石化 0%。仅油服小票翻红——中曼石油 +2.03%（换手 7.49%）、中海油服 +0.89%、潜能恒信 +1.19%、如通股份 +2.04%。同日上证 +0.71%、创业板 +1.96%，油气链是当日全市场最弱方向之一，<strong>超额收益为负</strong>。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-14</div><div><div class=\"x\">沙特 1200km 东西管道遇袭停运，三大航道输油量不足 700 万桶/日（冲突前 35%），布油破 108、上期所原油史上首破 900 元/桶</div><div class=\"y\">为什么：本主线的第一段催化，供断叙事的起点；A 股权益端当日全回吐，首次出现商品与权益背离</div></div></div><div class=\"u\"><div class=\"w\">2026-09-15</div><div><div class=\"x\">俄约一半顶级柴油厂遭袭减产（7 月俄炼能 42.7% 瘫痪）；同夜特朗普喊停、克宫响应「是个好主意」</div><div class=\"y\">为什么：实物端升级与政治缓和变量同夜落地，成为权益端按「停火预期」定价的起点</div></div></div><div class=\"u\"><div class=\"w\">2026-09-16 02:33</div><div><div class=\"x\">WTI 破 106、美国柴油期货结算价创历史最高纪录，利比亚哈马达-扎维耶管道关闭形成第三重断供</div><div class=\"y\">为什么：本档记录的二段催化：从「单一管道停运」升级为「三重断供 + 成品油实物纪录」，但权益端定价逻辑未跟着升级</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">① <strong>分水岭时点是 9 月下旬的纽约会面</strong>，不是油价本身。本轮商品端与权益端的定价撕裂，根源在于两组信息同夜落地：实物断供（升级）与停火信号（缓和）。商品端只认实物，权益端提前定价政治——谁对谁错，取决于 9 月下旬会面是否达成能源停火。这是本档唯一的真变量。<br>② <strong>传导的关键约束是「成品油出口管制」与「风险溢价」两道闸门</strong>。第一道：海外柴油 5.26 美元/加仑与国内成品油定价机制之间隔着出口配额，A 股炼化拿不到海外高价，只承担原料成本（这解释了为什么炼化在油价新高日继续下跌，也延续了 diesel-crack-record 的结论）。第二道：油运 3% 的下跌幅度远大于油价的任何实际变动，说明被杀的是风险溢价而非基本面——VLCC 中东至宁波 TCE 仍在 70 万美元附近的高位，实物端并未恶化。<br>③ <strong>待验证的核心变量是柴油裂解价差的持续性</strong>。原油价格可以由地缘消息单日推动，但柴油期货结算价创历史纪录需要实物短缺支撑。若裂解价差在停火消息后仍站稳 100 美元以上，说明是实物缺口；若快速回落至 70 美元下方，则本轮只是风险溢价的最后一次冲高。<br><strong>隐藏面</strong>：本档与 russia-diesel-outage、oil-tanker-supercycle、saudi-east-west-pipeline 构成同一条主线的四个观测点，四者应当同向。当前四者出现分歧——商品端（原油、柴油、运价）同步创新高，权益端（油运股）反向大跌 3%。这种分歧本身就是最有信息量的事实：市场认为地缘缓和的概率在上升。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>沙特管道停运 400 万桶/日（占全球供应 4%）+ 利比亚管道关闭 + 两海峡承压，三重断供</li><li>俄约一半顶级柴油厂遭袭减产，7 月俄炼能 42.7% 瘫痪创 2005 年最低</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强</span><ul><li>美国柴油期货结算价 5.26 美元/加仑创历史最高，零售 6.26 美元九个月涨超 80%</li><li>韩国 SK 能源采购 400 万桶 WTI 溢价 24 美元/桶，较上月的 13 美元近乎翻倍</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">分化</span><ul><li>上游开采毛利扩张、油运运价高位（中东至宁波 TCE 逼近 70 万美元）——受益端成立</li><li>炼化成本端承压且出厂价受管制，中国石化连跌、恒力 5 日累计跌幅扩大——受损端同步确认</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">反向</span><ul><li>9/16 上游 -0.37%~-1.11%、油运 -1.57%~-3.90%、炼化全绿，全链无一涨停</li><li>仅油服小票翻红（中曼 +2.03%、如通 +2.04%），相对上证 +0.71% 为负超额</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强、业绩分化、股价反向——实物端三重断供已被商品定价，权益端却在定价地缘缓和，四环在股价这一环断开。</div>\n    <ul class=\"assess\"><li>闭合度 55%。前三环（变化→影响→业绩）逻辑自洽且有硬数据支撑，第四环（股价）与本档逻辑反向——这不是逻辑错误，而是市场在给「停火概率」定价。</li><li>边界：受益端是上游开采与油运（绕行）；受损端是炼化、航空、物流及一切以柴油为投入品的行业。中曼石油、中海油服等油服小票受益于资本开支预期，属间接受益且需订单确认。</li><li>主线联动：与 saudi-east-west-pipeline（一段·管道中断）、russia-diesel-outage（俄柴油减产）、diesel-crack-record（裂解价差 112 美元）、oil-tanker-supercycle（VLCC TCE 创新高）构成「能源地缘·中东供断与成品油」主线。本档是该主线的<strong>二段价格确认</strong>——把一段的管道事件兑现为可结算的价格纪录。四份档案共用同一组证伪信号：任一出现停火落地或海峡重开，四档逻辑同时降级。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中国海油</b><span class=\"code\">600938</span><span class=\"tag\">油价中枢抬升第一落点</span><span class=\"cap\">33.08 元 · 流通 989 亿 · 9/16 -1.11%</span></div>\n    <div class=\"logic\">纯上游 · 弹性最纯</div>\n    <div class=\"detail\">A 股唯一的纯上游油气标的，无炼化拖累，实现油价直接挂钩布伦特。9/16 逆势 -1.11% 恰恰说明权益端定价的是停火预期而非当期油价——这是本档预期差的核心载体。</div>\n    \n    \n    <div class=\"risk\">⚠️ 停火落地则油价回落快于业绩兑现</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中曼石油</b><span class=\"code\">603619</span><span class=\"tag\">当日油气唯一放量翻红</span><span class=\"cap\">22.13 元 · 流通 102 亿 · 9/16 +2.03%</span></div>\n    <div class=\"logic\">民营油服+开采</div>\n    <div class=\"detail\">兼具油服工程与温宿区块自有产量，流通盘小、弹性倍数高。9/16 全链下跌时逆势 +2.03%、换手 7.49%，是资金在板块分歧期的缩圈选择。</div>\n    <div class=\"gene\">🧬 题材基因：油价高位震荡期的固定情绪出口，历次油价脉冲中涨幅通常 2-3 倍于央企</div>\n    \n    <div class=\"risk\">⚠️ 小市值高换手，回撤幅度大于央企</div>\n  </div></div><div class=\"t\">🏛️ 容量中军 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中国石油</b><span class=\"code\">601857</span><span class=\"tag\">油价上行时稳住指数的容量标的</span><span class=\"cap\">10.81 元 · 流通 17504 亿 · 9/16 -0.37%</span></div>\n    <div class=\"logic\">上下游一体化 · 指数锚</div>\n    <div class=\"detail\">上下游一体化结构使其对油价的弹性被炼化与销售板块对冲，油价上涨时涨幅温和、油价下跌时抗跌。1.75 万亿流通盘是油气板块的指数锚，其方向通常决定板块整体方向。9/16 仅 -0.37%，抗跌性得到验证。</div>\n    \n    \n    <div class=\"risk\">⚠️ 一体化结构意味着弹性被稀释，油价大涨时跑输纯上游</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中海油服</b><span class=\"code\">601808</span><span class=\"tag\">资本开支传导待确认</span><span class=\"cap\">12.41 元 · 流通 367 亿 · 9/16 +0.89%</span></div>\n    <div class=\"logic\">油服龙头 · 二阶导</div>\n    <div class=\"detail\">海上油服绝对龙头，受益于上游资本开支扩张但滞后 2-4 个季度。9/16 成交仅 1.56 亿、换手 0.43%，市场未认可订单传导。观察窗口是中国海油的资本开支指引。</div>\n    \n    \n    <div class=\"risk\">⚠️ 油价若快速回落，资本开支追加预期落空</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>海油工程</b><span class=\"code\">600583</span><span class=\"tag\">传导链第三环</span><span class=\"cap\">12.41 元 · 流通 270 亿 · 9/16 +0.49%</span></div>\n    <div class=\"logic\">海上工程建设</div>\n    <div class=\"detail\">承接海上油气田工程建设，订单周期 1-2 年，业绩兑现最慢也最平滑。与中海油服同属未被定价的二阶导品种。</div>\n    \n    \n    <div class=\"risk\">⚠️ 项目周期长，短期弹性有限</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>潜能恒信</b><span class=\"code\">300191</span><span class=\"tag\">油气链固定弹性品种</span><span class=\"cap\">32.36 元 · 流通 72 亿 · 9/16 +1.19%</span></div>\n    <div class=\"logic\">勘探区块 · 弹性小票</div>\n    <div class=\"detail\">以勘探开发与区块权益为主，油价高位时存量区块经济性重估。9/16 +1.19%、换手 4.06%，在整链下跌中保持翻红。</div>\n    <div class=\"gene\">🧬 题材基因：2019 年油价脉冲行情中曾作为勘探弹性票出现连续涨停，属油气主题的第三波品种</div>\n    \n    <div class=\"risk\">⚠️ 勘探存在失败风险，业绩不连续</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>如通股份</b><span class=\"code\">603036</span><span class=\"tag\">油气链最小流通盘</span><span class=\"cap\">13.00 元 · 流通 27 亿 · 9/16 +2.04%</span></div>\n    <div class=\"logic\">石油钻采设备 · 微盘</div>\n    <div class=\"detail\">主营石油钻采井口设备，流通市值仅 26.78 亿，是油气链流通盘最小的标的之一。9/16 +2.04%、成交 0.58 亿，属典型的资金末端选择。</div>\n    <div class=\"gene\">🧬 题材基因：钻采设备小盘，历次油价主题中作为末端补涨票出现，持续性弱</div>\n    \n    <div class=\"risk\">⚠️ 流通盘过小，流动性风险高，题材退潮时无接盘</div>\n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中曼石油</b><span class=\"code\">603619</span><span class=\"tag\">板块分歧期的资金出口</span><span class=\"cap\">22.13 元 · 流通 102 亿 · 9/16 +2.03% · 换手 7.49%</span></div>\n    <div class=\"logic\">当日油气方向最强</div>\n    <div class=\"detail\">在 9/16 油气链全绿、油运大跌 3% 的背景下逆势翻红且放量，是当日该方向唯一的强度标的。这种「整链杀跌、单一标的走强」的结构通常出现在板块分歧期。</div>\n    <div class=\"gene\">🧬 题材基因：民营油服+开采复合题材，2024 年以来多次在油价主题中充当弹性龙头</div>\n    \n    <div class=\"risk\">⚠️ 若次日板块整体修复，资金可能回流央企导致其相对走弱</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2019-09 沙特 Abqaiq 遇袭：布油单日 +19%，A 股油服 3 日内回吐全部涨幅——单日冲高不是趋势，A 股对中东事件的定价窗口通常只有一天</li><li>2022-03 俄乌冲突后柴油裂解冲高：美国柴油零售破 5 美元，A 股炼化按成本受损下跌，仅油运（招商轮船）走出独立行情——与本次结构高度相似</li><li>2024-04 中东航道受阻：VLCC 运价创阶段新高，权益端 3 周后见顶回落 30%——风险溢价定价的退潮速度快于上涨</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中国海油</b><span class=\"code\">600938</span><span class=\"tag\">纯上游开采 · 油价弹性最纯</span></div>\n    <div class=\"logic\">产业地位 | 国内最大的纯海上油气生产商，桶油成本全球第一梯队 | 弹性来源 | 油价每上涨 10 美元对应净利润弹性在三家石油公司中最高 | 约束条件 | 9/16 -1.11%，权益端当前定价的是停火预期而非油价中枢</div>\n    <div class=\"detail\">中国海油是 A 股唯一的纯上游油气开采标的，没有炼化与销售板块拖累，油价上涨对它的传导路径最短——原油实现价格直接跟随布伦特，成本端刚性，油价中枢每抬升 10 美元对应显著的利润弹性。本轮 WTI 破 106、布油 108.75 若维持，其 Q3 实现价格将明显高于 Q2。但 9/16 它下跌 1.11%，说明市场当前交易的是地缘缓和概率而非当期油价——这正是本档预期差的所在：商品价格已经创纪录，权益定价却假设它会回撤。风险在于若停火落地，油价回落的速度会快于业绩兑现。</div>\n    \n    <div class=\"confirm\">✔ 确认：9 月下旬纽约会面未达成能源停火，且布油连续三个交易日收于 105 美元上方</div>\n    <div class=\"risk\">⚠️ 若停火落地或海峡复通，油价回落将先于三季报业绩兑现，弹性逻辑被证伪</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中曼石油</b><span class=\"code\">603619</span><span class=\"tag\">民营油服+开采复合 · 当日板块最强</span></div>\n    <div class=\"logic\">产业地位 | 民营油服转型开采，拥有温宿区块自有产量 | 弹性来源 | 小市值 + 自有产量，油价上涨时弹性倍数高于央企 | 约束条件 | 9/16 +2.03%、换手 7.49%，是当日油气链唯一放量翻红的标的，但油服订单受资本开支周期约束</div>\n    <div class=\"detail\">中曼石油是油气链中少见的民营标的，既有油服工程业务又拥有温宿区块的自有原油产量，兼具油价弹性与资本开支弹性。9/16 全链下跌时它逆势 +2.03%、成交 7.66 亿、换手 7.49%，是当日油气方向唯一放量的翻红标的——资金在整链被抛弃时选择了弹性最大的品种，这种「缩圈」行为通常是板块进入分歧期的信号。它的独特之处在于流通盘仅 102 亿，不需要大资金即可推动，因此在油价高位震荡期常成为资金的情绪出口。但要注意油服订单取决于上游资本开支，油价上涨传导到订单有 2-4 个季度滞后。</div>\n    \n    <div class=\"confirm\">✔ 确认：新增油服订单公告或温宿区块产量超预期，且相对上证超额扩大至 3pct 以上</div>\n    <div class=\"risk\">⚠️ 小市值高换手意味着筹码结构不稳定，地缘缓和后回撤幅度会大于央企</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中海油服</b><span class=\"code\">601808</span><span class=\"tag\">油服龙头 · 资本开支二阶导</span></div>\n    <div class=\"logic\">产业地位 | 国内海上油服绝对龙头，钻井与油田技术服务全覆盖 | 弹性来源 | 油价高位维持 2-4 个季度后传导至上游资本开支 | 约束条件 | 9/16 仅 +0.89%、成交 1.56 亿，资金未认可订单传导逻辑</div>\n    <div class=\"detail\">中海油服是油价传导链上的二阶导品种——油价上涨先改善上游利润，上游在确认高价可持续后才会追加资本开支，油服订单通常在 2-4 个季度后才体现。这意味着它在油价刚创新高时往往不是最优选择，但在油价高位维持半年以上后弹性最大。9/16 它仅上涨 0.89%、成交额 1.56 亿（换手 0.43%），是全链最清淡的标的之一，说明市场当前并未认可「高油价→资本开支」这条传导。它的独特价值在于订单可见度高：中国海油的资本开支计划是公开的，可以提前测算。风险是若油价快速回落，资本开支会被推迟，订单能见度随之下降。</div>\n    \n    <div class=\"confirm\">✔ 确认：中国海油上修年度资本开支指引，或中海油服公告新增大型钻井合同</div>\n    <div class=\"risk\">⚠️ 油价若在一个季度内回落至 90 美元下方，资本开支追加预期将落空</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>海油工程</b><span class=\"code\">600583</span><span class=\"tag\">海上工程建设</span></div>\n    <div class=\"logic\">承接海上油气田工程建设，受益于上游资本开支扩张，传导链比油服更远一档</div>\n    <div class=\"detail\">海油工程主营海上油气田的工程建设与安装，处于油价传导链的第三环——上游利润改善 → 资本开支增加 → 工程项目招标。它的订单周期长（通常 1-2 年），因此业绩兑现最慢，但也最平滑。9/16 +0.49%、成交 1.63 亿，与中海油服同属「未被定价的二阶导」。</div>\n    \n    \n    <div class=\"risk\">⚠️ 工程建设受项目周期与海上作业窗口限制，短期业绩弹性有限</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>潜能恒信</b><span class=\"code\">300191</span><span class=\"tag\">油气勘探开发 · 小盘</span></div>\n    <div class=\"logic\">拥有多个合作勘探区块，油价上涨提升存量区块经济性与勘探价值</div>\n    <div class=\"detail\">潜能恒信以油气勘探开发技术服务与区块权益为主，流通市值仅 71.58 亿，是油气链典型的弹性小票。9/16 +1.19%、成交 2.91 亿、换手 4.06%，在整链下跌中保持翻红。它的价值在于油价高位时存量区块的经济性重估，但勘探结果具有不确定性，业绩波动远大于开采类公司。</div>\n    \n    \n    <div class=\"risk\">⚠️ 勘探区块存在失败风险，且业绩不连续，不适合作为油价beta的稳健载体</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>纯炼化（中国石化/恒力石化/荣盛石化/上海石化/华锦股份）</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">原油成本上升而成品油出厂价受管制，是明确的成本受损方；9/16 中国石化 -1.51%、恒力 -0.84%、荣盛 -0.23%、上海石化 0% 全绿，反向确认</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>油运（招商轮船/招商南油/中远海能）</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">本应受益于绕行推高运价，但 9/16 大跌 3.12%/3.90%/1.57%——被杀的是地缘风险溢价而非基本面。在中东至宁波 TCE 仍逼近 70 万美元高位的情况下股价大跌，说明市场定价的是停火预期，本档不将其列为主攻</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>航空、物流及一切以柴油为投入品的行业</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">柴油零售 6.26 美元/加仑创纪录对这些行业是纯粹的成本冲击，属受损方</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>以单日油价推算年度业绩的线性外推</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">油价是即期价格，105.83 美元若只维持数日对季度均价影响有限；历史上油价冲高后回落的速度远快于业绩兑现</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**供给冲击型**二段催化，商品端创历史纪录但权益端反向下杀。基准参照：2019 年 Abqaiq 遇袭后布油单日 +19%，A 股油服 3 日内回吐全部涨幅——A 股对中东事件的定价窗口通常只有一天。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">中国海油 ＞ 中曼石油 ＞ 中海油服。排序理由：越靠上游、越纯开采，油价弹性越直接；中曼为复合弹性但市值小；油服是二阶导、需 2-4 季度传导。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">中曼石油（兼情绪龙）＞ 潜能恒信 ＞ 如通股份。gene：中曼是民营油服+开采复合题材，历次油价脉冲中涨幅 2-3 倍于央企；如通流通仅 26.78 亿，是油气链末端的资金出口。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若 9 月下旬纽约会面未达成能源停火**且**布油连续三个交易日收于 105 美元上方 → 逻辑状态由「权益端定价缓和」升为「实物短缺被确认」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 布油站稳 105 美元、会面未达成停火 ② 柴油结算价维持 5 美元/加仑以上、裂解价差站稳 100 美元 ③ 亚洲采购 WTI 溢价维持 20 美元/桶以上 ④ 油气链相对上证超额转正。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 会面达成能源停火、沙特管道复产 ② 霍尔木兹通行量回升至 500 万桶/日以上 ③ 布油回落至 95 美元下方、柴油结算价跌破 4.5 美元 ④ 制裁松动、俄成品油出口恢复。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">本档最反直觉的一点是：**油价创纪录当天，油运股跌了 3%**。中东至宁波 TCE 仍逼近 70 万美元高位而股价大跌，被杀的不是基本面，是地缘风险溢价——市场正在给「停火」定价。所以别用油价数字去推导油气股方向，要看的是 9 月下旬纽约会面。另一个坑：本档与 diesel-crack-record 一样，海外柴油 5.26 美元/加仑进不了 A 股炼化报表（出口管制），炼化是受损方不是受益方。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>情景推演</h2>\n    <div style=\"font-size:12px;color:var(--dim);margin-bottom:8px\">每个分支为可观察的条件树——触发条件兑现后的逻辑状态与验证信号，互斥且可证伪。不含操作建议。</div>\n    <div class=\"scen\"><div class=\"sc\"><div class=\"br\">▸ 实物短缺持续 · 停火未达成</div><div class=\"tg\">触发：<b>9 月下旬纽约会面无果 / 沙特管道未在两周内复产 / 霍尔木兹通行量维持 200-300 万桶/日</b></div><div class=\"ls\">逻辑状态：<b>布油站稳 105-110 美元区间，柴油裂解价差维持 100 美元以上，VLCC 运价维持历史高位；上游开采与油运的业绩弹性在三季报开始兑现</b></div><div class=\"fs\">观察信号：<b>中国海油、中曼石油相对上证超额转正并扩大至 3pct 以上；油气主题首次进入涨停题材地图</b></div></div><div class=\"sc\"><div class=\"br\">▸ 地缘缓和 · 风险溢价退潮</div><div class=\"tg\">触发：<b>纽约会面达成能源设施停火 / 沙特宣布管道复产 / 俄炼厂袭击频率显著下降</b></div><div class=\"ls\">逻辑状态：<b>布油回落至 90-95 美元，柴油裂解价差回落至 70 美元下方，VLCC 运价自历史高位回落 30% 以上；本轮被确认为风险溢价的最后一次冲高</b></div><div class=\"fs\">观察信号：<b>油运股继续下跌且成交萎缩；EIA 回撤今明两年油价预测</b></div></div><div class=\"sc\"><div class=\"br\">▸ 进一步升级 · 机构 120 美元情景</div><div class=\"tg\">触发：<b>霍尔木兹海峡交通完全中断 / 曼德海峡同步受阻 / 利比亚不可抗力正式宣布</b></div><div class=\"ls\">逻辑状态：<b>布油冲击 120 美元，全球原油库存快速消耗，亚洲采购溢价进一步扩大至 30 美元/桶以上</b></div><div class=\"fs\">观察信号：<b>上期所原油站上 1000 元/桶；美国柴油零售突破 7 美元/加仑</b></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>布伦特连续三个交易日收于 105 美元上方，且 9 月下旬纽约会面未达成能源停火——实物短缺压倒缓和预期</b></li><li><b>美国柴油期货结算价维持 5 美元/加仑以上，裂解价差站稳 100 美元上方（对照 9/12 的 112.17 美元）</b></li><li><b>亚洲买家对美国 WTI 的采购溢价维持 20 美元/桶以上（对照 9 月的 24 美元、8 月的 13 美元）</b></li><li><b>A 股油气链出现正超额：中国海油/中曼石油相对上证超额转正，且板块首次进入涨停题材地图</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>9 月下旬纽约会面就能源设施停火达成一致，沙特管道复产、延布港出口恢复至 300 万桶/日以上</b></li><li><b>霍尔木兹通行量自 200-300 万桶/日回升至 500 万桶/日以上，VLCC 运价与柴油裂解价差同步回落</b></li><li><b>布油回落至 95 美元下方且美国柴油结算价跌破 4.5 美元/加仑——本轮确认为风险溢价的最后一次冲高</b></li><li><b>俄方兑现「制裁解除 → 能源价格下降」表述，制裁实际松动、俄成品油出口恢复</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">9 月下旬</div><div class=\"wh\">特朗普与泽连斯基纽约会面是否达成能源设施停火</div><div class=\"wy\">本档唯一的真变量——决定权益端定价的是否需要修正</div></div><div class=\"tkc\"><div class=\"w\">每周三 EIA</div><div class=\"wh\">美国原油及成品油库存、柴油裂解价差</div><div class=\"wy\">实物短缺是否真实的量化证据，比油价本身更早给出方向</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">沙特延布港出口量与管道复产公告</div><div class=\"wy\">400 万桶/日（占全球 4%）是本轮供给缺口的主体</div></div><div class=\"tkc\"><div class=\"w\">10 月上旬</div><div class=\"wh\">亚洲买家对美国 WTI 的采购溢价（对照 9 月 24 美元、8 月 13 美元）</div><div class=\"wy\">溢价方向比绝对油价更能反映实物紧张程度</div></div></div>\n\n    <div class=\"src\">数据来源：财联社 9/16 03:07 国际原油期货结算价快讯 · 格隆汇 WTI 盘中 106.486 美元 · 中新经纬引对外经济贸易大学董秀成解读 · 中银证券 VLCC 中东至宁波 TCE 与 EIA 预测上调 · 新浪财经 9/16 石油 ETF 成分股数据 · 腾讯自选股 9/16 收盘行情（全链涨跌与成交额）</div>\n    <footer>油价破106·柴油期货创纪录 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "tio2-price-hike-6", "title": "钛白粉六轮集体挺价", "date": "2026-09-16", "grade": "正式档", "pricing": "部分定价", "crate": "bolt", "search": "钛白粉六轮集体挺价 9/11 龙佰率先发函 · 国内 +700 元/吨、国际 +100 美元/吨 · 截至 9/15 共 21 家企业跟进 · 年内第六轮 · 但生意社基准价同期仅涨 1.00% 产业周期 ⚡ 涨价实锤级 · 函涨 4.5%、基准价只涨 1%，龙头发函当日 -4.34%", "card": "<a class=\"card-c\" href=\"#tio2-price-hike-6\" data-search=\"钛白粉六轮集体挺价 9/11 龙佰率先发函 · 国内 +700 元/吨、国际 +100 美元/吨 · 截至 9/15 共 21 家企业跟进 · 年内第六轮 · 但生意社基准价同期仅涨 1.00% 产业周期 化工涨价链 部分定价 钛能化学 惠云钛业 龙佰集团 鲁北化工 安纳达\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-16</span>\n    <span class=\"crate bolt\">⚡ 涨价实锤级 · 函涨 4.5%、基准价只涨 1%，龙头发函当日 -4.34% 产业周期</span>\n  </div>\n  <div class=\"ctitle\">钛白粉六轮集体挺价</div>\n  <div class=\"csub\">9/11 龙佰率先发函 · 国内 +700 元/吨、国际 +100 美元/吨 · 截至 9/15 共 21 家企业跟进 · 年内第六轮 · 但生意社基准价同期仅涨 1.00%</div>\n  <div class=\"cpos\">钛白粉年内第六轮挺价落地，国内 +700 元/吨；但生意社基准价仅涨 1.00%（函涨 4.5%），龙头发函当日跌 4.34%。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">化工涨价链</span>\n    \n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 9</span>\n    <span class=\"nm\">钛能化学</span><span class=\"nm\">惠云钛业</span><span class=\"nm\">龙佰集团</span><span class=\"nm\">鲁北化工</span><span class=\"nm\">安纳达</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-16 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-16</div>\n    <h1>钛白粉六轮集体挺价</h1>\n    <div class=\"sub\">9/11 龙佰率先发函 · 国内 +700 元/吨、国际 +100 美元/吨 · 截至 9/15 共 21 家企业跟进 · 年内第六轮 · 但生意社基准价同期仅涨 1.00%</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 涨价实锤级 · 函涨 4.5%、基准价只涨 1%，龙头发函当日 -4.34%</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：化工涨价链</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">carbon-black-record</span><span class=\"tag\" style=\"margin-right:4px\">phosphate-export</span><span class=\"tag\" style=\"margin-right:4px\">copper-record</span></div>\n    <div class=\"posnote\">钛白粉年内第六轮挺价落地，国内 +700 元/吨；但生意社基准价仅涨 1.00%（函涨 4.5%），龙头发函当日跌 4.34%。</div>\n    <details class=\"more\"><summary>展开定价状态详版（811 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化由中国经济网/证券日报于 <strong>9/16</strong> 集中报道（<strong>00:16</strong> 东财快讯首发），而调价函本身自 <strong>9/11</strong> 起陆续发出——消息面存在<strong>五天时滞</strong>。<strong>盘面状态</strong>：9/16 上证 +0.71%、深成 +1.26%、科创50 +4.14%，是典型的<strong>科技股爆发日</strong>，周期化工属于资金流出的一侧，因此必须扣 beta 看超额。链内呈现<strong>教科书级反向排序</strong>：<strong>发函龙头龙佰集团 -1.20%（超额 -1.91pct）</strong>，换手 0.96%、成交 2.80 亿；而五只<strong>跟随发函的中小票全红</strong>：惠云钛业 +3.32%（超额 +2.61pct）、钛能化学 +2.55%（+1.84pct，成交量 765058 手较前日 345544 手<strong>翻倍</strong>、成交 3.36 亿为全链最大）、金浦钛业 +2.35%（+1.64pct）、安纳达 +1.79%（+1.08pct）、鲁北化工 +1.76%（+1.05pct）。更关键的是发函当日：龙佰 <strong>9/11 收 -4.34%</strong>（开 15.37 高 15.44 低 14.57，全天单边下杀），随后 9/14 +2.50%、9/15 -1.32%、9/16 -1.20%，<strong>四个交易日累计仍为负</strong>。当日 91 只涨停中<strong>无一钛白粉股</strong>。结论：市场把本轮定性为<strong>『托底式试探』而非『景气反转』</strong>——涨价的发动者自己不被买，被买的是弹性更大的跟随者，且是消息出街后第五天才补涨。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">事件本体</b><div class=\"v\">步入『金九』旺季，钛白粉行业迎来<strong>年内第六轮集体涨价</strong>。9/11 龙头龙佰集团率先发布调价公告，全系列钛白粉国内上调 <strong>700 元/吨</strong>、国际上调 <strong>100 美元/吨</strong>；随后安纳达、山东金海钛业、惠云钛业、钛能化学、道恩钛业、东佳集团、天原集团、潜江方圆等二十余家企业集中官宣，涨幅<strong>高度一致</strong>。据北方有色网统计，截至 9/15 本轮已有 <strong>21 家</strong>企业发函（中国经济网/证券日报 9/16 报道）。</div></div><div class=\"card fact\"><b class=\"k\">700 元的分量</b><div class=\"v\">按证券日报口径，当前国内硫酸法金红石型钛白粉主流含税出厂价 <strong>14500-15500 元/吨</strong>，锐钛型 13000-13500 元/吨——700 元相当于 <strong>4.5%~4.8%</strong>。但放进年内序列看它相当克制：3 月单月三次累计 2000 元、4/15 再涨 1500 元、6/5 涨 1000 元。生意社统计 2025-09-14 至 2026-09-14 一年区间：最低 13500、最高 17200、中位 15350、均值 14828.25 元/吨，<strong>当前 14200 元仍处一年低位区间</strong>，距中位值尚有约 1150 元。这是<strong>托底</strong>动作，不是冲高号角。</div></div><div class=\"card fact warn\"><b class=\"k\">成本刚性</b><div class=\"v\">硫酸是硫酸法钛白粉的主要成本项，叠加硫磺、钛矿年内持续高位运行。隆众资讯分析师张鸣哲指出：<strong>企业出厂价已贴近成本红线，下行空间基本关闭</strong>。这正是 8 月基准价单月回落 9.06% 后跌不动的原因——不是需求好转，是<strong>跌到成本线</strong>了。涨价的第一驱动力是成本倒挂的修复诉求，而非订单改善。</div></div><div class=\"card fact\"><b class=\"k\">供给与出口</b><div class=\"v\">供给端：行业整体<strong>开工率不足 70%</strong>，叠加全球 <strong>60 万吨落后产能永久退出</strong>，有效供给边际收缩；多套装置检修减产、现货库存低位。出口端：钛白粉<strong>累计出口同比增长 16.56%</strong>，是本轮修复的上限约束——隆众口径同时强调『金九旺季备货启动带动库存快速去化』。出口决定了天花板，供给收缩决定了地板。</div></div><div class=\"card fact warn\"><b class=\"k\">争议点：调价函 ≠ 成交价</b><div class=\"v\">多家行业媒体明确提示：<strong>调价函是厂商对外报价调整通知，不等于所有客户立即执行</strong>；长协大客户仍有议价空间，实际成交价可能低于函面报价。生意社同期基准价只涨 1.00% 已给出量化印证。更硬的公司级证据是龙佰半年报——钛白粉板块毛利率同比<strong>下降 9.58pct 至 17.53%</strong>，归母净利润同比 <strong>-39.08%</strong>，公司自述『钛白粉价格下游传导缓慢』。<strong>上市公司法定披露口径与行业涨价叙事存在明显张力。</strong></div></div><div class=\"card fact warn\"><b class=\"k\">龙头的另一面</b><div class=\"v\">龙佰集团钛白粉总产能 <strong>166 万吨</strong>、海绵钛 8 万吨，均居全球首位。2026H1 钛白粉产量 65.75 万吨（-3.62%）但销量 68.56 万吨（+12.02%），<strong>国际销量 42.28 万吨、+22.73%，占总销量 61.67%</strong>——增长几乎全靠出口。高毛利氯化法销量同比 <strong>+40%</strong>（单吨毛利 2000-2500 元，约为硫酸法 1000-1500 元的两倍），是其对冲硫酸法成本压力的关键。钛精矿产量因『两矿整合』审批主动控产、同比 -35.12% 至 44.89 万吨；整合后年产能将升至 248 万吨、<strong>自给率有望达 80%</strong>。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/16（上证 +0.71%，科技股爆发日，需扣 beta）<strong>发函龙头与跟随股完全反向</strong>：龙佰集团 <strong>-1.20%</strong>（超额 -1.91pct，换手 0.96%、成交 2.80 亿）；五只跟随发函的中小票全红——惠云钛业 +3.32%（+2.61pct）、钛能化学 +2.55%（+1.84pct，成交 3.36 亿为全链最大、量能较前日翻倍）、金浦钛业 +2.35%（+1.64pct）、安纳达 +1.79%（+1.08pct）、鲁北化工 +1.76%（+1.05pct）。时间维度上：龙佰在<strong>发函当日 9/11 收 -4.34%</strong>（全天单边下杀），9/14 +2.50%、9/15 -1.32%、9/16 -1.20%，<strong>四日累计仍为负</strong>。当日 91 只涨停中无一钛白粉股。结论：本轮涨价在权益端被<strong>部分定价且方向错配</strong>——资金买的是弹性跟随者，卖的是涨价发动者。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-03-02 / 03-16 / 03-24</div><div><div class=\"x\">龙佰集团一个月内<strong>三次</strong>发函上调价格，单月国内累计涨幅达 2000 元/吨（Mysteel 统计）。</div><div class=\"y\">为什么：本轮涨价序列的第一段——那时是<strong>成本推动 + 需求尚可</strong>的主动提价，单次幅度大、频率高，是典型的景气修复期行为。</div></div></div><div class=\"u\"><div class=\"w\">2026-04-15 / 06-05</div><div><div class=\"x\">龙佰再度上调 1500 元/吨；6 月 5 日又开启一轮上调 1000 元/吨。</div><div class=\"y\">为什么：第二、第三段。此时步幅已从 2000 元收敛到 1500、1000 元，说明<strong>下游承接力在逐轮衰减</strong>，提价从『领涨』转为『跟随成本』。</div></div></div><div class=\"u\"><div class=\"w\">2026-08-01 至 08-31</div><div><div class=\"x\">生意社监测：钛白粉基准价从 8 月初的 15460 元/吨一路下行至 14060 元/吨，<strong>单月回落 9.06%</strong>。</div><div class=\"y\">为什么：关键转折点——前三轮涨价成果在 8 月<strong>被全部回吐</strong>。这决定了 9 月这一轮 700 元的性质：不是冲高，是把价格从成本线附近抬回一格。</div></div></div><div class=\"u\"><div class=\"w\">2026-08-27</div><div><div class=\"x\">龙佰集团披露 2026 半年报：营收 144.17 亿元（+8.15%），归母净利润 8.44 亿元，<strong>同比 -39.08%</strong>；钛白粉板块毛利率 17.53%，<strong>同比下降 9.58 个百分点</strong>。公司自述主因为硫酸、硫磺原材料价格大幅上涨，钛白粉价格<strong>向下游传导缓慢</strong>。</div><div class=\"y\">为什么：这是本档案最硬的<strong>上市公司口径证据</strong>：涨价发生在『毛利率被原料吃掉 9.58pct、净利下滑近四成』的背景下。没有这份公告，本轮 700 元会被误读为景气反转。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-11 至 09-15</div><div><div class=\"x\">龙佰集团率先发函，自 9/11 起全系列钛白粉国内 +700 元/吨、国际 +100 美元/吨；随后安纳达、山东金海钛业（鲁北化工旗下）、广东惠云钛业、钛能化学、山东道恩钛业、山东东佳、天原集团、潜江方圆等跟进。据北方有色网统计，截至 9/15 <strong>本轮已有 21 家企业发布调价函</strong>。</div><div class=\"y\">为什么：第六轮、也是本档案的成立点。超过 20 家企业<strong>涨幅高度一致</strong>（都是 700 元/100 美元），说明这是行业协同挺价而非个别企业的供需紧张，同时也意味着<strong>涨价的可信度依赖于协同的持续性</strong>。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-14</div><div><div class=\"x\">生意社钛白粉基准价报 <strong>14200 元/吨</strong>，较本月初的 14060 元/吨仅上涨 <strong>1.00%</strong>。</div><div class=\"y\">为什么：本档案的<strong>胜负手数字</strong>：调价函的名义涨幅是 4.5%~4.8%，而市场公认的基准价在发函后只动了 1.00%。两者之间的差额，就是『涨价函 ≠ 成交价』的量化刻度。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这条链的<strong>分水岭时点</strong>是 8 月：基准价单月回落 9.06%、从 15460 跌到 14060，把前三轮共 4500 元的涨幅<strong>全部回吐</strong>——所以 9 月这 700 元的性质必须被定义为『从成本线往回抬一格』，而不是景气反转。<strong>传导的关键约束</strong>在价差而非价格：硫酸、硫磺、钛矿三线同步高位，钛白粉板块毛利率已被压到 17.53%（同比 -9.58pct），涨价能否变成利润，取决于原料涨幅是否慢于产品涨幅，而当前答案是<strong>否</strong>——隆众口径直说『企业出厂价贴近成本红线』。<strong>待验证的核心变量</strong>是『函面价 vs 成交价』的收敛度：21 家企业涨幅高度一致（都是 700/100），这是行业协同挺价的典型形态，协同的持续性而非需求强度决定了这一轮能走多远；生意社基准价 9/14 只涨 1.00% 就是当前收敛度的刻度。<strong>隐藏面</strong>在于龙佰自身的结构切换：它 61.67% 的销量来自出口、氯化法销量 +40%、两矿整合后钛精矿自给率将达 80%——这三件事意味着<strong>龙佰的受益逻辑根本不在这 700 元里</strong>，而在出口结构、工艺结构与矿端自给率上。<strong>反直觉点</strong>：9/16 唯一收绿的是发起涨价的龙头，五只跟随股全红且放量——市场对『谁受益』的裁决与产业地位排序完全相反，这本身就是市场不认为本轮能兑现为利润的证据。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>9/11 龙佰发函国内 +700 元/吨、国际 +100 美元/吨，至 9/15 已有 21 家企业跟进，涨幅高度一致</li><li>供给端开工率不足 70%、全球 60 万吨落后产能永久退出，出口累计同比 +16.56%</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">存疑</span><ul><li>生意社基准价 9/14 报 14200 元/吨，较月初 14060 仅 +1.00%，远低于函面 4.5%~4.8%</li><li>行业媒体明确提示调价函不等于成交价，长协大客户仍有议价空间，实际成交可能低于函面</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">未兑现</span><ul><li>龙佰 2026H1 归母 8.44 亿元、同比 -39.08%；钛白粉板块毛利率 17.53%、同比 -9.58pct</li><li>公司半年报自述主因：硫酸硫磺涨价、钛白粉价格向下游传导缓慢、矿产品产量下降、汇兑损益</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">反向分化</span><ul><li>9/16 龙佰 -1.20%（超额 -1.91pct）vs 惠云 +3.32%、钛能 +2.55%（量翻倍）、金浦 +2.35%</li><li>龙佰发函当日 9/11 即 -4.34%，9/11-9/16 四日累计仍为负；当日 91 只涨停无一钛白粉股</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响存疑、业绩未兑现、股价已按『跟随者优先』反向分化——这是『涨价函落地但价差未修复』的样本，不是景气反转题材。</div>\n    <ul class=\"assess\"><li>闭合度 50%——四环中『影响』与『业绩』两环未打通：函面涨幅 4.5% 与基准价实际涨幅 1.00% 之间存在 3.5pct 的缺口，且龙头毛利率同比 -9.58pct，涨价尚未沉淀为利润。</li><li>边界切分：<strong>真正受益的是氯化法+出口+矿端自给三条结构线</strong>（龙佰氯化法销量 +40%、单吨毛利 2000-2500 元为硫酸法两倍、两矿整合后自给率 80%）；<strong>受益有限的是纯硫酸法中小产能</strong>（惠云、安纳达、金浦、金海）——它们 9/16 涨幅最大但恰恰是成本敞口最大、议价权最弱的一环；<strong>不同链</strong>是下游涂料/塑料（成本承接方）。判断任一标的只需问一句：<strong>它在硫酸和钛矿上是多头还是空头</strong>。</li><li>主线联动：与 <strong>carbon-black-record</strong> 在方法论上完全同源——两者都是『商品涨价 ≠ 中游受益』的映射断裂样本，炭黑是价格与利润双创历史新高的极端版，钛白粉是函面价与成交价背离的温和版，可交叉阅读。与 <strong>phosphate-export</strong> 同属化工涨价的政策/出口驱动分支。与 <strong>copper-record</strong> 在『商品创新高的 A 股定价效率』上互为对照。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>钛能化学</b><span class=\"code\">002145</span><span class=\"tag\">9/16 成交 3.36 亿为全链最大，量较前日翻倍</span><span class=\"cap\">4.42 元 · 流通约 167 亿 · 9/16 +2.55%</span></div>\n    <div class=\"logic\">原中核钛白·量能翻倍</div>\n    <div class=\"detail\">原中核钛白，国内钛白粉第二梯队主力，本轮跟随发函。9/16 收 +2.55%、超额 +1.84pct，成交量 765058 手较前日 345544 手<strong>翻倍</strong>，成交 3.36 亿为全链最大。资金在消息出街第五天选择它而非龙头，说明本轮被定性为<strong>『低基数毛利修复』的弹性博弈</strong>。它的成本敞口完全暴露（无矿端、无硫酸配套），因此是链上<strong>对价差方向最敏感</strong>的样本——价差扩张时弹性最大，压缩时最先受损。</div>\n    \n    \n    <div class=\"risk\">⚠️ 成本敞口 100% 外购；若涨价函未落地为成交价，最先回吐</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>惠云钛业</b><span class=\"code\">300891</span><span class=\"tag\">9/16 全链涨幅第一，超额 +2.61pct</span><span class=\"cap\">7.46 元 · 流通约 25 亿 · 9/16 +3.32%</span></div>\n    <div class=\"logic\">报价基数最低·涨幅第一</div>\n    <div class=\"detail\">本轮发函企业之一，调价前金红石型出厂价约 14300 元/吨，为链内<strong>报价基数最低</strong>者——低基数带来高弹性，也意味着低议价权。9/16 收 +3.32% 为全链第一，但成交仅 0.41 亿、换手 1.66%，涨幅由极小资金量推动。作为主攻档的意义在于它是<strong>『纯硫酸法 + 无自给』这一极端的代表</strong>：本轮 700 元能否落地，看它的成交价能否跟上函面价最直接。</div>\n    \n    \n    <div class=\"risk\">⚠️ 25 亿级小流通盘，少量资金即可推动大幅波动；无矿端与硫酸配套</div>\n  </div></div><div class=\"t\">🏛️ 容量中军 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>龙佰集团</b><span class=\"code\">002601</span><span class=\"tag\">发函当日 9/11 即 -4.34%，四日累计仍为负</span><span class=\"cap\">14.77 元 · 流通约 292 亿 · 9/16 -1.20%</span></div>\n    <div class=\"logic\">全球第一产能·发函者反被卖</div>\n    <div class=\"detail\">钛白粉总产能 <strong>166 万吨</strong>、海绵钛 8 万吨，均居全球首位，本轮涨价的<strong>发起者</strong>。作为容量中军，它的作用是给整条链提供指数级锚定——它不涨，说明市场不认可『涨价=景气反转』。2026H1 营收 144.17 亿（+8.15%）、归母 8.44 亿<strong>同比 -39.08%</strong>、钛白粉毛利率 17.53%<strong>同比 -9.58pct</strong>。它的真实叙事在三条结构线上：出口占比 61.67%、氯化法销量 +40%、两矿整合后钛精矿自给率将达 80%——<strong>都不在这 700 元里</strong>。9/16 全链唯一收绿，超额 -1.91pct。</div>\n    \n    \n    <div class=\"risk\">⚠️ 硫磺硫酸若继续上行则 700 元被完全吃掉；两矿整合审批存在时滞；出口受欧盟反倾销影响账面毛利率低于国内</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>鲁北化工</b><span class=\"code\">600727</span><span class=\"tag\">9/16 +1.76%，涨幅居中</span><span class=\"cap\">7.51 元 · 流通约 39 亿 · 9/16 +1.76%</span></div>\n    <div class=\"logic\">金海钛业·硫酸一体化</div>\n    <div class=\"detail\">旗下山东金海钛业本轮发函，调价前金红石型出厂价约 14600 元/吨、调价后约 15300 元/吨。它具备<strong>硫酸/钛白粉联产</strong>的一体化属性，理论上对硫酸涨价有部分对冲——这是它与纯钛白粉厂的关键差异，也是它作为容量中军的理由：当它跑赢纯外购型同业时，说明市场开始按<strong>成本对冲能力</strong>而非单纯弹性排序。9/16 收 +1.76%、超额 +1.05pct，涨幅居中，符合『有对冲但弹性一般』的定位。</div>\n    \n    \n    <div class=\"risk\">⚠️ 硫酸自给率未量化披露，对冲逻辑无法证实；39 亿小盘波动率高</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>安纳达</b><span class=\"code\">002136</span><span class=\"tag\">9/16 +1.79%，涨幅靠后</span><span class=\"cap\">11.92 元 · 流通约 26 亿 · 9/16 +1.79%</span></div>\n    <div class=\"logic\">钛白粉+磷酸铁·纯度打折</div>\n    <div class=\"detail\">本轮发函企业之一，自 9/11 起执行 +700 元/吨。特殊性在于<strong>同时拥有磷酸铁业务</strong>，后者景气驱动来自新能源而非涂料，与本链条不同向，因此它在钛白粉行情中是个<strong>纯度打折</strong>的样本。9/16 涨幅靠后（+1.79%、超额 +1.08pct）部分印证了纯度折价。观察价值在于：若它开始跑赢纯钛白粉标的，说明资金已切换到锂电逻辑，本链条的定价框架需要重构。</div>\n    \n    \n    <div class=\"risk\">⚠️ 双主业稀释涨价传导；磷酸铁业务受锂电链独立影响</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>金浦钛业</b><span class=\"code\">000545</span><span class=\"tag\">9/16 +2.35%，换手 3.75% 为全链最高</span><span class=\"cap\">2.18 元 · 流通约 21 亿 · 9/16 +2.35%</span></div>\n    <div class=\"logic\">2 元低价·全链最低价股</div>\n    <div class=\"detail\">本轮发函企业之一，调价前金红石型出厂价约 14200 元/吨。它的辨识度在<strong>价格锚</strong>：2.18 元是链内唯一 2 元档标的，21 亿级流通盘，9/16 换手 3.75% 为全链最高——是典型的<strong>低价筹码博弈载体</strong>而非产业定价载体。9/15 它曾 -4.48%，9/16 反弹 +2.35%，波动幅度显著大于基本面变化幅度。作为观察档，它的作用是衡量<strong>本轮行情中有多少是纯情绪资金</strong>。</div>\n    \n    \n    <div class=\"risk\">⚠️ 21 亿级微盘，换手率极高，价格与产业基本面脱钩风险大</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>惠云钛业</b><span class=\"code\">300891</span><span class=\"tag\">涨幅第一但成交仅 0.41 亿</span><span class=\"cap\">7.46 元 · 流通约 25 亿 · 9/16 +3.32%</span></div>\n    <div class=\"logic\">创业板小盘·弹性跟随者</div>\n    <div class=\"detail\">同时出现在主攻档与情绪档，因为它兼具两端属性：作为最低报价基数企业它有真实的涨价弹性，作为 25 亿创业板小盘它又被情绪资金主导。9/16 收 +3.32% 为全链第一，但成交仅 0.41 亿、换手 1.66%——<strong>涨幅与成交额严重不匹配</strong>，这是情绪定价而非产业定价的典型特征。</div>\n    <div class=\"gene\">🧬 题材基因：钛白粉涨价行情中历次跟随龙佰的二线弹性票，2023 年钛白粉提价周期中曾出现单日涨停，但持续性均不及龙头，无独立行情记忆</div>\n    \n    <div class=\"risk\">⚠️ 小盘低流动性，涨幅易被少量资金放大；无矿端自给</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>金浦钛业</b><span class=\"code\">000545</span><span class=\"tag\">9/15 -4.48%、9/16 +2.35%，双向大幅波动</span><span class=\"cap\">2.18 元 · 流通约 21 亿 · 换手 3.75%</span></div>\n    <div class=\"logic\">2 元档·低价筹码载体</div>\n    <div class=\"detail\">链内唯一的 2 元档标的，9/16 换手 3.75% 为全链最高，9/15 刚经历 -4.48% 的下跌。低价 + 微盘 + 高换手，使它成为本轮行情中<strong>纯情绪资金的载体</strong>——它的涨跌与钛白粉价差的关联度远低于与板块热度的关联度。作为情绪小票，它的作用是标定本轮的情绪温度。</div>\n    <div class=\"gene\">🧬 题材基因：低价化工壳资源属性，历次化工涨价题材中作为低价补涨标的表现，缺乏产业逻辑支撑的独立记忆</div>\n    \n    <div class=\"risk\">⚠️ 微盘高换手，价格与基本面脱钩；连续亏损风险需核查</div>\n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>龙佰集团</b><span class=\"code\">002601</span><span class=\"tag\">全球产能第一，却是全链唯一收绿标的</span><span class=\"cap\">14.77 元 · 流通约 292 亿 · 9/16 -1.20%</span></div>\n    <div class=\"logic\">产业地位与股价方向相反</div>\n    <div class=\"detail\">本轮最反直觉的现象：产业地位最高、产能全球第一、涨价的发起者，却是 9/16 全链<strong>唯一收绿</strong>的标的（-1.20%、超额 -1.91pct），且在发函当日 9/11 就下跌 4.34%。作为情绪龙，它承载的是<strong>认知锚</strong>而非涨幅——市场对『钛白粉涨价买龙佰』有极强的条件反射记忆，但这一次基因记忆与真实逻辑的指向出现了分歧：前几轮提价时它的毛利率在扩张，本轮提价时毛利率同比 -9.58pct、归母 -39.08%。<strong>基因还在，逻辑变了。</strong></div>\n    <div class=\"gene\">🧬 题材基因：钛白粉行业绝对龙头，2021 年与 2023 年两轮提价周期的资金第一反应对象，市场对『钛白粉涨价→买龙佰』有强条件反射——但前两轮是需求拉动下的量价齐升，本轮是原料高位下的成本修复，方向不同</div>\n    \n    <div class=\"risk\">⚠️ 若市场只读『第六轮涨价』标题而不读毛利率 -9.58pct，可能出现记忆驱动的误读性反弹；但半年报口径已明确传导缓慢</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2026-03 至 06：龙佰集团 3 月三次发函累计 +2000 元/吨、4/15 +1500 元、6/5 +1000 元，前三轮累计涨幅约 4500 元/吨——本轮 700 元仅为第三轮的三分之一</li><li>2026-08-01 至 08-31：生意社钛白粉基准价从 15460 元/吨跌至 14060 元/吨，单月 -9.06%，前三轮涨价成果全部回吐</li><li>2026-08-27：龙佰集团半年报披露归母净利润同比 -39.08%、钛白粉板块毛利率同比 -9.58pct 至 17.53%，自述『钛白粉价格下游传导缓慢』——涨价与利润的背离首次被公司口径确认</li><li>2026-09-11：龙佰发函当日股价收 -4.34%（开 15.37、高 15.44、低 14.57），全天单边下杀——发涨价的当天市场用脚投票，是本轮最直接的定价证据</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>龙佰集团</b><span class=\"code\">002601</span><span class=\"tag\">全球钛白粉第一产能·本轮涨价的发起者</span></div>\n    <div class=\"logic\">产业地位 | 弹性来源 | 约束条件：钛白粉总产能 166 万吨、海绵钛 8 万吨全球首位 | 出口占比 61.67%、氯化法销量 +40%、两矿整合后钛精矿自给率 80% | 归母同比 -39.08%、毛利率 -9.58pct，700 元尚未覆盖原料涨幅</div>\n    <div class=\"detail\">本轮涨价的<strong>发起者与最大产能方</strong>：9/11 率先发函，国内 +700 元/吨、国际 +100 美元/吨。但它的投资叙事根本不在这 700 元里——2026H1 国际销量 42.28 万吨、+22.73%，占总销量 61.67%，国内销量反而 -1.76%；高毛利氯化法销量同比 +40%，单吨毛利 2000-2500 元约为硫酸法的两倍；两矿整合投产后钛精矿年产能将升至 248 万吨、自给率约 80%。这三件事决定了它真正的成本曲线位置。独特之处在于它是链上唯一<strong>同时拥有矿端、氯化法工艺与海外产能</strong>（英国 Venator 15 万吨 8 月复产、马来西亚 20 万吨在建）的公司。但 9/16 它是全链唯一收绿的标的（-1.20%、超额 -1.91pct），发函当日更跌 4.34%——市场明确不把这轮涨价当作它的利润拐点。</div>\n    \n    <div class=\"confirm\">✔ 确认：生意社/隆众下一期钛白粉基准价向 15000 元/吨收敛（函面涨幅开始兑现）／公司三季报钛白粉板块毛利率环比回升／两矿整合公告落地（预计 2026 年 9-10 月）</div>\n    <div class=\"risk\">⚠️ 硫磺与硫酸价格若继续上行，700 元涨幅会被原料完全吃掉；钛精矿自给率提升依赖两矿整合审批进度，存在时滞</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>钛能化学</b><span class=\"code\">002145</span><span class=\"tag\">原中核钛白·9/16 全链放量最大</span></div>\n    <div class=\"logic\">产业地位 | 弹性来源 | 约束条件：国内钛白粉第二梯队主力，紧跟龙头发函 | 价格上行对低基数毛利的弹性最大 | 无矿端自给，硫酸/钛矿敞口 100% 暴露</div>\n    <div class=\"detail\">原中核钛白，本轮跟随发函的企业之一。9/16 它是<strong>全链信息量最大的一只</strong>：收 +2.55%（超额 +1.84pct），成交量 765058 手较前一日 345544 手<strong>翻倍</strong>，成交 3.36 亿为全链最大，换手 2.01%。资金选择它而非龙头，说明市场把本轮理解为<strong>『低基数毛利修复』的弹性博弈</strong>而非『龙头集中度提升』的产业逻辑。它的独特之处恰恰也是它的约束：没有矿端自给，钛精矿与硫酸完全外购，所以钛白粉涨价的传导效率对它<strong>最高也最脆弱</strong>——价差扩张时它弹性最大，价差压缩时它最先受损。</div>\n    \n    <div class=\"confirm\">✔ 确认：公司披露钛白粉业务毛利率环比变化／行业开工率自 70% 以下回升（新价订单放量而非低价单生产）</div>\n    <div class=\"risk\">⚠️ 无矿端对冲，成本敞口完全暴露；若涨价函未能落地为成交价，它是最先回吐的品种</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>鲁北化工</b><span class=\"code\">600727</span><span class=\"tag\">山东金海钛业母公司·发函企业中的一体化样本</span></div>\n    <div class=\"logic\">产业地位 | 弹性来源 | 约束条件：旗下山东金海钛业本轮发函，调价前金红石型出厂价约 14600 元/吨 | 涨价后约 15300 元/吨，弹性直接 | 39 亿级小流通盘，波动率高</div>\n    <div class=\"detail\">旗下山东金海钛业是本轮<strong>第二批跟进发函</strong>的企业之一，同样自 9/11 起国内 +700 元/吨、国际 +100 美元/吨；调价前金红石型出厂价约 14600 元/吨，调价后约 15300 元/吨。它同时具备<strong>硫酸/钛白粉联产</strong>的一体化属性，理论上对硫酸涨价有部分对冲——这是它与纯钛白粉厂（惠云、安纳达、金浦）的关键差异。9/16 收 +1.76%（超额 +1.05pct）、成交 0.67 亿、换手 1.71%，涨幅居中，符合『有对冲但弹性一般』的定位。</div>\n    \n    <div class=\"confirm\">✔ 确认：硫酸自给率披露／钛白粉业务毛利率环比是否优于纯外购型同业</div>\n    <div class=\"risk\">⚠️ 一体化对冲量级未量化前不能认定成立；小盘属性使波动率显著高于龙头</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>惠云钛业</b><span class=\"code\">300891</span><span class=\"tag\">9/16 涨幅第一·纯硫酸法小盘</span></div>\n    <div class=\"logic\">调价前金红石型出厂价约 14300 元/吨（全链最低），基数最低故涨幅弹性最大，9/16 收 +3.32% 为全链第一</div>\n    <div class=\"detail\">本轮发函企业之一，调价前金红石型出厂价约 14300 元/吨，是链内<strong>报价基数最低</strong>的一只——这解释了它 9/16 为何录得全链最高涨幅 +3.32%（超额 +2.61pct）。但低基数同时意味着低议价权：它既无矿端自给也无硫酸配套，是<strong>成本敞口最纯粹</strong>的样本。成交仅 0.41 亿、换手 1.66%，涨幅由极小的资金量推动，可持续性弱于钛能化学。</div>\n    \n    \n    <div class=\"risk\">⚠️ 无矿端、无硫酸配套，成本敞口 100% 暴露；24 亿级流通盘，少量资金即可推动大幅波动</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>安纳达</b><span class=\"code\">002136</span><span class=\"tag\">磷酸铁锂副线·不同链的估值锚</span></div>\n    <div class=\"logic\">同时具备钛白粉与磷酸铁产能，后者受锂电链景气影响，与本链条不完全同向</div>\n    <div class=\"detail\">本轮发函企业之一，自 9/11 起执行 +700 元/吨。它的特殊性在于<strong>同时拥有磷酸铁业务</strong>，而后者的景气驱动来自新能源而非涂料，与本链条不同向——这使它在钛白粉涨价行情中是个<strong>纯度打折</strong>的样本。9/16 收 +1.79%（超额 +1.08pct）、成交 0.50 亿、换手 1.95%，涨幅靠后，部分印证了纯度问题。把它放进观察档的意义是：若它开始跑赢纯钛白粉标的，说明资金已切换到锂电逻辑而非涂料逻辑。</div>\n    \n    \n    <div class=\"risk\">⚠️ 双主业导致钛白粉涨价传导被稀释；磷酸铁业务受锂电链景气独立影响</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>下游涂料与塑料（三棵树、亚士创能等）</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">钛白粉是涂料的核心成本项，涨价对下游是<strong>成本挤压</strong>而非受益。本轮涨价的同时终端需求修复偏弱，成本向下传导的通道并不通畅——这正是龙佰半年报『传导缓慢』四个字的含义，下游不在受益传导链上</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>纯硫酸法且无矿端自给的中小产能</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">惠云、金浦等虽在 9/16 涨幅居前，但它们的成本敞口 100% 外购，价差压缩时最先受损。之所以仍列入梯队，是因为它们<strong>在价差扩张假设下弹性最大</strong>；若假设不成立，它们是排除对象而非受益方</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>海绵钛/钛材（宝钛股份、西部超导）</b><span class=\"code\">600456/688122</span></div>\n    <div class=\"logic\">与本链条不同链：海绵钛走的是<strong>高端钛材/军工航空</strong>需求逻辑，价格驱动来自航空航天订单而非涂料。龙佰虽同时产海绵钛，但本轮调价函针对的是钛白粉，两者不构成同一传导</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>钛白粉出口占比低的纯内销企业</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">本轮修复的上限由出口决定（累计出口 +16.56%），龙佰出口占比已达 61.67% 而国内销量 -1.76%。纯内销企业面对的是<strong>需求疲弱的国内市场</strong>，涨价函对它们更难落地为成交价</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**产业周期**：成本倒挂下的协同挺价，非景气反转。基准参照：2026 年 3-6 月前三轮涨价（累计约 4500 元/吨）在 8 月被单月 -9.06% 全部回吐。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">钛能化学 ＞ 惠云钛业 ＞ 鲁北化工 ＞ 龙佰集团。排序理由：价差扩张假设下，成本敞口越大弹性越大，故无矿端自给的中小产能排在一体化与龙头之前；龙佰虽有矿端+氯化法+出口三重优势，但那些是独立于本轮 700 元的结构线。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">金浦钛业 ＞ 惠云钛业 ＞ 钛能化学。gene：金浦是 2.18 元档微盘、换手 3.75% 全链最高，低价筹码载体属性最强；惠云 25 亿创业板小盘次之；钛能量能翻倍但流通盘 167 亿，情绪属性最弱。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若生意社基准价向 15000 元/吨收敛**且**行业开工率回升至 75% 以上 → 逻辑状态由「涨价函流于形式」升为「价差修复」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 基准价突破 15000 元/吨 ② 出现第七轮调价函 ③ 龙佰三季报钛白粉毛利率环比回升 ④ 两矿整合公告落地。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 基准价跌回 14060 元/吨下方 ② 发函企业出现取消调价 ③ 龙佰毛利率同比降幅扩大至 10pct 以上 ④ 出口增速由 +16.56% 转负。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">盯的是**基准价不是调价函**。21 家企业同一天涨同样的 700 元，是协同不是供需；生意社基准价在发函后只动了 1.00%，而函面是 4.5%——这 3.5pct 的缺口就是本轮的全部真相。更值得注意的是发涨价的龙佰自己 9/11 跌 4.34%、9/16 还是全链唯一收绿，半年报归母 -39.08%、毛利率 -9.58pct。涨价是真的，赚钱还不是。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>情景推演</h2>\n    <div style=\"font-size:12px;color:var(--dim);margin-bottom:8px\">每个分支为可观察的条件树——触发条件兑现后的逻辑状态与验证信号，互斥且可证伪。不含操作建议。</div>\n    <div class=\"scen\"><div class=\"sc\"><div class=\"br\">▸ 价差扩张·涨价落地为利润</div><div class=\"tg\">触发：<b>生意社基准价向 15000 元/吨收敛 / 行业开工率回升至 75% 以上 / 硫磺硫酸价格见顶回落 / 出现第七轮调价函</b></div><div class=\"ls\">逻辑状态：<b>逻辑性质发生反转：700 元从『托底试探』变为『价差修复』，钛白粉板块毛利率开始环比回升。此时成本敞口最大的中小产能弹性最大，惠云、钛能、金浦的领涨获得基本面支撑；龙佰作为矿端+氯化法+出口三重优势者成为机构配置首选。本档案的『未兑现』定性被推翻</b></div><div class=\"fs\">观察信号：<b>龙佰集团由全链唯一收绿转为领涨 / 钛白粉股首次进入涨停题材地图 / 出现第七轮调价函</b></div></div><div class=\"sc\"><div class=\"br\">▸ 价差压缩·涨价函流于形式</div><div class=\"tg\">触发：<b>基准价维持 14200 元/吨附近或回落 / 硫磺硫酸继续上行 / 行业开工率维持 70% 以下 / 出现企业取消调价</b></div><div class=\"ls\">逻辑状态：<b>维持本档案的定性：涨价是成本倒挂下的协同试探，无法沉淀为利润。权益端呈现『跟随股情绪脉冲、龙头持续跑输』的分化格局，9/16 的反向排序成为常态而非异常。真正的受益线索不在钛白粉价格上，而在龙佰的出口结构、氯化法占比与两矿整合三条独立结构线上</b></div><div class=\"fs\">观察信号：<b>龙佰相对上证的负超额持续扩大 / 惠云钛业、金浦钛业换手率居高但股价回落 / 钛白粉持续缺席涨停题材地图</b></div></div><div class=\"sc\"><div class=\"br\">▸ 需求塌陷·全链降温</div><div class=\"tg\">触发：<b>地产竣工数据进一步走弱 / 下游涂料企业集中减产 / 出口增速由 +16.56% 转负 / 欧盟反倾销范围扩大</b></div><div class=\"ls\">逻辑状态：<b>成本推动的涨价失去最后的需求支点，基准价跌破 8 月低点 14060 元/吨，行业回到盈亏平衡线以下的出清阶段。本链条作为题材的生命周期结束，钛白粉回到纯粹的周期底部资产属性</b></div><div class=\"fs\">观察信号：<b>钛白粉基准价跌破 13500 元/吨（一年区间最低值） / 行业开工率跌破 65% / 龙佰单季度再现亏损</b></div></div><div class=\"sc\"><div class=\"br\">▸ 结构线独立兑现</div><div class=\"tg\">触发：<b>两矿整合公告落地 / 氯化法销量增速维持 40% 以上 / 出口占比继续提升至 65% 以上 / 英国 Venator 工厂满产</b></div><div class=\"ls\">逻辑状态：<b>钛白粉价格横盘但龙佰通过矿端自给率提升、氯化法结构升级、海外产能规避反倾销三条路径单独兑现利润，与行业价格脱钩。此时本档案的『链内排序』框架失效，龙佰从『钛白粉股』变为『资源+材料平台』</b></div><div class=\"fs\">观察信号：<b>龙佰毛利率环比改善而行业基准价未涨 / 两矿整合投产公告 / 海外营收占比与毛利率同步提升</b></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>生意社/隆众下一期钛白粉基准价向 15000 元/吨收敛（对应函面 4.5% 涨幅开始兑现，而非当前的 1.00%）</b></li><li><b>行业开工率自 70% 以下回升至 75% 以上（新价订单放量，而非低价单亏损生产）</b></li><li><b>龙佰集团三季报钛白粉板块毛利率环比回升，接近或超过 2025 年同期的 27.11%</b></li><li><b>两矿整合公告落地（公司指引 2026 年 9-10 月），钛精矿年产能提升至 248 万吨路径明确</b></li><li><b>出现第七轮调价函且幅度不低于 700 元/吨（协同挺价持续而非一次性试探）</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>生意社基准价跌回 14060 元/吨下方（即回吐 8 月以来的全部修复，第六轮涨价完全落空）</b></li><li><b>硫磺、硫酸价格继续上行，钛白粉板块毛利率在下一份财报中同比降幅扩大至 10pct 以上</b></li><li><b>21 家发函企业中出现率先降价或取消调价的案例（协同破裂）</b></li><li><b>下游涂料企业发出拒采或减产信号，行业开工率跌破 65%</b></li><li><b>龙佰两矿整合审批再度延后，钛精矿自给率提升路径落空</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">9 月下旬</div><div class=\"wh\">生意社/隆众下一期钛白粉基准价，对照函面 14500-15500 元/吨的区间上沿</div><div class=\"wy\">这是判断『涨价函是否落地为成交价』的唯一客观刻度——不看函面看基准价</div></div><div class=\"tkc\"><div class=\"w\">9-10 月</div><div class=\"wh\">龙佰集团两矿整合公告与钛精矿产能释放节奏</div><div class=\"wy\">自给率从当前水平升至 80% 是龙佰独立于行业价格的核心变量</div></div><div class=\"tkc\"><div class=\"w\">三季报</div><div class=\"wh\">龙佰集团、钛能化学、惠云钛业、安纳达的钛白粉业务毛利率环比</div><div class=\"wy\">公司级证据，直接证实或证伪『700 元能否修复价差』</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">硫磺、硫酸、钛精矿三原料价格与钛白粉出口月度增速</div><div class=\"wy\">成本端与需求端的两个 exogenous 变量——它们决定了价差方向</div></div></div>\n\n    <div class=\"src\">数据来源：中国经济网/证券日报 9/16《钛白粉企业集中开启旺季挺价》· 生意社 9/14 钛白粉基准价 14200 元/吨与 8 月 -9.06% 监测 · 同花顺期货 9/16《700 元/吨的试探》· 北方有色网（截至 9/15 共 21 家发函）· Mysteel 年内调价序列统计 · 龙佰集团 2026 年半年报及 8/27 调研纪要（归母 -39.08%、毛利率 -9.58pct、出口占比 61.67%、氯化法 +40%、两矿整合 248 万吨）· 东方财富 7×24 快讯 9/16 00:16 · 东方财富行情接口 9/11-9/16 开高低收与成交额换手 · 本工作区 out/fupan_20260916.json 复盘数据</div>\n    <footer>钛白粉六轮集体挺价 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "vlcc-freight-record-4480", "title": "美油运亚运费创纪录", "date": "2026-09-16", "grade": "正式档", "pricing": "已定价", "crate": "warn", "search": "美油运亚运费创纪录 美湾→中国 200 万桶 vlcc 运费 4480 万美元 · 较战前 1780 万 +152% · 阿曼湾线 worldscale 450 为常态 4.5 倍 · 但当日油运股冲高回落全线收绿 证伪型 ⚠ 涨价实锤级 · 运价历史新高当日油运股超额 -2.28~-4.61pct，已定价后的利好兑现", "card": "<a class=\"card-c\" href=\"#vlcc-freight-record-4480\" data-search=\"美油运亚运费创纪录 美湾→中国 200 万桶 vlcc 运费 4480 万美元 · 较战前 1780 万 +152% · 阿曼湾线 worldscale 450 为常态 4.5 倍 · 但当日油运股冲高回落全线收绿 证伪型 能源地缘·中东供断与成品油 已定价 中远海能 招商轮船 招商南油 中远海特 恒力石化\" data-grade=\"正式档\" data-pricing=\"已定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-16</span>\n    <span class=\"crate warn\">⚠ 涨价实锤级 · 运价历史新高当日油运股超额 -2.28~-4.61pct，已定价后的利好兑现 证伪型</span>\n  </div>\n  <div class=\"ctitle\">美油运亚运费创纪录</div>\n  <div class=\"csub\">美湾→中国 200 万桶 VLCC 运费 4480 万美元 · 较战前 1780 万 +152% · 阿曼湾线 Worldscale 450 为常态 4.5 倍 · 但当日油运股冲高回落全线收绿</div>\n  <div class=\"cpos\">美湾运中国 VLCC 运费 4480 万美元创纪录，但当日招商轮船 -3.12%、中远海能 -1.57%，年内已涨 82~127%——运价新高未转化为股价。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">能源地缘·中东供断与成品油</span>\n    \n    <span class=\"chip pri\">已定价</span>\n    <span class=\"chip\">标的 7</span>\n    <span class=\"nm\">中远海能</span><span class=\"nm\">招商轮船</span><span class=\"nm\">招商南油</span><span class=\"nm\">中远海特</span><span class=\"nm\">恒力石化</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-16 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-16</div>\n    <h1>美油运亚运费创纪录</h1>\n    <div class=\"sub\">美湾→中国 200 万桶 VLCC 运费 4480 万美元 · 较战前 1780 万 +152% · 阿曼湾线 Worldscale 450 为常态 4.5 倍 · 但当日油运股冲高回落全线收绿</div>\n    <div class=\"badges\">\n      <span class=\"badge warn\">⚠ 涨价实锤级 · 运价历史新高当日油运股超额 -2.28~-4.61pct，已定价后的利好兑现</span>\n      <span class=\"badge neutral\">证伪型</span>\n      <span class=\"badge neutral\">定价状态：已定价</span>\n      <span class=\"badge neutral\">主线：能源地缘·中东供断与成品油</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">oil-tanker-supercycle</span><span class=\"tag\" style=\"margin-right:4px\">saudi-east-west-pipeline</span><span class=\"tag\" style=\"margin-right:4px\">russia-diesel-outage</span><span class=\"tag\" style=\"margin-right:4px\">oil-hormuz</span><span class=\"tag\" style=\"margin-right:4px\">diesel-crack-record</span></div>\n    <div class=\"posnote\">美湾运中国 VLCC 运费 4480 万美元创纪录，但当日招商轮船 -3.12%、中远海能 -1.57%，年内已涨 82~127%——运价新高未转化为股价。</div>\n    <details class=\"more\"><summary>展开定价状态详版（1000 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化由财联社在 <strong>9/16 13:04</strong> 发出，属<strong>盘中发布</strong>，本应是当日最强的即时利好。但盘面给出的是教科书级反向：<strong>三只油运标的高开冲高后全线回落收绿</strong>。招商轮船（601872）开 20.80（+1.46%）、盘中最高 21.10（+2.93%）、最低 19.45（-5.12%），<strong>收 19.86、-3.12%</strong>，振幅 8.05%，换手 1.83%，成交 29.57 亿，量比 0.77；中远海能（600026）开 21.50（+2.14%）、最高 21.69（+3.04%）、最低 20.31（-3.52%），<strong>收 20.72、-1.57%</strong>，振幅 6.56%，换手 1.74%，成交 13.83 亿，港股 01138 同步 -1.30%、AH 溢价 -24.88%；招商南油（601975）开 4.68（+1.30%）、最高 4.70、最低 4.39，<strong>收 4.44、-3.90%</strong>，换手 5.56% 为三只最高，成交 11.68 亿。相对上证 +0.71% 的超额分别为 <strong>-3.83pct、-2.28pct、-4.61pct</strong>。<strong>为何是『已定价』</strong>：三只年内涨幅分别为 <strong>+127.49%、+82.48%、+48.35%</strong>，20 日涨幅 +6.77%、+12.55%、+17.77%——运价上行的预期已被充分甚至过度反映；而 5 日涨幅已全部转负（-5.38%、-3.78%、-7.69%），说明<strong>在本次新高之前，资金就已开始撤离</strong>。中远海能 2026H1 营收 151.46 亿元（+30.10%）、归母净利润 45.45 亿元（<strong>+143.12%</strong>）——业绩环早已兑现，PE(TTM) 16.89 倍、PB 2.36 倍。结论：<strong>商品端的极值不等于权益端的弹性</strong>，当运费创历史新高的消息发布而股价反向时，说明该变量已在价格里，市场在交易的是<strong>『下一个边际变量是什么』</strong>而非『当前运价有多高』。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">事件本体</b><div class=\"v\">据波罗的海交易所数据，截至 9 月 15 日（周二），租用一艘超大型原油运输船（VLCC）从美国墨西哥湾沿岸向中国运送 <strong>200 万桶</strong>原油的费用约 <strong>4480 万美元</strong>，<strong>创历史最高纪录</strong>，较前一日的 3900 万美元跳升 580 万美元。而在 2 月底伊朗战争爆发之前，这一费用仅约 <strong>1780 万美元</strong>——累计涨幅 <strong>+152%</strong>（财联社 9/16 13:04、华尔街见闻、群益期货多源一致）。</div></div><div class=\"card fact\"><b class=\"k\">全航线同步极值</b><div class=\"v\">不止美湾一条线：上周阿曼湾至中国的 VLCC 运费已升至国际油运基准费率（Worldscale）约 <strong>450</strong>，即正常基准运费的 <strong>4.5 倍</strong>，折合每桶运费约 <strong>11.50 美元</strong>，创该航线开通以来最高纪录。运力端同步收紧：霍尔木兹海峡、曼德海峡、苏伊士运河因安全问题运力下降，巴拿马运河因厄尔尼诺限制每日通行量——<strong>四大通道同时受限</strong>是本轮与以往周期最大的不同。</div></div><div class=\"card fact\"><b class=\"k\">套利为何仍然成立</b><div class=\"v\">运费创纪录却没有抑制需求，关键在于<strong>价差缓冲</strong>：以 WTI 为参照，即使计入高昂运费，运抵亚洲后的综合到岸成本仍低于阿联酋 Murban 原油等竞争货源（发稿时布伦特 107.8、WTI 104.6、穆尔班 <strong>123.8</strong> 美元/桶）。WTI 因需求走强单日涨幅逾 4%、创 4 月以来新高，与布伦特价差已<strong>收窄至 3 美元以内</strong>。Kpler 数据显示 <strong>10 月已有 6 艘 VLCC</strong> 计划从美湾装原油驶往亚洲，采购意愿并未明显降温。</div></div><div class=\"card fact warn\"><b class=\"k\">业绩早已兑现</b><div class=\"v\">中远海能 2026 年上半年实现营业收入 <strong>151.46 亿元、同比 +30.10%</strong>，归母净利润 <strong>45.45 亿元、同比 +143.12%</strong>；外贸原油占主营收入 <strong>54.62%</strong>，是最大的收入来源。当前 PE(TTM) 16.89 倍、PB 2.36 倍，年内股价已涨 82.48%。<strong>运价的上行已经完整传导到报表</strong>——这是判断『已定价』最硬的基本面证据：不是预期未兑现，而是兑现完了。</div></div><div class=\"card fact warn\"><b class=\"k\">争议点：极值之后是边际</b><div class=\"v\">4480 万美元是<strong>单船即期成交价</strong>，属极值样本；而运价的持续性取决于运力与需求的相对速度。当前三只标的年内涨幅 48~127%、20 日涨幅 6.77~17.77%，意味着市场已经把『高运价持续』写进了价格。此后真正决定方向的是<strong>边际变化</strong>：霍尔木兹是否重开、沙特管道是否复通、巴拿马通行量是否恢复——任何一个缓和信号都会先冲击运价预期，再冲击股价。<strong>极值是好事，但极值不可持续本身就是风险。</strong></div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/16（上证 +0.71%）油运三只<strong>全部高开冲高、尾盘收绿</strong>，且新闻 13:04 盘中发布后未能止跌：招商轮船开 +1.46%、盘中最高 +2.93%、<strong>收 -3.12%</strong>（超额 <strong>-3.83pct</strong>，振幅 8.05%、换手 1.83%、成交 29.57 亿、量比 0.77）；中远海能开 +2.14%、最高 +3.04%、<strong>收 -1.57%</strong>（超额 <strong>-2.28pct</strong>，成交 13.83 亿，港股 01138 同步 -1.30%）；招商南油开 +1.30%、<strong>收 -3.90%</strong>（超额 <strong>-4.61pct</strong>，换手 5.56% 为三只最高、成交 11.68 亿）。时间维度更关键：三只 <strong>5 日涨幅已全部转负</strong>（-5.38%、-3.78%、-7.69%），而 20 日仍为正（+6.77%、+12.55%、+17.77%）、年内为 +127.49%/+82.48%/+48.35%——<strong>在运价创纪录之前，资金就已开始撤离</strong>。当日 91 只涨停中无一油运股。结论：本催化在权益端<strong>已定价且正在反向兑现</strong>。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-02 月底</div><div><div class=\"x\">伊朗战争爆发。此前美湾→中国 200 万桶 VLCC 运费约 <strong>1780 万美元</strong>。</div><div class=\"y\">为什么：本轮全球油运重定价的<strong>零点基准</strong>——所有后续涨幅都要对着这个数字读，4480 万对应 +152%。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-08</div><div><div class=\"x\">霍尔木兹海峡风险升温，布伦特原油逼近 100 美元/桶（对应档案 <strong>oil-hormuz</strong>）。</div><div class=\"y\">为什么：主线第一段：性质是<strong>风险溢价</strong>——市场为『可能断供』付钱，而非为『已经断供』付钱。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-11 至 09-14</div><div><div class=\"x\">沙特关闭东西输油管道——这条管道是沙特绕开霍尔木兹海峡的主要出口通道（对应档案 <strong>saudi-east-west-pipeline</strong>）。</div><div class=\"y\">为什么：第二段、性质<strong>质变点</strong>：缓冲与绕行机制失效，从『风险溢价』变为『实物短缺』。美油作为替代供应源的战略价值由此确立，直接奠定了本档案美湾航线的需求基础。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-13</div><div><div class=\"x\">VLCC TCE 创历史新高，主线二段升级、定价进入风险溢价主导（对应档案 <strong>oil-tanker-supercycle</strong>）。</div><div class=\"y\">为什么：第三段：A 股权益端开始为运价定价。三只油运标的年内涨幅在此后进一步扩张至 48~127%。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-15</div><div><div class=\"x\">波罗的海交易所数据：截至周二，美湾→中国 200 万桶 VLCC 运费约 <strong>4480 万美元</strong>，较前一日 3900 万美元跳升 580 万，创历史最高纪录；上周阿曼湾→中国 VLCC 运费已升至 Worldscale 约 <strong>450</strong>（正常基准的 4.5 倍）、折合每桶约 11.50 美元，创该航线开通以来最高。Kpler 数据显示 10 月已有 <strong>6 艘</strong> VLCC 计划从美湾装原油驶往亚洲。</div><div class=\"y\">为什么：第四段、本档案成立点：<strong>运价抵达历史极值</strong>。但同一天，三只油运标的出现『高开冲高、尾盘收绿』的反向形态——极值催化与股价方向首次背离，这是主线从『未定价』走向『已兑现』的分水岭。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-16 13:04</div><div><div class=\"x\">财联社《美国原油输往亚洲成本创新记录！200 万桶原油运费高达 4480 万美元》盘中发布；同期 WTI 单日涨幅逾 4%、创 4 月以来新高，与布伦特价差收窄至 3 美元以内；美国柴油期货结算价升至每加仑 5.26 美元以上创纪录新高。</div><div class=\"y\">为什么：消息出街的时点在<strong>盘中</strong>，给了当日充分的反应时间——但招商轮船、中远海能、招商南油<strong>午后未能止跌</strong>，全线收绿。这条时间线排除了『没来得及反应』的解释，坐实了『已定价』的定性。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这条链的<strong>分水岭时点</strong>是 9/11 沙特关闭东西输油管道——绕行机制失效后，全球原油贸易流被强制重构，美湾从『边际供应源』升级为『战略替代源』，这是 4480 万美元这个数字的真正来源。<strong>传导的关键约束</strong>在套利价差而非运价本身：只要 WTI 到岸成本仍低于 Murban（当前 WTI 104.6 vs 穆尔班 123.8），买家就能吸收高运费，贸易就不会断裂；因此<strong>运价的天花板由 Murban 与 WTI 的价差决定，而不是由船东定价权决定</strong>——这是一个极易被误读的点：4480 万看似是船东暴利，实质是价差租金的转移。<strong>待验证的核心变量</strong>是运力约束的解除速度：霍尔木兹、曼德、苏伊士、巴拿马四大通道同时受限是历史罕见状态，任何一条恢复都会快速释放有效运力。<strong>隐藏面</strong>是估值与业绩的赛跑已经结束：中远海能 H1 归母 +143.12%、PE 16.89 倍，股价年内 +82.48%——基本面兑现与股价涨幅已经匹配，此后继续上涨需要<strong>新的边际变量</strong>而非更高的运价读数。<strong>反直觉点</strong>：9/16 三只标的高开冲高后全线收绿，且盘中 13:04 出极值利好仍未能止跌——这说明市场交易的早已不是『运价多高』，而是『运价还能高多久』；在极值出现的当天，第二个问题的答案必然是收敛的。这也是本档案被定性为<strong>证伪型</strong>的原因：催化落地、核心标的反向，且反向不是因为催化为假，而是因为催化<strong>太真、已兑现</strong>。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>美湾→中国 200 万桶 VLCC 运费 4480 万美元创历史纪录，较战前 1780 万 +152%，单日跳升 580 万</li><li>阿曼湾→中国 WS 约 450（正常 4.5 倍）、每桶约 11.50 美元，创航线开通以来最高；四大运河/海峡同时受限</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">已兑现</span><ul><li>中远海能 2026H1 营收 151.46 亿 +30.10%、归母 45.45 亿 +143.12%，外贸原油占主营 54.62%</li><li>Kpler：10 月已有 6 艘 VLCC 计划从美湾驶往亚洲，高运费未抑制采购意愿</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">已透支</span><ul><li>中远海能 PE(TTM) 16.89、PB 2.36，年内 +82.48%；招商轮船 PE(TTM) 14.78、PB 3.42，年内 +127.49%</li><li>业绩兑现与股价涨幅已匹配，继续上行需要新的边际变量而非更高的运价读数</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">反向</span><ul><li>9/16 三只全线冲高回落：招商轮船 -3.12%（超额 -3.83pct）、中远海能 -1.57%（-2.28pct）、招商南油 -3.90%（-4.61pct）</li><li>5 日涨幅已全部转负（-5.38%/-3.78%/-7.69%），资金在运价创纪录之前就已开始撤离</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响已兑现、业绩已透支、股价反向——这是『真利好但已定价』的证伪型样本，不是运价新高带来的机会。</div>\n    <ul class=\"assess\"><li>闭合度 40%——四环中『业绩』与『股价』两环为负：基本面兑现已完成且股价已充分反映，逻辑不是『运价高→股价涨』而是『运价已高→股价已涨→极值兑现即离场』。</li><li>边界切分：<strong>受益方是拥有 VLCC 船队的外贸原油承运商</strong>（中远海能外贸原油占 54.62%、招商轮船）；<strong>时滞受益方</strong>是成品油轮与 LNG 运输（中远海能内贸原油 10.95%、LNG 运输 10.04%）；<strong>不同链</strong>是干散货与集运（中远海特走特种船，与本链条不同驱动）；<strong>受损方是炼化企业</strong>——高运费直接抬高到岸原油成本，在成品油价受调控的市场里无法完全转嫁。判断任一标的只需问一句：<strong>它在运费上是多头还是空头</strong>。</li><li>主线联动：本档案是<strong>『能源地缘·中东供断与成品油』主线的第四段，也是方向转折段</strong>。前五份（oil-hormuz 风险溢价 → saudi-east-west-pipeline 绕行失效 → oil-tanker-supercycle 权益端定价 → diesel-crack-record / russia-diesel-outage 成品油实物断供）共同构成本主线的完整生命周期，而本档案记录的是<strong>『权益端定价完成、利好开始反向兑现』</strong>这一阶段——它为整条主线提供了估值锚与退出刻度：当极值催化出现而股价反向时，说明主线已进入兑现阶段而非展开阶段。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中远海能</b><span class=\"code\">600026</span><span class=\"tag\">H1 归母 45.45 亿 +143.12%，9/16 超额 -2.28pct</span><span class=\"cap\">20.72 元 · 流通 793 亿 · 9/16 -1.57%</span></div>\n    <div class=\"logic\">外贸原油占 54.62%·跌幅最小</div>\n    <div class=\"detail\">国内最大油轮船队，外贸原油占主营收入 <strong>54.62%</strong>，是本链条上业绩兑现最充分的样本：2026H1 营收 151.46 亿（+30.10%）、归母 45.45 亿（<strong>+143.12%</strong>）。9/16 开 +2.14%、最高 +3.04%、收 -1.57%，是三只中跌幅最小的一只，与其基本面质量排序一致。多货种结构（内贸原油 10.95%、LNG 10.04%、成品油 7.61%）在单一航线回落时提供缓冲。PE(TTM) 16.89、PB 2.36，年内 +82.48%——估值已充分反映高运价预期。</div>\n    \n    \n    <div class=\"risk\">⚠️ 霍尔木兹或沙特管道恢复将快速释放有效运力；H 股 AH 溢价 -24.88% 反映国际资金更谨慎</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>招商轮船</b><span class=\"code\">601872</span><span class=\"tag\">年内 +127.49%，9/16 开 +1.46%、高 +2.93%、收 -3.12%</span><span class=\"cap\">19.86 元 · 流通 1604 亿 · 9/16 -3.12%</span></div>\n    <div class=\"logic\">振幅 8.05%·冲高回落最典型</div>\n    <div class=\"detail\">综合航运平台（VLCC+干散货），本年主线中<strong>弹性最大</strong>的标的：年内 +127.49% 为三只之首。9/16 分时是全链信息量最大的一段：开 20.80（+1.46%）→ 最高 21.10（+2.93%）→ 最低 19.45（-5.12%）→ 收 19.86（-3.12%），<strong>振幅 8.05%</strong>、成交 29.57 亿、量比 0.77。13:04 极值利好出街后未能带来任何反弹，是『利好兑现即出货』的典型形态。PB 3.42 倍为三只最高，估值回撤压力最大。</div>\n    \n    \n    <div class=\"risk\">⚠️ PB 3.42 倍估值最高，回撤空间最大；5 日 -5.38% 已显示资金撤离；综合航运属性使其同时暴露于干散货周期</div>\n  </div></div><div class=\"t\">🏛️ 容量中军 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>招商南油</b><span class=\"code\">601975</span><span class=\"tag\">20 日 +17.77% 最高、5 日 -7.69% 回撤最深</span><span class=\"cap\">4.44 元 · 流通 208 亿 · 9/16 -3.90%</span></div>\n    <div class=\"logic\">成品油轮为主·换手 5.56% 最高</div>\n    <div class=\"detail\">以成品油与化学品运输为主的小盘标的，本链条上<strong>情绪属性最强</strong>的一只：9/16 换手 <strong>5.56%</strong>（另两只仅 1.83%、1.74%）为三只最高，成交 11.68 亿。20 日涨幅 +17.77% 为三只最高，说明最近一段它是资金的弹性首选；5 日 -7.69% 又是回撤最深，9/16 再跌 3.90%（超额 -4.61pct 最差）。PE(TTM) 13.38、PB 1.70 为三只最低。关键差异：<strong>它受益于成品油运价而非原油 VLCC 运价</strong>，而本催化的主角是原油 VLCC——这解释了它在极值日跌幅最大。</div>\n    \n    \n    <div class=\"risk\">⚠️ 换手 5.56% 筹码极不稳定；主营与原油 VLCC 链条不完全重合，存在映射偏差</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中远海特</b><span class=\"code\">600428</span><span class=\"tag\">9/16 航运港口板块 -0.67%、交通运输 -0.59%</span><span class=\"cap\">特种船·反例锚</span></div>\n    <div class=\"logic\">不同链·用于拆出板块 beta</div>\n    <div class=\"detail\">主营多用途船、重吊船、半潜船等特种运输，与本链条的原油运输驱动不同。把它放进容量中军的意义是<strong>拆出板块 beta</strong>：9/16 航运港口板块整体 -0.67%、交通运输 -0.59%，油运三只的跌幅中含有板块性资金流出成分。这是判断『三只收绿是否等于对本催化的否定』时必须扣除的部分——扣除后，剩余的超额（-2.28~-4.61pct）才是对极值催化的真实裁决。</div>\n    \n    \n    <div class=\"risk\">⚠️ 与本链条不同链，不能作为运价直接映射；受全球工程物流需求影响</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>恒力石化</b><span class=\"code\">600346</span><span class=\"tag\">高运费抬高到岸成本，转嫁能力受限</span><span class=\"cap\">民营炼化·本链条受损方</span></div>\n    <div class=\"logic\">运费的成本端反向锚</div>\n    <div class=\"detail\">作为本链条的<strong>反向锚</strong>列入观察档：4480 万美元的 VLCC 运费最终要计入炼厂到岸成本，而成品油价格受调控、柴油裂解价差已创纪录（见 diesel-crack-record），成本转嫁能力受限。观察它的超额变化可衡量市场是否开始把『高运价』读作炼化的成本利空——<strong>若它持续跑输而油运股跌幅收窄，说明市场已在按『承运商受益/炼厂受损』的边界切分定价</strong>，本链条的传导才算真正被市场理解。</div>\n    \n    \n    <div class=\"risk\">⚠️ 炼化景气同时受原油绝对价格、裂解价差、成品油调控三重影响，运费只是其中一个变量</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>招商南油</b><span class=\"code\">601975</span><span class=\"tag\">20 日 +17.77%、5 日 -7.69%，双向极致波动</span><span class=\"cap\">4.44 元 · 流通 208 亿 · 换手 5.56%</span></div>\n    <div class=\"logic\">4 元档低价·高换手载体</div>\n    <div class=\"detail\">4.44 元的低价属性 + 208 亿流通盘 + 5.56% 换手，使它成为本轮油运行情中<strong>纯情绪资金的载体</strong>。它的特征是<strong>双向极致</strong>：20 日 +17.77%（三只最高）与 5 日 -7.69%（回撤最深）并存，说明进出的都是同一批短线资金。作为情绪小票，它的作用是标定本轮油运行情的<strong>情绪温度</strong>——当它的换手率从 5.56% 回落至 3% 以下时，代表情绪资金已撤离完毕。</div>\n    <div class=\"gene\">🧬 题材基因：4 元档低价航运股，历次油运/航运涨价题材中作为低价补涨标的表现，2024 年红海绕行行情中曾出现连续涨停，是资金对『运价上涨』的条件反射标的</div>\n    \n    <div class=\"risk\">⚠️ 低价高换手，价格与产业基本面短期脱钩；主营成品油运输与原油 VLCC 存在映射偏差</div>\n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>招商轮船</b><span class=\"code\">601872</span><span class=\"tag\">开 +1.46% → 高 +2.93% → 收 -3.12%，振幅 8.05%</span><span class=\"cap\">19.86 元 · 流通 1604 亿 · 9/16 -3.12%</span></div>\n    <div class=\"logic\">认知锚·年内涨 127% 后首现反向</div>\n    <div class=\"detail\">市场对『油价/运价上涨 → 买招商轮船』有极强的条件反射记忆，年内 +127.49% 已使其成为本主线的<strong>认知锚</strong>。但正是它，在极值催化当天走出了全链最典型的冲高回落：开 +1.46%、盘中最高 +2.93%、收 -3.12%，振幅 8.05%、成交 29.57 亿。这个形态的意义在于<strong>基因记忆被真实定价逻辑压制</strong>——前几轮（2024 红海绕行）它是在『未定价』状态下被资金推起来的，而本轮它已经带着 +127.49% 的年内涨幅站在高位，同样的催化，效果完全相反。<strong>基因还在，位置变了。</strong></div>\n    <div class=\"gene\">🧬 题材基因：2024 年红海绕行行情与 2026 年 2 月伊朗战争行情的绝对龙头，市场对『油运涨价 → 买招商轮船』有强条件反射——但前两轮启动时它处于低位，本轮已年内翻倍，同样的催化在不同位置效果相反</div>\n    \n    <div class=\"risk\">⚠️ PB 3.42 倍为三只最高；5 日 -5.38% 显示资金撤离；若极值催化持续无法转化为股价，基因记忆会加速瓦解</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2026-02 月底：伊朗战争爆发前，美湾→中国 200 万桶 VLCC 运费约 1780 万美元——本轮全球油运重定价的零点基准</li><li>2026-09-11 至 09-14：沙特关闭东西输油管道，绕行霍尔木兹的主要通道中断，美油升级为战略替代源（对应 saudi-east-west-pipeline）</li><li>2026-09-13：VLCC TCE 创历史新高，A 股权益端进入风险溢价主导定价（对应 oil-tanker-supercycle），三只标的年内涨幅在此后扩张至 48~127%</li><li>2026-09-16：运费 4480 万美元创纪录的消息 13:04 盘中发布，招商轮船、中远海能、招商南油当日分别 -3.12%、-1.57%、-3.90%——主线首次出现『极值催化 + 股价反向』，是本链条从『未定价』转入『已兑现』的记录</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中远海能</b><span class=\"code\">600026</span><span class=\"tag\">外贸原油占比最高·业绩兑现最充分</span></div>\n    <div class=\"logic\">产业地位 | 弹性来源 | 约束条件：国内最大油轮船队，外贸原油占主营 54.62% | H1 归母 45.45 亿、+143.12%，运价上行完整传导至报表 | PE(TTM) 16.89、PB 2.36、年内 +82.48%，估值已反映高运价预期</div>\n    <div class=\"detail\">本链条上<strong>业绩兑现最充分、也是定价最充分</strong>的样本：2026H1 营收 151.46 亿元（+30.10%）、归母净利润 45.45 亿元（<strong>+143.12%</strong>），外贸原油占主营收入 <strong>54.62%</strong>、外贸成品油 7.61%、外贸油轮出租 7.25%——外贸敞口合计近七成，是运价上行最直接的承接方。独特之处在于它的<strong>多货种结构</strong>（内贸原油 10.95%、LNG 运输 10.04%、化学品 1.31%、LPG 1.18%），使其在单一航线运价回落时有部分缓冲。9/16 开 +2.14%、最高 +3.04%、收 -1.57%，超额 -2.28pct，是三只中<strong>跌幅最小</strong>的一只，与其基本面质量排序一致。港股 01138 同步 -1.30%、AH 溢价 -24.88%。约束是估值：PE(TTM) 16.89 倍、PB 2.36 倍已高于历史中枢，年内 +82.48% 的涨幅基本兑现了 H1 的业绩爆发。</div>\n    \n    <div class=\"confirm\">✔ 确认：Q3 单季归母净利润环比继续增长 / 新增 VLCC 运力投放或租入合同 / 外贸原油运价在下一期报告中维持高位</div>\n    <div class=\"risk\">⚠️ 若霍尔木兹或沙特管道恢复，有效运力快速释放，运价回落将直接压缩外贸原油毛利；H 股折价 24.88% 反映国际资金定价更谨慎</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>招商轮船</b><span class=\"code\">601872</span><span class=\"tag\">年内涨幅最大·回撤也最深</span></div>\n    <div class=\"logic\">产业地位 | 弹性来源 | 约束条件：综合航运平台，VLCC 与干散货并重 | 运价上行期弹性最大，年内 +127.49% 为三只之首 | PB 3.42 为三只最高，5 日 -5.38%，估值回撤压力最大</div>\n    <div class=\"detail\">本链条上<strong>弹性最大、回撤也最深</strong>的样本：年内涨幅 <strong>+127.49%</strong> 为三只之首，PB <strong>3.42</strong> 倍也是最高（中远海能 2.36、招商南油 1.70）。9/16 它的分时是三只中信息量最大的：开 +1.46%、盘中最高 +2.93%（21.10 元）、最低 -3.52%（19.45 元）、<strong>收 -3.12%</strong>，<strong>振幅 8.05%</strong>，成交 29.57 亿为三只最大，量比 0.77。高开冲高后全天单边回落，且 13:04 的极值利好未能带来任何反弹——这是<strong>『利好兑现即出货』</strong>的典型形态。独特之处在于它的综合航运属性（干散货+油运），使其同时暴露于两条不同的周期，9/16 航运港口板块整体 -0.67% 说明当日是板块性资金流出而非个股事件。</div>\n    \n    <div class=\"confirm\">✔ 确认：VLCC 期租合同续签价格 / 干散货（BDI）与油运运价是否同步走强 / 单季度 ROE 能否支撑 PB 3.42 倍</div>\n    <div class=\"risk\">⚠️ PB 3.42 倍为三只最高，估值回撤空间最大；5 日 -5.38% 已显示资金撤离，20 日 +6.77% 的涨幅面临回吐压力</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>招商南油</b><span class=\"code\">601975</span><span class=\"tag\">成品油轮为主·换手最高情绪最重</span></div>\n    <div class=\"logic\">产业地位 | 弹性来源 | 约束条件：以成品油与化学品运输为主的小盘标的 | 运价上行的高 beta 载体，20 日 +17.77% 为三只最高 | 换手 5.56% 为三只最高，筹码最不稳定，5 日 -7.69% 回撤最深</div>\n    <div class=\"detail\">本链条上<strong>情绪属性最强</strong>的样本：流通市值 207.81 亿元为三只最小，9/16 换手 <strong>5.56%</strong>（招商轮船 1.83%、中远海能 1.74%）为三只最高，成交 11.68 亿。它的<strong>20 日涨幅 +17.77%</strong> 是三只最高，说明在最近的运价上行段它是资金首选的弹性载体；但 <strong>5 日 -7.69%</strong> 也是回撤最深，9/16 再跌 3.90%（超额 -4.61pct 为三只最差）。PE(TTM) 13.38 倍、PB 1.70 倍是三只中最低，估值仍有安全边际，但这更多反映其主营（成品油/化学品运输）与原油运输的<strong>链条位置差异</strong>——它受益于成品油运价而非原油运价，而本催化的主角是原油 VLCC。这个差异是理解它 9/16 跌幅最大的关键。</div>\n    \n    <div class=\"confirm\">✔ 确认：成品油轮运价（而非原油 VLCC 运价）的独立走势 / 换手率回落至 3% 以下（筹码稳定） / 单季度业绩环比</div>\n    <div class=\"risk\">⚠️ 换手 5.56% 显示筹码极不稳定；主营为成品油运输，与本催化的原油 VLCC 链条不完全重合，存在映射偏差</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中远海特</b><span class=\"code\">600428</span><span class=\"tag\">特种船·不同链的反例锚</span></div>\n    <div class=\"logic\">主营多用途船、重吊船、半潜船等特种运输，与本链条的原油运输不同驱动，可作为板块 beta 的对照样本</div>\n    <div class=\"detail\">把它放进延伸档的意义是<strong>拆出板块 beta</strong>：9/16 航运港口板块整体 -0.67%、交通运输 -0.59%，若中远海特同步下跌，说明当日是航运板块性资金流出，油运三只的跌幅中含有一部分板块 beta 而非纯本链条定价。这是判断『三只收绿是否等于对催化的否定』时必须扣除的部分。</div>\n    \n    \n    <div class=\"risk\">⚠️ 与本链条不同链，不能作为运价的直接映射；特种船运价受全球工程物流需求影响</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>恒力石化</b><span class=\"code\">600346</span><span class=\"tag\">炼化受损方·运费的成本端反向锚</span></div>\n    <div class=\"logic\">民营炼化龙头，高运费直接抬高到岸原油成本，在成品油价受调控的市场里无法完全转嫁，是本链条的受损方</div>\n    <div class=\"detail\">作为<strong>反向锚</strong>列入：本链条的受益方是承运商，受损方是付运费的炼厂。4480 万美元的 VLCC 运费最终要计入炼厂的到岸成本。在成品油价格受调控、柴油裂解价差已创纪录（见 diesel-crack-record）的背景下，成本转嫁能力受限。观察它的超额变化，可以衡量市场是否开始把『高运价』读作炼化的成本利空——若它持续跑输，说明市场已在按受损方定价。</div>\n    \n    \n    <div class=\"risk\">⚠️ 炼化景气同时受原油绝对价格、裂解价差、成品油调控三重影响，运费只是其中一个变量</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>干散货与集运标的（中远海特、宁波远洋等）</b><span class=\"code\">600428/—</span></div>\n    <div class=\"logic\">与本链条不同驱动：干散货走的是铁矿石/煤炭/粮食的需求逻辑，集运走的是集装箱贸易量逻辑。4480 万美元是<strong>原油 VLCC</strong>的运费，与它们无关。9/16 航运港口板块整体 -0.67%，若把它们也算作受益方，会误把板块 beta 读成催化效应</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>炼化企业（恒力石化、荣盛石化、卫星化学）</b><span class=\"code\">600346/002493/002648</span></div>\n    <div class=\"logic\">它们是<strong>付运费的一方</strong>，到岸成本随 VLCC 运价同步抬升。在成品油价格受调控、柴油裂解价差已创纪录的背景下成本转嫁受限——是本链条的<strong>受损方</strong>而非受益方。这一边界在 diesel-crack-record 中已被验证过一次：海外油气涨价 ≠ A 股炼化受益</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>内贸油运为主的标的</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">本催化的价格信号来自<strong>外贸即期运价</strong>（美湾-中国、阿曼湾-中国）。以沿海内贸运输为主的标的无法享受国际运价上行，中远海能的内贸原油收入仅占 10.95% 也印证了内外贸运价的割裂</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>港口与码头运营（上港集团、宁波港）</b><span class=\"code\">600018/601018</span></div>\n    <div class=\"logic\">港口收入来自吞吐量与装卸费，与运价水平无直接关系；运价暴涨反而可能因货源结构调整而降低挂靠频次。不在传导链上</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**证伪型**：催化为真但已定价——运价创历史新高当日核心标的反向收绿。基准参照：2024 年红海绕行行情启动时招商轮船处低位，本轮已年内 +127.49%，同样催化在不同位置效果相反。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">中远海能 ＞ 招商轮船 ＞ 招商南油。排序理由：按外贸原油敞口与业绩兑现质量排序——中远海能外贸原油占 54.62%、H1 归母 +143.12% 且 9/16 跌幅最小；招商南油主营成品油运输，与原油 VLCC 链条存在映射偏差。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">招商南油 ＞ 招商轮船 ＞ 中远海能。gene：招商南油 4.44 元低价、换手 5.56% 为三只最高，2024 年红海绕行行情中曾有连续涨停；招商轮船是认知锚但已带 +127% 年内涨幅，位置不利。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若美湾运费维持 4000 万美元以上**且**三只标的 5 日涨幅由负转正 → 逻辑状态由「已兑现」回转为「可延续」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 运费维持 4000 万美元以上 ② WTI-Murban 价差维持 15 美元以上 ③ 四大通道受限未缓解 ④ 中远海能 Q3 归母环比增长。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 运费跌破 3500 万美元 ② WTI-Murban 价差收窄至 10 美元以内 ③ 霍尔木兹或沙特管道恢复 ④ 中远海能 Q3 归母环比下滑。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">盯的是**WTI 与 Murban 的价差，不是运价本身**。4480 万美元之所以能被接受，完全因为 WTI 到岸后仍比 Murban 便宜约 19 美元/桶——价差一旦收窄，这条航线立刻失去存在理由，运价与运量会一起塌。而 9/16 已经给了明确信号：盘中 13:04 出极值利好，招商轮船却从 +2.93% 一路收 -3.12%、振幅 8.05%，中远海能、招商南油同步收绿，三只 5 日涨幅早已全部转负。利好是真的，只是已经不值钱了。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>情景推演</h2>\n    <div style=\"font-size:12px;color:var(--dim);margin-bottom:8px\">每个分支为可观察的条件树——触发条件兑现后的逻辑状态与验证信号，互斥且可证伪。不含操作建议。</div>\n    <div class=\"scen\"><div class=\"sc\"><div class=\"br\">▸ 运价维持极值·业绩继续兑现</div><div class=\"tg\">触发：<b>美湾运费维持 4000 万美元以上 / 四大通道受限状态延续 / WTI-Murban 价差维持 15 美元以上 / 11 月 VLCC 计划数不低于 6 艘</b></div><div class=\"ls\">逻辑状态：<b>高运价从『极值脉冲』变为『新常态』，运力紧张持续。此时市场会重新按新的运价中枢给油运股定价——但前提是当前 48~127% 的年内涨幅已被消化、估值回到合理区间。逻辑状态由『已兑现』回到『可延续』，但需要股价先完成一轮充分调整</b></div><div class=\"fs\">观察信号：<b>三只标的 5 日涨幅由负转正 / 中远海能 Q3 归母环比继续增长 / 招商轮船 PB 回落至 3 倍以下后企稳</b></div></div><div class=\"sc\"><div class=\"br\">▸ 地缘缓和·运价快速回落</div><div class=\"tg\">触发：<b>霍尔木兹海峡恢复通行 / 沙特东西管道复通 / 巴拿马运河通行量恢复 / 伊美冲突出现实质性谈判进展</b></div><div class=\"ls\">逻辑状态：<b>本链条的地缘前提消失，四大通道同时受限的罕见状态解除，有效运力快速释放。4480 万美元成为历史极值而非新中枢。油运股面临『运价回落 + 估值高位』的双杀，本主线的生命周期结束，回到常规油运周期框架</b></div><div class=\"fs\">观察信号：<b>美湾运费跌破 3000 万美元 / 三只标的 20 日涨幅转负 / 中远海能单季度业绩环比下滑</b></div></div><div class=\"sc\"><div class=\"br\">▸ 套利窗口关闭·需求萎缩</div><div class=\"tg\">触发：<b>WTI 因需求走强继续上涨与 Murban 价差收窄至 10 美元以内 / 亚洲买家转向其他货源 / 10 月 6 艘 VLCC 计划被取消</b></div><div class=\"ls\">逻辑状态：<b>关键反直觉路径：<strong>油价上涨本身可能杀死这条航线</strong>。4480 万美元的运费之所以能被吸收，完全依赖 WTI 相对 Murban 的折价；若 WTI 补涨导致折价消失，高运费立刻变得不可承受，美湾-亚洲贸易流萎缩，运价与运量双降。这是本链条最容易被忽视的证伪路径</b></div><div class=\"fs\">观察信号：<b>WTI-Murban 价差收窄至 10 美元以内 / Kpler 下月美湾-亚洲 VLCC 计划数下降 / WTI 相对布伦特溢价</b></div></div><div class=\"sc\"><div class=\"br\">▸ 业绩兑现但股价脱钩</div><div class=\"tg\">触发：<b>中远海能 Q3 业绩继续超预期 / 运价维持高位 / 但三只标的持续跑输上证</b></div><div class=\"ls\">逻辑状态：<b>最坏的一种状态：基本面仍在改善，但权益端已完成定价，出现『业绩涨、股价跌』的典型周期股顶部特征。此时 PE 会持续压缩，PB 成为唯一支撑。本档案的『证伪型』定性在此分支下得到最完整的验证——催化是真的，但已经不值钱了</b></div><div class=\"fs\">观察信号：<b>中远海能 PE(TTM) 从 16.89 倍压缩至 12 倍以下 / 业绩公告次日股价下跌 / 三只标的换手率持续萎缩</b></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>波罗的海交易所下一期美湾→中国 VLCC 运费维持在 4000 万美元以上且未出现回落（极值可持续性）</b></li><li><b>WTI 与 Murban 的价差维持在 15 美元/桶以上（套利窗口不关闭，高运费可继续被吸收）</b></li><li><b>Kpler 数据显示 11 月美湾→亚洲的 VLCC 计划数不低于 6 艘（采购意愿未降温）</b></li><li><b>中远海能 Q3 单季归母净利润环比继续增长（运价向业绩的传导仍在继续）</b></li><li><b>四大通道（霍尔木兹、曼德、苏伊士、巴拿马）受限状态未出现任何一条缓解</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>美湾→中国 VLCC 运费自 4480 万美元回落至 3500 万美元以下（极值不可持续，运价见顶）</b></li><li><b>WTI 与 Murban 价差收窄至 10 美元/桶以内（套利窗口关闭，美湾航线需求萎缩）</b></li><li><b>霍尔木兹海峡恢复通行或沙特东西管道复通（有效运力快速释放，本链条的地缘前提消失）</b></li><li><b>三只标的 5 日跌幅继续扩大至 -10% 以上且 20 日涨幅转负（资金已完成撤离，主线生命周期结束）</b></li><li><b>中远海能 Q3 归母净利润环比下滑（运价上行未继续转化为业绩，业绩环断裂）</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">每日</div><div class=\"wh\">波罗的海交易所美湾→中国 VLCC 运费（对照 4480 万美元极值）</div><div class=\"wy\">这是本链条唯一的核心变量——极值能否维持决定了运价是脉冲还是新中枢</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">WTI 与 Murban 原油价差（当前约 19.2 美元/桶：104.6 vs 123.8）</div><div class=\"wy\">套利窗口是这条航线存在的唯一理由，价差收窄比运价下跌更早发出信号</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">霍尔木兹海峡通行状态、沙特东西管道复通进度、巴拿马运河每日通行量</div><div class=\"wy\">四大通道同时受限是历史罕见状态，任何一条恢复都会快速释放有效运力</div></div><div class=\"tkc\"><div class=\"w\">三季报</div><div class=\"wh\">中远海能、招商轮船、招商南油的单季度归母净利润环比与外贸原油运价执行情况</div><div class=\"wy\">判断『运价上行是否仍在向业绩传导』——若业绩环比见顶，则本链条的基本面支撑结束</div></div></div>\n\n    <div class=\"src\">数据来源：财联社 9/16 13:04《美国原油输往亚洲成本创新记录！200 万桶原油运费高达 4480 万美元》· 华尔街见闻（波罗的海交易所数据、阿曼湾 WS450 / 每桶 11.50 美元）· 群益期货 9/16（Kpler：10 月 6 艘 VLCC 计划）· Entrust 海外服务（WTI 104.6 / 布伦特 107.8 / 穆尔班 123.8、价差收窄至 3 美元以内）· 财联社 9/16 02:33（WTI 10 月合约 +4.38% 报 105.83、布伦特 +2.9% 报 108.75、美国柴油期货 5.26 美元/加仑创纪录）· 中远海能 2026 年半年报（营收 151.46 亿 +30.10%、归母 45.45 亿 +143.12%、外贸原油占 54.62%）· 东方财富行情接口 9/16 开高低收、成交额与换手 · 本工作区 out/fupan_20260916.json 复盘数据</div>\n    <footer>美油运亚运费创纪录 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "carbon-black-record", "title": "炭黑刷新历史新高", "date": "2026-09-15", "grade": "正式档", "pricing": "部分定价", "crate": "warn", "search": "炭黑刷新历史新高 山东 n330 报 11500-12000 元/吨 · 较 9 月初 +3650 元（+45%）· 单价与单周涨幅双创行业历史新高 · 但炭黑厂单吨亏损同步创历史新高 证伪型 ⚠ 成本推动型涨价 · 标题利好、内容利空，盘后落地且易被误读", "card": "<a class=\"card-c\" href=\"#carbon-black-record\" data-search=\"炭黑刷新历史新高 山东 n330 报 11500-12000 元/吨 · 较 9 月初 +3650 元（+45%）· 单价与单周涨幅双创行业历史新高 · 但炭黑厂单吨亏损同步创历史新高 证伪型 资源品涨价与煤焦链 部分定价 山西焦煤 淮北矿业 冀中能源 兰花科创 兖矿能源\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-15</span>\n    <span class=\"crate warn\">⚠ 成本推动型涨价 · 标题利好、内容利空，盘后落地且易被误读 证伪型</span>\n  </div>\n  <div class=\"ctitle\">炭黑刷新历史新高</div>\n  <div class=\"csub\">山东 N330 报 11500-12000 元/吨 · 较 9 月初 +3650 元（+45%）· 单价与单周涨幅双创行业历史新高 · 但炭黑厂单吨亏损同步创历史新高</div>\n  <div class=\"cpos\">炭黑价格创历史新高（N330 报 11500-12000 元/吨），但炭黑厂单吨亏损同步创历史新高——价格与利润背离，链内排序应按成本暴露度。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">资源品涨价与煤焦链</span>\n    \n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 10</span>\n    <span class=\"nm\">山西焦煤</span><span class=\"nm\">淮北矿业</span><span class=\"nm\">冀中能源</span><span class=\"nm\">兰花科创</span><span class=\"nm\">兖矿能源</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-15 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-15</div>\n    <h1>炭黑刷新历史新高</h1>\n    <div class=\"sub\">山东 N330 报 11500-12000 元/吨 · 较 9 月初 +3650 元（+45%）· 单价与单周涨幅双创行业历史新高 · 但炭黑厂单吨亏损同步创历史新高</div>\n    <div class=\"badges\">\n      <span class=\"badge warn\">⚠ 成本推动型涨价 · 标题利好、内容利空，盘后落地且易被误读</span>\n      <span class=\"badge neutral\">证伪型</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：资源品涨价与煤焦链</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">copper-record</span><span class=\"tag\" style=\"margin-right:4px\">thermal-coal-830</span></div>\n    <div class=\"posnote\">炭黑价格创历史新高（N330 报 11500-12000 元/吨），但炭黑厂单吨亏损同步创历史新高——价格与利润背离，链内排序应按成本暴露度。</div>\n    <details class=\"more\"><summary>展开定价状态详版（631 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化由财联社 9/15 <strong>18:40</strong> 发出，属<strong>盘后落地</strong>，9/15 收盘价完全未含该信息。<strong>盘面状态</strong>：9/15 上证 -0.54%、深成 -0.72%、创业板 -1.15%（弱市，需扣 beta）。链内呈<strong>教科书级成本暴露度排序</strong>——上游焦煤全红：淮北矿业 +1.08%（超额 +1.62pct）、冀中能源 +1.12%（+1.66）、山西焦煤 +0.90%（+1.44）、兰花科创 +0.57%（+1.11）；焦化+炭黑一体走平：陕西黑猫 -0.54%（超额 0.00，但盘中最高冲到 +8.06% 后全天回吐）；纯炭黑制造全线杀跌：黑猫股份 <strong>-9.16%</strong>（超额 -8.62pct，换手 11.50%、成交 8.03 亿为全链最大）、金能科技 -3.97%、永东股份 -3.67%、龙星科技 -3.19%、联科科技 -1.50%；下游轮胎分化：赛轮轮胎 +1.69%（+2.23）、森麒麟 -2.04%、玲珑轮胎 -1.40%。当日涨停题材地图 32 家涨停中<strong>无一炭黑股</strong>。结论：市场没有把『炭黑创历史新高』当利好，而是<strong>已经按『成本挤压 + 需求塌陷』把整个中游定价为受损方</strong>——盘后这条标题党式的快讯如果只被读标题，是典型的误读风险。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">事件本体</b><div class=\"v\">财联社 9/15 18:40：国内炭黑市场刷新历年新高。截至 9/14，山东主流 N330 炭黑报价 <strong>11500-12000 元/吨</strong>，相比 9 月初大涨 <strong>3650 元/吨、涨幅 45%</strong>——<strong>单价与单周涨幅两项均创行业历史新高</strong>（数据源：隆众/买化塑研究院，经财联社、同花顺双源转载）。</div></div><div class=\"card fact\"><b class=\"k\">涨价源头</b><div class=\"v\">快讯归因明确：<strong>山西焦煤供应紧张 → 焦煤价格持续走高 → 焦化厂亏损减产 → 煤焦油货源紧缺</strong>。这不是需求驱动，是自上而下的成本推动。煤焦油拍卖连破纪录：9/8 内蒙古广聚 5910-6150 元（单场涨幅创新高）、9/9 山西鹏飞 6810 元（单次上调 1910 元，刷新主产区纪录）、9/10 山钢莱芜 6720 元（该厂历史新高）。</div></div><div class=\"card fact warn\"><b class=\"k\">成本结构</b><div class=\"v\">煤焦油是油炉法炭黑最主要原料，<strong>占炭黑生产成本 70%-80%</strong>（买化塑研究院）。当前国内部分高温煤焦油价格已冲到 <strong>6800 元/吨</strong>，去年同期仅 <strong>3400 元/吨</strong>——<strong>同比翻倍</strong>。同期国际油价高位运行，进一步推高乙烯焦油等油基原料，炭黑厂两条原料路线同时受压。</div></div><div class=\"card fact warn\"><b class=\"k\">反直觉核心</b><div class=\"v\">炭黑涨 45%，炭黑厂却<strong>亏得更多</strong>：厂家手里订单基本是涨价前接的低价单，<strong>生产一单亏一单，单吨亏损额度创下历史新高</strong>。为减少亏损与应对原料短缺，国内大型炭黑厂<strong>普遍减产 3-4 成</strong>，中小厂直接停产停工，行业开工率仅维持 <strong>65%</strong> 附近。涨价的直接后果是<strong>自己的产销量下降</strong>。</div></div><div class=\"card fact warn\"><b class=\"k\">下游承接</b><div class=\"v\">轮胎占国内炭黑总消费<strong>六成以上</strong>，是最大下游。当前轮胎端<strong>终端需求疲软、成本根本传不下去</strong>，行业已掀起大规模减产检修：9/15 轮胎股森麒麟 -2.04%（5 日 -8.03%、年内 -38.73%）、玲珑轮胎 -1.40%（年内 -27.25%）、贵州轮胎 -1.16%。供需双弱——炭黑厂减产挺价、轮胎厂降产拒采，<strong>成交清淡而非量价齐升</strong>。</div></div><div class=\"card fact warn\"><b class=\"k\">龙头自认</b><div class=\"v\">黑猫股份（炭黑年产能 <strong>116.2 万吨</strong>，产销量国内第一、世界前列）9/9 异动公告原文口径：<strong>『调价属于成本传导，利润能否修复仍取决于原料、下游承接能力』</strong>。上市公司自己否认了涨价→增利的线性映射，并已在年内发出多份异动公告。这是本链条<strong>上市公司口径与题材叙事直接冲突</strong>的定性证据。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/15（上证 -0.54%，需扣 beta）链内呈<str
