 供给冲击型 · 商品史诗级、A 股权益端当日全回吐 地缘冲突</span>\n  </div>\n  <div class=\"ctitle\">沙特东西管道中断</div>\n  <div class=\"csub\">1200km 绕行大动脉遇袭停运 · 三大航道石油输送量不足 700 万桶/日（冲突前 35%）· 布油破 108、上期所原油史上首破 900 元/桶</div>\n  <div class=\"cpos\">沙特 1200km 东西管道遇袭停运，三大航道输油量不足 700 万桶/日（冲突前 35%）；布油破 108、上期所原油史上首破 900 元/桶，A 股权益端当日全回吐。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">能源地缘·中东供断与成品油</span>\n    \n    <span class=\"chip pri\">未定价</span>\n    <span class=\"chip\">标的 13</span>\n    <span class=\"nm\">中国海油</span><span class=\"nm\">中海油服</span><span class=\"nm\">招商轮船</span><span class=\"nm\">中远海能</span><span class=\"nm\">杰瑞股份</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-14 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-14</div>\n    <h1>沙特东西管道中断</h1>\n    <div class=\"sub\">1200km 绕行大动脉遇袭停运 · 三大航道石油输送量不足 700 万桶/日（冲突前 35%）· 布油破 108、上期所原油史上首破 900 元/桶</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 供给冲击型 · 商品史诗级、A 股权益端当日全回吐</span>\n      <span class=\"badge neutral\">地缘冲突</span>\n      <span class=\"badge neutral\">定价状态：未定价</span>\n      <span class=\"badge neutral\">主线：能源地缘·中东供断与成品油</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">diesel-crack-record</span><span class=\"tag\" style=\"margin-right:4px\">europe-gas-squeeze</span><span class=\"tag\" style=\"margin-right:4px\">oil-hormuz</span><span class=\"tag\" style=\"margin-right:4px\">oil-tanker-supercycle</span><span class=\"tag\" style=\"margin-right:4px\">russia-diesel-outage</span></div>\n    <div class=\"posnote\">沙特 1200km 东西管道遇袭停运，三大航道输油量不足 700 万桶/日（冲突前 35%）；布油破 108、上期所原油史上首破 900 元/桶，A 股权益端当日全回吐。</div>\n    <details class=\"more\"><summary>展开定价状态详版（561 字）</summary><div class=\"pos\"><b>定价状态备注：</b>本轮升级的关键变量<strong>9/11 沙特能源部宣布管道关闭</strong>为周五盘中、<strong>9/13 晚阿曼宣布推迟地区会议</strong>在周末，9/14 是 A 股首个完整定价日。<strong>盘面状态</strong>：9/14 上证 -0.07%、深证 -0.64%、创业板 -1.10%（弱市但不构成系统性杀跌，无需大幅扣 beta）。油气链<strong>早盘全线高开、收盘全部回吐</strong>——招商轮船盘中最高 +7.60% 收 <strong>0.00%</strong>、中远海能盘中 +6.90% 收 <strong>+0.19%</strong>、中国海油高开 +2.62% 收 <strong>0.00%</strong>、中国石油高开 +1.60% 收 <strong>-1.78%</strong>、中国石化高开 +1.27% 收 <strong>-2.72%</strong>、中曼石油盘中 +4.78% 收 <strong>-2.88%</strong>。当日涨停题材地图 12 个主题中<strong>无一油气相关</strong>（第一主线是 PCB/CPO/先进封装 10 家）。结论：商品端完成史诗级定价，A 股权益端只做了半小时情绪定价后彻底回吐。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">全长 <strong>1200 公里</strong>的沙特东西输油管道（East-West Pipeline，又称 Petroline）将东部油田原油运往西岸红海港口，是沙特绕开霍尔木兹海峡的核心出口通道。据估计近几个月输量达 <strong>400-500 万桶/日</strong>，相当于<strong>全球供应的 4%-5%</strong>；管道总能力 700 万桶/日（其中 500 万桶/日可供出口、200 万桶/日供国内炼厂）。9/11 沙特能源部宣布因多处遇袭<strong>预防性暂时关闭</strong>，未披露恢复计划。</div></div><div class=\"card fact\"><b class=\"k\">绕行缓冲失效</b><div class=\"v\">此前的缓冲机制是「海峡受阻→改走红海」：今年霍尔木兹受阻以来，沙特通过东西管道+延布港把红海航线出口量从 150 万桶/日提升到 <strong>450 万桶/日</strong>。管道停运后，<strong>延布港出口骤降至 143 万桶/日（六个月低点），而此前三个月为 390 万桶/日</strong>——缓冲机制已实际失效，这是本轮与 9/8 那段最本质的差别。</div></div><div class=\"card fact\"><b class=\"k\">缺口量化</b><div class=\"v\">伯恩斯坦口径：霍尔木兹海峡、曼德海峡、苏伊士运河<strong>三大关键航道石油总输送量不足 700 万桶/日，仅约冲突爆发前 2000 万桶/日的 35%</strong>。Kpler 口径：海峡石油通行量已从 7-8 月的 600-700 万桶/日降至 <strong>200-300 万桶/日</strong>。HLIB 口径：全球石油赤字 7 月仅 10 万桶/日 → 8 月急剧扩大至 <strong>410 万桶/日</strong> → 9 月预计 <strong>480 万桶/日</strong>；西亚原油停产量 8 月升至 <strong>670 万桶/日</strong>（7 月 500 万桶/日），区域产量环比 -7.8%。</div></div><div class=\"card fact\"><b class=\"k\">价格反应</b><div class=\"v\">9/14 WTI 期货涨超 3% 至 <strong>103 美元/桶</strong>上方，布伦特涨 3%+ 至 <strong>108 美元/桶</strong>附近（盘中一度 112），北海与中东现货油价<strong>接近 120 美元/桶</strong>；上周布油已累计涨 8% 并首次突破 100（为 7 月以来首次）。国内：<strong>上期所原油主力合约涨超 11%，史上首次升破 900 元/桶</strong>（11:18 站上 900）；沥青、燃油、欧线集运涨超 2%。</div></div><div class=\"card fact\"><b class=\"k\">机构情景区间</b><div class=\"v\">中金上调 4Q26 布油中枢至 <strong>85 美元/桶</strong>（6 月预测 80），提示低库存放大溢价弹性；高盛给出<strong>袭击加剧则 120、出口恢复则回落 80</strong> 的双情景；摩根大通测算<strong>每多一个月中断约抬升布油 7-8 美元/桶，持续三个月则月均约 114 美元</strong>；伯恩斯坦上修至 <strong>120-150 美元</strong>；美银：小规模冲突持续到年底则 95-120，全面冲突损及能源基础设施则最高 150。花旗把 3Q 布油均值从 80 上调至 86，理由是海峡重开时间长于预期。此外美国战略石油储备预计 9 月底跌至 <strong>2.52 亿桶</strong>关键门槛。</div></div><div class=\"card fact warn\"><b class=\"k\">争议点</b><div class=\"v\"><strong>①供给底 vs 需求顶同在。</strong>中金明确指出「下有供应底、上有需求顶」——内生需求依然偏弱，夏季需求修复不可线性外推，油价破百后需求顶或将显现；成品油端短期油价及运费上涨正在冲击欧亚炼油毛利，汽油裂解价差存在高位回落压力。<strong>②管道是「预防性关闭」而非确认摧毁</strong>，沙特未披露受损细节，复产时点完全不可知——这既是最大弹性来源也是最大证伪来源。<strong>③阿曼会议是推迟而非破裂</strong>，外交窗口仍在。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/14 上证 -0.07%、深证 -0.64%、创业板 -1.10%，属弱市但非系统性杀跌。<strong>油气链全天高开低走、涨幅全数回吐</strong>：招商轮船（开 20.55、高 21.52 = +7.60%、收 20.00 = <strong>0.00%</strong>）、中远海能（开 21.60、高 22.30 = +6.90%、收 20.90 = <strong>+0.19%</strong>）、中国海油（高 +2.62% → 收 <strong>0.00%</strong>）、中国石油（高 +1.60% → 收 <strong>-1.78%</strong>）、中国石化（高 +1.27% → 收 <strong>-2.72%</strong>）、中曼石油（高 +4.78% → 收 <strong>-2.88%</strong>，换手 10.09%）。<strong>链内排序：油运（收平/微涨）＞ 上游开采（收平到 -1.8%）＞ 油服（-0.7%~-2.9%）＞ 纯炼化（恒力 -2.43%、荣盛 -2.94%、华锦 -2.51%）</strong>——市场按「成本暴露度」排序，纯炼化被当作受损方。当日涨停题材地图 12 个主题中<strong>油气零席位</strong>，第一主线是 PCB/CPO/先进封装（10 家）。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-08</div><div><div class=\"x\">沙特能源设施遭袭，布伦特<strong>逼近</strong> 100 美元/桶（该段已归档为 oil-hormuz 档案）。</div><div class=\"y\">为什么：本主线的第一段催化：市场按「地缘风险溢价」定价，油价尚未破百，绕行通道（延布港+东西管道）仍完好。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-11</div><div><div class=\"x\">沙特能源部宣布，因东西输油管道多处遇袭，作为预防措施已<strong>暂时关闭管道</strong>，未披露受损细节与恢复计划。</div><div class=\"y\">为什么：主线的质变点：这是海湾<strong>唯一绕开霍尔木兹的陆上出口通道</strong>，它的停运意味着「海峡受阻→改走红海」这一缓冲机制失效，供给冲击从「航运受阻」升级为「出口能力受损」。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-13 晚</div><div><div class=\"x\">阿曼外交部宣布，原定 9/14 在塞拉莱举行的霍尔木兹商业航运安全航线地区会议<strong>推迟</strong>（理由是「为了达成共识」）。同日沙特公布胡塞袭击吉赞省的画面；英国海事贸易行动中心称霍尔木兹又有一艘油轮遇袭起火。</div><div class=\"y\">为什么：外交降温窗口关闭——市场原本把 Oman 会议作为「缓和期权」计入，推迟意味着短期无操作性进展。这是 9/14 油价跳空高开的直接触发。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-14 凌晨</div><div><div class=\"x\">伊朗霍尔木兹甘省锡里克地区传出数声爆炸巨响，性质未明、官方无声明。</div><div class=\"y\">为什么：冲突地理范围从海峡/管道扩展至伊朗本土沿岸，升级的尾部风险抬升。</div></div></div><div class=\"u\"><div class=\"w\">待定</div><div><div class=\"x\">沙特东西管道复产公告 / 延布港装船安排说明（9/14 14:41 快讯：亚洲炼油商仍在等待说明）/ 阿曼会议重新召开。</div><div class=\"y\">为什么：本档案的分水岭：这三个变量决定 400-500 万桶/日的绕行能力是否回归，是唯一能证伪「供给硬缺口」的客观信号。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是<strong>供给冲击型</strong>催化，与 9/8 那段的本质差别在于：<strong>缓冲机制被拆掉了</strong>。9/8 时霍尔木兹虽受阻，但沙特还有东西管道+延布港这条陆上绕行线，市场因此只肯给「风险溢价」；9/11 管道停运后，延布港出口从 390 万桶/日掉到 143 万桶/日，三大航道合计只剩冲突前 35% 的输送量，全球赤字从 7 月的 10 万桶/日跳到 8 月 410 万、9 月预计 480 万——<strong>这已经不是风险溢价问题，是实物短缺问题</strong>。<strong>三个要害</strong>：①<strong>分水岭时点</strong>是沙特管道复产公告与延布港装船安排（9/14 亚洲炼油商仍在等说明），复产则回到风险溢价框架，不复产则 480 万桶/日赤字进入实物去库；②<strong>传导的关键约束</strong>是 A 股的映射被「成本」而非「涨价」主导——中国海油是纯上游受益、中国石化是炼化成本受损、恒力荣盛是纯成本暴露，所以「油价涨」在 A 股从来不是统一利好，必须按成本暴露度切；③<strong>待验证的核心变量</strong>是缺口能否落到中国到岸量上——中国已通过增购俄罗斯原油对冲（8 月海运俄油 168 万桶/日 vs 7 月 140 万桶/日），若中国到岸未受影响，则 A 股上游的「量」逻辑要打折。<strong>隐藏面</strong>：9/14 商品端完成了史诗级定价（上期所原油史上首破 900 元/桶、+11%），但 A 股权益端<strong>全部高开低走、收盘回吐</strong>，招商轮船盘中 +7.60% 收 0.00%——这个背离幅度远大于油价本身的涨幅，说明市场把它当作「一次性地缘事件」而非「定价中枢上移」，这是本档案预期差的来源。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>9/11 沙特能源部官方宣布管道预防性关闭，非传闻</li><li>延布港出口从 390 万桶/日降至 143 万桶/日，缓冲已实证失效</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强</span><ul><li>三大航道输送量不足 700 万桶/日 = 冲突前 2000 万桶/日的 35%</li><li>全球赤字 7 月 10 万 → 8 月 410 万 → 9 月预计 480 万桶/日</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">分化</span><ul><li>上游开采直接兑现（中国海油纯上游），但油价传导到业绩滞后约 1 个季度</li><li>纯炼化是成本受损方（恒力 -2.43%、荣盛 -2.94%），油服需等资本开支周期</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">未动</span><ul><li>9/14 油气链高开低走全回吐，招商轮船盘中 +7.60% 收 0.00%</li><li>涨停题材地图 12 个主题中油气零席位，资金未形成板块共识</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强、业绩分化（上游受益/炼化受损）、股价未动——缺口已被商品端定价，但未被 A 股权益端定价。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>65%</strong>：四环中「业绩」环因成本暴露度分化而打折，「股价」环当日明确未动——这是本档案最大的预期差所在。</li><li><strong>边界必须切开</strong>：受益的是<strong>纯上游开采</strong>（中国海油，储量+成本优势，油价弹性最纯）与<strong>油运</strong>（绕行吨海里拉长，且不承担原油成本）；中性偏受损的是<strong>一体化央企</strong>（中国石油有上游但下游炼化拖累）；明确受损的是<strong>纯炼化</strong>（恒力石化、荣盛石化、华锦股份，原料成本上升而成品油定价受调控——对照 diesel-crack-record 档案里「发改委应涨 420 实际 250、砍四成」的机制）。油服（中海油服、海油工程）属于<strong>二阶受益</strong>，需等上游资本开支实际回升，通常滞后 2-3 个季度。</li><li><strong>主线联动</strong>：与 <strong>oil-hormuz</strong>（9/8 第一段）构成同一主线的二段升级——前段给风险溢价、本段给实物短缺；与 <strong>oil-tanker-supercycle</strong>（VLCC 主升）共享油运标的，本档案的「绕行吨海里拉长」正是该档案运价主升的驱动之一，两者互相印证；与 <strong>diesel-crack-record</strong> 共享「成品油裂解」视角，中金已提示油价及运费上涨正在冲击欧亚炼油毛利、汽油裂解存高位回落压力，这构成对柴油裂解韧性的反向约束。若阿曼会议重启或管道复产，本档案与 oil-hormuz 的「供给硬缺口」环将同步走弱。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中国海油</b><span class=\"code\">600938</span><span class=\"tag\">A股唯一纯上游·9/14 高开2.62%收0.00%</span><span class=\"cap\">33.08 元 · 流通 989 亿 · 9/16 -1.11%</span></div>\n    <div class=\"logic\">纯勘探开发·无炼化稀释·完全成本全球第一梯队</div>\n    <div class=\"detail\">A 股油气里唯一几乎不含炼化资产的纯上游标的，享受「油价涨=售价涨」的干净传导，而中国石油被下游拖累、中国石化反而是成本受损方。量增+低成本的组合让它在 100 美元以上环境里边际利润率显著高于同行。9/14 高开 +2.62% 后收盘恰好归零，换手仅 1.61%，是「逻辑最纯、定价最不充分」的典型。</div>\n    \n    \n    <div class=\"risk\">⚠️ 1.6 万亿市值弹性温和；地缘缓和时溢价回吐最直接</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中海油服</b><span class=\"code\">601808</span><span class=\"tag\">二阶受益·9/14 -0.72% 换手仅0.47%</span><span class=\"cap\">12.41 元 · 流通 367 亿 · 9/16 +0.89%</span></div>\n    <div class=\"logic\">国内海上油服龙头·受益资本开支回升</div>\n    <div class=\"detail\">处在传导链第二环：油价涨→上游现金流改善→资本开支提升→油服拿单，通常滞后 2-3 个季度，日费率而非工作量是弹性来源。客户以中国海油为主，确定性较高；海外业务覆盖中东与本次事件区域重合。9/14 换手仅 0.47%，几乎未被定价。</div>\n    \n    \n    <div class=\"risk\">⚠️ 二阶时滞长，油价高位若仅维持一两个月则逻辑无法兑现</div>\n  </div></div><div class=\"t\">🏛️ 容量中军 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>招商轮船</b><span class=\"code\">601872</span><span class=\"tag\">VLCC 全球第一梯队·盘中+7.60%收0.00%</span><span class=\"cap\">19.86 元 · 流通 1604 亿 · 9/16 -3.12%</span></div>\n    <div class=\"logic\">总市值 1615 亿·油运主线指数锚</div>\n    <div class=\"detail\">不持有原油、不承担油价成本，反而从绕行拉长吨海里中获益，是本轮地缘事件里逻辑最顺的受益方之一。LNG 船队是独立于原油的第二条腿，与欧洲气价创新高共振。9/14 盘中最高 +7.60%、收盘恰好归零、成交 43.5 亿，是当日油气链最剧烈的背离。「容量中军」属性来自 1615 亿市值与指数权重——它是这条主线能否被机构资金承接的刻度。</div>\n    \n    \n    <div class=\"risk\">⚠️ 运价已在历史高位，进一步上行需缺口持续；海峡重开则绕行溢价迅速消失</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中远海能</b><span class=\"code\">600026</span><span class=\"tag\">油运+LNG双主业·9/14 +0.19% 收红</span><span class=\"cap\">20.72 元 · 流通 793 亿 · 9/16 -1.57%</span></div>\n    <div class=\"logic\">总市值 1143 亿·外贸油运弹性</div>\n    <div class=\"detail\">结构更偏外贸油运，LNG 运输以长约绑定、现金流更稳但现货弹性略低。9/14 盘中最高 +6.90%、收 +0.19%，是油气链极少数收盘保留正收益的标的，说明资金对绕行逻辑的认可度略高于上游开采。与招商轮船共同构成油运主线的容量锚。</div>\n    \n    \n    <div class=\"risk\">⚠️ 海运周期波动极大，2021 年曾亏损 49.75 亿</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>杰瑞股份</b><span class=\"code\">002353</span><span class=\"tag\">油服设备·中东敞口·9/14 -1.05%</span><span class=\"cap\">119.99 元 · 流通 829 亿 · 9/16 -0.59%</span></div>\n    <div class=\"logic\">总市值 1205 亿·复产资本开支承接方</div>\n    <div class=\"detail\">压裂设备全球供应商，中东区域收入占比高。独特之处在于它的需求路径与「冲突持续」相反——若冲突后进入复产与产能修复阶段，设备与技术服务需求会集中释放，因此它同时是这轮事件的「缓和受益方」，逻辑方向与上游相反。9/14 换手 1.61%，未被定价。</div>\n    \n    \n    <div class=\"risk\">⚠️ 二阶时滞；复产节奏不确定，若冲突长期化则订单无法落地</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中国石油</b><span class=\"code\">601857</span><span class=\"tag\">一体化央企·9/14 -1.78%</span><span class=\"cap\">10.81 元 · 流通 1.75 万亿 · 9/16 -0.37%</span></div>\n    <div class=\"logic\">上下游一体·炼化拖累纯度</div>\n    <div class=\"detail\">一体化结构让它在油价上行期是「半受益」：上游板块受益，但下游炼化承担原料成本上升，而成品油定价受调控（对照 diesel-crack-record 档案的调价机制）。9/14 高开 +1.60% 后收 -1.78%，换手仅 0.09%——大市值央企在主题行情中通常只作为指数稳定器。</div>\n    \n    \n    <div class=\"risk\">⚠️ 炼化板块稀释油价弹性；换手极低，主题资金参与度差</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>海油工程</b><span class=\"code\">600583</span><span class=\"tag\">9/14 逆势 +0.50%</span><span class=\"cap\">6.10 元 · 流通 270 亿 · 9/16 +0.49%</span></div>\n    <div class=\"logic\">海上工程建设·工作量驱动</div>\n    <div class=\"detail\">9/14 油气链普跌中为数不多收红的标的（+0.50%），但成交仅数亿级，属低位防御性买盘而非主题资金。逻辑上承接中海油体系工程建设，工作量驱动、价格弹性小。</div>\n    \n    \n    <div class=\"risk\">⚠️ 弹性温和；工程建设毛利率受钢材成本影响</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>博迈科</b><span class=\"code\">603727</span><span class=\"tag\">海工模块·9/14 +0.18%</span><span class=\"cap\">17.34 元 · 流通 49 亿 · 9/16 -0.46%</span></div>\n    <div class=\"logic\">总市值 48 亿·海外模块订单</div>\n    <div class=\"detail\">海洋工程模块建造商，订单以海外为主。受益路径与杰瑞股份类似——依赖上游资本开支，但更偏 LNG 与海洋模块，与本轮油气开采的直接关联度弱一档。9/14 收 +0.18%，成交清淡。</div>\n    \n    \n    <div class=\"risk\">⚠️ 订单周期长、单笔订单对业绩影响集中，波动大</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>准油股份</b><span class=\"code\">002207</span><span class=\"tag\">最小市值油服·9/14 -1.58%</span><span class=\"cap\">5.54 元 · 流通 14 亿 · 9/16 +2.78%</span></div>\n    <div class=\"logic\">总市值 15 亿·换手 2.80%</div>\n    <div class=\"detail\">全链最小市值的油服标的（15 亿），历史属性是油价脉冲时的首板品种，但缺乏基本面支撑，通常一日游。9/14 收 -1.58%，说明本轮连情绪盘都没有启动。</div>\n    <div class=\"gene\">🧬 题材基因：新疆区域油服小盘，历次油价脉冲行情中常作为首板品种出现，但持续性差、多为一日游</div>\n    \n    <div class=\"risk\">⚠️ 基本面弱、市值极小，纯情绪映射</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>贝肯能源</b><span class=\"code\">002828</span><span class=\"tag\">钻井工程·9/14 -1.80%</span><span class=\"cap\">10.45 元 · 流通 21 亿 · 9/16 -0.48%</span></div>\n    <div class=\"logic\">总市值 22 亿·换手 4.55%</div>\n    <div class=\"detail\">民营钻井工程小盘，2022 年油价破 120 时曾走出连板，是油价情绪的放大器。9/14 收 -1.80%、换手 4.55%，有换手但无涨幅——情绪盘试探未果。</div>\n    <div class=\"gene\">🧬 题材基因：国内民营钻井工程小盘，2022 年油价破 120 期间曾走出连板行情，属典型的油价情绪放大器</div>\n    \n    <div class=\"risk\">⚠️ 工程类业务毛利率低，业绩弹性弱于股价弹性</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>海默科技</b><span class=\"code\">300084</span><span class=\"tag\">油田设备·9/14 -0.19%</span><span class=\"cap\">10.22 元 · 流通 51 亿 · 9/16 +0.20%</span></div>\n    <div class=\"logic\">总市值 57 亿·换手 1.12%</div>\n    <div class=\"detail\">油田计量与设备小盘，多轮油气行情中属后排补涨品种，从未担任龙头。9/14 收 -0.19%、换手仅 1.12%，参与度极低。</div>\n    <div class=\"gene\">🧬 题材基因：油田计量设备小盘，多轮油气行情中属后排补涨型，从未担任过板块龙头</div>\n    \n    <div class=\"risk\">⚠️ 设备类订单确认慢，业绩兑现不确定</div>\n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中曼石油</b><span class=\"code\">603619</span><span class=\"tag\">民营油服弹性先锋·9/14 换手10.09% 收-2.88%</span><span class=\"cap\">22.13 元 · 流通 102 亿 · 9/16 +2.03%</span></div>\n    <div class=\"logic\">总市值 104 亿·当日油气链换手最高</div>\n    <div class=\"detail\">同时具备油服工程与自有原油销售，是民营油气里少见的「量价双重弹性」结构，历史上两轮油价行情中都是板块的情绪先锋。9/14 它的表现极具信息量：<strong>盘中最高 +4.78%、收 -2.88%、换手 10.09%（全链最高）</strong>——高换手+收跌意味着早盘资金抢筹后被系统性抛压打穿，是「有情绪、无承接」的典型形态，通常这种结构说明主题未被市场认可而非被认可后获利了结。</div>\n    <div class=\"gene\">🧬 题材基因：民营油服一体化（钻井+原油销售），2022 年与 2024 年两轮油价上行中均扮演板块弹性先锋，涨跌幅常为龙头数倍，是油气题材的情绪风向标</div>\n    \n    <div class=\"risk\">⚠️ 民营油服现金流与负债结构弱于央企；高换手下的波动剧烈</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>通源石油</b><span class=\"code\">300164</span><span class=\"tag\">9/14 唯一收红油服·换手17.86%</span><span class=\"cap\">9.79 元 · 流通 57 亿 · 9/16 +0.10%</span></div>\n    <div class=\"logic\">总市值 61 亿·当日换手全链第二</div>\n    <div class=\"detail\">9/14 是全链唯一收红的油服标的（+1.28%），且换手高达 <strong>17.86%</strong>——天量换手配合小幅收红，是典型的「资金高换手博弈但方向未定」形态。它的独立走强没有板块配合，属于个股层面的资金行为，尚不能视为主题启动信号。</div>\n    <div class=\"gene\">🧬 题材基因：射孔与增产技术服务小盘，历次油气行情中属高换手机动品种，常在天量换手后出现方向选择</div>\n    \n    <div class=\"risk\">⚠️ 基本面一般；17.86% 换手意味着筹码高度不稳定，次日方向可能剧烈反转</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2019 年 9 月 14 日沙特阿美 Abqaiq-Khurais 设施遇袭：瞬间停产 570 万桶/日（约占全球供应 5%），布油周一开盘跳涨约 19%（60 美元→71.95 美元），但沙特在两周内恢复产量，油价<strong>在一个月内回吐全部涨幅</strong>——这是「供给冲击能否持续」最经典的对照：冲击幅度可与本轮相比，但因复产迅速而未形成趋势。本轮的关键差异是受损方从「单点设施」变为「运输通道」，恢复难度显著更高。</li><li>2022 年俄乌冲突后油价破 120 美元：A 股油气链走出一轮趋势行情，中国海油 2022 年全年涨幅居前——该轮验证的是「油价中枢上移 + 上游资本开支周期启动」能驱动 A 股上游重估，与本轮的差异在于当时是需求端未走弱、本轮中金明确指出需求顶将现。</li><li>2024 年红海危机：胡塞武装袭击商船导致绕行好望角，油运吨海里拉长推动 VLCC 运价上行，招商轮船/中远海能走出趋势——该轮直接对应本档案的油运支线，也是 oil-tanker-supercycle 档案主升的起点。本轮在其基础上叠加了「绕行通道本身被关闭」，是量级更大的升级。</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中国海油</b><span class=\"code\">600938</span><span class=\"tag\">A股唯一纯上游·油价弹性最纯</span></div>\n    <div class=\"logic\">纯上游勘探开发 | 完全成本处于全球第一梯队、量增对冲价波动 | 无炼化板块稀释纯度</div>\n    <div class=\"detail\">A 股油气板块里<strong>唯一几乎不含炼化资产的纯上游标的</strong>——这一点在油价上行期是决定性的：中国石油有上游但被下游炼化拖累、中国石化以炼化为主反而是成本受损方，只有它享受「油价涨 = 售价涨」的干净传导。逻辑的第二层在<strong>量增</strong>：公司近年净产量持续增长且储量替代率维持高位，完全成本处于全球第一梯队，意味着在 100 美元以上的油价环境里，增量产量的边际利润率显著高于同行。9/14 它的盘面特征是<strong>高开 +2.62%、最低 33.66、收 33.91 恰好 0.00%</strong>——早盘资金确实按油价逻辑买过，但全天回吐干净，且换手仅 1.61% 说明没有形成承接。这是「逻辑最纯但定价最不充分」的典型状态。</div>\n    \n    <div class=\"confirm\">✔ 确认：布油站稳 100 美元上方且月均抬升 / 公司季度净产量同比继续增长 / 三季报实现油价与 Brent 价差收窄</div>\n    <div class=\"risk\">⚠️ 大市值（16117 亿）弹性温和；若中东复产速度快于预期，溢价回吐时它也是回撤最直接的品种</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>招商轮船</b><span class=\"code\">601872</span><span class=\"tag\">VLCC 全球第一梯队·绕行吨海里最受益</span></div>\n    <div class=\"logic\">VLCC 船队规模全球领先 | 绕行好望角拉长吨海里、不担原油成本 | LNG 船队提供第二增长曲线</div>\n    <div class=\"detail\">它的受益机制与上游完全不同——<strong>不持有原油，因此不承担油价上涨的成本，反而从「运输距离拉长」中获益</strong>。霍尔木兹受阻后中东-远东航线被迫绕行，吨海里（运量×距离）被动拉长，在船队供给刚性的前提下直接推高运价，这是 oil-tanker-supercycle 档案里「VLCC TCE 创历史新高」的同一驱动，本档案为其提供了二段催化。同时它的 LNG 船队是<strong>独立于原油逻辑的第二条腿</strong>——欧洲气价创 2022 年末以来新高（见 europe-gas-squeeze 档案）会同步抬升 LNG 运输需求，两条腿在同一地缘事件下共振。9/14 盘面是<strong>全天最剧烈的背离：盘中最高 21.52（+7.60%）、收 20.00 恰好 0.00%</strong>，成交额 43.5 亿、换手 2.61%，说明早盘有真实资金介入但尾盘全部退出。</div>\n    \n    <div class=\"confirm\">✔ 确认：VLCC-TCE 指数继续上行 / 中东-中国航线 TCE 创新高 / 公司 Q3 业绩预告兑现运价</div>\n    <div class=\"risk\">⚠️ 运价本身已在历史高位（见 oil-tanker-supercycle），进一步上行需要缺口持续；若海峡重开则绕行溢价迅速消失</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中海油服</b><span class=\"code\">601808</span><span class=\"tag\">油服龙头·二阶受益、滞后兑现</span></div>\n    <div class=\"logic\">国内海上油服绝对龙头 | 受益于上游资本开支回升 | 业绩滞后油价 2-3 个季度</div>\n    <div class=\"detail\">它处在传导链的<strong>第二环而非第一环</strong>——油价上涨首先改善上游现金流，上游再把增加的现金流转化为勘探开发资本开支，油服才拿到订单，这个链条通常滞后 2-3 个季度，且日费率（而非工作量）是弹性的真正来源。独特之处在<strong>中海油体系的确定性</strong>：其最大客户中国海油在国内海上勘探的资本开支计划具有连续性，且本轮油价上行若持续，日费率谈判的位置会明显改善；同时它的海外业务覆盖中东，与本次地缘事件的区域重合度高。9/14 收 <strong>-0.72%</strong>（开 12.73、高 12.76、低 12.35），换手仅 0.47%——<strong>几乎没有被定价</strong>，这既反映二阶逻辑的市场认知度低，也说明它没有承担情绪盘的回吐压力。</div>\n    \n    <div class=\"confirm\">✔ 确认：中国海油上调年度资本开支指引 / 钻井平台日费率环比回升 / 新签海外订单公告</div>\n    <div class=\"risk\">⚠️ 二阶传导时滞长，若油价高位仅维持一两个月，资本开支不会调整，逻辑无法兑现</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中远海能</b><span class=\"code\">600026</span><span class=\"tag\">油运+LNG 双主业·外贸油运弹性</span></div>\n    <div class=\"logic\">外贸油运为主、内贸为辅 | LNG 运输长约绑定 | 历史上海运周期弹性大于招商轮船</div>\n    <div class=\"detail\">与招商轮船同为油运核心，但结构更偏<strong>外贸油运</strong>，且 LNG 运输以长约形式绑定，现金流稳定性更强但现货弹性略低。9/14 盘中最高 22.30（+6.90%）、收 20.90（+0.19%），是油气链里极少数<strong>收盘仍保留微幅正收益</strong>的标的——说明资金对绕行逻辑的认可度略高于上游开采。</div>\n    \n    \n    <div class=\"risk\">⚠️ 历史上海运周期波动极大（2021 年曾亏损 49.75 亿），运价回落时回撤幅度大</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>杰瑞股份</b><span class=\"code\">002353</span><span class=\"tag\">油服设备·中东订单敞口</span></div>\n    <div class=\"logic\">压裂设备全球供应 | 中东区域收入占比高 | 油价驱动资本开支的二阶受益</div>\n    <div class=\"detail\">油服设备商，逻辑与中海油服同属二阶，但它的<strong>中东区域敞口更直接</strong>——若本轮冲突后中东产油国进入复产与产能修复阶段，设备与技术服务需求会集中释放，这一路径甚至不依赖油价长期维持高位。9/14 收 -1.05%，换手 1.61%，未被定价。</div>\n    \n    \n    <div class=\"risk\">⚠️ 二阶时滞；订单确认依赖中东局势缓和后的复产资本开支，与「冲突持续」逻辑方向相反</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>海油工程</b><span class=\"code\">600583</span><span class=\"tag\">海上工程·9/14 逆势 +0.50%</span></div>\n    <div class=\"logic\">海洋工程建设 | 工作量驱动而非价格驱动 | 订单可见度高但弹性温和</div>\n    <div class=\"detail\">9/14 油气链普跌中它为数不多收红的标的（+0.50%），但成交额仅数亿级别，属于低位防御性买盘而非主题资金。逻辑上属于中海油体系的工程建设承接方，工作量驱动、价格弹性小。</div>\n    \n    \n    <div class=\"risk\">⚠️ 弹性温和，工程建设毛利率受钢材等成本影响</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>纯炼化企业</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">恒力石化（-2.43%）、荣盛石化（-2.94%）、华锦股份（-2.51%）9/14 跌幅全链居前，市场已按「成本暴露度」把它们归为受损方。机制见 diesel-crack-record 档案：国内成品油调价存在「应涨未足额」的行政折价（该档案记录过应涨 420 实际涨 250、砍四成），因此原油涨价对纯炼化是毛利压缩而非收入改善。把它们当作「油价受益股」是这轮最常见的误读。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>城燃与天然气分销</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">新奥股份（-1.26%）、贵州燃气（-2.94%）、皖天然气（-0.52%）9/14 全线走弱。城燃的定价机制是顺价传导，气源成本上升在短期内无法完全转嫁，属于天然气的成本受损方，与本档案原油供给冲击的受益链不同——详见 europe-gas-squeeze 档案。</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**供给冲击型**升级事件，商品端史诗级但权益端当日回吐。基准参照：2019 Abqaiq 事件后 A 股油服 3 日回吐全部涨幅——A 股对中东事件的定价通常只有一天。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">中国海油 ＞ 中海油服 ＞ 招商轮船。排序理由：中海油是纯上游、直接享受油价中枢抬升；中海油服受益于资本开支但滞后；油运受益于航线重构，逻辑独立。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">中曼石油 ＞ 通源石油 ＞ 准油股份 ＞ 贝肯能源 ＞ 海默科技。gene：油服小盘是中东事件行情的固定情绪载体，中曼石油在历次油价脉冲中充当民营油服龙头。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若沙特未公布复产时间表**且**上期所原油站稳 900 元/桶、布油连续三日收于 100 美元上方 → 逻辑状态由「单日事件」升为「持续供断」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 沙特公布复产时间表持续缺席、延布港未恢复装船 ② 上期所原油站稳 900 元/桶、布油连续三日收于 100 美元上方 ③ 霍尔木兹通行量维持在 200-300 万桶/日。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 沙特宣布管道恢复运行、延布港出口回到 300 万桶/日以上 ② 阿曼会议重启并达成临时航道安排、通行量回升至 500 万桶/日以上 ③ 布油回落至 95 美元下方。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">商品端布油破 108、上期所首破 900 元，权益端却**当日全回吐**——这个背离本身就是最重要的事实：A 股根本不相信中东供断能持续。历史上 A 股对中东事件的定价窗口通常只有一天。要判断这次是否不同，只看延布港装船是否恢复；纯炼化与城燃是成本受损方，已列入剔除。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>情景推演</h2>\n    <div style=\"font-size:12px;color:var(--dim);margin-bottom:8px\">每个分支为可观察的条件树——触发条件兑现后的逻辑状态与验证信号，互斥且可证伪。不含操作建议。</div>\n    <div class=\"scen\"><div class=\"sc\"><div class=\"br\">▸ 缺口持续·定价中枢上移</div><div class=\"tg\">触发：<b>管道 4 周内未复产 / 延布港出口维持 150 万桶/日以下 / 9 月赤字确认 480 万桶/日且 10 月扩大 / 布油站稳 100 美元上方</b></div><div class=\"ls\">逻辑状态：<b>供给冲击从「风险溢价」转为「实物短缺」，全球进入被动去库（对照中金所述 8-9 月陆上库存重回去化、且库存水平低于 4 月）；上游开采的「量」逻辑与油运的「吨海里」逻辑同时成立，纯炼化的成本压力继续累积</b></div><div class=\"fs\">观察信号：<b>中国海油相对上证出现持续正超额 / 招商轮船、中远海能出现涨停或放量突破 / 油气主题首次进入涨停题材地图 / VLCC-TCE 续创新高</b></div></div><div class=\"sc\"><div class=\"br\">▸ 快速复产·溢价回吐</div><div class=\"tg\">触发：<b>沙特公布管道复产时间表 / 阿曼会议重启并达成临时航道安排 / 延布港出口回到 300 万桶/日以上 / 布油跌回 90 美元下方</b></div><div class=\"ls\">逻辑状态：<b>对照 2019 年 Abqaiq 事件的路径——冲击幅度大但恢复快，价格在一个月内回吐；市场重新按「地缘风险溢价」而非「实物短缺」定价，A 股油气链的定价窗口关闭，逻辑回到 oil-hormuz 档案的第一段状态</b></div><div class=\"fs\">观察信号：<b>上期所原油跌回 800 元/桶下方 / 招商轮船、中远海能回吐至事件前价位 / A 股油气链相对上证负超额扩大</b></div></div><div class=\"sc\"><div class=\"br\">▸ 高位僵持·链内分化加剧</div><div class=\"tg\">触发：<b>管道不复产但也不进一步恶化 / 布油在 95-110 区间震荡 / 赤字维持 300-480 万桶/日</b></div><div class=\"ls\">逻辑状态：<b>两条叙事均未胜出，A 股按「成本暴露度」的排序被强化——纯上游与油运维持温和正超额，一体化央企走平，纯炼化与城燃持续负超额；主题无法形成板块效应，只在个别标的上体现</b></div><div class=\"fs\">观察信号：<b>中国海油、招商轮船维持小幅正超额而恒力石化、荣盛石化负超额扩大 / 油气主题持续缺席涨停题材地图但个股不跌 / 成品油裂解价差高位回落（中金已提示）</b></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>沙特能源部公布东西管道复产时间表，或延布港恢复装船安排说明（9/14 亚洲炼油商仍在等待）</b></li><li><b>上期所原油主力站稳 900 元/桶上方，布油连续三个交易日收于 100 美元上方</b></li><li><b>Kpler/HLIB 口径下 9 月全球石油赤字确认为 480 万桶/日量级，且 10 月继续扩大</b></li><li><b>A 股油气链出现涨停家数，或招商轮船/中远海能/中国海油相对上证出现持续正超额</b></li><li><b>中金/高盛/摩根大通等机构继续上调 4Q26 布油中枢（对照 85/114/120 三档）</b></li><li><b>美国战略石油储备 9 月底实际跌至 2.52 亿桶门槛，触发释放或回补讨论</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>沙特宣布管道恢复运行，延布港出口回到 300 万桶/日以上</b></li><li><b>阿曼会议重新召开并达成霍尔木兹临时航道安排，海峡通行量从 200-300 万桶/日回升至 500 万桶/日以上</b></li><li><b>布油跌回 90 美元/桶下方（中金 4Q26 中枢 85 的下方），或上期所原油重回 800 元/桶下方</b></li><li><b>全球石油赤字 9 月环比收窄（对照 8 月 410 万桶/日）</b></li><li><b>中国到岸原油量未受影响（8 月海运俄油 168 万桶/日的对冲继续奏效），A 股上游「量」逻辑落空</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">每日</div><div class=\"wh\">沙特东西管道状态与延布港装船安排、阿曼会议是否重启</div><div class=\"wy\">本档案分水岭的唯一客观输入项</div></div><div class=\"tkc\"><div class=\"w\">每日</div><div class=\"wh\">布油/WTI 收盘价与上期所原油主力合约价位</div><div class=\"wy\">缺口是否转化为价格的直接刻度</div></div><div class=\"tkc\"><div class=\"w\">每周</div><div class=\"wh\">Kpler 霍尔木兹通行量、HLIB/GIE 全球石油赤字与停产量月度更新</div><div class=\"wy\">供给冲击的量级刻度，避免只看价格不看量</div></div><div class=\"tkc\"><div class=\"w\">每周一三五</div><div class=\"wh\">VLCC-TCE 与中东-中国航线运价</div><div class=\"wy\">油运支线（招商轮船/中远海能）的直接兑现指标</div></div><div class=\"tkc\"><div class=\"w\">10 月底</div><div class=\"wh\">中国海油/中海油服 Q3 业绩与资本开支指引</div><div class=\"wy\">业绩环兑现验证，上游看实现油价、油服看日费率与资本开支</div></div></div>\n\n    <div class=\"src\">数据来源：中金公司研报（新华财经 2026-09-14）· 财联社 2026-09-14 伯恩斯坦/美银油价预测 · 东方财富快讯 2026-09-14（上期所原油首破 900 元/桶、沙特管道关闭后亚洲炼油商等待延布港装船说明、阿曼推迟地区会议）· HLIB 研报（Bernama 2026-09-14）· Reuters/Economic Times 2026-09-14 油价综述 · Kpler 海峡通行量与延布港出口数据 · 东方财富行情接口（2026-09-14 收盘与日内高低）</div>\n    <footer>沙特东西管道中断 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "gold-etf-record", "title": "黄金ETF持仓创纪录", "date": "2026-09-13", "grade": "正式档", "pricing": "未定价", "crate": "", "search": "黄金etf持仓创纪录 8 月全球黄金 etf 净流入 180 亿美元（有记录以来第二大单月）· 持仓 +121 吨至 4189 吨创历史新高 · aum 环比 +16% 至 6150 亿美元 映射型 💰 资金定价型 · 报告未落地、a股权益端反向杀跌", "card": "<a class=\"card-c\" href=\"#gold-etf-record\" data-search=\"黄金etf持仓创纪录 8 月全球黄金 etf 净流入 180 亿美元（有记录以来第二大单月）· 持仓 +121 吨至 4189 吨创历史新高 · aum 环比 +16% 至 6150 亿美元 映射型 贵金属·货币信用重估 未定价 山东黄金 赤峰黄金 山金国际 中金黄金 紫金矿业\" data-grade=\"正式档\" data-pricing=\"未定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-13</span>\n    <span class=\"crate \">💰 资金定价型 · 报告未落地、A股权益端反向杀跌 映射型</span>\n  </div>\n  <div class=\"ctitle\">黄金ETF持仓创纪录</div>\n  <div class=\"csub\">8 月全球黄金 ETF 净流入 180 亿美元（有记录以来第二大单月）· 持仓 +121 吨至 4189 吨创历史新高 · AUM 环比 +16% 至 6150 亿美元</div>\n  <div class=\"cpos\">8 月全球黄金 ETF 净流入 180 亿美元（有记录以来第二大单月），持仓 +121 吨至 4189 吨创新高；报告未落地，A 股权益端反向杀跌。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">贵金属·货币信用重估</span>\n    \n    <span class=\"chip pri\">未定价</span>\n    <span class=\"chip\">标的 10</span>\n    <span class=\"nm\">山东黄金</span><span class=\"nm\">赤峰黄金</span><span class=\"nm\">山金国际</span><span class=\"nm\">中金黄金</span><span class=\"nm\">紫金矿业</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-13 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-13</div>\n    <h1>黄金ETF持仓创纪录</h1>\n    <div class=\"sub\">8 月全球黄金 ETF 净流入 180 亿美元（有记录以来第二大单月）· 持仓 +121 吨至 4189 吨创历史新高 · AUM 环比 +16% 至 6150 亿美元</div>\n    <div class=\"badges\">\n      <span class=\"badge \">💰 资金定价型 · 报告未落地、A股权益端反向杀跌</span>\n      <span class=\"badge neutral\">映射型</span>\n      <span class=\"badge neutral\">定价状态：未定价</span>\n      <span class=\"badge neutral\">主线：贵金属·货币信用重估</span>\n      \n    </div>\n    \n    <div class=\"posnote\">8 月全球黄金 ETF 净流入 180 亿美元（有记录以来第二大单月），持仓 +121 吨至 4189 吨创新高；报告未落地，A 股权益端反向杀跌。</div>\n    <details class=\"more\"><summary>展开定价状态详版（434 字）</summary><div class=\"pos\"><b>定价状态备注：</b>世界黄金协会月报 9/13（周日）经央视财经、央广网转发，<strong>A 股最近交易日为 9/11，报告本身未定价</strong>。<strong>盘面状态</strong>：9/11 A 股贵金属股因美国 8 月核心 CPI 环比 0.3%（超预期 0.2%）、9/16 加息概率升至 90% 而全线杀跌——兴业银锡 -7.01%、中金岭南 -5.75%、老凤祥 -5.58%、紫金矿业 -5.42%、盛达资源 -4.57%、西部黄金 -4.32%、湖南黄金 -3.64%、中金黄金 -3.35%、山东黄金 -2.58%（当日上证 -1.18%，超额区间 -1.40 ~ -5.83pct）；<strong>而同日海外现货黄金 +0.64% 报 4344.18 美元/盎司、现货白银 +1.34% 报 64.40 美元/盎司刷日内新高</strong>。海外金银上涨、全球 ETF 创纪录买入、A 股权益端杀跌，三者在同一天同时发生——这是本档案的核心分歧点。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">世界黄金协会（WGC）数据显示，<strong>2026 年 8 月全球黄金 ETF 净流入 180 亿美元</strong>，为有记录以来<strong>第二大单月流入</strong>；总资产管理规模（AUM）环比 <strong>+16% 至 6150 亿美元</strong>；合计持仓<strong>增加 121 吨至 4189 吨，创历史新高</strong>。年初至今全球黄金 ETF 累计流入 290 亿美元，相当于增持 160 吨。黄金 ETF 为实物支持产品，资金流入即对应基金在场外购入实物黄金入库——这是<strong>可交割货源被持续抽走</strong>的硬约束，而非纸面头寸。</div></div><div class=\"card fact\"><b class=\"k\">区域结构：西方资金回归</b><div class=\"v\"><strong>北美 77 亿美元</strong>，有记录以来第三大单月流入，其中 8 月 17 日当周五个交易日就流入约 40 亿美元、占全月一半以上，这笔流入已抵消 3 月 130 亿美元的创纪录流出，使北美年初至今转为小幅净流入。<strong>欧洲 79 亿美元</strong>，创该地区历史最强单月（英国 44 亿为史上第二大、法国 15 亿创其历史最高）。<strong>亚洲 20 亿美元</strong>，为 2 月以来最强单月，中国再次领跑，有望超过 2025 全年纪录。<strong>其他地区 2.34 亿美元</strong>（澳大利亚占 1.90 亿）。北美仍是唯一年初至今净需求（吨）为负的地区。</div></div><div class=\"card fact warn\"><b class=\"k\">WGC 归因的三大驱动</b><div class=\"v\">协会官方给出三条：① <strong>日元干预与汇率政策担忧</strong>——美国 7 月 31 日出手干预外汇市场支持日元，影响外溢至 8 月初，引发市场对更广泛货币干预的担忧；② <strong>财政与美债市场担忧加剧</strong>——长期收益率上行，叠加<strong>美国财政部 8 月 19 日干预国债市场</strong>，加剧对财政可持续性与财政主导的担忧，令美元贬值风险重新浮出水面；③ <strong>价格动量</strong>——金价突破关键技术位后吸引战术性与机构配置需求。<strong>三条里没有一条是「降息预期」</strong>，这是理解本轮资金性质的关键。</div></div><div class=\"card fact\"><b class=\"k\">持仓与成交的交叉验证</b><div class=\"v\">资金流之外还有两组独立数据佐证：8 月全球黄金市场<strong>日均成交额环比 +21% 至 4300 亿美元</strong>，其中全球黄金 ETF 日均成交额<strong>环比跃升 83% 至 87 亿美元</strong>（北美基金占 73% 以上）；<strong>COMEX 黄金期货净多持仓增长 39% 至 753 吨，管理基金净多仓增加 96 吨至 470 吨</strong>，超过此前 443 吨的年内高位。数据均截至 2026 年 8 月 31 日，来源为彭博社、公司公告与 WGC。</div></div><div class=\"card fact\"><b class=\"k\">压制项：加息预期</b><div class=\"v\">与创纪录流入同时发生的是紧缩预期升温。美国劳工统计局 9/11 公布：<strong>8 月 CPI 环比 +0.4%（前值 0.1%）、同比 +3.4%；核心 CPI 环比 +0.3%（预期 0.2%、前值 0.2%）</strong>。数据公布后短端美债计入的紧缩幅度由 18bp 升至约 <strong>23bp</strong>，期货市场定价 9 月 16 日会议加息 25bp 的概率约 <strong>90%</strong>，且年底前二次加息概率同步上行。中金 9/12 研报判断该 CPI「已触及美联储加息门槛」。多家机构亦指出，短期中东局势升级风险与加息预期是拖累金价的两个主因。<strong>9/11 当日海外金价实际仍收涨 0.64%——预期与价格已经出现第一次背离。</strong></div></div><div class=\"card fact warn\"><b class=\"k\">分歧本质：通胀驱动型加息</b><div class=\"v\">传统框架是「加息 → 实际利率上行 → 杀黄金」，A 股 9/11 用的正是这个框架。但本轮加息的成因是<strong>通胀粘性</strong>——中金归因于能源价格上涨、电信涨价与 AI 带来的通胀压力持续存在；WGC 归因的买盘动机是<strong>财政可持续性、美元贬值与货币干预</strong>。若加息压不住通胀，名义利率上行未必带来实际利率上行，则「加息=杀金」的传导在中段就断了。<strong>市场买的是主权信用对冲，不是利率敏感资产</strong>——这正是 8 月资金创纪录流入与 9 月加息预期升温能够并存的原因，也是 9/16 决议会成为分水岭的逻辑基础。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/11（上证 -1.18%，普跌日，须看超额）。<strong>纯金矿</strong>：赤峰黄金 <strong>+0.20%（超额 +1.38pct，全板块唯一红盘）</strong>、四川黄金 -0.65%（超额 +0.53pct）、山金国际 -1.86%、山东黄金 -2.58%、中金黄金 -3.35%、湖南黄金 -3.64%、西部黄金 -4.32%。<strong>白银</strong>：兴业银锡 -7.01%（超额 -5.83pct）、盛达资源 -4.57%。<strong>综合矿业</strong>：中金岭南 -5.75%、紫金矿业 -5.42%、贵研铂业 -3.86%、恒邦股份 -3.81%。<strong>零售</strong>：周大生 -1.13%、老凤祥 -5.58%。<br><strong>纯度校验</strong>：跌幅排序呈现清晰的结构——纯金矿（赤峰、四川黄金）最抗跌，含工业金属的综合矿业（中金岭南、紫金、兴业银锡）跌最惨，说明 9/11 杀的是「有色金属 beta」而非「黄金逻辑」；而同日海外现货白银 +1.34% 刷日内新高、A 股白银股却跌 4.57%~7.01%，是本轮背离幅度最大的一段。9/11 全市场<strong>无一家贵金属标的涨停</strong>。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-08-31</div><div><div class=\"x\">WGC 月报数据截止日：8 月全球黄金 ETF 净流入 180 亿美元（史上第二大单月）、持仓 +121 吨至 4189 吨历史新高、AUM +16% 至 6150 亿美元。</div><div class=\"y\">为什么：本档案的第一段数据已被市场「部分定价」——海外现货黄金 8 月震荡上行 4.6%，但 A 股黄金股因业绩传导滞后 1-2 个月未充分反应。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-11</div><div><div class=\"x\">美国 8 月 CPI 环比 +0.4%（前值 0.1%）、核心 CPI 环比 +0.3%（预期 0.2%）；9 月加息 25bp 概率升至 90%；同日海外现货黄金 +0.64% 报 4344.18 美元、白银 +1.34% 报 64.40 美元刷日内新高；A 股贵金属股全线杀跌（兴业银锡 -7.01%、中金岭南 -5.75%、老凤祥 -5.58%）。</div><div class=\"y\">为什么：海外金银上涨、ETF 创纪录流入、A 股权益端杀跌——三重背离同日发生，是本档案的核心分歧点。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-13</div><div><div class=\"x\">WGC 月报中文圈经央视财经/央广网转载，A 股首个交易日（9/15）将成为定价窗口。</div><div class=\"y\">为什么：这是本档案「未定价」的关键：A 股 9/11 还在用传统框架杀跌，未读到 WGC 月报。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-16（待）</div><div><div class=\"x\">美联储 FOMC 决议 + 点阵图 + 鲍威尔讲话，市场定价加息 25bp 概率约 90%。</div><div class=\"y\">为什么：本档案的分水岭：若实际利率不升、点阵图未显示更陡紧缩路径，则传统框架「加息=杀金」传导链断裂，财政叙事成立。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「资金定价型」催化，<strong>三个要害</strong>：一是性质要看清——8 月 180 亿美元流入买的是<strong>主权信用对冲</strong>，WGC 归因的三条驱动（日元干预、财政可持续性与美元贬值、价格动量）没有一条与降息预期相关，因此它不与加息预期直接对冲；二是 A 股与海外出现三重背离——9/11 海外现货黄金 +0.64%、白银 +1.34% 刷日内新高，全球 ETF 持仓创 4189 吨历史新高，而 A 股贵金属股全线杀跌且无一家涨停，市场用的是「加息→实际利率上行→杀金」的传统框架；三是 9/16 是可证伪的分水岭——本轮加息由通胀粘性驱动（中金归因能源、电信与 AI 通胀），若加息压不住通胀则名义利率上行未必传导为实际利率上行，传统框架在中段断裂；反之若点阵图显示更陡的紧缩路径，则财政叙事让位于紧缩叙事。<strong>隐藏面</strong>：9/11 的跌幅排序本身就是答案——纯金矿（赤峰 +0.20%、四川黄金 -0.65%）最抗跌，含工业金属的综合矿业（中金岭南 -5.75%、紫金 -5.42%、兴业银锡 -7.01%）跌最惨，说明当天杀的是有色金属 beta，不是黄金逻辑；A 股尚未把「黄金」从「有色」里单独切出来定价。<br>① <strong>分水岭时点</strong>：9 月 16 日美联储决议 + 点阵图 + 鲍威尔讲话，紧缩路径陡峭与否直接决定两套框架谁胜出。<br>② <strong>传导的关键约束</strong>：ETF 流入是<strong>已发生</strong>的 8 月数据，9 月流向未知；COMEX 管理基金净多仓 470 吨已在年内高位，是加仓空间有限还是趋势延续，取决于 9 月 CFTC 数据。<br>③ <strong>待验证的核心变量</strong>：10 年期美债实际收益率的方向——它才是连接「加息」与「金价」的那一段，名义利率与实际利率若同向则传统框架成立，若背离则财政叙事成立。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>WGC 口径 8 月净流入 180 亿美元、持仓 4189 吨创历史新高，数据截至 8/31</li><li>COMEX 管理基金净多仓 +96 吨至 470 吨，超年内高位 443 吨，独立佐证</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">直接</span><ul><li>ETF 为实物支持产品，流入即购入实物黄金入库，抽紧可交割货源</li><li>买盘动机为财政可持续性与美元贬值，属主权信用对冲而非利率交易</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">方向明确</span><ul><li>矿产金售价直接挂钩 LBMA/沪金报价，金价上行即毛利率扩张，无中间稀释环节</li><li>单季毛利弹性的量化数据待各公司三季报披露（本档案未取到，标注待补）</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">背离</span><ul><li>9/11 A 股贵金属股超额 -1.40 ~ -5.83pct，全板块无一家涨停</li><li>同日海外现货黄金 +0.64%、白银 +1.34% 刷日内新高，方向相反</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响直接、业绩方向明确、股价反向背离——四环中前三环闭合，第四环与前三环方向相反，这是本档案的全部信息量所在。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>75%</strong>：前三环（变化/影响/业绩）方向一致且数据可溯源，第四环「股价」与前三环<strong>反向</strong>——这正是预期差的来源，也意味着若 9/16 后背离不收敛，则需重新审视前三环的适用性。</li><li><strong>边界要切开</strong>：受益的是<strong>纯金矿采选冶企业</strong>（售价直接挂钩金价、成本相对刚性）；<strong>不在受益侧</strong>的是① <strong>黄金珠宝零售商</strong>——「金价+工费」模式下金价上涨不带来毛利扩张，反而抬升采购成本并抑制终端消费（9/11 老凤祥 -5.58% 为板块最大跌幅之一）；② <strong>含工业金属的综合矿业</strong>——黄金只是业务之一，9/11 有色金属整体情绪降温（欧央行鹰派、美 PPI 超预期、长端美债收益率破位），工业金属拖累大于黄金贡献。</li><li><strong>主线联动</strong>：与 <strong>oil-hormuz</strong>（霍尔木兹/油价）档案构成「通胀—避险」同一条宏观主线的两端——海峡受阻推高能源价格，正是中金归因本轮通胀粘性的首要因素，也是黄金抗通胀叙事的上游；与 <strong>copper-record</strong>（伦铜创历史新高）同属「资源品重估」主线，但两者在 9/11 出现分化：铜与工业金属被宏观紧缩预期压制，黄金则同时受到紧缩压制与主权信用买盘支撑。若 9/16 后美元与实际利率同步走强，本档案与 copper-record 的压制逻辑将合并；若实际利率不升，两者分化延续。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 映射型</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>山东黄金</b><span class=\"code\">600547</span><span class=\"tag\">国内纯金龙头·超额 -1.40pct</span><span class=\"cap\">35.13 元 · 流通 1270 亿 · 9/16 +2.90%</span></div>\n    <div class=\"logic\">采选冶一体·金价传导无稀释</div>\n    <div class=\"detail\">国内黄金资源与产量居前的纯金标的，主业高度集中使金价传导无中间稀释。9/11 超额 -1.40pct，主流金矿股中最抗跌。</div>\n    \n    \n    <div class=\"risk\">⚠️ 千亿市值，弹性温和</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>赤峰黄金</b><span class=\"code\">600988</span><span class=\"tag\">海外矿·9/11 唯一红盘 +0.20%</span><span class=\"cap\">45.44 元 · 流通 756 亿 · 9/16 +4.36%</span></div>\n    <div class=\"logic\">境外资产·直挂国际金价</div>\n    <div class=\"detail\">海外金矿占比高，销售对接国际金价、成本美元计，对 LBMA 金价 beta 高于同业，更贴近本轮北美+欧洲主导的买盘定价基准。</div>\n    \n    \n    <div class=\"risk\">⚠️ 境外矿地缘与运营风险</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>山金国际</b><span class=\"code\">000975</span><span class=\"tag\">业务纯度高·9/11 -1.86%</span><span class=\"cap\">26.52 元 · 流通 669 亿 · 9/16 +4.20%</span></div>\n    <div class=\"logic\">纯金采选·无副业稀释</div>\n    <div class=\"detail\">黄金采选为主业，既无工业金属拖累也无零售成本压制，是本档案最短传导链的样本。机构持仓集中，价格以趋势方式表达。</div>\n    \n    \n    <div class=\"risk\">⚠️ 机构集中，退潮时流动性折价</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 映射型</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中金黄金</b><span class=\"code\">600489</span><span class=\"tag\">央企资源量大·弹性温和</span><span class=\"cap\">25.22 元 · 流通 1222 亿 · 9/16 +3.02%</span></div>\n    <div class=\"logic\">9/11 -3.35%</div>\n    <div class=\"detail\">央企黄金平台，资源储量与产量规模大，但机构票属性重、弹性释放偏慢，在情绪定价阶段通常滞后于弹性品种。</div>\n    \n    \n    <div class=\"risk\">⚠️ 弹性温和，业绩兑现节奏慢</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>紫金矿业</b><span class=\"code\">601899</span><span class=\"tag\">金铜双龙头·9/11 -5.42% 被工业金属拖累</span><span class=\"cap\">32.17 元 · 流通 6628 亿 · 9/16 +1.55%</span></div>\n    <div class=\"logic\">综合矿业·黄金非唯一主业</div>\n    <div class=\"detail\">黄金与铜双主业的综合矿业龙头，9/11 跌 5.42% 是主流金矿股中跌幅最大的一档——当天杀的是有色金属 beta 而非黄金逻辑，工业金属敞口掩盖了黄金贡献。</div>\n    \n    \n    <div class=\"risk\">⚠️ 工业金属敞口大，9/11 铜等品种情绪降温拖累明显</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>湖南黄金</b><span class=\"code\">002155</span><span class=\"tag\">金+锑双资源·9/11 -3.64%</span><span class=\"cap\">27.16 元 · 流通 424 亿 · 9/16 +2.22%</span></div>\n    <div class=\"logic\">双主业·纯度打折</div>\n    <div class=\"detail\">黄金与锑双资源，锑提供第二弹性来源但也稀释金价拉动。9/11 换手 5.36%，跌幅居板块偏弱一档。</div>\n    \n    \n    <div class=\"risk\">⚠️ 双主业稀释弹性</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 映射型</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>四川黄金</b><span class=\"code\">001337</span><span class=\"tag\">小市值纯金·9/11 -0.65%</span><span class=\"cap\">52.47 元 · 流通 220 亿 · 9/16 +6.41%</span></div>\n    <div class=\"logic\">213亿·纯金采选小盘</div>\n    <div class=\"detail\">小市值纯金采选标的，对金价业绩弹性显著大于龙头。9/11 超额 +0.53pct，是板块第二抗跌标的。</div>\n    <div class=\"gene\">🧬 题材基因：次新黄金小盘，2025 年黄金行情中曾作为板块情绪放大器出现，涨跌幅常为龙头两倍以上</div>\n    \n    <div class=\"risk\">⚠️ 小市值流动性有限，波动放大</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>西部黄金</b><span class=\"code\">601069</span><span class=\"tag\">西部区域金矿·9/11 -4.32%</span><span class=\"cap\">29.40 元 · 流通 261 亿 · 9/16 +3.34%</span></div>\n    <div class=\"logic\">262亿·区域金矿弹性票</div>\n    <div class=\"detail\">西部区域黄金采选企业，资源规模小于龙头但市值小、弹性大，在板块情绪起来时跟随性较强。</div>\n    <div class=\"gene\">🧬 题材基因：区域有色国资背景，历次贵金属行情中属后排补涨型弹性票</div>\n    \n    <div class=\"risk\">⚠️ 资源规模有限，业绩兑现依赖单一矿区</div>\n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 映射型</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>兴业银锡</b><span class=\"code\">000426</span><span class=\"tag\">历史白银弹性先锋·本轮背离最大</span><span class=\"cap\">36.50 元 · 流通 648 亿 · 9/16 +2.64%</span></div>\n    <div class=\"logic\">9/11 -7.01% 但现货白银当日 +1.34% 刷日内新高</div>\n    <div class=\"detail\">白银+锡双资源的弹性先锋，历史上白银行情中的首选弹性标的。本轮的矛盾在于：9/11 现货白银报 64.40 美元/盎司、当日 +1.34% 刷日内新高，而它却跌 7.01%（超额 -5.83pct），是全板块跌幅最大、与海外现货背离最严重的一只——市场按其锡与工业金属敞口定价，完全未反映白银端。</div>\n    <div class=\"gene\">🧬 题材基因：白银板块历次行情的弹性先锋，2020-2021 与 2024 年两轮白银上行中均扮演量价齐升的领涨角色</div>\n    \n    <div class=\"risk\">⚠️ 锡与工业金属敞口主导短期定价，白银逻辑被掩盖</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>盛达资源</b><span class=\"code\">000603</span><span class=\"tag\">纯白银标的·9/11 -4.57%</span><span class=\"cap\">35.27 元 · 流通 235 亿 · 9/16 +6.88%</span></div>\n    <div class=\"logic\">白银资源纯度较高</div>\n    <div class=\"detail\">A 股中白银资源纯度较高的标的，9/11 跌 4.57%，与当日现货白银 +1.34% 的方向完全相反，是本档案背离结构的另一处佐证。</div>\n    <div class=\"gene\">🧬 题材基因：白银板块老牌弹性票，2024 年白银行情中的连板品种</div>\n    \n    <div class=\"risk\">⚠️ 小市值波动大，白银价格与工业需求双重敏感</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2024 年 3-5 月黄金行情：彼时同样是「加息预期未消退 + 金价创新高」并存，A 股黄金股先于金价见顶回落，直到降息预期确认后才重新跟上——说明在紧缩叙事主导期，A 股黄金股与金价的背离可以持续数月。</li><li>2020 年 8 月黄金触及 2075 美元/盎司历史高位：全球黄金 ETF 持仓在该轮创下 3880 吨的前纪录，本轮 4189 吨已明显超越——持仓天花板的抬升是本轮与历史最可比的量化差异。</li><li>2025 年 4-6 月「对等关税」冲击：美元信用担忧推动黄金与黄金股同步走强，山东黄金、赤峰黄金走出趋势行情——该轮验证的是「货币信用叙事」驱动下 A 股黄金股能跟上金价，与本轮 WGC 归因的驱动同源。</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>山东黄金</b><span class=\"code\">600547</span><span class=\"tag\">国内纯金龙头·9/11 超额 -1.40pct 最抗跌一档</span></div>\n    <div class=\"logic\">黄金采选冶主业高度集中 | 矿产金售价直挂金价、成本端刚性 | 大市值弹性温和</div>\n    <div class=\"detail\">国内黄金资源储量与矿产金产量均居前列的纯金标的，主业高度集中在黄金采选冶——这使金价上行对它的传导没有中间稀释环节，是与综合矿业最本质的区别。8 月全球黄金 ETF 持仓创 4189 吨历史新高，意味着实物买盘持续抽紧可交割货源；矿产金售价直挂金价而成本端相对刚性，剪刀差即毛利扩张。9/11 在加息预期冲击下它跌 2.58%、超额仅 -1.40pct，是主流金矿股中最抗跌的一档，反映市场已把「纯金」与「有色」做了初步切分。约束是千亿级市值，弹性释放偏温和。</div>\n    \n    <div class=\"confirm\">✔ 确认：现货黄金站上 4400 美元/盎司后公司单季矿产金毛利率环比扩张 / 相对上证超额转正</div>\n    <div class=\"risk\">⚠️ 大市值机构票，弹性温和；且若实际利率上行，估值压制会先于业绩兑现</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>赤峰黄金</b><span class=\"code\">600988</span><span class=\"tag\">海外矿占比高·9/11 全板块唯一红盘 +0.20%</span></div>\n    <div class=\"logic\">境外金矿资产为主 | 成本弹性大于境内矿 | 已获资金率先切分</div>\n    <div class=\"detail\">核心差异是<strong>海外金矿资产占比高</strong>，销售直接对接国际金价体系、成本结构以美元计，对 LBMA 金价的beta 高于以境内销售为主的同业——在全球 ETF 买盘由北美（77 亿美元）与欧洲（79 亿美元）主导、西方资金回归的结构下，它的敞口更贴近本轮资金的定价基准。9/11 全市场贵金属股普跌中它<strong>逆势收涨 0.20%（超额 +1.38pct），是板块唯一红盘</strong>，说明资金已在按「纯金价敞口」这条线做区分。约束是境外矿涉及的地缘与运营风险高于境内。</div>\n    \n    <div class=\"confirm\">✔ 确认：后续交易日相对上证维持正超额 / 国际金价新高时公司率先跟涨</div>\n    <div class=\"risk\">⚠️ 境外矿山的地缘与运营风险；海外成本通胀可能侵蚀部分弹性</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>山金国际</b><span class=\"code\">000975</span><span class=\"tag\">纯金矿·9/11 -1.86% 次抗跌</span></div>\n    <div class=\"logic\">黄金采选为主业、业务纯度高 | 无大规模副业稀释 | 机构持仓集中度较高</div>\n    <div class=\"detail\">以黄金采选为主业的标的，业务纯度高——既没有工业金属拖累，也不含珠宝零售的成本端压制，是本档案「金价→业绩」这条最短传导链的样本。在 9/11 板块普跌中它跌 1.86%，跌幅仅次于赤峰黄金与四川黄金，位于抗跌序列前端，与「纯度越高越抗跌」的排序一致。其特点是机构持仓集中度较高，价格表达以趋势方式而非情绪方式完成，与板块里的小市值弹性票形成对照。</div>\n    \n    <div class=\"confirm\">✔ 确认：三季报矿产金单位成本持平而售价上行，毛利率扩张</div>\n    <div class=\"risk\">⚠️ 机构持仓集中，情绪退潮时流动性折价较明显</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>湖南黄金</b><span class=\"code\">002155</span><span class=\"tag\">金+锑双资源·弹性叠加但纯度打折</span></div>\n    <div class=\"logic\">黄金与锑双主业，锑价提供额外弹性但也稀释黄金纯度</div>\n    <div class=\"detail\">黄金与锑双资源标的，锑业务提供了黄金之外的第二条价格弹性来源，但也意味着金价上行对整体业绩的拉动被稀释。9/11 跌 3.64%、换手 5.36%，在板块中属于偏弱一档，反映市场对其双主业结构给出的折价。</div>\n    \n    \n    <div class=\"risk\">⚠️ 双主业会稀释金价弹性；锑价若回落则第二弹性来源同时消失</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>四川黄金</b><span class=\"code\">001337</span><span class=\"tag\">小市值纯金·9/11 -0.65% 逆势抗跌</span></div>\n    <div class=\"logic\">纯金采选小盘，市值小、对金价弹性大，9/11 表现居板块前列</div>\n    <div class=\"detail\">小市值纯金采选标的，213 亿市值对金价的业绩弹性显著大于龙头。9/11 跌 0.65%、超额 +0.53pct，是板块中仅次于赤峰黄金的第二抗跌标的，说明「纯金+小市值」的组合在加息冲击下仍是资金优先保留的敞口。</div>\n    \n    \n    <div class=\"risk\">⚠️ 小市值流动性有限，波动放大；资源规模与龙头差距大</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>黄金珠宝零售商</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">零售采用「金价+工费」模式，金价上涨不带来毛利扩张，反而抬升采购成本并抑制终端消费。9/11 老凤祥 -5.58% 是整个贵金属板块最大跌幅之一，与金价方向完全相反。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>铅锌/铂族等非金品种</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">主业为铅锌、铂族金属或黄金冶炼加工，与全球黄金 ETF 资金流无直接传导关系，9/11 的跌幅更多来自有色金属板块整体 beta 收缩。</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**资金定价型**贵金属催化，由 ETF 流向而非实物供需驱动。基准参照：2020 年 8 月黄金见顶时同样出现「ETF 创纪录流入 + 权益端先跌」的组合。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">山东黄金 ＞ 赤峰黄金 ＞ 山金国际。排序理由：矿产金自给率与克金成本是弹性核心，三者弹性纯度依次递减。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">兴业银锡 ＞ 盛达资源 ＞ 四川黄金 ＞ 西部黄金。gene：兴业银锡是银锡+黄金复合题材老妖，2019-2020 贵金属行情中多次充当板块情绪总龙头。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若 9/16 美联储决议后 COMEX 管理基金净多仓守住 470 吨**且**WGC 9 月月报延续净流入 → 逻辑状态由「资金推动」升为「趋势确认」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① COMEX 管理基金净多仓守住 470 吨上方 ② WGC 9 月月报显示亚洲（尤其中国）流入加速 ③ 实际收益率见顶回落。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 黄金 ETF 转为净流出、净多仓回落至 400 吨以下 ② 10 年期美债实际收益率继续上行、金价跌破 4200 美元 ③ 9/16 决议偏鹰。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">ETF 持仓创纪录是**资金面**证据，不是供需面证据——它可以一夜反转。2020 年 8 月同样出现「ETF 流入第二大月 + 权益端先跌」，随后金价见顶回落 18%。本档真正的变量是 9/16 美联储决议后的实际收益率方向，ETF 数据只是同步指标不是领先指标。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>情景推演</h2>\n    <div style=\"font-size:12px;color:var(--dim);margin-bottom:8px\">每个分支为可观察的条件树——触发条件兑现后的逻辑状态与验证信号，互斥且可证伪。不含操作建议。</div>\n    <div class=\"scen\"><div class=\"sc\"><div class=\"br\">▸ 财政叙事胜出·黄金续创新高</div><div class=\"tg\">触发：<b>9/16 加息落地但点阵图未显示更陡紧缩路径 / 10 年期实际收益率停止上行 / WGC 9 月月报延续净流入 / 现货黄金站上 4400 美元</b></div><div class=\"ls\">逻辑状态：<b>「通胀驱动型加息」特征确认，传统框架「加息=杀金」在中段断裂；主权信用对冲买盘延续；海外金价上行驱动 A 股纯金标的补涨</b></div><div class=\"fs\">观察信号：<b>9/15-9/16 A 股黄金股出现正超额 / 山东黄金、赤峰黄金涨停或大涨 / 纯金标的（赤峰、四川黄金）抗跌序列维持</b></div></div><div class=\"sc\"><div class=\"br\">▸ 紧缩叙事胜出·黄金阶段性回踩</div><div class=\"tg\">触发：<b>9/16 点阵图显示更陡紧缩路径 / 实际收益率继续上行 / WGC 9 月月报转为净流出 / 现货黄金跌破 4200 美元</b></div><div class=\"ls\">逻辑状态：<b>传统框架成立，名义利率与实际利率同向；财政叙事让位于紧缩叙事；A 股黄金股相对上证的负超额继续扩大</b></div><div class=\"fs\">观察信号：<b>A 股纯金标的（赤峰、四川黄金）补跌致抗跌序列瓦解 / 兴业银锡等情绪票跌幅扩大 / CFTC 净多仓回落至 400 吨以下</b></div></div><div class=\"sc\"><div class=\"br\">▸ 混合状态·结构内分化</div><div class=\"tg\">触发：<b>9/16 加息 25bp 但声明偏鸽 / 实际收益率震荡 / 金价在 4200-4400 区间整理</b></div><div class=\"ls\">逻辑状态：<b>两条叙事均未完全胜出，纯金矿与综合矿业持续分化——纯金标的跟随金价温和上行，综合矿业被工业金属敞口拖累</b></div><div class=\"fs\">观察信号：<b>山东黄金/赤峰黄金/山金国际维持小幅正超额，紫金矿业/中金岭南继续跑输 / 黄金板块内部 PE 估值分化加大</b></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>9/16 美联储决议落地后，COMEX 管理基金净多仓守住 470 吨上方（对照 8/31 数据）</b></li><li><b>世界黄金协会 9 月月报显示全球 ETF 延续净流入，亚洲（尤其中国）流入继续加速</b></li><li><b>现货黄金站上 4400 美元/盎司、现货白银站稳 64 美元/盎司上方</b></li><li><b>10 年期美债实际收益率停止上行，名义利率与实际利率出现背离</b></li><li><b>A 股黄金股相对上证的负超额收敛，山东黄金/赤峰黄金出现正超额，板块内出现涨停</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>9/16 加息落地后黄金 ETF 转为净流出，COMEX 管理基金净多仓回落至 400 吨以下</b></li><li><b>10 年期美债实际收益率继续上行，现货黄金跌破 4200 美元/盎司</b></li><li><b>点阵图显示更陡峭的紧缩路径（年底前二次加息被强化），财政叙事让位于紧缩叙事</b></li><li><b>美元指数走强叠加美债收益率上行被市场解读为财政担忧缓和，主权信用对冲需求退潮</b></li><li><b>A 股贵金属股相对上证的负超额继续扩大，且纯金标的（赤峰、四川黄金）补跌，抗跌序列瓦解</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">9 月 16 日</div><div class=\"wh\">美联储 FOMC 决议 + 点阵图 + 鲍威尔讲话（市场定价加息 25bp 概率约 90%）</div><div class=\"wy\">决定「通胀驱动型加息」与「传统紧缩」两套框架谁胜出的唯一节点</div></div><div class=\"tkc\"><div class=\"w\">每周五</div><div class=\"wh\">CFTC COMEX 黄金持仓报告（管理基金净多仓当前 470 吨，年内高位 443 吨已在身后）</div><div class=\"wy\">判断 8 月的创纪录流入在 9 月是延续还是反转</div></div><div class=\"tkc\"><div class=\"w\">每月初</div><div class=\"wh\">世界黄金协会黄金 ETF 流向月报（重点看亚洲与中国分项）</div><div class=\"wy\">本档案催化源的唯一连续更新窗口</div></div><div class=\"tkc\"><div class=\"w\">9 月 14 日</div><div class=\"wh\">伊朗与阿曼讨论霍尔木兹海峡商运航线</div><div class=\"wy\">与 oil-hormuz 档案交叉验证：海峡若恢复通航，能源通胀回落会削弱黄金抗通胀叙事的上游支撑</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">10 年期美债实际收益率与美元指数</div><div class=\"wy\">连接「加息」与「金价」的中间变量，是判断传导链是否断裂的客观刻度</div></div></div>\n\n    <div class=\"src\">数据来源：世界黄金协会 Gold ETF Flows: August 2026（gold.org，数据截至 2026/8/31，来源彭博社与公司公告）｜ 央视财经/央广网 9/13 转载 ｜ 美国劳工统计局 8 月 CPI（9/11 公布）｜ 中金研报 9/12 ｜ 东财 7×24 快讯 9/11-9/13 ｜ 东财行情 9/11</div>\n    <footer>黄金ETF持仓创纪录 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "oil-tanker-supercycle", "title": "VLCC TCE 创历史新高", "date": "2026-09-13", "grade": "正式档", "pricing": "已部分定价", "crate": "fire", "search": "vlcc tce 创历史新高 中东-中国航线报 133.6 万美元/天（周环比 +52%），vlcc-tce 指数 46 万美元/天（周环比 +66%） · 战争险费率飙升至船体价值 12.5% · 利用率 94% 逼近 97% 非线性涨价临界点 产业周期 🔥 超级周期主升 · 主线二段升级、定价进入风险溢价主导", "card": "<a class=\"card-c\" href=\"#oil-tanker-supercycle\" data-search=\"vlcc tce 创历史新高 中东-中国航线报 133.6 万美元/天（周环比 +52%），vlcc-tce 指数 46 万美元/天（周环比 +66%） · 战争险费率飙升至船体价值 12.5% · 利用率 94% 逼近 97% 非线性涨价临界点 产业周期 能源地缘·中东供断与成品油 已部分定价 招商轮船 中远海能 招商南油 中远海控 中远海特\" data-grade=\"正式档\" data-pricing=\"已部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-13</span>\n    <span class=\"crate fire\">🔥 超级周期主升 · 主线二段升级、定价进入风险溢价主导 产业周期</span>\n  </div>\n  <div class=\"ctitle\">VLCC TCE 创历史新高</div>\n  <div class=\"csub\">中东-中国航线报 133.6 万美元/天（周环比 +52%），VLCC-TCE 指数 46 万美元/天（周环比 +66%） · 战争险费率飙升至船体价值 12.5% · 利用率 94% 逼近 97% 非线性涨价临界点</div>\n  <div class=\"cpos\">VLCC-TCE 指数 46 万美元/天创历史新高（周环比 +66%），中东-中国航线 133.6 万美元/天；战争险费率飙至船体价值 12.5%。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">能源地缘·中东供断与成品油</span>\n    \n    <span class=\"chip pri\">已部分定价</span>\n    <span class=\"chip\">标的 6</span>\n    <span class=\"nm\">招商轮船</span><span class=\"nm\">中远海能</span><span class=\"nm\">招商南油</span><span class=\"nm\">中远海控</span><span class=\"nm\">中远海特</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-13 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-13</div>\n    <h1>VLCC TCE 创历史新高</h1>\n    <div class=\"sub\">中东-中国航线报 133.6 万美元/天（周环比 +52%），VLCC-TCE 指数 46 万美元/天（周环比 +66%） · 战争险费率飙升至船体价值 12.5% · 利用率 94% 逼近 97% 非线性涨价临界点</div>\n    <div class=\"badges\">\n      <span class=\"badge fire\">🔥 超级周期主升 · 主线二段升级、定价进入风险溢价主导</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：已部分定价</span>\n      <span class=\"badge neutral\">主线：能源地缘·中东供断与成品油</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">diesel-crack-record</span><span class=\"tag\" style=\"margin-right:4px\">europe-gas-squeeze</span><span class=\"tag\" style=\"margin-right:4px\">oil-hormuz</span><span class=\"tag\" style=\"margin-right:4px\">russia-diesel-outage</span><span class=\"tag\" style=\"margin-right:4px\">saudi-east-west-pipeline</span></div>\n    <div class=\"posnote\">VLCC-TCE 指数 46 万美元/天创历史新高（周环比 +66%），中东-中国航线 133.6 万美元/天；战争险费率飙至船体价值 12.5%。</div>\n    <details class=\"more\"><summary>展开定价状态详版（437 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化 9/13（周日）华创证券交运周报发布，A 股 9/11 已定价一部分。<strong>9/8 中东-中国 VLCC TCE 单日报 76 万美元/天刷历史新高</strong>时已触发主升第一段——A 股当日招商轮船 +5.43%、中远海能 +4.12%、招商南油 +2.51% 集体爆发，<strong>资金已在 9/8 完成第一波定价</strong>。9/11（上证 -1.18%，普跌日）的回踩确认板块短期进入兑现压力：招商轮船 -2.82%（超额 -1.64pct）、中远海能 -2.07%（超额 -0.89pct）、招商南油 -3.73%（超额 -2.55pct）。<strong>9/13 数据是第二段催化</strong>：中东-中国航线再涨至 133.6 万美元/天（+52% 周环比）、红海-韩国航线涨至 62.6 万美元/天（+67%），战争险费率飙升至船体价值 12.5%，定价逻辑由「成本导向」转向「风险溢价主导」——这是主升中段、不是尾声。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">9/13 华创证券交运周报披露 VLCC-TCE 指数 46 万美元/天，周环比 <strong>+66%</strong>，再创历史新高。分航线：<strong>中东-中国 133.6 万美元/天（+52% 周环比）</strong>、红海-韩国 62.6 万/天（+67%）、阿曼-韩国 57.2 万/天（+113%）、地中海-韩国 29.3 万/天（+30%）、西非-中国 39.8 万/天（+68%）、美湾-中国 29.4 万/天（+33%）。这是 9/8 中东-中国单日报 76 万美元/天刷历史新高后的<strong>再升级</strong>，且所有航线同步上行——大西洋航线货盘全面跟进，市场情绪由中东单边强势向全球扩散。</div></div><div class=\"card fact\"><b class=\"k\">定价逻辑重构</b><div class=\"v\"><strong>战争险费率飙升至船体价值的 12.5%</strong>，推动定价逻辑从「成本导向」转向「风险溢价主导」。这是油运定价机制的结构性变化——正常状态下战争险费率仅占船体价值 1-3%，当前 12.5% 意味着每艘船跑一个航次多付出相当于船体价值 12.5% 的保费，按 VLCC 单船造价 1.1 亿美元计算，单航次新增保险成本约 1375 万美元。中财网 9/11 报：<strong>中东原油出口虽下降 36%，但短驳+过驳模式大幅拉长船舶周转周期，叠加苏伊士以西运力占比上升 6.76pct，实际可用船舶天数显著收缩</strong>。供给在物理上没有减少，但「可调度性」恶化。</div></div><div class=\"card fact\"><b class=\"k\">利用率临界点</b><div class=\"v\"><strong>克拉克森估算当前 VLCC 利用率已达 94%</strong>，逼近 97% 的非线性涨价临界点。97% 以上的供需差每缩 1pct 运价弹性非线性放大——这是 2003 年 VLCC 主升、2008 年铁矿石主升都验证过的规律。中信测算：若利用率从 94% → 97%，同等的运价中枢上移需要的需求增量从当前的 6% 降到 3% 以下。供给端的「缓冲空间」已经被磨掉。</div></div><div class=\"card fact\"><b class=\"k\">需求端三增量</b><div class=\"v\">兴业证券判断油运景气由三块需求支撑：① <strong>补库</strong>——欧洲炼厂 Q4 进入冬季前补库窗口；② <strong>伊朗油转向合规市场</strong>——若伊朗原油 200 万桶/日从「黑市」转向正规市场，运输距离从 4000 海里延长至 12000 海里（绕开好望角），等同新增运力需求；③ <strong>扩库与进口分散化</strong>——印度、东南亚炼厂扩建带动中东-亚洲航线持续放量。2026 年 6-8 月 VLCC 加权平均运价均值同比 <strong>+340.99%</strong>，三个月的同比涨幅已经说明需求侧不是短期脉冲。</div></div><div class=\"card fact\"><b class=\"k\">供给端三约束</b><div class=\"v\">供给侧三道约束同时收紧：① <strong>老旧运力淘汰</strong>——单壳 VLCC 强制报废年限 25 年，2026-2027 是上一轮建造高峰（2001-2003）的报废窗口期；② <strong>新船交付受限</strong>——全球能造 VLCC 的船坞仅韩国大宇、现代、三星三家，2027 年前船位已订满，新订单实际交付要等到 2028 年；③ <strong>环保法规加速</strong>——IMO 2025 碳排放新规要求现有船舶降速 6-8%，等同额外扣减运力 6-8%。克拉克森数据：2026 年 VLCC 净增速预计仅 1.2%，是 1996 年以来最低。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\"><strong>第一段（9/8-9/9）已完成定价</strong>：招商轮船 9/8 涨停 +10.01%、9/9 +5.02%；中远海能 9/8 +4.12%、9/9 +3.11%（港股 +3.75%）；招商南油 9/8 +2.51%。<strong>第二段（9/11）板块整体回踩</strong>（上证 -1.18%）：招商轮船 -2.82%（超额 -1.64pct）、中远海能 -2.07%（超额 -0.89pct）、招商南油 -3.73%（超额 -2.55pct）——市场进入短期兑现压力。<strong>纯度校验</strong>：当日「油运」「港口航运」题材涨停 4 家为锦江航运（集运擦边）、国航远洋（远洋散货）、中远海特（多用途船）、招商北交（实控人相关），<strong>真正 VLCC 标的当日无一涨停</strong>，且三只龙头全部跑输大盘。这是主升中段的健康回踩，不是见顶——主线逻辑没破坏（运价续创新高 + 利用率临界 + 风险溢价主导），兑现压力会随 9/13 报告再催化被消化。</div></div><div class=\"card fact\"><b class=\"k\">历史相似点</b><div class=\"v\">2003 年 VLCC 主升：利用率从 88% → 96%，中东-中国运价从 4 万 → 13 万美元/天，招商轮船（前身招商局船舶）涨 540%；2008 年铁矿石主升：BDI 从 1000 → 11793，招商轮船涨 380%。两轮共同点：① 需求端出现结构性增量（03 中国入世、08 三四线基建）② 供给端约束（03 老船报废、08 港口拥堵）③ 利用率进入非线性涨价区。<strong>本轮三大因素全部到位</strong>，且叠加了地缘风险溢价（03 和 08 都没有这一项），逻辑框架最完整的一轮。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-08</div><div><div class=\"x\">中东-中国 VLCC TCE 单日报 76 万美元/天，刷历史新高；美湾-中国 21 万、西非-中国 24 万，三大航线全部接近前高。</div><div class=\"y\">为什么：主升第一段触发。资金按「历史新高」定价，板块当日集体爆发。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-09</div><div><div class=\"x\">伊朗哈尔克岛附近传出爆炸声（伊朗原油出口关键枢纽），沙特油轮在霍尔木兹海峡遭拦截；布伦特原油涨逾 3% 站上 90 美元/桶。</div><div class=\"y\">为什么：地缘从霍尔木兹海峡扩散至整个海湾水域，非海峡航线同样计入高额风险溢价。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-11</div><div><div class=\"x\">板块整体回踩（招商轮船 -2.82%、中远海能 -2.07%、招商南油 -3.73%），市场进入短期兑现压力。</div><div class=\"y\">为什么：短期获利了结，不破坏主升逻辑——这是主升中段的健康回踩，不是见顶信号。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-13</div><div><div class=\"x\">华创证券交运周报：VLCC-TCE 指数 46 万美元/天（周环比 +66%），中东-中国 133.6 万/天（+52%）、红海-韩国 62.6 万/天（+67%）；战争险费率飙升至船体价值 12.5%；VLCC 利用率 94% 逼近 97% 非线性涨价临界点。</div><div class=\"y\">为什么：主升第二段触发。TCE 续创新高、风险溢价主导定价、利用率进入非线性涨价区——三因素共振。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「超级周期主升」的第二段催化，<strong>三个要害</strong>：一是<strong>定价机制结构性变化</strong>——战争险费率从正常的 1-3% 飙升至船体价值的 12.5%，单航次新增保险成本约 1375 万美元/船，这部分成本必然转嫁到运价上，油运的定价锚从「船东成本+合理利润」切换为「船东成本+风险溢价」，后者没有上限。二是<strong>利用率进入非线性涨价区</strong>——94% 距离 97% 临界点只剩 3pct，按当前 6% 的需求增速每缩 1pct 利用率，运价弹性指数级放大；当前 6pct 的需求增量（伊朗油合规化+欧洲补库+东南亚炼厂扩建）任何一项兑现都会触发临界点。<strong>三个要害</strong>：① <strong>分水岭时点</strong>——利用率 94% → 97% 的临界突破，预计 10 月内；② <strong>传导的关键约束</strong>——若伊朗核谈推进、伊油快速合规化、海峡恢复通行，运价中枢或剧烈回调，但短期地缘烈度仍在升温；③ <strong>待验证的核心变量</strong>——欧洲炼厂 Q4 补库规模、印尼/印度新炼厂开工率。<br><strong>边界要切开</strong>：受益的是<strong>VLCC 自营船队占比高的标的</strong>（招商轮船、中远海能、招商南油），传导链直接；不受益的是<strong>集运/干散/特种船</strong>——BDI 9/13 环比 -3.3%、SCFI +2%，与 VLCC 涨价不同步。<strong>主线联动</strong>：与 <strong>oil-hormuz</strong>（霍尔木兹危机）同属「能源航运」主线——前者讲地缘风险冲击，本档案讲运价突破历史新高叠加利用率临界，两个档案前后承接构成完整叙事；与 <strong>diesel-crack-record</strong>（柴油裂解价差历史新高）通过「能源紧」这一宏观叙事联动——柴油涨价 → 炼厂加大原油采购 → 油运需求端再获增量。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>9/13 VLCC-TCE 指数 46 万美元/天（+66% 周环比），中东-中国 133.6 万/天（+52%）</li><li>战争险费率飙至船体价值 12.5%，定价机制从成本导向转向风险溢价主导</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">实</span><ul><li>VLCC 利用率 94%，逼近 97% 非线性涨价临界点</li><li>6-8月 VLCC 加权平均运价均值同比 +340.99%，三个月同比涨幅</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">直接</span><ul><li>招商轮船、中远海能 VLCC 自营船队占比高，运价上移直接增厚 TCE 收入</li><li>Q3 业绩已部分兑现（中远海能上半年净利 45.45 亿元、同比 +143.21%）</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">主升中段</span><ul><li>9/8 三龙头集体爆发（招商轮船涨停），第一段催化已定价</li><li>9/11 三龙头回踩（-2~-4pct），进入短期兑现压力——健康回踩非见顶</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响实、业绩直接、股价进入主升中段健康回踩——四环全闭合，主线逻辑完整。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>90%</strong>：四环全部到位，业绩端 Q3 已部分兑现（同比 +143%），股价端进入主升中段。</li><li><strong>边界要切开</strong>：受益的是<strong>VLCC 自营船队占比高的标的</strong>（招商轮船 VLCC 船队规模国内第一、中远海能 VLCC 自营 38 艘+租入 12 艘、招商南油成品油轮为主但 VLCC 占比下降）；不受益或弱受益的是<strong>集运/干散/特种船</strong>（中远海特、招商工业）——BDI、SCFI 与 VLCC TCE 不同步。</li><li><strong>主线联动</strong>：与 <strong>oil-hormuz</strong>（霍尔木兹危机）同主线，前者讲地缘冲击，本档案讲运价突破 + 利用率临界，两个档案前后承接构成完整叙事链；与 <strong>diesel-crack-record</strong>（柴油裂解价差历史新高）通过「能源紧」宏观叙事联动，柴油涨价 → 炼厂加大原油采购 → 油运需求增量。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·VLCC 龙头 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>招商轮船</b><span class=\"code\">601872</span><span class=\"tag\">VLCC 船队规模国内第一</span><span class=\"cap\">19.86 元 · 流通 1604 亿 · 9/16 -3.12%</span></div>\n    <div class=\"logic\">9/8 涨停·主升第一段已定价</div>\n    <div class=\"detail\">招商局集团旗下核心航运平台，VLCC 自营船队规模国内第一。本轮运价上移对它是直接 TCE 收入弹性——9/13 中东-中国航线 133.6 万美元/天（+52%），单船日增收入约 57 万美元。9/8 涨停、9/9 +5.02% 兑现第一段，9/11 -2.82% 健康回踩。Q3 业绩弹性已在预期内，关键看 Q4。</div>\n    \n    <div class=\"confirm\">✔ 确认：9/14 油价上涨或 VLCC TCE 维持 100 万美元/天以上 / Q3 业绩预增超 200%</div>\n    <div class=\"risk\">⚠️ 地缘冲突缓和导致运价中枢下移</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中远海能</b><span class=\"code\">600026</span><span class=\"tag\">VLCC 自营 38 艘+租入 12 艘</span><span class=\"cap\">20.72 元 · 流通 793 亿 · 9/16 -1.57%</span></div>\n    <div class=\"logic\">上半年净利 45.45 亿·同比 +143%</div>\n    <div class=\"detail\">VLCC 自营船队国内第二，MR 成品油轮同步受益。上半年净利 45.45 亿元、同比 +143.21%，Q3 业绩已部分兑现。VLCC 船龄结构稍新、IMO 2025 碳排放新规适应成本更低。9/8 +4.12%、9/9 +3.11% 与招商轮船节奏同步。</div>\n    \n    <div class=\"confirm\">✔ 确认：VLCC 利用率维持 94% / Q3 业绩预增超 150%</div>\n    <div class=\"risk\">⚠️ MR 成品油轮运价分化</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>招商南油</b><span class=\"code\">601975</span><span class=\"tag\">MR 成品油轮龙头</span><span class=\"cap\">4.44 元 · 流通 208 亿 · 9/16 -3.90%</span></div>\n    <div class=\"logic\">9/8 +2.51%·弹性弱于 VLCC 标的</div>\n    <div class=\"detail\">MR 成品油轮船队规模国内领先，本轮 VLCC 涨价对它受益相对小（VLCC 占比下降），但 MR 船型与柴油裂解价差高位共振。9/11 -3.73%，弹性弱于纯 VLCC 标的。</div>\n    \n    <div class=\"confirm\">✔ 确认：MR TCE 同步上行 / 成品油出口配额放开</div>\n    <div class=\"risk\">⚠️ VLCC 占比下降、原油轮弹性打折</div>\n  </div></div><div class=\"t\">🏛️ 容量中军 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中远海控</b><span class=\"code\">601919</span><span class=\"tag\">集运龙头·容量最大但与 VLCC 不同步</span><span class=\"cap\">16.38 元 · 流通 2057 亿 · 9/16 +2.50%</span></div>\n    <div class=\"logic\">9/11 收平·SCFI 同步 +2%</div>\n    <div class=\"detail\">中远海运集团旗下集运龙头，本轮 VLCC 涨价与它不同步——但作为同一集团（与中远海能同实控人）的协同效应，以及 2200 亿市值体量提供「容量中军」角色，板块整体行情需要它稳住指数。9/11 收平、抗跌。</div>\n    \n    \n    <div class=\"risk\">⚠️ 与 VLCC 主题不同步，集运业务受关税与贸易摩擦影响</div>\n  </div></div><div class=\"t\">🧬 观察·非 VLCC 船型 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中远海特</b><span class=\"code\">600428</span><span class=\"tag\">多用途船·9/11 -3.16%</span><span class=\"cap\">11.04 元 · 流通 270 亿 · 9/16 -0.45%</span></div>\n    <div class=\"logic\">跑输大盘·与 VLCC 不同步</div>\n    <div class=\"detail\">多用途船与重吊船业务为主，本轮 VLCC 涨价与它不同步——9/11 跌 3.16%，跑输大盘。受益端在设备出海而非原油运输。</div>\n    \n    \n    <div class=\"risk\">⚠️ 与 VLCC 主题不同步</div>\n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· —</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>招商轮船</b><span class=\"code\">601872</span><span class=\"tag\">9/8 板块唯一涨停·龙头地位明确</span><span class=\"cap\">19.86 元 · 流通 1604 亿 · 9/16 -3.12%</span></div>\n    <div class=\"logic\">板块情绪锚·高度同步</div>\n    <div class=\"detail\">9/8 板块中唯一涨停的标的，是本轮油运大周期主升的情绪锚——板块高度与其涨停同步。</div>\n    <div class=\"gene\">🧬 题材基因：招商局集团旗下航运平台，VLCC 主升情绪锚，2003 年 VLCC 主升与 2008 年铁矿石主升中均承担龙头角色</div>\n    \n    <div class=\"risk\">⚠️ 龙头地位已被充分定价，回调时跌幅同步最大</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2003 年 VLCC 主升：利用率从 88% → 96%，中东-中国运价从 4 万美元/天 → 13 万美元/天，招商轮船（前身招商局船舶）涨 540%——驱动是中国入世后的能源进口结构性增量。</li><li>2008 年 BDI 主升：波罗的海干散货指数从 1000 → 11793，招商轮船涨 380%——驱动是中国三四线城市基建带动的铁矿石/煤炭进口潮。</li><li>2020-2022 年油运低迷：受全球疫情与 OPEC 减产影响，VLCC TCE 一度跌至负值（中远海能 2021 年亏损 49.75 亿元），招商轮船同期跌 60%——为 2023 年起的回升积蓄势能。</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>招商轮船</b><span class=\"code\">601872</span><span class=\"tag\">VLCC 船队规模国内第一·9/8 涨停</span></div>\n    <div class=\"logic\">国内 VLCC 自营船队规模最大 | 招商局集团旗下航运平台 | Q3 业绩弹性最直接</div>\n    <div class=\"detail\">国内 VLCC 自营船队规模最大的航运平台，招商局集团旗下核心航运资产。本轮运价上移对它是最直接的 TCE 收入弹性——VLCC 单船 TCE 从 9/8 的 76 万美元/天涨至 9/13 的 133.6 万美元/天，单船日增收入约 57 万美元，按 6 个月高景气期测算单船净利增厚超 1 亿元。9/8 涨停、9/9 +5.02% 已兑现第一段，9/11 -2.82% 回踩属健康。Q3 业绩弹性已在预期内，关键是 Q4 能否延续——若伊朗核谈推进导致伊油快速合规化、海峡恢复通行，运价中枢会剧烈回调。</div>\n    \n    <div class=\"confirm\">✔ 确认：9/14 周一油价上涨或 VLCC TCE 维持 100 万美元/天以上 / Q3 业绩预增超 200%</div>\n    <div class=\"risk\">⚠️ 地缘冲突缓和导致运价中枢下移 / 单壳 VLCC 报废政策不及预期</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中远海能</b><span class=\"code\">600026</span><span class=\"tag\">VLCC+MR 船型双轮·上半年净利同比 +143%</span></div>\n    <div class=\"logic\">VLCC 自营 38 艘+租入 12 艘 | 主营国际/中国沿海原油运输 | 上半年净利 45.45 亿元</div>\n    <div class=\"detail\">VLCC 自营船队规模国内第二（38 艘自营+12 艘租入），同时拥有 MR 成品油轮船队，本轮运价上行对它是最干净的 TCE 弹性——上半年净利 45.45 亿元、同比 +143.21%，Q3 业绩已部分兑现。与招商轮船相比，它的 VLCC 船龄结构稍新、对 IMO 2025 碳排放新规的适应成本更低，但 MR 船型在成品油裂解价差高企时同步受益（与柴油链共振）。9/8 +4.12%、9/9 +3.11%，节奏与招商轮船同步。</div>\n    \n    <div class=\"confirm\">✔ 确认：VLCC 船队利用率维持 94% 以上 / Q3 业绩预增超 150%</div>\n    <div class=\"risk\">⚠️ 成品油轮运价与原油轮分化、MR 端不及预期</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>招商南油</b><span class=\"code\">601975</span><span class=\"tag\">成品油轮龙头·MR 船型弹性</span></div>\n    <div class=\"logic\">MR 成品油轮船队规模国内领先 | 主营成品油运输 | VLCC 占比下降</div>\n    <div class=\"detail\">MR 成品油轮船队规模国内领先，主营成品油运输，VLCC 占比较低。本轮原油轮 VLCC 涨价它受益相对小（VLCC 占比下降），但 MR 船型与柴油裂解价差高位共振，受益于成品油运价同步上行（华泰 9/13 研报：成品油轮与原油轮共振）。9/8 +2.51%、9/11 -3.73%——弹性弱于招商轮船/中远海能。</div>\n    \n    <div class=\"confirm\">✔ 确认：MR 成品油轮 TCE 同步上行 / 成品油出口配额放开</div>\n    <div class=\"risk\">⚠️ VLCC 占比下降、原油轮弹性不如纯 VLCC 标的</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中远海特</b><span class=\"code\">600428</span><span class=\"tag\">多用途船·非 VLCC 链</span></div>\n    <div class=\"logic\">多用途船/重吊船业务为主 | 受益于设备出海运输需求 | 与 VLCC 不同步</div>\n    <div class=\"detail\">多用途船与重吊船业务为主，本轮 VLCC 涨价与它不同步——9/11 跌 3.16%，跑输大盘。受益端在设备出海（如风电、储能集装箱）而非原油运输。</div>\n    \n    \n    <div class=\"risk\">⚠️ 与 VLCC 主题不同步，运价上涨对它是中性</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中远海特</b><span class=\"code\">600428</span></div>\n    <div class=\"logic\">主力船型为多用途船/重吊船，非 VLCC 或成品油轮，油运运价上涨对其业绩传导极弱</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>以单周 TCE 推算年度业绩的线性外推</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">TCE 是即期运价，波动极大；历史上 VLCC 峰值运价很少维持超过两个季度，线性年化会严重高估业绩</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>9/11 港口航运涨停 4 家</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">锦江航运（集运擦边）、国航远洋（远洋散货）、中远海特（多用途船）、招商北交（实控人相关）——当日「油运」「港口航运」题材涨停 4 家全部为此类擦边票，<strong>真正 VLCC 标的当日无一涨停</strong>且全部跑输大盘。这是主升中段的健康回踩，不是见顶信号。</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**超级周期主升**型：运价由地缘风险溢价主导而非单纯供需。基准参照：2015 年 VLCC 牛市，TCE 峰值 10 万美元/天持续 8 个月后回归。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">招商轮船 ＞ 中远海能 ＞ 招商南油。排序理由：VLCC 船队规模决定运价弹性，招商轮船 VLCC 数量最多；南油以成品油轮为主，弹性次之但单位运价更优。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">招商轮船（兼情绪龙）＞ 中远海特。gene：招商轮船是油运板块唯一兼具容量与情绪的标的，历次运价行情中都是资金第一落点。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若 VLCC-TCE 维持 40 万美元/天以上**且**中东-中国航线维持 100 万美元/天以上 → 逻辑状态由「单周历史新高」升为「新平台确认」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① VLCC-TCE 指数维持 40 万美元/天以上 ② 中东-中国航线 TCE 维持 100 万美元/天以上 ③ 战争险费率维持 10% 以上（风险溢价未消退）。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① VLCC-TCE 回落至 30 万美元/天以下 ② 中东-中国航线 TCE 跌破 80 万美元/天 ③ 地缘缓和、保险费率回落至 5% 以下。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">46 万美元/天的运价里，相当一部分是**战争险溢价**（费率已达船体价值 12.5%），不是运力紧张。这意味着运价与地缘缓和是反向关系——一旦停火或复航，运价回落的速度会远快于上涨。本档与 oil-hormuz、saudi-east-west-pipeline、russia-diesel-outage 构成同一能源地缘主线，三者应当同向验证。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>情景推演</h2>\n    <div style=\"font-size:12px;color:var(--dim);margin-bottom:8px\">每个分支为可观察的条件树——触发条件兑现后的逻辑状态与验证信号，互斥且可证伪。不含操作建议。</div>\n    <div class=\"scen\"><div class=\"sc\"><div class=\"br\">▸ 地缘持续升级</div><div class=\"tg\">触发：<b>霍尔木兹海峡通行持续受阻 / Brent 站稳 90 美元以上 / 战争险费率维持 10% 以上</b></div><div class=\"ls\">逻辑状态：<b>VLCC 利用率逼近 97%、中东-中国 TCE 站上 150 万美元/天、招商轮船/中远海能 Q3 业绩超预增 200%</b></div><div class=\"fs\">观察信号：<b>招商轮船冲击 2015 年以来新高 / 中远海能市值突破 1500 亿</b></div></div><div class=\"sc\"><div class=\"br\">▸ 地缘缓和·运价中枢回落</div><div class=\"tg\">触发：<b>伊朗核谈推进 / 海峡恢复通行 / Brent 跌破 80 美元</b></div><div class=\"ls\">逻辑状态：<b>运价中枢下移至 60-80 万美元/天、利用率回落至 90% 以下、Q3 业绩兑现但 Q4 预期下修</b></div><div class=\"fs\">观察信号：<b>招商轮船回踩 18 元（中远海能 18 元）后横盘整理 3-5 个交易日</b></div></div><div class=\"sc\"><div class=\"br\">▸ 伊朗油合规化·运输距离结构性拉长</div><div class=\"tg\">触发：<b>伊朗 200 万桶/日从黑市转向合规市场（美方放松二级制裁）</b></div><div class=\"ls\">逻辑状态：<b>VLCC 吨海里需求新增 15-20%、TCE 中枢上移但波动率下降</b></div><div class=\"fs\">观察信号：<b>运价从 100 万涨至 120 万但波动率从 ±40% 收窄至 ±20%</b></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>VLCC-TCE 指数维持 40 万美元/天以上（9/13 已达 46 万）</b></li><li><b>中东-中国航线 TCE 维持 100 万美元/天以上（9/13 已达 133.6 万）</b></li><li><b>VLCC 利用率突破 97% 临界点（当前 94%）</b></li><li><b>招商轮船/中远海能 Q3 业绩预增超 150%</b></li><li><b>欧洲炼厂 Q4 库存周期开启（10 月 EIA 数据）</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>VLCC-TCE 指数回落至 30 万美元/天以下</b></li><li><b>中东-中国航线 TCE 跌破 80 万美元/天</b></li><li><b>伊朗核谈推进，伊油快速合规化导致海峡恢复通行</b></li><li><b>VLCC 利用率回落至 90% 以下</b></li><li><b>招商轮船/中远海能 Q3 业绩未达预增 100% 阈值</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">每周一三五</div><div class=\"wh\">VLCC-TCE 指数与中东-中国航线 TCE（克拉克森周报）</div><div class=\"wy\">运价中枢直接刻度，跌破阈值即主升结束</div></div><div class=\"tkc\"><div class=\"w\">每日</div><div class=\"wh\">Brent 原油价格与霍尔木兹海峡通行状态</div><div class=\"wy\">地缘风险溢价定价的输入项</div></div><div class=\"tkc\"><div class=\"w\">10 月中旬</div><div class=\"wh\">欧洲炼厂 Q4 补库规模 EIA 周报</div><div class=\"wy\">需求端「补库」验证</div></div><div class=\"tkc\"><div class=\"w\">10 月底</div><div class=\"wh\">招商轮船/中远海能 Q3 业绩预告</div><div class=\"wy\">业绩端验证，验证失败会引发主升终结</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">伊朗核谈进展与海峡通行状态</div><div class=\"wy\">证伪信号的最大变量</div></div></div>\n\n    <div class=\"src\">数据来源：华创证券交运周报 2026-09-13 · 中信证券/兴业证券 2026-09-08 油运深度 · 中财网 2026-09-11 霍尔木兹危机 VLCC 运价专题 · 智通财经 2026-09-08 中远海能异动 · 老虎证券 2026-09-09 中远海能盘面 · 上海航运交易所周报 · 克拉克森 VLCC 利用率估算</div>\n    <footer>VLCC TCE 创历史新高 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "diesel-crack-record", "title": "柴油裂解价差创纪录", "date": "2026-09-12", "grade": "正式档", "pricing": "部分定价", "crate": "warn", "search": "柴油裂解价差创纪录 美国柴油裂解价差 112.17 美元/桶创历史纪录 · 零售 6.0556 美元/加仑史上首破 6 美元、同比 +63% · 全球柴油供应损失近 8%、约 500 万桶/日炼能关停 地缘冲突 ⚠ 供给硬缺口 · a股映射错位、整链按成本逻辑下杀", "card": "<a class=\"card-c\" href=\"#diesel-crack-record\" data-search=\"柴油裂解价差创纪录 美国柴油裂解价差 112.17 美元/桶创历史纪录 · 零售 6.0556 美元/加仑史上首破 6 美元、同比 +63% · 全球柴油供应损失近 8%、约 500 万桶/日炼能关停 地缘冲突 能源地缘·中东供断与成品油 部分定价 中国石化 卫星化学 荣盛石化 中国石油 宝丰能源\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-12</span>\n    <span class=\"crate warn\">⚠ 供给硬缺口 · A股映射错位、整链按成本逻辑下杀 地缘冲突</span>\n  </div>\n  <div class=\"ctitle\">柴油裂解价差创纪录</div>\n  <div class=\"csub\">美国柴油裂解价差 112.17 美元/桶创历史纪录 · 零售 6.0556 美元/加仑史上首破 6 美元、同比 +63% · 全球柴油供应损失近 8%、约 500 万桶/日炼能关停</div>\n  <div class=\"cpos\">美国柴油裂解价差 112.17 美元/桶创历史纪录、零售首破 6 美元/加仑；A 股映射错位——炼化按成本受损定价，油运独强。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">能源地缘·中东供断与成品油</span>\n    \n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 8</span>\n    <span class=\"nm\">中国石化</span><span class=\"nm\">卫星化学</span><span class=\"nm\">荣盛石化</span><span class=\"nm\">中国石油</span><span class=\"nm\">宝丰能源</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-12 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-12</div>\n    <h1>柴油裂解价差创纪录</h1>\n    <div class=\"sub\">美国柴油裂解价差 112.17 美元/桶创历史纪录 · 零售 6.0556 美元/加仑史上首破 6 美元、同比 +63% · 全球柴油供应损失近 8%、约 500 万桶/日炼能关停</div>\n    <div class=\"badges\">\n      <span class=\"badge warn\">⚠ 供给硬缺口 · A股映射错位、整链按成本逻辑下杀</span>\n      <span class=\"badge neutral\">地缘冲突</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：能源地缘·中东供断与成品油</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">europe-gas-squeeze</span><span class=\"tag\" style=\"margin-right:4px\">oil-hormuz</span><span class=\"tag\" style=\"margin-right:4px\">oil-tanker-supercycle</span><span class=\"tag\" style=\"margin-right:4px\">russia-diesel-outage</span><span class=\"tag\" style=\"margin-right:4px\">saudi-east-west-pipeline</span></div>\n    <div class=\"posnote\">美国柴油裂解价差 112.17 美元/桶创历史纪录、零售首破 6 美元/加仑；A 股映射错位——炼化按成本受损定价，油运独强。</div>\n    <details class=\"more\"><summary>展开定价状态详版（592 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化时点：AAA 数据 <strong>9/11（周五）美股盘中</strong>发布、智通财经 17:07 传入国内；裂解价差 112.17 美元/桶的 LSEG 数据为<strong>周四（9/10）</strong>；成品油调价 <strong>9/12 生效</strong>。<strong>盘面状态</strong>：9/11 A 股能化链<strong>全线杀跌且显著跑输大盘</strong>（上证 -1.18%）——恒力石化 <strong>-6.24%</strong>（超额 -5.06pct、成交 7.2 亿）、荣盛石化 <strong>-5.36%</strong>（超额 -4.18pct、8.3 亿）、华鲁恒升 -4.43%、华锦股份 -3.63%、卫星化学 -3.03%、宝丰能源 -2.96%、万华化学 -2.41%、上海石化 -2.06%；<strong>一体化央企明显抗跌</strong>——中国石油 -0.27%（超额 +0.91pct、成交 22.4 亿）、中国石化 -0.72%（超额 +0.46pct）。<strong>市场定价的是「高油价=成本挤压」，且未对成品油端受损与化工品端受益做任何结构区分</strong>——本催化的海外烈度（裂解价差历史纪录）在 A 股零体现，但方向与直觉相反（不是利好未兑现，而是市场已在按利空定价）。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心数字</b><div class=\"v\">9/11 美国汽车协会（AAA）数据显示，全美柴油平均零售价<strong>首次突破 6 美元/加仑，达 6.0556 美元</strong>（前一日 5.9773，一年前仅 3.7053，<strong>同比 +63%</strong>）；加州均价 <strong>7.9827 美元/加仑</strong>，GasBuddy 确认加州已有 <strong>6 座加油站卖到 9.999 美元/加仑的计价上限</strong>。更能反映产业本质的数字：<strong>LSEG 口径美国柴油裂解价差周四飙至 112.17 美元/桶，创历史纪录</strong>——即每桶原油加工成柴油理论上可获 112 美元以上的加工利润。</div></div><div class=\"card fact\"><b class=\"k\">供给端三重打击</b><div class=\"v\">① <strong>乌克兰无人机持续袭击俄罗斯炼厂</strong>，据 Fortune 估算已瘫痪约 40% 的俄炼油产能，俄方以<strong>柴油出口禁令</strong>回应，抽走全球约 3% 的日供应；② <strong>美伊战争与霍尔木兹/曼德海峡航运受扰</strong>，伊朗及胡塞武装袭击海湾盟友炼厂，战前霍尔木兹承担全球约 1/5 石油供应；③ <strong>中国冻结成品油出口</strong>。瓦莱罗能源 COO Gary Simmons 称两场战争已致<strong>约 500 万桶/日炼能关停</strong>；RBC 的 Helima Croft 指出<strong>美国炼厂开工率实际已达 98%，无闲置产能</strong>；Lipow Oil Associates 估算<strong>全球柴油供应已损失近 8%</strong>。合计全球超 10% 炼能处于离线状态。</div></div><div class=\"card fact\"><b class=\"k\">这是炼厂危机，不是原油危机（本档案的预期差核心）</b><div class=\"v\">布伦特约 105–107.63 美元/桶、WTI 约 100–101.12 美元，固然高位，但<strong>原油涨幅远小于柴油裂解价差创纪录这一事实所隐含的紧张度</strong>——瓶颈不在「有没有油」，而在「有没有能把油炼成柴油的产能」。美银明确指出<strong>真正威胁美国经济的是柴油价格而非原油</strong>；Brown University Watson School 估算冲突已使每户美国人多支出超 760 美元、全国账单超 1000 亿美元。<strong>市场习惯把油气行情等同于「油价上涨」，而本轮的定价变量在炼能</strong>，这是理解整条链的第一层。</div></div><div class=\"card fact warn\"><b class=\"k\">但中国这一环被政策切断了</b><div class=\"v\">中国炼厂<strong>吃不到</strong>这个 112 美元的裂解价差，有两道闸门：① <strong>出口被停</strong>——3/5 彭博报道发改委口头要求主要炼油企业立即暂停成品油出口、停止签新约并协商取消已约定出货；3/12 路透进一步报道禁令涵盖汽油、柴油与航煤（保税航煤除外）。<strong>「海外高价→出口套利」这条最直接的传导路径是断开的</strong>。② <strong>国内售价被调控</strong>——9/11 发改委实施临时调控，汽、柴油每吨本应上调 435、420 元，<strong>调控后实际上调仅 260、250 元，涨幅收窄约四成</strong>，9/12 生效。<strong>净结果：中国炼厂以国际价买原油、以管制价卖成品油，价差被反向压缩。</strong></div></div><div class=\"card fact warn\"><b class=\"k\">边界：谁受益、谁受损</b><div class=\"v\"><strong>受损</strong>：<strong>成品油端</strong>（成本国际价、售价被管制，且出口通道关闭）——越是纯炼化、成品油占比高、无上游油气对冲的公司，暴露越大。<strong>受益</strong>：<strong>化工品端</strong>——乙烯、丙烯、芳烃、PX、乙二醇等中间体<strong>不在成品油价格管制范围内，价格市场化</strong>，全球炼能紧张会同步推升其全球价格，中国大炼化的化工品部分可跟随提价；<strong>上游油气</strong>（原油 100+ 美元直接改善勘探开发板块利润）；<strong>油运</strong>（航线改道、吨海里数增加推升运价）。<strong>关键判断：同一家公司身上同时存在受损与受益两端，比例决定方向。</div></div><div class=\"card fact warn\"><b class=\"k\">持续性：检修季是支撑也是风险</b><div class=\"v\">美国 EIA 数据：<strong>柴油库存 1.063 亿桶，较五年均值低 13%</strong>，馏分油库存处于数十年同期低位。Rapidan Energy 的 Linda Giesecke 警告，<strong>北美炼厂季节性检修集中在 9–10 月，未来两个月补库困难</strong>，柴油利润率预计在明年初前维持高位且波动。这一条同时是支撑与风险：<strong>支撑在于紧张有明确的时间边界（至少到明年初）</strong>；风险在于它主要由<strong>地缘冲突与检修</strong>驱动——若美伊战事缓解（特朗普 9/9 称预计中期选举后结束），裂解价差的回落速度可能同样剧烈。摩根大通 Jeff Currie 与汇丰 Paul Bloxham 均将当前判定为「结构性挤压」，但这一判断的前提是霍尔木兹通行不能恢复。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/11（催化传入国内当日）A 股能化链<strong>全线杀跌</strong>，且<strong>内部分化恰好印证了上述边界</strong>：<strong>纯炼化重挫</strong>——恒力石化 -6.24%（17.27 元、成交 7.2 亿）、荣盛石化 -5.36%（13.60 元、8.3 亿，且 9/10 已跌 5.09% 两日累计 -10.2%）、华锦股份 -3.63%、上海石化 -2.06%；<strong>化工品端同样无差别下杀</strong>——华鲁恒升 -4.43%、卫星化学 -3.03%、宝丰能源 -2.96%、万华化学 -2.41%；<strong>一体化央企明显抗跌</strong>——中国石油 -0.27%（成交 22.4 亿）、中国石化 -0.72%；<strong>油运回落</strong>——中远海能 -2.07%、招商轮船 -2.82%（但 9/9 曾涨停 +10.01%、成交 38.9 亿）。当日上证 -1.18%、深成 -1.08%、全市场跌停 21 家。<strong>结论：海外裂解价差创纪录这一事实在 A 股零体现；市场用的是笼统的「高油价=成本挤压」逻辑把整条链一起下杀，既没有给化工品受益端定价，也没有把成品油受损端的暴露程度区分开——结构未被定价，而非方向未被定价。</strong></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-12</div><div><div class=\"x\">柴油裂解价差创纪录：美国柴油裂解价差 112.17 美元/桶创历史纪录 · 零售 6.0556 美元/加仑史上首破 6 美元、同比 +63%</div><div class=\"y\">为什么：本档为「能源地缘」的建档时点，后续二段催
