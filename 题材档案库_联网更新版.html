化均在此之上叠加</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「全球供给硬缺口」型催化，但<strong>三个要害</strong>全部指向同一个反直觉结论：一是<strong>缺的是炼能不是原油</strong>——112.17 美元/桶的裂解价差是历史纪录，而布伦特 105 美元并非极端，两者的背离本身就是「原油不缺、炼厂缺」的证明，任何按油价 beta 理解本轮行情的框架都会失效；二是<strong>最肥的一段被政策切走了</strong>——中国炼厂出口通道自 3 月起关闭、国内售价被临时调控砍掉四成涨幅，因此「海外柴油暴涨」对 A 股炼化<strong>不是利好而是成本端的确认</strong>，这是本档案与市场直觉最大的分歧点；三是<strong>9/11 的下杀是结构性的而非情绪性的</strong>——纯炼化（恒力 -6.24%、荣盛 -5.36%）与一体化央企（中石油 -0.27%、中石化 -0.72%）的超额收益差达 5 个百分点以上，说明市场<strong>已经在按「原油成本暴露度」给炼化股排序</strong>，排序逻辑是对的，但它没有往下再切一层——同一家公司身上还有<strong>不受管制的化工品端</strong>。<strong>隐藏面</strong>：市场把「高油价」当成对整个能化板块的统一利空，但高油价对<strong>上游油气是利润、对纯炼化是成本、对化工品是成本推动的价格上行</strong>，三者方向完全不同；把荣盛石化（炼化一体化、化工品占比高）与上海石化（成品油占比高）按同一个逻辑下杀，就是这次下杀中最粗糙的地方。<br>① <strong>分水岭时点</strong>：9–10 月北美炼厂季节性检修期的库存去化节奏，以及美伊战事是否如特朗普 9/9 所称在中期选举后结束。<br>② <strong>传导的关键约束</strong>：中国成品油出口禁令是否松动——这是把 112 美元裂解价差接进 A 股报表的<strong>唯一闸门</strong>，只要它关闭，海外烈度与 A 股业绩之间就没有直接通道。<br>③ <strong>待验证的核心变量</strong>：化工品（乙烯、PX、乙二醇）价格能否跟上涨幅——若化工品价格同步上行，则炼化一体化的化工端可抵消成品油端损失；若化工品不涨，则整条链确实是纯成本冲击。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实且极强</span><ul><li>柴油裂解价差 112.17 美元/桶创历史纪录，零售价 6.0556 美元/加仑史上首破 6 美元、同比 +63%</li><li>全球柴油供应损失近 8%，约 500 万桶/日炼能关停，美国炼厂开工率 98% 无闲置</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">在中国被切断</span><ul><li>出口通道自 3 月起关闭，海外高价无法转化为中国炼厂的出口套利</li><li>国内成品油售价被临时调控砍掉四成涨幅，成本国际价、售价管制价，价差反向压缩</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">成品油端反受损</span><ul><li>纯炼化：原油成本 100+ 美元、成品油售价被管制，价差被压缩</li><li>化工品端（乙烯/PX/乙二醇）不在管制范围内，理论上受益，但尚未在价格或股价上体现</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">已按成本定价</span><ul><li>9/11 纯炼化超额 -4~-5pct（恒力 -6.24%、荣盛 -5.36%），一体化央企超额 +0.5~0.9pct</li><li>市场已按「原油成本暴露度」排序，但未切分同一公司内部的化工品受益端</li></ul></div></div>\n    <div class=\"sum\">▸ 变化极强、影响在中国被政策切断、业绩端成品油反受损、股价已按成本挤压定价——这是一次「全球定价、中国绝缘」的错位，而非简单的利好未兑现。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>50%</strong>：变化环是本次所有档案中最硬的（历史纪录级数字），但<strong>影响环在中国境内被两道政策闸门切断</strong>，导致业绩环方向反转（成品油端受损），四环因此无法闭合。<strong>本档案的价值不在于「找到受益标的」，而在于证明「海外油气涨价 ≠ A 股炼化受益」这一映射断裂</strong>。</li><li><strong>边界要切开</strong>：相对受益的是<strong>上游油气</strong>（中国石油、中国石化勘探开发板块，原油 100+ 美元直接改善利润，9/11 两者分别 -0.27%、-0.72%，跑赢大盘 0.9pct 与 0.5pct）、<strong>不受管制的化工品端</strong>（荣盛、恒力的化工品部分；卫星化学、宝丰能源等轻烃/煤化工路线，原料不挂钩原油而产品市场化定价）、以及<strong>油运</strong>（吨海里数增加推升运价，招商轮船 9/9 曾涨停）；<strong>明确受损</strong>的是<strong>成品油占比高且无上游对冲的纯炼化</strong>（上海石化、华锦股份）与<strong>以柴油为投入品的行业</strong>（公路物流、农业机械、航运燃油成本方）。注意<strong>同一家炼化一体化公司身上两端并存</strong>，化工品占比是决定方向的关键比例，而这一比例在当前股价中未被区分。</li><li><strong>主线联动</strong>：与 <strong>oil-hormuz</strong>（油价破 100、霍尔木兹受扰）档案<strong>同属「能源地缘」主线且互为因果</strong>——本档案是 oil-hormuz 的下游延伸：同一场地缘冲突，在原油端表现为价格（oil-hormuz），在炼能端表现为裂解价差（本档案），<strong>两者应交叉验证：若霍尔木兹通行恢复，原油与裂解价差会同步回落，但裂解价差的回落幅度取决于炼能修复速度，通常更慢</strong>。与 <strong>thermal-coal-830</strong>（煤价上调）的联系在能源比价——油气与煤炭互为替代，柴油裂解价差高企会强化煤炭的能源比价支撑。与 <strong>copper-record</strong> 共同反映 2026 年资源品在多重地缘冲突下的系统性重估背景。</li><li><strong>本档案与 oil-hormuz 的关键差异</strong>：oil-hormuz 记录的是「价格冲击」，本档案记录的是「产能冲击」——价格冲击可以靠释放库存与战略储备平抑，产能冲击（500 万桶/日炼能离线、开工率已达 98%）没有短期解法，这是它更硬的一面；但也正因中国有价格管制与出口管制两道防火墙，它对 A 股的传导反而更弱。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中国石化</b><span class=\"code\">600028</span><span class=\"tag\">上游对冲+销售网络</span><span class=\"cap\">5.21 元 · 流通 4931 亿 · 9/16 -1.51%</span></div>\n    <div class=\"logic\">一体化对冲·跑赢大盘0.46pct</div>\n    <div class=\"detail\">同时站在受益与受损两端：勘探开发享原油 100+ 美元，炼油销售承受管制压缩。9/11 跌 0.72%、跑赢大盘，抗跌本身即市场对其上游对冲结构的定价。是本档案边界切分的最佳样本。</div>\n    \n    \n    <div class=\"risk\">⚠️ 临时调控若常态化，成品油端价差持续压缩</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>卫星化学</b><span class=\"code\">002648</span><span class=\"tag\">路径最纯的化工品端</span><span class=\"cap\">26.87 元 · 流通 905 亿 · 9/16 +0.07%</span></div>\n    <div class=\"logic\">原料不挂钩原油·产品不受管制</div>\n    <div class=\"detail\">乙烷/丙烷轻烃裂解，原料跟美国天然气、产品全部市场化定价，理论上应最受益于石化中间体涨价。9/11 跌 3.03%，与纯炼化被无差别下杀——这是本次定价最粗糙之处。</div>\n    \n    \n    <div class=\"risk\">⚠️ 乙烷价格若随能源整体上行则价差逻辑失效</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>荣盛石化</b><span class=\"code\">002493</span><span class=\"tag\">化工品占比高的双面体</span><span class=\"cap\">13.03 元 · 流通 1220 亿 · 9/16 -0.23%</span></div>\n    <div class=\"logic\">两日累计-10.2%</div>\n    <div class=\"detail\">浙石化化工品占比高于传统炼厂，是「成品油受损+化工品受益」的双面体，方向由化工品价格能否跟上决定。9/11 跌 5.36%、9/10 跌 5.09%，两日累计 -10.2%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 化工品若不跟涨，则只剩成本冲击一端</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中国石油</b><span class=\"code\">601857</span><span class=\"tag\">上游权重最高</span><span class=\"cap\">10.81 元 · 流通 1.75 万亿 · 9/16 -0.37%</span></div>\n    <div class=\"logic\">超额+0.91pct·最抗跌</div>\n    <div class=\"detail\">勘探开发板块权重最高，是本链条中受益端最纯、受损端最小的一端。9/11 跌 0.27%、超额 +0.91pct、成交 22.4 亿，为能化链最抗跌标的。</div>\n    \n    \n    <div class=\"risk\">⚠️ 原油价格回落则唯一受益端消失</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>宝丰能源</b><span class=\"code\">600989</span><span class=\"tag\">原料不进口原油</span><span class=\"cap\">24.06 元 · 流通 1764 亿 · 9/16 -1.64%</span></div>\n    <div class=\"logic\">煤化工路线·原料在境内</div>\n    <div class=\"detail\">煤制烯烃路线，原料为国内煤炭（价格受国内供需主导），产品为聚乙烯、聚丙烯等市场化定价化工品，因此绕开了原油成本端。9/11 跌 2.96%、成交 23.2 亿。</div>\n    \n    \n    <div class=\"risk\">⚠️ 煤价上行会形成自身成本压力（与 thermal-coal-830 档案交叉验证）</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 映射型</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>卓越新能</b><span class=\"code\">688196</span><span class=\"tag\">生物柴油出口欧洲</span><span class=\"cap\">33.24 元 · 流通 42 亿 · 9/16 +1.40%</span></div>\n    <div class=\"logic\">9/8曾涨11.28%</div>\n    <div class=\"detail\">国内生物柴油龙头，产品出口欧洲。欧洲受俄柴油出口禁令冲击最重，生物柴油替代需求理论上受益。9/8 曾大涨 11.28%，9/11 收 35.70 元、跌 1.82%，成交仅 1.2 亿，弹性高但容量小。</div>\n    <div class=\"gene\">🧬 题材基因：生物柴油小盘龙头，历次欧洲能源危机与柴油涨价行情中的高弹性记忆票，涨幅快但持续性与出口政策/税率高度绑定</div>\n    \n    <div class=\"risk\">⚠️ 欧盟反倾销税率是比柴油价格更关键的变量；小盘流动性有限</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>华锦股份</b><span class=\"code\">000059</span><span class=\"tag\">纯炼化受损端代表</span><span class=\"cap\">5.43 元 · 流通 87 亿 · 9/16 +0.56%</span></div>\n    <div class=\"logic\">成品油占比高·连续三日跌</div>\n    <div class=\"detail\">成品油占比高、无上游油气对冲，是本链条受损端的典型代表。9/9 -3.09%、9/10 -2.85%、9/11 -3.63%，连续三日下跌，跌幅持续大于一体化央企，与市场按「原油成本暴露度」排序的逻辑一致。</div>\n    <div class=\"gene\">🧬 题材基因：北方炼化小盘，历史上多次在油价上行周期中被作为「成本受损方」率先杀跌，是板块内成本暴露度的高频风向标</div>\n    \n    <div class=\"risk\">⚠️ 无上游对冲，成品油端暴露最大</div>\n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>招商轮船</b><span class=\"code\">601872</span><span class=\"tag\">油运龙头·运距逻辑</span><span class=\"cap\">19.86 元 · 流通 1604 亿 · 9/16 -3.12%</span></div>\n    <div class=\"logic\">9/9涨停·9/11回落2.82%</div>\n    <div class=\"detail\">9/9 涨停 +10.01%（成交 38.9 亿），9/11 回落 -2.82%（成交 33.1 亿）。它与本档案的连接是「运距」而非「油价」：全球炼能重构使运输路径变长、吨海里数增加，且完全不受国内成品油管制影响。冲高回落说明这轮运距逻辑已被交易过一轮。</div>\n    <div class=\"gene\">🧬 题材基因：油运与干散双主业龙头，历次地缘冲突导致的航线改道行情中均为板块情绪锚，涨停常出现在冲突升级的次日、回落同样迅速</div>\n    \n    <div class=\"risk\">⚠️ 运价与地缘烈度高度绑定，战事缓解则逻辑同步消失</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2022 俄乌冲突后的欧洲柴油危机：欧盟对俄成品油禁运导致欧洲柴油裂解价差一度冲至 70 美元/桶上方，为当时历史高位——本轮 112.17 美元/桶较之高出约 60%，说明当前炼能紧张的烈度超过 2022 年。</li><li>2026 年 3 月中国暂停成品油出口：发改委口头要求主要炼油企业立即停止成品油出口、停止签新约并协商取消已约定出货，3/12 路透报道禁令涵盖汽油、柴油与航煤——这是本轮海外高价无法传导至中国炼厂报表的制度起点。</li><li>2026 年 9 月 11 日发改委临时调控：汽、柴油每吨应上调 435、420 元，实际仅上调 260、250 元，涨幅收窄约四成——首次以明确数字展示「国际涨价、国内打折」的传导折扣，是本档案边界判断最直接的政策证据。</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中国石化</b><span class=\"code\">600028</span><span class=\"tag\">一体化对冲·勘探开发受益端</span></div>\n    <div class=\"logic\">上游油气+炼化+销售一体化 | 原油 100+ 美元直接改善勘探开发利润，对冲炼油端压缩 | 成品油零售涨价 250 元/吨的实际接收方（但被调控砍掉四成）</div>\n    <div class=\"detail\">中国石化是理解本档案边界的最佳样本：它<strong>同时站在受益与受损两端</strong>。受益端是勘探开发板块——布伦特 105 美元、WTI 100 美元直接抬升自产原油实现价格；受损端是炼油与销售——以国际价买原油、以管制价卖成品油，9/11 调价中柴油应涨 420 元/吨实际只涨 250 元，四成涨幅被调控吃掉，而公司恰恰是这 250 元的直接接收方。销售网络是它区别于民营大炼化的资产：终端零售价上调仍能部分传导，只是幅度受限。9/11 收 5.52 元、跌 0.72%，跑赢大盘 0.46pct，成交 12.7 亿——抗跌本身就是市场对「上游对冲」这一结构的定价。</div>\n    \n    <div class=\"confirm\">✔ 确认：勘探开发板块季度实现油价跟随布伦特上行 / 成品油出口配额松动 / 后续调价窗口不再被临时调控压缩</div>\n    <div class=\"risk\">⚠️ 临时调控若常态化，成品油端价差将持续被压缩；上游油气价格回落则对冲失效</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>荣盛石化</b><span class=\"code\">002493</span><span class=\"tag\">双面体·化工品占比决定方向</span></div>\n    <div class=\"logic\">浙石化 4000 万吨级炼化一体化 | 成品油端受损、化工品端受益 | 两日累计 -10.2%，弹性与风险同源</div>\n    <div class=\"detail\">控股浙江石化（全球单体规模最大的炼化一体化装置之一），产品结构中<strong>化工品占比高于传统炼厂</strong>——这是它在本档案中的关键：成品油端被管制压缩，但乙烯、PX、乙二醇、苯乙烯等中间体不在管制范围内、价格市场化，全球炼能紧张理论上会推升其价格。<strong>它因此是「成品油受损 + 化工品受益」的双面体，方向由化工品价格能否跟上决定</strong>。9/11 收 13.60 元、跌 5.36%（超额 -4.18pct、成交 8.3 亿），9/10 已跌 5.09%，<strong>两日累计 -10.2%</strong>，是本链条中跌幅最大的标的之一——市场当前按纯成本逻辑给它定价，未对化工端做任何区分。</div>\n    \n    <div class=\"confirm\">✔ 确认：乙烯/PX/乙二醇价格随全球炼能紧张同步上行 / 公司三季度化工品毛利率环比改善 / 成品油出口配额重启</div>\n    <div class=\"risk\">⚠️ 化工品价格若未跟涨，则公司只剩成本冲击一端；高杠杆与高油价库存损失会放大波动</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>卫星化学</b><span class=\"code\">002648</span><span class=\"tag\">轻烃裂解·绕开原油成本</span></div>\n    <div class=\"logic\">乙烷/丙烷制乙烯，原料不挂钩原油 | 产品全部市场化定价、无成品油管制暴露 | 是「吃到化工品涨价」的较纯路径</div>\n    <div class=\"detail\">采用乙烷/丙烷轻烃裂解路线生产乙烯及下游乙二醇、聚乙烯、丙烯酸等，<strong>两个特征使它在本档案中路径最纯</strong>：一是<strong>原料端不直接挂钩原油</strong>（乙烷价格跟随美国天然气），因此高油价对它是同行成本上行而非自身成本上行；二是<strong>产品端没有任何成品油管制暴露</strong>，全部市场化定价，全球炼能紧张推升石化中间体价格时它是直接的价格接收方。理论上它应当是本链条中最受益的品种，但 9/11 收 27.22 元、<strong>跌 3.03%</strong>（成交 13.6 亿），同样被无差别下杀——<strong>这是本次定价最粗糙的地方：一个原料不挂钩原油、产品不受管制的标的，与纯炼化按同一逻辑下跌</strong>。</div>\n    \n    <div class=\"confirm\">✔ 确认：乙烯及衍生物价格上行而乙烷价格维持低位（价差扩大） / 公司季度毛利率环比扩张 / 美国乙烷出口价格未跟随原油上涨</div>\n    <div class=\"risk\">⚠️ 乙烷价格若跟随能源整体上行则价差逻辑失效；全球化工品需求走弱会压制产品价格</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>恒力石化</b><span class=\"code\">600346</span><span class=\"tag\">纯炼化·成本暴露最大</span></div>\n    <div class=\"logic\">2000 万吨级炼化一体化，成品油占比高于荣盛，上游无油气对冲，是本链条中成本暴露最直接的一环</div>\n    <div class=\"detail\">拥有 2000 万吨级炼化一体化装置，与荣盛同为民营大炼化代表，但成品油占比相对更高、且没有上游勘探开发板块对冲，因此原油 100+ 美元的成本冲击更为直接。另需注意外部变量：其子公司恒力石化（大连）炼化于 2026 年 4 月被美国财政部列入 SDN 清单，商务部 5 月已发布阻断禁令，跨境政策构成额外不确定性。9/11 收 17.27 元、跌 6.24%（超额 -5.06pct、成交 7.2 亿），为能化链当日最大跌幅。</div>\n    \n    \n    <div class=\"risk\">⚠️ 无上游对冲，成品油端暴露最大；SDN 清单带来的跨境结算与供应链风险独立于本逻辑</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>招商轮船</b><span class=\"code\">601872</span><span class=\"tag\">油运·吨海里数受益</span></div>\n    <div class=\"logic\">航线改道与运距拉长推升油轮运价，是本链条中少数不受国内价格管制影响的环节</div>\n    <div class=\"detail\">全球炼能分布被迫重构（俄柴油出口禁令、中东炼厂受损、中国出口冻结）意味着<strong>成品油与原油的运输路径变长、吨海里数增加</strong>，油轮运价因此获得支撑，且这一环节完全不受国内成品油价格管制影响。9/9 曾涨停 +10.01%（成交 38.9 亿），9/11 回落 -2.82%（成交 33.1 亿），呈现明显的情绪冲高后回落。它与本档案的连接是「运距」而非「油价」。</div>\n    \n    \n    <div class=\"risk\">⚠️ 运价周期性强，与地缘烈度高度绑定；战事缓解则运距逻辑同步消失（与 oil-hormuz 档案交叉验证）</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>卓越新能</b><span class=\"code\">688196</span><span class=\"tag\">生物柴油·欧洲替代需求</span></div>\n    <div class=\"logic\">生物柴油出口欧洲，海外柴油（尤其欧洲受俄禁令冲击）价格高企理论上放大出口价差，但欧盟反倾销税是决定变量</div>\n    <div class=\"detail\">国内生物柴油龙头，产品以出口欧洲为主。逻辑上，欧洲因俄柴油出口禁令成为全球柴油紧张最严重的区域，生物柴油作为掺混替代品的需求与价格应同步受益，中国出口企业可享受价差扩大。但这一路径受<strong>欧盟对中国生物柴油的反倾销措施</strong>制约，税率的边际变化对实际价差的影响可能大于柴油价格本身，因此属传导链较远、变量更多的一档。9/8 曾大涨 11.28%，9/11 收 35.70 元、跌 1.82%（成交 1.2 亿）。</div>\n    \n    \n    <div class=\"risk\">⚠️ 欧盟反倾销税率是比柴油价格更关键的变量；出口政策与认证壁垒构成额外不确定性</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>成品油出口套利方</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">「海外柴油 6 美元/加仑 → 中国炼厂出口套利」是本催化最容易被误用的一条路径。但中国自 2026 年 3 月起已暂停成品油出口（3/5 彭博报发改委口头要求暂停，3/12 路透报禁令涵盖汽柴航煤），<strong>这条传导链当前是断开的</strong>，任何以此为前提的受益推断都不成立。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>以柴油为投入品的行业</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">柴油是卡车、船舶、农机、发电与供暖的燃料，价格上涨对公路物流、农业机械、建筑施工等是明确的成本冲击，不在受益侧。美国国内这一传导已经显现（亚马逊对第三方卖家征收临时燃料及物流附加费、UPS 与联邦快递增加费用）。</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**能源地缘·成品油实物短缺**，但 A 股映射错位。基准参照：2022 年俄乌后柴油裂解冲高行情，当时 A 股炼化同样按成本受损下跌。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">中国石化 ＞ 卫星化学 ＞ 荣盛石化。排序理由：拥有成品油出口配额/化工品外售能力者才能把海外高价接进报表，纯内销炼厂只能承受成本。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">卓越新能 ＞ 华锦股份 ＞ 招商轮船（情绪龙）。gene：卓越新能是生物柴油小盘票，2022 柴油紧张行情中作为替代逻辑被反复炒作。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若中国成品油出口配额重启或禁令松动**且**乙烯/PX/乙二醇同步上行 → 逻辑状态由「海外高价无法兑现」升为「国内外价差可兑现」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 石化中间体价格跟随上行 ② 成品油出口配额重启 ③ 全球炼能紧张延续、裂解价差站稳 100 美元上方。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 美伊缓和、霍尔木兹通行恢复，裂解价差回落至 70 美元下方 ② 化工品价格未跟随上行 ③ 国内成品油出口政策继续收紧。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">112 美元的裂解价差是**海外**价格，A 股炼化厂拿不到——国内成品油出口受配额管制，高价无法进入报表，反而原料成本上升。这条链唯一能把海外高价接进国内的就是「出口配额重启」这一个政策变量；它不动，裂解价差再高也是别人的行情。</div></div></div>\n\n    \n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>乙烯、PX、乙二醇等石化中间体价格跟随全球炼能紧张同步上行（化工品受益端从理论变为价格事实）</b></li><li><b>中国成品油出口配额重启或禁令松动——这是把 112 美元裂解价差接进 A 股报表的唯一闸门</b></li><li><b>后续调价窗口不再被临时调控压缩（应涨幅度与实际涨幅的差距收窄）</b></li><li><b>美国柴油库存（当前 1.063 亿桶、低于五年均值 13%）在 9–10 月检修季继续去化</b></li><li><b>纯炼化与一体化央企的超额收益差继续扩大——说明市场开始按结构而非笼统成本逻辑定价</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>美伊战事缓解、霍尔木兹通行恢复，柴油裂解价差自 112 美元快速回落至 70 美元下方（与 oil-hormuz 档案交叉验证）</b></li><li><b>化工品价格未跟随上行——则荣盛、卫星等「化工品受益端」逻辑落空，整条链确认为纯成本冲击</b></li><li><b>临时调控常态化，成品油应涨幅度与实际涨幅的差距扩大至五成以上</b></li><li><b>北美检修季结束后柴油库存快速回补，Rapidan 预测的「明年初前维持高位」被证伪</b></li><li><b>中国进一步收紧成品油出口或扩大价格管制范围——则海外烈度与 A 股业绩彻底脱钩</b></li><li><b>布伦特跌破 100 美元而裂解价差同步回落——说明紧张主要来自原油端而非炼能端，本档案「炼厂危机而非原油危机」的核心判断不成立</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">每日</div><div class=\"wh\">LSEG 美国柴油裂解价差（当前 112.17 美元/桶）与 AAA 零售均价</div><div class=\"wy\">本档案的核心数字，回落速度决定整个逻辑的时间窗口</div></div><div class=\"tkc\"><div class=\"w\">每周三</div><div class=\"wh\">EIA 美国馏分油库存（当前 1.063 亿桶、低于五年均值 13%）</div><div class=\"wy\">检修季补库能否完成，是紧张持续到明年初还是提前缓解的客观标志</div></div><div class=\"tkc\"><div class=\"w\">9–10 月</div><div class=\"wh\">北美炼厂季节性检修进度与开工率（当前 98%）</div><div class=\"wy\">无闲置产能是本轮紧张的供给端核心约束</div></div><div class=\"tkc\"><div class=\"w\">10 个工作日一次</div><div class=\"wh\">发改委成品油调价：应涨幅度 vs 实际上调幅度</div><div class=\"wy\">「国际涨价、国内打折」的折扣率是本档案边界判断最直接的量化指标</div></div><div class=\"tkc\"><div class=\"w\">10 月下旬</div><div class=\"wh\">三季报：荣盛/恒力/卫星的化工品毛利率环比变化</div><div class=\"wy\">检验化工品受益端是否真的抵消了成品油端损失，是四环能否闭合的唯一客观检验</div></div></div>\n\n    <div class=\"src\">数据来源：美国汽车协会 AAA(9/11) ｜ LSEG 裂解价差数据(9/10) ｜ 美国能源信息署 EIA ｜ 智通财经/新浪财经(9/11 17:07) ｜ Reuters(9/10–9/11) ｜ 财联社 ｜ 彭博(3/5)、路透(3/12)关于中国成品油出口禁令 ｜ 发改委成品油调价(9/11，9/12 生效) ｜ 东方财富行情(9/11) ｜ 本工作区 out/fupan_20260911.json 盘面数据(9/11，iFinD)</div>\n    <footer>柴油裂解价差创纪录 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "optical-chip-shortage", "title": "光芯片缺口扩至30%+", "date": "2026-09-12", "grade": "正式档", "pricing": "部分定价", "crate": "bolt", "search": "光芯片缺口扩至30%+ 全球 eml 缺口由 25–30% 扩至 30%+、订单排到 2028 · 三安光芯片 2750→4500 片/月(+63.6%)、四类芯片同步涨价 · 25g+ 国产化率仅 4–5% 产业周期 ⚡ 供给硬缺口 · 上游芯片未定价、下游模块已抢跑", "card": "<a class=\"card-c\" href=\"#optical-chip-shortage\" data-search=\"光芯片缺口扩至30%+ 全球 eml 缺口由 25–30% 扩至 30%+、订单排到 2028 · 三安光芯片 2750→4500 片/月(+63.6%)、四类芯片同步涨价 · 25g+ 国产化率仅 4–5% 产业周期 ai算力与电力配套 部分定价 三安光电 源杰科技 长光华芯 光迅科技 仕佳光子\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-12</span>\n    <span class=\"crate bolt\">⚡ 供给硬缺口 · 上游芯片未定价、下游模块已抢跑 产业周期</span>\n  </div>\n  <div class=\"ctitle\">光芯片缺口扩至30%+</div>\n  <div class=\"csub\">全球 EML 缺口由 25–30% 扩至 30%+、订单排到 2028 · 三安光芯片 2750→4500 片/月(+63.6%)、四类芯片同步涨价 · 25G+ 国产化率仅 4–5%</div>\n  <div class=\"cpos\">全球 EML 缺口由 25–30% 扩至 30%+、订单排到 2028；三安光芯片产能 2750→4500 片/月并四类产品同步涨价，上游芯片仍未定价。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">AI算力与电力配套</span>\n    \n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 8</span>\n    <span class=\"nm\">三安光电</span><span class=\"nm\">源杰科技</span><span class=\"nm\">长光华芯</span><span class=\"nm\">光迅科技</span><span class=\"nm\">仕佳光子</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-12 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-12</div>\n    <h1>光芯片缺口扩至30%+</h1>\n    <div class=\"sub\">全球 EML 缺口由 25–30% 扩至 30%+、订单排到 2028 · 三安光芯片 2750→4500 片/月(+63.6%)、四类芯片同步涨价 · 25G+ 国产化率仅 4–5%</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 供给硬缺口 · 上游芯片未定价、下游模块已抢跑</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：AI算力与电力配套</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">ai-compute-hike</span><span class=\"tag\" style=\"margin-right:4px\">deepseek-chain</span><span class=\"tag\" style=\"margin-right:4px\">gas-turbine-aidc-orders</span><span class=\"tag\" style=\"margin-right:4px\">intel-cpu-price-hike</span><span class=\"tag\" style=\"margin-right:4px\">mlcc-murata-eol</span><span class=\"tag\" style=\"margin-right:4px\">power-semi-hike3</span></div>\n    <div class=\"posnote\">全球 EML 缺口由 25–30% 扩至 30%+、订单排到 2028；三安光芯片产能 2750→4500 片/月并四类产品同步涨价，上游芯片仍未定价。</div>\n    <details class=\"more\"><summary>展开定价状态详版（564 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化双节点：<strong>9/11 15:38</strong> 三安光电互动平台披露扩产与四类芯片涨价（<strong>盘中</strong>），<strong>9/12 周末</strong>经财联社、券商解读扩散。<strong>盘面状态</strong>：9/11 三安光电收 12.43 元、<strong>-1.51%</strong>（连续第 4 根阴线，12.86→12.43 累计 -3.3%，成交 11.1 亿）；长光华芯 -3.35%、源杰科技 -1.05%、光迅科技 -1.13%、仕佳光子 -0.83%、天孚通信 -2.62%——<strong>纯度最高的五只光芯片标的当日全线绿盘</strong>。同期<strong>中际旭创 +4.03%（成交 299.7 亿，全市场前列）</strong>，CPO 题材 9 家涨停全部是擦边票（超声电子 2 板 35.2 亿主业 PCB、风华高科 99.8 亿主业 MLCC、博敏电子主业 PCB、三孚股份主业化工）。当日上证 -1.18%、创业板 -0.49%，故上游芯片仅略弱于大盘，<strong>不能称作「完全未定价」</strong>；真正的预期差在<strong>结构</strong>：资金买下游模块、不买上游芯片，而本催化的受益方恰在上游。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事件</b><div class=\"v\">9/11 三安光电在互动平台回应投资者提问，披露<strong>光技术产品现有外延产能 6000 片/月、光芯片产能 2750 片/月</strong>，「因 AI 光模块需求激增，高速芯片市场供需紧张」，计划将光芯片产能<strong>扩充至 4500 片/月（+63.6%）</strong>，订购设备自 2026 年<strong>第四季度</strong>起陆续到厂。同日公司另答：2026 年以来已对 <strong>LED 芯片、射频芯片、电力电子芯片、光技术芯片四类同步上调价格</strong>，以对冲贵金属与衬底涨价——<strong>不是一款产品涨价，而是四条产品线同时提价</strong>。</div></div><div class=\"card fact\"><b class=\"k\">缺口有多硬</b><div class=\"v\">全球 EML 供需缺口已由 25%–30% <strong>扩大到超过 30%</strong>；2026 年 EML 与 CW-DFB LD 合计月产能预计增至 <strong>5070 万颗</strong>（同比翻倍以上）仍追不上需求，<strong>订单排到 2028 年</strong>，<strong>200G EML 交付周期一度拉长到约 50 周</strong>。价格端：<strong>100G EML 由 5 美元涨至 7–8 美元（+40%）</strong>，长协同步上调 10%–20%；<strong>200G EML 长协 10–12 美元、现货 12–15 美元（溢价超 50%）</strong>。采购规则已由买方市场转为<strong>「先锁产能→再谈价格」，头部厂商预付全款锁定未来产能</strong>——中小模块厂面临「有钱买不到货」。</div></div><div class=\"card fact\"><b class=\"k\">国产化率的断崖式分层</b><div class=\"v\">中国光芯片自给率呈断崖分布：<strong>2.5G 及以下 90%+、10G DFB 约 60%、25G DFB 约 70%</strong>，但<strong>25G 及以上高端整体自给率仅 4%–5%，100G EML（800G 模块标配）仅 4%–8%，200G EML（1.6T 核心）商业化自给率不足 5%</strong>。常被混用的「光通信芯片国产化率已达 78%」把大量低速与无源芯片算入——<strong>两类口径同时成立，但决定话语权的只有后者</strong>。全球 EML 前三家（Lumentum、Broadcom、三菱）合计市占 <strong>72%</strong>，CW-DFB 前四家占 <strong>74%</strong>；200G EML 中 Lumentum 一家市占超 50%。</div></div><div class=\"card fact\"><b class=\"k\">为什么是三安（而非纯光模块厂）</b><div class=\"v\">三安是<strong>国内唯一同时拥有 GaAs 与 InP 双材料 IDM 产能</strong>的厂商，<strong>100G EML 稳定量产、占国内高速数据中心芯片约 35% 份额</strong>，1.6T 完成头部客户送样。光通信侧已建成 <strong>70mW–200mW CW 光源完整功率阶梯</strong>，与全球前十大光模块厂中 <strong>4 家</strong>建立合作（2 家 400G/800G 批量出货、2 家 800G/1.6T 送样测试）。产业含义：2026 年 3 月<strong>英伟达向 Lumentum 与 Coherent 各投资 20 亿美元锁定产能</strong>——最终客户绕过模组厂直绑芯片厂后，中国模块厂「全球登顶」叙事中被削弱的正是<strong>稀缺资源掌控方</strong>这一环，国产光芯片由「自主可控口号」变为模块厂保利润率的现实需求。</div></div><div class=\"card fact warn\"><b class=\"k\">涨价的成本侧真相</b><div class=\"v\">三安给出的涨价理由是成本：<strong>银价年内涨幅约 170%、金价约 70%，蓝宝石衬底价格持续攀升</strong>。但成本只能解释「为什么涨」，不能解释「为什么涨得动」——<strong>LED 芯片经多年产能出清后集中度显著提升，碳化硅与光芯片则处于供不应求窗口</strong>，供给端不再无序竞争才是涨价能落地的原因。仍需切开看：<strong>滤波器业务上半年营收 2.30 亿元、净利润亏损 1.18 亿元</strong>，对仍亏损的产品线执行涨价靠的是成本倒逼而非市场地位，<strong>能否被客户接受存在不确定性</strong>。</div></div><div class=\"card fact warn\"><b class=\"k\">治理风险——同一份公告里的反向信号</b><div class=\"v\">2025 年是三安上市以来<strong>净利润首亏</strong>之年，<strong>2026 上半年扣非净利润仍亏损 5.04 亿元</strong>；实控人林秀成、副董事长兼总经理林科闯<strong>被留置调查已近半年</strong>，控股股东所持<strong>全部股份被司法冻结、质押比例超六成</strong>。在治理风险尚未解除的背景下，四类芯片同步涨价所释放的「经营正常」信号本身需要打折——<strong>这是本档案最大的单一不确定性，且它是公司层面的，与产业景气无关</strong>。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/11（周五）<strong>光芯片五只纯度最高标的全线下跌</strong>：三安光电 -1.51%（12.43 元，四连阴）、长光华芯 -3.35%（295.70 元，成交 32.6 亿）、源杰科技 -1.05%（1701 元，成交 57.2 亿）、光迅科技 -1.13%（177.36 元，成交 58.5 亿）、仕佳光子 -0.83%（148.50 元，成交 30.5 亿）；天孚通信 -2.62%、华工科技 -1.81%。<strong>反向对照：中际旭创 +4.03%（926 元、成交 299.7 亿）为当日全市场成交额前列</strong>。CPO 题材 9 家涨停中<strong>无一只光芯片纯度标的</strong>——超声电子（2 板、35.2 亿）主业 PCB，风华高科（99.8 亿）主业 MLCC，博敏电子（23.0 亿）主业 PCB，三孚股份（13.2 亿）主业三氯氢硅。当日上证 -1.18%、深成 -1.08%、创业板 -0.49%、科创 50 -1.01%，全市场涨停 40 家、跌停 21 家、炸板 18。<strong>结论：本催化指向的上游芯片端，在盘面上同时跑输大盘与下游模块，「扩产 63.6% + 四类芯片涨价」这一组信息未被定价在上游</strong>。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-12</div><div><div class=\"x\">光芯片缺口扩至30%+：全球 EML 缺口由 25–30% 扩至 30%+、订单排到 2028 · 三安光芯片 2750→4500 片/月(+6</div><div class=\"y\">为什么：本档为「AI算力·光芯片国产替代」的建档时点，后续二段催化均在此之上叠加</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「供给硬缺口 + 龙头扩产」双催化，<strong>三个要害</strong>：一是<strong>缺口的性质是结构性而非周期性</strong>——EML 缺口从 25–30% 扩大到 30%+、订单排到 2028、200G EML 交付 50 周，且采购规则已变为「先锁产能再谈价格」，这不是价格周期而是<strong>权力关系反转</strong>；二是<strong>受益方与资金所在方错位</strong>——9/11 资金在中际旭创（+4.03%、299.7 亿）等下游模块，而本催化的弹性在上游芯片（全线绿盘），且 CPO 涨停的 9 只全是 PCB/MLCC/化工擦边票，说明市场把「光瓶颈」当成题材标签炒，而非按产业链利润归属定价；三是<strong>三安的特殊性在于它是「被当成 LED 公司定价的光芯片 IDM」</strong>——四类芯片同步涨价披露的是定价权，但在 2026H1 扣非仍亏 5.04 亿、实控人被留置的背景下，这个定价权信号的可信度需要外部交叉验证（其他厂商是否同步涨价）。<strong>隐藏面</strong>：国产替代的实质进展集中在技术门槛低一个数量级的 <strong>CW 光源</strong>（只需连续发光，绕开 EAM 结构与高速调制），而 <strong>EML 涉及 MOCVD 外延与纳米级光栅两大工艺关，研发周期五到八年</strong>；<strong>用 CW 的进展线性外推 EML 的替代速度，是这个板块最容易犯的错误</strong>。三安本次扩的正是光芯片（含 EML）产能，但设备 Q4 才到厂，<strong>产能释放与认证窗口能否对上是真正的胜负手</strong>。<br>① <strong>分水岭时点</strong>：2026 Q4 设备到厂后的产能爬坡，以及长光华芯 200G EML 在 Q3–Q4 能否如期量产（这是 1.6T 放量的唯一独木桥）。<br>② <strong>传导的关键约束</strong>：光芯片导入需「样品测试→可靠性验证→小批量→良率爬坡→大批量」<strong>全流程一到两年</strong>，且认证窗口与代际节奏绑定——同为 100G EML，2025 年通过与 2027 年通过商业价值完全不同。<br>③ <strong>待验证的核心变量</strong>：源杰、长光华芯、仕佳是否<strong>跟随三安同步涨价</strong>——单一公司涨价可能只是成本倒逼，全行业涨价才证明是供需格局改变。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实且加速</span><ul><li>全球 EML 缺口由 25–30% 扩至 30%+，订单排到 2028、200G EML 交付约 50 周</li><li>100G EML 价格 5→7–8 美元(+40%)，采购规则变为先锁产能再谈价格</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">直接</span><ul><li>光芯片在 800G/1.6T 模块成本占比已升至 70% 以上，是价值量最大环节</li><li>英伟达 20 亿美元直投 Lumentum/Coherent 锁产能，模块厂议价权被削弱，国产芯片从口号变刚需</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">分化</span><ul><li>源杰已兑现：2025 营收 6.01 亿(+138.5%)扭亏，2026Q1 单季利润接近 2025 全年、毛利率 77.81%</li><li>三安尚未兑现：2026H1 扣非仍亏 5.04 亿，光芯片收入占比未单独披露，弹性无法量化</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">结构未动</span><ul><li>9/11 五只光芯片纯度标的全线绿盘，三安 -1.51% 四连阴、长光华芯 -3.35%</li><li>资金在中际旭创(+4.03%、299.7 亿)等下游模块；CPO 9 家涨停全是 PCB/MLCC 擦边票</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实且加速、影响直接、业绩端已分化（源杰兑现/三安未兑现）、股价端上游结构未动——这是一次「利润在往上游转移、资金却还在下游」的错位。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>70%</strong>：变化与影响两环最硬（缺口 30%+、订单排到 2028、成本占比 70%+），业绩环出现明显分化（源杰已兑现、三安未兑现），股价环是最弱也最有机会的一环——不是没涨，而是<strong>涨错了环节</strong>。</li><li><strong>边界要切开</strong>：相对受益的是<strong>上游光芯片 IDM</strong>（三安、源杰、长光华芯、光迅、仕佳——光芯片涨价对其是收入端）；<strong>中性偏受益</strong>的是已实现芯片自供的模块厂（中际旭创硅光自给率 2025 年 45%、2026 年目标 70%；光迅 25G DFB 自给率超 70%）；<strong>受损的是纯光模块代工与无自供能力的中小模块厂</strong>——光芯片涨价对其是成本，「有钱买不到货」直接挤压毛利与交付确定性。另需注意<strong>硅光路线是对 EML 的绕行</strong>（800G 硅光占比已超 50%、1.6T 达 70–80%），硅光渗透加速会<strong>削弱 EML 缺口、同时放大 CW 光源需求</strong>，两条支线的受益标的并不相同。</li><li><strong>主线联动</strong>：与 <strong>mlcc-murata-eol</strong>（村田停产常规 MLCC）、<strong>power-semi-hike3</strong>（功率半导体三波涨价）同属 <strong>AI算力</strong>主线下的「上游元器件供给紧张」支线——三者共同指向同一个产业事实：<strong>AI 基建的瓶颈已从 GPU 本身外溢到被动元件、功率器件与光芯片</strong>，且三者的定价状态高度一致（都是产业端已涨价、A 股上游未反应）。与 <strong>ai-compute-hike</strong>（云厂商上调算力价）、<strong>gas-turbine-aidc-orders</strong>（燃机订单新高）构成 AI 算力从「算力定价→电力配套→上游器件」的完整传导链，四份档案应交叉验证：<strong>若云厂商资本开支见顶，本档案的缺口逻辑将同步松动</strong>。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>三安光电</b><span class=\"code\">600703</span><span class=\"tag\">事件核心·双材料 IDM</span><span class=\"cap\">12.79 元 · 流通 638 亿 · 9/16 +2.81%</span></div>\n    <div class=\"logic\">扩产63.6%+四类涨价</div>\n    <div class=\"detail\">唯一 GaAs+InP 双材料 IDM，100G EML 占国内高速数据中心芯片约 35%。催化最直接：光芯片产能 2750→4500 片/月，叠加四类芯片同步涨价。9/11 跌 1.51%、四连阴，成交 11.1 亿。</div>\n    \n    \n    <div class=\"risk\">⚠️ 扣非仍亏、实控人被留置，治理风险独立于产业景气</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>源杰科技</b><span class=\"code\">688498</span><span class=\"tag\">纯芯片 IDM·业绩已兑现</span><span class=\"cap\">1750.94 元 · 流通 2152 亿 · 9/16 +3.90%</span></div>\n    <div class=\"logic\">唯一100G EML量产</div>\n    <div class=\"detail\">10G DFB 全球市占 25% 第一，2025 营收 +138.5% 扭亏、2026Q1 毛利率 77.81%，是本链条中唯一已把缺口转化为报表的公司。不涉模块制造，无客户同业竞争。9/11 跌 1.05%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 股价与营收体量之间的估值张力；认证窗口错过则高毛利不可持续</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>长光华芯</b><span class=\"code\">688048</span><span class=\"tag\">良率92%·200G送样验证</span><span class=\"cap\">332.19 元 · 流通 586 亿 · 9/16 +9.66%</span></div>\n    <div class=\"logic\">200G EML·1.6T独木桥</div>\n    <div class=\"detail\">100G EML 良率超 92% 行业靠前，200G EML 完成客户验证、计划 2026 Q3–Q4 量产——这是国内 1.6T 大规模交付的核心卡点。9/11 跌 3.35%，为光芯片链当日最大跌幅。</div>\n    \n    \n    <div class=\"risk\">⚠️ 200G 量产延期则逻辑最硬的一段落空</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>光迅科技</b><span class=\"code\">002281</span><span class=\"tag\">三条路线·25G自给率70%+</span><span class=\"cap\">185.21 元 · 流通 1456 亿 · 9/16 +10.00%</span></div>\n    <div class=\"logic\">自供型模块厂</div>\n    <div class=\"detail\">唯一同时布局 InP/GaAs/硅光，1.6T 硅光芯片 Q1 放量、良率 95%。芯片自供使涨价弹性被内部化，收益弱于纯 IDM。9/11 跌 1.13%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 自供属性稀释弹性，同时承担模块端价格竞争</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>仕佳光子</b><span class=\"code\">688313</span><span class=\"tag\">无源领先·CW小批量</span><span class=\"cap\">160.78 元 · 流通 727 亿 · 9/16 +9.49%</span></div>\n    <div class=\"logic\">AWG订单激增3倍</div>\n    <div class=\"detail\">AWG 全球市占领先、订单同比激增 3 倍、产能利用率 100%；CW 激光器 50–200mW 全系列完成产能配置，但仍是小批量。9/11 跌 0.83%，板块内跌幅最小。</div>\n    \n    \n    <div class=\"risk\">⚠️ 有源业务收入贡献有限；无源景气与 EML 缺口非同一驱动</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 映射型</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>超声电子</b><span class=\"code\">000823</span><span class=\"tag\">9/11 CPO 唯一2板</span><span class=\"cap\">25.12 元 · 流通 149 亿 · 9/16 +5.10%</span></div>\n    <div class=\"logic\">CPO最高板2板·主业PCB</div>\n    <div class=\"detail\">9/11 共封装光学(CPO)题材中唯一 2 板标的，成交 35.2 亿，为板块最高板。但主业是印制电路板，光芯片纯度近乎为零——它的涨停代表的是「CPO 题材标签化炒作」这一路径，与本档案的产业逻辑方向不同源。</div>\n    <div class=\"gene\">🧬 题材基因：PCB 老牌厂商，历次 CPO/光模块行情中被作为「低价 PCB+光」双重标签反复炒作，板数高但主业与光芯片无关</div>\n    \n    <div class=\"risk\">⚠️ 主业 PCB 与光芯片缺口无传导关系，属题材标签而非产业链受益方</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>三孚股份</b><span class=\"code\">603938</span><span class=\"tag\">9/11 光纤概念首板</span><span class=\"cap\">52.37 元 · 流通 200 亿 · 9/16 -1.50%</span></div>\n    <div class=\"logic\">光纤概念涨停·主业化工</div>\n    <div class=\"detail\">9/11 光纤概念涨停（成交 13.2 亿），主业为三氯氢硅等硅系列化工产品。被归入光纤概念的原因是硅材料上游联想，与光芯片的 InP/GaAs 体系毫无关系。</div>\n    <div class=\"gene\">🧬 题材基因：三氯氢硅/硅系列化工小盘，历史上多次被归入光纤、光伏、半导体材料多个概念轮流炒作，概念纯度极低但弹性记忆强</div>\n    \n    <div class=\"risk\">⚠️ 概念归类错误导致的错误映射，与 EML/CW 缺口无实质关联</div>\n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 映射型</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中际旭创</b><span class=\"code\">300308</span><span class=\"tag\">当日资金真正在买的方向</span><span class=\"cap\">907.80 元 · 流通 1.01 万亿 · 9/16 +5.07%</span></div>\n    <div class=\"logic\">+4.03%·成交299.7亿</div>\n    <div class=\"detail\">9/11 逆势 +4.03%（926 元、成交 299.7 亿，全市场成交额前列），与光芯片五只标的全线绿盘形成鲜明对照。它是本档案最重要的<strong>反向参照系</strong>：资金明确在下游模块而非上游芯片。硅光自给率 2025 年 45%、2026 年目标 70%，使其兼具模块龙头与准自供属性，但对 EML 缺口本身是<strong>成本承受方</strong>。</div>\n    <div class=\"gene\">🧬 题材基因：全球光模块龙头，历次 AI 算力行情的绝对中军与板块情绪锚，其涨跌基本等同于市场对光通信主线的态度表决</div>\n    \n    <div class=\"risk\">⚠️ 光芯片涨价对其首先是成本压力；自给率提升路径属绕行 EML 而非解决 EML</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2023–2024 AI 光模块第一波：中际旭创、新易盛等凭 400G/800G 出海订单走出数倍行情，市场定价的是「模块制造效率 + 客户绑定」，上游光芯片几乎未被单独定价——本轮缺口逻辑的上游定价起点为零。</li><li>2025 源杰 100G EML 量产：国内首次实现 100G EML 从 0 到 1，源杰当年营收 6.01 亿元、同比 +138.5% 并扭亏为盈，验证了「国产高端光芯片一旦通过认证，业绩弹性极快」这一路径。</li><li>2026 年 3 月英伟达向 Lumentum 与 Coherent 各投资 20 亿美元锁定产能：最终客户绕过模组厂直绑芯片厂，标志光芯片从「配套件」升级为「战略稀缺资源」，是本轮供需权力反转的标志性事件。</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>三安光电</b><span class=\"code\">600703</span><span class=\"tag\">事件核心·GaAs+InP 双材料 IDM</span></div>\n    <div class=\"logic\">化合物半导体龙头 | 光芯片产能 +63.6%、四类芯片同步涨价 | 治理风险未解除、光芯片收入占比未披露</div>\n    <div class=\"detail\">国内唯一同时拥有 GaAs 与 InP 双材料 IDM 产能的化合物半导体龙头，100G EML 已稳定量产、占国内高速数据中心芯片约 35% 份额，1.6T 完成头部客户送样——这是它区别于纯 LED 叙事的核心。本次催化的直接性在于 9/11 同时抛出两件事：光芯片产能由 2750 片/月扩至 4500 片/月（+63.6%，设备 Q4 起到厂），以及 LED、射频、电力电子、光技术四类芯片同步涨价。光通信侧已建成 70mW–200mW CW 光源完整功率阶梯，与全球前十大光模块厂中 4 家合作，2 家 400G/800G 批量出货、2 家 800G/1.6T 送样。9/11 收 12.43 元、跌 1.51%，为连续第 4 根阴线。</div>\n    \n    <div class=\"confirm\">✔ 确认：Q4 设备如期到厂并披露产能爬坡进度 / 三季报首次单独披露光技术芯片收入或毛利率 / 其他光芯片厂商跟进涨价</div>\n    <div class=\"risk\">⚠️ 2026H1 扣非仍亏 5.04 亿，实控人与总经理被留置近半年、控股股东股份全部冻结，治理风险与产业逻辑相互独立</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>源杰科技</b><span class=\"code\">688498</span><span class=\"tag\">纯芯片 IDM·业绩已兑现</span></div>\n    <div class=\"logic\">不与模块厂同业竞争 | 10G DFB 全球市占 25%、国内唯一 100G EML 量产 | 估值与收入体量不匹配的风险</div>\n    <div class=\"detail\">国内纯高速光芯片 IDM 龙头，覆盖 2.5G 至 200G 全速率 DFB/EML，10G DFB 芯片全球市占 25%（全球第一），2025 年量产 4000 万颗 25G EML 打破海外垄断，是国内唯一实现 100G EML 量产的厂商；CW 光源 70mW 批量交付、100mW 完成客户验证。结构性优势在于<strong>纯芯片 IDM、不涉足下游模块制造，不存在与客户同业竞争</strong>——在「客户即竞争对手」的产业链里是稀缺属性。业绩已兑现：2025 年营收 6.01 亿元（+138.5%）扭亏为盈，2026Q1 单季利润接近 2025 全年，毛利率 77.81%。2026 年 2 月扩产公告总投资近 20 亿元。9/11 收 1701 元、跌 1.05%，成交 57.2 亿。</div>\n    \n    <div class=\"confirm\">✔ 确认：100G PAM4 EML 由客户验证转入放量 / CW 光源百万级出货持续 / 毛利率维持 75% 以上</div>\n    <div class=\"risk\">⚠️ 1701 元的高价与 6.01 亿营收体量之间的估值张力；代际切换快，认证错过窗口则高毛利不可持续</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>长光华芯</b><span class=\"code\">688048</span><span class=\"tag\">200G EML 独木桥·1.6T 卡点</span></div>\n    <div class=\"logic\">工业激光跨界通信 | 100G EML 良率超 92%、200G EML 送样验证 | 200G 量产节奏是全部估值前提</div>\n    <div class=\"detail\">依托工业激光技术积累跨界光通信，100G EML 已批量供货国内头部光模块企业、量产良率超 92%（行业靠前），同步向海外云厂商送样；CW DFB 的 70mW、100mW 进入批量供货。<strong>真正的看点是 200G EML</strong>——它是 1.6T 光模块核心器件，长期是国内 1.6T 大规模交付的核心卡点，公司已完成客户验证、计划 2026 年三至四季度量产，为 2027 年大规模供货做准备，若按期落地具备标志性意义。另与亨通光电等联合发起星钥光子，在苏州建全国首条 8 英寸硅光芯片量产线（一期投资 12 亿元，预计 2026 年底通线）。9/11 收 295.70 元、跌 3.35%，成交 32.6 亿，是光芯片链当日跌幅最大者。</div>\n    \n    <div class=\"confirm\">✔ 确认：200G EML 于 2026 Q3–Q4 如期量产 / 海外云厂商送样转订单 / 8 英寸硅光线按期通线</div>\n    <div class=\"risk\">⚠️ 200G EML 量产延期则本档案最硬的那一段逻辑落空；9/11 跌幅 -3.35% 为板块最大，筹码结构偏弱</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>仕佳光子</b><span class=\"code\">688313</span><span class=\"tag\">无源 AWG 龙头·有源刚起步</span></div>\n    <div class=\"logic\">AWG 全球市占领先、订单同比激增 3 倍、产能利用率 100%，但受益的是无源端而非本催化的 EML 缺口</div>\n    <div class=\"detail\">深耕无源 AWG（阵列波导光栅），全球市占领先、订单同比激增 3 倍、产能利用率 100%；有源侧 CW 激光器完成客户验证并小批量出货，50mW–200mW 全系列完成产能配置。它与本催化的连接点在 CW 光源而非 EML——CW 只需连续发光、不做调制，是国产最先撕开的口子，但难度比 EML 低一个数量级。9/11 收 148.50 元、跌 0.83%，成交 30.5 亿，是光芯片链当日跌幅最小者。</div>\n    \n    \n    <div class=\"risk\">⚠️ 有源业务仍在小批量阶段，业绩贡献有限；无源端景气与本催化的 EML 缺口并非同一驱动</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>光迅科技</b><span class=\"code\">002281</span><span class=\"tag\">三条路线全布局·自供率最高</span></div>\n    <div class=\"logic\">国内唯一同时布局 InP/GaAs/硅光，25G DFB 自给率超 70%，是「自供型模块厂」而非纯芯片弹性</div>\n    <div class=\"detail\">国内唯一同时布局磷化铟、砷化镓、硅光三条路线的厂商，自有 6 英寸 InP 产线，25G DFB 自给率超 70%、100G EML 批量交付；适配 1.6T 的硅光芯片 2026Q1 稳定放量、通过海内外头部云厂商认证、量产良率 95%，800G 硅光模块成本较传统方案低 30%。它是「芯片自供的模块厂」——光芯片涨价对其是内部成本转移而非收入增量，弹性弱于纯 IDM。9/11 收 177.36 元、跌 1.13%，成交 58.5 亿。</div>\n    \n    \n    <div class=\"risk\">⚠️ 自供属性使涨价弹性被内部化；同时承担模块端价格竞争压力</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>东山精密</b><span class=\"code\">002384</span><span class=\"tag\">索尔思光电·InP CW 全流程自研</span></div>\n    <div class=\"logic\">旗下索尔思已实现 InP CW 光源全流程自研自产，100mW 通过 AWS/Coherent 认证，但主业为 PCB，光芯片纯度低</div>\n    <div class=\"detail\">旗下索尔思光电实现 InP CW 光源芯片全流程自研自产，100mW CW 芯片量产并通过 AWS、Coherent 认证，300–400mW 高功率款已送样英伟达，2026 年规划出货数百万颗、远期年产能可达 10 亿颗级别，并依托 LPO 方案抢 1.6T 份额。但公司主体营收仍以 PCB 为主，光芯片业务的收入占比与纯度偏低，属传导链较远一档。</div>\n    \n    \n    <div class=\"risk\">⚠️ 主业 PCB 稀释光芯片纯度；索尔思为海外主体，受跨境政策与关税变量影响</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>无自供能力的中小光模块厂</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">光芯片涨价对纯模块代工是明确的成本冲击。采购规则已变为「先锁产能再谈价格」、头部厂商预付全款，中小模块厂既拿不到货又要承受涨价，是这场供给紧张中<strong>被牺牲的一方</strong>，不应计入受益侧。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>LED/射频纯业务公司</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">三安本次涨价涵盖 LED、射频、电力电子、光技术四类，但<strong>只有光技术芯片与 AI 光模块缺口相关</strong>；LED 与射频涨价源于银价 +170%、金价 +70% 的成本倒逼（滤波器业务上半年仍亏 1.18 亿），与 AI 算力主线无关，不应混为一谈。</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**供给硬缺口**型，上游扩产周期长（2 年+）决定缺口刚性。基准参照：2023 年光模块行情，上游芯片涨价滞后模块股 2-3 个月。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">源杰科技 ＞ 三安光电 ＞ 长光华芯。排序理由：源杰是纯正光芯片标的、弹性最纯；三安产能最大但光芯片仅占其一小部分；长光华芯以工业激光为主。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">中际旭创（情绪龙）＞ 超声电子 ＞ 三孚股份。gene：中际旭创是光模块行情的固定情绪龙头，但本轮是**上游**涨价，它的角色是下游承接方而非受益方，需注意方向。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若源杰、长光华芯、仕佳在 9 月下旬前跟随三安发布涨价函 → 逻辑状态由「单一公司涨价」升为「全行业供需格局改变」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 其他光芯片厂商跟进涨价（全行业而非单家） ② 三安 Q4 设备如期到厂、披露光技术芯片收入占比 ③ 25G+ 国产化率自 4% 开始提升。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 其他厂商明确未涨价、或涨价被下游客户拒绝 ② 三安 Q4 设备到厂延期、收入占比仍不披露 ③ 缺口被海外扩产填补。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">三安一家涨价可能只是**成本倒逼**，全行业涨价才证明供需格局真变了——这是本档最关键的分辨点。另外要警惕方向：光芯片涨价对下游光模块厂（中际旭创等）是成本压力，本轮它是情绪龙而非受益方。无自供能力的中小光模块厂已列入剔除。</div></div></div>\n\n    \n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>源杰、长光华芯、仕佳在 9 月下旬前跟随三安发布涨价函——单一公司涨价可能只是成本倒逼，全行业涨价才证明供需格局改变</b></li><li><b>三安 Q4 设备如期到厂，并在三季报/交流中披露光技术芯片收入占比或产能爬坡进度</b></li><li><b>长光华芯 200G EML 于 2026 Q3–Q4 如期量产，1.6T 交付瓶颈出现松动迹象</b></li><li><b>100G/200G EML 现货报价继续上行（100G 站稳 8 美元上方、200G 现货维持 12–15 美元溢价）</b></li><li><b>光芯片标的出现与中际旭创的<strong>相对收益收敛</strong>——即上游开始跑赢下游模块，这是资金从下游往上游迁移的客观标志</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>其他光芯片厂商明确表示未涨价、或涨价被下游客户拒绝——则三安涨价属成本倒逼而非定价权</b></li><li><b>三安 Q4 设备到厂延期，或扩产后光技术芯片收入占比仍不披露、毛利率无改善</b></li><li><b>硅光渗透率加速（800G 硅光占比已超 50%、1.6T 达 70–80%）导致 EML 缺口被绕开，EML 报价回落至 5–6 美元区间</b></li><li><b>云厂商资本开支指引下修——本档案缺口逻辑的上游需求来源消失（与 ai-compute-hike 档案交叉验证）</b></li><li><b>三安治理风险实质化：留置调查升级、股份司法处置或控制权变更，使产业逻辑无法独立定价</b></li><li><b>光芯片标的持续跑输中际旭创，且 CPO 涨停仍集中在 PCB/MLCC 擦边票——说明市场始终按题材标签而非产业链利润归属定价</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">9 月下旬–10 月</div><div class=\"wh\">源杰、长光华芯、仕佳光子是否发布涨价函</div><div class=\"wy\">区分「成本倒逼型涨价」与「供需格局型涨价」的唯一客观标志</div></div><div class=\"tkc\"><div class=\"w\">2026 Q4</div><div class=\"wh\">三安订购设备到厂与光芯片产能爬坡进度</div><div class=\"wy\">2750→4500 片/月的扩产是本档案最硬的公司层面数字，到厂即验证、延期即证伪</div></div><div class=\"tkc\"><div class=\"w\">2026 Q3–Q4</div><div class=\"wh\">长光华芯 200G EML 量产进度</div><div class=\"wy\">200G EML 是 1.6T 放量的独木桥，也是国内最硬的卡点</div></div><div class=\"tkc\"><div class=\"w\">10 月下旬</div><div class=\"wh\">三季报：源杰毛利率能否维持 75%+、三安光技术业务是否单独披露</div><div class=\"wy\">业绩环从「已分化」走向「上游兑现」的唯一检验</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">EML/CW 现货报价、200G EML 交付周期（当前约 50 周）</div><div class=\"wy\">缺口是否真的在扩大，直接决定整个逻辑链的起点成立与否</div></div></div>\n\n    <div class=\"src\">数据来源：三安光电互动平台(9/11 15:38) ｜ 财联社(9/11 16:00) ｜ 新浪财经/BT财经产业分析(9/11) ｜ 睿信咨询产业研究·高端高速光芯片缺口(2026) ｜ 2026光芯片行业深度报告·发现报告 ｜ 东方财富行情(9/11) ｜ 本工作区 out/fupan_20260911.json 盘面数据(9/11，iFinD)</div>\n    <footer>光芯片缺口扩至30%+ · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "lithium-carbonate-glut", "title": "碳酸锂失守13万", "date": "2026-09-11", "grade": "正式档", "pricing": "部分定价", "crate": "bolt", "search": "碳酸锂失守13万 9/11 lc2701 盘中最低 12.808 万元/吨（较前结算价 -9.74%，2/6 以来新低）· smm 新口径库存 16.93 万吨较旧口径跳增 9.36 万吨 · 9 月国内产量环比 +11% 至 12.85 万吨 产业周期 ⚡ 供给恢复冲击 · 上下游已排序、口径噪音未澄清", "card": "<a class=\"card-c\" href=\"#lithium-carbonate-glut\" data-search=\"碳酸锂失守13万 9/11 lc2701 盘中最低 12.808 万元/吨（较前结算价 -9.74%，2/6 以来新低）· smm 新口径库存 16.93 万吨较旧口径跳增 9.36 万吨 · 9 月国内产量环比 +11% 至 12.85 万吨 产业周期 反内卷·供给侧调控 部分定价 宁德时代 欣旺达 亿纬锂能 德方纳米 阳光电源\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-11</span>\n    <span class=\"crate bolt\">⚡ 供给恢复冲击 · 上下游已排序、口径噪音未澄清 产业周期</span>\n  </div>\n  <div class=\"ctitle\">碳酸锂失守13万</div>\n  <div class=\"csub\">9/11 LC2701 盘中最低 12.808 万元/吨（较前结算价 -9.74%，2/6 以来新低）· SMM 新口径库存 16.93 万吨较旧口径跳增 9.36 万吨 · 9 月国内产量环比 +11% 至 12.85 万吨</div>\n  <div class=\"cpos\">9/11 LC2701 盘中最低 12.808 万元/吨创 2/6 以来新低；SMM 换口径致库存跳增 9.36 万吨，口径噪音掩盖了真实去库。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">反内卷·供给侧调控</span>\n    \n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 9</span>\n    <span class=\"nm\">宁德时代</span><span class=\"nm\">欣旺达</span><span class=\"nm\">亿纬锂能</span><span class=\"nm\">德方纳米</span><span class=\"nm\">阳光电源</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-11 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-11</div>\n    <h1>碳酸锂失守13万</h1>\n    <div class=\"sub\">9/11 LC2701 盘中最低 12.808 万元/吨（较前结算价 -9.74%，2/6 以来新低）· SMM 新口径库存 16.93 万吨较旧口径跳增 9.36 万吨 · 9 月国内产量环比 +11% 至 12.85 万吨</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 供给恢复冲击 · 上下游已排序、口径噪音未澄清</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：反内卷·供给侧调控</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">storage-cell-capacity-control</span></div>\n    <div class=\"posnote\">9/11 LC2701 盘中最低 12.808 万元/吨创 2/6 以来新低；SMM 换口径致库存跳增 9.36 万吨，口径噪音掩盖了真实去库。</div>\n    <details class=\"more\"><summary>展开定价状态详版（376 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化 9/11 盘中触发（当日上证 -1.18%，普跌日，须用超额收益判断）。<strong>盘面状态</strong>：锂电链<strong>已按「上游受损、下游受益」完整排序</strong>——上游锂矿锂盐超额 -1.98~-5.85pct（中矿资源 -7.03%、藏格矿业 -5.49%）、正极超额 -1.79~-2.91pct、电芯宁德时代超额 -1.05pct，而欣旺达 +3.36%（超额 +4.54pct）、南都电源 +5.08%（超额 +6.26pct）逆势放量大涨。<strong>尚未定价的是「口径噪音」这一层</strong>：SMM 明确新旧口径不可比、新口径当周仍在去库（光大口径环比 -4912 吨）、中信测算 9 月需求增量 1.5 万吨大于供给增量 0.8-1.0 万吨。市场目前把「统计方法变更」按「实物过剩」定价。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">9 月 11 日广期所碳酸锂主力 <strong>LC2701</strong> 开盘 13.998 万元/吨，盘中最低下探 <strong>12.808 万元/吨</strong>，较前一交易日结算价 14.19 万元最大跌幅 <strong>9.74%</strong>，为 2 月 6 日以来新低、自 2 月以来首次跌破 13 万整数关口；尾盘空头减仓，收盘跌 4.99%。现货同步崩塌：MMLC 电池级碳酸锂中间价 139350 元/吨，单日跌 3500 元；上海钢联电池级现货均价 13.94 万元/吨。自 8 月末 16 万元/吨上方算起，半个月回撤<strong>超过 20%</strong>。这是近一周第二次重挫——9/4 该合约单日已跌 7.41%。</div></div><div class=\"card fact\"><b class=\"k\">触发点：库存口径变更</b><div class=\"v\">SMM 于 <strong>9 月 3 日公告、9 月 4 日 14:30 起</strong>启用新版碳酸锂周度库存统计：改为<strong>按货权归属</strong>记账，样本由「上游冶炼厂+正极厂+其他」三分类扩为「上游+正极厂+贸易+电芯厂及其他」四分类，并新增铝土渣提锂、钨矿伴生提锂、电解铝废渣提锂来源，保税区未清关货物剔除，历史数据回溯至 4 月 30 日。结果：9/4 新口径 <strong>16.93 万吨</strong>，而前一日旧口径大样本 7.57 万吨——<strong>差额 9.36 万吨</strong>；若对照市场常用的约 6.1 万吨旧口径，差额约 10.8 万吨。旧口径下多头笃信的「持续去库、现货紧缺」叙事被一次性改写。</div></div><div class=\"card fact warn\"><b class=\"k\">口径≠实物</b><div class=\"v\"><strong>SMM 自己明确说明新旧数据存在分类不可比性</strong>，并称按新框架当周库存结构是「上游冶炼厂去库、贸易商去库、电芯厂及其他去库、正极材料厂小幅累库」——即<strong>新口径下仍在去库</strong>。光大期货 9/10 日报转述：更新口径后总库存约 164435 吨、环比减少 4912 吨。<strong>天齐锂业、赣锋锂业等已公开回应从未向第三方公布过库存数据</strong>，赣锋 7/20 明确表示未与 SMM 就库存报送开展合作。彭博 9/8 另给一组对照（扩大样本后约 17.5 万吨 vs 此前 7.88 万吨）。</div></div><div class=\"card fact\"><b class=\"k\">真实供给恢复</b><div class=\"v\">抛开口径，9 月供给确有数据支撑：8 月锂辉石、锂云母及盐湖端部分产线检修，9 月陆续复产。SMM 口径本周碳酸锂<strong>开工率跳升至 52.01%（环比 +2.92pct）、总产量 26748 吨（环比 +1502 吨）</strong>，辉石工艺贡献主要增量。卓创富宝测算国内产量由 8 月 <strong>11.64 万吨 → 9 月 12.85 万吨（环比 +11%）</strong>；叠加进口，总供应由 14.29 万吨 → 15.79 万吨。海外同步改善：津巴布韦矿产营销公司数据，2026 年前 8 个月锂精矿销售 <strong>81.68 万吨、同比 +23%</strong>；泉州肖厝口岸 9/12 宣布今年锂辉石进口突破 44.71 万吨创历史新高。</div></div><div class=\"card fact warn\"><b class=\"k\">需求侧结构分化</b><div class=\"v\">需求端并非一边倒走弱，而是<strong>磷酸铁锂紧缺、三元走弱</strong>。鑫椤锂电 9 月排产：样本企业电池排产 <strong>211.3GWh（环比 +6.3%）</strong>、正极材料 24.9 万吨（环比 +5.5%），五大环节均处年内高位。市场预计 9 月储能电芯产量 <strong>94.47GWh</strong>；磷酸铁锂对应碳酸锂月度需求由 8 月 13.91 万吨升至 9 月 <strong>14.69 万吨</strong>。中信证券引大东时代：9 月全球锂电池排产环比 +9.1%，对应碳酸锂需求增量约 1.5 万吨，供应端增量 0.8-1.0 万吨，<strong>缺口仍在</strong>。反面是部分头部三元电芯厂下调 9 月及四季度订单，中高镍受影响较大；宁德时代 9 月排产下修 5% 为市场传闻，<strong>公司未确认</strong>。</div></div><div class=\"card fact\"><b class=\"k\">成本线与政策</b><div class=\"v\">行业协会人士称，上一轮下跌时<strong>外购锂矿生产碳酸锂的企业成本已在 14 万元/吨附近</strong>，已有几家工厂停产检修；价格继续下行不排除高成本产线再次减产——这是供给的自收缩机制。政策端同时在推进<strong>产能预警调控</strong>：7/20 国家能源局答复人大建议，提出会同相关部门针对动力和储能电池开展<strong>产能预警调控、规范价格竞争</strong>综合治理；4 月多部门座谈会提出压缩供应商账期；地方层面 6/16 中江县政府工作动态称工信部将牵头开展<strong>全国锂电池产能调查并建立预警机制</strong>，建议机制建立前暂停办理动力及储能锂电池项目手续。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/11（上证 -1.18%、深成 -1.08%，普跌日，须看超额）。<strong>上游锂矿锂盐</strong>：中矿资源 -7.03%（超额 -5.85pct）、藏格矿业 -5.49%、盛新锂能 -4.39%、雅化集团 -4.27%、天齐锂业 -3.78%、盐湖股份 -3.49%、赣锋锂业 -3.45%、永兴材料 -3.16%。<strong>正极</strong>：万润新能 -4.09%、湖南裕能 -3.54%、德方纳米 -3.35%、富临精工 -2.97%。<strong>电芯</strong>：宁德时代 -2.23%（超额 -1.05pct）、亿纬锂能 -2.55%、国轩高科 -1.77%、<strong>欣旺达 +3.36%（超额 +4.54pct，换手 5.56%、成交 17.14 亿）</strong>。<strong>储能</strong>：南都电源 <strong>+5.08%（超额 +6.26pct，换手 10.33%）</strong>、阳光电源 -1.78%、派能科技 -3.29%。<br><strong>纯度校验</strong>：当日「锂电池概念」涨停 4 家为风华高科（MLCC/CPO）、双星新材（BOPET 薄膜）、银河电子（军工电子）、冠盛股份（汽车零部件），「储能」11 家最高标为鼎信通讯 3 板（电力物联网/华为概念）——<strong>全部为概念擦边，真链条标的无一涨停且全线收绿</strong>。市场已按「越靠上游越受损」排序，但对「口径噪音」这一层未做区分。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-11</div><div><div class=\"x\">碳酸锂失守13万：9/11 LC2701 盘中最低 12.808 万元/吨（较前结算价 -9.74%，2/6 以来新低）· SMM 新口径</div><div class=\"y\">为什么：本档为「锂电产业链·上游定价重构」的建档时点，后续二段催化均在此之上叠加</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「供给恢复型」催化，<strong>三个要害</strong>：一是跌价的性质是<strong>叙事重构而非实物过剩</strong>——触发点是 SMM 统计口径从三分类改四分类、按货权记账，一次性把表上吨数抬高 9.36 万吨，SMM 自认新旧不可比，且新口径当周仍在去库（环比 -4912 吨），天齐、赣锋均否认向 SMM 报送过库存数据；市场却按「隐性库存远超预期」定价。二是供给恢复是真但幅度有分歧——9 月国内产量环比 +11%（11.64→12.85 万吨）有检修复产与津巴布韦 +23% 支撑，但中信测算同期需求增量 1.5 万吨大于供给增量 0.8-1.0 万吨，缺口未翻面；且外购锂矿成本线在 14 万元/吨，现价 12.8 万已跌破，供给存在自收缩机制。三是受益受损要切开——上游锂盐受损、正极两头受价、电芯与储能成本改善，9/11 盘面已完成这个排序（上游超额 -5.85pct vs 欣旺达超额 +4.54pct），<strong>链条内部的相对强弱已经走完，剩下的是叙事能否被证伪</strong>。<strong>隐藏面</strong>：政策端「产能预警调控」与锂价下行是同向的——工信部牵头全国锂电池产能调查、建议机制建立前暂停办理动力及储能锂电池项目手续，这是供给端的另一只手，与跌价形成负反馈。<br>① <strong>分水岭时点</strong>：下一期 SMM 新口径周报（是否延续环比去库）与广期所仓单（49264 手、已首次回落 533 手）能否继续下行。<br>② <strong>传导的关键约束</strong>：若宁德时代 9 月排产下修 5% 被证实或有更多电芯厂跟砍单，需求侧「缺口仍在」的测算失效，旺季成色打折。<br>③ <strong>待验证的核心变量</strong>：9 月国内碳酸锂实际产量是否兑现 12.85 万吨，以及津巴布韦锂精矿到港量。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>9/11 LC2701 盘中 -9.74% 至 12.808 万元/吨，破 13 万，2/6 以来新低</li><li>现货电池级同步跌 3500 元/吨，期现同跌非单边期货行为</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">分化</span><ul><li>新口径库存 16.93 万吨，较旧口径 7.57 万吨跳增 9.36 万吨</li><li>但 SMM 自认不可比、新口径仍在去库，天齐赣锋否认报送数据</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">分化</span><ul><li>上游锂盐售价下行、外购矿产线成本线 14 万元已被跌破</li><li>电芯与储能端原材料成本改善，但需排产不下修才成立</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">已排序</span><ul><li>9/11 上游超额 -1.98~-5.85pct、电芯宁德超额 -1.05pct</li><li>欣旺达超额 +4.54pct、南都电源超额 +6.26pct，成本受益已定价</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响分化（口径噪音未澄清）、业绩上下游反向、股价已完成上下游排序——传导链成立但中间一环待证伪。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>65%</strong>：「影响」环最弱——触发价跌的核心是统计方法变更，而非实物供需翻面；「业绩」环上下游标的方向相反，需要分开算账。</li><li><strong>边界要切开</strong>：受益的是<strong>不持有上游权益、纯买碳酸锂的电芯与储能环节</strong>（成本改善 100% 落到毛利）；受损的是<strong>上游锂矿锂盐</strong>（主产品售价下行，外购矿冶炼成本线 14 万元/吨已被跌破）与<strong>正极材料</strong>（加工费模式，原料跌价带来存货跌价损失，售价随原料下调，两头受价）。</li><li><strong>主线联动</strong>：与 <strong>storage-cell-capacity-control</strong>（储能电芯产能摸底）同属「锂电产业链」主线——该档案讲的是供给侧产能治理，本档案讲的是原材料价格：碳酸锂降价抬高储能电芯经济性，反过来会削弱「产能过剩需治理」的紧迫性，两者互为印证也互为牵制。与 <strong>phosphate-export</strong>（磷肥出口解禁）通过磷酸铁锂相连：本档案中 LFP 排产维持紧缺、磷酸铁价格持续上涨，正是磷化工向新能源延伸那一端的下游需求验证。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·成本改善受益 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>宁德时代</b><span class=\"code\">300750</span><span class=\"tag\">最大单一买家·9/11 超额 -1.05pct</span><span class=\"cap\">305.48 元 · 流通 1.30 万亿 · 9/16 -3.44%</span></div>\n    <div class=\"logic\">电芯龙头·采购议价力最强</div>\n    <div class=\"detail\">碳酸锂最大单一买家，锂盐是正极成本占比最高项，锂价回落对其是纯粹的成本改善。9 月全球排产环比 +9.1% 提供需求托底。9/11 超额 -1.05pct，是链中最抗跌环节之一。</div>\n    \n    \n    <div class=\"risk\">⚠️ 排产下修 5% 传闻未证实</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>欣旺达</b><span class=\"code\">300207</span><span class=\"tag\">无上游权益·9/11 逆势 +3.36%</span><span class=\"cap\">19.81 元 · 流通 340 亿 · 9/16 +11.67%</span></div>\n    <div class=\"logic\">纯成本受益方·放量上涨</div>\n    <div class=\"detail\">不持有锂矿锂盐权益，锂价下跌是单向成本改善。9/11 全链下杀中唯一放量大涨的电芯标的，换手 5.56%、成交 17.14 亿，超额 +4.54pct。</div>\n    \n    \n    <div class=\"risk\">⚠️ 消费电子占比高，弹性被稀释</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>亿纬锂能</b><span class=\"code\">300014</span><span class=\"tag\">储能电芯弹性·9/11 -2.55%</span><span class=\"cap\">48.66 元 · 流通 1028 亿 · 9/16 +0.62%</span></div>\n    <div class=\"logic\">动力+储能双轮</div>\n    <div class=\"detail\">储能电芯出货居前，项目 IRR 对电芯成本高度敏感，锂价回落直接抬升储能装机经济性，9 月储能电芯预计 94.47GWh 正处放量期。</div>\n    \n    \n    <div class=\"risk\">⚠️ 参股锂盐权益随锂价回落压缩收益</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>德方纳米</b><span class=\"code\">300769</span><span class=\"tag\">LFP 正极·加工费与跌价两头受价</span><span class=\"cap\">41.55 元 · 流通 105 亿 · 9/16 +0.68%</span></div>\n    <div class=\"logic\">9/11 -3.35%·磷酸铁锂仍紧缺</div>\n    <div class=\"detail\">磷酸铁锂正极龙头，本轮位置最微妙：一方面 LFP 排产紧缺、磷酸铁价格持续上涨意味着加工费有支撑；另一方面原料跌价带来存货跌价损失、正极售价随原料下调。方向取决于加工费能否扩张盖过跌价损失。</div>\n    \n    \n    <div class=\"risk\">⚠️ 存货跌价损失与售价下调可能盖过加工费改善</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>阳光电源</b><span class=\"code\">300274</span><span class=\"tag\">储能系统·传导链长一环</span><span class=\"cap\">85.18 元 · 流通 1352 亿 · 9/16 +0.95%</span></div>\n    <div class=\"logic\">9/11 -1.78%</div>\n    <div class=\"detail\">储能系统集成商外采电芯，锂价下行经电芯报价传导至系统成本、抬高装机 IRR。传导链比电芯厂长一环，弹性更温和。</div>\n    \n    \n    <div class=\"risk\">⚠️ 电芯报价下调能否传导至系统端取决于议价格局</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>国轩高科</b><span class=\"code\">002074</span><span class=\"tag\">二线电芯·自有锂云母对冲</span><span class=\"cap\">26.14 元 · 流通 454 亿 · 9/16 +2.87%</span></div>\n    <div class=\"logic\">9/11 -1.77%·跌幅最小一档</div>\n    <div class=\"detail\">二线动力电芯厂，成本受益被自有锂云母资源收益缩水部分对冲，纯度不如纯电芯厂。</div>\n    \n    \n    <div class=\"risk\">⚠️ 自有资源抵消部分成本弹性</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>南都电源</b><span class=\"code\">300068</span><span class=\"tag\">9/11 +5.08%·换手 10.33%</span><span class=\"cap\">4.42 元 · 流通 38 亿 · 9/16 -0.45%</span></div>\n    <div class=\"logic\">储能小盘·全链涨幅最高</div>\n    <div class=\"detail\">9/11 锂电链涨幅最高的标的，换手放大到 10.33%，是「锂价跌→储能经济性提升」这条线在情绪端的表达。但公司主业含铅酸与锂电储能、业务不纯，涨幅更多反映题材弹性而非业绩弹性。</div>\n    <div class=\"gene\">🧬 题材基因：储能板块老牌弹性票，历次储能行情中承担放量先锋角色，2023 年钠电/储能行情中曾有连板记录</div>\n    \n    <div class=\"risk\">⚠️ 业务含铅酸，锂电纯度不足；涨幅已反映预期</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>科陆电子</b><span class=\"code\">002121</span><span class=\"tag\">储能集成小盘</span><span class=\"cap\">4.86 元 · 流通 69 亿 · 9/16 +1.04%</span></div>\n    <div class=\"logic\">9/11 -1.57%</div>\n    <div class=\"detail\">储能系统集成小盘标的，跟随储能链成本改善逻辑，市值小弹性大但业绩体量有限。</div>\n    <div class=\"gene\">🧬 题材基因：智能电表起家的储能配套票，历次储能题材中属跟随型弹性品种</div>\n    \n    <div class=\"risk\">⚠️ 业绩体量小，题材属性强于业绩属性</div>\n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>鼎信通讯</b><span class=\"code\">603421</span><span class=\"tag\">9/11 储能题材 3 板最高标</span><span class=\"cap\">7.28 元 · 流通 47 亿 · 9/16 -3.96%</span></div>\n    <div class=\"logic\">题材最高标但主业不纯</div>\n    <div class=\"detail\">9/11 储能题材 11 家中最高标（3 板），是当日储能情绪的风向标。但它的主业是电力物联网与载波通信、叠加华为概念，与碳酸锂价格没有任何传导关系——它代表的是储能题材的情绪高度，不是锂价下跌的受益方。</div>\n    <div class=\"gene\">🧬 题材基因：电力物联网+华为概念的低价小盘，历次智能电网/电力信息化行情中的连板常客</div>\n    \n    <div class=\"risk\">⚠️ 与锂价逻辑无关，情绪退潮时回落幅度同样大</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2022 年 11 月碳酸锂见顶 60 万元/吨后一路回落至 2023 年 4 月跌破 20 万元：期间天齐锂业、赣锋锂业最大回撤超 50%，而宁德时代、亿纬锂能等电芯环节走出相对收益——「上游受损、下游受益」的排序在该轮已完整演绎过一次。</li><li>2024 年 3 月碳酸锂反弹至 12 万元/吨上方：外购矿产线复产推动供给快速回归，价格冲高回落，验证高成本产能的复产弹性是本品种供给端的核心变量。</li><li>2025 年 8-9 月「反内卷」行情：锂电产业链受产能治理政策预期驱动整体走强，但涨幅集中在中小弹性票，龙头宁德时代相对滞涨——与本轮 9/11 的链内分化结构相似。</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>宁德时代</b><span class=\"code\">300750</span><span class=\"tag\">最大单一买家·成本改善最直接</span></div>\n    <div class=\"logic\">全球动力与储能电芯龙头 | 锂盐是正极成本占比最高项，采购规模决定议价力 | 排产下修传闻未证实</div>\n    <div class=\"detail\">全球动力与储能电芯龙头，也是碳酸锂最大的单一买家——锂盐是正极成本中占比最高的一项，锂价自 8 月末 16 万元/吨回落至 12.8 万元/吨，对它是纯粹的原材料成本改善。9 月全球锂电排产环比 +9.1%、储能电芯 94.47GWh，需求端提供托底，成本降与需求旺同时发生。9/11 它仅跌 2.23%（超额 -1.05pct），是锂电链中最抗跌的环节之一，说明资金已按成本受益定价。约束在于市场流传其 9 月排产下修 5%，公司未确认——若坐实，需求侧逻辑同步受损。</div>\n    \n    <div class=\"confirm\">✔ 确认：9 月排产传闻被公司澄清或实际出货数据证伪 / 电芯报价未随锂价同步下调，毛利扩张</div>\n    <div class=\"risk\">⚠️ 排产下修 5% 若被证实，成本改善会被量的下滑抵消</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>欣旺达</b><span class=\"code\">300207</span><span class=\"tag\">无上游权益的纯成本受益方·9/11 逆势 +3.36%</span></div>\n    <div class=\"logic\">消费电芯起家、动力储能放量 | 不持有锂矿锂盐权益，只享成本下降 | 消费电子占比仍高</div>\n    <div class=\"detail\">消费电芯起家、动力与储能电芯放量中的二线电池厂，关键差异在于它<strong>不持有锂矿与锂盐权益</strong>——锂价下跌对它是单向的成本改善，不承担上游权益收益同步缩水的对冲。9/11 锂电链全线下杀时它逆势收涨 3.36%（超额 +4.54pct），换手放大至 5.56%、成交 17.14 亿，是全链条唯一放量大涨的电芯标的，说明资金已在按「纯成本受益方」这条线做区分。约束是消费电子业务占比仍高，动力与储能的盈利质量尚待验证。</div>\n    \n    <div class=\"confirm\">✔ 确认：动力/储能电芯毛利率环比提升 / 后续交易日超额收益延续</div>\n    <div class=\"risk\">⚠️ 消费电子业务占比高，会稀释锂价下行的业绩弹性</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>亿纬锂能</b><span class=\"code\">300014</span><span class=\"tag\">储能电芯弹性·市值体量小于宁德</span></div>\n    <div class=\"logic\">动力+储能双轮，储能出货居前 | 储能项目 IRR 对电芯成本高度敏感 | 早年参股向上游锂盐延伸</div>\n    <div class=\"detail\">动力与储能电芯双轮驱动，储能电芯出货位居行业前列，是锂价下行在需求端最直接的承接方——储能项目 IRR 对电芯成本高度敏感，锂价回落直接抬升储能装机经济性，而 9 月储能电芯产量预计 94.47GWh 正处于放量期。相比宁德，它的市值体量更小，成本改善对利润率的边际拉动更明显。9/11 跌 2.55%，跌幅落在上游（-3.16%~-7.03%）与宁德（-2.23%）之间。约束是公司早年通过参股向上游锂盐环节做过延伸，这部分权益收益会随锂价回落而压缩。</div>\n    \n    <div class=\"confirm\">✔ 确认：储能电芯出货与毛利率同步改善 / 储能系统集成订单价格未同步下调</div>\n    <div class=\"risk\">⚠️ 参股锂盐权益随锂价回落压缩投资收益，弹性不如纯电芯厂干净</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>阳光电源</b><span class=\"code\">300274</span><span class=\"tag\">储能系统集成·电芯成本下降抬升装机经济性</span></div>\n    <div class=\"logic\">逆变器与储能系统龙头，电芯外采成本下降 → 系统 IRR 提升 → 装机需求</div>\n    <div class=\"detail\">处于电芯的下游——储能系统集成商外采电芯，锂价下行通过电芯报价传导到系统成本，进而抬高储能项目的内部收益率与装机意愿。传导链比电芯厂长一环，弹性也更温和。9/11 跌 1.78%，在锂电链中属于偏抗跌的一端。</div>\n    \n    \n    <div class=\"risk\">⚠️ 传导链较长，电芯报价下调能否传导至系统端取决于议价格局</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>国轩高科</b><span class=\"code\">002074</span><span class=\"tag\">二线电芯·有锂云母资源，纯度打折</span></div>\n    <div class=\"logic\">动力电芯二线厂商，同时布局上游锂云母资源，成本受益被部分对冲</div>\n    <div class=\"detail\">二线动力电芯厂，本轮锂价下跌对它是双向的：电芯端成本改善，但自身布局的锂云母资源收益同步缩水，纯度不如纯电芯厂。9/11 跌 1.77%，是锂电链中跌幅最小的一档，反映市场对其资源端的对冲已有认知。</div>\n    \n    \n    <div class=\"risk\">⚠️ 自有锂云母资源会抵消部分成本改善的弹性</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>上游锂矿锂盐</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">天齐锂业 -3.78%、赣锋锂业 -3.45%、中矿资源 -7.03%、藏格矿业 -5.49%、盛新锂能 -4.39%、雅化集团 -4.27%、盐湖股份 -3.49%、永兴材料 -3.16%。碳酸锂是其主产品，售价下行直接压缩收入；外购锂矿的冶炼产线成本线在 14 万元/吨附近，现价 12.8 万已跌破。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>9/11 锂电池概念涨停 4 家</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">风华高科（主业 MLCC/CPO）、双星新材（BOPET 薄膜）、银河电子（军工电子）、冠盛股份（汽车零部件）——当日「锂电池概念」涨停 4 家全部为此类擦边票，与碳酸锂价格无实质传导关系。真链条标的当日无一涨停且全线收绿。</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**供给恢复冲击**型：上游让利、中游受益，本质是利润在链内重新分配。基准参照：2023 年碳酸锂从 60 万跌至 20 万期间，电池厂毛利率扩张 3-5pct。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">宁德时代 ＞ 亿纬锂能 ＞ 欣旺达。排序理由：电芯自供比例高、采购规模大者成本改善幅度最大；宁德另有规模议价权。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">南都电源 ＞ 科陆电子 ＞ 鼎信通讯（情绪龙）。gene：储能小盘票在锂价下跌行情中反复被资金用作「成本改善」叙事的情绪载体。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若 SMM 新口径周报延续环比去库**且**广期所仓单继续回落、现货基差重新走强 → 逻辑状态由「口径噪音待澄清」升为「真实去库+成本改善」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 新口径周报延续去库（对照 9/10 的 164435 吨、环比 -4912 吨） ② 仓单自 49264 手继续回落 ③ 电池厂三季报毛利率环比扩张。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 新口径转为连续累库、仓单重新站上 5 万手 ② 电池级现货连续跟跌、基差转负 ③ 电池厂毛利率未改善（让利未兑现）。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">SMM 9/11 换口径导致库存跳增 9.36 万吨——这个数字**不是**累库，是统计范围变了。若把它读成「需求崩塌」就完全错了。真正的观察点是同口径下的环比方向与仓单变化。另外要分清「锂价跌 = 上游利空」与「锂价跌 = 中游利好」是同一件事的两面，本档主攻已按受益方排序。</div></div></div>\n\n    \n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>下一期 SMM 新口径周报延续环比去库（对照 9/10 光大口径 164435 吨、环比 -4912 吨）</b></li><li><b>广期所碳酸锂仓单自 49264 手继续回落，且现货基差重新走强</b></li><li><b>9 月国内碳酸锂实际产量低于 12.85 万吨的卖方预期，或津巴布韦锂精矿到港量不及预期</b></li><li><b>宁德时代 9 月排产下修 5% 被公司澄清，或头部三元电芯厂订单下调未扩散</b></li><li><b>现货电池级碳酸锂止跌回升至 14 万元/吨上方</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>新口径周报转为连续累库，且仓单重新站上 5 万手以上</b></li><li><b>电池级现货连续多个工作日跟跌，基差转负</b></li><li><b>宁德时代 9 月排产下修 5% 被官方或多方产业链信源坐实，且更多电芯厂跟进砍单</b></li><li><b>9 月国内产量兑现 12.85 万吨（环比 +11%）且进口超预期，总供应 15.79 万吨落地</b></li><li><b>SMM 公布可并表的旧口径对照表，或被要求披露方法论，市场重新把 10 万吨跳增认定为一次性噪音（此情形下本档案的「供给过剩」叙事被证伪，方向对上游反而有利）</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">每周四前后</div><div class=\"wh\">SMM 新口径碳酸锂周度库存（重点看环比方向与四分类结构）</div><div class=\"wy\">区分「口径噪音」与「实物过剩」的唯一连续观测窗</div></div><div class=\"tkc\"><div class=\"w\">每日</div><div class=\"wh\">广期所碳酸锂注册仓单数量（当前 49264 手，已首次回落 533 手）</div><div class=\"wy\">仓单是交割压力的直接刻度，停止流入即为现货托底信号</div></div><div class=\"tkc\"><div class=\"w\">10 月上旬</div><div class=\"wh\">9 月国内碳酸锂实际产量与津巴布韦锂精矿到港量</div><div class=\"wy\">供给恢复 +11% 的预期是否兑现，是「影响」环能否闭合的关键</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">宁德时代及头部三元电芯厂 9 月排产是否下修</div><div class=\"wy\">需求侧「缺口仍在」的测算建立在排产不塌的前提上</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">工信部全国锂电池产能调查与预警机制落地进展</div><div class=\"wy\">与 storage-cell-capacity-control 档案交叉验证，供给端另一只手</div></div></div>\n\n    <div class=\"src\">数据来源：SMM 9/3 库存统计口径调整公告 ｜ 每日经济新闻 9/11-9/12 采访（SMM/卓创富宝/鑫椤锂电数据）｜ 光大期货 9/10-9/11 热点追踪 ｜ 新湖期货 9/7 周报 ｜ 中信证券（引大东时代智库 9 月全球排产）｜ 澎湃新闻 9/11 ｜ 国家能源局 7/20 人大建议答复 ｜ 中江县政府 6/16 工作动态 ｜ 东财 7×24 快讯 9/11-9/13 ｜ 东财行情 9/11</div>\n    <footer>碳酸锂失守13万 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "sugar-el-nino", "title": "国际糖价创一年新高", "date": "2026-09-11", "grade": "正式档", "pricing": "部分定价", "crate": "bolt", "search": "国际糖价创一年新高 ice 原糖 14.66 → 19.69 美分/磅(+34%) · 泰国新榨季或跌破 1000 万吨(-20%) · 国内郑糖仅 +7% 产业周期 ⚡ 供给冲击型 · 内外背离极大、a股同类杀跌未定价", "card": "<a class=\"card-c\" href=\"#sugar-el-nino\" data-search=\"国际糖价创一年新高 ice 原糖 14.66 → 19.69 美分/磅(+34%) · 泰国新榨季或跌破 1000 万吨(-20%) · 国内郑糖仅 +7% 产业周期 农业·粮食与化肥 部分定价 三元生物 粤桂股份 中粮糖业 华康股份 华资实业\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-11</span>\n    <span class=\"crate bolt\">⚡ 供给冲击型 · 内外背离极大、A股同类杀跌未定价 产业周期</span>\n  </div>\n  <div class=\"ctitle\">国际糖价创一年新高</div>\n  <div class=\"csub\">ICE 原糖 14.66 → 19.69 美分/磅(+34%) · 泰国新榨季或跌破 1000 万吨(-20%) · 国内郑糖仅 +7%</div>\n  <div class=\"cpos\">ICE 原糖 14.66→19.69 美分/磅（+34%）创一年新高，泰国新榨季或跌破 1000 万吨（-20%）；国内郑糖仅 +7%，内外背离极大。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">农业·粮食与化肥</span>\n    \n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 9</span>\n    <span class=\"nm\">三元生物</span><span class=\"nm\">粤桂股份</span><span class=\"nm\">中粮糖业</span><span class=\"nm\">华康股份</span><span class=\"nm\">华资实业</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-11 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-11</div>\n    <h1>国际糖价创一年新高</h1>\n    <div class=\"sub\">ICE 原糖 14.66 → 19.69 美分/磅(+34%) · 泰国新榨季或跌破 1000 万吨(-20%) · 国内郑糖仅 +7%</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 供给冲击型 · 内外背离极大、A股同类杀跌未定价</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：农业·粮食与化肥</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">grain-price-record</span><span class=\"tag\" style=\"margin-right:4px\">phosphate-export</span></div>\n    <div class=\"posnote\">ICE 原糖 14.66→19.69 美分/磅（+34%）创一年新高，泰国新榨季或跌破 1000 万吨（-20%）；国内郑糖仅 +7%，内外背离极大。</div>\n    <details class=\"more\"><summary>展开定价状态详版（399 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化为<strong>海外商品价格 + 盘后媒体发酵</strong>：ICE 原糖 9/10 收 19.69 美分/磅创一年多新高，第一财经、上海证券报等 9/11 盘中密集解读。<strong>盘面状态</strong>：9/11 制糖与代糖链<strong>全线重挫</strong>——中粮糖业 -9.03%(32.1 亿)、中粮科技 -9.54%、亚盛集团 -9.90% 跌停、红棉股份 -10.09% 跌停(换手 19.86%)、*ST广糖 -7.57%、三元生物 -6.15%、粤桂股份 -5.63%、华康股份 -4.52%。国际糖价一个多月涨 25%~34%，A 股同类当日却在<strong>跌停端</strong>，这是本档案最大的预期差来源。此前 5 个交易日红棉股份曾 +20%、中粮糖业与*ST广糖 +7%，属「已炒过一波后退潮兑现」，故定价状态为部分定价而非完全未定价。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">ICE 原糖 11 号主力 8 月初 14.65~14.66 美分/磅 → 9/9 结算 18.4 美分/磅（+25%）→ 9/10 升至 <strong>19.69 美分/磅（+34%）</strong>，创一年多新高；8 月单月涨 22%，为 <strong>2010 年以来最大月涨幅</strong>。同期国内郑糖 SR2701 主力 8 月初 5053 元/吨 → 9/10 收 5449 元/吨，<strong>仅涨 7%</strong>；广西制糖集团现货报价 5220 元/吨。</div></div><div class=\"card fact\"><b class=\"k\">供给端：三大产区同步减产</b><div class=\"v\">驱动来自厄尔尼诺下的气候冲击，<strong>非单一产区扰动</strong>。泰国（全球第二大出口国）糖业组织预计 2026/27 榨季减产 20%、产量跌破 1000 万吨（上榨季 1200 万吨），USDA 5 月预测 950 万吨（-15.6%）；印度新闻信息局 8/26 公告 2025/26 产量约 3060 万吨，较初期预估 3430 万吨下修 10.8%，国内糖价 7-8 月已涨 15%；欧盟 7 月报告预计 2026/27 产量 1410 万吨，同比减少 250 万吨（-15%）。中信期货吴静雯测算三地合计减产约 <strong>550~600 万吨</strong>。</div></div><div class=\"card fact\"><b class=\"k\">政策放大器</b><div class=\"v\">印度此前已发布<strong>禁止原糖与白糖出口</strong>的禁令，持续至 <strong>2026 年 9 月 30 日</strong>，同时开放一定额度零关税原糖进口——一个消费大国既限制出口又放开进口，等于同时从两端抽紧全球贸易流。巴西 Conab 预计 2026/27 糖产量 -2.9% 至 4290 万吨，截至 7/1 制糖比降至 42.5%、累计产糖同比 -12.4%，中南部产糖量预计 -4.2%；中东地缘冲突推升油价，促使更多巴西甘蔗转向乙醇生产。</div></div><div class=\"card fact\"><b class=\"k\">平衡表反转与资金拥挤</b><div class=\"v\">国际糖业组织 ISO 将 2026/27 榨季供需由<strong>过剩预估下调至小幅缺口约 26 万吨</strong>（另一口径 20~30 万吨）——这是平衡表性质的反转。CFTC 非商业净多持仓连续三周累积：8/18 约 7.77 万手 → 8/25 约 10.40 万手 → 9/1 约 13.25 万手，管理基金净多头寸明显抬升，<strong>头寸已显拥挤、对利空敏感度上升</strong>；印度进口平价天花板约 19 美分构成上方约束。</div></div><div class=\"card fact\"><b class=\"k\">国内为何慢半拍</b><div class=\"v\">内外背离的根源是<strong>国内高库存 + 增产周期</strong>。截至 7 月末全国工业库存 372 万吨（同比 +211 万吨、+131%），广西 221.34 万吨创 11 年高位；8 月底全国工业库存约 210 万吨，远高于去年同期 116 万吨。农业农村部预警专家委员会 8 月预测 2026/27 国内产量 1293 万吨（仅较上年减 2 万吨），主流预估 1300~1350 万吨；进口依存度已降至约 13%~1/3（2025/26 消费 1570 万吨、进口 500 万吨），配额外进口受配额约束，传导表现为「底部支撑」而非实时联动。</div></div><div class=\"card fact\"><b class=\"k\">成本倒挂：真实的胜负手</b><div class=\"v\">制糖成本结构中<strong>甘蔗原料占七成以上</strong>，广西制糖成本约 <strong>5300~5400 元/吨</strong>，而 9/10 广西现货报价仅 <strong>5220 元/吨</strong>——<strong>全行业已在成本线下方运行</strong>。这意味着国内糖价上行的第一程是「修复倒挂」而非「增厚利润」，弹性兑现滞后于价格。北方甜菜糖另有一层减产：内蒙古种植面积由 196 万亩降至 130~140 万亩（-26%），产量 50~55 万吨（上年 68.48 万吨，-20%~27%），但体量小难改全国丰产格局。</div></div><div class=\"card fact warn\"><b class=\"k\">争议点</b><div class=\"v\"><strong>减产目前仍是预期，尚未转化为实际产量数据。</strong>泰国、印度的干旱减产停留在预期层面；2026/27 榨季巴西甘蔗总产量或同比增加，有望部分填补缺口。国内 8 月销量高增也存在口径问题——云南 8 月单月销糖 44.19 万吨约为历史同期均值 3 倍，中信建投期货陈家谊指出这是「以价换量」与时间错配（云南 6/27 才收榨、同比延后 36 天），<strong>销量虚高不等于消费跃升</strong>；糖浆、预拌粉等替代糖源持续挤占工业需求（北方果葡糖浆截至 8 月中提货 262.85 万吨、同比 +6.6%）。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/11 制糖与代糖链<strong>集体杀跌</strong>：中粮糖业 -9.03%（成交 32.1 亿、换手 9.07%）、中粮科技 -9.54%（换手 12.00%、量比 2.18）、亚盛集团 -9.90% 跌停、红棉股份 -10.09% 跌停（换手 19.86%、量比 1.97）、*ST广糖 -7.57%、三元生物 -6.15%、粤桂股份 -5.63%（换手 10.16%）、华康股份 -4.52%。<strong>国际糖价创一年新高当日，A 股同类却集中在跌停端</strong>——前期 5 日涨幅（红棉 +20%、中粮糖业与*ST广糖 +7%）在退潮期被一次性兑现。按口径剔除 ST 后可见：本轮上涨由题材小票主导，正统制糖标的未形成趋势性定价，内外盘背离处于极值。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-11</div><div><div class=\"x\">国际糖价创一年新高：ICE 原糖 14.66 → 19.69 美分/磅(+34%) · 泰国新榨季或跌破 1000 万吨(-20%) · 国</div><div class=\"y\">为什么：本档为「气候+粮食」的建档时点，后续二段催化均在此之上叠加</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「气候型供给冲击」催化，<strong>三个要害</strong>：一是<strong>供给收缩是预期而非事实</strong>——泰国跌破 1000 万吨、欧盟减产 250 万吨都还是预估，10 月泰国开榨、印度产量落地才是把预期转成数据的节点，在此之前定价可以随时回摆；二是<strong>内外价差不等于国内利润</strong>——210 万吨高库存压着郑糖只跟涨 7%，而广西现货 5220 元/吨已跌破 5300~5400 元/吨的制糖成本线，价格上行的第一程是修复倒挂、不是增厚业绩；三是<strong>受益方与直觉相反</strong>——进口加工型企业在国际糖价上行时先承担采购成本上升，而制糖企业被高库存锁住售价，真正干净的映射其实是代糖的替代需求。<strong>隐藏面</strong>：市场普遍按「国际糖价涨 → 糖企赚钱」的直觉线性外推，但国内糖企当前是「成本高 + 售价低 + 库存高」的三重挤压，弹性释放的钥匙不在国际 K 线，而在国内库存去化与成本倒挂修复，这两者都取决于新榨季国内产量是否被气候下修。<br>① <strong>分水岭时点</strong>：10 月泰国新榨季开榨实际产量 + 9/30 印度出口禁令到期后的政策走向，两个节点决定全球缺口是坐实还是回补。<br>② <strong>传导的关键约束</strong>：国内 210 万吨工业库存与 5300~5400 元/吨成本线的剪刀差——库存不去化、售价不回到成本线上方，国际涨幅无法转化为国内报表。<br>③ <strong>待验证的核心变量</strong>：广西南宁现货能否回升至 5400 元/吨上方并站稳，这是成本倒挂修复、弹性开始释放的客观标志。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>ICE 原糖 14.66 → 19.69 美分/磅（+34%）创一年多新高，8 月单月涨 22%</li><li>泰国/印度/欧盟三大产区同步释放减产预期，非单一扰动</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强但受阻</span><ul><li>ISO 将 2026/27 由过剩下调至缺口约 26 万吨，平衡表性质反转</li><li>但国内 372 万吨工业库存（同比 +131%）把传导压成「底部支撑」，郑糖仅跟涨 7%</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">倒挂未修复</span><ul><li>广西现货 5220 元/吨 < 制糖成本 5300~5400 元/吨，全行业在成本线下方运行</li><li>甘蔗原料占成本七成以上，进口型糖企反而先承担国际采购成本上升</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">炒作后退潮</span><ul><li>红棉股份近 5 日曾 +20%、中粮糖业与*ST广糖 +7%，已炒过一波</li><li>9/11 全链杀跌，红棉与亚盛集团跌停，资金在退潮期一次性兑现</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强但被高库存阻断、业绩仍在成本倒挂中、股价炒作后退潮——四环中「业绩」环未闭合，是典型的「商品先行、权益未跟」结构。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>60%</strong>：变化环与影响环扎实，但「业绩」环被国内成本倒挂卡死，「股价」环刚经历退潮兑现，尚未形成趋势定价。</li><li><strong>边界要切开</strong>：受益的是<strong>代糖替代环节</strong>（糖价上行打开配方切换的性价比窗口，且不受国内高库存压制）与<strong>拥有自有甘蔗/甜菜基地、成本锁在国内的制糖企业</strong>；受损或不受益的是<strong>纯进口加工型糖企</strong>（国际涨价即采购成本上升，而国内售价被库存锁死，双向挤压）以及<strong>下游食品饮料、烘焙</strong>（原料成本上升方）。按选股口径，ST 标的（*ST广糖）已剔除，其涨幅不计入主线验证。</li><li><strong>主线联动</strong>：与 grain-price-record（全球粮价）档案同属<strong>「气候+粮食」主线</strong>——同一轮厄尔尼诺同时扰动小麦、玉米与食糖，粮价与糖价互为印证；与 phosphate-export（化肥涨价）档案构成农业投入品—产成品的上下游关系，化肥成本上抬会进一步抬升甘蔗种植成本、加固糖价底部。若厄尔尼诺强度在秋冬减弱、巴西增产兑现，本档案的「供给收缩」环与上述两份档案同时走弱，需交叉验证。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>三元生物</b><span class=\"code\">301206</span><span class=\"tag\">全球赤藓糖醇龙头</span><span class=\"cap\">23.18 元 · 流通 30 亿 · 9/16 -0.13%</span></div>\n    <div class=\"logic\">代糖替代·不受高库存压制</div>\n    <div class=\"detail\">全球赤藓糖醇产能最大，是本链条上唯一不受国内 210 万吨工业库存压制的标的。弹性来自赤藓糖醇与蔗糖的性价比剪刀差，钥匙是国内糖价向上突破 5300~5400 元/吨成本线。9/11 跌 6.15%、换手 8.01%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 替代需求受下游景气度约束</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>粤桂股份</b><span class=\"code\">000833</span><span class=\"tag\">成本锁在国内</span><span class=\"cap\">19.86 元 · 流通 90 亿 · 9/16 -0.05%</span></div>\n    <div class=\"logic\">自有甘蔗基地·不依赖进口</div>\n    <div class=\"detail\">原料来自广西自有与合作基地，国际原糖涨价对其不是成本压力而是售价改善，是少数免受进口反噬的制糖标的。兼有硫铁矿业务，可与化肥链交叉验证。9/11 跌 5.63%、换手 10.16%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 国内丰产预期下售价弹性受限</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中粮糖业</b><span class=\"code\">600737</span><span class=\"tag\">龙头但双面敞口</span><span class=\"cap\">14.28 元 · 流通 305 亿 · 9/16 -0.70%</span></div>\n    <div class=\"logic\">买全球·库存受益与成本承压并存</div>\n    <div class=\"detail\">国内糖业龙头，全球采购决定其对国际糖价是双向敞口：库存重估受益、采购成本承压。作为国内糖价 beta 的最大载体，一旦成本倒挂修复其绝对弹性最大，但当前是链上逻辑纯度最低的一只。9/11 跌 9.03%、成交 32.1 亿。</div>\n    \n    \n    <div class=\"risk\">⚠️ 国际涨价先体现为成本压力</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>华康股份</b><span class=\"code\">605077</span><span class=\"tag\">代糖第二梯队</span><span class=\"cap\">11.30 元 · 流通 34 亿 · 9/16 -0.79%</span></div>\n    <div class=\"logic\">功能糖·纯度次于三元</div>\n    <div class=\"detail\">木糖醇等功能糖生产商，与三元生物同源但代糖纯度略低，属逻辑成立时的跟随品种。9/11 跌 4.52%、换手 10.12%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 业务结构稀释代糖弹性</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>华资实业</b><span class=\"code\">600191</span><span class=\"tag\">甜菜糖·减产已落地</span><span class=\"cap\">9.58 元 · 流通 46 亿 · 9/16 +0.31%</span></div>\n    <div class=\"logic\">内蒙古面积 -26% 非预期</div>\n    <div class=\"detail\">北方甜菜糖上市平台，内蒙古面积与产量下降是已落地事实而非预期，确定性高于泰国口径，但体量仅占全国 4%，属结构性小机会。9/11 跌 4.64%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 体量小，难改全国平衡表</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中粮科技</b><span class=\"code\">000930</span><span class=\"tag\">淀粉糖替代线</span><span class=\"cap\">5.01 元 · 流通 93 亿 · 9/16 +0.80%</span></div>\n    <div class=\"logic\">玉米深加·双变量结构</div>\n    <div class=\"detail\">淀粉糖对蔗糖的工业替代受益方，但同时承担玉米原料成本，是替代需求上行与原料成本波动的双变量结构。9/11 跌 9.54%、换手 12.00%、量比 2.18。</div>\n    <div class=\"gene\">🧬 题材基因：中粮系农业加工平台，历次农产品涨价行情中的跟随活跃股，2019 年玉米涨价行情中曾连续放量</div>\n    \n    <div class=\"risk\">⚠️ 玉米原料端波动抵消替代收益</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>甘化科工</b><span class=\"code\">000576</span><span class=\"tag\">记忆映射老票</span><span class=\"cap\">8.21 元 · 流通 36 亿 · 9/16 +2.24%</span></div>\n    <div class=\"logic\">业务已多元化·纯度低</div>\n    <div class=\"detail\">原广东甘化，食糖业务占比有限，更多以历史记忆映射方式被资金选择。9/11 逆势涨 0.82%，是当日制糖链少数翻红标的。</div>\n    <div class=\"gene\">🧬 题材基因：老牌糖业股，历史上多次因糖价与军工双概念被资金反复炒作，属典型记忆票</div>\n    \n    <div class=\"risk\">⚠️ 业务多元化稀释食糖弹性</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>亚盛集团</b><span class=\"code\">600108</span><span class=\"tag\">农业种植·边缘映射</span><span class=\"cap\">3.96 元 · 流通 77 亿 · 9/16 +0.76%</span></div>\n    <div class=\"logic\">9/11 跌停·概念边缘</div>\n    <div class=\"detail\">以农业种植为主、仅边缘挂靠代糖概念，不在食糖产业链核心传导路径上。9/11 跌停 -9.90%、换手 21.56%。</div>\n    <div class=\"gene\">🧬 题材基因：西北农业种植小盘，历次农业主题行情中的高换手跟风票</div>\n    \n    <div class=\"risk\">⚠️ 与食糖主链关联度低，属概念边缘</div>\n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>红棉股份</b><span class=\"code\">000523</span><span class=\"tag\">近5日+20%·9/11跌停</span><span class=\"cap\">3.27 元 · 流通 59 亿 · 9/16 +0.62%</span></div>\n    <div class=\"logic\">本轮糖题材的情绪风向标</div>\n    <div class=\"detail\">本轮糖题材涨幅最大的标的，近 5 个交易日累计约 +20%，9/11 跌停 -10.09%、换手 19.86%、量比 1.97——高换手跌停意味着前期获利盘集中兑现，是本轮情绪周期见顶回落的标志性信号。作为板块情绪温度计的价值大于其产业逻辑价值。</div>\n    <div class=\"gene\">🧬 题材基因：原广州浪奇重组后叠加食用糖业务，重组+题材双属性小盘活跃股，换手率长期高于板块均值</div>\n    \n    <div class=\"risk\">⚠️ 高换手跌停，情绪属性远强于产业属性；重组后主业结构仍在调整</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2016 厄尔尼诺转拉尼娜交替年：全球糖市出现供应缺口，ICE 原糖自 11 美分涨至 24 美分附近，A 股南宁糖业、中粮糖业走出一轮趋势行情——历史上糖价行情以趋势方式演绎而非连板。</li><li>2020H2–2021 巴西干旱叠加油价上行：原糖自 10 美分升至 20 美分以上，国内郑糖跟涨至 6000 元/吨上方，制糖股出现季度级别的业绩修复。</li><li>2023 印度限制食糖出口 + 厄尔尼诺预期：原糖触及多年高位，A 股糖业板块出现脉冲式炒作，但在国内高库存压制下未能形成持续行情——与本次内外背离的结构高度相似。</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>三元生物</b><span class=\"code\">301206</span><span class=\"tag\">全球赤藓糖醇龙头·代糖替代最纯映射</span></div>\n    <div class=\"logic\">代糖环节 | 糖价上行的替代需求 | 不受国内高库存压制</div>\n    <div class=\"detail\">三元生物是全球赤藓糖醇产能最大的生产商，处在这条链条上最干净的一环——替代效应。它的逻辑不在「国际糖价涨了多少」，而在「国内糖价何时突破成本线」：广西现货 5220 元/吨已跌破 5300~5400 元/吨的制糖成本线，一旦向上修复，下游食品饮料企业的配方切换意愿会明显增强，赤藓糖醇与蔗糖的性价比剪刀差随之打开。独特之处在于它是本轮题材中<strong>唯一不受 210 万吨国内工业库存压制</strong>的标的——制糖企业被库存锁死售价，而它的需求恰恰在糖价上行时才启动。9/11 收 24.86 元、跌 6.15%、换手 8.01%。</div>\n    \n    <div class=\"confirm\">✔ 确认：广西现货回升至 5400 元/吨上方 / 赤藓糖醇报价上调 / 下游食品企业配方切换公告</div>\n    <div class=\"risk\">⚠️ 代糖需求受下游景气度约束，国内糖价若持续被高库存压制则替代逻辑无从启动</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>粤桂股份</b><span class=\"code\">000833</span><span class=\"tag\">广西自有甘蔗基地·成本锁在国内</span></div>\n    <div class=\"logic\">自有种植基地制糖 | 原料成本不随国际糖价上行 | 硫铁矿副业另有一条涨价线</div>\n    <div class=\"detail\">粤桂股份的制糖原料来自广西自有与合作种植基地，不依赖进口——这使它成为本轮题材中少数<strong>不受国际原糖涨价反噬</strong>的标的：国际糖价上行对进口型糖企是采购成本压力，对它是纯粹的国内售价改善。它同时具备硫铁矿与硫酸业务，与 phosphate-export 档案的硫磺成本线形成交叉。公司已对受暴雨影响的甘蔗采取保护措施、预计产量变化不大，意味着它吃的是国内糖价修复的 beta 而非自身减产弹性。9/11 收 20.96 元、跌 5.63%、换手 10.16%。</div>\n    \n    <div class=\"confirm\">✔ 确认：广西南宁现货站上 5400 元/吨 / 新榨季甘蔗收购价上调 / 公司糖业务毛利修复</div>\n    <div class=\"risk\">⚠️ 国内产量若落在 1300~1350 万吨丰产区间，高库存将继续压制其售价弹性</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中粮糖业</b><span class=\"code\">600737</span><span class=\"tag\">国内糖业龙头·进口敞口双面性</span></div>\n    <div class=\"logic\">全球采购 + 自有产能 | 双向敞口：库存重估受益、采购成本承压 | 国内糖价 beta 载体</div>\n    <div class=\"detail\">中粮糖业是国内最大的食糖经营企业，采用巴西、澳大利亚、泰国、印度「买全球」采购策略——这决定了它对国际糖价是<strong>双向敞口</strong>：一方面价格上涨带来在手库存与存货重估收益，另一方面新采购成本同步抬升，而国内售价被高库存锁死，形成挤压。公司证券事务代表已公开表示泰国单一产区减产预期暂时难以判断影响。它的价值在于作为国内糖价 beta 的最大载体，一旦郑糖与现货启动修复倒挂，它的绝对盈利弹性最大；但当前阶段它是这条链上<strong>逻辑纯度最低</strong>的一只。9/11 收 16.21 元、跌 9.03%、成交 32.1 亿、换手 9.07%。</div>\n    \n    <div class=\"confirm\">✔ 确认：国内现货与郑糖同步上行修复成本倒挂 / 公司进口成本传导顺畅、毛利不降</div>\n    <div class=\"risk\">⚠️ 进口敞口意味着国际糖价上行首先体现为成本压力，国内售价若跟不动则双向受损</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>华康股份</b><span class=\"code\">605077</span><span class=\"tag\">木糖醇/功能糖·代糖第二梯队</span></div>\n    <div class=\"logic\">功能糖替代逻辑，与三元生物同源但规模与纯度次之</div>\n    <div class=\"detail\">木糖醇、山梨糖醇等功能糖生产商，与三元生物共享「糖价上行→代糖替代」的同一条传导链，但业务中大宗醇类占比更高、代糖纯度略低。属于三元生物逻辑成立时的跟随品种，独立驱动较弱。9/11 收 12.25 元、跌 4.52%、换手 10.12%。</div>\n    \n    \n    <div class=\"risk\">⚠️ 代糖纯度低于三元生物，弹性被其他业务稀释</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中粮科技</b><span class=\"code\">000930</span><span class=\"tag\">玉米深加工·淀粉糖替代线</span></div>\n    <div class=\"logic\">淀粉糖对蔗糖的工业替代，传导链更远</div>\n    <div class=\"detail\">以玉米深加工为主，产品涵盖淀粉糖、柠檬酸等。蔗糖价格上行会提升果葡糖浆、淀粉糖在工业客户中的替代经济性，但它同时承担玉米原料成本，是「替代需求上行 + 原料成本不确定」的双变量结构。9/11 收 5.88 元、跌 9.54%、换手 12.00%、量比 2.18。</div>\n    \n    \n    <div class=\"risk\">⚠️ 玉米价格与 grain-price-record 档案联动，原料端波动会抵消替代收益</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>华资实业</b><span class=\"code\">600191</span><span class=\"tag\">北方甜菜糖唯一平台·减产确定性较高</span></div>\n    <div class=\"logic\">甜菜糖环节，内蒙古面积 -26% 是已落地的确定性减产</div>\n    <div class=\"detail\">北方甜菜糖的上市平台。与其他产区不同，内蒙古甜菜种植面积由 196 万亩降至
