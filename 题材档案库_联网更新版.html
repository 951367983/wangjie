class=\"tag\">国产 x86 AI 加速器·9/8 +2.95% / 9/11 -0.64%</span></div>\n    <div class=\"logic\">国产 x86 AI 加速器龙头 | 与华为昇腾形成国产替代双轨 | 科创板 AI 芯片代表</div>\n    <div class=\"detail\">国产 x86 AI 加速器龙头，与华为昇腾形成国产替代双轨——DeepSeek 主要使用昇腾，但海光作为另一极也承接部分国产 AI 训练/推理需求。9/8 +2.95%、9/11 -0.64%（超额 +0.54pct）抗跌但相对偏弱——市场更倾向于华为昇腾链（DeepSeek 订单直接关联）。</div>\n    \n    <div class=\"confirm\">✔ 确认：海光 DCU 出货 Q4 放量 / 与 DeepSeek 或其他国产模型厂商签约</div>\n    <div class=\"risk\">⚠️ 若 DeepSeek 完全锁定昇腾，海光受益度边际下降</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>寒武纪</b><span class=\"code\">688256</span><span class=\"tag\">思元芯片·AI 训练通用</span></div>\n    <div class=\"logic\">思元 590/690 系列 | AI 训练通用 GPU | 9/8 +3.74% / 9/11 -0.37%</div>\n    <div class=\"detail\">思元芯片系列覆盖 AI 训练与推理，本轮 DeepSeek 订单与它关联度比昇腾链低，但国产替代叙事下仍是核心标的。9/8 +3.74% 放量、9/11 抗跌 -0.37%（超额 +0.81pct）。</div>\n    \n    \n    <div class=\"risk\">⚠️ DeepSeek 主要使用昇腾，对寒武纪需求拉动有限</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>润和软件</b><span class=\"code\">300339</span><span class=\"tag\">鸿蒙 + 昇腾适配·9/11 +0.35%</span></div>\n    <div class=\"logic\">鸿蒙 + 昇腾双栈适配 | openEuler 开源贡献 | Agent 应用层合作</div>\n    <div class=\"detail\">鸿蒙 + 昇腾双栈适配能力，openEuler 开源核心贡献者，与 DeepSeek 在应用层合作的可能性存在——Agent 生态需要国产 OS + 国产芯片 + 国产模型三层协同。9/8 +4.51%、9/11 +0.35%（超额 +1.53pct）抗跌。</div>\n    \n    \n    <div class=\"risk\">⚠️ Agent 应用层合作未官宣，预期未兑现</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>瑞芯微 / 全志科技</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">瑞芯微 9/11 -1.29%（超额 -0.11pct）、全志科技 9/11 -2.49%（超额 -1.31pct）——非昇腾链的通用 AI 算力，与本轮 DeepSeek 订单的关联度最低，主线行情中跟涨乏力、普跌日反而抗跌能力弱。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>瑞芯微 / 全志科技</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">SoC 与端侧 AI 芯片，与昇腾训练卡的采购订单无传导关系；昇腾订单落地不改变其供需格局</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>以 25.6 亿美元订单额直接年化推算集成商业绩</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">订单交付跨 2026-2027 两年且首期仅 4-5 万颗，摊到单季报表贡献远小于情绪反应；且 16 万颗规模尚未获华为官宣</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">国产算力**订单落地级**催化，但信源为彭博转译。基准参照：2025 年昇腾 910C 订单传闻行情，官方未确认情况下板块 3 日回落 12%。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">拓维信息 ＞ 神州数码 ＞ 海光信息。排序理由：前两者直接承接昇腾整机与集成，弹性最纯；海光为通用算力、容量大但传导较远。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">全志科技 ＞ 润和软件 ＞ 寒武纪（观察档）。gene：全志是低价小盘算力票，2025 昇腾行情中作为末端补涨票出现过两连板。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若华为官方确认 16 万颗订单**且**V4.1 Flash 正式发布支持国产芯片 → 逻辑状态由「传闻待证」升为「订单实锤」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 华为官方确认订单规模 ② 昇腾 950DT 首期 4-5 万颗在 2027Q1 交付 ③ V4.1 Flash 如期发布。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 华为官方否认 16 万颗规模 ② 交付延期至 2027Q3 之后 ③ V4.1 未如期发布或不支持昇腾。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">16 万颗这个数字目前只有彭博与通信世界的转译，华为从未官宣——这是全篇唯一的胜负手。订单金额 25.6 亿美元对应约 160 亿元，摊到 2027 年交付，对单季报表的贡献远小于情绪反应。真正要看的是 V4.1 Flash：它验证的是国产芯片能否跑通大模型训练，比订单数字重要得多。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>情景推演</h2>\n    <div style=\"font-size:12px;color:var(--dim);margin-bottom:8px\">每个分支为可观察的条件树——触发条件兑现后的逻辑状态与验证信号，互斥且可证伪。不含操作建议。</div>\n    <div class=\"scen\"><div class=\"sc\"><div class=\"br\">▸ 订单兑现路径</div><div class=\"tg\">触发：<b>华为官方确认 16 万颗订单规模 / V4.1 在昇腾上的跑分基准兑现 284 token/s</b></div><div class=\"ls\">逻辑状态：<b>昇腾链订单兑现、国产替代叙事从「方向性」转为「营收兑现」、算力链进入主升第二段</b></div><div class=\"fs\">观察信号：<b>拓维信息/神州数码/海光信息 9/15 后延续放量 / 算力链成交占比维持 8% 以上</b></div></div><div class=\"sc\"><div class=\"br\">▸ 订单黄了路径</div><div class=\"tg\">触发：<b>华为官方否认 16 万颗订单 / DeepSeek 转用其他芯片 / 美方放松 Blackwell 出口管制</b></div><div class=\"ls\">逻辑状态：<b>昇腾链第一段逻辑证伪、国产替代叙事降级、算力链进入回踩</b></div><div class=\"fs\">观察信号：<b>拓维信息回踩 9/8 阳线起点 / 算力链成交占比回落至 5% 以下</b></div></div><div class=\"sc\"><div class=\"br\">▸ Agent 经济模型爆发路径</div><div class=\"tg\">触发：<b>V4.1 Flash 商用调用量周环比增长 >30% / Agent 应用日均调用量创新高</b></div><div class=\"ls\">逻辑状态：<b>算力需求被进一步释放、对昇腾的依赖度上升、订单规模可能上修</b></div><div class=\"fs\">观察信号：<b>中金/中信研报上调昇腾链目标价 / Agent 应用层标的（科大讯飞/用友）放量</b></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>华为官方确认 16 万颗昇腾 950DT 订单（当前仅彭博/通信世界转译）</b></li><li><b>昇腾 950DT 首期交付在 2027Q1 完成（4-5 万颗）</b></li><li><b>DeepSeek V4.1 Flash 在昇腾 910B/950PR 上的实际推理速度达到 284 token/s 基准</b></li><li><b>V4.1 Flash 商用调用量周环比增长 >30%（Agent 经济模型改写）</b></li><li><b>算力链 9/14 延续抗跌（大盘震荡日+1.0pct 以上超额）</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>华为官方否认 16 万颗订单规模</b></li><li><b>昇腾 950DT 交付延期至 2027Q3 之后</b></li><li><b>DeepSeek 转用其他国产芯片（如寒武纪）或部分回归英伟达</b></li><li><b>V4.1 Flash 在国产芯片上跑分不及 V4 Pro</b></li><li><b>算力链在 9/14-9/15 跟随大盘下挫、丧失抗跌性</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">每周一三五</div><div class=\"wh\">华为昇腾合作伙伴出货数据（拓维/神州数码/浪潮信息月报）</div><div class=\"wy\">订单兑现度的连续观测窗</div></div><div class=\"tkc\"><div class=\"w\">9/15 前后</div><div class=\"wh\">V4.1 Flash 在昇腾集群的实际推理速度基准（中信/中金研报跟踪）</div><div class=\"wy\">国产芯片适配能力的关键验证</div></div><div class=\"tkc\"><div class=\"w\">10 月中旬</div><div class=\"wh\">DeepSeek 算力账目透明度报告（如披露月度 GPU 使用率）</div><div class=\"wy\">梁文锋「算力账能否算清」的悬念验证</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">英伟达出口管制政策动向（Blackwell 国行替代品节奏）</div><div class=\"wy\">国产替代窗口的边界变量</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">Agent 应用日均调用量（中信/中金研报跟踪）</div><div class=\"wy\">V4.1「KV Cache 压缩到 1/4」是否能转化为下游应用爆发</div></div></div>\n\n    <div class=\"src\">数据来源：通信世界 2026-09-08 彭博转译 ｜ 上海证券报 2026-09-08 V4.1 Flash 内测 ｜ 观察者网 2026-09-08 招 150 人 ｜ 和讯网 2026-09-08 华能蒙电否认 ｜ 第一财经 2026-09-09 DeepSeek 动态汇总 ｜ 今日头条 2026-09-10 DeepSeek 突发故障分析 ｜ DeepSeek 官方 9/10 V4.1 Flash 发布会 ｜ 中金公司/中信证券 V4.1 Flash 研报 ｜ 智通财经/老虎证券 A 股算力链盘面数据</div>\n    <footer>DeepSeek 下单16万颗昇腾 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "grain-price-record", "title": "全球粮价创四年新高", "date": "2026-09-08", "grade": "正式档", "pricing": "部分定价", "crate": "bolt", "search": "全球粮价创四年新高 fao 8 月食品价格指数 133.3 点 · 环比 +1.9% · 糖价指数单月暴涨 11.9% 产业周期 ⚡ 未充分定价", "card": "<a class=\"card-c\" href=\"#grain-price-record\" data-search=\"全球粮价创四年新高 fao 8 月食品价格指数 133.3 点 · 环比 +1.9% · 糖价指数单月暴涨 11.9% 产业周期 农业·粮食与化肥 部分定价 中粮糖业 苏垦农发 中粮科技 保龄宝 华康股份\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-08</span>\n    <span class=\"crate bolt\">⚡ 未充分定价 产业周期</span>\n  </div>\n  <div class=\"ctitle\">全球粮价创四年新高</div>\n  <div class=\"csub\">FAO 8 月食品价格指数 133.3 点 · 环比 +1.9% · 糖价指数单月暴涨 11.9%</div>\n  <div class=\"cpos\">FAO 8 月食品价格指数 133.3 点创四年新高、环比 +1.9%，其中糖价指数单月暴涨 11.9%——涨幅最猛的分项在国内无直接映射。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">农业·粮食与化肥</span>\n    \n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 5</span>\n    <span class=\"nm\">中粮糖业</span><span class=\"nm\">苏垦农发</span><span class=\"nm\">中粮科技</span><span class=\"nm\">保龄宝</span><span class=\"nm\">华康股份</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-08 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-08</div>\n    <h1>全球粮价创四年新高</h1>\n    <div class=\"sub\">FAO 8 月食品价格指数 133.3 点 · 环比 +1.9% · 糖价指数单月暴涨 11.9%</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 未充分定价</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：农业·粮食与化肥</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">phosphate-export</span><span class=\"tag\" style=\"margin-right:4px\">sugar-el-nino</span></div>\n    <div class=\"posnote\">FAO 8 月食品价格指数 133.3 点创四年新高、环比 +1.9%，其中糖价指数单月暴涨 11.9%——涨幅最猛的分项在国内无直接映射。</div>\n    <details class=\"more\"><summary>展开定价状态详版（139 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化为 FAO 于 9 月 4 日发布的 8 月食品价格指数，属海外官方月度数据、发布时点在盘后。国际商品市场（小麦、玉米、糖）已按数据定价，A 股对应环节的反应需看次日盘面。国内粮价受最低收购价与储备调节管控，国际价格向国内的传导本身存在衰减，这是本档案传导链上最薄弱的一环。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">联合国粮农组织 9/4 发布：2026 年 8 月<strong>食品价格指数平均 133.3 点</strong>，环比 +1.9%、同比 +2.5%，<strong>升至 2022 年 12 月以来最高水平</strong>。构成指数的五大类商品全线上涨。谷物价格指数 116.3 点，创 2024 年 5 月以来新高。</div></div><div class=\"card fact\"><b class=\"k\">短期驱动</b><div class=\"v\"><strong>糖是最大变量</strong>：8 月糖类价格指数环比暴涨 11.9% 至 106.4 点，创 2025 年 6 月以来新高，驱动为欧盟甜菜单产预期下调（高温干旱）、厄尔尼诺影响亚洲主产国、巴西中南部减产、印度宣布免税进口原糖。小麦环比 +2.6%、<strong>同比 +15.0%</strong>（黑海出口物流受阻+欧洲高温干旱+美元走弱）。玉米环比 +2.5%。</div></div><div class=\"card fact\"><b class=\"k\">供给刚性</b><div class=\"v\">FAO 下调 2026 全球谷物产量至 <strong>29.8 亿吨，同比 -2.0%</strong>（仍为历史第二高）。其中玉米 13.09 亿吨（法国、波兰作物前景恶化）、小麦 8.107 亿吨（-3.8%）、大米 5.531 亿吨（-1.9%，厄尔尼诺）。2027 年季末全球谷物库存预计 9.472 亿吨，库存消费比 31.6%。</div></div><div class=\"card fact\"><b class=\"k\">需求长逻辑</b><div class=\"v\">FAO 首席经济学家 Torero 表述：<strong>「风险溢价正在回到食品市场」</strong>——气候冲击、地缘紧张、贸易物流中断三者叠加收紧供应预期。摩根大通预测全球食品通胀率 2027 上半年或升至 5%（当前 2.8%）。厄尔尼诺是年度级别变量。</div></div><div class=\"card fact warn\"><b class=\"k\">争议点</b><div class=\"v\"><strong>涨的是「风险溢价」不是「真实短缺」。</strong>库存消费比 31.6%，FAO 自身判断「全球谷物总体供应状况仍相对充裕」。国内侧更关键：敦煌种业在股价异动公告中明确表述<strong>「当前玉米种业市场整体呈现供大于求局面」</strong>；且国内粮价受最低收购价与储备调节管控，国际涨价向国内传导极弱，A 股种植类上市公司单位盈利模型不受国际粮价直接改变。</div></div><div class=\"card fact\"><b class=\"k\">A股映射</b><div class=\"v\">按环节划分：①<strong>糖</strong>——食糖进口加工与贸易，直接对应国际糖价（如中粮糖业）；②<strong>种植</strong>——自有耕地规模化种植，对应国内粮价与土地规模（如苏垦农发）；③<strong>深加工</strong>——玉米深加工与燃料乙醇，粮价对其是成本端（如中粮科技）；④<strong>种业</strong>——种子销售，需求取决于种植面积与品种推广，与当期粮价弱相关；⑤<strong>代糖</strong>——糖价上涨的替代逻辑（如保龄宝、华康股份）。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-08</div><div><div class=\"x\">全球粮价创四年新高：FAO 8 月食品价格指数 133.3 点 · 环比 +1.9% · 糖价指数单月暴涨 11.9%</div><div class=\"y\">为什么：本档为「气候+粮食」的建档时点，后续二段催化均在此之上叠加</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">① <strong>分水岭时点</strong>：FAO 9 月食品价格指数（约 10 月初发布）能否延续环比上行。这是判断「风险溢价回归」是趋势还是单月扰动的唯一客观口径。<br>② <strong>传导的关键约束</strong>：国际粮价到 A 股公司利润之间隔着两层衰减——第一层是国内粮价的政策管控（最低收购价+储备调节），第二层是种植类上市公司本身利润极薄、单位盈利模型不随国际价格线性变化。糖是唯一绕开这两层的环节，因为国际糖价直接对应进口加工与贸易业务的定价。<br>③ <strong>待验证的核心变量</strong>：国际糖价能否继续上行。糖价指数单月 +11.9% 是本轮数据中弹性最大的分项，也是 A 股唯一有直接业务映射的环节。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>FAO 133.3 点、糖 +11.9% 为官方硬数据，非传闻</li><li>同比 +2.5% 且创 2022 年 12 月以来新高，趋势明确</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">弱传导</span><ul><li>国内粮价受最低收购价与储备调节管控，国际涨价传不进来</li><li>库存消费比 31.6%，FAO 自身认为供应相对充裕</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">弱</span><ul><li>种植类上市公司利润极薄，粮价上行不改变单位盈利模型</li><li>敦煌种业公告自述玉米种业供大于求</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">待观察</span><ul><li>本档案不以当日收盘数据判断——盘后数据映射的是次日盘面</li><li>观察点在次日糖与种植环节的定价反应</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响弱传导、业绩环薄弱、股价待观察——四环中「影响」与「业绩」两环衰减明显，糖是唯一闭合较好的分支。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>55%</strong>：主链条上「影响」「业绩」两环均衰减，只有糖这一分支能较好闭合。</li><li><strong>边界要切开</strong>：按传导距离排序为 <strong>糖（国际糖价直连业务）＞ 种植（国内粮价+土地规模）＞ 深加工（粮价是成本端）＞ 代糖（替代逻辑，链条最长）≫ 种业（供大于求，需求逻辑与当期粮价弱相关）</strong>。市场常把「粮价涨」等同于「种业受益」，这是传导关系上的误读。</li><li>与 phosphate-export 档案<strong>互为印证</strong>：粮价上行理论上应提升种植意愿→拉动化肥需求。但当前复合肥开工率仅 34%、秋肥启动不及预期，说明这条传导在现货端尚未打通；若后续复合肥开工上行，两份档案的链条同时增强。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中粮糖业</b><span class=\"code\">600737</span><span class=\"cap\">14.28 元 · 流通 305 亿 · 9/16 -0.70%</span></div>\n    <div class=\"logic\">食糖进口加工+贸易，国际糖价直连业务</div>\n    \n    \n    \n    \n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>苏垦农发</b><span class=\"code\">601952</span><span class=\"cap\">9.02 元 · 流通 124 亿 · 9/16 +1.58%</span></div>\n    <div class=\"logic\">种植规模最大，国内粮价+土地规模</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中粮科技</b><span class=\"code\">000930</span><span class=\"cap\">5.01 元 · 流通 93 亿 · 9/16 +0.80%</span></div>\n    <div class=\"logic\">玉米深加工+乙醇，双向影响（成本+需求）</div>\n    \n    \n    \n    \n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>保龄宝</b><span class=\"code\">002286</span><span class=\"cap\">7.69 元 · 流通 28 亿 · 9/16 +0.26%</span></div>\n    <div class=\"logic\">代糖替代逻辑，链条最长</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>华康股份</b><span class=\"code\">605077</span><span class=\"cap\">11.30 元 · 流通 34 亿 · 9/16 -0.79%</span></div>\n    <div class=\"logic\">木糖醇，与国际糖价关联度有限</div>\n    \n    \n    \n    \n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2020 粮食安全行情（疫情+蝗虫担忧）：金健米业两个月内多次涨停、区间涨幅超 200%，京粮控股、农发种业、苏垦农发集体翻倍。</li><li>2022 俄乌冲突推动全球粮价：国际小麦价格单月涨幅超 20%，A 股种植板块跟随约一个季度。</li><li>2024 厄尔尼诺糖价行情：国际糖价上行期间，糖业标的以趋势方式定价，缺乏连板特征。</li></ul></div>\n    \n    \n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>种业（含敦煌种业等）</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">供大于求+需求逻辑与粮价弱相关</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>以国际粮价直接推算国内种植收益的标的</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">国内粮价受政策管控，传导链断裂</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**气候+粮食**主线的宏观催化，国内粮价与国际粮价长期脱钩。基准参照：2022 年全球粮价新高行情，A 股种植板块 3 日冲高后回落，只有糖链走出了趋势。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">中粮糖业 ＞ 苏垦农发 ＞ 中粮科技。排序理由：只有糖价分项（+11.9%）有内外联动机制，中粮糖业是唯一能接住国际糖价的标的；种植端受国内收储管制，无法直接受益。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">保龄宝 ＞ 华康股份。gene：代糖/功能糖小盘票，2022 粮价行情中作为糖价传导末端出现过连板，属典型末端补涨品种。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若 FAO 9 月指数继续环比上行**且**国际糖价突破前期平台 → 逻辑状态由「宏观数据利好」升为「内外价差可兑现」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① FAO 9 月食品价格指数（约 10 月初发布）继续环比上行 ② 国际糖价突破前期平台 ③ 国内糖价跟涨、郑糖站上前期高点。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① FAO 9 月指数环比转跌 ② 国际糖价回落、本轮最大涨幅分项被抹去 ③ 国内糖价继续背离（内外价差扩大但不收敛）。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">「全球粮价新高」与「A 股种植受益」之间隔着一层收储与进口管制——国内粮价受政策管控，国际价格传导不进来。真正能接住的是糖：它有进口配额与内外联动机制。这条链上种业与「以国际粮价推算种植收益」的推演都被列入剔除，原因就在这里。</div></div></div>\n\n    \n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>FAO 9 月食品价格指数（约 10 月初发布）继续环比上行</b></li><li><b>国际糖价继续走高，突破前期平台</b></li><li><b>复合肥开工率从 34% 回升至 40% 以上（种植意愿提升的现货证据，与 phosphate-export 档案交叉印证）</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>FAO 9 月食品价格指数环比转跌</b></li><li><b>国际糖价回落，本轮涨幅最大分项被抹去</b></li><li><b>国内粮价在国际上涨期间保持平稳，制度性隔离被再次确认</b></li><li><b>库存消费比继续抬升，供应充裕格局强化</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">约 10 月初</div><div class=\"wh\">FAO 9 月食品价格指数与《谷物供求简报》</div><div class=\"wy\">判断风险溢价是趋势还是单月扰动的唯一客观口径</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">国际糖价（ICE 原糖）与巴西中南部产量数据</div><div class=\"wy\">糖是弹性最大、也是 A 股唯一直接映射的分项</div></div><div class=\"tkc\"><div class=\"w\">每月</div><div class=\"wh\">国内主产区粮食收购价与储备投放节奏</div><div class=\"wy\">衡量国际价格向国内传导的衰减程度</div></div><div class=\"tkc\"><div class=\"w\">9-10 月</div><div class=\"wh\">复合肥开工率与秋播进度</div><div class=\"wy\">与 phosphate-export 档案交叉验证种植意愿</div></div></div>\n\n    <div class=\"src\">数据来源：联合国粮农组织 FAO 食品价格指数报告(9/4)、FAO《谷物供求简报》(9/4)、经济日报与央视报道(9/5)、摩根大通食品通胀预测、敦煌种业股价异动风险公告</div>\n    <footer>全球粮价创四年新高 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "oil-hormuz", "title": "沙特能源设施遭袭 · 布油逼近 100", "date": "2026-09-08", "grade": "正式档", "pricing": "部分定价", "crate": "fire", "search": "沙特能源设施遭袭 · 布油逼近 100 胡塞袭击沙特艾卜哈/贾赞/奈季兰 · 布伦特 99.22 美元创 7/24 来新高 · 高盛给出 80-120 美元情景区间 地缘冲突 🔥 已启动", "card": "<a class=\"card-c\" href=\"#oil-hormuz\" data-search=\"沙特能源设施遭袭 · 布油逼近 100 胡塞袭击沙特艾卜哈/贾赞/奈季兰 · 布伦特 99.22 美元创 7/24 来新高 · 高盛给出 80-120 美元情景区间 地缘冲突 能源地缘·中东供断与成品油 部分定价 中国海油 中曼石油 广汇能源 石化油服 中国石油\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-08</span>\n    <span class=\"crate fire\">🔥 已启动 地缘冲突</span>\n  </div>\n  <div class=\"ctitle\">沙特能源设施遭袭 · 布油逼近 100</div>\n  <div class=\"csub\">胡塞袭击沙特艾卜哈/贾赞/奈季兰 · 布伦特 99.22 美元创 7/24 来新高 · 高盛给出 80-120 美元情景区间</div>\n  <div class=\"cpos\">胡塞袭击沙特三处能源设施，布伦特 99.22 美元创 7/24 来新高；上游独享利好，炼化/航空/物流/甲醇等下游为成本受损方。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">能源地缘·中东供断与成品油</span>\n    \n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 5</span>\n    <span class=\"nm\">中国海油</span><span class=\"nm\">中曼石油</span><span class=\"nm\">广汇能源</span><span class=\"nm\">石化油服</span><span class=\"nm\">中国石油</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-08 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-08</div>\n    <h1>沙特能源设施遭袭 · 布油逼近 100</h1>\n    <div class=\"sub\">胡塞袭击沙特艾卜哈/贾赞/奈季兰 · 布伦特 99.22 美元创 7/24 来新高 · 高盛给出 80-120 美元情景区间</div>\n    <div class=\"badges\">\n      <span class=\"badge fire\">🔥 已启动</span>\n      <span class=\"badge neutral\">地缘冲突</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：能源地缘·中东供断与成品油</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">diesel-crack-record</span><span class=\"tag\" style=\"margin-right:4px\">europe-gas-squeeze</span><span class=\"tag\" style=\"margin-right:4px\">oil-tanker-supercycle</span><span class=\"tag\" style=\"margin-right:4px\">russia-diesel-outage</span><span class=\"tag\" style=\"margin-right:4px\">saudi-east-west-pipeline</span></div>\n    <div class=\"posnote\">胡塞袭击沙特三处能源设施，布伦特 99.22 美元创 7/24 来新高；上游独享利好，炼化/航空/物流/甲醇等下游为成本受损方。</div>\n    <details class=\"more\"><summary>展开定价状态详版（127 字）</summary><div class=\"pos\"><b>定价状态备注：</b>袭击发生在 9 月 8 日亚洲时段，国际油价当日已作出反应（布伦特 +2.06% 至 99.22 美元）。A 股对应环节的反应需以次日盘面为准，本档案不引用前一日收盘数据。需要说明的是：油价中包含的是风险溢价而非实物短缺，溢价的持续性完全取决于冲突走向。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">9/8 也门胡塞武装袭击沙特艾卜哈、贾赞、奈季兰等地能源及民用设施，多处起火、部分设施暂时中断运营，造成 73 人受伤（央视新闻援引沙特能源部）。布伦特一度触及 99.22 美元/桶创 7/24 以来新高，WTI 94.60 美元创 6/8 以来新高。</div></div><div class=\"card fact\"><b class=\"k\">短期驱动</b><div class=\"v\">高盛上调 2026 年 12 月布伦特/WTI 预测各 5 美元至 85/80 美元；并给出情景区间——若对船舶袭击进一步升级看 120 美元，若出口恢复正常则回落至 80 美元，上下差 40 美元。</div></div><div class=\"card fact\"><b class=\"k\">供给刚性</b><div class=\"v\">霍尔木兹海峡冲突前承担全球约 1/5 的石油与 LNG 日供应；ANZ 预计要到 2027 年 Q1-Q2 才恢复至冲突前水平。招商期货：若沙特延布港出口持续受阻，供应减量或再扩大 300-400 万桶/天。</div></div><div class=\"card fact\"><b class=\"k\">需求长逻辑</b><div class=\"v\">全球柴油供给偏紧：缺乏备用炼能 + 俄罗斯出口禁令 + 冬季需求高峰临近（路透）。高盛观点认为天然气与成品油受供应冲击的程度大于原油。</div></div><div class=\"card fact warn\"><b class=\"k\">争议点</b><div class=\"v\">油价含明显地缘溢价而非实物短缺——KCM Trade 首席分析师表述为「风险溢价在做主要贡献」。自 2 月底美伊冲突以来布伦特已涨超 30%，但仍远低于 4 月末 126 美元高点，说明市场对「升级」已部分钝化；缓和信号一旦出现，溢价回吐速度通常很快。</div></div><div class=\"card fact\"><b class=\"k\">A股映射</b><div class=\"v\">按环节划分：①<strong>上游油气开采</strong>——油价上行的直接受益环节，业绩弹性取决于油价维持时长；②<strong>油服与装备</strong>——对应上游资本开支，传导需经过资本开支决策一层；③<strong>天然气与 LNG</strong>——高盛观点中受供应冲击更大的品种；④<strong>一体化石油</strong>——上游受益但炼化段成本上升，净效应相互对冲；⑤<strong>炼化/航空/物流/下游化工</strong>——成本受损方。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-08</div><div><div class=\"x\">沙特能源设施遭袭 · 布油逼近 100：胡塞袭击沙特艾卜哈/贾赞/奈季兰 · 布伦特 99.22 美元创 7/24 来新高 · 高盛给出 80-120 美元情景</div><div class=\"y\">为什么：本档为「能源地缘·中东供断」的建档时点，后续二段催化均在此之上叠加</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">① <strong>分水岭时点</strong>：沙特能源设施复产进度与延布港出口是否受阻。前者决定风险溢价是否消退，后者决定供应减量是否从预期变为实际（招商期货测算 300-400 万桶/天的量级）。<br>② <strong>传导的关键约束</strong>：油价上涨到 A 股公司盈利之间隔着「油价维持时长」这一变量——单日价格不进入业绩，只有均价中枢的抬升才体现为利润。这决定了本链条的性质是事件定价而非趋势定价。<br>③ <strong>待验证的核心变量</strong>：冲突是否延续。高盛把区间框定在 80-120 美元，两端相差 40 美元，全部由地缘走向决定，不存在中间情形的自然收敛路径。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>沙特能源部官方声明，设施暂时中断运营</li><li>73 人受伤，非口头威胁</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强</span><ul><li>布伦特 +2.06% 逼近 100 美元</li><li>延布港若受阻，供应再减 300-400 万桶/天</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">存疑</span><ul><li>利好上游开采，利空炼化/航空/下游化工</li><li>业绩弹性取决于油价均价维持时长，非单日价格</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">待观察</span><ul><li>本档案不以当日收盘数据判断——盘中事件映射的是次日盘面</li><li>观察点在次日上游开采与油服环节的定价反应</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强、业绩分化（上游受益/中下游受损）、股价待观察——属事件定价，业绩环是条件句而非当期兑现。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>65%</strong>：事件与价格均已确认，但业绩环依赖「油价维持」这一条件，不是当期可兑现的利润。</li><li><strong>边界要切开</strong>：受益的是<strong>上游油气开采</strong>（油价上行直接抬升销售均价）；受损的是<strong>炼化、航空、物流、甲醇等下游</strong>——油价是它们的成本项。一体化企业因同时拥有上下游，净效应相互对冲。</li><li>与 copper-record 档案对比：铜是供需驱动（矿端紧缺为慢变量），油是地缘驱动（风险溢价为快变量），两者在传导链上的性质不同，不能按同一逻辑推演。</li><li>与 phosphate-export 档案联动：霍尔木兹海峡同时是全球约 45% 海运硫磺的通道，油价与硫磺成本、进而与磷肥成本同源。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中国海油</b><span class=\"code\">600938</span><span class=\"cap\">33.08 元 · 流通 989 亿 · 9/16 -1.11%</span></div>\n    <div class=\"logic\">纯上游开采·无对冲·传导最直接</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中曼石油</b><span class=\"code\">603619</span><span class=\"cap\">22.13 元 · 流通 102 亿 · 9/16 +2.03%</span></div>\n    <div class=\"logic\">上游+油服双业务·弹性高于纯上游</div>\n    \n    \n    \n    \n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>广汇能源</b><span class=\"code\">600256</span><span class=\"cap\">6.89 元 · 流通 440 亿 · 9/16 +0.58%</span></div>\n    <div class=\"logic\">天然气+LNG·对应高盛观点中受冲击更大品种</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>石化油服</b><span class=\"code\">600871</span><span class=\"cap\">2.23 元 · 流通 302 亿 · 9/16 +2.76%</span></div>\n    <div class=\"logic\">国内油服主体·对应上游资本开支</div>\n    \n    \n    \n    \n  </div></div><div class=\"t\">👑 情绪龙 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 地缘冲突</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中国石油</b><span class=\"code\">601857</span><span class=\"cap\">10.81 元 · 流通 1.75 万亿 · 9/16 -0.37%</span></div>\n    <div class=\"logic\">一体化龙头·上下游对冲弹性</div>\n    \n    \n    \n    \n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2026/2 末 美伊冲突爆发：布伦特自冲突起累涨超 30%，油气板块整体走强。</li><li>2026/4 末 布伦特触及 126 美元：为本轮最高点，此后逐步回落，显示风险溢价的回吐速度。</li><li>2026/9/8 胡塞袭沙特：布伦特升至 99.22 美元，低于 4 月高点约 21%，说明市场对同类事件的边际反应在减弱。</li></ul></div>\n    \n    \n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>炼化 / 航空 / 物流 / 甲醇等下游</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">油价上涨对这些环节是成本挤压而非受益。需注意成品油零售类企业短期只有库存收益，本质上不是油价上行的受益方。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>以单日油价推算业绩弹性</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">企业盈利对应的是区间均价，单日价格不进入报表，两者不能线性换算。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>炼化/航空/物流/甲醇等下游</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">油价是它们的成本项，受损方</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**地缘冲突**型供给冲击，油价中枢抬升。基准参照：2019 年 Abqaiq 遇袭，布油单日 +19% 后 3 周回落至原位——单日冲高不构成趋势。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">中国海油 ＞ 中曼石油 ＞ 广汇能源。排序理由：纯上游开采者直接享受油价中枢抬升；中曼为民营油服+开采复合，弹性次之。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">中国石油（情绪龙）＞ 石化油服。gene：中石油在历次油价脉冲行情中充当板块定海神针，涨幅温和但从不缺席；油服小盘为末端补涨。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若布伦特站稳 100 美元并维持（中枢抬升而非单日冲高）**且**延布港出口受阻、供应减量扩大至 300 万桶/天以上 → 逻辑状态由「事件脉冲」升为「供给缺口持续」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 布伦特站稳 100 美元并维持 ② 延布港出口确认受阻、减量扩大至 300 万桶/天以上 ③ 沙特官方确认复产延期。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 沙特宣布设施复产、运营恢复 ② 美伊谈判进展或霍尔木兹通航量回升至常态 ③ 布油回落至 90 美元下方。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">2019 年 Abqaiq 遇袭后布油单日 +19%，3 周就回到原点——**单日冲高不是趋势**。判断这次是否不同，只看两件事：一是沙特复产公告（没出就是真断供），二是霍尔木兹通航量（从 200-300 万桶/日回不回得去 500 万桶/日）。下游炼化/航空/物流/甲醇全部是成本受损方，已列入剔除。</div></div></div>\n\n    \n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>布伦特站稳 100 美元并维持（均价中枢抬升而非单日冲高）</b></li><li><b>沙特延布港出口确认受阻，供应减量扩大至 300 万桶/天以上</b></li><li><b>沙特能源部未发布复产声明，设施中断持续</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>沙特宣布设施复产、运营恢复</b></li><li><b>美伊出现谈判进展，或霍尔木兹通航量回升至常态</b></li><li><b>油价回落至袭击前水平，风险溢价被完全挤出</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">即时</div><div class=\"wh\">沙特能源部复产声明与设施运营状态</div><div class=\"wy\">决定风险溢价是否消退，是本链条最快的变量</div></div><div class=\"tkc\"><div class=\"w\">每日</div><div class=\"wh\">霍尔木兹海峡通航量（Kpler 等独立追踪口径）</div><div class=\"wy\">供应减量是否真实发生的量化证据</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">延布港出口情况与 OPEC+ 产量政策</div><div class=\"wy\">决定 300-400 万桶/天的减量预期是否落地</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">布伦特与 WTI 的均价中枢（非单日价格）</div><div class=\"wy\">业绩环只认均价，不认单日冲高</div></div></div>\n\n    <div class=\"src\">数据来源：央视新闻援引沙特能源部 9/8 声明 ｜ 新华财经/中国金融信息网 9/8 ｜ 路透（Euronext 转载）9/8 ｜ 招商期货研报 ｜ 高盛 Daan Struyven 观点 ｜ 东财 7×24 快讯（9/8）</div>\n    <footer>沙特能源设施遭袭 · 布油逼近 100 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "phosphate-export", "title": "磷肥出口解禁", "date": "2026-09-08", "grade": "正式档", "pricing": "部分定价", "crate": "bolt", "search": "磷肥出口解禁 9/1 起 map·dap 恢复出口申报 · 国际 dap fob 875-915 美元/吨 · 内外价差 1149-1500 元/吨 政策驱动 ⚡ 政策放开型 · 纸面订单已启动、实物出海未兑现", "card": "<a class=\"card-c\" href=\"#phosphate-export\" data-search=\"磷肥出口解禁 9/1 起 map·dap 恢复出口申报 · 国际 dap fob 875-915 美元/吨 · 内外价差 1149-1500 元/吨 政策驱动 农业·粮食与化肥 部分定价 云天化 川发龙蟒 兴发集团 和邦生物 川金诺\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-08</span>\n    <span class=\"crate bolt\">⚡ 政策放开型 · 纸面订单已启动、实物出海未兑现 政策驱动</span>\n  </div>\n  <div class=\"ctitle\">磷肥出口解禁</div>\n  <div class=\"csub\">9/1 起 MAP·DAP 恢复出口申报 · 国际 DAP FOB 875-915 美元/吨 · 内外价差 1149-1500 元/吨</div>\n  <div class=\"cpos\">9/1 起 MAP·DAP 恢复出口申报，国际 DAP FOB 875-915 美元/吨、内外价差 1149-1500 元/吨；纸面订单已启动，实物出海未兑现。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">农业·粮食与化肥</span>\n    \n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 7</span>\n    <span class=\"nm\">云天化</span><span class=\"nm\">川发龙蟒</span><span class=\"nm\">兴发集团</span><span class=\"nm\">和邦生物</span><span class=\"nm\">川金诺</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-08 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-08</div>\n    <h1>磷肥出口解禁</h1>\n    <div class=\"sub\">9/1 起 MAP·DAP 恢复出口申报 · 国际 DAP FOB 875-915 美元/吨 · 内外价差 1149-1500 元/吨</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 政策放开型 · 纸面订单已启动、实物出海未兑现</span>\n      <span class=\"badge neutral\">政策驱动</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：农业·粮食与化肥</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">grain-price-record</span><span class=\"tag\" style=\"margin-right:4px\">sugar-el-nino</span></div>\n    <div class=\"posnote\">9/1 起 MAP·DAP 恢复出口申报，国际 DAP FOB 875-915 美元/吨、内外价差 1149-1500 元/吨；纸面订单已启动，实物出海未兑现。</div>\n    <details class=\"more\"><summary>展开定价状态详版（248 字）</summary><div class=\"pos\"><b>定价状态备注：</b>政策 9/1 生效，至 9/8 已 6 个交易日。<strong>盘面状态</strong>：9/8 化肥题材涨停 10 家、磷化工涨停 5 家（金正大 2 板、川发龙蟒/和邦生物/粤桂股份/潞化科技各 1 板）——板块<strong>已启动</strong>；但龙头云天化、兴发集团当日<strong>未涨停</strong>，说明资金尚未对「矿肥一体化龙头」形成共识，反应集中在中小弹性票。尚未兑现的是实物离港（法检+租船+装港，大概率落在 10 月）。这是「已启动但未走完」的部分定价状态。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">3/14–8/31 国内对农用磷肥实施阶段性出口管控（暂停出口申报保春耕），<strong>9 月 1 日起磷酸一铵(MAP)、磷酸二铵(DAP)及农用含磷复合肥恢复常态化出口申报</strong>。国际 DAP FOB 875-915 美元/吨，与国内价差 1149 元/吨（9/3 商务部口径）；东南亚 DAP 到岸 900-945 美元/吨 CFR，印度近期招标价 920 多美元/吨 CFR。</div></div><div class=\"card fact\"><b class=\"k\">政策性质</b><div class=\"v\">出口实行<strong>「许可证+配额」管理而非放开</strong>——额度向完成国内保供、核销率高的头部企业倾斜。这决定了内外价差红利是<strong>结构性分配</strong>，不是全行业普享。中小企业拿不到额度只能内销，是这轮政策的分水岭。</div></div><div class=\"card fact\"><b class=\"k\">成本端挤压</b><div class=\"v\">上游双重约束：磷矿 30% 品位 1000 元/吨（环保督查致部分矿山限产停产）；硫磺<strong>全球约 45% 海运量经霍尔木兹海峡</strong>，卡塔尔 9 月 FOB 880 美元但到岸成本破 1070 美元，俄罗斯出口禁令延至年底。镇江港颗粒硫磺 7700-7800 元/吨横盘，山东液硫竞拍冲到 8350-8510。</div></div><div class=\"card fact\"><b class=\"k\">需求侧</b><div class=\"v\">秋播备肥 + 出口双改善预期。2026 年全球谷物产量 29.8 亿吨（历史第二高），种植面积刚性托底化肥需求；9 月中下旬黄淮海小麦底肥集中提货是季节性刚需。世界银行：2026 年全球化肥价格指数上涨超 30%。</div></div><div class=\"card fact\"><b class=\"k\">供给端缺口</b><div class=\"v\">中国 3-8 月五个月管控 + 伊朗磷肥出口受阻（霍尔木兹海峡航运受限），全球供给两个缺口同时收紧——这是国际报价能维持 875-915 美元高位的根本原因。</div></div><div class=\"card fact warn\"><b class=\"k\">争议点</b><div class=\"v\"><strong>9 月只是「纸面订单月」，不是「出海放量月」。</strong>9 月接单后需走完法检、租船、装港，实物离港大概率到 10 月。同时现货端仍在跌：磷酸一铵 55% 粉湖北出厂 4100-4300，<strong>周跌接近 150 元</strong>；二铵湖北出厂 4800-4850 而黑龙江到站 4550-4600，<strong>出厂与到站倒挂</strong>；复合肥开工率仅 34%，一铵开工降至 50% 出头、库存 34 万吨——内需侧尚未跟上。</div></div><div class=\"card fact\"><b class=\"k\">盘面验证</b><div class=\"v\">9/8 磷化工涨停 5 家、化肥题材涨停 10 家，金正大 2 板领涨，<strong>川发龙蟒、和邦生物、粤桂股份、潞化科技涨停</strong>，板块已启动。但<strong>云天化、兴发集团两只矿肥一体化龙头当日未涨停</strong>——资金先选了小市值弹性票，龙头未动说明市场对「配额向龙头集中」这一层逻辑还没定价。这是判断预期差是否仍在的关键观察点。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-08</div><div><div class=\"x\">磷肥出口解禁：9/1 起 MAP·DAP 恢复出口申报 · 国际 DAP FOB 875-915 美元/吨 · 内外价差 1149-1</div><div class=\"y\">为什么：本档为「农业·化肥涨价」的建档时点，后续二段催化均在此之上叠加</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「政策放开型」催化，<strong>三个要害</strong>：一是政策性质决定受益结构——许可证+配额管理意味着价差红利向头部集中，不是全行业普享，所以「谁能拿到额度」比「价差有多大」更重要；二是时间差是核心矛盾——9 月是纸面订单月、10 月才是实物离港月，中间隔着法检租船装港，业绩环在 10 月前无法闭合；三是现货端与预期背离——一铵周跌 150 元、二铵倒挂、复合肥开工仅 34%，说明内需侧还没跟上，出口能否填补缺口是关键。<strong>隐藏面</strong>：9/8 涨停的是川发龙蟒、和邦生物等中小弹性票，而真正有配额优势的云天化、兴发集团没涨停——市场目前按「涨价弹性」定价，还没按「配额分配」定价，这中间存在认知差。<br>① <strong>分水岭时点</strong>：10 月上旬实物出口离港数据（海关/港口口径），纸面订单转真实出货的唯一客观节点。<br>② <strong>传导的关键约束</strong>：配额管理下红利集中而非普惠；现货端一铵周跌 150 元、二铵倒挂显示内需疲弱，出口能否填补是关键。<br>③ <strong>待验证的核心变量</strong>：10 月实物离港量。放量则 1500 元/吨内外价差转化为利润；平淡则价差只停留在报价层面。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>9/1 MAP·DAP 出口申报恢复，政策已落地非预期</li><li>内外价差 1149-1500 元/吨客观存在，非想象</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强</span><ul><li>中国 3-8 月五个月管控 + 伊朗受阻，全球供给两缺口同时收紧</li><li>世界银行：2026 全球化肥价格指数涨超 30%</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">待兑现</span><ul><li>9 月纸面订单，实物离港到 10 月，三季报体现不出来</li><li>现货一铵周跌 150 元、二铵倒挂，短期报表是承压的</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">已启动</span><ul><li>9/8 磷化工涨停 5 家、化肥题材涨停 10 家，板块已启动</li><li>但龙头云天化、兴发集团未涨停，资金未对配额逻辑定价</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强、业绩待 10 月兑现、股价已启动但未走完——传导链完整，兑现节奏慢一拍。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>70%</strong>：四环中「业绩」环最弱，需等 10 月离港量补上；「股价」环已启动但尚未反映配额逻辑。</li><li><strong>边界要切开</strong>：受益的是<strong>有出口配额的一体化矿肥企业</strong>（自有磷矿+自有硫酸，不受硫磺外采涨价挤压）；受损的是<strong>外采硫磺的中小一铵厂</strong>——硫磺涨→外采厂亏 120-160 元/吨→越亏越不敢接单→开工降，这是负反馈。</li><li><strong>主线联动</strong>：与 oil-hormuz（霍尔木兹）档案一体两面——海峡受阻同时推高硫磺成本与磷肥国际报价；与 grain-price-record（全球粮价）档案构成<strong>「农业·化肥涨价」主线</strong>，粮价新高→种植意愿提升→化肥需求，同一主线的上下游印证。若海峡通航恢复，本档案的「供给刚性」环同步走弱。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 政策驱动</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>云天化</b><span class=\"code\">600096</span><span class=\"tag\">配额最受益·9/8未涨停</span><span class=\"cap\">28.73 元 · 流通 524 亿 · 9/16 +0.07%</span></div>\n    <div class=\"logic\">矿肥一体·国内龙头·配额受益面最大</div>\n    <div class=\"detail\">国内磷肥一哥，磷矿自给率高，是出口配额向头部倾斜机制下的最确定受益方。一体化结构让它同时吃出口提价与规避硫磺成本两头。9/8 板块涨停时它未涨停，市场尚未对其配额优势定价。</div>\n    \n    \n    <div class=\"risk\">⚠️ 大市值弹性温和</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>川发龙蟒</b><span class=\"code\">002312</span><span class=\"tag\">9/8涨停·一体化完整度高</span><span class=\"cap\">8.58 元 · 流通 162 亿 · 9/16 +0.82%</span></div>\n    <div class=\"logic\">矿酸肥一体·硫磺敞口小</div>\n    <div class=\"detail\">磷矿+硫酸+磷铵全流程自有，三个环节的自有度就是配额竞争力。9/8 涨停说明资金已开始按一体化受益线选票。</div>\n    \n    \n    <div class=\"risk\">⚠️ 已被资金选中，位置不低</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>兴发集团</b><span class=\"code\">600141</span><span class=\"tag\">自备水电·成本曲线最左</span><span class=\"cap\">29.44 元 · 流通 352 亿 · 9/16 +1.52%</span></div>\n    <div class=\"logic\">矿电化一体·自备水电·成本护城河深</div>\n    <div class=\"detail\">自备水电让它在高耗能的磷化工中处于成本曲线最左端，行业普遍承压时这一优势反而放大。产品线最全的平台型公司。9/8 未涨停，机构票属性重。</div>\n    \n    \n    <div class=\"risk\">⚠️ 产品线杂，弹性释放慢</div>\n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 政策驱动</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>和邦生物</b><span class=\"code\">603077</span><span class=\"tag\">磷+纯碱双主业</span><span class=\"cap\">2.27 元 · 流通 200 亿 · 9/16 +1.79%</span></div>\n    <div class=\"logic\">9/8涨停·纯碱稀释映射纯度</div>\n    <div class=\"detail\">9/8 涨停但映射纯度不足，纯碱业务会稀释磷肥出口对业绩的拉动。</div>\n    \n    \n    <div class=\"risk\">⚠️ 业务不纯，业绩弹性被摊薄</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>川金诺</b><span class=\"code\">300505</span><span class=\"tag\">外采加工型小盘</span><span class=\"cap\">18.93 元 · 流通 41 亿 · 9/16 +0.58%</span></div>\n    <div class=\"logic\">外采加工，市值小弹性大但缺矿端</div>\n    <div class=\"detail\">加工环节而非资源环节，硫磺涨价对其是成本挤压，理论上不在受益侧。</div>\n    \n    \n    <div class=\"risk\">⚠️ 缺矿端资源，难获配额</div>\n  </div></div><div class=\"t\">⚡ 情绪小票 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 政策驱动</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>金正大</b><span class=\"code\">002470</span><span class=\"tag\">9/8 二板领涨</span><span class=\"cap\">2.07 元 · 流通 68 亿 · 9/16 +0.00%</span></div>\n    <div class=\"logic\">复合肥龙头·2板领涨磷化工</div>\n    <div class=\"detail\">9/8 磷化工最高标（2 板），是板块情绪的风向标。但注意它是<strong>复合肥</strong>企业而非磷肥出口的直接受益方——复合肥开工率仅 34%、原料端跌+需求端弱，它涨停更多是板块情绪而非业绩逻辑。</div>\n    <div class=\"gene\">🧬 题材基因：化肥板块历次行情的情绪先锋，2022 俄乌化肥行情中曾连板</div>\n    \n    <div class=\"risk\">⚠️ 复合肥两头挤压，涨停是情绪非逻辑</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>粤桂股份</b><span class=\"code\">000833</span><span class=\"tag\">9/8涨停·硫铁矿配套</span><span class=\"cap\">19.86 元 · 流通 90 亿 · 9/16 -0.05%</span></div>\n    <div class=\"logic\">硫铁矿+制酸配套环节</div>\n    <div class=\"detail\">硫铁矿、硫酸配套环节的标的，硫磺涨价背景下国产硫铁矿的替代价值提升。</div>\n    <div class=\"gene\">🧬 题材基因：硫/糖双概念老票，涨价链传导的配套弹性品种</div>\n    \n    <div class=\"risk\">⚠️ 配套环节，传导链较远</div>\n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2021 磷酸铁锂带动磷化工：云天化三个月涨超 200%，川发龙蟒、川恒股份、兴发集团集体翻倍——产业逻辑+新能源需求双重驱动的一次。</li><li>2022 俄乌冲突全球化肥涨价：国内磷肥企业随国际价格走强，持续约一个季度，云天化、兴发集团走趋势。</li><li>2024 磷矿资源属性重估：川恒股份、云天化走慢牛行情，无连板特征，说明该板块历史上以趋势方式定价而非情绪连板。</li></ul></div>\n    <div class=\"tier\"><div class=\"t\">⛓️ 核心环节 · 传导链最短</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>云天化</b><span class=\"code\">600096</span><span class=\"tag\">国内磷肥一哥·矿肥一体·配额最受益</span></div>\n    <div class=\"logic\">磷矿资源自给率高 | 出口配额倾斜的核心对象 | 硫磺外采敞口小</div>\n    <div class=\"detail\">国内磷肥绝对龙头，磷矿资源自给率高——出口配额向「完成国内保供、核销率高」的头部企业倾斜，它是这一分配机制下最确定的受益方。逻辑的独特性在<strong>两头受益</strong>：国际 DAP FOB 875-915 美元对它是出口提价空间，而自有磷矿+配套硫酸装置又让它不受硫磺涨价（到岸破 1070 美元）的成本挤压。内外价差 1149-1500 元/吨，在一体化企业内部直接转化为毛利。9/8 板块涨停 5 家时它<strong>未涨停</strong>——市场目前按涨价弹性给中小票定价，还没按配额分配给它定价，这个认知差是它当前的位置特征。</div>\n    \n    <div class=\"confirm\">✔ 确认：10 月实物离港数据中云天化出口量占比居前 / 磷酸二铵报价上调</div>\n    <div class=\"risk\">⚠️ 大市值弹性温和，且出口法检政策可能限制弹性兑现的节奏</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>川发龙蟒</b><span class=\"code\">002312</span><span class=\"tag\">矿酸肥一体·9/8 涨停·资金先手</span></div>\n    <div class=\"logic\">磷矿+硫酸+磷铵全流程自有 | 硫磺外采敞口小 | 9/8 涨停被资金选中</div>\n    <div class=\"detail\">逻辑核心是<strong>「矿酸肥一体化」的完整度</strong>：自有磷矿解决资源端、自有硫酸装置规避硫磺涨价（这是外采加工型企业的致命伤，外采厂在硫磺到岸 1070 美元时每吨亏 120-160 元）、磷铵产能承接出口订单。在出口配额向一体化企业倾斜的机制下，这三个环节的自有度就是配额竞争力。9/8 磷化工涨停 5 家中它是其中之一，说明资金已经开始按「一体化受益」这条线选票——但涨幅和封单强度还需观察次日能否延续。</div>\n    \n    <div class=\"confirm\">✔ 确认：次日能否连板 / 磷铵出口订单公告</div>\n    <div class=\"risk\">⚠️ 已被资金选中，位置不低，需分歧确认</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>兴发集团</b><span class=\"code\">600141</span><span class=\"tag\">矿电化一体·自备水电·成本护城河最深</span></div>\n    <div class=\"logic\">磷矿+水电+化工全链 | 自备电力成本优势 | 磷化工产品线最全</div>\n    <div class=\"detail\">独特之处在于<strong>自备水电</strong>——磷化工是高耗能行业，电力成本占生产成本比重显著，自备水电让它在成本曲线上处于最左端，这一优势在行业普遍承压时（现货一铵周跌 150 元、二铵倒挂）反而放大。产品线覆盖磷矿石、黄磷、磷铵、精细磷化学品，是磷化工里品种最全的平台型公司。与云天化同属矿肥一体化，但它的成本护城河来自能源而非资源。9/8 与云天化一样<strong>未涨停</strong>——机构票属性重，弹性释放通常滞后于游资票。</div>\n    \n    <div class=\"confirm\">✔ 确认：黄磷/磷铵报价同步上调 / 三季报成本优势兑现为毛利</div>\n    <div class=\"risk\">⚠️ 大市值机构票，弹性释放慢；产品线杂会稀释磷肥纯度</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🔗 延伸环节 · 传导链较远</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>和邦生物</b><span class=\"code\">603077</span><span class=\"tag\">磷+纯碱双主业·9/8 涨停</span></div>\n    <div class=\"logic\">磷化工+纯碱双轮，纯碱业务会稀释映射纯度</div>\n    <div class=\"detail\">9/8 涨停的磷化工标的之一，但它的映射纯度不如纯磷肥企业——纯碱业务占相当比重，会稀释磷肥出口解禁对业绩的实际拉动。在板块启动时它跟随性较强，属于「有磷概念但不纯」的弹性票。</div>\n    \n    \n    <div class=\"risk\">⚠️ 业务不纯，磷肥涨价的业绩弹性会被其他业务摊薄</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>川金诺</b><span class=\"code\">300505</span><span class=\"tag\">外采加工型·小市值弹性</span></div>\n    <div class=\"logic\">外购磷矿与硫磺做加工，市值小弹性大但缺矿端资源</div>\n    <div class=\"detail\">处于产业链的加工环节而非资源环节——外购磷矿与硫磺做磷铵加工，两头受价。在硫磺到岸破 1070 美元的环境下，外采加工型是成本受损方，理论上不在受益侧；但小市值在板块情绪起来时弹性大，属于情绪映射而非逻辑映射。</div>\n    \n    \n    <div class=\"risk\">⚠️ 缺矿端资源，硫磺涨价对其是成本挤压；且难以获得出口配额</div>\n  </div></div></div>\n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>复合肥企业</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">复合肥开工率仅 34%，原料端跌价与需求端疲弱同时挤压，不在磷肥出口的受益侧。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>外采硫磺中小一铵厂</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">硫磺到岸破 1070 美元时，外采加工型每吨亏 120-160 元，越亏越不敢接单、开工率越降，是明确的成本受损方。</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">**政策放开型**：纸面价差巨大，兑现取决于实物出口量。基准参照：2024 年磷肥出口放开行情，法检周期导致从申报到离港约 45-60 天。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">云天化 ＞ 川发龙蟒 ＞ 兴发集团。排序理由：矿肥一体化程度决定内外价差的捕获能力，云天化磷矿石自给率最高、出口配额历史份额最大。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">金正大 ＞ 粤桂股份。gene：磷化工小盘票，2024 出口放开行情中作为末端补涨出现过连板，属典型第三波品种。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若 10 月上旬实物出口离港数据同比明显放量**且**矿肥一体化龙头补涨 → 逻辑状态由「纸面价差」升为「兑现利润」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 10 月上旬海关/港口口径实物出口离港数据同比放量 ② 云天化、兴发等龙头按配额逻辑补涨 ③ 国际 DAP FOB 维持在 875 美元以上。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 9 月底复合肥开工仍在 34% 以下、秋肥启动落空 ② 磷酸一铵延续周跌、二铵倒挂扩大 ③ 出口法检周期延长导致实物出海延期。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">内外价差 1149-1500 元/吨是**纸面**的——它只有在实物真正离港时才能进报表，而法检周期通常是 45-60 天。9/8 盘面已经给出提示：川发龙蟒涨停，但云天化、兴发集团未涨停，说明资金尚未按配额逻辑定价。盯 10 月上旬的海关出口数据，那是唯一的硬证据。</div></div></div>\n\n    \n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>10 月上旬实物出口离港数据（海关/港口口径）同比明显放量</b></li><li><b>云天化、兴发集团等矿肥一体化龙头补涨，资金开始按配额逻辑定价</b></li><li><b>磷酸一铵现货止跌回升，湖北出厂重回 4300 元/吨上方</b></li><li><b>复合肥开工率从 34% 升至 40% 以上，秋肥需求实质启动</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>9 月底复合肥开工仍在 34% 以下，秋肥启动落空</b></li><li><b>磷酸一铵延续周跌、二铵出厂与到站倒挂幅度扩大</b></li><li><b>出口配额/法检实际落地量明显低于预期，10 月离港数据持平或下滑</b></li><li><b>硫磺价格快速回落（霍尔木兹通航恢复），供给刚性环松动</b></li><li><b>川发龙蟒次日冲高回落，板块启动证伪</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">9 月中下旬</div><div class=\"wh\">黄淮海小麦底肥集中提货，复合肥开工率变化</div><div class=\"wy\">内需侧能否接棒出口，是逻辑闭环的第二条腿</div></div><div class=\"tkc\"><div class=\"w\">10 月上旬</div><div class=\"wh\">首批实物出口离港数据（海关/港口口径）</div><div class=\"wy\">纸面订单转为真实出货的唯一客观节点，全档案最关键</div></div><div class=\"tkc\"><div class=\"w\">每周</div><div class=\"wh\">磷酸一铵/二铵现货报价与开工率（生意社、隆众）</div><div class=\"wy\">现货端是涨是跌，直接决定业绩环能否闭合</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">霍尔木兹海峡通航量与硫磺到岸价</div><div class=\"wy\">决定硫磺成本与磷肥国际报价，与 oil-hormuz 档案交叉验证</div></div></div>\n\n    <div class=\"src\">数据来源：商务部化肥进口关税配额公告(9/3) ｜ 发改委发改经贸〔2026〕149号 ｜ 农资与市场肥料月刊(9/1) ｜ 生意社/隆众资讯价格数据(9/3) ｜ 开源化工行业周报(9/6) ｜ iFinD 盘面数据(9/8)</div>\n    <footer>磷肥出口解禁 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "copper-record", "title": "伦铜创历史新高", "date": "2026-09-07", "grade": "正式档", "pricing": "未定价", "crate": "fire", "search": "伦铜创历史新高 lme 铜突破 14530 美元/吨 · 超今年 1 月前纪录 · 年内 +17%，近 12 个月 +47% 产业周期 🔥 已启动", "card": "<a class=\"card-c\" href=\"#copper-record\" data-search=\"伦铜创历史新高 lme 铜突破 14530 美元/吨 · 超今年 1 月前纪录 · 年内 +17%，近 12 个月 +47% 产业周期 资源品涨价与煤焦链 未定价 紫金矿业 洛阳钼业 西部矿业 江西铜业 铜陵有色\" data-grade=\"正式档\" data-pricing=\"未定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-07</span>\n    <span class=\"crate fire\">🔥 已启动 产业周期</span>\n  </div>\n  <div class=\"ctitle\">伦铜创历史新高</div>\n  <div class=\"csub\">LME 铜突破 14530 美元/吨 · 超今年 1 月前纪录 · 年内 +17%，近 12 个月 +47%</div>\n  <div class=\"cpos\">LME 铜突破 14530 美元/吨创历史新高、年内 +17%；矿端为唯一受益方，中游加工与纯冶炼是成本受损方。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">资源品涨价与煤焦链</span>\n    \n    <span class=\"chip pri\">未定价</span>\n    <span class=\"chip\">标的 6</span>\n    <span class=\"nm\">紫金矿业</span><span class=\"nm\">洛阳钼业</span><span class=\"nm\">西部矿业</span><span class=\"nm\">江西铜业</span><span class=\"nm\">铜陵有色</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "\n  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-07 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 概念解析 · 2026-09-07</div>\n    <h1>伦铜创历史新高</h1>\n    <div class=\"sub\">LME 铜突破 14530 美元/吨 · 超今年 1 月前纪录 · 年内 +17%，近 12 个月 +47%</div>\n    <div class=\"badges\">\n      <span class=\"badge fire\">🔥 已启动</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：未定价</span>\n      <span class=\"badge neutral\">主线：资源品涨价与煤焦链</span>\n      \n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">carbon-black-record</span><span class=\"tag\" style=\"margin-right:4px\">thermal-coal-830</span></div>\n    <div class=\"posnote\">LME 铜突破 14530 美元/吨创历史新高、年内 +17%；矿端为唯一受益方，中游加工与纯冶炼是成本受损方。</div>\n    <details class=\"more\"><summary>展开定价状态详版（88 字）</summary><div class=\"pos\"><b>定价状态备注：</b>新高发生在 9 月 7 日夜间（LME 盘），属隔夜海外定价。A 股对应环节在催化发生时尚未交易，反应需以次日盘面为准。本档案不引用催化发生当日的 A 股收盘数据作为验证依据。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">核心事实</b><div class=\"v\">9/7 夜 LME 铜涨逾 1%，盘中突破 14530 美元/吨创历史新高，收 14494 美元，超过今年 1 月纪录；年内累计 +17%，过去 12 个月 +47%</div></div><div class=\"card fact\"><b class=\"k\">短期驱动</b><div class=\"v\">市场押注美国对精炼铜加征进口关税（232 调查 90 天决策期推算，9 月底为关键窗口）——数十万吨铜提前运往美国套利，全球其他地区供应收紧</div></div><div class=\"card fact\"><b class=\"k\">供给刚性</b><div class=\"v\">全球大型矿山老化 + Grasberg 复产推迟 + El Teniente 坍塌减产，2026 年铜矿产量或现 2017 年以来首次年度下滑</div></div><div class=\"card fact\"><b class=\"k\">需求长逻辑</b><div class=\"v\">电网投资 + AI 数据中心 + 电动车 + 能源基建持续拉动；大行预测 2026 年仅全球 AI 基建就消耗铜 71 万吨，相当于一个中型国家的消费量</div></div><div class=\"card fact warn\"><b class=\"k\">争议点</b><div class=\"v\">智利 Cesco 分析师：本轮更多是关税引发的金属转移驱动，而非终端需求旺盛；财通证券：LME 库存结束 4 个月下滑、洋山铜溢价走低、美国 8 月进口放缓——基本面支撑边际走弱</div></div><div class=\"card fact\"><b class=\"k\">A股映射</b><div class=\"v\">按环节划分：①<strong>矿端</strong>——拥有铜矿资源的企业，铜价上行直接抬升销售均价与资源重估价值（如紫金矿业、洛阳钼业、西部矿业）；②<strong>资源+冶炼一体化</strong>——同时拥有矿山与冶炼产能，资源端受益但冶炼加工费（TC）低迷会部分抵消（如江西铜业、铜陵有色）；③<strong>纯冶炼</strong>——以加工费为主要利润来源，铜价上涨不改善其加工利润；④<strong>铜加工/铜箔/线缆</strong>——成本受损方。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-07</div><div><div class=\"x\">伦铜创历史新高：LME 铜突破 14530 美元/吨 · 超今年 1 月前纪录 · 年内 +17%，近 12 个月 +47%</div><div class=\"y\">为什么：本档为「资源品涨价·铜」的建档时点，后续二段催化均在此之上叠加</div></div></div><div class=\"u\"><div class=\"w\">2026-09-16 16:04</div><div><div class=\"x\">LME 数据显示铜库存增加 4925 吨（同期铅 -1500 吨、锡 +100 吨、铝持平、镍 +210 吨、锌 +1450 吨）</div><div class=\"y\">为什么：本档第 06 步证伪点「LME 库存快速累积」首次出现迹象。4925 吨绝对值尚小，属观察级而非确认级；需连续 2-3 周累库才构成对「供给缺口」逻辑的实质证伪</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">① <strong>分水岭时点</strong>：9 月底美国 232 精炼铜关税决策。落地则关税套利引发的库存西进被确认、铜价获得第二支撑；落空则美国滞留的 69.5 万吨库存存在回流压力，短期驱动的性质会发生改变。<br>② <strong>传导的关键约束</strong>：短期驱动是关税套利引发的库存转移，属于「虚」的成分，与终端需求无关；而长期逻辑（矿端供给刚性 + AI/电网需求）是实的。两条驱动的时间尺度不同，需要用不同的数据分别跟踪。<br>③ <strong>待验证的核心变量</strong>：矿端供给刚性是否兑现为实际减量。中信建投测算 2026-2028 年缺口为 16/36/61 万吨且逐年扩大——这是长期逻辑能否支撑价格中枢的关键量化口径。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>LME 官方价格新高，数字精确</li><li>关税预期 + 供给收缩双驱动有出处</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强</span><ul><li>铜价中枢上移直接增厚矿企利润</li><li>资源品涨价主线再添旗舰品种</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">实</span><ul><li>紫金/洛钼铜业务占比高，价格弹性直接</li><li>冶炼端（TC 为负）受益弱于矿端</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">待观察</span><ul><li>催化发生在夜间，A 股尚未交易</li><li>观察点在次日矿端环节的定价反应</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强、业绩直接、股价待观察——隔夜海外定价，A 股映射窗口在次日。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>80%</strong>：价格新高已确认 + 矿企利润传导路径直接；主要瑕疵是短期驱动含关税套利的「虚」成分。</li><li><strong>边界要切开</strong>：受益的是<strong>上游矿端</strong>（销售均价与资源重估）；铜加工、铜箔、线缆等中游环节是成本受损方，利润模式为加工费，不随铜价上涨而改善。资源+冶炼一体化企业则两头对冲。</li><li>与资源品系列档案联动：8 月末以来锑、镍、稀土、铜先后点火，有色大板块的供给约束叙事在月度级别上形成共振。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·资源映射 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>紫金矿业</b><span class=\"code\">601899</span><span class=\"cap\">32.17 元 · 流通 6628 亿 · 9/16 +1.55%</span></div>\n    <div class=\"logic\">铜金双品种·全球资源量前列</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>洛阳钼业</b><span class=\"code\">603993</span><span class=\"cap\">17.84 元 · 流通 3115 亿 · 9/16 +1.13%</span></div>\n    <div class=\"logic\">刚果金 TFM/KFM·产量弹性最大</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>西部矿业</b><span class=\"code\">601168</span><span class=\"cap\">36.19 元 · 流通 862 亿 · 9/16 +1.17%</span></div>\n    <div class=\"logic\">玉龙铜矿二期放量</div>\n    \n    \n    \n    \n  </div></div><div class=\"t\">🧬 观察·待验证 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>江西铜业</b><span class=\"code\">600362</span><span class=\"cap\">44.10 元 · 流通 915 亿 · 9/16 +2.63%</span></div>\n    <div class=\"logic\">国内最大阴极铜·资源+冶炼一体</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>铜陵有色</b><span class=\"code\">000630</span><span class=\"cap\">6.09 元 · 流通 679 亿 · 9/16 +1.16%</span></div>\n    <div class=\"logic\">冶炼龙头+米拉多铜矿</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>云南铜业</b><span class=\"code\">000878</span><span class=\"cap\">16.83 元 · 流通 337 亿 · 9/16 +2.75%</span></div>\n    <div class=\"logic\">中铝系平台·冶炼规模居前</div>\n    \n    \n    \n    \n  </div></div></div>\n    <div class=\"tier\" style=\"margin-top:16px\"><div class=\"t\">📜 历史妖股记忆 / 同类行情参照</div><ul class=\"hist\" style=\"background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 12px 14px\"><li>2021/2-5 铜价首轮破万：紫金矿业、江西铜业走出一轮主升行情。</li><li>2024/3-5 铜价历史新高：矿端标的走趋势，部分小市值标的出现连板行情。</li><li>2026/1 前次纪录：紫金矿业、洛阳钼业主升，以趋势方式定价。</li></ul></div>\n    \n    \n    <div class=\"tier\"><div class=\"t\">🚫 不在传导链上</div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>铜箔/线缆等中游加工环节</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">利润模式为加工费，铜价上涨对其是成本挤压而非收益改善，不在传导链的受益侧。</div>\n    \n    \n    \n    \n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>纯冶炼企业（无自有矿）</b><span class=\"code\">—</span></div>\n    <div class=\"logic\">冶炼利润取决于加工费（TC）而非铜价，在 TC 为负的环境下，铜价上行不改善其盈利。</div>\n    \n    \n    \n    \n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>合规决策链 · 八要素</h2>\n    <div class=\"dchint\">固定八步。第 04 步只给客观确认条件、第 07 步合规剥离——全文不含价位/仓位/买卖建议。</div>\n    <div class=\"dc\"><div class=\"dcstep\"><div class=\"sn\">01<span class=\"sname\">定性</span></div><div class=\"st\">供给扰动 + 关税预期驱动的**资源品涨价**。基准参照：2024 年 5 月 COMEX 逼空行情，当时矿端领涨、加工端同步见顶。</div></div><div class=\"dcstep\"><div class=\"sn\">02<span class=\"sname\">主攻优先级</span></div><div class=\"st\">紫金矿业 ＞ 洛阳钼业 ＞ 西部矿业。排序理由：自有矿储量/市值比越高，铜价弹性越纯；紫金另有金铜双击。</div></div><div class=\"dcstep\"><div class=\"sn\">03<span class=\"sname\">情绪优先级</span></div><div class=\"st\">本档情绪票缺失（v5 前档案）。补记：历史铜价新高行情中，弹性小票多为加工端题材票而非矿端，需警惕「小市值 ≠ 高弹性」。</div></div><div class=\"dcstep\"><div class=\"sn\">04<span class=\"sname\">确认条件</span></div><div class=\"st\">若沪铜主力跟涨创阶段新高**且**美国 232 精炼铜关税落地 → 逻辑状态由「单边预期」升为「供需+政策双确认」。</div></div><div class=\"dcstep\"><div class=\"sn\">05<span class=\"sname\">验证点</span></div><div class=\"st\">① 沪铜主力跟涨并创阶段新高 ② 9 月底美国 232 精炼铜关税落地 ③ 洋山铜溢价走强（中国进口需求量化证据）。</div></div><div class=\"dcstep\"><div class=\"sn\">06<span class=\"sname\">证伪点</span></div><div class=\"st\">① 232 关税落空，美国滞留 69.5 万吨库存回流 ② 洋山铜溢价持续走低 ③ LME 库存快速累积。</div></div><div class=\"dcstep dim\"><div class=\"sn\">07<span class=\"sname\">仓位</span></div><div class=\"st\">交易者自管，本图不涉及。</div></div><div class=\"dcstep alert\"><div class=\"sn\">08<span class=\"sname\">特别提醒</span></div><div class=\"st\">这条链最大的坑是「铜价新高 = 铜企受益」——铜箔、线缆、纯冶炼（无自有矿）是明确的成本受损方，本档已列入剔除。真正的单一变量是 232 关税：落地则美国 69.5 万吨滞留库存继续锁死，落空则库存回流直接砸盘。</div></div></div>\n\n    \n\n    <h2><span class=\"p\">&gt;</span>信号对照台</h2>\n    <div class=\"sig\">\n    <div class=\"sigbox v\"><h3>✅ 验证信号</h3><div class=\"hint\">出现 → 逻辑成立度提升</div><ol><li><b>沪铜主力跟涨并创阶段新高</b></li><li><b>9 月底美国 232 精炼铜关税落地</b></li><li><b>LME 库存再度去化，或现货升水扩大</b></li></ol></div>\n    <div class=\"sigbox f\"><h3>❌ 证伪信号</h3><div class=\"hint\">出现 → 逻辑成立度下降</div><ol><li><b>232 关税落空，美国滞留的 69.5 万吨库存出现回流迹象</b></li><li><b>洋山铜溢价持续走低（中国进口需求走弱的量化证据）</b></li><li><b>LME 库存结束去化转为累积</b></li></ol></div>\n    </div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">9 月底</div><div class=\"wh\">美国 232 精炼铜关税决策（90 天决策期推算）</div><div class=\"wy\">短期驱动（关税套利）的开关，决定库存西进是延续还是逆转</div></div><div class=\"tkc\"><div class=\"w\">每周</div><div class=\"wh\">LME 铜库存与现货升水</div><div class=\"wy\">区分「金属转移」与「真实紧缺」的核心数据</div></div><div class=\"tkc\"><div class=\"w\">每月</div><div class=\"wh\">洋山铜溢价与美国精炼铜进口量</div><div class=\"wy\">中国需求的量化证据，财通证券已提示边际走弱</div></div><div class=\"tkc\"><div class=\"w\">季度</div><div class=\"wh\">全球铜矿产量与供需缺口（中信建投测算 2026-2028 为 16/36/61 万吨）</div><div class=\"wy\">长期逻辑的量化锚，决定价格中枢能否维持</div></div></div>\n\n    <div class=\"src\">数据来源：财联社/第一财经 9/7 LME 快讯 ｜ 国际金融报 9/8 复盘 ｜ 财通证券铜价研究（9/7）｜ 中信建投铜供需测算</div>\n    <footer>伦铜创历史新高 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>\n"}, {"id": "med-industry-15th-plan", "title": "医药工业“十五五”规划落地", "date": "2026-09-21", "grade": "正式档", "pricing": "部分定价", "crate": "bolt", "search": "医药工业发展十五五规划 十部门 9/18 印发 创新药 CRO AI制药 近岸蛋白 20cm 涨停 诺禾致源 百普赛斯 南华生物3连板 医药生物板块领涨 产业周期", "card": "<a class=\"card-c\" href=\"#med-industry-15th-plan\" data-search=\"医药工业发展十五五规划 十部门 9/18 印发 创新药 CRO AI制药 近岸蛋白 20cm 涨停 诺禾致源 百普赛斯 南华生物3连板 医药生物板块领涨 产业周期\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-21</span>\n    <span class=\"crate bolt\">⚡ 政策兑现级 · 规划落地点燃创新药/CRO/AI制药，湿实验服务领涨 产业周期</span>\n  </div>\n  <div class=\"ctitle\">医药工业“十五五”规划落地</div>\n  <div class=\"csub\">十部门 9/18 印发《医药工业发展“十五五”规划》 · 9/21 医药生物领涨、近岸蛋白 20cm 涨停创历史新高 · 南华生物 3 连板</div>\n  <div class=\"cpos\">规划在创新药、CRO、AI 制药等方向定调；9/21 板块领涨但以湿实验服务/重组蛋白为主，传统仿制药与创新药分化明显。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">创新药出海</span>\n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 8</span>\n    <span class=\"nm\">近岸蛋白</span><span class=\"nm\">诺禾致源</span><span class=\"nm\">百普赛斯</span><span class=\"nm\">成都先导</span><span class=\"nm\">药明康德</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-21 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 产业周期 · 2026-09-21</div>\n    <h1>医药工业“十五五”规划落地</h1>\n    <div class=\"sub\">十部门 9/18 印发《医药工业发展“十五五”规划》 · 9/21 医药生物领涨、近岸蛋白 20cm 涨停创历史新高 · 南华生物 3 连板</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 政策兑现级 · 湿实验服务领涨，传统仿制药未动 产业周期</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：创新药出海</span>\n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--acc)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">innovative-drug-outbound-120b</span></div>\n    <div class=\"posnote\">9/18 工信部、国家发改委等十部门联合印发《医药工业发展“十五五”规划》，八个方面部署 25 项任务；9/21 A 股医药生物板块爆发，近岸蛋白 20cm 涨停创历史新高，南华生物 3 连板。</div>\n    <details class=\"more\"><summary>展开定价状态详版（280 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化为<strong>政策文件 + 前序主线共振</strong>：《规划》9/18 印发后首个交易日（9/21）医药板块即领涨。但领涨结构是<strong>湿实验服务/重组蛋白/基因测序</strong>（近岸蛋白、诺禾致源、百普赛斯），属于「AI 制药+卖水人」逻辑，而非创新药出海主线（百济、恒瑞当日未领涨）。定价主体与 9/16 创新药出海档案的「卖水人抢跑」判断一致——政策把板块 Beta 点燃，资金仍选择可验证收入的服务环节。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">政策本体</b><div class=\"v\">9/18 工信部、国家发改委等<strong>十部门联合印发《医药工业发展“十五五”规划》</strong>，围绕创新药、医疗器械、产业基础、数智化转型等<strong>八个方面部署 25 项任务</strong>。这是「十五五」开局年医药工业的顶层设计文件，直接回应 9/14 药监局披露的「年内对外授权突破 1200 亿美元」这一产业事实，为创新药与产业链服务环节提供政策背书。</div></div><div class=\"card fact\"><b class=\"k\">9/21 盘面验证</b><div class=\"v\">9/21（沪指 +0.97%、深成指 +0.65%、创业板指 +0.8%，普涨日）：医药生物板块领涨，<strong>近岸蛋白 20cm 涨停创历史新高</strong>；南华生物 3 连板（+9.99% 报 11.01 元）、百花医药 3 天 2 板、新华制药、哈药股份涨停；瑞康医药 +10.09%。AI 制药产业链：诺禾致源、近岸蛋白封死 20cm 涨停，百普赛斯刷新上市新高，万邦医药、成都先导、泓博医药居涨幅前列。CRO 概念：汇宇制药、成都先导涨幅居前。</div></div><div class=\"card fact warn\"><b class=\"k\">结构分化</b><div class=\"v\">领涨的是<strong>湿实验服务（重组蛋白、试验仪器、基因测序）</strong>，即「AI 制药卖水人」，而非创新药授权方本体——与 innovative-drug-outbound-120b 档案 9/16 的判断一致：资金持续偏好可验证收入的服务环节。传统仿制药（哈药、新华）属于低价补涨，<strong>创新药龙头（恒瑞、百济）当日未领涨</strong>，定价主体仍未切换。</div></div><div class=\"card fact\"><b class=\"k\">资金与宏观背景</b><div class=\"v\">9/21 央行召开外资金融机构座谈会，行长潘功胜表示将<strong>实施好适度宽松的货币政策</strong>，为金融市场平稳运行营造良好环境。全市场超 4500 只个股飘红，大金融（南华期货、华金资本）直线涨停，政策面+流动性双顺风。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-14</div><div><div class=\"x\">国家药监局披露年内创新药对外授权突破 1200 亿美元、同比 +36%（对应档案 innovative-drug-outbound-120b）。</div><div class=\"y\">为什么：产业事实先行——出海金额创纪录是政策出台的产业基础。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-18</div><div><div class=\"x\">十部门联合印发《医药工业发展“十五五”规划》，八个方面部署 25 项任务。</div><div class=\"y\">为什么：政策本体落地，首个交易日即被市场定价。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-21</div><div><div class=\"x\">医药生物板块领涨，近岸蛋白 20cm 涨停创历史新高，南华生物 3 连板；AI 制药湿实验服务链集体走强。</div><div class=\"y\">为什么：本档案成立点——政策催化兑现，但领涨结构与 9/16 判断一致（卖水人优先）。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「政策兑现型」催化，<strong>三个要害</strong>：一是<strong>政策是放大器而非起点</strong>——出海 1200 亿美元（9/14 药监局口径）与 CXO 订单（9/15 业绩说明会）才是产业事实，规划只是把已在发生的产业趋势写进文件，因此行情持续性取决于产业数据而非文件本身；二是<strong>资金结构未变</strong>——领涨的仍是湿实验服务/重组蛋白（近岸蛋白、诺禾致源、百普赛斯），创新药授权方未启动，与 innovative-drug-outbound-120b 档案「定价主体错位」的判断互相印证；三是<strong>传统仿制药涨停属于补涨</strong>——新华制药、哈药股份的涨停更多是板块 Beta 与低价属性，不是「十五五」规划的映射本体。<strong>隐藏面</strong>：规划 25 项任务的具体细则（创新药审评、医保支付、集采规则）尚未披露，细则落地才是下一段催化；若细则利好商业化放量，定价主体才会从「卖水人」切换到「授权方/产品方」。<br>① <strong>分水岭时点</strong>：规划细则与配套政策（医保、审评）发布节奏；9/22 及后续医药板块能否延续而非一日游。<br>② <strong>传导的关键约束</strong>：湿实验服务（近岸、诺禾、百普）短期涨幅已大，追高风险与业绩兑现节奏（三季报）之间的时间差。<br>③ <strong>待验证的核心变量</strong>：创新药授权方（恒瑞、百济）是否出现超额转正——若转正，主线定价主体完成切换，行情升级。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>十部门「十五五」规划落地，8 方面 25 项任务</li><li>产业事实：年内授权 1200 亿美元（+36%）、首付款超百亿</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强</span><ul><li>9/21 医药板块领涨，近岸蛋白 20cm 涨停创历史新高</li><li>湿实验服务/重组蛋白/AI 制药细分最强</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">待三季报验证</span><ul><li>服务环节收入可验证，授权方收入确认存在时滞</li><li>传统仿制药涨停属 Beta 补涨，与规划无直接映射</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">已启动</span><ul><li>南华生物 3 连板、百花医药 3 天 2 板</li><li>创新药龙头未动，定价主体仍是服务商</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强、业绩看三季报、股价已启动但只动了服务环节——「授权方未定价」的错位与创新药出海主线完全一致。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>55%</strong>：政策环与情绪环闭合，业绩环与「授权方定价」环待验证。</li><li><strong>边界要切开</strong>：受益第一梯队是<strong>AI 制药湿实验服务</strong>（近岸蛋白、诺禾致源、百普赛斯）与<strong>CRO</strong>（成都先导、药明康德、美迪西、奥浦迈）；第二梯队是<strong>创新药授权方</strong>（恒瑞、百济）——前提是细则利好商业化；补涨的<strong>传统仿制药</strong>（哈药、新华）非主线本体。</li><li><strong>主线联动</strong>：与 innovative-drug-outbound-120b 档案同主线，本档案是其「政策面」催化段；若授权方超额转正，两条档案同步升级。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·湿实验服务 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>近岸蛋白</b><span class=\"code\">688137</span><span class=\"tag\">重组蛋白龙头</span><span class=\"cap\">9/21 20cm 涨停创历史新高</span></div>\n    <div class=\"logic\">AI 制药湿实验卖水人</div>\n    <div class=\"detail\">重组蛋白、mRNA 原料酶供应商，是「AI 制药+湿实验验证」最纯标的之一，9/21 20cm 涨停创上市新高，领涨全板块。</div>\n    <div class=\"risk\">⚠️ 短期涨幅大，三季报前有兑现压力</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>诺禾致源</b><span class=\"code\">688315</span><span class=\"tag\">基因测序服务</span><span class=\"cap\">9/21 20cm 涨停</span></div>\n    <div class=\"logic\">科研测序+AI 制药数据服务</div>\n    <div class=\"detail\">基因测序科研服务龙头，AI 制药对湿实验数据需求放大其服务量，9/21 封死 20cm 涨停。</div>\n    <div class=\"risk\">⚠️ 海外收入占比高，汇率与地缘扰动</div>\n  </div></div><div class=\"t\">🧬 观察·CRO 与授权方 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>百普赛斯</b><span class=\"code\">688076</span><span class=\"tag\">重组蛋白第二极</span><span class=\"cap\">9/21 刷新上市新高</span></div>\n    <div class=\"logic\">生物试剂供应商</div>\n    <div class=\"detail\">重组蛋白、检测试剂供应商，9/21 刷新上市新高，与近岸蛋白同属「卖水人」逻辑。</div>\n    <div class=\"risk\">⚠️ 生物试剂竞争加剧，毛利率承压</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>成都先导</b><span class=\"code\">688222</span><span class=\"tag\">DEL 平台</span><span class=\"cap\">9/21 涨幅居前</span></div>\n    <div class=\"logic\">AI 制药+DEL 库</div>\n    <div class=\"detail\">DNA 编码化合物库（DEL）+AI 制药平台，9/21 居 CRO 涨幅前列，是创新药企研发外包的直接受益方。</div>\n    <div class=\"risk\">⚠️ 订单确认周期长，收入弹性滞后</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>药明康德</b><span class=\"code\">603259</span><span class=\"tag\">CXO 一哥</span><span class=\"cap\">9/21 跟随板块</span></div>\n    <div class=\"logic\">全链条卖水人</div>\n    <div class=\"detail\">一体化 CXO 龙头，规划细则若落地将进一步打开订单空间；但体量大，弹性弱于小市值服务商。</div>\n    <div class=\"risk\">⚠️ 海外监管与实体清单扰动</div>\n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">近期</div><div class=\"wh\">「十五五」规划细则（创新药审评、医保、集采配套）发布节奏</div><div class=\"wy\">下一段催化的唯一来源</div></div><div class=\"tkc\"><div class=\"w\">9/22 起</div><div class=\"wh\">医药板块能否延续而非一日游（近岸、诺禾、百普持续性）</div><div class=\"wy\">情绪环能否升级为趋势</div></div><div class=\"tkc\"><div class=\"w\">三季报窗口</div><div class=\"wh\">湿实验服务商收入与订单增速</div><div class=\"wy\">「卖水人」逻辑的业绩闭环</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">恒瑞/百济 A 股相对指数超额是否转正</div><div class=\"wy\">定价主体切换的客观信号</div></div></div>\n\n    <div class=\"src\">数据来源：工信部等十部门《医药工业发展“十五五”规划》（9/18）· 央广网/格隆汇/新浪财经 9/21 A 股收评（沪指 +0.97%、医药领涨、近岸蛋白 20cm 涨停、南华生物 3 连板）· 证券时报 9/21（瑞康医药 +10.09%）· 财联社 9/22《昨日行情回顾》（AI 制药产业链、诺禾致源/近岸蛋白涨停、百普赛斯新高）· 中国人民银行 9/21 外资金融机构座谈会（适度宽松货币政策）· 同花顺行情 9/21</div>\n    <footer>医药工业十五五规划 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>"}, {"id": "property-new-model", "title": "地产新模式·板块连续大涨", "date": "2026-09-21", "grade": "正式档", "pricing": "部分定价", "crate": "bolt", "search": "住建部 加快构建房地产发展新模式 9/21 地产板块午后持续走高 世联行4连板 万科2连板 绿地控股2连板 我爱我家 金融街 华发股份涨停 资金净流入 政策驱动", "card": "<a class=\"card-c\" href=\"#property-new-model\" data-search=\"住建部 加快构建房地产发展新模式 9/21 地产板块午后持续走高 世联行4连板 万科2连板 绿地控股2连板 我爱我家 金融街 华发股份涨停 资金净流入 政策驱动\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-21</span>\n    <span class=\"crate bolt\">⚡ 政策驱动级 · 连续两日大涨+资金净流入，但基本面验证缺位 政策驱动</span>\n  </div>\n  <div class=\"ctitle\">地产新模式·板块连续大涨</div>\n  <div class=\"csub\">住建部明确加快构建房地产发展新模式 · 9/21 世联行 4 连板、万科 A 2 连板、绿地控股 2 连板 · 9/22 资金大幅净流入、板块连续两日大涨</div>\n  <div class=\"cpos\">政策定调+低位修复双击，服务链（我爱我家、世联行）弹性最大；但销售/开工数据未验证，行情性质待 9/22 后确认。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">地产链</span>\n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 9</span>\n    <span class=\"nm\">万科A</span><span class=\"nm\">保利发展</span><span class=\"nm\">金地集团</span><span class=\"nm\">我爱我家</span><span class=\"nm\">世联行</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-21 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 政策驱动 · 2026-09-21</div>\n    <h1>地产新模式·板块连续大涨</h1>\n    <div class=\"sub\">住建部明确加快构建房地产发展新模式 · 9/21 世联行 4 连板、万科 A 2 连板、绿地控股 2 连板 · 9/22 资金大幅净流入、板块连续两日大涨</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 政策驱动级 · 连续两日大涨+资金净流入，基本面验证缺位 政策驱动</span>\n      <span class=\"badge neutral\">政策驱动</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：地产链</span>\n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">storage-cell-capacity-control</span><span class=\"tag\" style=\"margin-right:4px\">（暂无同主线档案，独立建档）</span></div>\n    <div class=\"posnote\">住建部明确「加快构建房地产发展新模式」；9/21 地产板块午后持续走高，世联行 4 连板、万科 A 2 连板；9/22 证券时报：地产板块连续两日大涨、资金大幅净流入。</div>\n    <details class=\"more\"><summary>展开定价状态详版（270 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化为<strong>政策定调 + 低位修复</strong>：住建部「加快构建房地产发展新模式」的表态叠加 9/21 央行座谈会「适度宽松货币政策」表态，地产板块两个交易日连续大涨，9/22 早间证券时报确认资金大幅净流入。<strong>盘面结构</strong>：弹性最大的是<strong>地产服务链</strong>（世联行 4 连板、我爱我家涨停）而非开发龙头，说明资金按「轻资产服务+政策反转预期」定价；万科 A 2 连板（9/21 +9.94%）提供板块 Beta。<strong>未定价层面</strong>：销售、开工、库存等基本面数据尚未验证，「新模式」的具体抓手（收储、保障房、现房销售）未披露，行情停留在预期阶段。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">政策面</b><div class=\"v\">住建部明确<strong>加快构建房地产发展新模式</strong>；9/21 央行外资金融机构座谈会，潘功胜表态<strong>实施适度宽松的货币政策</strong>，为金融市场平稳运行营造环境。政策与流动性同向，构成地产板块两日连续大涨的宏观背景。</div></div><div class=\"card fact\"><b class=\"k\">9/21 盘面验证</b><div class=\"v\">9/21（沪指 +0.97%）：房地产板块午后持续走高。同花顺数据：<strong>绿地控股 +10.34%（2 连板）、华发股份 +10.08%、世联行 +10.03%（4 连板）、我爱我家 +10.00%、华丽家族 +9.95%、万科 A +9.94%（2 连板）、金融街 +9.92%、华远控股 +9.91%、金地集团 +9.78%</strong>；保利发展 +6.77%、滨江集团 +6.80%、信达地产 +7.51%。板块内涨停家数居前，万科 A 2 连板为开发龙头提供板块 Beta。</div></div><div class=\"card fact warn\"><b class=\"k\">资金与结构</b><div class=\"v\">9/22 证券时报：地产板块<strong>连续两日大涨、资金大幅净流入</strong>。领涨结构上，<strong>地产服务链（世联行、我爱我家）弹性大于开发龙头</strong>——资金按「轻资产+政策反转预期」定价，而非按「销售修复」定价；万科、保利等开发龙头是 Beta 载体。</div></div><div class=\"card fact warn\"><b class=\"k\">未定价/风险</b><div class=\"v\">基本面验证缺位：<strong>新房销售、开工、库存、房价数据均未出现改善信号</strong>，「新模式」的具体抓手（收储规模、保障房、现房销售制度）尚未披露细则。历史经验上，地产政策行情在「预期→数据」空窗期最易反复；若 9/22 冲高回落，本轮定性即为政策脉冲而非趋势反转。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-21 前</div><div><div class=\"x\">住建部表态加快构建房地产发展新模式；地产板块上周起回暖（财联社：房地产板块延续上周回暖势头）。</div><div class=\"y\">为什么：政策定调先行，板块已在低位预热。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-21</div><div><div class=\"x\">地产板块午后持续走高：世联行 4 连板、万科 A 2 连板、绿地控股 2 连板，我爱我家、金融街、华发股份等涨停。</div><div class=\"y\">为什么：本档案成立点——涨停梯队完整（服务链+开发龙头），板块行情确认。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-22</div><div><div class=\"x\">证券时报：地产板块连续两日大涨，资金大幅净流入。</div><div class=\"y\">为什么：连续性确认——两日大涨+资金流入，行情非一日游。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「政策驱动型」行情，<strong>三个要害</strong>：一是<strong>驱动源是政策预期而非基本面</strong>——「新模式」的具体抓手未披露，销售/开工数据未改善，行情建立在「政策会持续加码」的预期上，预期一旦被证伪（细则低于预期）或数据持续恶化，回撤风险大；二是<strong>服务链弹性 > 开发龙头</strong>——世联行 4 连板、我爱我家涨停说明资金买的是「轻资产+政策反转」逻辑，而万科 2 连板只提供板块 Beta，这决定了个股选择方向；三是<strong>「两日大涨+资金净流入」是延续信号但不是基本面信号</strong>——9/22 资金流入确认的是市场共识在加强，与地产实际销售无关，需警惕情绪顶。<strong>隐藏面</strong>：本轮行情的真正变量可能是<strong>流动性（适度宽松货币政策）</strong>而非地产政策本身——若 9/16 之后政策组合拳继续（降准/降息），地产作为低估值+高 beta 板块会持续承接流动性，此时基本面反而次要；反之若货币端无后续，地产行情高度受限。<br>① <strong>分水岭时点</strong>：「新模式」细则（收储、保障房）发布；9/22 收盘能否守住涨幅。<br>② <strong>传导的关键约束</strong>：9 月销售数据与 30 城高频成交是否改善——数据不改善，行情止于预期。<br>③ <strong>待验证的核心变量</strong>：9/22 及本周地产板块是否持续获得资金净流入，以及万科/保利能否走出连板（龙头高度决定板块高度）。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>住建部定调「加快构建房地产发展新模式」</li><li>央行表态适度宽松货币政策</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强但未验证</span><ul><li>9/21 板块大涨：世联行 4 连板、万科 2 连板</li><li>9/22 资金大幅净流入、连续两日大涨</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">未改善</span><ul><li>销售/开工/库存数据未现改善信号</li><li>政策行情未传导至报表</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">已启动</span><ul><li>服务链（世联行、我爱我家）领涨，开发龙头跟涨</li><li>低位修复特征明显，持续性待 9/22 后确认</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强但基本面未验证、业绩环完全缺位、股价已启动——典型的「政策预期行情」，胜负手在细则与数据。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>45%</strong>：政策环与情绪环闭合，业绩环缺位，数据环待验证。</li><li><strong>边界要切开</strong>：弹性最大的是<strong>地产服务链</strong>（世联行、我爱我家、金融街）与<strong>低位低价开发股</strong>（华发、绿地、华丽家族）；Beta 载体是<strong>龙头开发</strong>（万科 A、保利发展、金地集团）；物业（特发服务等）为次级联动。</li><li><strong>风险提示</strong>：若「新模式」细则空泛或 9 月销售继续下行，本档案有被快速证伪的风险；历史地产行情多以脉冲结束，不宜以趋势反转的仓位对待。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·地产服务链 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 政策驱动</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>世联行</b><span class=\"code\">002285</span><span class=\"tag\">4 连板</span><span class=\"cap\">9/21 +10.03% 报 3.18 元</span></div>\n    <div class=\"logic\">轻资产服务+政策反转</div>\n    <div class=\"detail\">地产综合服务商，9/21 晋级 4 连板，是本轮「新模式」预期下弹性最大的标的，资金按轻资产服务重估定价。</div>\n    <div class=\"risk\">⚠️ 4 连板后短线分歧加剧</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>我爱我家</b><span class=\"code\">000560</span><span class=\"tag\">涨停</span><span class=\"cap\">9/21 +10.00% 报 3.19 元</span></div>\n    <div class=\"logic\">存量房经纪服务</div>\n    <div class=\"detail\">经纪服务龙头，「新模式」若指向存量市场运营（租赁、经纪、资管），其商业模式直接受益，9/21 涨停。</div>\n    <div class=\"risk\">⚠️ 交易量不回升则收入无支撑</div>\n  </div></div><div class=\"t\">🧬 Beta·开发龙头 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 政策驱动</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>万科A</b><span class=\"code\">000002</span><span class=\"tag\">2 连板</span><span class=\"cap\">9/21 +9.94% 报 3.65 元</span></div>\n    <div class=\"logic\">板块 Beta 载体</div>\n    <div class=\"detail\">开发龙头，9/21 2 连板提供板块高度；其市值体量决定本轮行情上限，是判断「行情级别」的锚。</div>\n    <div class=\"risk\">⚠️ 债务与现金流压力仍在</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>保利发展</b><span class=\"code\">600048</span><span class=\"tag\">跟涨</span><span class=\"cap\">9/21 +6.77% 报 5.68 元</span></div>\n    <div class=\"logic\">央企开发+收储受益</div>\n    <div class=\"detail\">央企龙头，若「新模式」含存量收储与保障房建设，保利是执行主体之一，政策受益纯度高于民企。</div>\n    <div class=\"risk\">⚠️ 毛利率下行趋势未止</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>金地集团</b><span class=\"code\">600383</span><span class=\"tag\">跟涨</span><span class=\"cap\">9/21 +9.78% 报 2.47 元</span></div>\n    <div class=\"logic\">低位修复</div>\n    <div class=\"detail\">低价+高 beta，9/21 涨幅居前，属低位资金修复品种，弹性与风险并存。</div>\n    <div class=\"risk\">⚠️ 基本面最弱，纯情绪驱动</div>\n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">9/22 收盘</div><div class=\"wh\">板块能否守住涨幅、万科能否 3 连板</div><div class=\"wy\">行情级别与持续性的一线信号</div></div><div class=\"tkc\"><div class=\"w\">近期</div><div class=\"wh\">「房地产发展新模式」细则（收储规模、保障房、现房销售）</div><div class=\"wy\">预期能否升级为政策的唯一来源</div></div><div class=\"tkc\"><div class=\"w\">每周</div><div class=\"wh\">30 城新房成交、二手房挂牌与价格</div><div class=\"wy\">基本面验证，决定行情高度</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">货币宽松后续动作（降准/降息/LPR）</div><div class=\"wy\">本轮行情的真正流动性驱动源</div></div></div>\n\n    <div class=\"src\">数据来源：住建部「加快构建房地产发展新模式」表态 · 中国人民银行 9/21 外资金融机构座谈会（适度宽松货币政策）· 证券时报 9/22（地产板块连续两日大涨、资金大幅净流入）· 格隆汇/央广网 9/21 A 股收评（世联行 4 连板、万科 2 连板）· 同花顺行情 9/21（板块个股涨跌幅）</div>\n    <footer>地产新模式 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>"}, {"id": "eo-price-record", "title": "环氧乙烷刷新年内新高", "date": "2026-09-21", "grade": "正式档", "pricing": "未定价", "crate": "bolt", "search": "环氧乙烷 价格刷新年内高点 华东9200-9700元/吨 华中10100元/吨 较9月初+21% 触及2021年11月以来高点 中石化上调出厂价 供应紧俏 卫星化学 化工涨价链", "card": "<a class=\"card-c\" href=\"#eo-price-record\" data-search=\"环氧乙烷 价格刷新年内高点 华东9200-9700元/吨 华中10100元/吨 较9月初+21% 触及2021年11月以来高点 中石化上调出厂价 供应紧俏 卫星化学 化工涨价链\" data-grade=\"正式档\" data-pricing=\"未定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-21</span>\n    <span class=\"crate bolt\">⚡ 涨价实锤级 · 价格创四年新高、供应紧俏，A 股相关标的尚未定价 化工涨价链</span>\n  </div>\n  <div class=\"ctitle\">环氧乙烷刷新年内新高</div>\n  <div class=\"csub\">截至 9/21 华东 9200-9700 元/吨、华中站上 10100 元/吨 · 较 9 月初 +21%、触及 2021 年 11 月以来高点 · 联产装置优先排产乙二醇、外售量收缩</div>\n  <div class=\"cpos\">环氧乙烷价格创四年新高，供应端（乙二醇排产挤占+乙烯原料紧张）是主因；但 A 股映射待定价，卫星化学 9/21 仅 +2.33%。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">化工涨价链</span>\n    <span class=\"chip pri\">未定价</span>\n    <span class=\"chip\">标的 5</span>\n    <span class=\"nm\">卫星化学</span><span class=\"nm\">奥克股份</span><span class=\"nm\">永安药业</span><span class=\"nm\">中国石化</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-21 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 化工涨价链 · 2026-09-21</div>\n    <h1>环氧乙烷刷新年内新高</h1>\n    <div class=\"sub\">截至 9/21 华东 9200-9700 元/吨、华中站上 10100 元/吨 · 较 9 月初 +21%、触及 2021 年 11 月以来高点 · 联产装置优先排产乙二醇、外售量收缩</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 涨价实锤级 · 价格创四年新高、供应紧俏，A 股相关标的尚未定价 化工涨价链</span>\n      <span class=\"badge neutral\">化工涨价链</span>\n      <span class=\"badge neutral\">定价状态：未定价</span>\n      <span class=\"badge neutral\">主线：化工涨价链</span>\n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span cla
