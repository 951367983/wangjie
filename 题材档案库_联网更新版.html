ss=\"tag\" style=\"margin-right:4px\">tio2-price-hike-6</span><span class=\"tag\" style=\"margin-right:4px\">carbon-black-record</span><span class=\"tag\" style=\"margin-right:4px\">（化工涨价主线）</span></div>\n    <div class=\"posnote\">截至 9/21 华东环氧乙烷 9200-9700 元/吨、华中站上 10100 元/吨，较 9 月初涨超 21%，刷新年内纪录并触及 2021 年 11 月以来高点；供应紧俏（乙二醇排产挤占+乙烯原料紧张），A 股标的尚未定价。</div>\n    <details class=\"more\"><summary>展开定价状态详版（250 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化为<strong>商品价格创四年新高 + 供应收缩</strong>：9 月以来中石化等主力厂商多次上调环氧乙烷出厂价，中信建投口径本周均价 9200 元/吨（周环比 +660 元）。<strong>盘面状态</strong>：9/21 卫星化学 +2.33%（成交 8.51 亿、主力净流入 3852 万），涨幅远低于商品涨幅，A 股环氧乙烷链<strong>尚未形成定价</strong>。与 tio2/carbon-black 两条化工涨价档案对比：环氧乙烷是「供应收缩+成本传导」双驱动，性质更硬，但市场注意力仍在医药与地产，本题材处于「价格先行、权益未跟」阶段。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">价格事实</b><div class=\"v\">截至 9/21：<strong>华东市场 9200-9700 元/吨，华中站上 10100 元/吨</strong>，较 9 月初涨幅超 21%，刷新年内纪录，触及<strong>2021 年 11 月以来高点</strong>。中信建投口径：本周环氧乙烷均价 9200 元/吨、较上周 +660 元；生意社 9/21 均差 395 元/吨（由正向缩小重新扩大）。</div></div><div class=\"card fact\"><b class=\"k\">供应收缩是主因</b><div class=\"v\">① <strong>联产装置优先排产乙二醇</strong>，直接压缩环氧乙烷商品外售量，市场流通货源持续缩减；② <strong>部分外采乙烯的生产企业因原料供应不足被迫停车或下调开工负荷</strong>；③ 个别装置近期停车，加剧缺货预期，助推现货加价走高。需求端刚需为主，供应主导定价。</div></div><div class=\"card fact warn\"><b class=\"k\">产业链盈利分化</b><div class=\"v\">证券时报 9/22 标题即《环氧乙烷价格刷新年内高点 产业链上下游盈利分化》：<strong>一体化厂商（自产乙烯）受益</strong>——成本锁定、售价上行，价差扩张；<strong>外采乙烯/外购环氧乙烷的下游</strong>（减水剂单体、表面活性剂、乙醇胺等）成本承压。这是本档案筛选标的的关键分界。</div></div><div class=\"card fact\"><b class=\"k\">9/21 盘面验证</b><div class=\"v\">9/21 卫星化学 <strong>+2.33%</strong>（成交 8.51 亿、主力净流入 3852.60 万）；环氧乙烷链其余标的（奥克股份、永安药业等）无显著异动。9/21 市场主线在医药与地产，<strong>化工涨价题材未获资金关注</strong>——商品端创新高与权益端冷清的背离，正是「未定价」状态的量化证据。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-16 前</div><div><div class=\"x\">9 月中旬环氧乙烷已创年内新高：9/16 华东 9200 元/吨，较上半年高点高 200 元、较去年同期高 2900 元（卓创）。</div><div class=\"y\">为什么：第一段——价格年内新高，但市场未关注。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-18</div><div><div class=\"x\">中石化化销华东分公司上调环氧乙烷价格，金联创称「刷新年内最高、触及近五年高点」。</div><div class=\"y\">为什么：第二段——主力厂商连续调价，价格进入加速段。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-21</div><div><div class=\"x\">华东 9200-9700 元/吨、华中 10100 元/吨，较 9 月初 +21%，触及 2021 年 11 月以来高点；中信建投周报确认均价 +660 元。</div><div class=\"y\">为什么：本档案成立点——价格与涨幅双创新高，供应收缩逻辑完整。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「供应收缩型」涨价，<strong>三个要害</strong>：一是<strong>驱动是供给不是需求</strong>——乙二醇排产挤占+乙烯原料紧张+装置停车，三条都指向供给端收缩，需求端刚需平稳，这决定了涨价持续性取决于乙二醇-环氧乙烷的相对盈利与乙烯供应；二是<strong>受益方必须切「一体化」</strong>——自产乙烯的厂商（卫星化学、中国石化体系）享受价差扩张，外采乙烯的厂商反而两头受挤；下游减水剂单体、表活企业成本承压，属于受损方；三是<strong>当前是「商品先行、权益未跟」</strong>——9/21 卫星化学仅 +2.33%，市场注意力在医药/地产，一旦主线切换，本题材有补涨空间。<strong>隐藏面</strong>：乙二醇价格受地缘（中东原料）影响已进口断供（卓创 9/16 口径），若乙烯-乙二醇链条继续紧张，环氧乙烷供给收缩会加剧；但也要警惕「涨价函 → 价格 → 权益」链条中，商品见顶后权益补涨的错位风险——参照 tio2 档案教训（函涨 4.5%、基准价仅涨 1.00%）。<br>① <strong>分水岭时点</strong>：中石化等主力厂商下一轮调价函；乙二醇-环氧乙烷价差走向。<br>② <strong>传导的关键约束</strong>：现货价格能否站稳 10000 元/吨上方，以及是否出现下游抵制（减产/替代）。<br>③ <strong>待验证的核心变量</strong>：卫星化学等一体化标的成交与超额是否放大——若放量，本档案从「未定价」转「定价中」。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>华东 9200-9700 元/吨、华中 10100 元/吨，较 9 月初 +21%</li><li>触及 2021 年 11 月以来高点，主力厂商连续调价</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强但分化</span><ul><li>供应收缩：乙二醇排产挤占+乙烯原料紧张+装置停车</li><li>一体化厂商价差扩张，外采厂商成本承压</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">待传导</span><ul><li>一体化（自产乙烯）企业利润弹性取决于价差持续性</li><li>下游减水剂单体、表活成本上升</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">未定价</span><ul><li>9/21 卫星化学仅 +2.33%，主力净流入 3852 万</li><li>市场主线在医药/地产，化工涨价题材冷清</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强但分化、业绩看价差持续性、股价未定价——「商品先行、权益未跟」，与 9/16 钛白粉档案形成对照（彼时权益已炒过一波，此处尚未启动）。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>50%</strong>：变化环与供应环扎实，业绩环待价差验证，股价环未启动。</li><li><strong>边界要切开</strong>：受益的是<strong>乙烯-环氧乙烷一体化</strong>（卫星化学、中国石化）；中性偏受益的是<strong>乙二醇联动</strong>（东华能源等轻烃裂解）；受损的是<strong>外采乙烯/外购环氧乙烷的下游</strong>（减水剂单体、表活、乙醇胺企业）。</li><li><strong>主线联动</strong>：与 tio2-price-hike-6、carbon-black-record 同属化工涨价链——但注意本档是「供应收缩型」（可持续性优于成本推动型），需与炭黑档案的「成本传导陷阱」区分。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·一体化厂商 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 化工涨价链</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>卫星化学</b><span class=\"code\">002648</span><span class=\"tag\">轻烃一体化龙头</span><span class=\"cap\">9/21 +2.33% 报 27.54 元</span></div>\n    <div class=\"logic\">自产乙烯+环氧乙烷弹性</div>\n    <div class=\"detail\">轻烃裂解一体化龙头，自产乙烯锁定成本，环氧乙烷涨价直接扩张价差；9/21 +2.33%、主力净流入 3852 万，是本档最纯受益标的，当前仅小幅定价。</div>\n    <div class=\"risk\">⚠️ 乙烷原料价格与汇率波动</div>\n  </div></div><div class=\"t\">🧬 观察·联动与上游 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 化工涨价链</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中国石化</b><span class=\"code\">600028</span><span class=\"tag\">环氧乙烷主力供应</span><span class=\"cap\">9/21 随化工板块</span></div>\n    <div class=\"logic\">中石化化销连续调价主体</div>\n    <div class=\"detail\">本轮调价函主力（中石化化销华东分公司多次上调），一体化体系受益但体量巨大，弹性有限，属板块 Beta。</div>\n    <div class=\"risk\">⚠️ 体量大，弹性被稀释</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>奥克股份</b><span class=\"code\">300082</span><span class=\"tag\">环氧乙烷衍生品</span><span class=\"cap\">9/21 无显著异动</span></div>\n    <div class=\"logic\">减水剂单体/表活</div>\n    <div class=\"detail\">环氧乙烷下游加工（聚醚单体、表活），成本上升承压；若产品能顺价，则利润中性，纯弹性不如一体化厂商。</div>\n    <div class=\"risk\">⚠️ 下游顺价能力决定盈亏</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>永安药业</b><span class=\"code\">002365</span><span class=\"tag\">牛磺酸原料</span><span class=\"cap\">9/21 无显著异动</span></div>\n    <div class=\"logic\">环氧乙烷采购方</div>\n    <div class=\"detail\">牛磺酸生产商，环氧乙烷是主要原料，成本上行对其利润是负面项，属受损观察标的。</div>\n    <div class=\"risk\">⚠️ 原料涨价直接挤压毛利</div>\n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">每日</div><div class=\"wh\">环氧乙烷现货价（生意社/卓创口径）能否站稳万元上方</div><div class=\"wy\">涨价持续性的直接刻度</div></div><div class=\"tkc\"><div class=\"w\">每日</div><div class=\"wh\">中石化化销调价函节奏</div><div class=\"wy\">主力厂商态度，本轮涨价的风向标</div></div><div class=\"tkc\"><div class=\"w\">每周</div><div class=\"wh\">乙二醇-环氧乙烷价差与乙烯价格</div><div class=\"wy\">联产排产逻辑是否延续</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">卫星化学成交/超额是否放大</div><div class=\"wy\">「未定价」转「定价中」的信号</div></div></div>\n\n    <div class=\"src\">数据来源：证券时报/上海证券报 9/22《环氧乙烷价格刷新年内高点 产业链上下游盈利分化》（华东 9200-9700、华中 10100、较 9 月初 +21%、2021 年 11 月以来高点）· 中信建投基础化工周报 9/22（均价 9200 元、周环比 +660 元、供应稳中偏紧）· 卓创资讯 9/16（年内新高、乙二醇进口断供背景）· 金联创 9/18（中石化化销调价、触及近五年高点）· 生意社 9/21（均差 395 元/吨）· 新浪财经行情 9/21（卫星化学 +2.33%、主力净流入 3852 万）</div>\n    <footer>环氧乙烷 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>"}, {"id": "power-semi-hike-onsemi", "title": "安森美再发涨价函·功率半导体第四轮", "date": "2026-09-21", "grade": "正式档", "pricing": "部分定价", "crate": "bolt", "search": "安森美 涨价通知 2026年10月10日生效 只对新订单 一客一议 功率半导体 英飞凌 德州仪器 意法半导体 AI驱动高景气 芯联集成 MOSFET IGBT 涨价 产业周期", "card": "<a class=\"card-c\" href=\"#power-semi-hike-onsemi\" data-search=\"安森美 涨价通知 2026年10月10日生效 只对新订单 一客一议 功率半导体 英飞凌 德州仪器 意法半导体 AI驱动高景气 芯联集成 MOSFET IGBT 涨价 产业周期\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-21</span>\n    <span class=\"crate bolt\">⚡ 涨价实锤级 · 安森美 10/10 生效年内二轮，海外四巨头齐涨，A 股功率链再获催化 产业周期</span>\n  </div>\n  <div class=\"ctitle\">安森美再发涨价函·功率半导体第四轮</div>\n  <div class=\"csub\">安森美 10/10 起新价格生效（年内二轮、只对新订单、一客一议）· 英飞凌年内两轮已落地（AI 服务器电源+10-20%）· 芯联集成 Q3 对 MOSFET/IGBT 调价</div>\n  <div class=\"cpos\">海外功率四巨头 2026 年多轮调价，AI 算力需求是核心驱动；本档为 power-semi-hike3 的「二段催化」确认，A 股涨价链再获催化。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">半导体涨价</span>\n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 7</span>\n    <span class=\"nm\">斯达半导</span><span class=\"nm\">时代电气</span><span class=\"nm\">新洁能</span><span class=\"nm\">扬杰科技</span><span class=\"nm\">芯联集成</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-21 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 产业周期 · 2026-09-21</div>\n    <h1>安森美再发涨价函·功率半导体第四轮</h1>\n    <div class=\"sub\">安森美 10/10 起新价格生效（年内二轮、只对新订单、一客一议）· 英飞凌年内两轮已落地（AI 服务器电源+10-20%）· 芯联集成 Q3 对 MOSFET/IGBT 调价</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 涨价实锤级 · 安森美 10/10 生效年内二轮，海外四巨头齐涨，A 股功率链再获催化 产业周期</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：半导体涨价</span>\n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--acc)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">power-semi-hike3</span><span class=\"tag\" style=\"margin-right:4px\">mlcc-murata-eol</span></div>\n    <div class=\"posnote\">安森美发布涨价通知，新价格 2026-10-10 起生效（年内第二轮、只对新订单、\"一客一议\"）；英飞凌年内两轮已落地，AI 服务器电源等品类 +10-20%；本档是 power-semi-hike3 的二段催化确认。</div>\n    <details class=\"more\"><summary>展开定价状态详版（260 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化为<strong>海外大厂连续调价 + AI 算力需求</strong>：安森美 9/18 发布涨价通知（10/10 生效、年内二轮、只对新订单、一客一议）；英飞凌年内两轮（第二轮 7 月落地，AI 服务器电源、车规功率器件 +10%-20%）；TI 计划 7/1 提价（年内第二轮）；ST 年内三轮回调价。国内芯联集成 Q3 对 MOSFET、IGBT 调价。<strong>盘面状态</strong>：9/21 市场主线在医药/地产，功率链未获当日定价，但 8 月以来「AI 算力重塑产能流向」逻辑持续发酵，板块为<strong>部分定价</strong>——海外涨价的传导与 A 股龙头（斯达、时代电气）的提价确认仍需跟踪。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">安森美涨价函</b><div class=\"v\">安森美（onsemi）近日发布涨价通知，将对<strong>广泛的产品系列实施价格调整，新价格 2026-10-10 起生效</strong>；今年上半年该公司已进行过一轮调价。官方口径：<strong>原材料、制造、能源和基础设施成本持续上涨</strong>是主因。市场信息：<strong>只对新订单涨价、价格\"一客一议\"</strong>，不同客户涨幅不同（中信建投/雪球转载口径）。</div></div><div class=\"card fact\"><b class=\"k\">海外巨头 2026 调价全景</b><div class=\"v\">2026 年 AI 驱动功率半导体高景气，<strong>英飞凌、德州仪器、意法半导体、安森美相继多轮调价</strong>：英飞凌年内两轮（第二轮 7 月落地，AI 服务器电源、车规功率器件等核心品类涨幅 10%-20%）；TI 计划自 7/1 提价（PMIC 及 MOSFET，年内第二轮，近 12 个月累计调价 5 次口径）；ST 年内完成 3 轮正式/合约调价。证券时报 9/22：《行业步入高景气周期 功率半导体迎涨价潮》。</div></div><div class=\"card fact\"><b class=\"k\">国内跟进</b><div class=\"v\">21 世纪经济报道：<strong>芯联集成三季度对 MOSFET、IGBT 调价</strong>；多家国内功率厂商传出酝酿新一轮调价消息（电子工程专辑 8/19）。AI 算力需求爆发推动成熟制程产能向 AI 相关环节集聚，叠加供应链成本上行、供需收紧与本土供应链建设需求，半导体进入量价齐升上行周期（证券时报 8/21）。</div></div><div class=\"card fact warn\"><b class=\"k\">与 power-semi-hike3 的关系</b><div class=\"v\">本档是原档案 power-semi-hike3（功率半导体三波涨价）的<strong>二段催化</strong>：安森美 10/10 生效构成「年内二轮+第四家巨头」的确认。与 8 月那轮相比，本轮特点是<strong>AI 算力需求真实放量</strong>（AI 服务器电源、算力基础设施订单）叠加成熟制程产能向 AI 环节倾斜，而非单纯成本推动——涨价可持续性高于上半年。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026 上半年</div><div><div class=\"x\">ST、TI、美光、SK 海力士完成年内多轮调价，TI 近 12 个月累计调价 5 次；英飞凌完成第一轮。</div><div class=\"y\">为什么：第一段——涨价潮启动，成本推动为主。</div></div></div><div class=\"u\"><div class=\"w\">2026-07</div><div><div class=\"x\">英飞凌第二轮落地：AI 服务器电源、车规功率器件等 +10%-20%；TI 计划 7/1 提价（PMIC、MOSFET）。</div><div class=\"y\">为什么：第二段——AI 算力需求开始主导涨价结构。</div></div></div><div class=\"u\"><div class=\"w\">2026-08</div><div><div class=\"x\">证券时报《AI 算力重塑产能流向 功率半导体领涨产业链》；芯联集成 Q3 对 MOSFET、IGBT 调价；对应档案 power-semi-hike3 建档。</div><div class=\"y\">为什么：第三段——国内厂商跟进，A 股链条开始定价。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-18/21</div><div><div class=\"x\">安森美发布涨价通知（10/10 生效、年内二轮、只对新订单）；证券时报 9/22《行业步入高景气周期 功率半导体迎涨价潮》。</div><div class=\"y\">为什么：本档案成立点——第四家海外巨头确认，涨价潮由「三巨头」扩为「四巨头」。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「AI 需求+供给收缩」双驱动的涨价周期，<strong>三个要害</strong>：一是<strong>本轮涨价与上半年性质不同</strong>——上半年以成本推动为主（铜价、能源、运费），本轮由 AI 算力真实需求拉动成熟制程产能向 AI 环节倾斜，AI 服务器电源、车规功率器件涨幅 10-20% 且具备订单支撑，涨价可持续性显著更强；二是<strong>传导路径是「海外原厂 → 国内厂商 → 产品提价 → 报表」</strong>——安森美只对新订单、\"一客一议\"意味着涨价是渐进的，国内厂商的提价确认（芯联集成已动）比海外函件更有定价意义；三是<strong>A 股定价结构分层</strong>——8 月板块已炒过一轮（power-semi-hike3），当前处于「部分定价」：IGBT 龙头（斯达、时代电气）需等中报后提价兑现，中小功率（新洁能、扬杰）弹性大但持续性差。<strong>隐藏面</strong>：海外大厂涨价函在 2021-2022 周期中被证明「函件≠成交价」，需跟踪实际成交价与交期；若 AI 资本开支证伪或成熟制程产能扩张落地，涨价逻辑会被快速反转——这是与 8 月那轮相同的尾部风险。<br>① <strong>分水岭时点</strong>：10/10 安森美新价格生效后的渠道成交反馈；国内龙头三季报提价确认。<br>② <strong>传导的关键约束</strong>：国产功率厂商是否真正跟进提价（函件 vs 成交），以及车规/工业需求能否接力 AI。<br>③ <strong>待验证的核心变量</strong>：斯达半导、时代电气等龙头的产品提价公告或调研确认——一旦落地，本档从「部分定价」转「定价中」。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>安森美 10/10 涨价生效（年内二轮），海外四巨头齐涨</li><li>英飞凌 AI 服务器电源、车规器件 +10-20%</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强</span><ul><li>AI 算力需求拉动成熟制程产能向 AI 倾斜</li><li>国内芯联集成 Q3 已对 MOSFET/IGBT 调价</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">待三季报验证</span><ul><li>海外涨价向国内传导存在时滞</li><li>国产龙头提价确认是关键（函件≠成交价）</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">部分定价</span><ul><li>8 月板块已炒过一轮，当前处消化期</li><li>9/21 主线在医药/地产，功率链未获当日催化定价</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强、业绩看三季报提价、股价部分定价——与 8 月 power-semi-hike3 相比，本轮多了「AI 需求真实放量」这一升级项。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>55%</strong>：变化环与需求环扎实，业绩环待提价确认，股价环部分定价。</li><li><strong>边界要切开</strong>：受益第一梯队是<strong>IGBT/功率模块龙头</strong>（斯达半导、时代电气、士兰微、华润微）——看提价确认；第二梯队是<strong>中小功率器件</strong>（新洁能、扬杰科技、宏微科技、东微半导）——弹性大、持续性差；<strong>碳化硅/第三代半导体</strong>（芯联集成、天岳先进）与 AI 电源放量相关。</li><li><strong>主线联动</strong>：与 power-semi-hike3（三波涨价）同主线，本档为其二段确认；与 mlcc-murata-eol（村田停产 MLCC）同属「被动+功率涨价」产业周期共振。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·IGBT/功率模块龙头 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>斯达半导</b><span class=\"code\">603290</span><span class=\"tag\">IGBT 龙头</span><span class=\"cap\">9/21 随板块</span></div>\n    <div class=\"logic\">车规+AI 电源 IGBT</div>\n    <div class=\"detail\">车规 IGBT 龙头，AI 服务器电源与车规功率器件涨价直接相关；10/10 安森美生效后的渠道反馈与三季报提价确认为核心跟踪点。</div>\n    <div class=\"risk\">⚠️ 车规需求波动与产能扩张摊薄</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>时代电气</b><span class=\"code\">688187</span><span class=\"tag\">轨交+功率双主业</span><span class=\"cap\">9/21 随板块</span></div>\n    <div class=\"logic\">高压功率器件</div>\n    <div class=\"detail\">中车旗下功率半导体平台，高压 IGBT/SiC 与轨交、电网需求绑定，涨价周期中弹性与确定性兼具。</div>\n    <div class=\"risk\">⚠️ 轨交主业周期属性拖累估值</div>\n  </div></div><div class=\"t\">🧬 观察·中小功率与第三代半导体 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>新洁能</b><span class=\"code\">605111</span><span class=\"tag\">MOSFET 平台</span><span class=\"cap\">9/21 随板块</span></div>\n    <div class=\"logic\">中低压 MOSFET 弹性</div>\n    <div class=\"detail\">中低压 MOSFET 设计龙头，对涨价最敏感，弹性大但需验证提价能否落到报表。</div>\n    <div class=\"risk\">⚠️ 设计公司提价传导弱于 IDM</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>扬杰科技</b><span class=\"code\">300373</span><span class=\"tag\">IDM 功率</span><span class=\"cap\">9/21 随板块</span></div>\n    <div class=\"logic\">二极管+MOSFET IDM</div>\n    <div class=\"detail\">IDM 模式，自有产能，涨价周期中量价齐升，海外收入占比较高、直接对标海外大厂提价。</div>\n    <div class=\"risk\">⚠️ 海外渠道库存周期</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>芯联集成</b><span class=\"code\">688469</span><span class=\"tag\">已实际调价</span><span class=\"cap\">Q3 已对 MOSFET/IGBT 调价</span></div>\n    <div class=\"logic\">已落地提价确认</div>\n    <div class=\"detail\">国内少数已公开确认 Q3 调价的功率代工厂（21 世纪经济报道口径），是本轮国内传导链条中「先行者」，定价意义强于预期型标的。</div>\n    <div class=\"risk\">⚠️ 代工模式毛利率受稼动率影响大</div>\n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">10/10</div><div class=\"wh\">安森美新价格生效后的渠道成交与交期反馈</div><div class=\"wy\">「函件≠成交价」的验证窗口</div></div><div class=\"tkc\"><div class=\"w\">三季报窗口</div><div class=\"wh\">斯达、时代电气、扬杰毛利率与产品均价变化</div><div class=\"wy\">涨价是否进入报表的唯一硬证据</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">国内厂商提价函/调研确认（芯联集成之后谁跟进）</div><div class=\"wy\">传导链条的下一环</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">AI 资本开支（云厂商 capex）与成熟制程产能扩张节奏</div><div class=\"wy\">涨价可持续性的底层驱动</div></div></div>\n\n    <div class=\"src\">数据来源：证券时报/人民财讯 9/18-9/22（安森美再发涨价函、10/10 生效、年内二轮；行业步入高景气周期功率半导体迎涨价潮）· 中信建投/雪球 9/21（只对新订单、一客一议）· 证券时报 8/21（英飞凌年内两轮、AI 服务器电源+10-20%、芯联集成 Q3 调价）· 电子工程专辑 8/19（ST/TI 多轮调价、TI 累计 5 次）</div>\n    <footer>安森美涨价函 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>"}, {"id": "publishing-media-15th", "title": "出版「十五五」规划引爆传媒涨停潮", "date": "2026-09-24", "grade": "正式档", "pricing": "部分定价", "crate": "fire", "search": "出版业发展十五五规划 国家新闻出版署 9/21印发 数智化转型 出版融合发展 传媒板块涨停潮 文化传媒板块涨幅居首 内蒙新华5连板 新华文轩3连板 华媒控股 新华传媒收购界面财联社 重组 游族网络 北京文化 政策驱动", "card": "<a class=\"card-c\" href=\"#publishing-media-15th\" data-search=\"出版业发展十五五规划 国家新闻出版署 9/21印发 数智化转型 出版融合发展 传媒板块涨停潮 文化传媒板块涨幅居首 内蒙新华5连板 新华文轩3连板 华媒控股 新华传媒收购界面财联社 重组 游族网络 北京文化 政策驱动\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-22</span>\n    <span class=\"crate fire\">🔥 政策兑现级 · 「十五五」规划+龙头重组双催化，传媒 8 股涨停、板块涨幅居首 政策驱动</span>\n  </div>\n  <div class=\"ctitle\">出版「十五五」规划引爆传媒涨停潮</div>\n  <div class=\"csub\">9/21 国家新闻出版署印发《出版业发展“十五五”规划》 · 9/22 文化传媒板块涨幅居首 +3.15%、主力净流入 28.9 亿 · 内蒙新华 5 连板、新华文轩 3 连板、8 股涨停</div>\n  <div class=\"cpos\">政策（出版数智化转型）+ 个股（新华传媒收购界面财联社）双催化共振；板块情绪已点燃，但规划细则与重组落地仍有空间，定价未到顶。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">政策驱动</span>\n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 10</span>\n    <span class=\"nm\">内蒙新华</span><span class=\"nm\">新华文轩</span><span class=\"nm\">新华传媒</span><span class=\"nm\">华媒控股</span><span class=\"nm\">引力传媒</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-22 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 政策驱动 · 2026-09-22</div>\n    <h1>出版「十五五」规划引爆传媒涨停潮</h1>\n    <div class=\"sub\">9/21 国家新闻出版署印发《出版业发展“十五五”规划》 · 9/22 文化传媒板块涨幅居首 +3.15%、主力净流入 28.9 亿 · 内蒙新华 5 连板、新华文轩 3 连板、8 股涨停</div>\n    <div class=\"badges\">\n      <span class=\"badge fire\">🔥 政策兑现级 · 「十五五」规划+龙头重组双催化 政策驱动</span>\n      <span class=\"badge neutral\">政策驱动</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：出版数智化 · 传媒重组</span>\n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--acc)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">（本档为传媒/出版主线首档）</span></div>\n    <div class=\"posnote\">9/21 国家新闻出版署印发《出版业发展“十五五”规划》，明确出版数智化转型与融合发展路径；叠加新华传媒（9/18 披露重组预案收购界面财联社）复牌连续涨停，9/22 文化传媒板块涨幅居首（+3.15%）、8 股涨停、全天主力净流入 28.90 亿元。</div>\n    <details class=\"more\"><summary>展开定价状态详版（260 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化为<strong>政策文件 + 龙头重组共振</strong>：规划给出出版业未来五年「数智化转型」顶层方向，重组个案（新华传媒收购界面财联社）把传媒板块估值天花板打开，二者在 9/22 形成共振。盘面状态：内蒙新华 5 连板、北京文化 4 连板、新华文轩 3 连板，板块已充分发酵；但规划细则（具体扶持政策/资金）与重组交易落地（审核、交割）均未兑现，情绪之外仍有基本面待定价，故定为<strong>部分定价</strong>。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">政策本体</b><div class=\"v\">9/21 国家新闻出版署发布《出版业发展“十五五”规划》通知。规划提出到 <strong>2030 年推出一批经典作品</strong>，将深度融合发展作为出版单位<strong>数智化赋能、信息化转型</strong>的重要路径，以出版融合发展工程为牵引，推动重塑组织架构、业务流程、产品样态、传播体系、激励机制，统筹推进<strong>报业、印刷、发行等领域数智化转型</strong>；同时加强网络出版优质内容生产传播，加强<strong>网络文学、网络游戏监管</strong>，引导规范健康发展。</div></div><div class=\"card fact\"><b class=\"k\">9/22 盘面验证</b><div class=\"v\">文化传媒板块<strong>涨幅居首、整体 +3.15%，全天主力资金净流入 28.90 亿元</strong>；8 只个股涨停：<strong>内蒙新华 5 连板</strong>（603230，情绪龙头，隔夜挂单买 53.23 亿/卖 10.65 亿）、<strong>新华文轩 3 连板</strong>（601811）、华媒控股（000607）、新华传媒（600825）、引力传媒（603598）、中国出版（601949）、天威视讯（002238）等；游族网络（002174）盘初约 1 分钟直线涨停、风语筑（603466）2 连板、北京文化（000802）4 连板、出版传媒涨停。Wind 口径午盘传媒行业主力净流入超 20 亿元，省广集团居首。</div></div><div class=\"card fact warn\"><b class=\"k\">个股催化：新华传媒重组</b><div class=\"v\">核心催化剂之一：<strong>新华传媒 9/18 晚披露重组预案——拟发行股份购买上海界面财联社科技股份有限公司 100% 股权，发行价 3.93 元/股，预计构成重大资产重组</strong>。界面财联社为头部财经媒体，此次收编被市场解读为<strong>打开传媒板块估值天花板</strong>；新华传媒 9/21 复牌一字涨停，9/22 竞价继续封板。注意：重组仍需审核、存在不确定性，属「预期定价」而非「落地定价」。</div></div><div class=\"card fact\"><b class=\"k\">资金与结构</b><div class=\"v\">9/22 涨停榜口径：<strong>传媒、电子、医药生物三个行业上榜个股均 8 只</strong>，传媒与电子、计算机形成三大涨停潮方向；市场资金在「政策+重组」主线（传媒）、「AI 算力重估」主线（电子/计算机）、「医药主线」之间轮动。传媒板块 Beta 与低价属性（出版国企）并存，需区分「规划映射本体」与「板块普涨」。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-18</div><div><div class=\"x\">新华传媒披露重组预案：发行股份购买界面财联社 100% 股权（3.93 元/股，构成重大资产重组）。</div><div class=\"y\">为什么：个股级催化，市场开始重估传媒估值天花板。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-21</div><div><div class=\"x\">国家新闻出版署印发《出版业发展“十五五”规划》；新华传媒复牌一字涨停。</div><div class=\"y\">为什么：政策本体落地 + 龙头个股复牌，板块催化双发。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-22</div><div><div class=\"x\">文化传媒板块涨幅居首（+3.15%）、主力净流入 28.90 亿、8 股涨停；内蒙新华 5 连板、新华文轩 3 连板、北京文化 4 连板。</div><div class=\"y\">为什么：本档案成立点——政策+重组共振兑现为涨停潮，板块已启动。</div></div></div></div><div class=\"u\"><div class=\"w\">2026-09-24</div><div><div class=\"x\">大盘大跌（沪指 -1.22%）中出版传媒逆势领涨：新华文轩 5 连板、新华传媒 4 连板一字板（封单超 420 万手）、内蒙新华 7 天 6 板、天威视讯 3 连板。</div><div class=\"y\">为什么：出版主线在调整日逆势走强，连板梯队完整（5/4/3），资金认可度高。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「政策+重组」双催化的传媒主线，<strong>三个要害</strong>：一是<strong>政策给了五年方向</strong>——「十五五」规划把出版数智化、网络出版监管、融合发展写进顶层文件，出版国企的转型逻辑获得政策背书，持续性看后续配套细则与具体项目落地；二是<strong>重组个案放大估值天花板</strong>——新华传媒收购界面财联社把「传媒+财经内容」的资产重组预期点燃，但重组尚未过审，属于预期定价，一旦审核进展或中止将直接扰动情绪；三是<strong>涨停结构需区分映射本体</strong>——内蒙新华（新华系）、中国出版、新华文轩是「规划+国企改革」直接映射，游族网络、风语筑、北京文化更多是板块 Beta 与重组预期扩散，若主线退潮后者的回撤风险更大。<strong>隐藏面</strong>：规划强调「加强网络文学、网络游戏监管」——监管表述若配套具体措施落地，游戏/网文板块可能反向承压，注意与传媒普涨区分。<br>① <strong>分水岭时点</strong>：规划配套细则（扶持资金、试点名单）与新华传媒重组审核进展。<br>② <strong>传导的关键约束</strong>：涨停潮后情绪兑现速度——5 连板（内蒙新华）与 4 连板（北京文化）已处于高位，追高风险累积。<br>③ <strong>待验证的核心变量</strong>：传媒板块能否从「涨停潮情绪」升级为「业绩/订单落地」，出版国企三季报与重组过会进度。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>「十五五」规划印发，数智化转型定调</li><li>新华传媒重组预案（收购界面财联社）</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强</span><ul><li>9/22 板块涨幅居首 +3.15%、主力净流入 28.9 亿</li><li>8 股涨停，内蒙新华 5 连板、北京文化 4 连板</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">待细则与重组</span><ul><li>出版国企转型收入兑现依赖细则落地</li><li>重组过审前为预期定价，业绩贡献未确认</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">已启动</span><ul><li>板块涨停潮、情绪龙头 5 连板</li><li>规划细则/重组落地仍有未定价空间</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强、业绩看细则与重组、股价已启动——政策+重组共振的板块级行情，情绪已点燃、基本面待落地。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>55%</strong>：政策环与情绪环闭合，业绩环与重组过会环待验证。</li><li><strong>边界要切开</strong>：第一梯队是<strong>新华系出版国企+规划映射本体</strong>（内蒙新华、新华文轩、中国出版、新华传媒）；第二梯队是<strong>重组/内容平台扩散</strong>（游族网络、风语筑、北京文化、引力传媒、天威视讯、皖新传媒）——弹性大但退潮回撤也大；<strong>监管敏感</strong>的网络游戏/网文（若细则从严）可能反向承压。</li><li><strong>主线联动</strong>：本档为传媒/出版主线首档；后续若 AI 内容/数据要素（出版数据资产）方向出现催化，可与本档并线跟踪。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·规划映射本体（新华系出版） <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 政策驱动</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>内蒙新华</b><span class=\"code\">603230</span><span class=\"tag\">情绪龙头</span><span class=\"cap\">9/22 5 连板</span></div>\n    <div class=\"logic\">出版数智化+新华系改革</div>\n    <div class=\"detail\">内蒙出版发行国企，本轮传媒涨停潮情绪龙头，5 连板、隔夜挂单买 53 亿；「十五五」规划数智化转型直接映射，弹性最大。</div>\n    <div class=\"risk\">⚠️ 连板高位，情绪退潮回撤风险大</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>新华文轩</b><span class=\"code\">601811</span><span class=\"tag\">出版发行龙头</span><span class=\"cap\">9/22 3 连板</span></div>\n    <div class=\"logic\">教材出版+数智化转型</div>\n    <div class=\"detail\">西南出版发行龙头，「十五五」规划融合发展直接受益；3 连板确认主升，机构配置属性强。</div>\n    <div class=\"risk\">⚠️ 估值已反映部分预期，需细则催化</div>\n  </div><div class=\"card\">\n    <div class=\"row\"><b>新华传媒</b><span class=\"code\">600825</span><span class=\"tag\">重组核心</span><span class=\"cap\">9/21 复牌一字板</span></div>\n    <div class=\"logic\">收购界面财联社</div>\n    <div class=\"detail\">重组预案主角：发行股份收购界面财联社 100% 股权（3.93 元/股），9/21 复牌一字涨停、9/22 竞价封板；重组过会是核心变量。</div>\n    <div class=\"risk\">⚠️ 重组未过审，审核不确定性高</div>\n  </div></div><div class=\"t\">🧬 观察·重组/内容扩散 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 政策驱动</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中国出版</b><span class=\"code\">601949</span><span class=\"tag\">国家级出版平台</span><span class=\"cap\">9/22 涨停</span></div>\n    <div class=\"logic\">出版国家队+经典作品规划</div>\n    <div class=\"detail\">国家级出版平台，2030 经典作品目标与数智化转型双映射；市值大、弹性次于新华系小盘。</div>\n    <div class=\"risk\">⚠️ 体量大，连板弹性有限</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>华媒控股</b><span class=\"code\">000607</span><span class=\"tag\">传媒+教育</span><span class=\"cap\">9/22 涨停</span></div>\n    <div class=\"logic\">报业转型+数智化</div>\n    <div class=\"detail\">杭州报业系，数智化转型标的，涨停潮跟涨；有教育、会展多元资产。</div>\n    <div class=\"risk\">⚠️ 主业弹性依赖政策细则</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>游族网络</b><span class=\"code\">002174</span><span class=\"tag\">游戏+内容</span><span class=\"cap\">9/22 盘初直线涨停</span></div>\n    <div class=\"logic\">网络出版/游戏监管映射</div>\n    <div class=\"detail\">游戏内容公司，盘初约 1 分钟直线涨停；注意规划含「网络游戏监管」表述，细则若从严反向承压。</div>\n    <div class=\"risk\">⚠️ 监管细则方向不明，双向波动</div>\n  </div><div class=\"card\">\n    <div class=\"row\"><b>风语筑</b><span class=\"code\">603466</span><span class=\"tag\">数字展览</span><span class=\"cap\">9/22 2 连板</span></div>\n    <div class=\"logic\">数智化体验/元宇宙</div>\n    <div class=\"detail\">数字化展览设计龙头，出版数智化（数字出版展示）与 AI 内容体验受益，2 连板。</div>\n    <div class=\"risk\">⚠️ 订单周期波动，业绩兑现需观察</div>\n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">近期</div><div class=\"wh\">「十五五」规划配套细则（扶持政策/试点/资金）发布</div><div class=\"wy\">下一段政策催化的唯一来源</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">新华传媒重组审核进展（受理/问询/过会）</div><div class=\"wy\">个股催化的落地刻度</div></div><div class=\"tkc\"><div class=\"w\">每日</div><div class=\"wh\">内蒙新华（5 连板）/北京文化（4 连板）高位股分歧信号</div><div class=\"wy\">情绪环是否退潮</div></div><div class=\"tkc\"><div class=\"w\">三季报窗口</div><div class=\"wh\">出版国企收入与数智化项目订单</div><div class=\"wy\">「规划→订单」的业绩闭环</div></div></div>\n\n    <div class=\"src\">数据来源：国家新闻出版署《出版业发展“十五五”规划》（9/21 印发）· 证券时报/新浪财经 9/22（文化传媒 +3.15%、主力净流入 28.90 亿、8 股涨停、内蒙新华 5 连板/新华文轩 3 连板、北京文化 4 连板）· 证券时报 e公司 9/22（游族网络直线涨停、风语筑 2 连板、Wind 午盘传媒净流入超 20 亿、省广集团居首）· 网易财经 9/22（新华传媒重组预案、界面财联社 3.93 元/股、9/21 复牌一字板）· 证券时报·数据宝 9/22（涨停榜：传媒/电子/医药生物各 8 股）</div>\n    <footer>出版传媒十五五规划 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>"}, {"id": "beidou-trillion-plan", "title": "北斗产业「十五五」万亿目标", "date": "2026-09-22", "grade": "正式档", "pricing": "未定价", "crate": "bolt", "search": "北斗 北斗产业 十五五 万亿 国家发改委 9/22 高端芯片 关键零部件 融合算法 卫星互联网 AI 规模应用 市场化 产业化 国际化 中国卫星 海格通信 华测导航 北斗星通 振芯科技 政策驱动", "card": "<a class=\"card-c\" href=\"#beidou-trillion-plan\" data-search=\"北斗 北斗产业 十五五 万亿 国家发改委 9/22 高端芯片 关键零部件 融合算法 卫星互联网 AI 规模应用 市场化 产业化 国际化 中国卫星 海格通信 华测导航 北斗星通 振芯科技 政策驱动\" data-grade=\"正式档\" data-pricing=\"未定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-22</span>\n    <span class=\"crate bolt\">⚡ 政策定调级 · 五年产业规模破万亿目标首次明确，A 股映射尚未定价 政策驱动</span>\n  </div>\n  <div class=\"ctitle\">北斗产业「十五五」万亿目标</div>\n  <div class=\"csub\">9/22 国家发改委：推动北斗产业规模五年内突破 1 万亿元 · 统筹高端芯片、关键零部件、融合算法攻关 · 北斗+AI+卫星互联网融合 · 市场化/产业化/国际化</div>\n  <div class=\"cpos\">政策给出「万亿规模+核心技术攻关」双重定调，但 9/22 北斗板块盘面无显著异动——「政策先行、权益未跟」，处于未定价状态。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">政策驱动</span>\n    <span class=\"chip pri\">未定价</span>\n    <span class=\"chip\">标的 8</span>\n    <span class=\"nm\">中国卫星</span><span class=\"nm\">海格通信</span><span class=\"nm\">华测导航</span><span class=\"nm\">北斗星通</span><span class=\"nm\">振芯科技</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-22 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 政策驱动 · 2026-09-22</div>\n    <h1>北斗产业「十五五」万亿目标</h1>\n    <div class=\"sub\">9/22 国家发改委：推动北斗产业规模五年内突破 1 万亿元 · 统筹高端芯片、关键零部件、融合算法攻关 · 北斗+AI+卫星互联网融合 · 市场化/产业化/国际化</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 政策定调级 · 五年破万亿目标首次明确 政策驱动</span>\n      <span class=\"badge neutral\">政策驱动</span>\n      <span class=\"badge neutral\">定价状态：未定价</span>\n      <span class=\"badge neutral\">主线：北斗规模应用</span>\n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">（本档为北斗/卫星互联网主线首档）</span></div>\n    <div class=\"posnote\">9/22 国家发改委有关负责人在解析近期经济热点时表示，「十五五」时期将推动北斗产业规模五年内突破 1 万亿元，实现北斗规模应用市场化、产业化、国际化新突破；统筹推进高端芯片、关键零部件、融合算法等核心技术攻关，加强北斗与人工智能、卫星互联网等技术融合创新。政策定调明确，但当日盘面未现板块异动。</div>\n    <details class=\"more\"><summary>展开定价状态详版（240 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化为<strong>部委口径政策定调</strong>（发改委发布会/解析），首次把「五年破 1 万亿」的量化目标写进口径。盘面状态：9/22 A 股主线在传媒、电子、医药，北斗板块无涨停、无放量异动——属「政策表态、权益未跟」。与地产新模式档案对比：地产是「政策+连续两日大涨」已定价；北斗是「政策刚表态、资金未转向」，<strong>未定价</strong>状态更接近催化初始段，需后续细则/项目落地或资金关注确认。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">政策口径</b><div class=\"v\">9/22 国家发改委相关负责人在解析近期经济热点时介绍，「十五五」时期将坚持开放融合、协调合作、兼容互补、成果共享，<strong>推动北斗产业规模五年内突破 1 万亿元</strong>，实现北斗规模应用<strong>市场化、产业化、国际化</strong>新突破。</div></div><div class=\"card fact\"><b class=\"k\">技术攻关方向</b><div class=\"v\">一是<strong>强化顶层设计</strong>：统筹推进<strong>高端芯片、关键零部件、融合算法</strong>等关键核心技术攻关；二是<strong>加强北斗与人工智能、卫星互联网等技术融合创新</strong>，推动卫星导航基础设施布局更加合理；三是<strong>培育壮大优质企业</strong>，筑牢安全可靠的产业链供应链。</div></div><div class=\"card fact warn\"><b class=\"k\">9/22 盘面验证</b><div class=\"v\">9/22 当日市场主线为传媒（+3.15% 涨停潮）、电子（科创50 +3%）、医药（主力净流入 86 亿），<strong>北斗/卫星导航板块无涨停、无显著资金异动</strong>——政策表态日盘面未定价。需注意：政策口径为发布会表述，尚无配套文件/项目清单落地，催化处于「方向定调」阶段。</div></div><div class=\"card fact\"><b class=\"k\">产业背景</b><div class=\"v\">北斗三号全球组网完成以来，规模应用进入产业化加速期：测绘地理信息、车联网/高精定位、应急通信、电力/金融授时、农业机械（与 9/22 农业托底政策共振）等场景持续渗透；「卫星互联网+北斗」融合（低轨星座补盲）与 AI 结合（无人驾驶、低空经济定位）是「十五五」新增量方向。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-22</div><div><div class=\"x\">国家发改委：推动北斗产业规模五年内突破 1 万亿元；统筹高端芯片/关键零部件/融合算法攻关，北斗+AI+卫星互联网融合。</div><div class=\"y\">为什么：本档案成立点——「万亿目标」量化口径首次明确，政策方向定调。</div></div></div><div class=\"u\"><div class=\"w\">后续待跟踪</div><div><div class=\"x\">「十五五」北斗专项规划/行动方案、重点项目清单、部委配套政策。</div><div class=\"y\">为什么：量化目标之后需要落地载体，细则才是第二段催化。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「政策定调型」题材，<strong>三个要害</strong>：一是<strong>量化目标打开空间想象</strong>——「五年破 1 万亿」首次写入部委口径，市场可据此测算行业复合增速（当前北斗产业规模约数千亿级，万亿目标对应可观年增速），政策对估值锚的意义大于当日盘面；二是<strong>受益顺序要按「芯片→终端→应用」切</strong>——政策明确攻关「高端芯片、关键零部件、融合算法」，对应芯片/器件（北斗星通、振芯科技、海格通信）与技术应用（华测导航、中海达、航天宏图）；三是<strong>当前是「政策先行、权益未跟」</strong>——9/22 盘面无异动，一旦市场从传媒/电子主线轮动或细则落地，存在补涨空间。<strong>隐藏面</strong>：北斗产业历史上多次政策表态未转化为持续性行情（需求分散、ToG 属性强、回款慢），需警惕「政策一日游」；核心变量是<strong>车规/低空/手机直连等放量场景</strong>的订单兑现。<br>① <strong>分水岭时点</strong>：「十五五」北斗专项规划/行动方案与重点项目清单发布。<br>② <strong>传导的关键约束</strong>：板块资金关注度——当前主线在传媒/电子/医药，题材轮动节奏决定启动时点。<br>③ <strong>待验证的核心变量</strong>：高精度应用（低空、自动驾驶）订单与北斗芯片出货数据。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>发改委：五年产业规模破 1 万亿</li><li>高端芯片/关键零部件/融合算法攻关定调</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">方向强、盘面未动</span><ul><li>北斗+AI+卫星互联网融合创新</li><li>9/22 板块无显著异动，未定价</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">待场景放量</span><ul><li>芯片/终端出货依赖车规、低空、直连场景</li><li>ToG 项目回款节奏影响业绩弹性</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">未定价</span><ul><li>政策表态日无涨停无放量</li><li>题材轮动或细则落地后存在补涨</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响方向强但盘面未动、业绩看场景放量、股价未定价——「政策先行、权益未跟」，处于催化初始段。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>45%</strong>：政策环成立，业绩环与股价环均待验证。</li><li><strong>边界要切开</strong>：第一梯队是<strong>芯片/器件</strong>（北斗星通、振芯科技、海格通信、中国卫星）——政策点名攻关方向；第二梯队是<strong>高精度应用</strong>（华测导航、中海达、司南导航、航天宏图）——场景放量的直接受益方；主题级映射（卫星互联网基建）需另建档案跟踪。</li><li><strong>主线联动</strong>：本档为北斗/卫星互联网主线首档；与 9/22 农业托底（发改委粮食政策）同属发改委口径，但板块独立。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·芯片与器件 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 政策驱动</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>北斗星通</b><span class=\"code\">002151</span><span class=\"tag\">北斗芯片龙头</span><span class=\"cap\">9/22 随板块</span></div>\n    <div class=\"logic\">芯片+高精度板卡</div>\n    <div class=\"detail\">北斗芯片/板卡核心供应商，政策点名「高端芯片」攻关直接对应；车规与低空高精度是其增量场景。</div>\n    <div class=\"risk\">⚠️ 业绩兑现依赖车载/低空订单放量</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>振芯科技</b><span class=\"code\">300101</span><span class=\"tag\">北斗基带芯片</span><span class=\"cap\">9/22 随板块</span></div>\n    <div class=\"logic\">基带/射频芯片+终端</div>\n    <div class=\"detail\">北斗导航基带芯片与终端供应商，军工+民用双属性，芯片攻关与自主可控直接受益。</div>\n    <div class=\"risk\">⚠️ 军工订单节奏波动大</div>\n  </div><div class=\"card\">\n    <div class=\"row\"><b>海格通信</b><span class=\"code\">002465</span><span class=\"tag\">北斗+无线通信</span><span class=\"cap\">9/22 随板块</span></div>\n    <div class=\"logic\">北斗终端+通信芯片</div>\n    <div class=\"detail\">北斗导航终端与通信设备龙头，电网/应急/军工多场景布局，「卫星互联网+北斗」融合受益。</div>\n    <div class=\"risk\">⚠️ 业务多元，北斗占比影响弹性</div>\n  </div></div><div class=\"t\">🧬 观察·高精度应用 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 政策驱动</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>华测导航</b><span class=\"code\">300627</span><span class=\"tag\">高精度定位</span><span class=\"cap\">9/22 随板块</span></div>\n    <div class=\"logic\">RTK+自动驾驶/低空</div>\n    <div class=\"detail\">高精度定位龙头，自动驾驶、低空经济、农机（与农业政策共振）场景最全，是「北斗+AI」应用侧核心。</div>\n    <div class=\"risk\">⚠️ 自动驾驶渗透率不及预期</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中国卫星</b><span class=\"code\">600118</span><span class=\"tag\">卫星制造总装</span><span class=\"cap\">9/22 随板块</span></div>\n    <div class=\"logic\">卫星平台+应用</div>\n    <div class=\"detail\">卫星制造与应用国家队，北斗组网与卫星互联网基建的核心载体；体量大、弹性中等。</div>\n    <div class=\"risk\">⚠️ 航天发射计划不确定性</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>航天宏图</b><span class=\"code\">688066</span><span class=\"tag\">遥感+北斗应用</span><span class=\"cap\">9/22 随板块</span></div>\n    <div class=\"logic\">时空数据服务</div>\n    <div class=\"detail\">遥感与时空数据服务商，北斗+遥感融合应用（应急、水利、农业）ToG 属性强，政策项目落地直接受益。</div>\n    <div class=\"risk\">⚠️ 政府客户回款周期长</div>\n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">近期</div><div class=\"wh\">「十五五」北斗专项规划/行动方案、重点项目清单</div><div class=\"wy\">下一段政策催化的来源</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">板块资金关注度与题材轮动节奏</div><div class=\"wy\">「未定价」转「定价中」的信号</div></div><div class=\"tkc\"><div class=\"w\">季度</div><div class=\"wh\">北斗芯片出货、高精度终端销量（车载/低空/手机直连）</div><div class=\"wy\">业绩闭环的客观刻度</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">低空经济/自动驾驶政策与订单共振</div><div class=\"wy\">北斗+AI 应用放量的放大器</div></div></div>\n\n    <div class=\"src\">数据来源：新华网 9/22（国家发展改革委解析近期经济热点——北斗产业规模五年内突破 1 万亿元、高端芯片/关键零部件/融合算法攻关、北斗+AI+卫星互联网融合）· 东方财富/同花顺行情 9/22（北斗板块无显著异动）· 行业背景：北斗三号全球组网后规模应用产业化进展（公开资料）</div>\n    <footer>北斗产业十五五万亿目标 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>"}, {"id": "agent-cpu-rerating", "title": "Meta Muse 引爆 CPU 重估 · Agent 时代算力主线", "date": "2026-09-22", "grade": "正式档", "pricing": "部分定价", "crate": "fire", "search": "Meta Muse 个人智能体 Agent CPU需求重估 费城半导体 +4.29% 科创50 +3% 澜起科技 +9% 摩尔线程 +14% 海光信息 CPU1000系列 端侧芯片 中微公司 北方华创 中芯国际 半导体设备 国产算力 产业周期", "card": "<a class=\"card-c\" href=\"#agent-cpu-rerating\" data-search=\"Meta Muse 个人智能体 Agent CPU需求重估 费城半导体 +4.29% 科创50 +3% 澜起科技 +9% 摩尔线程 +14% 海光信息 CPU1000系列 端侧芯片 中微公司 北方华创 中芯国际 半导体设备 国产算力 产业周期\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-22</span>\n    <span class=\"crate fire\">🔥 主线共振级 · Muse 登顶+费半大涨+国产端侧 CPU 发布，半导体链集体重估 产业周期</span>\n  </div>\n  <div class=\"ctitle\">Meta Muse 引爆 CPU 重估 · Agent 时代算力主线</div>\n  <div class=\"csub\">9/21 Meta 推个人智能体 Muse（6 天 iOS 下载超 90 万、登顶免费榜，Meta 单日 +11%）· 隔夜费城半导体 +4.29% · 9/22 科创50 +3%、澜起 +9%、摩尔线程 +14%、海光发布 CPU1000 端侧芯片</div>\n  <div class=\"cpos\">Agent 应用爆发 → 推理算力/端侧 CPU 需求重估，叠加国产 CPU 新品发布与设备涨价主线共振；板块已启动，国产链定价仍不充分。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">产业周期</span>\n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 8</span>\n    <span class=\"nm\">海光信息</span><span class=\"nm\">澜起科技</span><span class=\"nm\">龙芯中科</span><span class=\"nm\">中芯国际</span><span class=\"nm\">北方华创</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-22 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 产业周期 · 2026-09-22</div>\n    <h1>Meta Muse 引爆 CPU 重估 · Agent 时代算力主线</h1>\n    <div class=\"sub\">9/21 Meta 推个人智能体 Muse（6 天 iOS 下载超 90 万、登顶免费榜，Meta 单日 +11%）· 隔夜费城半导体 +4.29% · 9/22 科创50 +3%、澜起 +9%、摩尔线程 +14%、海光发布 CPU1000 端侧芯片</div>\n    <div class=\"badges\">\n      <span class=\"badge fire\">🔥 主线共振级 · Muse 登顶+费半大涨+国产端侧 CPU 发布 产业周期</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：AI算力与电力配套</span>\n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--acc)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">intel-cpu-price-hike</span><span class=\"tag\" style=\"margin-right:4px\">power-semi-hike-onsemi</span><span class=\"tag\" style=\"margin-right:4px\">deepseek-chain</span></div>\n    <div class=\"posnote\">9/21 Meta 推出个人智能体 Muse，上线 6 天美国 iOS 下载超 90 万次、超越 ChatGPT 登顶免费榜，Meta 单日收涨超 11%（市值增逾 1900 亿美元）；隔夜费城半导体指数大涨 4.29%。9/22 A 股半导体高开领涨：科创50 指数涨超 3%，澜起科技 +9%、摩尔线程 +14%、海光信息高开超 7%，同日海光在深圳发布首款端侧算力芯片 CPU1000 系列——「Agent 应用→推理算力→CPU/端侧芯片」重估逻辑成型。</div>\n    <details class=\"more\"><summary>展开定价状态详版（260 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化为<strong>海外应用爆发 + 国产新品落地</strong>双主线：Muse 登顶证明 Agent 从「概念」走向「C 端爆款」，模型能力已过剩、竞争重心转向应用层（分析师口径），推理与端侧算力成为下一个定价方向；海光 CPU1000 系列发布把「国产端侧算力」从预期变成产品。盘面：科创50 +3%、权重股大涨属<strong>已启动</strong>，但国产 CPU/设备相对海外重估幅度仍落后（海光高开 7.53% 后收 +3.88%），<strong>部分定价</strong>。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">海外催化：Meta Muse</b><div class=\"v\">9/21 Meta 推出个人智能体 Muse：<strong>上线 6 天美国 iOS 下载超 90 万次，超越 ChatGPT 登顶免费榜</strong>；Meta 当日收涨超 11%、市值增逾 1900 亿美元。科技分析师口径：<strong>模型能力已过剩，AI 竞争重心转向应用层</strong>；Gartner 预测到 2030 年 2340 亿美元企业软件支出面临 Agent 套利风险。</div></div><div class=\"card fact\"><b class=\"k\">美股映射</b><div class=\"v\">隔夜（9/22 凌晨收盘）<strong>费城半导体指数大涨 4.29%</strong>，创 8 月以来最大涨幅；全球芯片股大幅反弹，Meta Muse 引爆 CPU 重估、晶圆厂涨价、设备零部件短缺、国产算力突破等多条主线共振。</div></div><div class=\"card fact warn\"><b class=\"k\">9/22 A 股验证</b><div class=\"v\">9/22 A 股半导体高开领涨：<strong>科创50 指数涨超 3%</strong>（芯原股份等大涨），<strong>澜起科技 +9%</strong>（开盘 +9.47%）、<strong>摩尔线程 +14%</strong>、沐曦股份 +8%、<strong>海光信息高开 +7.53%</strong>（收盘 256.00 元、+3.88%，总市值 5950 亿）；中微公司、北方华创、中芯国际、雅克科技等拉升；中证半导体产业指数高开超 2%。传媒、电子、计算机形成三大涨停潮方向，电子为其中之一。</div></div><div class=\"card fact\"><b class=\"k\">国产新品：海光 CPU1000</b><div class=\"v\">9/22 海光信息在深圳发布<strong>海光 1000 系列 CPU</strong>：面向<strong>低功耗、嵌入式与端侧算力</strong>需求，采用 C86 架构打造的轻量级 CPU，是海光<strong>首款面向端侧的算力芯片</strong>；口号「向前，再向前」。此前 9/20 海光公众号预告 9/22 发布全新芯片。发布当日股价高开超 7%，产品从「服务器 CPU」向「端侧算力」延伸。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-09-21</div><div><div class=\"x\">Meta 推个人智能体 Muse：6 天 iOS 下载超 90 万、登顶免费榜；Meta 单日 +11%、市值增逾 1900 亿美元。</div><div class=\"y\">为什么：Agent 从概念走向 C 端爆款，算力定价重心从训练转向推理/端侧。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-22 凌晨</div><div><div class=\"x\">费城半导体指数 +4.29%（8 月来最大涨幅），CPU 重估+晶圆厂涨价+设备短缺多主线共振。</div><div class=\"y\">为什么：美股把 Agent 逻辑定价到半导体链。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-22 白天</div><div><div class=\"x\">科创50 +3%、澜起 +9%、摩尔线程 +14%、海光高开 7.53%；海光发布 CPU1000 端侧芯片。</div><div class=\"y\">为什么：本档案成立点——海外逻辑 A 股兑现+国产新品落地，板块已启动。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「Agent 应用爆发→算力重估」的产业主线升级，<strong>三个要害</strong>：一是<strong>定价重心切换</strong>——Muse 登顶证明推理/端侧（而非训练）是下一阶段算力需求主战场，CPU（推理核心）+内存接口（澜起）+端侧芯片（海光 CPU1000）成为重估对象，与 9/9 英特尔 CPU 三连涨档案的「CPU 涨价」逻辑形成共振升级；二是<strong>国产链有独立催化</strong>——海光端侧 CPU 发布、摩尔线程/沐曦大涨，国产算力从「订单预期」（DeepSeek 16 万颗昇腾档案）走向「产品落地」，自主可控+Agent 需求双击；三是<strong>设备/材料同步受益</strong>——晶圆厂涨价与设备零部件短缺（金融界口径）使设备端（北方华创、中微）获得供需+国产替代双重逻辑。<strong>隐藏面</strong>：Muse 是 C 端产品，爆火到商业化收入仍有距离；费半大涨后有获利回吐风险；A 股半导体当日高开回落（海光 7.53%→3.88%）显示分歧——「启动 vs 一日游」取决于美股持续性。<br>① <strong>分水岭时点</strong>：美股费半与 Meta 的持续性；海光 CPU1000 的订单/生态落地。<br>② <strong>传导的关键约束</strong>：A 股半导体高开回落的分歧能否被第二根阳线消化。<br>③ <strong>待验证的核心变量</strong>：国产端侧/推理芯片实际订单与客户导入（C 端 Agent 厂商、服务器厂商）。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>Meta Muse 登顶（6 天 90 万下载）</li><li>费半 +4.29%，海光发布端侧 CPU1000</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强</span><ul><li>9/22 科创50 +3%、澜起 +9%、摩尔线程 +14%</li><li>CPU/端侧/设备三条子线共振</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">待订单验证</span><ul><li>Muse 商业化收入未落地</li><li>海光端侧 CPU 需客户导入与放量</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">已启动·部分定价</span><ul><li>板块大涨但高开回落显示分歧</li><li>国产链相对海外重估仍落后</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强、业绩看订单、股价已启动但国产链定价不充分——Agent 应用爆发把算力主线从「训练」推向「推理/端侧」，国产 CPU 新品构成独立催化。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>55%</strong>：催化环与情绪环闭合，业绩环（订单）与持续性环待验证。</li><li><strong>边界要切开</strong>：第一梯队是<strong>国产 CPU/算力芯片</strong>（海光信息、龙芯中科、澜起科技——内存接口+CPU 生态）；第二梯队是<strong>设备/材料</strong>（北方华创、中微公司、中芯国际——晶圆厂涨价+设备短缺）；第三梯队是<strong>Agent 应用/软件</strong>（映射独立，需另建档案）。</li><li><strong>主线联动</strong>：与 intel-cpu-price-hike（9/9，CPU 涨价）、power-semi-hike-onsemi（9/21，功率链）、deepseek-chain（9/8，国产算力订单）同属 AI 算力主线——本档是「Agent 应用→端侧算力」的新增段。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·国产 CPU 与算力芯片 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>海光信息</b><span class=\"code\">688041</span><span class=\"tag\">国产CPU+DCU</span><span class=\"cap\">9/22 +3.88% 报 256.00 元</span></div>\n    <div class=\"logic\">服务器CPU+端侧新品</div>\n    <div class=\"detail\">国产 CPU/DCU 龙头，9/22 发布首款端侧算力芯片 CPU1000 系列，从服务器向端侧延伸；高开 7.53% 收 +3.88%，Agent 推理需求直接受益。</div>\n    <div class=\"risk\">⚠️ 高开回落显分歧，端侧生态待验证</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>澜起科技</b><span class=\"code\">688008</span><span class=\"tag\">内存接口芯片</span><span class=\"cap\">9/22 +9%（开盘 +9.47%）</span></div>\n    <div class=\"logic\">CPU生态+内存接口</div>\n    <div class=\"detail\">内存接口芯片龙头，CPU 重估与算力扩容直接受益；Agent 推理对内存带宽需求放大，9/22 领涨科创。</div>\n    <div class=\"risk\">⚠️ 涨幅已大，短线波动加剧</div>\n  </div><div class=\"card\">\n    <div class=\"row\"><b>龙芯中科</b><span class=\"code\">688047</span><span class=\"tag\">自主CPU</span><span class=\"cap\">9/22 跟随板块</span></div>\n    <div class=\"logic\">自主指令集CPU</div>\n    <div class=\"detail\">自主架构 CPU 供应商，端侧/信创+AI 推理场景受益，国产算力重估的弹性标的。</div>\n    <div class=\"risk\">⚠️ 生态成熟度低于 x86 路线</div>\n  </div></div><div class=\"t\">🧬 观察·设备/制造与生态 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>中芯国际</b><span class=\"code\">688981</span><span class=\"tag\">晶圆代工</span><span class=\"cap\">9/22 拉升</span></div>\n    <div class=\"logic\">成熟制程涨价+国产算力代工</div>\n    <div class=\"detail\">晶圆代工龙头，8 英寸产能被 AI 相关需求挤占、晶圆厂涨价（金融界口径），代工端供需紧张受益。</div>\n    <div class=\"risk\">⚠️ 资本开支与折旧压力大</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>北方华创</b><span class=\"code\">002371</span><span class=\"tag\">半导体设备</span><span class=\"cap\">9/22 拉升</span></div>\n    <div class=\"logic\">设备国产替代</div>\n    <div class=\"detail\">设备龙头，晶圆厂涨价+设备零部件短缺背景下扩产逻辑强化，国产替代+供需双受益。</div>\n    <div class=\"risk\">⚠️ 设备订单确认周期长</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>中微公司</b><span class=\"code\">688012</span><span class=\"tag\">刻蚀设备</span><span class=\"cap\">9/22 拉升</span></div>\n    <div class=\"logic\">刻蚀/薄膜设备</div>\n    <div class=\"detail\">刻蚀设备龙头，先进制程扩产与国产替代双重逻辑，9/22 随半导体板块拉升。</div>\n    <div class=\"risk\">⚠️ 海外大客户占比影响弹性</div>\n  </div><div class=\"card\">\n    <div class=\"row\"><b>雅克科技</b><span class=\"code\">002409</span><span class=\"tag\">半导体材料</span><span class=\"cap\">9/22 拉升</span></div>\n    <div class=\"logic\">前驱体/光刻胶材料</div>\n    <div class=\"detail\">半导体材料平台，晶圆厂扩产与涨价周期中材料端量价齐升逻辑。</div>\n    <div class=\"risk\">⚠️ 材料认证与放量节奏</div>\n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">每日</div><div class=\"wh\">美股费半与 Meta/Muse 数据（下载、DAU、商业化）</div><div class=\"wy\">海外 Agent 逻辑的持续性</div></div><div class=\"tkc\"><div class=\"w\">近期</div><div class=\"wh\">海光 CPU1000 客户导入与订单公告</div><div class=\"wy\">国产端侧从发布到放量的刻度</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">晶圆厂涨价函与设备交期</div><div class=\"wy\">供需紧张是否延续</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">A 股半导体能否消化 9/22 高开回落分歧（第二根阳线）</div><div class=\"wy\">「启动 vs 一日游」的分水岭</div></div></div>\n\n    <div class=\"src\">数据来源：财联社/雪球投资日历 9/22（Meta Muse 上线 6 天 iOS 下载超 90 万、超越 ChatGPT 登顶免费榜、Meta +11%、市值增 1900 亿美元、Gartner 2030 年 2340 亿美元 Agent 套利）· 金融界 9/22（费半 +4.29%、CPU 重估/晶圆厂涨价/设备短缺多主线共振、海光 +7%、中微/北方华创/中芯国际拉升）· 21 世纪经济报道/东方财富 9/22（科创50 +3%、澜起 +9.47% 开盘、摩尔线程 +14%、海光 +7.53%）· 同花顺 9/22（海光发布 CPU1000 系列端侧芯片、C86 架构）· Wind 行情 9/22（海光 256.00 元 +3.88%）</div>\n    <footer>Meta Muse CPU 重估 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>"}, {"id": "silicone-dmc-hike", "title": "有机硅DMC金九挺价 · 行业自律+政策托底", "date": "2026-09-22", "grade": "正式档", "pricing": "未定价", "crate": "bolt", "search": "有机硅 DMC 金九挺价 合盛硅业 华东14500-14700元/吨 较9/1 +8.09% 减排50% 开工率60% 库存4.72万吨 历史低位 硅酮胶涨价5-15% 生胶16000 东岳硅材 兴发集团 新安股份 化工涨价链", "card": "<a class=\"card-c\" href=\"#silicone-dmc-hike\" data-search=\"有机硅 DMC 金九挺价 合盛硅业 华东14500-14700元/吨 较9/1 +8.09% 减排50% 开工率60% 库存4.72万吨 历史低位 硅酮胶涨价5-15% 生胶16000 东岳硅材 兴发集团 新安股份 化工涨价链\" data-grade=\"正式档\" data-pricing=\"未定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-22</span>\n    <span class=\"crate bolt\">⚡ 涨价实锤级 · DMC 半月 +8.09%、库存历史低位，行业自律+政策共振，A 股链尚未定价 化工涨价链</span>\n  </div>\n  <div class=\"ctitle\">有机硅DMC金九挺价 · 行业自律+政策托底</div>\n  <div class=\"csub\">华东 DMC 14500-14700 元/吨（较 9/1 +8.09%）· 合盛 9/11 报 14500 · 开工率 60%、库存 4.72 万吨历史低位 · 硅酮胶宣涨 5-15% · 减排 50% 自律+成本核算新政策</div>\n  <div class=\"cpos\">行业自律（减排 50%）+政策托底（成本核算新规）双驱动下 DMC 半月涨 8%，硅酮胶跟涨 5-15%；但 A 股有机硅链盘面未动——「商品先行、权益未跟」。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">化工涨价链</span>\n    <span class=\"chip pri\">未定价</span>\n    <span class=\"chip\">标的 6</span>\n    <span class=\"nm\">合盛硅业</span><span class=\"nm\">东岳硅材</span><span class=\"nm\">兴发集团</span><span class=\"nm\">新安股份</span><span class=\"nm\">三友化工</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-22 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 化工涨价链 · 2026-09-22</div>\n    <h1>有机硅DMC金九挺价 · 行业自律+政策托底</h1>\n    <div class=\"sub\">华东 DMC 14500-14700 元/吨（较 9/1 +8.09%）· 合盛 9/11 报 14500 · 开工率 60%、库存 4.72 万吨历史低位 · 硅酮胶宣涨 5-15% · 减排 50% 自律+成本核算新政策</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 涨价实锤级 · DMC 半月 +8.09%、库存历史低位 化工涨价链</span>\n      <span class=\"badge neutral\">化工涨价链</span>\n      <span class=\"badge neutral\">定价状态：未定价</span>\n      <span class=\"badge neutral\">主线：化工涨价链</span>\n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--faint)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">eo-price-record</span><span class=\"tag\" style=\"margin-right:4px\">tio2-price-hike-6</span><span class=\"tag\" style=\"margin-right:4px\">carbon-black-record</span></div>\n    <div class=\"posnote\">9 月「金九」旺季，有机硅 DMC 华东主流商谈 14500-14700 元/吨（9/14-15 基准价 14700，较 9/1 的 13600 涨约 8.09%），生胶冲高至 15700-16000 元/吨；行业协同减排 50% 自律常态化+发改委/市监成本核算新政策托底，开工率 60% 左右、库存 4.72 万吨历史低位、订单排至 9 月下旬；硅酮胶企业 9/16 起宣涨 5-15%。A 股有机硅链 9/22 盘面无显著异动。</div>\n    <details class=\"more\"><summary>展开定价状态详版（240 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化为<strong>供给侧自律 + 政策托底 + 旺季需求</strong>三因素：行业减排 50% 从 2025/11 的 11 家单体厂自律延续至 2026 下半年常态化，叠加发改委/市监总局成本核算新政策（反低价竞争），DMC 半月涨 8.09%。盘面：9/22 市场主线在传媒/电子/医药，<strong>有机硅链无涨停无放量</strong>——商品端涨价已实锤、权益端未定价，与环氧乙烷档案（9/21）同处「价格先行、权益未跟」阶段。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">价格事实</b><div class=\"v\">9/14-15 华东 DMC 主流商谈 <strong>14500-14700 元/吨、基准价 14700</strong>，对比 9/1 的 13600 元/吨，<strong>半月涨幅约 8.09%</strong>（生意社/卓创/全球有机硅网口径）；<strong>生胶主流 15700-16000 元/吨</strong>；9/22 全球有机硅网口径 DMC 14.5-15.3 元/公斤（14500-15300）。2026 上半年 DMC 均价 1.44 万元/吨、同比 +13%。</div></div><div class=\"card fact\"><b class=\"k\">龙头报价锚定</b><div class=\"v\">价格传导链条清晰：<strong>9/2 河北单体厂行业会议设定 DMC 指导价 13900 元/吨 → 9/7 上调至 14100 → 合盛硅业 9/8 出厂挂牌 14300 → 9/11 报 14500</strong>，龙头报价与指导价吻合且略高，锚定作用有效；9/16 合盛公众号发文：供给自律、低库存叠加「金九」旺季需求回暖，行业经营环境稳步修复。</div></div><div class=\"card fact warn\"><b class=\"k\">供给与库存</b><div class=\"v\">行业协同减排 50% 目标常态化（2026 下半年与 8 月持平），<strong>整体开工率维持在 60% 左右</strong>；<strong>库存降至约 4.72 万吨、处于历史低位</strong>；多数单体企业在手订单已排至 9 月中下旬，现货流通量明显收紧。硅酮胶企业 9/16、9/20 起宣涨 <strong>5-15%</strong>（发泡胶、室内粘接胶、美缝剂、硅酮胶、强力胶等全系列）。</div></div><div class=\"card fact\"><b class=\"k\">政策托底</b><div class=\"v\">国家发展改革委、市场监管总局成本核算新政策（反低价竞争、规范成本核算）为行业自律补上规则托底；2025/11 起合盛硅业等 11 家单体厂自愿减排减碳行动持续，行业从「低价竞争」走向「有序经营、平衡供需」。有机硅生产利润已回升至约 395 元/吨、处于盈利状态。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2025-11</div><div><div class=\"x\">合盛硅业等 11 家单体厂自愿发起减排减碳行动，行业走出低价竞争困境。</div><div class=\"y\">为什么：供给侧自律的起点，为涨价奠定基础。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-02 至 09-11</div><div><div class=\"x\">河北会议指导价 13900 → 14100；合盛挂牌 14300 → 14500，龙头报价锚定。</div><div class=\"y\">为什么：价格进入上行通道，指导价机制成型。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-14 至 09-22</div><div><div class=\"x\">华东 DMC 14500-14700（较 9/1 +8.09%），生胶 15700-16000；硅酮胶宣涨 5-15%；9/22 报价 14500-15300。</div><div class=\"y\">为什么：本档案成立点——「金九」旺季涨价实锤，库存历史低位确认供给约束。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「供给自律+政策托底」型涨价，<strong>三个要害</strong>：一是<strong>驱动是供给侧自律而非需求爆发</strong>——减排 50% 常态化+低库存+订单排满共同收缩供给，需求端「金九」是旺季 Beta 而非主驱动，这决定了涨价的持续性取决于自律机制能否延续与价格能否传导至下游；二是<strong>政策把「反内卷」从口号变成规则</strong>——发改委/市监成本核算新政策为自律托底，与 9 月「反内卷·供给侧调控」主线（碳酸锂、储能电芯档案）同一政策框架，行业从「低价抢单」转向「有序经营」的估值逻辑正在重估；三是<strong>当前是「商品先行、权益未跟」</strong>——9/22 有机硅链无涨停无放量，市场注意力在传媒/电子/医药，一旦化工涨价主线获得资金关注，存在补涨空间。<strong>隐藏面</strong>：DMC 价格已较 7 月低点反弹近两成、生产利润转正，若下游（地产链需求、硅酮胶）抵制涨价或自律松动，价格见顶风险需警惕；参照钛白粉档案教训（函涨 4.5%、基准价仅涨 1.00%），需以「实际成交价 vs 挂牌价」验证挺价成色。<br>① <strong>分水岭时点</strong>：行业会议下一轮指导价；9 月下旬-10 月旺季订单兑现。<br>② <strong>传导的关键约束</strong>：实际成交价能否站稳 14700 上方，下游顺价是否顺畅。<br>③ <strong>待验证的核心变量</strong>：合盛硅业等龙头成交/超额是否放大——若放量，本档案从「未定价」转「定价中」。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>DMC 半月 +8.09%（13600→14700）</li><li>库存 4.72 万吨历史低位，订单排满</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强但分化</span><ul><li>减排 50% 自律+成本核算新政策托底</li><li>硅酮胶跟涨 5-15%，一体化龙头最受益</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">利润已转正</span><ul><li>有机硅生产利润约 395 元/吨</li><li>一体化（工业硅+有机硅）弹性最大</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">未定价</span><ul><li>9/22 板块无涨停无放量</li><li>市场主线在传媒/电子/医药</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强但分化、业绩利润已转正、股价未定价——「商品先行、权益未跟」，与环氧乙烷档案同处启动前段。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>55%</strong>：价格环与供给环扎实，业绩环部分兑现（利润转正），股价环未启动。</li><li><strong>边界要切开</strong>：受益第一梯队是<strong>工业硅+有机硅一体化龙头</strong>（合盛硅业——成本底牌+定价锚）；第二梯队是<strong>单体厂</strong>（东岳硅材、兴发集团、新安股份、三友化工——价格弹性）；下游<strong>硅酮胶/密封胶</strong>（硅宝科技等）是顺价受益方，但涨价若传导不畅则成本承压。</li><li><strong>主线联动</strong>：与 eo-price-record（9/21）、tio2-price-hike-6、carbon-black-record 同属化工涨价链；与「反内卷·供给侧调控」主线（碳酸锂、储能电芯）同框架——本档是「行业自律+政策托底」的有机硅案例。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·一体化龙头 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 化工涨价链</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>合盛硅业</b><span class=\"code\">603260</span><span class=\"tag\">工业硅+有机硅双龙头</span><span class=\"cap\">9/22 随板块</span></div>\n    <div class=\"logic\">成本底牌+价格锚定</div>\n    <div class=\"detail\">工业硅与有机硅双龙头，本轮挺价发起者与价格锚（9/8 挂牌 14300、9/11 报 14500）；一体化成本优势使其在涨价周期中弹性最大。</div>\n    <div class=\"risk\">⚠️ 工业硅价格与能源成本波动</div>\n  </div></div><div class=\"t\">🧬 观察·单体厂与下游 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 化工涨价链</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>东岳硅材</b><span class=\"code\">300821</span><span class=\"tag\">单体厂纯弹性</span><span class=\"cap\">9/22 随板块</span></div>\n    <div class=\"logic\">DMC 价格弹性</div>\n    <div class=\"detail\">有机硅单体/深加工企业，DMC 涨价直接放大利润弹性，单体业务占比高、弹性大。</div>\n    <div class=\"risk\">⚠️ 深加工占比提升摊薄弹性</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>兴发集团</b><span class=\"code\">600141</span><span class=\"tag\">磷硅一体化</span><span class=\"cap\">9/22 随板块</span></div>\n    <div class=\"logic\">有机硅+磷化工</div>\n    <div class=\"detail\">有机硅单体与磷化工双主业，硅基材料景气修复+磷化工涨价双逻辑。</div>\n    <div class=\"risk\">⚠️ 磷化工周期位置影响综合弹性</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>新安股份</b><span class=\"code\">600596</span><span class=\"tag\">草甘膦+有机硅</span><span class=\"cap\">9/22 随板块</span></div>\n    <div class=\"logic\">有机硅+农化</div>\n    <div class=\"detail\">有机硅单体与草甘膦双主业，硅基材料涨价受益，农化业务提供安全垫。</div>\n    <div class=\"risk\">⚠️ 草甘膦价格走弱拖累综合业绩</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>三友化工</b><span class=\"code\">600409</span><span class=\"tag\">纯碱+有机硅</span><span class=\"cap\">9/22 随板块</span></div>\n    <div class=\"logic\">有机硅+纯碱多元</div>\n    <div class=\"detail\">有机硅单体与纯碱/粘胶多元业务，硅基材料景气修复受益，低估值防御属性。</div>\n    <div class=\"risk\">⚠️ 多元业务稀释单一涨价弹性</div>\n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">每周</div><div class=\"wh\">行业会议 DMC 指导价（13900→14100→?）</div><div class=\"wy\">涨价持续性的风向标</div></div><div class=\"tkc\"><div class=\"w\">每日</div><div class=\"wh\">华东 DMC 实际成交价（生意社/卓创/全球有机硅网）</div><div class=\"wy\">挂牌 vs 成交验证挺价成色</div></div><div class=\"tkc\"><div class=\"w\">月度</div><div class=\"wh\">行业开工率与库存（当前 60%/4.72 万吨）</div><div class=\"wy\">供给自律是否松动</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">合盛硅业等龙头成交/超额是否放大</div><div class=\"wy\">「未定价」转「定价中」的信号</div></div></div>\n\n    <div class=\"src\">数据来源：证券时报 9/18《有机硅金九挺价：自律与政策共振，合盛硅业引领秩序修复》（开工率 60%、库存低位、订单排至 9 月下旬、成本核算新政策）· 生意社/卓创/全球有机硅网 9/14-15（DMC 14500-14700、较 9/1 +8.09%、生胶 15700）· 全球有机硅网 9/22（DMC 14.5-15.3 元/公斤、生胶涨至 16000、合盛/兴发/东岳/新安上调）· 中金在线/东方财富财富号 9/17-19（河北会议指导价 13900→14100、合盛挂牌 14300→14500、库存 4.72 万吨、减排 50%）· 有机硅商城 9/17（硅酮胶宣涨 5-15%）· 新浪财经 9/9（2026H1 DMC 均价 1.44 万、同比 +13%、利润 395 元/吨）</div>\n    <footer>有机硅 DMC 金九挺价 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>"}, {"id": "pcb-ccl-hike", "title": "覆铜板涨价潮传导 PCB 涨停潮 · AI 算力硬件景气", "date": "2026-09-23", "grade": "正式档", "pricing": "部分定价", "crate": "fire", "search": "覆铜板 CCL 涨价 宏瑞兴科 上调10% 建滔积层板 年内提价7次 累计涨超100% 中国巨石 电子布提价15%20% 澳弘电子 9天7板 PCB 涨停潮 沪电股份 主力净流入9.53亿 深南电路 上半年营收+46% 中一科技 江南新材 依顿电子 创新高 AI服务器 PCB HDI ABF基板 CPU需求", "card": "<a class=\"card-c\" href=\"#pcb-ccl-hike\" data-search=\"覆铜板 CCL 涨价 宏瑞兴科 上调10% 建滔积层板 年内提价7次 累计涨超100% 中国巨石 电子布提价15%20% 澳弘电子 9天7板 PCB 涨停潮 沪电股份 主力净流入9.53亿 深南电路 上半年营收+46% 中一科技 江南新材 依顿电子 创新高 AI服务器 PCB HDI ABF基板 CPU需求\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-23</span>\n    <span class=\"crate fire\">🔥 主线共振级 · CCL 再涨 10%+建滔年内 7 提，PCB 涨停潮延续，AI 算力硬件景气实锤 产业周期</span>\n  </div>\n  <div class=\"ctitle\">覆铜板涨价潮传导 PCB 涨停潮 · AI 算力硬件景气</div>\n  <div class=\"csub\">9/22 宏瑞兴科覆铜板出厂价上调 10% · 建滔年内提价 7 次、重点产品累计涨超 100% · 9/23 PCB 概念 +1.39%、涨停 7 家、主力净流入 4.14 亿 · 澳弘电子 9 天 7 板续创新高</div>\n  <div class=\"cpos\">覆铜板涨价函密集（宏瑞兴科 +10%、建滔 7 提、中国巨石电子布 +15/20%），向 PCB 制造传导；AI 服务器 + CPU 需求（Meta Muse）支撑 ABF 基板景气，PCB 涨停潮延续。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">产业周期</span>\n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 6</span>\n    <span class=\"nm\">澳弘电子</span><span class=\"nm\">沪电股份</span><span class=\"nm\">深南电路</span><span class=\"nm\">生益科技</span><span class=\"nm\">超声电子</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-23 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 产业周期 · 2026-09-23</div>\n    <h1>覆铜板涨价潮传导 PCB 涨停潮 · AI 算力硬件景气</h1>\n    <div class=\"sub\">9/22 宏瑞兴科覆铜板出厂价上调 10% · 建滔年内提价 7 次、重点产品累计涨超 100% · 9/23 PCB 概念 +1.39%、涨停 7 家、主力净流入 4.14 亿 · 澳弘电子 9 天 7 板续创新高</div>\n    <div class=\"badges\">\n      <span class=\"badge fire\">🔥 主线共振级 · CCL 再涨 10%+建滔年内 7 提 产业周期</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：AI算力与电力配套</span>\n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--acc)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">agent-cpu-rerating</span><span class=\"tag\" style=\"margin-right:4px\">intel-cpu-price-hike</span><span class=\"tag\" style=\"margin-right:4px\">glass-core-substrate</span></div>\n    <div class=\"posnote\">9/22 江西省宏瑞兴科发布调价通知，覆铜板（CCL）产品出厂价上调 10%，CCL 产业链新一轮涨价拉开序幕——这是继中国巨石 9 月对电子布厚布/薄布分别提价 15%/20% 之后又一轮材料涨价。建滔积层板年内已密集提价 7 次，部分重点产品累计涨幅突破 100%；自 2025 年 12 月起建滔、南亚等主流厂商连续发调价函。9/23 斗山集团拟投 9700 亿韩元扩产 AI 半导体覆铜板。涨价向下游 PCB 制造传导：PCB 概念 +1.39%、涨停 7 家（澳弘电子 9 天 7 板续创历史新高），主力资金净流入 4.14 亿元（116 股净流入、21 股超亿元）。</div>\n    <details class=\"more\"><summary>展开定价状态详版（250 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化为<strong>材料涨价函密集 + AI 需求验证</strong>双主线：宏瑞兴科 CCL +10%、建滔年内 7 提（累计超 100%）、中国巨石电子布 +15/20%，涨价函密度与幅度均超预期；Meta Muse 登顶带动机构看好 CPU 需求支撑 ABF 基板景气。盘面：<strong>已充分启动</strong>——澳弘电子 9 天 7 板、涨停 7 家、资金净流入 4.14 亿，但中大盘（沪电 +2.37%、深南 +3.69%）涨幅温和、二三线补涨明显，属<strong>部分定价</strong>（情绪端定价充分、业绩端仍在验证）。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">涨价函密度</b><div class=\"v\">9/22 江西宏瑞兴科：覆铜板出厂价<strong>上调 10%</strong>；建滔积层板<strong>年内提价 7 次</strong>、部分重点产品<strong>累计涨幅突破 100%</strong>；中国巨石 9 月电子布厚布/薄布分别提价 <strong>15%/20%</strong>；9/23 斗山集团拟投 9700 亿韩元扩产 AI 半导体覆铜板；自 2025/12 起建滔、南亚等主流厂商连续发调价函，覆铜板单周涨幅曾达 10-20%。</div></div><div class=\"card fact\"><b class=\"k\">9/23 盘面验证</b><div class=\"v\"><strong>PCB 概念 +1.39%</strong>、涨停 7 家（抖音涨停天梯口径：PCB 为当日第一大题材）、主力资金净流入 <strong>4.14 亿</strong>（116 股净流入、21 股超亿元）：<strong>澳弘电子 9 天 7 板</strong>续创历史新高（58.60 元 +10.01%）、依顿电子涨停创历史新高（15.20 元 +9.99%）、中一科技 20cm 涨停（49.20 元）、江南新材/胜利精密/集泰股份涨停、四会富仕 +7.30%、兴森科技 +4.84%、超声电子 +7.85%。</div></div><div class=\"card fact warn\"><b class=\"k\">资金与业绩验证</b><div class=\"v\">资金面：<strong>沪电股份主力净流入 9.53 亿</strong>（居全板块第一）、超声电子 4.46 亿、铜冠铜箔 4.43 亿、中一科技 4.05 亿、依顿电子 2.25 亿。业绩面：<strong>深南电路上半年营收 152.96 亿、同比 +46.33%，归母净利 22.51 亿、+65.55%</strong>（9/23 涨超 5% 后收 +3.69%）；招商证券十余场调研：PCB 涨价超预期、<strong>非 AI 领域尤为明显、二三线厂商盈利显著改善</strong>。</div></div><div class=\"card fact\"><b class=\"k\">产业逻辑</b><div class=\"v\">AI 服务器由单机向机柜级扩展，对 PCB 板卡数量、层数与材料等级同步提升；Meta Muse 登顶美区 App 榜后，机构普遍看好 <strong>CPU 需求激增支撑 ABF 基板景气度</strong>；铜箔（中一科技）、玻纤布（中国巨石）、CCL（建滔/生益）、PCB（澳弘/沪电/深南）全链条涨价传导。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2025-12 起</div><div><div class=\"x\">建滔、南亚等主流厂商连续发调价函，覆铜板单周涨幅 10-20%；建滔年内提价 7 次、重点产品累计涨超 100%。</div><div class=\"y\">为什么：CCL 涨价趋势确立，是本轮 PCB 行情的产业起点。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-中旬</div><div><div class=\"x\">中国巨石 9 月对电子布厚布/薄布分别提价 15%/20%；9/16-17 澳弘电子 4 连板→5 连板。</div><div class=\"y\">为什么：上游材料接力涨价，PCB 板块启动。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-22 至 09-23</div><div><div class=\"x\">宏瑞兴科 CCL 出厂价上调 10%；9/23 PCB 概念 +1.39%、涨停 7 家、澳弘 9 天 7 板续创新高、深南电路中报超预期。</div><div class=\"y\">为什么：本档案成立点——涨价函再升级 + 涨停潮延续 + 业绩验证，主线性确认。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「材料涨价→制造传导→业绩验证」的完整涨价链，<strong>三个要害</strong>：一是<strong>涨价有产业 Alpha</strong>——不是单一公司行为：CCL 龙头建滔年内 7 提（累计超 100%）、材料端中国巨石电子布 +15/20%、斗山 9700 亿韩元扩产，涨价密度与幅度证明供需紧张是真实的（AI 服务器机柜级升级+CPU 需求），与「宏瑞兴科一纸函」式情绪行情有本质区别；二是<strong>业绩验证已在路上</strong>——深南电路中报营收 +46%、净利 +65.55%，招商证券调研确认非 AI 领域涨价更明显、二三线盈利显著改善，涨价正在转化为报表；三是<strong>情绪端定价充分、业绩端仍可续</strong>——澳弘 9 天 7 板属情绪龙头，但沪电/深南中大盘涨幅温和，板块处于「小票发酵、中军未加速」阶段。<strong>隐藏面</strong>：建滔累计涨幅超 100% 意味着部分品种已从「修复」进入「高位」，若下游顺价失败或 AI 需求证伪，情绪票回撤风险大（澳弘已发风险提示：泰国基地尚处认证爬坡，短期不影响业绩）；连板高度受限（当日最高 4 板）显示情绪周期接近中后段。<br>① <strong>分水岭时点</strong>：CCL 下一轮调价函（建滔/南亚）与澳弘断板后的承接。<br>② <strong>传导的关键约束</strong>：中大盘（沪电/深南）能否接力补涨——若中军加速则行情升级，若仅小票轮动则接近尾声。<br>③ <strong>待验证的核心变量</strong>：Q3 业绩兑现（涨价利润弹性）与 AI 服务器订单持续性。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>宏瑞兴科 CCL +10%、建滔年内 7 提</li><li>中国巨石电子布 +15/20%、斗山 9700 亿韩元扩产</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">强</span><ul><li>9/23 PCB 涨停 7 家、主力净流入 4.14 亿</li><li>铜箔/玻纤布/CCL/PCB 全链条传导</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">已现拐点</span><ul><li>深南中报营收 +46%、净利 +65.55%</li><li>二三线盈利显著改善（招商调研）</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">情绪充分·业绩待续</span><ul><li>澳弘 9 天 7 板，沪电/深南涨幅温和</li><li>部分定价：情绪端已充分、业绩端在路上</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响强、业绩已现拐点、股价情绪端定价充分——涨价链真实且有报表支撑，是本轮 AI 硬件最扎实的主线之一。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>65%</strong>：涨价环、情绪环、业绩环均闭合，持续性环（AI 需求+顺价）待验证。</li><li><strong>边界要切开</strong>：第一梯队是<strong>AI PCB 中军</strong>（沪电股份、深南电路——业绩验证+机柜级需求）；第二梯队是<strong>上游材料</strong>（生益科技——CCL 龙头直接受益涨价；中国巨石——电子布）；第三梯队是<strong>情绪弹性</strong>（澳弘电子、依顿电子、中一科技、江南新材——连板/20cm 弹性，风险大）。</li><li><strong>主线联动</strong>：与 agent-cpu-rerating（9/22，Meta Muse+海光）、intel-cpu-price-hike（9/9，CPU 涨价）、glass-core-substrate（9/23，玻璃基板）同属 AI 算力硬件链——本档是「PCB 全链涨价」段。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·AI PCB 中军与 CCL 龙头 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>沪电股份</b><span class=\"code\">002463</span><span class=\"tag\">AI服务器PCB龙头</span><span class=\"cap\">9/23 +2.37% 主力净流入 9.53 亿</span></div>\n    <div class=\"logic\">机柜级AI PCB</div>\n    <div class=\"detail\">AI 服务器/交换机 PCB 核心供应商，主力资金净流入居全板块第一（9.53 亿），涨价+需求双逻辑最受益的中军。</div>\n    <div class=\"risk\">⚠️ 涨幅温和，需放量确认加速</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>深南电路</b><span class=\"code\">002916</span><span class=\"tag\">PCB+载板</span><span class=\"cap\">9/23 +3.69% 中报营收 +46.33%</span></div>\n    <div class=\"logic\">业绩验证龙头</div>\n    <div class=\"detail\">上半年营收 152.96 亿 +46.33%、归母净利 22.51 亿 +65.55%，PCB+封装载板双布局，涨价直接兑现到报表。</div>\n    <div class=\"risk\">⚠️ 机构预期已高，超预期幅度决定空间</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>生益科技</b><span class=\"code\">600183</span><span class=\"tag\">覆铜板龙头</span><span class=\"cap\">9/23 随板块</span></div>\n    <div class=\"logic\">CCL直接受益</div>\n    <div class=\"detail\">国内覆铜板龙头，建滔/宏瑞兴科涨价潮的直接受益方，CCL 涨价幅度直接放大其利润弹性。</div>\n    <div class=\"risk\">⚠️ 覆铜板涨幅已大，高位追涨风险</div>\n  </div><div class=\"card\">\n    <div class=\"row\"><b>超声电子</b><span class=\"code\">000823</span><span class=\"tag\">PCB+液晶</span><span class=\"cap\">9/23 +7.85% 主力净流入 4.46 亿</span></div>\n    <div class=\"logic\">PCB补涨+铜箔概念</div>\n    <div class=\"detail\">PCB+覆铜板+锂电铜箔多元布局，9/23 龙虎榜主力净流入 4.46 亿，二三线补涨弹性代表。</div>\n    <div class=\"risk\">⚠️ 概念多元，PCB 纯度偏低</div>\n  </div></div><div class=\"t\">🧬 观察·情绪弹性 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>澳弘电子</b><span class=\"code\">605058</span><span class=\"tag\">情绪龙头</span><span class=\"cap\">9/23 涨停 58.60 元 9天7板</span></div>\n    <div class=\"logic\">PCB+HDI+AI服务器电源</div>\n    <div class=\"detail\">PCB+HDI 板+AI 服务器电源题材，9 天 7 板续创历史新高；已发风险提示：泰国基地尚处认证爬坡、短期不影响业绩。</div>\n    <div class=\"risk\">⚠️ 纯情绪票，断板回撤风险极大</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>依顿电子</b><span class=\"code\">603328</span><span class=\"tag\">PCB补涨</span><span class=\"cap\">9/23 涨停 15.20 元 创历史新高</span></div>\n    <div class=\"logic\">PCB制造</div>\n    <div class=\"detail\">PCB 制造企业，9/23 涨停并创历史新高，主力净流入 2.25 亿（流入率 23.12%），涨价传导下业绩弹性待兑现。</div>\n    <div class=\"risk\">⚠️ 补涨属性，持续性看板块温度</div>\n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">不定期</div><div class=\"wh\">CCL 下一轮调价函（建滔/南亚/宏瑞兴科）</div><div class=\"wy\">涨价链强度的直接刻度</div></div><div class=\"tkc\"><div class=\"w\">每日</div><div class=\"wh\">澳弘电子断板后的承接（中大盘是否接力）</div><div class=\"wy\">「情绪尾声 vs 中军加速」分水岭</div></div><div class=\"tkc\"><div class=\"w\">中报后</div><div class=\"wh\">Q3 业绩预告（涨价利润弹性兑现）</div><div class=\"wy\">业绩环能否续接情绪环</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">AI 服务器/机柜级 PCB 订单与 ABF 基板景气</div><div class=\"wy\">需求端真实性验证</div></div></div>\n\n    <div class=\"src\">数据来源：财联社 9/23 焦点复盘（宏瑞兴科 CCL +10%、澳弘 9 天 7 板、中一科技/江南新材涨停）· 证券时报 9/23（PCB 概念 +1.39%、主力净流入 4.14 亿、沪电 9.53 亿/超声 4.46 亿/铜冠铜箔 4.43 亿、深南中报 +46.33%/+65.55%）· 新浪财经 9/23（建滔年内 7 次提价、累计超 100%、斗山 9700 亿韩元扩产、四会富仕/兴森/深南跟涨）· 同花顺 9/23（依顿电子涨停创历史新高、元件板块走高）· 上海证券报 9/16（招商证券调研：PCB 涨价超预期、非 AI 领域明显、二三线盈利改善）· 抖音涨停天梯 9/23（PCB 7 家涨停为当日第一大题材）</div>\n    <footer>覆铜板涨价潮 PCB 涨停潮 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>"}, {"id": "glass-core-substrate", "title": "玻璃基板量产窗口 · 京东方定调 8000 亿采购", "date": "2026-09-23", "grade": "正式档", "pricing": "部分定价", "crate": "bolt", "search": "玻璃基板 玻璃基封装载板 京东方 陈炎顺 8000亿采购 未来一年敲定量产线投资 2027Q1量产决策 沃格光电 秒涨停 230亿 TGV 三峡新材 涨停 康宁 玻璃基板涨价15% 算力芯片先进封装 下一代封装材料 AI算力 彩虹股份 戈碧迦 天承科技", "card": "<a class=\"card-c\" href=\"#glass-core-substrate\" data-search=\"玻璃基板 玻璃基封装载板 京东方 陈炎顺 8000亿采购 未来一年敲定量产线投资 2027Q1量产决策 沃格光电 秒涨停 230亿 TGV 三峡新材 涨停 康宁 玻璃基板涨价15% 算力芯片先进封装 下一代封装材料 AI算力 彩虹股份 戈碧迦 天承科技\" data-grade=\"正式档\" data-pricing=\"部分定价\">\n  <div class=\"cTop\">\n    <span class=\"cdate\">2026-09-23</span>\n    <span class=\"crate bolt\">⚡ 产业化元年级 · 京东方定调一年内敲定量产线投资，玻璃基板概念涨幅第 2、沃格秒涨停 产业周期</span>\n  </div>\n  <div class=\"ctitle\">玻璃基板量产窗口 · 京东方定调 8000 亿采购</div>\n  <div class=\"csub\">京东方：未来五年采购超 8000 亿、研发超 800 亿，未来一年敲定玻璃基封装载板量产线投资（争取 2027Q1 达量产决策条件）· 9/23 玻璃基板概念 +2.16%（涨幅第 2）、沃格光电秒涨停 230 亿</div>\n  <div class=\"cpos\">京东方把「量产投资计划」排进时间表（一年内敲定、2027Q1 决策），玻璃基封装载板从验证走向量产窗口；康宁 9/11 宣布玻璃基板涨价 15%，涨价+量产双催化。</div>\n  <div class=\"cmeta\">\n    <span class=\"chip line\">产业周期</span>\n    <span class=\"chip pri\">部分定价</span>\n    <span class=\"chip\">标的 6</span>\n    <span class=\"nm\">沃格光电</span><span class=\"nm\">京东方A</span><span class=\"nm\">三峡新材</span><span class=\"nm\">彩虹股份</span><span class=\"nm\">帝尔激光</span>\n  </div>\n  <div class=\"cgo\">打开档案 →</div>\n</a>", "body": "  <header><div class=\"wrap\">\n  <div class=\"hrow\">\n    <div class=\"hleft\">\n      <a href=\"#/\" class=\"back\">← 档案库</a>\n      <div class=\"brand\"><b>题材</b>产业链研究<span>A股题材研究系统</span></div>\n    </div>\n    <div class=\"clock\">2026-09-23 <span class=\"live\">ARCHIVE</span></div>\n  </div></div></header>\n  <div class=\"wrap\">\n    <div class=\"datechip\"><a href=\"#/\" class=\"crumb\">档案库</a> / 产业周期 · 2026-09-23</div>\n    <h1>玻璃基板量产窗口 · 京东方定调 8000 亿采购</h1>\n    <div class=\"sub\">京东方：未来五年采购超 8000 亿、研发超 800 亿，未来一年敲定玻璃基封装载板量产线投资（争取 2027Q1 达量产决策条件）· 9/23 玻璃基板概念 +2.16%（涨幅第 2）、沃格光电秒涨停 230 亿</div>\n    <div class=\"badges\">\n      <span class=\"badge bolt\">⚡ 产业化元年级 · 京东方定调一年内敲定量产线投资 产业周期</span>\n      <span class=\"badge neutral\">产业周期</span>\n      <span class=\"badge neutral\">定价状态：部分定价</span>\n      <span class=\"badge neutral\">主线：AI算力与电力配套</span>\n    </div>\n    <div class=\"pos\" style=\"border-left-color:var(--acc)\"><b>主线联动档案：</b><span class=\"tag\" style=\"margin-right:4px\">agent-cpu-rerating</span><span class=\"tag\" style=\"margin-right:4px\">pcb-ccl-hike</span><span class=\"tag\" style=\"margin-right:4px\">power-semi-hike-onsemi</span></div>\n    <div class=\"posnote\">9/23 京东方全球创新伙伴大会：董事长陈炎顺宣布<strong>未来五年研发投入超 800 亿元、采购支出超 8000 亿元</strong>；<strong>未来一年内将敲定玻璃基钙钛矿器件与玻璃基封装载板两条量产线的投资计划</strong>，争取 2027 年上半年（尤其 Q1）达到量产投资决策条件。京东方玻璃基封装载板试验线 2026 上半年已全自动化通线（设计产能 1000 片/月、24 层基板产出、投入近 10 亿元），已把 CPU/GPU 芯片封装到载板放入服务器运行。叠加康宁 9/11 宣布显示玻璃基板全球涨价 15%，玻璃基板概念 9/23 大涨 +2.16%（概念涨幅第 2，44 股上涨），沃格光电秒涨停。</div>\n    <details class=\"more\"><summary>展开定价状态详版（240 字）</summary><div class=\"pos\"><b>定价状态备注：</b>催化为<strong>产业巨头时间表 + 材料涨价</strong>：京东方把「玻璃基封装载板量产线投资」写进一年内计划，从「验证」进入「量产窗口」；康宁显示玻璃基板涨价 15% 提供价格信号。盘面：<strong>已启动但分化</strong>——沃格光电秒涨停（230 亿市值、封单 22 万手）、三峡新材涨停，但京东方A/彩虹股份/帝尔激光涨幅温和，板块资金集中于沃格，属<strong>部分定价</strong>（龙头定价充分、产业链定价不足）。</div></details>\n\n    <h2><span class=\"p\">&gt;</span>核心事实</h2>\n    <div class=\"grid\"><div class=\"card fact\"><b class=\"k\">京东方定调</b><div class=\"v\">陈炎顺在 2026 京东方全球创新伙伴大会宣布：未来五年<strong>研发投入超 800 亿、采购支出超 8000 亿</strong>；<strong>未来一年内敲定玻璃基钙钛矿器件与玻璃基封装载板两条量产线的投资计划</strong>，争取 2027 上半年（尤其 Q1）达量产投资决策条件；发展光电融合新赛道。</div></div><div class=\"card fact\"><b class=\"k\">量产进度</b><div class=\"v\">京东方玻璃基封装载板试验线 2026 上半年<strong>全自动化设备通线</strong>：设计产能 1000 片/月、已产出超 100×100 毫米 24 层基板、投入近 10 亿元建设中试线，实现 <strong>TGV 打孔、镀铜、ABF 增层及后道全链拉通</strong>；已开始将 CPU/GPU 芯片封装到载板并放入服务器运行；与康宁签三年合作备忘。</div></div><div class=\"card fact warn\"><b class=\"k\">9/23 盘面验证</b><div class=\"v\"><strong>玻璃基板概念 +2.16%</strong>（概念涨幅第 2）、44 股上涨：<strong>沃格光电秒涨停</strong>（102.50 元 +10.00%、总市值 230 亿、封单超 22 万手、换手 21.94%、主力净流入 12.8 亿/流入率 25.65%）、<strong>三峡新材涨停</strong>（3.70 元 +10.12%、主力净流入 1.12 亿/48.03%）、戈碧迦 +9.88%、天承科技 +6.76%、利元亨 +6.60%、帝尔激光/彩虹股份/京东方A 跟涨。</div></div><div class=\"card fact\"><b class=\"k\">产业逻辑</b><div class=\"v\">玻璃基板是<strong>下一代先进封装材料</strong>：玻璃基封装载板（Glass Core Substrate）匹配大尺寸算力芯片先进封装，可改善翘曲、提升布线密度；AI 算力芯片升级（CPU/GPU）驱动载板材料从 ABF 向玻璃基演进，京东方为国产平台型龙头，沃格光电/云天半导体攻克 TGV 深孔、RDL 布线等核心工艺。</div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>主线更新（多段催化时间线）</h2>\n    <div class=\"updates\"><div class=\"u\"><div class=\"w\">2026-06</div><div><div class=\"x\">京东方中试线全自动化通线、1000 片/月；6/12 上证报：玻璃基板赛道「量产前夜」；证券时报：A 股多家公司坦言量产收入尚需时日。</div><div class=\"y\">为什么：产业进入验证→量产的过渡期。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-11</div><div><div class=\"x\">康宁宣布全球范围内对日元计价显示玻璃基板产品实施 15% 涨价。</div><div class=\"y\">为什么：玻璃涨价信号出现，产业链价格端启动。</div></div></div><div class=\"u\"><div class=\"w\">2026-09-23</div><div><div class=\"x\">京东方全球创新伙伴大会：未来一年敲定玻璃基封装载板量产线投资、争取 2027Q1 达量产决策条件；玻璃基板概念 +2.16%、沃格秒涨停。</div><div class=\"y\">为什么：本档案成立点——巨头把量产投资写进时间表，板块获得明确催化。</div></div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>逻辑推演</h2>\n    <div class=\"verdict\">这是「巨头定调→量产窗口→材料涨价」的产业趋势题材，<strong>三个要害</strong>：一是<strong>时间表是硬催化</strong>——京东方把「一年内敲定量产线投资、2027Q1 决策」写进公开大会，从「概念验证」进入「量产窗口」，这是玻璃基板板块从题材炒作转向产业跟踪的分水岭；8000 亿采购+800 亿研发给出国产供应链空间锚；二是<strong>技术已验证、收入未验证</strong>——京东方 24 层基板全链跑通、CPU/GPU 封装上服务器运行，但多家公司坦言「量产收入尚需时日」，沃格光电 13 天 7 板后自揭家底（TGV 小批量供货、泛半导体业务仍在培育）——量产到收入仍有距离；三是<strong>盘面已启动但只定价了龙头</strong>——沃格秒涨停（230 亿）、三峡新材涨停，但京东方/彩虹/帝尔涨幅温和，资金集中度极高。<strong>隐藏面</strong>：量产决策还需「客户给量+良品率」两个条件（陈炎顺原话），若 2027Q1 决策不及预期或客户验证延迟，预期差回撤风险大；沃格 21.94% 换手+230 亿市值秒涨停，情绪溢价已高。<br>① <strong>分水岭时点</strong>：量产线投资计划的正式敲定（一年内）；2027Q1 量产决策。<br>② <strong>传导的关键约束</strong>：良品率与客户订单（载板需与真实 CPU/GPU Bonding 跑通）。<br>③ <strong>待验证的核心变量</strong>：京东方量产线投资金额/产能规划；沃格光电等 TGV 厂商订单落地。</div>\n\n    <h2><span class=\"p\">&gt;</span>产业链逻辑链条</h2>\n    <div class=\"rings\"><div class=\"ring\"><span class=\"k\">变化</span><span class=\"vt\">实</span><ul><li>京东方一年内敲定量产线投资、2027Q1 决策</li><li>康宁玻璃基板涨价 15%</li></ul></div><div class=\"ring\"><span class=\"k\">影响</span><span class=\"vt\">中强</span><ul><li>9/23 概念 +2.16%（涨幅第 2）、44 股上涨</li><li>沃格秒涨停、三峡新材涨停</li></ul></div><div class=\"ring\"><span class=\"k\">业绩</span><span class=\"vt\">量产前夜</span><ul><li>24 层基板已产出、CPU/GPU 已上服务器</li><li>量产收入尚需时日（多家公司口径）</li></ul></div><div class=\"ring\"><span class=\"k\">股价</span><span class=\"vt\">龙头定价充分</span><ul><li>沃格 230 亿秒涨停、换手 21.94%</li><li>京东方/彩虹/帝尔涨幅温和</li></ul></div></div>\n    <div class=\"sum\">▸ 变化实、影响中强、业绩量产前夜、股价仅龙头定价——时间表是硬催化，但量产到收入仍需跟踪，属于「产业趋势早期」。</div>\n    <ul class=\"assess\"><li>闭合度 <strong>50%</strong>：催化环（时间表）与情绪环闭合，业绩环（量产收入）与持续性环（良品率/订单）未闭合。</li><li><strong>边界要切开</strong>：第一梯队是<strong>平台型+龙头</strong>（京东方A——量产决策主体、产业链核心；沃格光电——TGV 工艺龙头、情绪弹性大）；第二梯队是<strong>玻璃材料/设备</strong>（三峡新材——玻璃基材；彩虹股份——玻璃基板；帝尔激光——激光加工设备）；第三梯队是<strong>验证期品种</strong>（戈碧迦、天承科技、利元亨等，弹性高、收入更远）。</li><li><strong>主线联动</strong>：与 agent-cpu-rerating（9/22，CPU 重估）、pcb-ccl-hike（9/23，PCB 涨价）同属 AI 算力硬件链——本档是「下一代封装材料」段。</li></ul>\n\n    <h2><span class=\"p\">&gt;</span>环节 × 标的 × 映射逻辑</h2>\n    <div class=\"tier\"><div class=\"t\">🔥 主攻·平台型与工艺龙头 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>沃格光电</b><span class=\"code\">603773</span><span class=\"tag\">TGV玻璃基板龙头</span><span class=\"cap\">9/23 涨停 102.50 元 总市值 230 亿</span></div>\n    <div class=\"logic\">TGV深孔+先进封装</div>\n    <div class=\"detail\">玻璃基板+先进封装+算力硬件，TGV 产线已建成并小批量供货；9/23 秒涨停（封单 22 万手、主力净流入 12.8 亿），板块情绪龙头。</div>\n    <div class=\"risk\">⚠️ 换手 21.94%，情绪溢价高、回撤风险大</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>京东方A</b><span class=\"code\">000725</span><span class=\"tag\">玻璃基封装载板平台</span><span class=\"cap\">9/23 跟涨</span></div>\n    <div class=\"logic\">量产决策主体</div>\n    <div class=\"detail\">国产玻璃基封装载板进度领先：试验线全自动化通线、24 层基板、与康宁三年合作；未来一年敲定量产线投资——产业链的「总开关」。</div>\n    <div class=\"risk\">⚠️ 面板主业周期压制，玻璃基收入尚远</div>\n  </div></div><div class=\"t\">🧬 观察·材料与设备 <span style=\"font-size:12px;color:var(--dim);font-weight:400;margin-left:8px\">· 产业周期</span></div><div class=\"cols\">\n  <div class=\"card\">\n    <div class=\"row\"><b>三峡新材</b><span class=\"code\">600293</span><span class=\"tag\">玻璃基材</span><span class=\"cap\">9/23 涨停 3.70 元</span></div>\n    <div class=\"logic\">玻璃基材+地产链</div>\n    <div class=\"detail\">玻璃基材供应商，9/23 涨停（主力净流入 1.12 亿、流入率 48%），康宁涨价+玻璃基板题材双催化下的低价弹性票。</div>\n    <div class=\"risk\">⚠️ 传统玻璃业务占比高，题材纯度低</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>彩虹股份</b><span class=\"code\">600707</span><span class=\"tag\">玻璃基板</span><span class=\"cap\">9/23 跟涨</span></div>\n    <div class=\"logic\">显示玻璃+基板</div>\n    <div class=\"detail\">显示玻璃基板供应商，康宁涨价利好国产替代逻辑，玻璃基板概念跟涨品种。</div>\n    <div class=\"risk\">⚠️ 玻璃基载板业务占比待观察</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"row\"><b>帝尔激光</b><span class=\"code\">300776</span><span class=\"tag\">激光加工设备</span><span class=\"cap\">9/23 跟涨</span></div>\n    <div class=\"logic\">TGV激光加工设备</div>\n    <div class=\"detail\">激光加工设备商，玻璃基板 TGV 钻孔/切割工艺的设备受益方，9/23 随概念拉升。</div>\n    <div class=\"risk\">⚠️ 设备订单取决于量产线投资落地</div>\n  </div></div></div>\n\n    <h2><span class=\"p\">&gt;</span>跟踪日历</h2>\n    <div class=\"tk\"><div class=\"tkc\"><div class=\"w\">一年内</div><div class=\"wh\">京东方玻璃基封装载板/钙钛矿量产线投资计划敲定</div><div class=\"wy\">板块总开关，金额/产能超预期与否</div></div><div class=\"tkc\"><div class=\"w\">2027Q1</div><div class=\"wh\">京东方量产投资决策条件（客户给量+良品率）</div><div class=\"wy\">从「窗口」到「开工」的确认</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">沃格光电 TGV 订单/小批量放量公告</div><div class=\"wy\">龙头从题材到收入的刻度</div></div><div class=\"tkc\"><div class=\"w\">持续</div><div class=\"wh\">康宁涨价后国产玻璃基板跟涨/订单情况</div><div class=\"wy\">价格端景气验证</div></div></div>\n\n    <div class=\"src\">数据来源：21 世纪经济报道/新浪财经 9/23（京东方未来五年研发 800 亿、采购 8000 亿、未来一年敲定量产线投资、沃格光电涨停）· 电子工程专辑/财富号 9/23（京东方争取 2027Q1 达量产投资决策条件、24 层基板、1000 片/月、CPU/GPU 上服务器）· 和讯网 9/23（康宁 9/11 显示玻璃基板涨价 15%、玻璃基板概念 +2.16%、55 股上涨）· 上海证券报 9/23（玻璃基板概念活跃、沃格光电涨停、三峡新材涨停）· 证券时报 9/23（玻璃基板概念 +2.16%、沃格主力净流入 12.8 亿/三峡 1.12 亿）· 新浪财经 9/23（沃格秒涨停、封单 22 万手、230 亿市值）</div>\n    <footer>玻璃基板量产窗口 · 题材分析框架 · 客观产业研究，不含投资建议</footer>\n  </div>"}, {"id": "mlcc-ai-shortage", "title": "MLCC 高端缺货 · 华强北爆单复制存储行情", "date": "2026-09-23", "grade": "正式档", "pricing": "未定价", "crate": "bolt
